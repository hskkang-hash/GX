# 마이그레이션 정합 검사 (D-282 — 착시 ⑤ 환경)
#
# ★ 무엇이 있었나
#   `DetectionEvent` 표가 DB 에 **없는데 시험은 초록이었다.** `pytest --nomigrations` 가
#   마이그레이션을 건너뛰고 모델 선언에서 직접 테스트 DB 를 만들어 주기 때문이다.
#   시험은 모델을 봤고 운영은 표를 본다 — **재는 자리가 실물과 달랐다.**
#
#   D-282: "--nomigrations 는 속도용 보조 수단이지 정본 판정 환경이 아니다.
#           최소 1개 시험 경로는 실제 마이그레이션을 적용한 DB 에서 돌아야 한다."
#
# ★ 왜 이 잡은 조건부인가 — **조건부인 것과 초록인 것을 갈라 적는다**
#   이 검사는 Django 를 띄워야 하고, 그러려면 사내 private 패키지 `dj-core` 가 필요하다.
#   공개 러너에서는 import 자체가 안 된다. 그때 스크립트는 **exit 2(판정 불가)** 를 내고
#   exit 0 을 내지 않는다 — `verify_layers` 가 대상 0건일 때 self-test 로 넘어가는 것과
#   같은 이유다. **못 센 것을 통과로 세지 않는다.**
#
#   그래서 잡을 둘로 나눈다:
#     · gate      — 레지스트리에 닿는 러너에서만 돈다. 여기가 진짜 판정이다.
#     · not-green — 그 러너가 없을 때 **"판정하지 못했다"를 로그에 남긴다.**
#                   초록 체크표시 옆에 아무 말이 없으면 다음 사람은 검사된 줄 안다.

name: migration-check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: 모델 = 마이그레이션 = DB
    runs-on: ubuntu-latest
    # 사내 private 패키지(dj-core)와 DB 에 닿는 러너에서만 실행한다.
    # self-hosted 러너가 준비되면(W0-6) runs-on 을 그 라벨로 바꾼다.
    if: ${{ vars.GX_PRIVATE_REGISTRY_AVAILABLE == 'true' }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: database_guardianx
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r backend/requirements.txt
      - name: 마이그레이션 적용 (CI 전용 빈 DB)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: database_guardianx
          DB_USER: postgres
          DB_PASSWORD: admin
        run: python backend/manage.py migrate --noinput
      - name: 정합 판정 — 두 눈 모두 (D-282)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: database_guardianx
          DB_USER: postgres
          DB_PASSWORD: admin
        run: python scripts/verify_migrations.py --list

  not-green:
    name: 판정 불가를 초록으로 세지 않는다
    runs-on: ubuntu-latest
    if: ${{ vars.GX_PRIVATE_REGISTRY_AVAILABLE != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: 사실을 로그에 남긴다
        run: |
          echo "::warning title=migration-check 판정 불가::" \
               "dj-core 에 닿는 러너가 없어 마이그레이션 정합을 **판정하지 못했습니다** (D-282)."
          echo "이 잡이 초록인 것은 '정합함' 이 아니라 '재지 못했음' 입니다."
          echo "판정은 backend 컨테이너에서 사람이 돌립니다:"
          echo "    docker compose --profile tools up -d shell"
          echo "    docker compose exec shell python /repo/scripts/verify_migrations.py"
          echo "GX_PRIVATE_REGISTRY_AVAILABLE=true 인 러너가 붙으면 gate 잡이 자동으로 물립니다."
