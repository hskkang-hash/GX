# 시크릿 스캔 (W0-1a / D-001)
#
# 이 파일은 원격 저장소가 없는 상태에서 **선제 배치**된다.
# W0-6 에서 원격을 만들고 push 하면 그 시점부터 자동으로 동작한다.
# 그때까지의 실효 차단선은 로컬 pre-commit 훅이다.

name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 히스토리 전체를 본다 — 과거 커밋의 유출도 잡는다

      - name: gitleaks detect
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE: 조직 계정이면 W0-6 에서 secret 으로 주입한다

  key-divergence:
    name: GCS 서버/클라이언트 키 분리 (D-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_key_divergence.py

  env-placeholder:
    name: .env*.example 플레이스홀더 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env*.example 에 실값이 없는지 확인
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            bad=$(grep -nEi '^[A-Z0-9_]*(KEY|SECRET|PASSWORD|TOKEN|APIKEY|CREDENTIAL)[A-Z0-9_]*=["'"'"']?(CHANGE_ME|your-|your_|[[:space:]]*$)' -v "$f" \
                  | grep -nEi '^[0-9]+:[A-Z0-9_]*(KEY|SECRET|PASSWORD|TOKEN|APIKEY|CREDENTIAL)' || true)
            if [ -n "$bad" ]; then
              echo "::error file=$f::플레이스홀더가 아닌 값이 있습니다"
              echo "$bad"
              fail=1
            fi
          done < <(find . -name '.env*.example' -not -path './node_modules/*')
          exit $fail
