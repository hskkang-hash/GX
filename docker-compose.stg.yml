version: '3.8'

# 로그 회전·상한 — 운영 compose 와 **같은 값**이다 (OPS-07 · 2026-09-24).
# 근거·실측은 `docker-compose.yml` 머리말에 있다. 값을 두 벌로 적으면 어긋나므로
# 여기에는 근거를 복사하지 않는다(D-369) — 다만 스테이징에만 상한이 없으면
# 「운영은 안전한데 스테이징이 디스크를 채우는」 자리가 되므로 함께 건다.
x-gx-logging: &gx-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Nginx service as reverse proxy
  nginx-stg:
    build:
      context: ./nginx
    ports:
      - "3002:3002"  # Expose frontend port
      - "8002:8002"  # Expose backend port
    volumes:
      - ./backend/media:/media  # Mount media directory
    depends_on:
      - backend-stg
      - frontend-stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network

  # Frontend service for staging
  frontend-stg:
    build:
      context: ./frontend
      ssh:
        - default=${SSH_AUTH_SOCK}
    expose:
      - 3002
    volumes:
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
    env_file:
      - ./frontend/.env.stg
    depends_on:
      - backend-stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network


  # Backend service for staging
  backend-stg:
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ./backend:/app
      - ./sourcedemo_stg:/sourcedemo
      - ./backend/media:/app/media  # Add persistent volume for media files
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
    expose:
      - 8000
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis-stg
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env.stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network
    depends_on:
      - redis-stg

  # Celery service for staging
  celery-stg:
    build:
      context: ./backend
      dockerfile: Dockerfile
      ssh:
        - default=${SSH_AUTH_SOCK}
    command: python -m celery -A config worker -l INFO
    volumes:
      - ./backend:/app
      - ./sourcedemo_stg:/sourcedemo
      - ./backend/media:/app/media  # Add persistent volume for media files
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis-stg
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env.stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network
    depends_on:
      - redis-stg
      - backend-stg

  # Redis service for staging
  redis-stg:
    image: redis:latest
    ports:
      - "6380:6379"
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network

networks:
  guardianx-stg-network:
    driver: bridge
