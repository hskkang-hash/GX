version: '3.8'

# 로그 회전·상한 — 운영 compose 와 **같은 값**이다 (OPS-07 · 2026-09-24).
# 근거·실측은 `docker-compose.yml` 머리말에 있다. 값을 두 벌로 적으면 어긋나므로
# 여기에는 근거를 복사하지 않는다(D-369) — 다만 스테이징에만 상한이 없으면
# 「운영은 안전한데 스테이징이 디스크를 채우는」 자리가 되므로 함께 건다.
x-gx-logging: &gx-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Nginx service as reverse proxy
  nginx-stg:
    build:
      context: ./nginx
    ports:
      - "3002:3002"  # Expose frontend port
      - "8002:8002"  # Expose backend port
    volumes:
      - ./backend/media:/media  # Mount media directory
    depends_on:
      - backend-stg
      - frontend-stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network

  # Frontend service for staging
  frontend-stg:
    build:
      context: ./frontend
      ssh:
        - default=${SSH_AUTH_SOCK}
    expose:
      - 3002
    volumes:
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
    env_file:
      - ./frontend/.env.stg
    depends_on:
      - backend-stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network


  # Backend service for staging
  backend-stg:
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ./backend:/app
      - ./sourcedemo_stg:/sourcedemo
      - ./backend/media:/app/media  # Add persistent volume for media files
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
    expose:
      - 8000
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis-stg
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env.stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network
    depends_on:
      - redis-stg

  # Celery service for staging
  celery-stg:
    build:
      context: ./backend
      dockerfile: Dockerfile
      ssh:
        - default=${SSH_AUTH_SOCK}
    # 하드 상한·동시성의 사유는 `docker-compose.yml` 의 `celery` 서비스에 한 벌만
    # 적혀 있다(D-369). 요약: 소프트 상한만으로는 멈춘 태스크가 슬롯을 안 돌려준다.
    command: >
      python -m celery -A config worker -l INFO
      --concurrency=2 --time-limit=600 --soft-time-limit=300
    volumes:
      - ./backend:/app
      - ./sourcedemo_stg:/sourcedemo
      - ./backend/media:/app/media  # Add persistent volume for media files
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis-stg
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env.stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network
    depends_on:
      - redis-stg
      - backend-stg

  # celery **beat** for staging — 주기를 발화시키는 자리 (P-56 · 2026-09-05 · 차선 E)
  #
  # ★ **정확히 1대**다. 워커(`celery-stg`)는 늘릴 수 있고 beat 는 늘리면 안 된다 —
  #   2대면 모든 주기가 두 번씩 돈다. 사유·함정(첫 기동 즉시 발화 · 파기 항목 끄기)은
  #   `docker-compose.yml` 의 `beat` 서비스 머리말에 한 벌만 적혀 있다(D-369).
  #
  # ⚠ 스테이징에 이것을 세우는 사람이 반드시 먼저 볼 것: DatabaseScheduler 는 뜨는
  #   순간 `last_run_at` 이 빈 crontab 항목을 **전부 즉시 발화한다**. 스테이징 DB 에
  #   90일보다 오래된 감사 행이나 30일보다 오래된 영상이 있으면 **그 순간 지워진다.**
  #   세우기 **전에** 파기 항목 셋을 끈다(명령은 운영 compose 머리말에 있다).
  beat-stg:
    build:
      context: ./backend
      dockerfile: Dockerfile
      ssh:
        - default=${SSH_AUTH_SOCK}
    command: python -m celery -A config beat -l INFO
    volumes:
      - ./backend:/app
      - ./sourcedemo_stg:/sourcedemo
      - ~/.ssh:/root/.ssh:ro
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis-stg
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env.stg
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network
    depends_on:
      - redis-stg
      - backend-stg
      - celery-stg

  # Redis service for staging
  redis-stg:
    image: redis:latest
    ports:
      - "6380:6379"
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-stg-network

networks:
  guardianx-stg-network:
    driver: bridge
