version: '3.8'

services:
  # Frontend service
  frontend:
    build:
      context: ./frontend
      ssh:
        - default=${SSH_AUTH_SOCK}
    ports:
      # - "0.0.0.0:3002:80"
      - "0.0.0.0:3002:3002"
    volumes:
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - guardianx-network

  # Backend service
  backend:
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ./backend:/app
      - ./sourcedemo:/sourcedemo
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
      # ── 저장소 게이트용 읽기전용 마운트 (D-285 (4) · D-282) ────────────────
      # 컨테이너에는 `backend/` 만 `/app` 으로 들어와 있었다. 그래서
      # `tests/test_k1_event_kernel.py` 의 계층 검사가 `verify_layers.py` 를 찾지 못해
      # **skip 1** 로 남았다 — 사실대로 남긴 것이지만, 남겨 둘 이유는 없다.
      #
      # 저장소 수준 게이트(`verify_layers` · `verify_migrations` · `verify_tenant_scope`)는
      # 자기 위치에서 저장소 뿌리를 되짚어 `<root>/backend` 를 훑는다. 그래서 `/app` 하나로는
      # 부족하고 **뿌리 모양이 필요하다.** 읽기전용이므로 컨테이너가 저장소를 고칠 수 없다
      # (D-270 쓰기 안전 3원칙).
      - ./scripts:/repo/scripts:ro
      - ./backend:/repo/backend:ro
      # ★ 문서·증거도 읽을 수 있어야 한다 (2026-09-01). 시험 중에는 저장소 등재부
      #   (DA-05 sources.yaml · decisions.yaml)와 코드가 갈렸는지 대조하는 것이 있고,
      #   마운트가 없으면 그 시험은 **판정 불가로 skip 된다** — skip 은 통과가 아니다.
      - ./docs:/repo/docs:ro
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - guardianx-network
    depends_on:
      - redis

  # Celery service
  celery:
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    command: python -m celery -A config worker -l INFO
    volumes:
      - ./backend:/app
      - ./sourcedemo:/sourcedemo
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
      # ── 저장소 게이트용 읽기전용 마운트 (D-285 (4) · D-282) ────────────────
      # 컨테이너에는 `backend/` 만 `/app` 으로 들어와 있었다. 그래서
      # `tests/test_k1_event_kernel.py` 의 계층 검사가 `verify_layers.py` 를 찾지 못해
      # **skip 1** 로 남았다 — 사실대로 남긴 것이지만, 남겨 둘 이유는 없다.
      #
      # 저장소 수준 게이트(`verify_layers` · `verify_migrations` · `verify_tenant_scope`)는
      # 자기 위치에서 저장소 뿌리를 되짚어 `<root>/backend` 를 훑는다. 그래서 `/app` 하나로는
      # 부족하고 **뿌리 모양이 필요하다.** 읽기전용이므로 컨테이너가 저장소를 고칠 수 없다
      # (D-270 쓰기 안전 3원칙).
      - ./scripts:/repo/scripts:ro
      - ./backend:/repo/backend:ro
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - guardianx-network
    depends_on:
      - redis
      - backend

  # ───────────────────────────────────────────────────────────────────────────
  # 판정용 셸 — **자동 migrate 를 하지 않는다** (2026-08-29 사고 대응 · D-283 · D-270)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # ★ 왜 이 서비스가 따로 필요한가 — 절차가 재시작 한 번으로 우회됐다
  #
  #   이미지의 `ENTRYPOINT=/entrypoint.sh` 는 **무조건** `python manage.py migrate` 를 돈다.
  #   그래서 시험용 셸 컨테이너를 다시 만드는 것만으로 **마이그레이션 4건이 DB 에 적용됐다**
  #   (logger.0010 · surveillance.0030 · stream_monitors.0015 · 0016 —
  #    2026-08-27 13:28 UTC). D-283 이 요구한 선행 절차
  #    (① DDL 첨부 → ② 역방향 확인 → ③ 스냅샷) **전이었다.**
  #
  #   여기서 배운 것은 "조심하자"가 아니다. **사람의 기억에 맡긴 절차는 도구가 우회한다.**
  #   `docker run` 은 게이트가 볼 수 없는 자리이므로, 막을 수 있는 유일한 지점은
  #   **셸을 만드는 방법 자체를 여기에 못박는 것**이다. 손으로 `docker run` 하지 말 것.
  #
  #       docker compose --profile tools up -d shell
  #       docker compose exec shell python -m pytest tests -q --nomigrations
  #
  #   마이그레이션을 **적용할 때**는 이 셸이 아니라 사람이 D-283 절차를 밟는다:
  #       ① python manage.py sqlmigrate <app> <n>              # 실행될 DDL 을 먼저 본다
  #       ② python manage.py sqlmigrate --backwards <app> <n>  # 되돌릴 수 있는가
  #       ③ pg_dump -Fc  →  C:\GuardianX-vault\               # 스냅샷 (D-002)
  #       ④ python manage.py migrate <app> <n>                 # 그 다음에야 적용
  #       ⑤ python scripts/verify_migrations.py                # 두 눈 모두 green (D-282)
  shell:
    profiles: ["tools"]          # 기본 `up` 에 딸려 오지 않는다 — 부를 때만 선다
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    # ★ 이 두 줄이 이 서비스의 존재 이유다. entrypoint 를 비워 자동 migrate 를 끊는다.
    entrypoint: ["sleep"]
    command: ["infinity"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./sourcedemo:/sourcedemo
      - ./scripts:/repo/scripts:ro
      - ./backend:/repo/backend:ro
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - guardianx-network
    depends_on:
      - redis

  # ─────────────────────────────────────────────────────────────────────────
  # MinIO — 객체 저장소 (P-5)
  #
  # ★ 왜 이것이 「기반」인가. 이것이 없는 동안 `/api/media-data(/)` 두 자리가 **500** 이었고,
  #   그 500 을 화면은 「0 of 0」으로 그렸다 — 사용자에게는 **자료가 없는 것처럼** 보였다
  #   (D-378 · MEDIA_LIST_SHOWS_EMPTY_WHEN_STORAGE_DOWN). 게이트 `route-alive` 의
  #   유일한 빨강도 그 두 자리였다.
  #
  # ★ 판을 **digest 로** 못박는다 (D-387). `:latest` 는 lock 이 아니다 —
  #   내일 받으면 다른 물건이 오고, 그때 빨개지면 우리는 그 빨강을 「환경 탓」으로 읽는다.
  #   태그는 사람이 읽으라고 함께 적는다. **둘을 따로 고치면 lock 이 아니다.**
  #
  # ⚠ 자격증명은 **저장소에 없다.** 뿌리의 `.env`(gitignored)를 compose 가 자동으로 읽고,
  #   저장소에는 이름만 남는다(`.env.example` · D-204). `:?` 는 값이 없으면
  #   **조용히 기본값으로 서는 대신 그 자리에서 멈추라**는 뜻이다 — 기본 자격증명으로
  #   선 저장소는 열려 있는 저장소다.
  minio:
    # minio/minio:RELEASE.2025-09-07T16-13-09Z
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?뿌리 .env 에 MINIO_ROOT_USER 가 없다 (이름은 .env.example 참조)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?뿌리 .env 에 MINIO_ROOT_PASSWORD 가 없다 (8자 이상)}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # 콘솔
    # 저장소가 **떴다**와 **받는다**는 다른 사실이다 — 뒤엣것을 본다.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - guardianx-network

  # Redis service
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - guardianx-network

volumes:
  # 저장소의 자료는 컨테이너보다 오래 산다. 이름 붙인 볼륨이 아니면
  # `docker compose down` 한 번에 영상이 사라진다.
  minio-data:

networks:
  guardianx-network:
    driver: bridge
