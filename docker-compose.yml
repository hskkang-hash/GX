version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════
# 로그 회전·상한 — **무한 적재를 여기서 끊는다** (OPS-07 · 2026-09-24 · 차선 E)
# ═══════════════════════════════════════════════════════════════════════════
#
# 착수 전 실측 (`python scripts/ops_log_collectors.py`)
# ----------------------------------------------------
#   [실측 2026-09-24] 떠 있는 컨테이너 5개(gx-shell · postgres · redis · minio ·
#   gx-fe-build)가 전부 `json-file` 드라이버에 **`max-size`·`max-file` 둘 다 없다.**
#   도커는 `max-size` 가 없으면 **자르지 않는다** — 디스크가 찰 때까지 쌓인다.
#   파일 핸들러는 0개다(`settings.LOGGING` 에 FileHandler 없음). 보존 정책이 있는
#   수집기는 DB 감사 로그 하나뿐이다(90일 · beat `ops-audit-purge-daily` 03:10).
#
#   자라는 속도 [실측 · 총량 ÷ 가동 기간, 2026-09-02 기동 이후 약 3.4일]
#       postgres   1,235,022 바이트 / 3.4일 ≈ **363 KB/일**   ← 가장 시끄럽다
#       redis        171,206 바이트 / 3.4일 ≈  50 KB/일
#       minio          4,530 바이트 / 2.3일 ≈   2 KB/일
#       gx-shell·gx-fe-build           0 바이트 (stdout 으로 아무것도 안 낸다)
#
# ★ 값의 근거 — **[판정]이다. 인용이 아니다**
# -------------------------------------------
#   `max-size: 10m` × `max-file: 5` → 컨테이너당 상한 **50MB**.
#
#   ㉠ 가장 시끄러운 수집기(363 KB/일)에 대해 50MB 는 약 **140일** 치다. 즉 지금
#      부하에서는 사실상 아무것도 안 잘린다 — 상한은 **평시를 위한 것이 아니라
#      사고를 위한 것**이다. 무언가 초당 수천 줄을 토하기 시작한 그날 디스크를
#      지키는 값이고, 그날이 오기 전에는 아무 일도 하지 않는 것이 옳다.
#
#      ⛔ **㉠은 2026-09-05 에 뒤집혔다. 지우지 않고 남긴다** — 판정이 어떻게 틀렸는지가
#        다음 사람에게는 판정보다 값나간다. 위 문장은 **앞단이 없던 날의 실측** 위에
#        서 있었다. 턴 C 가 `gx-gunicorn-e`(접근로그 stdout)를 세운 뒤 다시 재니:
#            gx-gunicorn-e stdout   **10,274,859 바이트/시간** ≈ **247 MB/일** [실측 · 부하 중]
#            앞단 접근로그(파일)      2,122,482 바이트/시간 ≈  51 MB/일 [실측 · 부하 중]
#            postgres                363 KB/일 [실측 2026-09-24]
#        즉 이 형상에서 50MB 는 「약 140일」이 아니라 **약 5시간** 치다. 「사고를 위한
#        값이고 평시에는 아무 일도 안 한다」는 판정은 **평시에 초당 수천 줄을 토하는
#        수집기가 없을 때만** 참이었고, 웹서버 접근로그가 바로 그런 수집기다.
#        → 그러므로 이 상한은 **사고 조사에 답하지 못한다**: 어제 로그를 찾으면 없다.
#          그것이 ㉢(정본은 stdout 이 아니다)을 **더 중요하게** 만든다.
#   ㉡ 그런데도 **「N일 보존」이라고 적지 않는다.** `json-file` 회전은 **크기 기반**이다.
#      조용한 달에는 더 오래 남고 시끄러운 날에는 몇 시간 만에 밀린다. 「50MB 상한」은
#      약속할 수 있고 「140일 보존」은 약속할 수 없다 — 뒤엣것을 적으면 사고 조사에서
#      「있어야 할 로그가 없다」가 된다.
#   ㉢ 그래서 **정본은 컨테이너 stdout 이 아니다.** 감사에 답하는 것은 DB 감사 로그
#      (`logger_auditlogs` · 90일 · purge beat 실재)이고, 컨테이너 stdout 은
#      **운영 디버깅용 단기 버퍼**다. 이 판정이 없으면 상한을 거는 것이 곧
#      「증거를 지우는 일」이 된다.
#
# ⚠ **선언은 여기 섰고, 적용은 다음 재기동이다.** 도커의 `LogConfig` 는 컨테이너를
#   **만들 때** 굳는다 — 이미 떠 있는 컨테이너에는 이 선언이 닿지 않는다. 그리고
#   지금 그 컨테이너들 위에서 다른 차선이 일하고 있으므로 재기동하지 않는다.
#   `scripts/ops_log_collectors.py` 가 **선언(여기)** 과 **적용(실행 중 컨테이너)** 을
#   따로 재고, 둘이 갈린 자리를 「선언은 섰고 적용은 다음 재기동」으로 찍는다 —
#   「고쳤다」와 「고친 것이 돌고 있다」는 다른 사실이다(D-301).
#
# ⚠ 앵커 하나를 모든 서비스가 가리킨다. 값을 두 벌로 적으면 반드시 어긋나고,
#   어긋난 뒤에는 어느 쪽이 정본인지 아무도 모른다(D-369).
#
# ═══ 2026-09-05 · 턴 D 가 더 잰 것 — **상한이 안 닿는 자리 둘** ═════════════
#
# ㉠ **컨테이너 안에서 파일로 쌓는 로그에는 이 선언이 닿지 않는다.**
#    [실측] 앞단 `gx-nginx-e` 는 `access_log /var/log/nginx/gx-front.access.log` 로
#    **파일에** 적는다 — stdout 이 아니므로 `json-file` 회전과 무관하고,
#    `nginx:alpine` 에는 logrotate 도 없다. 그 파일은 **한 시간에 4MB 가까이** 자란다
#    (부하를 걸 때). 즉 이 저장소에서 가장 시끄러운 수집기는 postgres(363 KB/일)가
#    아니라 **앞단 접근로그**이고, 그것이 유일하게 상한 밖이었다.
#    → **컨테이너에 `--log-opt` 를 걸었다 ≠ 그 컨테이너의 로그에 상한이 걸렸다.**
#      고치는 자리는 compose 가 아니라 `nginx/gx-front.conf` 의 `access_log` 다
#      (stdout 으로 보내면 이 앵커 안으로 들어온다).
#
# ㉡ **정본(DB 감사 로그 90일)에도 조건이 붙는다 — 지우는 자리가 실제로 돌 때만.**
#    [실측 2026-09-05] 이 기계에 celery 워커가 **0개**다(브로커 redis 는 살아 있다 ·
#    `inspect.ping() → None` · 어느 컨테이너에도 celery 프로세스가 없다).
#    beat 일정 `ops-audit-purge-daily`(03:10)는 `config/celery.py` 에 **적혀 있고**,
#    그것을 실행할 워커가 없으므로 **이 환경에서는 아무것도 안 지워진다.**
#    「보존 90일」은 선언이고, 선언은 삭제가 아니다 — `ops_log_collectors.py` 가
#    이제 브로커 도달성과 워커 유무를 갈라서 재고 이 자리를 빨강으로 찍는다.
x-gx-logging: &gx-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Frontend service
  frontend:
    build:
      context: ./frontend
      ssh:
        - default=${SSH_AUTH_SOCK}
    ports:
      # - "0.0.0.0:3002:80"
      - "0.0.0.0:3002:3002"
    volumes:
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
    depends_on:
      - backend
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network

  # Backend service
  backend:
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ./backend:/app
      - ./sourcedemo:/sourcedemo
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
      # ── 저장소 게이트용 읽기전용 마운트 (D-285 (4) · D-282) ────────────────
      # 컨테이너에는 `backend/` 만 `/app` 으로 들어와 있었다. 그래서
      # `tests/test_k1_event_kernel.py` 의 계층 검사가 `verify_layers.py` 를 찾지 못해
      # **skip 1** 로 남았다 — 사실대로 남긴 것이지만, 남겨 둘 이유는 없다.
      #
      # 저장소 수준 게이트(`verify_layers` · `verify_migrations` · `verify_tenant_scope`)는
      # 자기 위치에서 저장소 뿌리를 되짚어 `<root>/backend` 를 훑는다. 그래서 `/app` 하나로는
      # 부족하고 **뿌리 모양이 필요하다.** 읽기전용이므로 컨테이너가 저장소를 고칠 수 없다
      # (D-270 쓰기 안전 3원칙).
      - ./scripts:/repo/scripts:ro
      - ./backend:/repo/backend:ro
      # ★ 문서·증거도 읽을 수 있어야 한다 (2026-09-01). 시험 중에는 저장소 등재부
      #   (DA-05 sources.yaml · decisions.yaml)와 코드가 갈렸는지 대조하는 것이 있고,
      #   마운트가 없으면 그 시험은 **판정 불가로 skip 된다** — skip 은 통과가 아니다.
      - ./docs:/repo/docs:ro
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # ── OPS-23 앱 DB 역할 분리 — **배선 자리는 여기다. 아직 안 붙였다** ─────
      #   (세종 P-178 → P-187 · 2026-09-19 턴 W · 차선 U56 · 전환은 **창 2 · 대표 결정**)
      #
      # ★ 지금 이 컨테이너는 `env_file: ./backend/.env` 의 `DB_USER=postgres` 로 돈다 —
      #   즉 **앱이 superuser 다** [실측 2026-09-19: rolsuper=t · rolcreatedb=t].
      # ★ `environment:` 는 `env_file` 을 **덮는다.** 그래서 `backend/.env` 를 한 줄도
      #   고치지 않고 **서비스마다** 역할을 가를 수 있다. 붙일 두 줄은 이것이다:
      #     - DB_USER=${DB_APP_USER:?DB_APP_USER 가 없다 — 뿌리 .env 를 보라}
      #     - DB_PASSWORD=${DB_APP_PASSWORD:?DB_APP_PASSWORD 가 없다 — 뿌리 .env 를 보라}
      #   (celery·beat 도 같은 두 줄 · shell 은 `DB_MIGRATE_*` — 그 컨테이너만
      #    마이그레이션·시험 DB 를 만든다.)
      # ⚠ **지금 붙이면 안 된다.** `:?` 는 이름이 없으면 compose 를 **멈추게 한다** —
      #   뿌리 `.env` 에 값 넷이 서기 전에 붙이면 이 저장소의 모든 `docker compose`
      #   명령이 그 자리에서 죽는다. 값은 **대표 결정**이다(`.env.example` 에 이름만 있다).
      # ⚠ 기본값을 `postgres` 로 두지 않는다 — 「분리했다」고 적힌 채 superuser 로 도는
      #   날이 오고, 그 상태는 지금보다 **나쁘다**(사람이 믿게 되므로).
      # ⚠ `environment:` 를 더하면 **컨테이너를 다시 만들어야** 적용된다(restart 로는
      #   안 된다). 절차: docs/agent/RUNBOOK_재생성창.md · 근거·SQL·영향 7가지:
      #   docs/agent/evidence/P-178/dry_run.md · p178_app_db_roles.sql (**안 돌렸다**)
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network
    depends_on:
      - redis

  # Celery service
  celery:
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    # ★ `--time-limit` 가 왜 붙었나 — **소프트 상한만으로는 슬롯이 안 돌아온다**
    #   (OPS-07/P-56 · 2026-09-05 · 차선 E · [실측])
    #
    #   [실측 17:55~18:05] 워커를 세우자마자 `core.logger.tasks.task_add_log` 두 건이
    #   **300초 소프트 상한을 넘긴 채 끝나지 않았다.** 동시성이 2 였으므로 **두 건이
    #   워커 전체를 멈춰 세웠다**: 90초 동안 처리량 **0건**, 그 사이 큐는 **+134건**
    #   (약 2.2건/초)로 자랐다. postgres 에는 대기 중인 질의가 **0개**였다 —
    #   DB 잠금이 아니다.
    #
    #   원인의 모양은 이렇다: 소프트 상한은 태스크 **안에서 예외를 올릴 뿐**이고,
    #   그 예외를 넓은 `except` 가 삼키면 태스크는 영원히 산다. 하드 상한이 없으면
    #   그 슬롯은 **영영 안 돌아온다.** 그리고 `task_acks_late=True` 이므로 워커를
    #   재시작하면 같은 메시지가 다시 배달돼 **같은 자리에서 또 멈춘다**(독약 메시지).
    #
    #   ⚠ 이것이 운영에서 뜻하는 것: 감사 쓰기 몇 건이 걸리면 **모든 주기가 함께
    #     멈춘다.** 파기도, 08:00 생존 알림도, 일일 앵커도 같은 워커를 쓴다. 즉
    #     「워커를 세웠다」가 「주기가 돈다」를 보장하지 않는다 — 이 절이 계속
    #     같은 말을 하는 이유다.
    #
    #   여기서 고치는 것은 **우리 층에서 고칠 수 있는 것 하나**다: 하드 상한을 준다.
    #   600초가 지나면 도커가 아니라 celery 가 자식 프로세스를 죽이고 슬롯을 회수한다.
    #   이것은 원인 치료가 아니라 **지혈**이다 — `task_add_log` 가 왜 멈추는지는
    #   dj-core 쪽 물음이고 그 자리는 우리 것이 아니다. 그 사실을 여기 적어 둔다.
    #
    # ── 동시성은 **2 로 되돌렸다** (같은 날 · 되돌린 사유를 여기 남긴다 · 불변 3) ──
    #
    #   한 건이 걸려도 나머지가 돌게 하려고 2 → 4 로 올렸다. **재 보니 나빠졌다.**
    #       동시성 2 [실측]  162건 중 실패 69 — 대부분 `IntegrityError`
    #                       (`group_id=1` 이 `user_usergroup` 에 없다 = 자료 문제)
    #       동시성 4 [실측]   43건 중 실패 25 — 종류가 **바뀌었다**:
    #                       `DatabaseError: PGRES_TUPLES_OK and no message from libpq` 9,
    #                       `ProgrammingError: no results to fetch` 3,
    #                       `OperationalError: lost synchronization with server` 등
    #   뒤엣것은 자료 문제가 아니라 **연결 하나를 여럿이 같이 쓰는 모양**이다
    #   (prefork 자식들이 부모의 psycopg 연결을 물려받았을 때 나는 증상). 동시성을
    #   올릴수록 잦아진다. 표본이 작지만(43건) **방향이 분명하고, 되돌리는 쪽이 원래
    #   값이다** — 확신 없는 변경은 원래 값으로 돌린다.
    #
    #   ★ 남긴 것은 `--time-limit` 하나다. 그것은 **잰 것을 고친 것**이고
    #     (멈춘 슬롯이 실제로 돌아왔다: 큐 5 → 0), 동시성은 **재 보니 아니었던 것**이다.
    #     둘을 한 줄에 넣었더라도 판정은 따로 해야 한다.
    #
    #   다시 올리려면 먼저 `worker_process_init` 의 연결 처리를 고쳐라
    #   (`config/celery.py` 에 자리는 있다). 그 전에는 올려도 실패만 는다.
    command: >
      python -m celery -A config worker -l INFO
      --concurrency=2 --time-limit=600 --soft-time-limit=300
    volumes:
      # ── 백업 목적지 `/backup` (P-67 · 2026-09-06 · 차선 E) ─────────────────
      #
      # ★ `settings.OPS_BACKUP_DIR` 이 `/backup` 이라고 **선언**해도, 그 경로가
      #   볼륨으로 안 붙어 있으면 `mkdir` 이 컨테이너 루트에 평범한 폴더를 만들고
      #   백업이 거기 떨어진다 — 컨테이너를 다시 만드는 순간 사라지고, 그 전까지
      #   **「파일이 생겼다」가 초록으로 보인다.** 그것이 이 절의 착시다.
      #   `common/ops_tasks.py::backup_dir_is_separate_volume()` 가 `st_dev` 로 그것을
      #   재고, 안 붙어 있으면 백업을 **돌리지 않고** UNKNOWN 을 낸다.
      #
      # ⚠ **선언은 여기 섰고, 적용은 다음 재기동이다.** 도커의 마운트는 컨테이너를
      #   **만들 때** 굳는다. 이 기계에서 도는 `gx-celery-e`·`gx-beat-e`·`gx-shell` 은
      #   compose 밖에서 손으로 만든 것이라 이 줄이 닿지 않는다
      #   [실측 2026-09-06 · `ops_backup_beat` → UNKNOWN · separate_volume=false].
      #   재기동은 다른 차선 넷이 이 컨테이너들 위에서 일하는 동안 하지 않는다 —
      #   조율자가 재기동 창을 열 때 붙는다.
      - gx_backup_vault_e:/backup
      - ./backend:/app
      - ./sourcedemo:/sourcedemo
      - ~/.ssh:/root/.ssh:ro  # Mounting host SSH directory
      # ── 저장소 게이트용 읽기전용 마운트 (D-285 (4) · D-282) ────────────────
      # 컨테이너에는 `backend/` 만 `/app` 으로 들어와 있었다. 그래서
      # `tests/test_k1_event_kernel.py` 의 계층 검사가 `verify_layers.py` 를 찾지 못해
      # **skip 1** 로 남았다 — 사실대로 남긴 것이지만, 남겨 둘 이유는 없다.
      #
      # 저장소 수준 게이트(`verify_layers` · `verify_migrations` · `verify_tenant_scope`)는
      # 자기 위치에서 저장소 뿌리를 되짚어 `<root>/backend` 를 훑는다. 그래서 `/app` 하나로는
      # 부족하고 **뿌리 모양이 필요하다.** 읽기전용이므로 컨테이너가 저장소를 고칠 수 없다
      # (D-270 쓰기 안전 3원칙).
      - ./scripts:/repo/scripts:ro
      - ./backend:/repo/backend:ro
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # ── 백업 목적지의 **이름** (P-102 · 2026-09-07 · 턴 K · 차선 E) ──────────
      #
      # ★ `backend/config/settings.py` 는 `env.str("OPS_BACKUP_DIR", default="")`
      #   으로 읽고, `backend/config/retention_seed.py` 는 `/backup` 을 기대한다.
      #   그런데 그 이름이 **어디에도 선언돼 있지 않았다** — 그래서 값은 빈 문자열이었고,
      #   주기 백업(`common/ops_tasks.py::ops_backup_beat`)은 두 벌(정확히 24시간 간격)
      #   돌고도 **회수증을 한 장도 남기지 못했다** [실측 2026-09-07].
      #   경로는 비밀이 아니다 — 그래서 여기 기본값을 적는다(`.env.example` 에 이름도 있다).
      #
      # ⚠ **선언과 적용은 다른 사실이다**(D-301). 이 줄은 컨테이너를 **만들 때** 굳는다.
      #   지금 도는 `gx-celery-e`·`gx-beat-e`·`gx-shell` 은 compose 밖에서 손으로 만든
      #   것이라 이 줄이 아직 닿지 않았다. 확인: `docker exec <c> printenv OPS_BACKUP_DIR`.
      #   그리고 `/backup` 볼륨 자체도 같은 재생성 창에서만 붙는다(위 volumes 절 참조).
      - OPS_BACKUP_DIR=${OPS_BACKUP_DIR:-/backup}
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network
    depends_on:
      - redis
      - backend

  # ───────────────────────────────────────────────────────────────────────────
  # celery **beat** — 주기를 실제로 발화시키는 자리 (P-56 · 2026-09-05 · 차선 E)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # ★ 왜 이 서비스가 없으면 안 되는가 — **적어 둔 주기는 주기가 아니다**
  #
  #   `backend/config/celery.py` 의 `beat_schedule` 에는 13개 항목이 적혀 있다.
  #   그 표를 읽어 「돈다」고 답하는 코드도 있다 —
  #   `apps/dsm/retention.py::sweep_is_scheduled()` 가 beat 표에 이름이 있으면 참을
  #   내고, 그 참이 안내판의 `policy()['enforced']` 로 나간다.
  #
  #   [실측 2026-09-05 17:30] **이 기계에 celery 워커는 0개였다**(브로커 redis 는
  #   살아 있었다). 그런데도 `sweep_is_scheduled()` 는 참이었다 — 그 함수는 표만
  #   읽고 **발화하는 자리가 있는지는 묻지 않기 때문이다.** 즉 「보관 기간이 지난
  #   영상은 자동으로 지워집니다」가 **워커 0개인 상태에서 초록으로** 나가고 있었다.
  #   위 서비스(`celery` 워커)와 이 서비스(beat)가 함께 서야 그 문장이 참이 된다.
  #
  # ⚠ **이 서비스를 처음 세우는 순간 무슨 일이 일어나는가 — 실측으로 적는다**
  #
  #   스케줄러는 `django_celery_beat.schedulers:DatabaseScheduler` 다
  #   (`config/celery.py` 의 `beat_scheduler`). 이 스케줄러는 뜰 때
  #   `beat_schedule` 를 DB 표(`django_celery_beat_periodictask`)로 옮겨 심고,
  #   **`last_run_at` 이 비어 있는 crontab 항목을 「지금 밀렸다」로 읽어 즉시 발화한다.**
  #
  #       [실측 2026-09-05 17:41:59] beat 가 뜬 지 0.5초 만에 **14개 항목이 한꺼번에
  #       발화했다.** 그중에 `purge-audit-logs-daily`
  #       (`core.logger.tasks.purge_old_audit_logs`) 가 있었다 — 03:10 에 돌기로 적힌
  #       **파기 작업이 17:41 에 나갔다.**
  #
  #   즉 「03:10 이니까 오늘 밤까지는 시간이 있다」는 **틀린 계산**이다. 파기 항목을
  #   막으려면 beat 를 세우기 **전에** 막아야 한다. 이번에는 다치지 않았는데,
  #   그 이유는 시각이 아니라 **잰 수** 였다:
  #
  #       retention_days = 90 · cutoff = 2026-06-07 · 만료 행 **0개**
  #       (가장 오래된 감사 행이 2026-08-27 · 9일 치밖에 없다) [실측 17:46]
  #
  #   **운(運)이 아니라 측정이 우리를 지켰다.** 운영 DB 에서 같은 일이 벌어졌다면
  #   90일보다 오래된 행이 있었을 것이고, 그때는 즉시 파기됐다.
  #
  # ★ 그래서 **파기 항목 셋은 지금 꺼 둔다**(D-209 함정 ① · 지시서 §4 함정 ②)
  #
  #   보존 일수를 **선언하지 않은 테넌트를 파기 대상에서 빼는 판정**이 아직 없다.
  #   [실측] `apps/dsm/retention.py::retention_days()` 는 설정이 없으면 조용히
  #   **전역 기본값 30일**로 떨어지고, `common/ops_tasks.py::video_retention_sweep_beat`
  #   는 그 값으로 `sweep(dry_run=False)` 를 부른다 — **미선언이 곧 30일 파기**다.
  #   그리고 그 태스크의 끄는 손잡이 `VIDEO_RETENTION_SWEEP_ENABLED` ·
  #   `OPS_AUDIT_PURGE_ENABLED` 는 **`config/settings.py` 에 존재하지 않는다**
  #   [실측 grep] — `getattr(settings, …, True)` 의 기본값 True 로만 살아 있어서
  #   **환경변수로는 끌 수 없다.**
  #
  #   그러므로 끄는 자리는 하나뿐이다 — **DB 의 주기 표에서 항목을 끈다.**
  #   되돌릴 수 있고(한 줄), 감사에 남고, 코드를 고치지 않는다:
  #
  #       docker exec postgres psql -U postgres -d database_guardianx -c   #         "UPDATE django_celery_beat_periodictask SET enabled=false
  #          WHERE task IN ('common.ops_audit_purge_beat',
  #                         'common.video_retention_sweep_beat',
  #                         'core.logger.tasks.purge_old_audit_logs')"
  #
  #   ↑ 2026-09-05 17:42 에 이 세 줄을 껐다. **켜는 조건**은 P-57 이 파기 대상
  #     판정(선언 없는 테넌트 제외)을 세우고 `scripts/verify_purge.py` 가 초록일 때다.
  #     켜는 명령은 위와 같고 `enabled=true` 만 다르다.
  #
  # ★ 왜 워커와 beat 를 **한 컨테이너에 합치지 않는가**(`worker -B`)
  #   `-B` 는 개발 편의 기능이고 celery 문서가 운영에 쓰지 말라고 적은 자리다.
  #   워커는 여러 대로 늘리는 물건이고 beat 는 **정확히 하나**여야 한다 —
  #   합쳐 두면 워커를 2대로 늘리는 순간 모든 주기가 두 번씩 돈다. 파기가 두 번 도는 것은
  #   0건일 때만 무해하다.
  beat:
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    command: python -m celery -A config beat -l INFO
    volumes:
      # ── 백업 목적지 `/backup` (P-67 · 2026-09-06 · 차선 E) ─────────────────
      #
      # ★ `settings.OPS_BACKUP_DIR` 이 `/backup` 이라고 **선언**해도, 그 경로가
      #   볼륨으로 안 붙어 있으면 `mkdir` 이 컨테이너 루트에 평범한 폴더를 만들고
      #   백업이 거기 떨어진다 — 컨테이너를 다시 만드는 순간 사라지고, 그 전까지
      #   **「파일이 생겼다」가 초록으로 보인다.** 그것이 이 절의 착시다.
      #   `common/ops_tasks.py::backup_dir_is_separate_volume()` 가 `st_dev` 로 그것을
      #   재고, 안 붙어 있으면 백업을 **돌리지 않고** UNKNOWN 을 낸다.
      #
      # ⚠ **선언은 여기 섰고, 적용은 다음 재기동이다.** 도커의 마운트는 컨테이너를
      #   **만들 때** 굳는다. 이 기계에서 도는 `gx-celery-e`·`gx-beat-e`·`gx-shell` 은
      #   compose 밖에서 손으로 만든 것이라 이 줄이 닿지 않는다
      #   [실측 2026-09-06 · `ops_backup_beat` → UNKNOWN · separate_volume=false].
      #   재기동은 다른 차선 넷이 이 컨테이너들 위에서 일하는 동안 하지 않는다 —
      #   조율자가 재기동 창을 열 때 붙는다.
      - gx_backup_vault_e:/backup
      - ./backend:/app
      - ./sourcedemo:/sourcedemo
      - ~/.ssh:/root/.ssh:ro
      - ./scripts:/repo/scripts:ro
      - ./backend:/repo/backend:ro
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -v
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 백업 목적지의 이름 (P-102). 사유·주의는 `celery` 서비스의 같은 줄에 적혀 있다.
      # ⚠ 선언은 여기 서고 **적용은 컨테이너를 다시 만들 때**다 — 지금 도는 것에는 없다.
      - OPS_BACKUP_DIR=${OPS_BACKUP_DIR:-/backup}
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network
    depends_on:
      - redis
      - backend
      - celery

  # ───────────────────────────────────────────────────────────────────────────
  # 판정용 셸 — **자동 migrate 를 하지 않는다** (2026-08-29 사고 대응 · D-283 · D-270)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # ★ 왜 이 서비스가 따로 필요한가 — 절차가 재시작 한 번으로 우회됐다
  #
  #   이미지의 `ENTRYPOINT=/entrypoint.sh` 는 **무조건** `python manage.py migrate` 를 돈다.
  #   그래서 시험용 셸 컨테이너를 다시 만드는 것만으로 **마이그레이션 4건이 DB 에 적용됐다**
  #   (logger.0010 · surveillance.0030 · stream_monitors.0015 · 0016 —
  #    2026-08-27 13:28 UTC). D-283 이 요구한 선행 절차
  #    (① DDL 첨부 → ② 역방향 확인 → ③ 스냅샷) **전이었다.**
  #
  #   여기서 배운 것은 "조심하자"가 아니다. **사람의 기억에 맡긴 절차는 도구가 우회한다.**
  #   `docker run` 은 게이트가 볼 수 없는 자리이므로, 막을 수 있는 유일한 지점은
  #   **셸을 만드는 방법 자체를 여기에 못박는 것**이다. 손으로 `docker run` 하지 말 것.
  #
  #       docker compose --profile tools up -d shell
  #       docker compose exec shell python -m pytest tests -q --nomigrations
  #
  #   마이그레이션을 **적용할 때**는 이 셸이 아니라 사람이 D-283 절차를 밟는다:
  #       ① python manage.py sqlmigrate <app> <n>              # 실행될 DDL 을 먼저 본다
  #       ② python manage.py sqlmigrate --backwards <app> <n>  # 되돌릴 수 있는가
  #       ③ pg_dump -Fc  →  C:\GuardianX-vault\               # 스냅샷 (D-002)
  #       ④ python manage.py migrate <app> <n>                 # 그 다음에야 적용
  #       ⑤ python scripts/verify_migrations.py                # 두 눈 모두 green (D-282)
  shell:
    profiles: ["tools"]          # 기본 `up` 에 딸려 오지 않는다 — 부를 때만 선다
    build:
      context: ./backend
      ssh:
        - default=${SSH_AUTH_SOCK}
    # ★ 이 두 줄이 이 서비스의 존재 이유다. entrypoint 를 비워 이미지의 진짜
    #   `/entrypoint.sh`(무조건 `manage.py migrate` 를 부른다)를 끊는다 — D-283 · D-270.
    #   ⚠ [P-263 · 턴 AE 차선 E] **`sleep infinity` 였던 것을 게이트 서버 자동 기동으로
    #     바꾼다.** 옛 모양은 아무것도 안 띄웠다 — runserver(8000)와 SPA 정적 서버(3002)는
    #     사람이 `docker exec` 로 매번 배경에 다시 띄워야 했고, 그중 SPA 서버의 소스는
    #     `/tmp/gx_spa_server.py` 에 있어 **컨테이너가 다시 서면 사라졌다**(재부팅 아침마다
    #     손이 필요했던 뿌리). `scripts/gx_shell_bootstrap.py` 로 옮기고(저장소 안 · 이
    #     서비스에 `/repo/scripts:ro` 로 이미 마운트돼 있다) 이 파일이 entrypoint 가 되면
    #     컨테이너가 설 때 **스스로** 둘 다 띄운다. **`manage.py migrate` 는 여전히
    #     안 부른다** — 그 스크립트 안에 없다(자기 머리말 참조).
    #   ⚠ 이 줄은 **다음에 이 서비스가 다시 설 때부터** 효과가 있다 — 도커의
    #     entrypoint/command 는 컨테이너를 **만들 때** 굳는다. 지금 도는 `gx-shell`
    #     (옛 모양으로 만들어졌다)은 이 턴에서 재생성하지 않는다(WO-08 §5 E) — 그대로
    #     `docker exec` 로 띄운 runserver(PID 35)·SPA 서버(PID 86)가 계속 돈다.
    entrypoint: ["python", "/repo/scripts/gx_shell_bootstrap.py"]
    working_dir: /app
    volumes:
      # ── 백업 목적지 `/backup` (P-67 · 2026-09-06 · 차선 E) ─────────────────
      #
      # ★ `settings.OPS_BACKUP_DIR` 이 `/backup` 이라고 **선언**해도, 그 경로가
      #   볼륨으로 안 붙어 있으면 `mkdir` 이 컨테이너 루트에 평범한 폴더를 만들고
      #   백업이 거기 떨어진다 — 컨테이너를 다시 만드는 순간 사라지고, 그 전까지
      #   **「파일이 생겼다」가 초록으로 보인다.** 그것이 이 절의 착시다.
      #   `common/ops_tasks.py::backup_dir_is_separate_volume()` 가 `st_dev` 로 그것을
      #   재고, 안 붙어 있으면 백업을 **돌리지 않고** UNKNOWN 을 낸다.
      #
      # ⚠ **선언은 여기 섰고, 적용은 다음 재기동이다.** 도커의 마운트는 컨테이너를
      #   **만들 때** 굳는다. 이 기계에서 도는 `gx-celery-e`·`gx-beat-e`·`gx-shell` 은
      #   compose 밖에서 손으로 만든 것이라 이 줄이 닿지 않는다
      #   [실측 2026-09-06 · `ops_backup_beat` → UNKNOWN · separate_volume=false].
      #   재기동은 다른 차선 넷이 이 컨테이너들 위에서 일하는 동안 하지 않는다 —
      #   조율자가 재기동 창을 열 때 붙는다.
      - gx_backup_vault_e:/backup
      - ./backend:/app
      - ./sourcedemo:/sourcedemo
      - ./scripts:/repo/scripts:ro
      - ./backend:/repo/backend:ro
      # ★ VAPID 구멍 막음 [P-263 후속 · 턴 AF 차선 E]. 조율자가 어제 runserver 를 손으로
      #   `--env-file` 실어 다시 띄운 이유가 이 값들이었다 — `gx_shell_bootstrap.py` 가
      #   대신 기동을 맡으면 그 손길이 사라지므로, 저장소 뿌리의 금고 파일(gitignored ·
      #   `.env.vapid`)을 **읽기 전용**으로 들여 스크립트가 스스로 싣게 한다
      #   (`scripts/gx_shell_bootstrap.py::_load_vapid_env`, 기본 자리 `/repo/.env.vapid`).
      #   ⚠ 호스트에 `.env.vapid` 가 없어도 **컴포즈가 죽지 않는다** — 단일 파일
      #   바인드마운트의 소스가 없으면 Docker 는 컨테이너 안에 **빈 디렉터리**를 만든다
      #   [실측 2026-09-23 · `docker run --rm -v .../.env.vapid.NOPE:/repo/.env.vapid.NOPE`
      #   → 에러 없이 빈 디렉터리]. 스크립트는 `os.path.isfile()` 로 그 더미를 걸러낸다.
      - ./.env.vapid:/repo/.env.vapid:ro
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 백업 목적지의 이름 (P-102). 사유·주의는 `celery` 서비스의 같은 줄에 적혀 있다.
      # ⚠ 선언은 여기 서고 **적용은 컨테이너를 다시 만들 때**다 — 지금 도는 것에는 없다.
      - OPS_BACKUP_DIR=${OPS_BACKUP_DIR:-/backup}
    # ★ P-128 (2026-09-11 · 차선 E) — 세 아침 연속 전체 다운. 기계가 다시 서면
    #   컨테이너도 다시 선다. 손으로 `docker stop` 한 것은 그대로 멈춰 있는다.
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network
    depends_on:
      - redis

  # ─────────────────────────────────────────────────────────────────────────
  # MinIO — 객체 저장소 (P-5)
  #
  # ★ 왜 이것이 「기반」인가. 이것이 없는 동안 `/api/media-data(/)` 두 자리가 **500** 이었고,
  #   그 500 을 화면은 「0 of 0」으로 그렸다 — 사용자에게는 **자료가 없는 것처럼** 보였다
  #   (D-378 · MEDIA_LIST_SHOWS_EMPTY_WHEN_STORAGE_DOWN). 게이트 `route-alive` 의
  #   유일한 빨강도 그 두 자리였다.
  #
  # ★ 판을 **digest 로** 못박는다 (D-387). `:latest` 는 lock 이 아니다 —
  #   내일 받으면 다른 물건이 오고, 그때 빨개지면 우리는 그 빨강을 「환경 탓」으로 읽는다.
  #   태그는 사람이 읽으라고 함께 적는다. **둘을 따로 고치면 lock 이 아니다.**
  #
  # ⚠ 자격증명은 **저장소에 없다.** 뿌리의 `.env`(gitignored)를 compose 가 자동으로 읽고,
  #   저장소에는 이름만 남는다(`.env.example` · D-204). `:?` 는 값이 없으면
  #   **조용히 기본값으로 서는 대신 그 자리에서 멈추라**는 뜻이다 — 기본 자격증명으로
  #   선 저장소는 열려 있는 저장소다.
  minio:
    # minio/minio:RELEASE.2025-09-07T16-13-09Z
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?뿌리 .env 에 MINIO_ROOT_USER 가 없다 (이름은 .env.example 참조)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?뿌리 .env 에 MINIO_ROOT_PASSWORD 가 없다 (8자 이상)}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # 콘솔
    # 저장소가 **떴다**와 **받는다**는 다른 사실이다 — 뒤엣것을 본다.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network

  # Redis service
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network

  # ═══════════════════════════════════════════════════════════════════════
  # compose **밖에 있던** 컨테이너를 안으로 들인다 (OPS-07 · 2026-09-05 · 턴 D)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # ★ 왜 이 자리가 필요한가 — **선언할 자리가 없으면 상한도 없다**
  #   이 기계의 `postgres` 는 `docker run` 으로 떴다. compose 에 대응 서비스가
  #   **아예 없었으므로** `logging` 앵커가 닿을 자리도 없었고, 그래서
  #   `scripts/ops_log_collectors.py` 는 이 수집기를 **「선언할 자리조차 없다」**
  #   로 찍었다. 그 빨강은 compose 를 고쳐서는 안 지워지는 빨강이었다 —
  #   지울 수 없는 빨강은 다음 사람이 그냥 무시한다.
  #
  # ⚠ **선언이 섰다고 지금 걸린 것이 아니다.** 도커의 `LogConfig` 는 컨테이너를
  #   **만들 때** 굳는다. 지금 떠 있는 `postgres` 에 상한을 걸려면 **다시 만들어야**
  #   하고, 그 재기동은 [2026-09-05 현재] **하지 않는다** — `gx-shell` 안에서 다른
  #   차선 셋이 시험 DB 를 만들고 지우는 중이고, postgres 를 내리면 그 셋이 한꺼번에
  #   죽는다(조율자 지시 · 턴 D). 절차는 `docs/agent/RUNBOOK_로컬기동.md` STEP 2B 에
  #   적었다. **「선언이 섰다」를 「보존이 걸렸다」로 적지 않는다.**
  #
  # ⚠ `profiles` 로 감싼다 — 맨 `docker compose up` 에 딸려 오면 이미 떠 있는
  #   `postgres`(5433)와 포트가 부딪친다. 부를 때만 선다:
  #       docker compose --profile local up -d postgres
  #
  # ⚠ 이 기계의 컨테이너들은 손으로 만든 `gx-main-network` 위에 있다. compose 가
  #   만든 것은 `guardianx-network` 에 서므로 한 번 더 이어 줘야 `gx-shell` 이 닿는다
  #   (MinIO 에 이미 같은 절차가 있다):
  #       docker network connect --alias postgres gx-main-network guardianx-source-postgres-1
  postgres:
    profiles: ["local"]
    # [실측 2026-09-05] 떠 있는 컨테이너의 이미지 그대로. 태그는 `latest` 이지만
    # 실제로 도는 것은 PG 18 이다(`PG_VERSION=18.1`) — `latest` 는 **날짜에 따라
    # 다른 것을 가리키는 이름**이므로, 이 서비스로 갈아탈 때 판이 바뀔 수 있다.
    image: postgres:latest
    environment:
      # 값은 저장소에 없다. 뿌리 `.env`(gitignored)가 준다 — 없으면 **그 자리에서
      # 멈춘다**(`:?`). 기본 비밀번호로 조용히 서지 않는다(MinIO 와 같은 규약).
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 없다 — 뿌리 .env 를 보라}
    ports:
      - "5433:5432"
    volumes:
      # [실측] 떠 있는 컨테이너가 쓰는 이름 붙인 볼륨. **이름을 바꾸면 빈 DB 가 선다.**
      - gx_pgdata:/var/lib/postgresql
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network

  # ═══════════════════════════════════════════════════════════════════════
  # mailpit — **로컬 SMTP 수신함** (P-68 · 2026-09-06 · 차선 E)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # ★ 왜 이 자리가 필요한가 — **「보냈다」와 「도착했다」는 다른 사실이다**
  #   지금까지 이 저장소가 잴 수 있었던 것은 `send_mail` 의 반환값(보낸 개수)까지다.
  #   그것은 **SMTP 서버가 받아 줬다**는 뜻이지 **수신함에 들어갔다**는 뜻이 아니다.
  #   시험은 locmem 백엔드를 쓰므로 아예 소켓조차 안 탄다. 즉 「메일 배선이 산다」를
  #   실물로 잰 적이 **한 번도 없었다.** mailpit 은 SMTP 를 실제로 받아서 HTTP API 로
  #   되돌려주는 수신함이다 — 그래서 「보냈다 → 도착했다」를 기계가 대조할 수 있다.
  #
  # ⛔ **이것은 OPS-10 을 닫지 못한다.** mailpit 이 받은 것은 **우리가 세운 통**이다.
  #   사람의 수신함이 아니다. 여기가 초록이어도 증명되는 것은 딱 이만큼이다 —
  #   「Django 설정 → SMTP 소켓 → 메시지 파싱」 구간이 살아 있다. 그 앞(발송 업체·
  #   인증·SPF/DKIM)과 뒤(스팸함·수신 거부·사람이 읽었는가)는 **여전히 안 잰 것**이다.
  #   그러므로 이 서비스로 잰 결과를 「경보가 사람에게 도달한다」로 적으면 그것이
  #   D-284 가 이름 붙인 「조용한 성공」이다. 증거 문서에도 같은 한계를 적었다:
  #   `docs/agent/evidence/OPS-10/mailpit_수신함_실측.md`
  #
  # ★ 판을 **digest 로** 못박는다 (D-387 · MinIO 와 같은 규약). 태그는 사람이 읽으라고
  #   함께 적는다. **둘을 따로 고치면 lock 이 아니다.**
  #   [실측 2026-09-06] `docker pull axllent/mailpit:latest` 가 준 digest 를 그대로 적었다.
  #   ⚠ 이 이미지는 `org.opencontainers.image.version` 라벨이 **비어 있어** 판 번호를
  #     읽지 못했다. 그래서 위 주석에 적을 수 있는 것은 「받은 날」과 이미지 생성 시각
  #     (2026-09-05T11:15:32Z)뿐이다 — 판 번호를 안다고 적지 않는다.
  #
  # ⚠ `profiles` 로 감싼다. 이것은 제품이 아니라 **계측기**다. 맨 `docker compose up`
  #   에 딸려 오면 아무도 부르지 않은 SMTP 통이 늘 서 있게 된다. 부를 때만 선다:
  #       docker compose --profile mail up -d mailpit
  #
  # ⚠ **함정** — 위 명령이 `POSTGRES_PASSWORD 가 없다` 로 멈춘다 [실측 2026-09-06].
  #   compose 의 변수 치환은 **파일 전체**에 걸린다 — 프로필로 걸러진 `postgres` 의
  #   `:?` 도 같이 평가된다. 뿌리 `.env` 에는 MinIO 것만 있고 PG 것이 없다. mailpit 만
  #   세울 때는 치환용 더미를 한 번만 얹는다(`.env` 를 고치지 않는다 — 그 파일은
  #   다른 차선의 것이다). postgres 는 뜨지 않으므로 이 값은 아무 데도 안 쓰인다:
  #       POSTGRES_PASSWORD=interpolation-only-not-used docker compose --profile mail up -d mailpit
  #
  # ⚠ 호스트 포트를 `127.0.0.1` 로 묶는다. mailpit 은 **아무 인증 없이 아무 메일이나
  #   받는다** — 0.0.0.0 에 열면 같은 망의 누구나 이 통에 넣고 웹 UI 로 읽을 수 있다.
  #   [실측 2026-09-06] 이 기계에서 1025·8025 는 비어 있었다(쓰이는 것: 3002 · 5433 ·
  #   6379 · 8000 · 8500 · 9000 · 9001).
  #
  # ⚠ 이 기계의 컨테이너들은 손으로 만든 `gx-main-network` 위에 있다. compose 가
  #   만든 것은 `guardianx-network` 에 서므로 한 번 더 이어 줘야 `gx-shell` 이 닿는다
  #   (MinIO·postgres 에 이미 같은 절차가 있다):
  #       docker network connect --alias mailpit gx-main-network guardianx-source-mailpit-1
  #
  # ⚠ `backend/config/settings.py` 는 **고치지 않는다.** EMAIL_* 는 이미 `env(...)` 로
  #   읽으므로 환경변수로 덮는다(실측으로 확인했다):
  #       EMAIL_HOST=mailpit EMAIL_PORT=1025 EMAIL_USE_TLS=False
  mailpit:
    profiles: ["mail"]
    # axllent/mailpit:latest  ← [실측 2026-09-06] 받은 판. 판 번호 라벨이 비어 있다.
    image: axllent/mailpit@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    environment:
      # 수신함은 **계측기**다. 재기동하면 비는 편이 낫다 — 어제 것이 남아 있으면
      # 「이번에 도착한 것」과 「지난번에 도착한 것」이 섞이고, 섞이면 거짓 초록이 선다.
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:1025:1025"   # SMTP (받는 구멍)
      - "127.0.0.1:8025:8025"   # 웹 UI + HTTP API (`GET /api/v1/messages`)
    # **떴다**와 **받는다**는 다른 사실이다 — 뒤엣것을 본다(MinIO 와 같은 판정).
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *gx-logging
    networks:
      - guardianx-network

volumes:
  # 저장소의 자료는 컨테이너보다 오래 산다. 이름 붙인 볼륨이 아니면
  # `docker compose down` 한 번에 영상이 사라진다.
  minio-data:
  # 개발 DB. **이미 있는 볼륨을 그대로 가리킨다** — compose 가 새로 만들면
  # 빈 DB 가 서고, 그 빈 DB 위에서 도는 시험은 전부 거짓이다.
  gx_pgdata:
    external: true
  # ── 백업 목적지 (P-67 · OPS-12a · OPS-19 · 2026-09-06 · 차선 E) ───────────
  #
  # ★ 세종 판정 P-67: 「백업 목적지 **별도 볼륨 `/backup`**」.
  #   `external: true` 인 이유는 `gx_pgdata` 와 같다 — **이미 있는 볼륨을 가리킨다.**
  #   `scripts/ops_backup_volume.py` 가 이 볼륨을 만들고 거기에 뜬다
  #   [실측 2026-09-06 · 9,209,410바이트 · 다른 컨테이너에서 목차 3,351줄 읽힘].
  #   compose 가 새로 만들면 **빈 볼륨**이 서고, 그 위에서 「백업이 있다」가 거짓이 된다.
  gx_backup_vault_e:
    external: true

networks:
  guardianx-network:
    driver: bridge
