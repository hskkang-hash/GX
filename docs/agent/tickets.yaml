- id: W0-14
  phase: R1
  title: "뷰/서비스 레벨 테넌트 필터 전 엔드포인트 강제 (격리 주 통제)"
  status: in_progress
  updated_at: "2026-08-22T17:10:00+09:00"
  evidence: docs/agent/evidence/W0-14/http_leak_probe.md · leak_matrix.json · coverage.md · route_baseline.json
  blocker: |
    [2026-08-22 · **HTTP 레벨 교차 노출을 실측했다. 격리는 뚫려 있다**]
    전문: docs/agent/evidence/W0-14/http_leak_probe.md · leak_matrix.json
    프로브: scripts/probe_tenant_isolation.py (저장소 밖 질문 — 격리 시험 파일은 건드리지 않았다)

    ★ WP-1 goal 문장의 답이 나왔다. **거짓이다. 도달한다.** 경로가 둘이다.

    경로 ① `superuser` **역할** — dj-core base.py:308
        is_super = user.is_superuser or user.roles.filter(code='superuser').exists()
        if is_super: return queryset          # 그룹 필터 없음
      · **활성 보유자 13명. 그중 DB is_superuser=true 는 0명.**
        Anyang 7 · Gaion 4 · Group Default 2 — **고객 테넌트 안에 배포돼 있다.**
      · 실측: man(Anyang·superuser)이 남의 테넌트 15건, admin(Gaion·superuser)이 18건을 봤다.
        Fire_Drone 은 자기 11대 중 **10대를 두 외부 테넌트에 노출**하고 있고,
        Fire_Drone 사용자는 남의 것을 하나도 못 본다 — **노출이 일방적이라 당하는 쪽이 모른다.**
      · is_superuser 플래그로 특권 계정을 세는 감사는 **0명**을 보고한다.

    경로 ② `created_by IS NULL` — dj-core base.py:430 의 명시적 OR
      · 실측: anyang01(superuser 아님)이 Gaion 소유 Q02-0002 를 봤다 — 그 레코드 created_by 는 NULL.
      · W0-11 §5-2 의 정적 예고가 HTTP 로 재현됐다. 모수는 W0-13 의 65.9%.

    ★ 두 경로 모두 ORM 매니저 안에 있고 그 매니저는 §0.4 금지구역이다.
      **뷰 레벨 스코프(이 티켓)가 유일한 차단 수단이라는 것이 여기서 확정된다.**
      경로 ①은 특히 그렇다 — 매니저가 **의도적으로** 필터를 건너뛰는 지점이라
      매니저를 신뢰하는 어떤 설계도 막을 수 없다.

    dod 현황은 앞 항목 그대로 — ① 미충족(649/652 미분류) · ② 부분 · ③ 충족.
    이 실측은 dod 를 옮기지 않는다. **긴급도를 옮긴다.**
  priority: P0
  effort: L
  kind: new-s
  depends_on: [W0-3]
  human_gate: false
  gate: evidence-review
  requires_intranet: false
  decisions: [D-207]
  reuse_targets:
    - backend/common/tenant_filters.py
    - backend/config/urls.py
  spec: |
    D-207 결론: 격리를 ORM 매니저 한 지점에 의존하지 않는다. dj-core 를 못 고치는 이상
    **이 저장소가 통제할 수 있는 지점(뷰·서비스)이 주 통제**다.
      ① tenant_filters.py 는 이미 신설돼 있다. 이것을 **선택이 아니라 기본값**으로 만든다.
         DRF: TenantScopedViewSetMixin 을 만들고 get_queryset/get_object 에서 group 강제.
         Ninja: 라우터 레벨 의존성(dependency)으로 group 필터를 주입.
      ② **누락 탐지 테스트**를 만든다 — 이게 핵심이다.
         config/urls.py 에서 등록된 전 라우트를 열거 → 각 핸들러가
         (a) mixin/dependency 를 통과하거나 (b) EXEMPT 목록에 사유와 함께 등재
         둘 중 하나가 아니면 **테스트 실패**. 목록 증가 금지 테스트도 건다.
      ③ EXEMPT 는 인증 불요 엔드포인트(health, login, 공개 문서)로 한정한다.
    이 방식이면 dj-core 를 고치지 못해도 실제 노출은 막힌다.
  dod: |
