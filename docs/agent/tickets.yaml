         호출조차 안 됐다. "실패 1건"이 실제로는 "1건 실패 + N건 미측정"이었다.
         예외를 500 응답으로 기록하고(단언은 그대로 실패한다) 시나리오마다 **대상별 표**를 낸다.

    NO_ROUTE 래칫을 레이블별로 바꿨다 — 전역 상한 16 은 레지스트리 10종일 때의 총합이라
    P0 전수 등재(EXIT 조건)를 하려면 게이트를 꺼야 하는 구조였다. 레이블별이 전역 총합보다
    **엄격하다**(총합은 한쪽 증가가 다른 쪽 감소 뒤에 숨는다). 옛 10종분 16 불변 시험도 붙였다.

    실행 결과: 전체 80건 · **75 통과 · 5 실패**. 새로 깨진 것 없음. 남은 5건:
      · registry_covers(DashboardPanel 미등록) — 별건 P1
      · unisolated_set_has_not_grown — **P-LOCAL-3 · 미판정**
      · delete/detail/update 각 1건(Terminal 200·Order 500·Terminal 400) — §0.4 · P-W0-14-4

    ⚠ **EXIT 를 막는 것: P-LOCAL-3 이 오늘 임계경로가 됐다.**
      is_group_isolatable() 은 groups M2M 만 보는데 P0 15종은 **전부 group FK** 다.
      즉 EXIT 조건을 지키는 일이 그 시험을 더 빨갛게 만든다(2종 올리자 5→7).
      같은 정의를 쓰는 registry_covers 는 **모수가 131종이 아니라 소수**라 그 초록이 D-260 의 착시다.
      고치지 않았다 — 금지 #5 이고 A안 권고인 채 판정 대기다. 대신 has_group_fk() 를
      **일부러 분리**해 픽스처만 쓰게 했다. 픽스처는 사실을 쓰고, 단언은 판정을 기다린다.

    적재: **P-W0-14-5** — P0 의 "라우트가 닿는다"가 두 뜻이다. MissionWaypoint(8,877) 등은
          pk 를 지목하는 경로가 **없고**, 부모 경로를 통해 새는 모양이다. 그것을 어떻게 셀지가
          남은 13종의 등재 방식을 정한다. 권고 A(부모 경로 시나리오 신설).
    ★ 만드는 과정에서 도구 결함 2건을 잡았고 둘 다 문서에 남겼다:
      ① 호출 그래프 폭주(ChecklistSetting "단건 313건") — 이름만으로 함수를 찾아 앱을 넘나들었다.
         1차의 앱 단위 매칭과 **같은 결함**이다.
      ② **거짓 음성** — flight_log.FlightLog 의 /detail/{id}·/delete/{ids} 를 놓쳤다.
         핸들러가 **자기와 같은 이름의** 서비스 메서드를 가려 해석이 자기 자신에서 끝났다.
         그대로 갔으면 FlightLog 가 조용히 면제된다 — 그리고 그 모델은 하필
         **D-266 이 WP-DA2 착수 전 필수로 지정한 2종 중 하나**였다.
      ②가 더 무섭다. ①은 수가 이상해서 보이지만 ②는 **경고 없이 커버리지를 줄인다.**

    ★ P0 19종 중 group NULL 100% 가 넷(MissionWaypoint 8,877 · DeliveryOperationApprovalChecklist
      3,013 · OrderAssignment 261 · TerminalOperatingTime 98). **W0-13 백필 (a) 의 대상이기도 하다** —
      백필이 끝나야 격리 시험의 기대값이 의미를 갖는다. 순서는 D-261 대로 백필이 먼저다.

    ---
    [2026-08-27 3차 · **P0 를 19 → 15 로 시정 + ④ 준비 완료**]
    전문: evidence/W0-14/leak_targets_coverage.md (배너) · p0_target_draft.md

    ★ **시정**: 2차는 **pk 가 없는 쓰기**(`POST /approve-flight` 처럼 요청 **본문**으로 대상을
      고르는 라우트)를 "단건 경로"로 셌다. 그것은 IDOR 경로가 아니라 배선이 다른 별개 위험이다.
      섞으면 단건 수가 부풀고 그러면 P0 가 부푼다 — **또 하나의 "구별하지 못하는 수"**다.
      분리: **P0 15 · P1 50 · UNREVIEWED 57**. 내려간 4종은 사라진 게 아니라 P1 에서 사유와 함께 센다.
      (이 저장소가 반복해서 만난 실패다 — 부착률 466/466 · 앱 단위 매칭 · 시나리오 5/5.
       셋 다 "수는 큰데 대상을 구별하지 못하는 수"였다.)

    ★ **④(P0 전수 시험)의 배선을 미리 뽑았다** — `scripts/draft_isolation_targets.py` 신설.
      W0-14b 를 죽인 것은 격리 로직이 아니라 배선이었고 그중 최대가 **필수 FK 24건**이었다.
      P0 15종에 대해 (a) 어떤 라우트가 이 모델을 만지는가 (b) 레코드 하나를 만들려면 무엇이
      필요한가(= `null=True` 도 `default=` 도 없는 필드)를 모델 선언 AST 로 뽑았다.
      · **D-266 선결 2종(FlightLog · VideoAnalysis)이 마침 필수 FK 0** —
        우선순위와 배선 비용이 같은 방향이다. 필수 FK 없는 4종이 첫 묶음.
      ⚠ **초안이지 정답이 아니다**: dj-core 부모(BaseModel 등)의 필수 필드는 저장소 밖이라
        보이지 않는다. 수정/삭제 메서드 모양도 기동본 확인 대상이다(PATCH 는 전체에 1건).
        그대로 MODELS 에 붙여넣지 않는다 — 추정 위에 배선을 쌓으면 전부 다시 한다.
    ---
