    ★ **"클릭→영상 3초"를 재는 두 점을 정의했다** (§2-4):
      t0 = 카드 클릭 핸들러 진입 / t1 = video 첫 프레임 페인트. **AC 는 t1-t0 ≤ 3.0초.**
      스냅샷을 먼저 그려 체감을 0 으로 만들되 **AC 판정은 영상 첫 프레임으로 한다** —
      스냅샷으로 3초를 통과했다고 주장하지 않는다. 검수는 p50/p95 분포로 보고한다.
      정하지 않으면 이 KPI 는 판정 불가였다.

    ★ **5상태 작업량의 실체: 로딩은 이미 있다.** Skeleton 5종이 실재하므로
      **신규는 빈·오류·권한없음 × 위젯 수**다. 위젯별 적용표를 §2-5 에 냈다(검수 판정표).

    ★ **스피너 고착이 이 화면의 실제 실패 모드다** (W0-18 프론트 실측 인용).
      무보호 호출 21곳의 증상은 흰 화면이 아니라 영원한 로딩이다 —
      즉 **로딩 상태가 오류 상태를 삼킨다.** 그래서 신규 위젯 전건에 로딩 타임아웃 10초를
      걸고 초과 시 오류로 전이시킨다. F-09 의 숨은 필수 요건이다.

    ★ **T9 의 가장 중요한 규칙: 오류 상태에서 폼을 빈 값으로 그리지 않는다** (§3-5).
      불러오기 실패를 "설정 없음"으로 그리면 관리자가 저장을 눌러 **실제 설정을 빈 값으로 덮는다.**

    미정 3건(네트워크 링크 표현 · 3계층 프리셋 관계 · 목록 기본 필터)은 §5 에 사유·시점과 함께.
