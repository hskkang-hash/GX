    문서로 강제한다. 커널은 전부 **L3 Platform** 구현이고 그러므로 **가이온 IP** 다(계약 8조).

      ① 커널 6종의 **API 스펙**(입력·출력·오류·소유 계층)을 쓴다.
         K1 이벤트 / K2 알림 / K3 역할별 대시보드 프레임 / K4 보고서 엔진 /
         K5 신뢰(격리·감사·저하운전) / K6 피드백·계측.
      ② ★ **이중 AC 표가 이 티켓의 본체다.** 커널 하나마다
         [F-xx 계약 AC] 와 [U-x 상품 AC] 를 나란히 적고, **둘을 동시에 충족하는 하나의 구현**을
         정의한다. 충돌 시 **계약 AC 가 우선**한다(지시서 v2.1 규칙 2).
      ③ 규칙 1 을 문서로 못박는다: 커널은 L3 에만. App(L4)·어댑터(L2)는 **소비만** 한다.
