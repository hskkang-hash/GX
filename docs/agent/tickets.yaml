  effort: S
  kind: ops
  depends_on: [W0-0]
  human_gate: true
  gate: human-required          # 외부 콘솔 접근 필요 — 대체 불가 (D-010)
  requires_intranet: false
  decisions: [D-002, D-003]
  reuse_targets: []
  spec: |
    아래 15개 항목을 각 발급처에서 **폐기 후 재발급**한다. 에이전트는 수행할 수 없다.
