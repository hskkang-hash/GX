- id: W0-1a
  phase: R1
  title: "시크릿 게이트 구축 (치환 검증 + 로컬 훅 + CI 파일)"
  status: done
  priority: P0
  effort: S
  kind: ops
  depends_on: [W0-0]
  human_gate: false
  gate: evidence-review
  decisions: [D-001, D-003]
  reuse_targets:
    - backend/.env.example
    - frontend/.env.example
    - .gitignore
  spec: |
    D-001 에 따라 로컬 게이트를 실효 차단선으로, CI 파일은 선제 배치한다.
      1) .pre-commit-config.yaml : gitleaks protect --staged 훅 추가 + 설치
      2) .github/workflows/secret-scan.yml : gitleaks-action (원격 생성 시 자동 동작)
      3) .gitlab-ci.yml : secret_detection 템플릿 (둘 다 두어도 무해)
      4) 커스텀 룰 추가: GCS_APIKEY 와 VITE_CGS_APIKEY 의 **값이 같으면 FAIL** (D-003 단계2)
      5) 차단 동작을 1회 재현하고 로그를 evidence 에 남긴다
         (더미 키를 스테이징 → 커밋 시도 → 차단됨 확인 → 되돌리기)
  dod: |
    ① .env.example 두 파일 실값 0개
    ② pre-commit 훅이 시크릿 포함 커밋을 실제로 차단하는 것을 1회 재현(로그 증거)
    ③ .github/workflows/secret-scan.yml 와 .gitlab-ci.yml 존재
    ※ '원격 CI 잡 green' 은 W0-6 으로 이연 (D-001)
  verify:
    - "test -f .pre-commit-config.yaml && test -f .github/workflows/secret-scan.yml && test -f .gitlab-ci.yml"
    - "gitleaks detect --config .gitleaks.toml --redact --no-banner"
    - "python scripts/check_key_divergence.py"
  blocker: ""
  evidence: |
    docs/agent/evidence/W0-1a/blocked.log
    ① .env.example 2개 실값 0개 — 패턴 기반 verify 로 검증 (값 인용 안 함)
    ② 차단 재현: git commit 이 pre-commit 훅에서 exit 1 로 실제 차단됨
       ※ 연출된 더미가 아니라 스테이징에 남아 있던 구 실값에서 실제로 걸렸다.
         gx-agent-docs-hex ×2 + gcp-api-key ×1 @ evidence/W0-0/baseline.md
         → docs/agent/* 를 스캔 제외했다면 그대로 커밋될 뻔했다 (RESUME_NEXT 7-1 실증)
       D-003 검사도 양성/음성 양방향 시험 완료 (동일 값 → exit 1)
    ③ .github/workflows/secret-scan.yml · .gitlab-ci.yml · .gitleaks.toml 존재
    도구: gitleaks 8.30.1(수동 검증) / pre-commit 4.6.2 + gitleaks v8.21.2 훅(자동)
    커스텀 룰 3종: gx-env-example-placeholder / gx-agent-docs-hex / gx-hardcoded-env-default
    ※ gitleaks 는 Go RE2 라 lookahead 불가 — 부정조건은 rules.allowlists 로 표현했다.
  updated_at: "2026-08-13T20:45:00+09:00"

