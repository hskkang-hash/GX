      절감률은 WP-DA2 착수 시 티켓별 공수 추정으로 갱신한다 (D-210).

    ★ **K2 알림 커널에 대응 티켓이 0건** — 6개 커널 중 하나가 비어 있다 → P-DA-2.
      이 GAP 은 커널 매핑을 기계로 대조했기 때문에 드러났다. 손으로 셌으면 6/6 으로 보였을 것이다.

    ★ **"U1~U4 티켓"은 존재하지 않는다** — U 는 상품화 2단계의 WP 묶음이고
      D-246 이 이미 그렇게 쓴다(U1=WP-3). 지시서의 표현은 근사치라 실측대로
      해당 WP 의 개별 티켓 18건에 `kernel:` 을 넣었다 (D-210).
      문서 §4 표와 정본의 일치는 `python scripts/verify_kernel_map.py` 가 판정한다 — **대조 통과.**

    ★ **KPI 2건은 선언이 아니라 게이트여야 한다** (§5). 재사용률을 사람이 세면 항상 90% 가 나온다.
      "App 이 커널 모델을 직접 import 하지 않는다"를 **정적 검사**로 걸 것을 WP-DA2 조건으로 올린다.
