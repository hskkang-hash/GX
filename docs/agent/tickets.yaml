- id: W0-0
  phase: R1
  title: "저장소 초기화 + 베이스라인 커밋 (최선행)"
  status: done
  priority: P0
  effort: S
  kind: ops
  depends_on: []
  human_gate: false
  gate: evidence-review
  decisions: [D-004, D-005, D-006]
  reuse_targets:
    - .gitignore
    - backend/.env.example
    - frontend/.env.example
    - yarn.lock
  spec: |
    ⚠️ 이 티켓이 모든 작업의 최선행이다. (D-004)
    현재 저장소에 커밋이 하나도 없다. 지금 최초 커밋을 만들면 실키 15개가 히스토리에 박힌다.
    따라서 반드시 아래 순서로 한다.
      1) .gitignore 정비: .env, .env.local, *.pem, ~/.guardianx-secrets 류 제외 확인
      2) 루트 yarn.lock 삭제(86바이트 빈 파일), npm 을 정본으로 확정 (D-006)
      3) backend/.env.example, frontend/.env.example 의 실값을 **플레이스홀더로 치환**
         형식: your-kakao-api-key-here / CHANGE_ME_DB_PASSWORD 등
         ⚠️ 치환 전 실값 백업은 저장소 밖 (D-002). 백업은 사람이 수행하며,
            에이전트는 "백업 완료 확인" 없이 치환하지 않는다 → 확인 없으면 STOP.
      4) 최초 커밋 생성. 이 커밋 SHA 를 meta.baseline_sha 에 기록 (D-005)
    실키는 단 한 번도 히스토리에 들어가지 않아야 한다.
  dod: |
    ① git log 에 커밋 1개 존재, 그 커밋의 .env.example 두 파일에 실값 0개
    ② meta.baseline_sha 가 tickets.yaml 에 기록됨
    ③ 루트 yarn.lock 부재, package-lock.json 존재
  verify:
    - "git log --oneline | wc -l"
    # 값이 아닌 형태로 검사한다 (RESUME_NEXT 0-2: 작성자 오류를 패턴 기반으로 정정).
    # 자격증명 항목 중 플레이스홀더가 아닌 값의 개수를 센다. 0 이어야 한다.
    - "git show HEAD:backend/.env.example | grep -E '^[A-Z0-9_]*(KEY|SECRET|PASSWORD|TOKEN|APIKEY|CREDENTIAL)[A-Z0-9_]*=' | grep -cvE '=\"?(CHANGE_ME|your-)' || true"
    - "git show HEAD:frontend/.env.example | grep -E '^[A-Z0-9_]*(KEY|SECRET|PASSWORD|TOKEN|APIKEY|CREDENTIAL)[A-Z0-9_]*=' | grep -cvE '=\"?(CHANGE_ME|your-)' || true"
    - "test ! -f yarn.lock"
  blocker: ""
  evidence: |
    docs/agent/evidence/W0-0/baseline.md
    baseline_sha 4afca2bb17f0dd64afce238579ad58380f9c4b57 (1796 files)
    DoD① 커밋 1개, 커밋 내 .env.example 실값 0건
    DoD② meta.baseline_sha 기록 완료
    DoD③ 충족 — RESUME_NEXT.md 1-2 / D-205 로 재정의된 기준 적용:
      "루트 yarn.lock 부재 + .npmrc 에 legacy-peer-deps=true 커밋"
      → yarn.lock 부재 OK / frontend/.npmrc 4afca2b 에 커밋됨 OK
