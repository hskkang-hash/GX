    현재: cv2.VideoCapture(CPU) → 6프레임/1초 배치 → cv2.imencode(JPEG) → gRPC 왕복
          → cv2.VideoWriter + ffmpeg 재인코딩. 채널당 CPU 1~2코어 점유.
    목표: nvurisrcbin(NVDEC) → 프레임 게이팅 → nvinferserver/Triton(동적 배칭)
          → nvtracker → 좌표만 WebSocket → 녹화는 remux.
    기존 gRPC AI 서비스는 버리지 않고 '모델 서빙'으로 남기되 프레임 왕복을 제거한다.
