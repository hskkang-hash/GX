    ⚠️ 전제 정정(D-248): 권한거부 200 의 원인은 `core/role/permission.py:512` 가 dict 를 반환하는 것이고
       그 파일은 §0.4 금지구역이다. **소스를 고치지 않는다.** 저장소 쪽 후처리로 해결한다.

      ① **첫 작업은 영향조사다.** 프론트에서 status_code / success 필드를 읽는 지점을 전수 조사한다.
         200 을 기대하는 화면이 4xx 를 받으면 흰 화면이 된다.
      ② 응답 후처리 계층(미들웨어/렌더러)에서 `{"success": false, "status_code": 4xx}` 형태를 감지해
         실제 HTTP 상태로 승격한다. **설정 1곳의 플래그 뒤에 둔다** (D-212) — 즉시 롤백 가능해야 한다.
