# ★ 이 티켓이 없으면 정본이 전부 done 이 되어도 계약 필수(M) 기능 하나가 구현되지 않는다.
#   DA-04 가 "커널 6종 중 K2 만 대응 티켓 0건"을 기계로 잡아 드러난 GAP 이다.
- id: DA2-21
  phase: R1
  title: "F-10 알림 발송 — K2 알림 커널 (등급별 수신그룹 · 다채널 · 발송이력)"
  kernel: [K2]
  feature: [F-10]
  status: in_progress
  updated_at: "2026-08-30T18:00:00+09:00"
  evidence: docs/agent/evidence/W2-K2/
  priority: P0
  effort: L
  kind: new-l
  depends_on: [DA-01, DA-04]
  human_gate: true
  gate: human-required
  requires_intranet: false
  decisions: [D-210, D-257, D-259]
  blocker: |
    [2026-08-27 · **착수 금지 — backlog 로 등재만 한다**]
    코드 착수는 WP-DA2b(11월) 이고 그 전제는 WP-2 EXIT + 대표 승인이다 (D-259).
    지금 등재하는 이유는 착수가 아니라 **누락 방지**다 — 계약 필수(M) 기능이
    정본에서 빠져 있는 상태를 몇 주 유지하는 것이 실제 위험이다 (P-DA-2 B안).

    ★ **미해결 선행 1건 — 발송 채널 업체 선정은 개발 사안이 아니다.**
      SMS·푸시는 외부 유료 서비스이고 계약·비용 판단이 필요하다 (DA-04 D4-1).
      기한: WP-DA2b ENTRY(2026-10) 까지. 미정이면 메일 채널만으로 착수하고
      SMS·푸시는 어댑터 자리만 비워 둔다 — AC 30초는 채널 종류와 무관하다.
    ★ frontend/.../SurveillanceDashboard/components/NotificationsList 는 **화면단 목록**이다.
      발송 기능이 아니다. 재사용 대상으로 착각하지 말 것 — DA-01 OPEN-07 의 실측.

    ---
    [2026-08-30 · **커널 착수 — 실행 순서 ④ 승인부**] 위의 "착수 금지"는 이 지시로 풀렸다.
    지운 것이 아니라 **위의 문장을 그대로 두고 이어 적는다** — 언제·무엇으로 풀렸는지가
    기록이다.

    ▣ 이번 턴에 선 것 (backend/kernels/k2_notify/)
      · 공개 면 4개 전건 — resolve_recipients · send · suppress · list_deliveries
        (DA-04 §2 K2 표 그대로. `KernelPublicSurfaceTest` 가 표↔코드 일치를 판정한다)
      · 표 2개 — NotificationRule(등급×역할×구역) · DeliveryRecord(발송 이력)
        마이그레이션 `stream_monitors/0017`. **신규 표 생성만** — ALTER·DROP 0줄.
        D-283 4조건 이행: DDL 전문 첨부 · 역방향 확인 · 로컬 복제본 · 적용 후 게이트 green.
      · [F-10] 30초 판정을 **레코드에서** 읽는다 — `occurred_at → sent_at` 이 한 행에 있다.
        실패한 발송은 `sent_at=None` 이라 **아무리 빨라도 F-10 을 충족하지 않는다.**
      · 저하 운전 — 어댑터가 값으로 실패하든 예외로 죽든 관제가 서지 않는다.
        실측: 예외 경로가 처음에 파이프라인을 세웠고, `_ExplodingChannel` 시험이 잡았다.
      · 수신자 0명 → `NoRecipients` 예외. 빈 성공을 만들지 않는다 (DA-03 §3-2 · D-290).

    ▣ **아직 아닌 것** (이 티켓은 done 이 아니다)
      · dod (2) F-12 규칙 편집 화면 + 설정 감사로그 — 화면이 없다
      · dod (3) 재시도 **큐** — 지금은 `retry_count` 칼럼만 있고 재시도기가 없다.
        실패는 이력에 남지만 **자동으로 다시 보내지 않는다.** 이 사실을 초록으로 세지 않는다.
      · SMS·푸시·Webhook 어댑터 — D4-1(업체 선정) 대기. `channels.UNAVAILABLE` 에
        **사유와 함께** 등재돼 있고, 그 채널로 보내려 하면 실패 이력이 남는다.
      · 적재 판정 2건: **P-K2-1**(표를 어느 앱에 두는가) · **P-K2-2**(zone 이 무엇인가)
  reuse_targets:
    - backend/stream_monitors/models.py            # DetectionEvent — 발송 트리거의 원천 (K1)
    - docs/contracts/detection-event.md            # Severity 3종 — critical 이 F-10 발동 조건
    - backend/common/external_http.py              # 외부 발송 호출 타임아웃 규약 (W0-17)
    - backend/common/tenant_roles.py               # 수신그룹은 역할 5종 위에 얹는다 (K5)
  spec: |
    K2 알림 커널. **L3 Platform 구현 = 가이온 IP**(계약 8조3항) — App 은 소비만 한다.

      (1) 등급별 **수신그룹** 모델: 재난 등급 3종(주의·경계·심각) × 역할 5종 → 수신자 규칙.
          규칙 편집은 F-12(관리자 설정)이고 **설정 감사로그**가 남아야 한다.
      (2) 채널 어댑터: 메일 · SMS · 푸시. **채널은 교체 가능해야 한다** — 업체가 미정이므로
          인터페이스를 먼저 고정하고 구현체를 나중에 끼운다 (DA-02 와 같은 이유).
      (3) **발송 이력**: 무엇을 · 누구에게 · 언제 · 성공/실패 · 재시도. AC 판정의 유일한 근거다.
      (4) 저하 운전: 발송 업체가 죽어도 이벤트 처리·대시보드는 200 을 유지한다 (W0-17 패턴).
          발송 실패는 이력에 실패로 남고 재시도 큐로 간다 — 조용히 사라지지 않는다.
      (5) 이중 AC (DA-04 §2): [F-10 계약 AC] 심각 30초 내 발송 기록 ↔ [U2 상품 AC] 보고 자동화.
          충돌 시 **계약 AC 우선**.
    ⚠ 커널 규칙 1: K2 는 L3 에만. DSM App(L4)은 K2 의 API 만 부른다 — 모델 직접 import 금지.
       이 규칙은 정적 검사로 걸린다 (D-259 착수 조건 3).
  dod: |
    (1) 심각 등급 이벤트 발생 → **30초 이내** 발송 기록이 남는 것이 시험으로 판정된다 (F-10 AC)
    (2) 등급 x 역할 수신그룹 규칙이 F-12 화면에서 편집되고 설정 감사로그가 남는다
    (3) 발송 실패가 이력에 남고 재시도된다 — 조용한 유실 0건
    (4) 발송 업체 다운 시 이벤트 처리·대시보드 API 가 200 을 유지한다 (저하 운전 회귀시험)
    (5) App(L4) → K2 모델 직접 import 0건 (정적 검사 green)
  verify:
    - "python manage.py test tests.test_notification_kernel -v 2"

