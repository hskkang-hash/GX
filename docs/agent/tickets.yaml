  reuse_targets:
    - backend/config/settings.py
  spec: |
    settings.py L629 의 CORS_ALLOW_ALL_ORIGINS = True 때문에 바로 아래의
    CORS_ALLOWED_ORIGINS 허용목록이 **아무 효력이 없다.** 운영 배포에서 전 origin 을 허용한다.

    작업:
      1. CORS_ALLOW_ALL_ORIGINS 를 env.bool("CORS_ALLOW_ALL_ORIGINS", default=False) 로 내린다.
         하드코딩 True 를 지우는 것이 이 티켓의 전부다 (D-212: 설정 1곳).
      2. CORS_ALLOWED_ORIGINS 가 실제로 작동하는지 확인한다 — 허용목록에 없는 origin 의
         프리플라이트가 거부되어야 한다.
      3. 개발 편의는 .env 로만 연다. .env.example 에는 플레이스홀더/false 만 쓴다 (금지 #1).

    ⚠️ 지금 그냥 끄면 프런트 개발 서버·고객사 origin 이 즉시 막힌다. 회귀 범위가 넓어
       WP-2(릴리스 위생)에서 다른 항목과 함께 한 번에 검증한다 — 단독 선행 금지.
  dod: "CORS_ALLOW_ALL_ORIGINS 하드코딩 True 가 0건. 허용목록 밖 origin 의 프리플라이트가 거부되고, 목록 안 origin 은 통과한다."
  verify:
    - "grep -n 'CORS_ALLOW_ALL_ORIGINS *= *True' backend/config/settings.py && exit 1 || exit 0"
    - "grep -n 'CORS_ALLOW_ALL_ORIGINS' backend/config/settings.py"

