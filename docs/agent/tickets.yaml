- id: W2-2
  phase: R1
  title: "검출 결과 → 이벤트 수집 (중복 억제 포함)"
  kernel: ['K1']                     # 공유 커널 (지시서 v2.1) — F-01~F-04 ↔ U1 이중 AC
  status: verify-pending
  updated_at: "2026-08-29T12:00:00+09:00"
  evidence: docs/agent/evidence/W2-2/d284_detection_wiring.md
  priority: P0
  effort: M
  kind: bind
  depends_on: [W2-1]
  human_gate: false
