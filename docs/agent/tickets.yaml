    entry_doc: "docs/agent/review/<WP>/ENTRY.md"   # 범위·설계·영향·리스크
    exit_doc:  "docs/agent/review/<WP>/EXIT.md"    # DoD·보안·KPI 자가검증
    templates: "docs/agent/templates/"
    kpi_axes: [편리성, 완결성, 안정성, 참신성]      # WP 마다 측정·기록 (대표 지시사항)
