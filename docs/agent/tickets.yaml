- id: W0-0
  phase: R1
  title: "저장소 초기화 + 베이스라인 커밋 (최선행)"
  status: done
  priority: P0
  effort: S
  kind: ops
  depends_on: []
  human_gate: false
  gate: evidence-review
  requires_intranet: false
  decisions: [D-004, D-005, D-006]
  reuse_targets:
    - .gitignore
    - backend/.env.example
    - frontend/.env.example
    - yarn.lock
  spec: |
    ⚠️ 이 티켓이 모든 작업의 최선행이다. (D-004)
    현재 저장소에 커밋이 하나도 없다. 지금 최초 커밋을 만들면 실키 15개가 히스토리에 박힌다.
    따라서 반드시 아래 순서로 한다.
      1) .gitignore 정비: .env, .env.local, *.pem, ~/.guardianx-secrets 류 제외 확인
      2) 루트 yarn.lock 삭제(86바이트 빈 파일), npm 을 정본으로 확정 (D-006)
      3) backend/.env.example, frontend/.env.example 의 실값을 **플레이스홀더로 치환**
         형식: your-kakao-api-key-here / CHANGE_ME_DB_PASSWORD 등
         ⚠️ 치환 전 실값 백업은 저장소 밖 (D-002). 백업은 사람이 수행하며,
            에이전트는 "백업 완료 확인" 없이 치환하지 않는다 → 확인 없으면 STOP.
      4) 최초 커밋 생성. 이 커밋 SHA 를 meta.baseline_sha 에 기록 (D-005)
    실키는 단 한 번도 히스토리에 들어가지 않아야 한다.
  dod: |
    ① git log 에 커밋 1개 존재, 그 커밋의 .env.example 두 파일에 실값 0개
    ② meta.baseline_sha 가 tickets.yaml 에 기록됨
    ③ 루트 yarn.lock 부재 + .npmrc 에 legacy-peer-deps=true 커밋 (D-201)
    ※ package-lock.json 생성은 사내망 접속이 필요하므로 W0-8 로 분리한다 (D-205).
      W0-0 의 완료를 package-lock 에 걸지 않는다 — W0-1a/W0-2/W0-3/W0-4 가 불필요하게 막힌다.
  verify:
    # ⚠️ D-204: 탐지 정규식에 실제 시크릿 값을 넣지 않는다. 반드시 '형태'로 검사한다.
    - "git log --oneline | wc -l"
    - "git show HEAD:backend/.env.example | grep -Ec '^(DB_PASSWORD|MINIO_SECRET_KEY|SMTP_PASSWORD)=(?!CHANGE_ME|your-)' || true"
    - "git show HEAD:frontend/.env.example | grep -Ec '=(AIza|[0-9a-f]{32})' || true"
    - "test ! -f yarn.lock"

- id: W0-1a
  phase: R1
  title: "시크릿 게이트 구축 (치환 검증 + 로컬 훅 + CI 파일)"
  status: done
  priority: P0
  effort: S
  kind: ops
  depends_on: [W0-0]
  human_gate: false
  gate: evidence-review
  requires_intranet: false
  decisions: [D-001, D-003]
  reuse_targets:
    - backend/.env.example
    - frontend/.env.example
    - .gitignore
  spec: |
    D-001 에 따라 로컬 게이트를 실효 차단선으로, CI 파일은 선제 배치한다.
      1) .pre-commit-config.yaml : gitleaks protect --staged 훅 추가 + 설치
      2) .github/workflows/secret-scan.yml : gitleaks-action (원격 생성 시 자동 동작)
      3) .gitlab-ci.yml : secret_detection 템플릿 (둘 다 두어도 무해)
      4) 커스텀 룰 추가: GCS_APIKEY 와 VITE_CGS_APIKEY 의 **값이 같으면 FAIL** (D-003 단계2)
      5) 차단 동작을 1회 재현하고 로그를 evidence 에 남긴다
         (더미 키를 스테이징 → 커밋 시도 → 차단됨 확인 → 되돌리기)
  dod: |
    ① .env.example 두 파일 실값 0개
    ② pre-commit 훅이 시크릿 포함 커밋을 실제로 차단하는 것을 1회 재현(로그 증거)
    ③ .github/workflows/secret-scan.yml 와 .gitlab-ci.yml 존재
    ※ '원격 CI 잡 green' 은 W0-6 으로 이연 (D-001)
  verify:
    - "test -f .pre-commit-config.yaml && test -f .github/workflows/secret-scan.yml"
    - "gitleaks detect --no-git --source . --exit-code 1"

