- id: DA-03
  phase: R1
  title: "화면설계안 — F-09 재난 대시보드 · F-12 관리자 설정 (User Flow 5종 기준)"
  status: done
  updated_at: "2026-08-27T10:00:00+09:00"
  evidence: docs/design/DA-03_화면설계안_v1.0.md
  blocker: |
    [2026-08-25 · **dod ①~④ 충족. 3초 KPI 의 측정 지점을 못박았다**]
    전문: docs/design/DA-03_화면설계안_v1.0.md

    ★ **"클릭→영상 3초"를 재는 두 점을 정의했다** (§2-4):
      t0 = 카드 클릭 핸들러 진입 / t1 = video 첫 프레임 페인트. **AC 는 t1-t0 ≤ 3.0초.**
      스냅샷을 먼저 그려 체감을 0 으로 만들되 **AC 판정은 영상 첫 프레임으로 한다** —
      스냅샷으로 3초를 통과했다고 주장하지 않는다. 검수는 p50/p95 분포로 보고한다.
      정하지 않으면 이 KPI 는 판정 불가였다.

    ★ **5상태 작업량의 실체: 로딩은 이미 있다.** Skeleton 5종이 실재하므로
      **신규는 빈·오류·권한없음 × 위젯 수**다. 위젯별 적용표를 §2-5 에 냈다(검수 판정표).

    ★ **스피너 고착이 이 화면의 실제 실패 모드다** (W0-18 프론트 실측 인용).
      무보호 호출 21곳의 증상은 흰 화면이 아니라 영원한 로딩이다 —
      즉 **로딩 상태가 오류 상태를 삼킨다.** 그래서 신규 위젯 전건에 로딩 타임아웃 10초를
      걸고 초과 시 오류로 전이시킨다. F-09 의 숨은 필수 요건이다.

    ★ **T9 의 가장 중요한 규칙: 오류 상태에서 폼을 빈 값으로 그리지 않는다** (§3-5).
      불러오기 실패를 "설정 없음"으로 그리면 관리자가 저장을 눌러 **실제 설정을 빈 값으로 덮는다.**

    미정 3건(네트워크 링크 표현 · 3계층 프리셋 관계 · 목록 기본 필터)은 §5 에 사유·시점과 함께.
    review 사유: human_gate.

    ---
    [2026-08-27 · **대표 승인 — done**] D-256. P-DA-4 → A 확정으로 "5상태 = 화면 상태 5종"이
    이 문서의 전제로 굳는다. 미정 3건은 WP-DA2c(12월 · F-09/F-12 구현) ENTRY 의 입력으로 이월한다.
  priority: P0
  effort: M
  kind: doc
  depends_on: [DA-01]
  human_gate: true
  gate: human-required
  requires_intranet: false
  decisions: [D-207]
  reuse_targets:
    - frontend/src/features/Dashboard/SurveillanceDashboard   # F-09 가 확장할 실제 화면
    - backend/dashboard/models.py                             # Dashboard·DashboardPanel 스키마
    - backend/surveillance/views/surveillance_dashboard_view.py
    - backend/stream_monitors/models.py                       # DetectionEvent.Severity — 색 규약의 근거
    - frontend/src/features/operationSetting                  # F-12 가 확장할 설정 화면
    - frontend/src/features/surveillanceProfile               # 위험구역·임계값 설정의 기존 자리
  spec: |
    지시서 §4 User Flow 5종을 화면으로 내린다. **F-09 와 F-12 두 화면만** 이 티켓 범위다.
      ① Flow 별 화면 전이도(누가 → 어디서 → 무엇을 누르면 → 무엇이 나오는가).
         완료 판정은 코드가 아니라 화면이라는 원칙(v2.0 §0.1-3)을 이 문서가 떠받친다.
      ② F-09: 5상태 100% 표출 + **클릭→영상 3초**(KPI). 3초를 어디서 재는지(클릭 시각 →
         첫 프레임 렌더)를 문서에 못박는다. 재는 자리를 정하지 않으면 KPI 가 판정 불가다.
      ③ 심각도 색 규약은 DetectionEvent.Severity 3종(info·warning·critical)을 그대로 쓴다.
         ISA-101 — 빨강은 critical 전용. 새 등급을 만들지 않는다.
      ④ F-12: 무권한 차단 + **설정 감사로그**. 역할 5종 × 설정항목 가시/편집 매트릭스.
      ⑤ 신규 화면은 AntD 로 만든다. **기존 화면 개종 금지**(§0.4). 지도는 *Unified 래퍼만.
      ⑥ 저충실도(레이아웃·영역·상태)까지만. 픽셀 시안은 이 티켓 범위가 아니다.
    ⚠ 코드 변경 금지. .tsx 를 만들지 않는다.
  dod: |
    ① docs/design/DA-03_화면설계안_v1.0.md 가 존재하고 Flow 5종 전건이 전이도로 있다
    ② F-09·F-12 각각의 영역 구성·상태·빈/오류 상태가 정의돼 있다
    ③ 3초·30초 KPI 의 **측정 지점**이 문서에 지정돼 있다
    ④ 역할 5종 × 설정항목 가시/편집 매트릭스가 있다
    ⑤ 대표 승인 (human_gate)
  verify:
    - "test -f docs/design/DA-03_화면설계안_v1.0.md"
    - "git diff --name-only HEAD~1 -- frontend/ | wc -l | grep -qx 0"

- id: DA-04
  phase: R1
  title: "공유 커널 6종 API 스펙 (K1~K6) — F 계약 AC ↔ U 상품 AC 이중 태깅표"
  kernel: [K1, K2, K3, K4, K5, K6]   # 이 티켓이 커널 정의의 정본이다
  status: done
  updated_at: "2026-08-27T10:00:00+09:00"
  evidence: docs/design/DA-04_공유커널_API스펙_v1.0.md · scripts/verify_kernel_map.py
  blocker: |
    [2026-08-25 · **dod ①~④ 충족. 커널 6종 정의 + kernel: 필드 18건 정본 반영**]
    전문: docs/design/DA-04_공유커널_API스펙_v1.0.md

    ★ **겹침은 9건이 아니라 7건이다.** 지시서 v2.1 은 "F 14개 중 9개가 U와 겹침 ·
      공수 ~40% 절감"이라 적고 스스로 추정이라 표시했다. 실측 대조: **7건**
      (F-04·05·09·10·11·12·14). F-06·07 은 SDN 어댑터라 U 와 겹치지 않는다.
      절감률은 WP-DA2 착수 시 티켓별 공수 추정으로 갱신한다 (D-210).

    ★ **K2 알림 커널에 대응 티켓이 0건** — 6개 커널 중 하나가 비어 있다 → P-DA-2.
      이 GAP 은 커널 매핑을 기계로 대조했기 때문에 드러났다. 손으로 셌으면 6/6 으로 보였을 것이다.

    ★ **"U1~U4 티켓"은 존재하지 않는다** — U 는 상품화 2단계의 WP 묶음이고
      D-246 이 이미 그렇게 쓴다(U1=WP-3). 지시서의 표현은 근사치라 실측대로
      해당 WP 의 개별 티켓 18건에 `kernel:` 을 넣었다 (D-210).
      문서 §4 표와 정본의 일치는 `python scripts/verify_kernel_map.py` 가 판정한다 — **대조 통과.**

    ★ **KPI 2건은 선언이 아니라 게이트여야 한다** (§5). 재사용률을 사람이 세면 항상 90% 가 나온다.
      "App 이 커널 모델을 직접 import 하지 않는다"를 **정적 검사**로 걸 것을 WP-DA2 조건으로 올린다.
      이 규칙이 IP 경계(계약 8조)의 코드상 표현이다 — 커널 로직이 App 으로 새면 경계가 소멸한다.

    ID 충돌 검사(D-246 교훈): DA-01~04 는 기존 정본 ID 집합과 충돌 없음. manifest 71→75 통과.
    review 사유: human_gate.

    ---
    [2026-08-27 · **대표 승인 — done**] D-256. §5 가 올린 조건(App 이 커널 모델을 직접
    import 하지 않는다 = 정적 검사)은 D-259 로 **WP-DA2 착수 조건**에 편입됐다.
    K2 GAP 은 D-257 로 닫힌다 — 티켓 `DA2-21` 등재. 이 티켓의 §4 매핑표도 함께 갱신했고
    `python scripts/verify_kernel_map.py` 가 그 일치를 판정한다.
  priority: P0
  effort: M
  kind: doc
  depends_on: [DA-01]
  human_gate: true
  gate: human-required
  requires_intranet: false
  decisions: [D-207, D-210, D-212, D-246]
  reuse_targets:
    - docs/agent/GuardianX_상품화_개발방안_20260822.pdf   # U1~U4 의 정의 원본
    - docs/design/DA-01_요구사항정의서_v1.0.md            # F-01~F-14 의 AC
    - docs/contracts/detection-event.md                   # K1 이 이미 가지고 있는 계약
    - backend/stream_monitors/models.py                   # K1 의 실제 저장소
    - backend/report_template/models.py                   # K4 의 실제 엔진
    - backend/common/tenant_roles.py                      # K5 의 판정 한 곳
  spec: |
    지시서 v2.1 "초효율 병행 전략 — 공유 커널"의 설계 산출물. **한 번 개발해 두 번 판다**를
    문서로 강제한다. 커널은 전부 **L3 Platform** 구현이고 그러므로 **가이온 IP** 다(계약 8조).

      ① 커널 6종의 **API 스펙**(입력·출력·오류·소유 계층)을 쓴다.
         K1 이벤트 / K2 알림 / K3 역할별 대시보드 프레임 / K4 보고서 엔진 /
         K5 신뢰(격리·감사·저하운전) / K6 피드백·계측.
      ② ★ **이중 AC 표가 이 티켓의 본체다.** 커널 하나마다
         [F-xx 계약 AC] 와 [U-x 상품 AC] 를 나란히 적고, **둘을 동시에 충족하는 하나의 구현**을
         정의한다. 충돌 시 **계약 AC 가 우선**한다(지시서 v2.1 규칙 2).
      ③ 규칙 1 을 문서로 못박는다: 커널은 L3 에만. App(L4)·어댑터(L2)는 **소비만** 한다.
         커널 로직이 App 으로 새면 IP 경계가 코드에서 사라진다.
      ④ 기존 정본 티켓과의 상호 참조표를 낸다 — 어느 W 티켓이 어느 커널을 만드는가.
         (tickets.yaml 의 `kernel:` 필드가 그 매핑의 기계 판독본이다.)
      ⑤ **커널 없는 요구를 숨기지 않는다.** 대응 티켓이 정본에 없는 커널은 GAP 으로 등재한다.
    ⚠ 코드 0줄. Mock 구현도 이 티켓이 아니다.
    ⚠ U1~U4 는 **티켓 ID 가 아니라 상품화 2단계의 WP 묶음**이다(D-246 이 U1=WP-3 으로 이미 사용).
       지시서 v2.1 의 "U1~U4 티켓" 표현은 근사치다 — 실측대로 WP·티켓에 매핑했다(D-210).
  dod: |
    ① docs/design/DA-04_공유커널_API스펙_v1.0.md 가 존재하고 K1~K6 전건이 스펙으로 있다
    ② 커널마다 [F AC] × [U AC] 이중 태깅표가 있고, 충돌 시 우선순위가 명시돼 있다
    ③ 커널 ↔ 기존 정본 티켓 상호 참조표가 있고 tickets.yaml 의 kernel: 필드와 일치한다
    ④ 대응 티켓이 없는 커널이 GAP 으로 등재돼 있다
    ⑤ 대표 승인 (human_gate)
  verify:
    - "test -f docs/design/DA-04_공유커널_API스펙_v1.0.md"
    - "python scripts/verify_kernel_map.py"

# --- 2026-08-27 신설 (지시서 v2.2 Code 지시 · 대표 승인 D-258) ---
- id: DA-05
  phase: R1
  title: "데이터 어댑터 4종 · K7 컨텍스트 커널 API 스펙 (지시서 v2.2 Data IN/OUT)"
  status: ready
  updated_at: "2026-08-27T10:00:00+09:00"
  priority: P1
  effort: M
  kind: doc
  depends_on: [DA-01, DA-04]
  human_gate: true
  gate: human-required
  requires_intranet: false
  decisions: [D-204, D-207, D-210, D-258]
  reuse_targets:
    - backend/common/external_http.py              # 외부 호출 타임아웃 규약 (W0-17)
    - backend/third_api/                           # 기존 외부 연동 어댑터 관례
    - docs/design/DA-04_공유커널_API스펙_v1.0.md   # K1~K6 — K7 은 그 서식을 따른다
    - docs/contracts/detection-event.md            # K7 이 먹이는 F-04 의 입력 계약
    - docs/agent/evidence/W0-17/                   # 저하 운전 패턴 — 소스 장애 시 영상 단독 판정
  spec: |
    지시서 v2.2 "데이터 전략"의 설계 산출물. **문서만. 코드 0줄.**

      (1) L2 데이터 어댑터 4종의 스펙: 기상(apihub.kma.go.kr) · 재난안전(safetydata.go.kr) ·
          수위/공공(data.go.kr) · 위성(NASA FIRMS). 넷은 **독립·교체 가능**해야 한다 —
          한 소스가 죽어도 나머지가 산다.
      (2) L3 **K7 컨텍스트 커널**: 4종을 정규화·캐시해 **하나의 context 로** 내놓는다.
          F-04 규칙이 소비하는 것은 어댑터가 아니라 K7 이다 (커널 규칙 1 — 어댑터는 L2).
      (3) ★ **저하 운전이 이 커널의 기본 상태다.** 외부 데이터는 **보조 신호**이고,
          소스 장애 시 **영상 단독 판정으로 떨어진다**(W0-17 패턴). 이것을 예외가 아니라
          정상 경로로 설계한다 — 무상 공공 API 의 가용성은 우리 통제 밖이다.
      (4) 융합 규칙 FX-1~FX-4 를 F-04 규칙 스키마의 `context` 조건으로 표현한다.
          **코드 무변경으로 규칙만 바뀌어야 한다**(F-04 AC: JSON 무재기동 반영).
      (5) Data OUT: 수신기관 프로필(유형·등급 필터·채널·유무상 키) 1테이블을 K1 에 얹는 안.
          기관별 신규 연동을 만들지 않는다 — 전부 F-05 + Webhook 하나로 나간다.
      (6) 키는 문서에 값을 적지 않는다. 비밀저장소 참조만 (D-204).
    ⚠ **계약과의 경계를 문서 머리에 못박는다**: F-01~14 의 AC 는 외부 데이터와 **무관**하다.
       K7 은 상용판 확장이고 코드 착수는 **2027.2~**(WP-DA4). 12월까지는 계약 M 기능에 집중한다.
    ⚠ 예외 단 1건: 10~12월에 **F-04 규칙 스키마에 `context` 필드만 예약**한다(빈 채로).
       나중에 스키마를 바꾸면 이미 저장된 규칙을 전부 이관해야 한다 — 그 비용을 지금 0 으로 만든다.
    ⚠ 선행 확인 2건(대표·법률): (a) 지자체 데이터 소유권 — 라이선스 표준계약에 "비식별 이벤트
       메타 제3자 제공 동의" 조항 (b) 유상 판매는 개인정보·위치정보법 검토 후. 문서에 미결로 남긴다.
  dod: |
    (1) docs/design/DA-05_데이터어댑터_K7_API스펙_v1.0.md 가 존재하고 어댑터 4종 + K7 이 스펙으로 있다
    (2) 소스 장애 시 저하 운전 경로가 **소스별로** 정의돼 있다 (전부 죽어도 영상 단독 판정)
    (3) FX-1~FX-4 가 F-04 규칙 JSON 예시로 표현돼 있고, `context` 필드 예약 위치가 지정돼 있다
    (4) Data OUT 수신기관 프로필 스키마가 있고, 신규 연동 없이 기관을 늘릴 수 있음이 보인다
    (5) 문서에 실제 인증정보 값이 0건이다 (gitleaks)
    (6) K7 을 DA-04 §4 매핑표와 verify_kernel_map.py 의 대상 커널에 **함께** 편입한다
        (지금 편입하지 않는 이유: K7 스펙이 없는 상태에서 kernel: 필드만 넣으면 검증 밖에서 떠돈다)
    (7) 대표 승인 (human_gate)
  verify:
    - "test -f docs/design/DA-05_데이터어댑터_K7_API스펙_v1.0.md"
    - "gitleaks detect --source docs/design --no-git"
    - "python scripts/verify_kernel_map.py"

