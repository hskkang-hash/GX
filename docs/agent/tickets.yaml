    11GB 폴더는 통째로 복사·전달되기 쉬운 형태다.

    조치(완료): C:\GuardianX-vault\secrets-20260210\ 로 격리. 삭제는 하지 않았다 —
      docker-compose 가 env_file 로 참조(L128·L156·L183)해 지우면 기동이 깨진다.
      원위치에 README_MOVED.md(경로·복원절차·폐기시점)를 남겼다. 값은 읽지 않았다(D-204).

    ★ 티켓이 몰랐던 항목 1건: DJANGO_SECRET_KEY.
      세션·CSRF·토큰 서명의 뿌리다. 나머지 15개를 다 바꿔도 이것이 남으면 세션 위조가 된다.
      → 재발급 대상 15 → 16 으로 늘려야 한다 (dod 수정은 대표 승인 사항).

    ★ VITE_* 5개는 브라우저 번들에 실려 이미 배포됐다. 공개된 것으로 간주하고
