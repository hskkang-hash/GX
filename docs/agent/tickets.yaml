    requires_intranet: true 는 이제 거짓이다 — 회수 경로 A 로 대체됐다 (AGENT_LOOP v4.1 STEP 0-6).

    ★ 확인항목 1 — performance_bypass_models 는 dj-core 에 **0건.** 그 목록은 저장소 소유이고
      W0-2 범위 안에 전부 있었다. 다만 **찾지 않았던 두 번째 우회 목록 grid_models(11종)** 이 있다.
      app_label == 'advanced_table' 로 이중 가드되고 저장소에 그 앱이 없어 지금은 무해하나,
      "우회 목록은 하나뿐"이라는 전제가 깨졌으므로 등록부에 올렸다 (findings §5-1).

    ★ 확인항목 2 — created_by__isnull OR 는 **3건** (base.py L398·L430·L439).
      **L430 이 이 조사 전체에서 가장 중요한 발견이다**: group FK 가 제대로 있는 모델에서조차
      Q(group=user_group) | Q(created_by__isnull=True) 로 되어 있다. 폴백이 아니라 명시적 OR 다.
      created_by 가 NULL 인 행(시스템 생성·마이그레이션 적재·배치 삽입)은 전 테넌트에 열린다.

    ★ WP-1 EXIT §6 #5 의 판정이 뒤집힌다. 실효 범위는 "17종 중 2종"이 아니라 **13 : 2** 이고
      고칠 수 있는 쪽이 2, 고칠 수 없는 쪽(dj-core · §0.4)이 13이다. 그 13에 DetectionEvent 와
      StreamMonitor 가 들어 있다.

    → **W0-13 은 필터를 고치는 티켓이 될 수 없다.** C안(W0-14 뷰 레벨 스코프 우회)만 남는다.
      findings §5-4. 대표 판정 대기 — 이것이 WP-1 EXIT §7 신규 7-1 의 답이다.
      부수: 이 발견은 W0-14 의 설계(라우트에 스코프를 건다)가 처음부터 옳았음을 사후 증명한다.
