# ── 턴 R 병합 (2026-09-16 · 조율자) ─────────────────────────────────────────
# 태어난 것 넷: WS-01 · WS-03 · WS-04 · WS-13. 넷 다 `EVENT_ENTRY_SURFACE` 에 이름으로
# 등재됐고(그 손이 곧 「진입면을 넓힌다」는 선언이다), 문지기는 전건
# `@tenant_scoped` + `JwtOrInboundKey()` 기본값(들어오는 키 거절)이다.
#
# ⚠ **이 표에 없는 쓰기 면이 하나 태어났다** — `POST /api/dsm/settings/webhook-subscriptions/issue`
#   (U56 · P-145 구독+서명키 한 동작). 선등록 표는 이 면을 예상하지 못했다: 파 1 계획에서
#   U56 의 웹훅 항목은 WS-17 「filters」 하나였고, 「서명키를 우리가 만든다」는 판정(P-145)이
#   턴 R 에 와서야 섰기 때문이다. 이 표의 값은 **없던 면이 조용히 태어나는 것을 막는 것**이므로,
#   빠뜨린 사실을 지우지 않고 여기 적는다 — 선등록이 실패한 자리도 기록이다.
#   다음 파의 선등록은 「세종 판정이 그 턴에 새로 서는 면」 자리를 함께 잡는다.
#
# ⚠ WS-14 `notify-rules` 는 **태어나지 않았다.** U56 이 화면 골격만 세웠고
#   `GET/POST /settings/notify-rules` 는 저장소에 없다(차선이 실측으로 확인). born: false 유지.

# ── 턴 S 선등록 (2026-09-16 · 조율자 20분 ⑤) ────────────────────────────────
# 지시서 §3 조율자 ⑤ 「쓰기 면 선등록 — 웹푸시 구독 · 알림 규칙 · 재판정 · 회신」.
# 넷을 표에 대 보니 **새 줄이 필요한 것은 하나도 없었다.** 그 사실이 이 턴의 선등록이다:
#
#   웹푸시 구독 → **WS-08** (U3 · push-subscriptions) — 이번 턴 목표. 파 1 에 자리만 잡고
#                 안 태어난 줄이다. 차선 U3 에게 「네가 낸 경로 문자열을 그대로 보고하라」고
#                 일렀다 — 내가 짐작해서 `path` 를 채우면 그 순간 선등록이 추측이 된다.
#   알림 규칙   → **WS-14** (U56 · notify-rules(+test)) — 이번 턴 목표. 위 ⚠ 가 적은 그 줄.
#   재판정     → **새 면이 아니다.** `POST /api/dsm/events/{int:event_id}/review` 가 이미
#                 서 있고(진입면 등재 완료 · D-290 으로 거절을 422/404/403 으로 나눴다),
#                 U24 가 하는 일은 **목록 화면에도 그 버튼을 다는 것**이다. 문이 아니라 손잡이다.
#   회신       → **새 면이 아니다.** `POST /api/dsm/events/{int:event_id}/field-reply` 에
#                 `kind` 칸이 붙는다(U3). 같은 문에 칸이 느는 것은 진입면이 넓어지는 것과
#                 다르다 — 그러나 **문지기는 다시 본다**: kind 마다 쓰는 사람이 다르면
#                 한 라우트가 여러 권한을 겸하게 되고, 그것이 IDOR 이 태어나는 모양이다.
#                 병합 때 조율자가 `test_f05_event_api` 가 아니라 **테넌트 격리 시험**으로 잰다.
#
# ⚠ 이번 턴 차선 셋(U1·U24·U56)은 `backend/apps/dsm/api.py` 를 못 고친다 — **U3 한 차선만**
#   고친다. 한 파일을 두 차선이 같은 턴에 고치면 충돌하고, 충돌한 라우트는 **라우팅 침묵**이
#   된다(D-410). 나머지 셋은 커널·서비스까지 짓고 **배선 명세 한 줄**을 조율자에게 넘기며,
#   문을 다는 것도 이 표의 `path` 칸을 채우는 것도 병합에서 조율자가 한다.
#   → 그래서 이번 턴에 이 표가 `born: true` 로 바뀌는 줄은 **병합 뒤에야** 생긴다.
#
# ⚠ 또 하나 — 턴 R 의 실패를 되풀이하지 않기 위해: 위 ⚠ 가 적은 「세종 판정이 그 턴에 새로
#   서는 면」 자리다. 이번 턴 판정은 P-154~P-158 이고 **그중 쓰기 면을 새로 내는 판정은
#   없다**(전부 대장·상태 파일·측정 규약·push). 그래서 이번 턴에 표 밖에서 태어날 면을
#   예상하지 못할 자리는 **U3 의 웹푸시 발송 쪽**뿐이다 — 구독(WS-08)은 표에 있으나
#   「발송」은 없다. 발송이 라우트로 태어나면 그것은 표 밖의 면이고, 병합에서 그 사실을
#   지우지 않고 여기 적는다.

# ── 턴 S 병합 결과 (2026-09-16 · 조율자) ───────────────────────────────────
# 태어난 것 넷: WS-02 · WS-08 · WS-10 · WS-14. 넷 다 `EVENT_ENTRY_SURFACE` 에 이름으로
# 등재했다(이번 턴 진입면 **16줄** — U1 1 · U24 4 · U56 4 · U3 7).
#
# ⚠ **표 밖에서 하나가 태어났다 — 그리고 이번엔 그 자리를 미리 적어 두었다.**
#   `POST /api/dsm/push-subscriptions/test-send` (U3 · 「내 기기로 지금 한 통」).
#   위 선등록 블록의 마지막 문단이 **「예상 못 할 자리는 U3 의 발송 쪽뿐」** 이라 적었고,
#   실제로 거기서 났다. 턴 R 에는 표 밖 탄생을 **사후에** 발견했는데(`webhook-subscriptions/
#   issue`), 이번에는 **어디서 날지를 먼저 적고 그 자리에서 났다.** 표의 값은 「빠짐없이
#   예언하는 것」이 아니라 **밖에서 태어난 것을 드러내는 것**이므로, 적중도 누락과 똑같이
#   기록한다. 다음 파의 선등록은 「구독」과 「발송」을 **처음부터 두 줄로** 잡는다.
#
# ⚠ **U3 가 청한 커널 공개 한 줄은 넣지 않았다** —
#   `send_webpush(*, scope, subscription, title, body)` (구현은 `k2_notify/channels.py::
#   WebPushChannel.send` 에 이미 있다). 지금 넣으면 **아무도 부르지 않는 공개 면**이 되고,
#   그것이 이번 턴에 우리를 문 바로 그 잠든 코드다(D-377 「켜진 상태로 태어나야 한다」).
#   부를 쪽(U3 의 실발송)과 **같은 커밋에서** 연다. 그때까지 U3 의 화면은 「발송 문이 아직
#   없다」를 빈칸이 아니라 말로 적고 있다.
#   ⚠ 실발송 전제가 더 있다: `pywebpush`·`py_vapid`·`http_ece`·`ecdsa` 미설치 · VAPID 환경
#     변수 3개 없음 · 받을 기기 없음. 그래서 잠금화면 도달 캡처는 **이번 턴에 없다** —
#     「못 했다」이지 「했는데 안 됐다」가 아니다.

# ── 턴 T 선등록 (2026-09-17 12:20 · 조율자 20분) ────────────────────────────
# 지시서 §3 「쓰기 면 선등록(M4 prefs · 웹푸시 발송 · stats · audit read · webhook filters · health)」.
# 턴 S 의 교훈 그대로 — 「구독」과 「발송」을 **처음부터 두 줄로** 잡고, 「세종 판정이 이 턴에
# 새로 서는 면」(P-160 발송 · P-162 회귀 · P-164 다섯 차선) 자리를 먼저 적는다.
#
#   M4 prefs       → **새 면 아님.** `GET/PUT /api/dsm/me/notify-prefs` 가 턴 S 에 이미 섰다
#                    (진입면 16 안). 이 턴은 같은 문에 칸이 는다(quiet_start/quiet_end · zone_ids ·
#                    channels ∈ {email, webpush} · 승인 상태). 문지기는 다시 본다 — 채널 목록에
#                    `sms` 가 들어오면 422 (대표 결정 ① 문자 범위 밖).
#   웹푸시 발송    → **WS-08′ (표 밖에서 태어난 것을 이번엔 표 안에 미리 적는다)**
#                    `POST /api/dsm/push-subscriptions/test-send` (턴 S 표 밖 탄생 · 이번 턴 실발송
#                    경로가 이 문을 탄다 · U3). 새 라우트가 아니라 **뒤가 실제로 이어지는 것**이
#                    이 턴의 변화다: 훈련 사건 → 규칙 → 구독자 → WebPushChannel.send → deliveries.
#                    `send_webpush` 커널 공개는 **부르는 쪽과 같은 커밋** — 턴 S 에 안 넣은 그 줄.
#   stats          → 읽기 면(`GET /api/dsm/stats/*` · 턴 S U24 4줄) 위의 **CSV 반출 1** —
#                    `GET /api/dsm/stats/export.csv` 류(U24 가 낸 문자열을 그대로 받는다 · 짐작 안 함).
#                    반출은 쓰기가 아니지만 **반출 면**이라 진입면과 반출 대장(P-133 계열) 둘 다 본다.
#   audit read     → **읽기 면** `GET /api/dsm/audit` (U24 · 필터 3 · U2/U4/U5 만 · 테넌트 격리 시험).
#                    쓰기 면이 아니라 이 표의 줄은 아니다 — 그러나 감사 기록은 **읽는 것도 기록**이
#                    남는 자리라 여기 적는다.
#   webhook filters→ **WS-17** (U56 · 파 1 계획의 그 줄 · 이번 턴 목표). 기존 `webhook-subscriptions`
#                    body 에 filters 칸 — 새 라우트가 필요하면 U56 이 낸 문자열로.
#   health         → **공개 읽기 면** `GET /api/dsm/health` (U56 · 인증 없음 · 200/503).
