# WO-GX-20260915-01 §4.1 「쓰기 면(파 1 첫 30분 선등록)」 — 턴 Q 조율자 등록부
#
# 왜 먼저 적나 — 새 쓰기 면이 태어나기 **전에** 이름·차선·자리를 적어 두면, 병합 때
#   「이 표에 없는 쓰기 라우트」가 곧 소유권 밖에서 태어난 것이 된다(한 파일은 한 차선).
# 언제 `born: true` 가 되나 — 라우트가 실재하고 ISO-03(테넌트 스코프) · SEC-04(인증 관문) ·
#   계약 도달을 통과했을 때. 조율자가 병합 때 적는다. 차선이 스스로 참으로 바꾸지 않는다.
# ⚠ 지시서(WO-01 §6 파 1 조율자 · AC-9)는 「13」이라 적었다. §4.1 표의 쓰기 면 칸을 한 줄씩
#   옮기면 아래 줄 수가 된다 — 수는 이 파일을 세는 쪽이 낸다(분모는 손으로 적지 않는다).
#   `me/notify-prefs` 는 F(스키마)와 U3(라우트) 두 칸에 나오므로 한 줄로 합쳤다.
#   어긋남은 턴 Q 보고의 가정 목록에 적는다.
# 경로는 지시서의 이름을 그대로 옮긴 **자리 이름**이다 — 최종 경로는 태어날 때 차선이 정하고
#   조율자가 `path` 칸을 채운다.

