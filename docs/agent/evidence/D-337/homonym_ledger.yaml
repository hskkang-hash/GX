# 「같은 이름, 다른 것」 대장 (homonym ledger) — D-337
#
# 이름의 유사성으로 오판한 것이 네 번이다. 네 번 다 **같은 병**이다:
# 두 개의 다른 것이 한 이름을 쓰고 있었고, 그 이름을 단독으로 읽는 순간 한쪽이 다른 쪽으로 보였다.
#
# 규칙
#   · 이름이 겹치는 것을 발견하면 **즉시 등재한다.** 나중에 몰아서 적지 않는다
#   · 등재된 이름은 코드·대장·문서에서 **단독으로 쓰지 않는다** — 반드시 방향이나 주체를 붙인다
#   · `distinguished_by` 는 **무엇으로 가르는가**를 적는다. "다르다"가 아니라 **가르는 기준**이다
#
# 강제: scripts/verify_homonyms.py — 등재된 이름이 수식어 없이 **새로** 등장하면 exit 1.
#       기존분은 래칫(D-311) — 소급 사유를 요구하지 않는다.

meta:
  version: "1.0"
  updated_at: "2026-09-07"
  note: |
    이 대장은 「무엇이 무엇이 아닌가」를 적는 곳이다. 무엇인가를 적는 곳이 아니다.
    정의는 각자의 자리(계약 절·표·결정문)에 있다. 여기 있는 것은 **혼동의 기록**이다.

entries:
  - name: "CCTV · 재난안전정보"
    found_in: D-321
    found_at: "2026-09-05"
    sense_a:
      label: "설치 위치 메타데이터"
      what: "행정안전부가 공개하는 CCTV 설치 지점 목록 — 좌표와 관리기관"
    sense_b:
      label: "영상 스트림"
      what: "우리가 실제로 받아 분석하는 RTSP 화면"
    distinguished_by: |
      **무엇이 흐르는가.** A 는 표(행)가 흐르고 B 는 바이트(프레임)가 흐른다.
      「CCTV 데이터를 받는다」는 문장은 둘 다로 읽힌다 — 그래서 이 문장을 쓰지 않는다.
    cost: "공개 데이터로 영상을 얻을 수 있다고 읽었다. 얻을 수 있는 것은 위치뿐이었다."

  - name: "juso 승인키"
    found_in: D-328
    found_at: "2026-09-06"
    sense_a:
      label: "팝업 UI 위젯 키"
      what: "브라우저에서 주소검색 창을 띄우는 공개 클라이언트 키. URL 제한이 방어선"
    sense_b:
      label: "서버 조회 API 키"
      what: "서버가 좌표·주소를 질의하는 비밀 키"
    distinguished_by: |
      **누가 그 키를 들고 있는가.** A 는 브라우저(그래서 공개다), B 는 서버(그래서 비밀이다).
      취급 등급이 정반대라 한 칸에 두면 **공개 키를 비밀처럼 지키거나 비밀 키를 공개한다.**
    cost: "발급받은 키로 서버 조회를 시도할 계획을 세웠다. 그 키로는 할 수 없는 일이었다."

  - name: "API Key"
    found_in: D-337
    found_at: "2026-09-07"
    sense_a:
      label: "나가는 키 (outbound)"
      what: "우리가 남의 API 를 부를 때 우리가 제시하는 키. 표 ②(자격증명 저장처)가 관리한다"
    sense_b:
      label: "들어오는 키 (inbound)"
      what: "남이 우리 OpenAPI 를 부를 때 그쪽이 제시하는 키. FR-05-3 이 정의한다"
    distinguished_by: |
      **방향.** 호출을 누가 시작하는가로 갈린다.
      표 ②는 A 만 담고, F-05 진입면은 B 만 쓴다. **표 ②가 F-05 를 갚지 않는다.**
    naming: "코드에서는 outbound_api_key / inbound_api_key 로 쓴다"
    cost: "표 ② 하나가 절 두 개를 갚는 것으로 계산했다. 잔여가 10 이 아니라 12 였다."

  - name: "권한 · 인증 (authz 와 authn)"
    found_in: D-342          # 처음 부딪힌 것은 D-334, 대장에 이름을 확정한 것은 D-342
    found_at: "2026-09-07"
    sense_a:
      label: "인가 (authorization · authz)"
      what: "@path_permission — 이 사람이 이 자원에 **무엇을 할 수 있는가**. 역할·경로 대장을 본다"
    sense_b:
      label: "인증 (authentication · authn)"
      what: "route 의 auth= 콜백 — **이 사람이 누구인가**. 없으면 익명이 그대로 통과한다"
    distinguished_by: |
      **질문이 다르다** (D-342). A 는 「무엇을 할 수 있나」를 묻고 B 는 「누구인가」를 묻는다.
      관문의 종류로도 갈린다: A 가 꺼지면 「아무 역할이나 통과」, B 가 꺼지면 「아무나 통과」.
      ★ 둘을 한 칸에 두면 **양쪽으로 틀린다**:
        「주석 처리된 권한 = 인증이 꺼졌다」로 읽으면 24자리를 사고로 세고,
        「권한이 꺼졌을 뿐」으로 읽으면 15자리 **열린 문**을 놓친다.
    naming: |
      코드·시험·문서에서 `auth` 를 **단독으로 쓰지 않는다** — `authn_` / `authz_` 로 쓴다.
      다만 금지는 **우리가 새로 짓는 이름**에만 건다(D-324): `django.contrib.auth` ·
      `core.api.v1.auth` 는 남의 이름이라 못 고치고, ninja 의 `auth=` 는 프레임워크의
      인자 이름이라 못 고친다. 낱말을 금지하면 그 낱말을 정확히 쓰는 줄까지 죽는다.
    cost: |
      주석 39자리를 한 덩어리로 읽었다면 무엇을 즉시 고치고 무엇을 래칫에 둘지 가를 수 없었다.
      가르고 나서야 「열린 문 15 · 느슨한 권한 24」가 나왔고, 유예가 다른 두 규칙이 생겼다.
      ★ 그리고 이 구분이 **사고 ③을 찾아냈다**(2026-09-08 · D-343 ①):
        인벤토리에서 「authz 활성 + authn 없음」 24자리와 「아무 관문도 없음」 55자리를
        갈랐고, 뒤쪽을 호출로 재서 **익명에게 데이터가 나가는 11자리**를 찾았다.
        한 칸에 두었으면 24자리의 「권한이 막아 준다」에 가려 11자리를 못 봤을 것이다.
    enforced_by: |
      scripts/verify_homonyms.py — RULES["auth"]. 우리가 새로 짓는 이름이 `auth` 이면 exit 1.
      기존분은 래칫(D-311).
