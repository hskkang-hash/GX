# 계약 AC 전수 대장 F-01~F-14 — **실측** (D-309 · 2026-09-02)
#
# ★ 규칙: **증명 시험이 없는 칸은 '구현' 으로 적을 수 없다.** 그런 칸은 '부분' 이 아니라
#   **'미측정'** 이다. "미측정" 이 몇 건인지가 이 표의 진짜 값이다 —
#   우리가 **무엇을 모르는지** 세는 표이기 때문이다.
#
# ★ D-292 반성: 문서를 읽어 표를 만들면 그 표는 문서의 사본이다. `state` 칸은
#   **그 시험이 실재하는가**로만 채웠고, `scripts/verify_contract_ac.py` 가 매번 다시 본다.
#
# state 열거
#   구현    계약 AC 를 재는 시험이 실재하고 돈다
#   부분    일부만 잰다. **무엇을 못 재는지 not_measured 에 적는다**
#   잠김    지금 잴 수 없다. unlock_id 가 DA-05 잠금 대장을 가리킨다
#   미측정  구현 여부와 무관하게 **재는 시험이 없다.** 초록도 빨강도 아니다
#
# proof 형식: `<시험 파일>::<메서드 이름>` — 파일이 없거나 그 이름이 없으면 게이트가 exit 1.

meta:
  decision: D-309
  updated_at: "2026-09-02"
  measured_by: "scripts/verify_contract_ac.py (파일·메서드 실재 대조)"
  state_enum: [구현, 부분, 잠김, 미측정]

features:

  - id: F-01
    ac: "화재·연기 탐지 → 이벤트 저장"
    kernel: K1
    state: 구현
    proof:
      - "backend/tests/test_w2_2_detection_wiring.py::test_known_labels_become_events"
      - "backend/tests/e2e/test_e2e_1_fire.py::test_fire_scenario_runs_end_to_end"
    note: |
      AI 라벨 → 계약 열거값 → K1 이벤트까지가 배선으로 도는 것을 잰다. E2E-1 2단계가
      소유 상속(스트림 → 이벤트)까지 함께 본다.
      ⚠ **AI 가 실제로 쓰는 라벨 문자열은 아직 재지 못했다**(AI_GRPC_URL 미도달).
        표에는 글자가 같은 것만 넣었고, 못 옮긴 라벨은 세어서 로그로 낸다(D-273).

  - id: F-02
    ac: "수위선 초과 → 30초 내 이벤트 생성"
    kernel: K1
    state: 부분
    proof:
      - "backend/tests/e2e/test_e2e_2_flood.py::test_flood_scenario_runs_end_to_end"
      - "backend/tests/test_d294_event_type_separation.py::test_the_contract_document_lists_it"
    not_measured: |
      **지점별 수위 임계값(FR-02-2)을 저장할 표가 없다.** 그래서 시험은 "초과 신호가 이미
      났다"는 전제에서 시작한다 — 임계값을 코드에 박으면 그 값이 곧 AC 판정의 근거가 된다
      (D-280). 30초 AC 자체는 논리 시계로 재고 있다.
    unlock_id: ""

  - id: F-03
    ac: "지정 위험구역(폴리곤) 내 사람·차량 진입 → 결합·등급 상향"
    kernel: K1
    state: 부분
    proof:
      - "backend/tests/test_zone_judgment.py::test_f03_combination_raises_the_severity"
      - "backend/tests/e2e/test_e2e_2_flood.py::test_flood_scenario_runs_end_to_end"
    not_measured: |
      **폴리곤 판정을 재지 않는다.** 지금 도는 것은 `kind='camera_group'` 이고 계약보다
      약하다(D-299). 약함을 상수로 선언했으므로 조용히 계약의 자리를 차지하지는 않는다 —
      ZONE_POLYGON_READY 를 올리는 순간 test_f03_polygon_contract_ac 가 의무가 된다.
    unlock_id: F03_POLYGON_DESIGN

  - id: F-04
    ac: "동일 이벤트 5분 내 중복 알림 0건"
    kernel: K1
    state: 구현
    proof:
      - "backend/tests/test_k1_event_kernel.py::test_folded_records_do_not_notify_again"
      - "backend/tests/test_k1_event_kernel.py::test_event_count_and_notify_count_differ_in_five_minutes"
      - "backend/tests/e2e/test_e2e_1_fire.py::test_fire_scenario_runs_end_to_end"
    note: |
      기록 창(10초)과 알림 창(5분)을 **다른 판정**으로 둔 것이 이 AC 의 핵심이다.
      합치면 F-04 를 지키려다 U1 의 오탐률 분모가 거짓이 된다(DA-04 두 창).

  - id: F-05
    ac: "외부 App 이 이벤트 OpenAPI **하나로만** 들어온다 (API Key 발급·폐기 포함)"
    kernel: K1
    state: 미측정
    proof: []
    not_measured: |
      ★ **재는 시험이 없다.** K1 커널 공개 면은 서지만, "외부 App 의 유일한 진입면" 이라는
      AC 를 재는 시험이 없다 — 그 판정에는 (가) 공개 OpenAPI 스키마의 안정성, (나) API Key
      발급·폐기(FR-05-3), (다) 다른 경로로 못 들어옴을 보이는 **부작위 시험**이 필요하다.
      (나)는 저장처가 없다(dsm.SETTING_DOMAINS['api_keys'] 실측).
      **구현이 없다는 뜻이 아니라 재지 않았다는 뜻이다.** 이 칸이 이 대장의 값이다.
    unlock_id: ""

  - id: F-06
    ac: "심각 등급 발생 시 SDN QoS 요청 (10초 이내)"
    kernel: 어댑터(L2)
    state: 잠김
    proof:
