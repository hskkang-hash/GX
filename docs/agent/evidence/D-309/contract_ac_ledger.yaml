              갚고, 그 면에 증명 시험을 붙이는 일.
          부재는 여전히 조용하지 않다 — 표 ②가 `api_keys` 설정 면에 **나가는 키의 사실**을
          내보내고, 들어오는 키가 없다는 것은 이 note 가 말한다.

