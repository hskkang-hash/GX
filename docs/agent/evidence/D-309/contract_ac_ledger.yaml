            있지 않고**(이벤트 OpenAPI 는 CustomJWTAuth 만 받는다), 그 컨트롤러의
            `@path_permission` 이 **주석 처리돼 있다.** 그래서 지금 상태로 이 절을 올릴 수 없다.
            붙이는 일은 「만들기」가 아니라 **「잇기 + 권한 되살리기」**이고, 그 판정을 요청한다.
          ★ 2026-09-07 — 판정을 받았고(D-335), 착수해 보니 **한 겹 더 아래였다.**
            「잇기」도 아니었다. dj-core 의 CustomJWTAuth 가 들어오는 키 헤더를 **이미 받고 있었고**,
            호출로 재 보니 키 하나가 **F-05 진입면 7자리 전부에 도달**했다 —
            events · deliveries · dashboard · clip · **clip/stream(원본 영상)** · reports · settings.
            만료·비활성·가짜 키는 401 이었다. **인증은 성했고, 성하지 않은 것은 범위였다.**
            → 그래서 한 일은 **좁히기**다: backend/common/inbound_api_key.py 의 JwtOrInboundKey 가
              라우트마다 키 수용을 선언하게 하고 **기본값은 거절**이며, 지금 열린 곳은
              `GET /api/dsm/events` 하나뿐이다. 규약 다섯을 시험 17건으로 걸었다
              (backend/tests/test_f05_inbound_api_key.py).
            ★ **그러나 이 절은 여전히 미착수다.** 이 절이 말하는 것은 「발급·폐기」이고,
              이번에 한 것은 **소비 면의 범위**다. 둘은 다른 일이다 —
              범위를 좁혔다고 발급·폐기를 만든 것이 아니다. 올리면 그 순간 대장이 거짓말한다.
