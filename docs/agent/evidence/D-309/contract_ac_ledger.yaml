# 계약 AC 전수 대장 F-01~F-14 — **절 단위** (D-309 · D-314 · 2026-09-04 갱신)
#
# ★ D-314: **「부분」이라는 칸을 없앤다.**
#   '부분' 은 상태가 아니라 **아직 안 쪼갠 것의 이름**이다. 부분이 남아 있는 한 잔여를
#   모른다 — 5건이 95% 인지 20% 인지 표가 말하지 못한다(착시 ③ 의 대장 판).
#   그래서 계약 AC 를 **절로 쪼개고**, 절마다 하나의 상태를 준다.
#
# 규칙 셋 (D-314 §2)
#   ① 각 절은 구현 / 미착수 / 잠김 / 미측정 중 하나다. **'부분' 은 절 단위에 존재할 수 없다**
#   ② '구현' 절에는 증명 시험이 반드시 있다. 없으면 그 절은 '미측정' 이다
#      — 구현 주장은 시험이 하지 사람이 하지 않는다
#   ③ 절마다 **AC 원문의 어느 구절에서 나왔는지**(quote)를 적는다.
#      원문 인용 없는 절은 우리가 만든 절이지 계약의 절이 아니다.
#      → `verify_contract_ac.py` 가 quote 가 ac 문자열의 **부분 문자열인지** 대조한다.
#
# ⚠ 정직성 고지 — `ac` 는 **우리 등재부의 AC 문장**이다
#   계약 PDF 원문을 그대로 옮긴 것이 아니라, `backend/tests/e2e/e2e_contract.py` 의 `ac=`
#   문자열과 DA 문서에 적힌 것을 모은 문장이다. 절의 인용은 그 문장을 기준으로 대조된다.
#   계약 원문과 글자가 다를 수 있고, 다르면 그것은 **여기서 고칠 일이 아니라 원문을
#   실측해 등재부를 고칠 일**이다 (D-292 · D-316 — 문서로 안 것을 실측으로 적지 않는다).
#
# proof 형식: `<시험 파일>::<메서드 이름>` — 파일이 없거나 그 이름이 없으면 게이트가 exit 1.

