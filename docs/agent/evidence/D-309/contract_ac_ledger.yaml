    kernel: K2
    clauses:
      - quote: "등급별 수신그룹"
        state: 구현
        proof:
          - "backend/tests/e2e/test_e2e_2_flood.py::test_flood_scenario_runs_end_to_end"
          - "backend/tests/test_k2_notify_kernel.py::test_zero_recipients_raises_instead_of_returning_empty"
        note: "등급이 다르면 받는 사람이 실제로 달라진다. 수신자 0명은 조용한 성공이 아니다."
      - quote: "30초 내에"
        state: 구현
        proof:
          - "backend/tests/test_k2_notify_kernel.py::test_delivery_record_carries_both_points_of_f10"
          - "backend/tests/test_k2_notify_kernel.py::test_late_delivery_does_not_meet_f10"
        note: "재는 두 점(occurred_at → sent_at)이 한 행에 있다."
      - quote: "알림 발송 기록을 남긴다"
        state: 구현
        proof:
          - "backend/tests/test_k2_notify_kernel.py::test_failed_delivery_never_meets_f10"
          - "backend/tests/test_k2_notify_kernel.py::test_failure_leaves_a_row_not_silence"
        note: |
          실패한 발송은 아무리 빨라도 이 AC 를 통과하지 못한다 — sent_at 은 성공했을 때만
          찍는다. 실패도 **행으로** 남는다(조용한 유실 금지).

  - id: F-11
    ac: "상황 보고서에 템플릿 변수 3종(이벤트·조치·캡처)을 치환하고 손입력을 0으로 한다"
    kernel: K4
    clauses:
      - quote: "템플릿 변수 3종(이벤트·조치·캡처)"
        state: 구현
        proof:
          - "backend/tests/test_k4_report_kernel.py::test_context_carries_all_three_contract_variables"
          - "backend/tests/test_k4_report_kernel.py::test_template_vars_always_include_the_three_keys"
        note: "조치 이력은 K2 의 발송 기록 **그 행 그대로**다 — 두 벌로 적재하지 않는다."
      - quote: "손입력을 0으로"
        state: 구현
        proof:
          - "backend/tests/test_k4_report_kernel.py::test_no_field_needs_manual_entry"
          - "backend/tests/e2e/test_e2e_1_fire.py::test_fire_scenario_runs_end_to_end"
      - quote: "치환하고"
        state: 구현
        proof:
          - "backend/tests/test_k4_report_kernel.py::test_incomplete_context_is_refused_by_default"
          - "backend/tests/test_k4_report_kernel.py::test_empty_actions_is_complete_but_failed_is_not"
        note: "출처가 실패했으면 찍지 않고 멈춘다 — 종이는 되돌릴 수 없다."

  - id: F-12
    ac: "관리자 설정에서 수신자·위젯·구역·임계값·등급규칙·API키를 한 곳에서 관리하고, 무권한은 차단하며 성공·실패를 모두 감사로그로 남긴다"
    kernel: K5
    clauses:
      - quote: "무권한은 차단하며"
        state: 구현
        proof:
          - "backend/tests/test_dsm_app.py::test_denied_attempt_is_recorded"
          - "backend/tests/test_dsm_app.py::test_the_role_decision_is_not_copied"
        note: "권한 판정을 App 이 다시 계산하지 않는다 — 두 벌이면 반드시 어긋난다."
      - quote: "성공·실패를 모두 감사로그로 남긴다"
        state: 구현
        proof:
          - "backend/tests/test_dsm_app.py::test_allowed_attempt_is_recorded_too"
        note: "차단만 남기면 '시도가 없었다' 와 '시도가 막혔다' 가 같은 상태가 된다."
      - quote: "수신자"
        state: 구현
        proof:
          - "backend/tests/test_dsm_app.py::test_available_domains_actually_return_something"
      - quote: "위젯"
        state: 구현
        proof:
          - "backend/tests/test_dsm_app.py::test_available_domains_actually_return_something"
      - quote: "구역"
        state: 미착수
        note: |
          Zone 모델은 D-299 로 섰으나 **구역을 만드는 설정 면이 없다.** 지금 구역은
          관리자 화면·픽스처로 만든다. 못 다루는 영역은 빈 응답이 아니라 사유와 함께
          501 로 나간다(그 갈래는 test_unavailable_domains_raise_instead_of_returning_empty 가 잰다).
      - quote: "임계값"
        state: 구현
        proof:
          - "backend/tests/test_k5_threshold_table.py::test_contract_fixed_thresholds_cannot_be_overridden"
          - "backend/tests/test_k5_threshold_table.py::test_the_history_keeps_what_it_was_and_why"
          - "backend/tests/test_k5_threshold_table.py::test_a_non_admin_cannot_change_a_threshold"
          - "backend/tests/test_dsm_app.py::test_the_two_new_tables_are_actually_available"
        note: |
          ★ F-02 의 '지점별 기준선 설정' 절과 **같은 뿌리**였고, 표 하나가 두 절을 함께 올렸다
          (D-325 — 절 분해가 없었으면 보이지 않았을 뿌리다).
          ★ 이 절 고유의 위험 하나를 표가 막는다: **계약을 설정으로 어길 수 없다.**
            F-04 「5분」·F-10 「30초」는 `contract_fixed` 로 잠겨 있고, 덮으려 하면 409 다.
            그 구별이 없으면 "임계값을 설정 가능하게 만들었다" 가 곧
            **"계약 AC 를 설정 가능하게 만들었다"** 가 된다.
      - quote: "등급규칙"
        state: 미착수
        note: |
          F-04 JSON 규칙엔진을 저장할 표가 없다. detection_event_bridge 의
          EVENT_TYPE_TO_SEVERITY 는 배선의 **잠정 사전**이지 사용자가 고치는 설정이 아니다
          (P-W2-2-1 미결).
      - quote: "API키"
        state: 미착수
        note: |
          F-05 의 'API Key 발급·폐기' 절과 **같은 뿌리**다(FR-05-3) — 그래서 함께 남는다.
          ★ 2026-09-06: `api_keys` 설정 면은 열렸고 K5 표 ②가 **나가는 키의 사실**을 낸다.
            그러나 FR-12-1 이 부르는 "API Key" 는 FR-05-3 이 가리키는 **들어오는 키**이고,
            그것은 아직 없다. 설정 면이 열린 것과 그 절이 갚아진 것은 다른 사실이다 —
            **부분을 구현으로 올리지 않는다**(D-314).

