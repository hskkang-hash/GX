    not_measured: |
      SDN API 명세 미수령. Mock 조차 I-1~I-5 의 필드 이름·타입이 있어야 만든다(DA-02 §0).
      지금 재는 것은 **"부르면 왜 못 하는지 말하며 멈추는가"** 뿐이고, 10초 AC 는 못 잰다.
    unlock_id: SDN_API_SPEC

  - id: F-07
    ac: "링크 장애 시 대체 경로 요청"
    kernel: 어댑터(L2)
    state: 잠김
    proof:
      - "backend/tests/test_sdn_port_standard.py::test_every_interface_is_blocked_and_says_by_what"
    not_measured: "위와 같다 — 명세 미수령. 포트 인터페이스만 서 있다."
    unlock_id: SDN_API_SPEC

  - id: F-08
    ac: "링크다운 → 60초 내 이벤트"
    kernel: 어댑터(L2)
    state: 잠김
    proof:
      - "backend/tests/test_dsm_app.py::test_waiting_not_down_while_the_spec_is_missing"
    not_measured: |
      명세 미수령. 다만 **화면이 '대기 — 명세 미수령'을 정확히 말하는지**는 잰다 —
      연계 없음을 '장애'로 표시하면 우리 책임이 아닌 것이 우리 결함으로 보인다.
    unlock_id: SDN_API_SPEC

  - id: F-09
    ac: "재난 대시보드 — 5상태(기본/로딩/빈/오류/권한없음) 100% · 이벤트 클릭 → 영상 3초 이내 재생"
