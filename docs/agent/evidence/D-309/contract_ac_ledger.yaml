    not_measured: |
      **부정 조건(비행 명령 미전송)만 잰다.** 프로파일 초안 생성은 미착수이고, 그 촉발은
      F-08 링크다운 이벤트이므로 SDN 명세에 묶여 있다.
      ★ 이 칸이 부작위 시험의 값을 잘 보여 준다 — "만들지 않았음" 은 지금도 잴 수 있다.
