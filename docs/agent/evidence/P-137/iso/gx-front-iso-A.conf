# P-137 격리 설정 — **생성물**. docs/agent/evidence/P-137/iso_run.py 가 nginx/gx-front.conf 에서
#   주석을 걷고 upstream 의 server 줄만 바꿨다. 나머지 지시어(관문 생성물 · gx-proxy.inc 포함)는 원본 그대로다.
#   ⚠ nginx/ 아래에 두지 않은 까닭: verify_live_freshness 가 gx-nginx-e 를 nginx/**.conf 의 시각으로 잰다 —
#     새 .conf 가 거기 생기면 도는 앞단이 「낡았다」로 읽힌다(거짓 빨강).
# A (전 · 지금 모양) — peer 한 줄
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx-front.pid;
events {
    worker_connections 2048;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/json;   # 관문의 거절 본문이 JSON 이다
    log_format gx '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  '$request_time "$upstream_addr" $upstream_response_time';
    access_log /dev/stdout gx;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    upstream gx_app {
        server gx-gunicorn-iso:8000 max_fails=0;
        keepalive 32;
        keepalive_timeout 60s;
    }
    server {
        listen 8500;
        server_name _;
        client_max_body_size 64m;
        location = /_front/health {
            access_log off;
            return 200 '{"front":"nginx","upstream":"gunicorn"}';
        }
        include /etc/nginx/gx/generated/gx-gate.conf;
    }
}
