# DA-05 공공 데이터 원천 등록부 — 적용 5종 (D-280)
#
# ★ 이 파일은 **후보 등록부이지 스펙이 아니다.**
#   `verified: false` 인 항목의 endpoint·params 는 **문서를 보고 적은 것**이고 실측이 아니다.
#   D-280 이 경고한 그대로다 — "추정으로 쓴 스펙은 2027.2 에 전부 재작업이 된다."
#   그래서 여기서 멈추고, 실측은 `scripts/probe_public_data_schema.py` 가 한다.
#   실측이 끝난 항목만 `verified: true` 가 되고 그때 `{source}_schema.md` 가 생긴다.
#
# ⚠ **키를 여기 적지 않는다** (D-204 · D-280). 키는 C:\GuardianX-vault\ → 환경변수로만.
#   `key_env` 는 **환경변수 이름**이지 값이 아니다.

meta:
  decision: D-280
  updated_at: "2026-08-28"
  code_start: "2027.2 (계약 M 기능 우선 · PRD v2.1 규칙②) — 지금은 스키마 실측만 한다"
  why_now: |
    키가 생겼으므로 읽기 전용 실호출로 응답 스키마를 실측해 DA-05 스펙에 박는다.
    지금 30분이 2027.2 의 며칠을 아낀다. **코드 구현은 여전히 2027.2 다.**

# 키는 두 개뿐이다 — 포털 일반키 하나로 포털 API 전부를 부른다 (D-280 P0-2).
keys:
  - env: GX_DATA_GO_KR_KEY
    what: 공공데이터포털 일반 인증키 (P0-2)
    shape: URL 인코딩된 base64 — `%2B` · `%2F` · `%3D%3D` 를 포함한 60~120자
    covers: [school_location, national_park_safety, child_center_safety, kma_warning, kma_forecast]
  - env: GX_JUSO_API_KEY
    what: 주소정보 연계서비스 승인키 (FX-5) — **포털 일반키로는 못 부른다**
    shape: 미실측 — 발급 화면에서 확인한다
    covers: [juso_coord2addr]
  - env: GX_KMA_API_HUB_KEY
    what: 기상청 API 허브 토큰 (P0-1) — 포털과 별도 발급인 경우에만 쓴다
    shape: 영숫자 22자
    covers: [kma_warning, kma_forecast]

sources:

  - id: kma_warning
    priority: P0-1
    title: 기상청 기상특보
    why: FX-1(건조특보 + 연기 = 심각) · FX-2(호우특보 + 수위)의 **발동 조건 원천**
    key_env: GX_DATA_GO_KR_KEY
    verified: false
    endpoint: http://apis.data.go.kr/1360000/WthrWrnInfoService/getWthrWrnList
    params: {pageNo: 1, numOfRows: 10, dataType: JSON, stnId: 108}
    endpoint_source: "공공데이터포털 문서 — **미실측**. 실호출로 확인해야 한다"
    # ★ D-333 — 밖을 사기 전에 안을 뒤진다
    internal_alternative_considered: |
      카메라 영상에서 강우·연무를 추정해 특보를 대신하는 안을 검토했다.
    why_not: |
      **추정은 특보가 아니다.** FX-1·FX-2 의 발동 조건은 「특보가 발효됐다」는
      **공적 사실**이고, 우리 추정으로 사람을 깨우면 그 오탐의 책임이 우리에게 온다.
      내부에 원천이 없는 것이 아니라 **원천이 될 수 없다** — 외부가 맞다.

  - id: kma_forecast
    priority: P0-1
    title: 기상청 단기예보 / 초단기실황
    why: 특보가 없는 평시의 기상 컨텍스트 — 임계 판정의 바탕값
    key_env: GX_DATA_GO_KR_KEY
    verified: false
    endpoint: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst
    params: {pageNo: 1, numOfRows: 10, dataType: JSON, base_date: "TODAY", base_time: "0600", nx: 60, ny: 127}
    endpoint_source: "공공데이터포털 문서 — **미실측**"
    internal_alternative_considered: |
      기상특보(kma_warning) 하나로 갈음하는 안. 예보 없이 특보만 쓰면 되는가.
    why_not: |
      특보는 임계를 넘은 뒤에만 있다. 평시 바탕값이 없으면 「평소보다 많은 비」를
      말할 수 없고, 임계 판정의 분모가 사라진다. 다만 **P0-1 중에서는 후순위**다.

  - id: school_location
    priority: P1-1
    title: 전국초중등학교위치표준데이터
    why: 재난 시 대피소·우선보호시설. F-03 위험구역 자동 제안 · F-10 알림 우선순위
    key_env: GX_DATA_GO_KR_KEY
    verified: false
    endpoint: http://api.data.go.kr/openapi/tn_pubr_public_elesch_mskul_lc_api
    params: {pageNo: 1, numOfRows: 10, type: json}
    endpoint_source: "공공데이터포털 표준데이터 문서 — **미실측**"
    # ★ D-333 재검토 결과 — **내려간다** (2026-09-06)
    status: not_required
    internal_alternative_considered: |
      카메라 설치 주소(D-330). 고객은 특정 지자체이고, 보호 대상 시설은 그 지자체가
      이미 안다. 그리고 카메라는 이제 자기 주소를 갖는다.
    why_not: |
      **필요 없다.** 전국 학교 좌표는 우리 계약 AC 어디에도 입력이 아니다 —
      「F-03 위험구역 자동 제안」은 계약 AC 가 아니라 우리가 붙인 아이디어였다.
      없는 요구에 자원을 붙이지 않는다. 필요해지면 그때 다시 올린다.

  - id: juso_coord2addr
    priority: P1-0
    title: 주소정보 연계서비스 — 좌표 → 도로명 주소 (juso.go.kr)
    why: |
      FX-5. F-10 알림 본문과 F-11 보고서 위치란에 **사람이 읽는 위치**가 들어간다.
      지금은 좌표만 나가서 받는 사람이 지도를 따로 연다 — 새벽 당직자에게 그 차이가 크다.
    key_env: GX_JUSO_API_KEY          # 포털 일반키와 **별개 계정**이다 (juso.go.kr 자체 발급)
    verified: false
    endpoint: https://business.juso.go.kr/jst/jstRoadNmAddrApiSearch
    params: {}
    endpoint_source: |
      **응답 스키마 미실측.** 요청 URL 은 D-298 로 .env.example 에 등재됐으나,
      응답의 필드 이름·중첩 구조·오류 코드는 실호출로 확인해야 한다.
      그래서 `backend/adapters/juso/` 는 **포트와 저하 운전만** 세우고 HTTP 구현체를
      만들지 않았다(`KERNEL_READY=False`). 추측한 필드명 위의 파서는 첫 실호출에서
      전부 재작업이 되고, 그때는 그것이 추측이었다는 사실조차 남지 않는다(D-280).
      해소: 키를 환경변수에 넣고 이 스크립트를 `--only juso_coord2addr` 로 한 번 돌린다.
    # ★ D-329 · D-330 — **자원 유형 불일치 + 내부로 대체됨** (2026-09-06)
    status: not_required
    internal_alternative_considered: |
      **카메라 설치 주소**(D-330). 카메라는 고정 설치물이므로 설치할 때 주소를 안다.
      이벤트 위치 = 그 카메라의 주소다.
    why_not: |
      ★ 반대다 — **내부가 이겼다.** 외부 호출 0건 · 타임아웃 없음 · 비용 0 이고,
      결과까지 더 좋다: 역지오코딩은 「서울시 …로 12」만 주지만 우리는
      「정문 (서울시 …로 12)」를 준다. 새벽 당직자에게 이 차이가 결정적이다.
      덧붙여, 발급된 승인키 2건은 **도로명주소 팝업 API**(브라우저 UI 위젯)여서
      애초에 이 방향을 주지도 않았다(D-329) — 그 사실은 실호출 전에 신청서에서 났다.

  - id: national_park_safety
    priority: P1-2
    title: 국립공원 안전정보
    why: F-01 화재 탐지의 지역 컨텍스트, 조난 대응
    key_env: GX_DATA_GO_KR_KEY
    verified: false
    endpoint: ""
    params: {}
    endpoint_source: |
      **엔드포인트 미상.** 대표가 신청한 정확한 API 명을 확인해야 한다 —
      "국립공원 안전정보"로 검색되는 서비스가 여럿이고, 추정으로 고르면
      2027.2 에 다른 API 를 쓰게 된다. 프로브는 이 항목을 **건너뛰고 그 사실을 적는다.**
    status: not_required
    internal_alternative_considered: |
      없음. 애초에 계약 AC 가 부르지 않는 컨텍스트 보강 자료다(D-321).
    why_not: |
      계약 AC 어디에도 입력이 아니다. **이름이 우리 도메인과 닮아서** 후보에 올랐던 것이고,
      이름의 유사성은 기능의 필요성이 아니다(D-321).

  - id: child_center_safety
    priority: P1-3
    title: 아동센터·돌봄센터 안전정보
    why: 대피 우선순위 · F-10 수신자 그룹 가중 (취약계층 시설)
    key_env: GX_DATA_GO_KR_KEY
    verified: false
    endpoint: ""
    params: {}
    endpoint_source: |
      **엔드포인트 미상.** 위와 같은 이유로 비워 둔다.
    status: not_required
    internal_alternative_considered: |
      없음. 취약계층 가중은 수신그룹(NotificationRule)이 이미 표현한다 —
      **우리 표로 되는 일**이다.
    why_not: |
      전국 시설 목록이 아니라 「이 고객의 보호 대상 시설」이면 되고, 그것은 고객이 안다.
      계약 AC 어디에도 입력이 아니다(D-321).


# 미적용 3종 (D-280) — 여기 넣지 않는다. 넣지 않은 것을 적어 두는 이유는
# 다음 사람이 "빠뜨렸나" 하고 다시 넣지 않게 하기 위해서다.
not_applied:
  - NEIS(교육행정)          # GuardianX 도메인과 무관
  - 대구교육청 방과후학교 공모  # 무관
  - Open DART(기업공시)      # 무관

# 아직 없는 P0 — 포털 일반키로 활용신청만 하면 된다 (대표께 안내 · D-280 §6-2)
pending_application:
  - 하천 수위 (홍수통제소)     # FX-2 의 나머지 절반
  - 재난대응기관
  - 시설자원
  - 안전정보 통합공개
