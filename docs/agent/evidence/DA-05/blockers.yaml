        [삭제 0건] Menu 131행 · RoleMenu 969행 — **끊기 전후가 같다.**
        [되돌릴 수 있다] 11 → 0 → **11** → 0 을 같은 DB 에서 실제로 왕복했다.
        [★ 그리는 쪽에서도 쟀다 — 「명령이 돌았다」와 「메뉴가 사라졌다」는 다른 사실이다]
        서버가 실제로 그려 주는 트리(`core.menu.get_user_menu_structure`)를 역할별
        실사용자로 펼쳐 셌다:
            fire_user   (fire_user1)   메뉴 17 · **대상 노출 0**
            operator    (operator_user) 메뉴 20 · **대상 노출 0**
            fire_admin  (fire_user1)   메뉴 17 · **대상 노출 0**
            view_only_-_anyang (anyang_sv) 메뉴 27 · **대상 노출 0**
            admin  (son)               메뉴 107 · 대상 노출 **11 유지** ← U5
        「107행」의 정체가 여기서 드러난다 — 그것은 메뉴 표의 크기가 아니라
        **관리자 한 사람이 보는 메뉴의 수**였다.

        시험 `backend/tests/test_c_menu_exposure.py` **9 passed** —
        「지우지 않았는가 · 사라지는가 · 장부대로 되돌아오는가 · U5 는 남는가 ·
        두 번 돌려도 같은가」 다섯을 따로 묻는다.

      [실측 2026-09-27 · 턴 B 차선 C] 사이드바는 서버가 준 `menusWithPermissions` 로
      그린다. 그 목록의 정본은 **DB 의 `core.menu.models.Menu` 107행**이고, 드론 Device ·
      NOTAM · 비행로그 · 조사 프로파일 · 영문 CRUD 가 전부 그 안에 있다.
      우리 저장소에서 메뉴를 등재하는 코드를 찾았다 — **0건**
      (`grep -rn 'role_menus|user_menus' backend/`).
      `core.*` 는 **dj-core = §0.4 금지구역**이라 우리가 못 고친다.
    why: |
      ★ **§0.4 는 수정 금지이지 노출 의무가 아니다** — 그 원칙은 그대로 옳다.
        다만 노출을 끄는 스위치가 **우리 층에 없다.** 라우트를 지우는 것은 삭제이고,
        메뉴 행을 지우는 것도 삭제다. 둘 다 대표 승인 사항이다(대표 지시 ① 2026-09-26).
      ★ 우회를 만들지 않는다 — 프런트에서 메뉴를 손수 걸러내는 길이 있지만, 그러면
        **서버가 준 목록과 화면이 보여 주는 목록이 갈린다.** 갈리는 순간 하나는 거짓말이고,
        다음 사람은 어느 쪽이 정본인지 모른다. 그것은 이 저장소가 두 표를 두지 않기로 한
        규칙(D-346)의 화면판이다.
    unlock_step: |
      (해소 완료 · 2026-09-05) 집행과 되돌리기가 **관리 명령 두 벌**로 서 있다.
      배포한 환경마다 시드처럼 한 번 돌리면 된다:

          python manage.py unlink_control_role_menus --all-tenants --dry-run  # 표가 먼저다
          python manage.py unlink_control_role_menus --all-tenants            # 집행
          python manage.py unlink_control_role_menus --all-tenants --check    # 남으면 exit 1
          python manage.py unlink_control_role_menus --group 6                # 한 소속만
          python manage.py relink_control_role_menus                          # 되돌리기

      ★★ **`--group` 또는 `--all-tenants` 를 반드시 준다 — 기본값이 없다.**
        [실측 2026-09-05 · 커밋 훅이 물어서 재게 됐다] `core.menu.RoleMenu` 는
        분류 등록부에서 **DEFERRED**(「일부만 공용일 수 있다」)이고, 실물은
        **969행 중 926행이 소속을 갖는다**(그룹 4·5·6·7 · 소속 없음 43).
        즉 **공용 마스터가 아니다** — 안 가리고 끊으면 남의 소속까지 끊긴다.
        이번 집행은 `--all-tenants` 였고 **소속 5(4건) · 소속 6(7건)** 에 걸렸다.
        두 명령은 돌 때마다 등록부에 분류를 다시 물어 출력하고, 분류가 바뀌면 **멈춘다.**

      ★ 되돌리기는 **장부대로**다. 표만 보고 켜면 끊기 전부터 꺼져 있던 연결까지
        켜서 **없던 권한을 준다** — 그것은 되돌리기가 아니라 새 부여다.
        장부: docs/agent/evidence/UX-21/menu_unlink_ledger.json
      ⚠ 새 환경에서는 **한 번 돌려야 한다.** 안 돌리면 그 환경의 관제 역할에는
        드론·항공·영문 CRUD 가 그대로 보인다 — 코드가 아니라 데이터이기 때문이다.
    state_in_code: |
