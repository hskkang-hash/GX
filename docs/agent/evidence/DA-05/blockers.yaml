    verified_by: |
      [실측 2026-09-11 · role.Role 전수] 이 저장소의 역할 코드는 **15종**이다.
      DA-03 §3-4 는 역할을 **「다섯 종류의 사람」**으로 적었다. 그 둘을 잇는 표가
      문서 어디에도 없다 — 그래서 `backend/config/k3_roles.py` 에서 **우리가 이었다.**

      이은 것 7종 (근거는 파일의 주석마다 있다):
        OPERATOR  : fire_user · surveillance_operation · operator
        MANAGER   : fire_admin · surveillance_order · admin
        EXECUTIVE : view_only_-_anyang
      비운 것 8종 (`K3_UNMAPPED_BY_DECISION` · **추측으로 채우지 않았다**):
        order · delivery_admin · delivery_order · delivery_operation ·
        drone_robot_admin · drone_robot_user · user · superuser
    why: |
      ★ **이것은 인용이 아니라 우리 판정이다** (D-383). 그 표기를 여기 남기는 이유는
      다음 사람이 이 표를 「DA-03 에서 옮겨 적은 것」으로 읽지 않게 하기 위해서다 —
      옮겨 적은 표는 원본을 찾아 대조할 수 있지만, **판정한 표는 판정한 사람에게
      물어야 한다.** 어느 쪽인지 모르면 아무도 못 고친다 (D-322 의 계열).

      ★ 그리고 이 매핑의 정답은 우리에게 **없다.** 「재난관제 관리자가 임계값을 편집할
        수 있는가」는 코드가 답할 수 있는 질문이 아니라 **운영 규정**이다.
        틀리면 두 방향으로 틀린다: 넓으면 볼 것이 아닌 사람이 보고, 좁으면 일이 안 된다.

      ⚠ 지금 상태는 **안전한 쪽으로 틀려 있다** — 매핑에 없는 역할은 `matched=False` 로
        가장 좁은 프리셋(OPERATOR)에 떨어지고, 편집(E)은 설정 없이는 **절대 참이 되지
        않는다**. 그래서 이 잠금은 「위험」이 아니라 「미확정」이다.
    unlock_step: |
      ★ **화면이 없어도 할 수 있는 검수다** — 이것이 검수 콘솔의 첫 실전 용도다(D-383).
      ① 검수 콘솔의 `UX-05` 항목으로 관제팀에 셋을 묻는다:
         ㉠ 이은 7종이 **맞는가**
         ㉡ **빠진 것**이 있는가 (미배선 8종 중 화면을 받아야 하는 역할)
         ㉢ **이건 보이면 안 된다** 가 있는가
      ② 받은 답만 `K3_ROLE_PRESET_MAP` 과 `K3_WIDGET_MATRIX` 에 넣는다.
         **답이 없는 칸은 비운 채로 둔다** — 비어 있는 것이 틀린 것보다 낫다(D-280).
      ③ 답을 받은 날짜와 답한 사람을 여기 `verified_by` 에 적는다 — 진술이 아니라 출처다.
    internal_alternative_considered: |
