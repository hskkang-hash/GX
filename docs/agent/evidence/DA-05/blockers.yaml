  - id: DJCORE_200_ENVELOPE_403
    title: dj-core 의 권한 거부가 **HTTP 200 봉투 안에 403** 으로 나간다
    unlock_type: DEV
    unlock_owner: dj-core 소유팀 (우리는 §0.4 로 손댈 수 없다 · D-207)
    blocks: [상용 오픈 ②보안-04, 외부 App 연동 규격]
    since: "2026-09-08"
    blocked_now: false
    verified_at: "2026-09-08"
    verified_by: |
      익명 GET 51자리를 캐시 우회로 호출한 실측(docs/agent/evidence/D-343/authn_gap_calls.json)
      에서 **20건이 HTTP 200 + 본문 status_code 403** 이었다.
      코드 자리도 확인했다: site-packages/core/role/permission.py:508 —
      `return {"success": False, ..., "status_code": 403}` 을 그대로 돌려주고
      django-ninja 가 그것을 200 으로 직렬화한다.
    why: |
      **막고 있으므로 유출은 아니다.** 권한은 실제로 거부됐다.
      그러나 호출자가 HTTP 상태를 믿으면 **거부를 성공으로 읽는다** — D-284(거짓 성공)의 HTTP 판이다.
      ★ blocked_now 가 false 인 이유: 지금 어떤 기능도 이것 때문에 멈춰 있지 않다.
        막고 있는 것이 아니라 **틀린 신호를 내보내는 것**이다. 그러나 외부 App 이 붙는 순간
        이것은 연동 규격의 결함이 된다 — F-05 진입면에 파트너가 붙기 전에 풀려야 한다.
    unlock_step: |
      ① dj-core 소유팀에 시정 요청 (permission.py 가 403 상태로 응답하게)
      ② 그때까지 **우리 층 대응**: 우리가 만드는 진입면(F-05 · apps/dsm)은
         `common/api_contract.py` 의 상태 승격을 지나므로 이 모양이 나오지 않는다.
         새 라우트는 우리 층에서 만든다 — 금지구역 안으로 손을 넣지 않는다(D-207).
    internal_alternative_considered: |
      미들웨어에서 본문의 status_code 를 읽어 HTTP 상태로 승격시키는 것.
    why_not: |
      전역 승격은 **응답 모양을 바꾸는 일**이라 프런트 계약 전체를 건드린다.
      지금 그것을 하면 무엇이 깨졌는지 모르는 채로 초록이 된다(D-343 의 경고와 같은 이유).
      그래서 지금은 **재고 기록**으로 두고, 범위 판정을 받는다.
    state_in_code: |
      scripts/probe_authn_gap_calls.py — effective_status() 가 봉투가 아니라 내용을 읽는다.
      dj-core 쪽 자리는 site-packages/core/role/permission.py:508 이고
      **저장소 밖(§0.4 금지구역)이라 여기에 경로로 적지 않는다** — 읽기만 했다.

