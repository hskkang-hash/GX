    since: "2026-09-20"
    blocked_now: true
    verified_at: "2026-09-20"
    verified_by: |
      [실측 2026-09-20] `StreamMonitor` 의 칸 전수를 읽었다 — 「마지막으로 살아 있던
      시각」에 해당하는 칸이 **없다**. `is_active` 는 운영자가 켜고 끄는 스위치라,
      **스위치가 켜진 채 죽은 카메라와 살아 있는 카메라가 그 칸에서 같다.**
      개발 DB: 등록 40대 · 켜짐 39대 · 그중 **한 번도 이벤트를 낸 적 없는 것 39대**
      (배송 도메인에서 온 `drone_*`) · 전에 울렸는데 24시간 조용한 것 **0대**.
    why: |
      지금 `ops_monitor` 가 내는 `cameras_silent_24h` 는 **간접 증거**다: 그 카메라에서
      마지막 이벤트가 언제 왔나. 이것으로는 **죽은 카메라와 아무 일도 없던 카메라를
      못 가른다** — 조용한 밤의 정상 카메라도 같은 값을 낸다.
      그래서 그 경보의 뜻을 「죽었다」가 아니라 **「가서 봐라」**로 좁혀 두었다.
      못 가르는 것을 가른다고 적는 것이 D-301 이 이름 붙인 실패다.
      ★ 그리고 이 잠금을 등재하지 않으면, 다음 사람은 저 신호를 보고
        **감시가 있다고 믿는다.** 있는 것은 감시가 아니라 그 대용품이다.
    internal_alternative_considered: |
      해당 없음(DEV). 다만 대용품 둘을 검토했다:
        · RTSP 를 감시가 직접 열어 본다 → 감시가 스트림 부하를 만든다. 감시는 재는 것이지
          쓰는 것이 아니다(같은 이유로 저장소 맥박도 데이터 풀과 분리했다 · D-412 ③)
        · `is_active` 만 센다 → 스위치를 맥박으로 읽는 것. 그것이 지금 막힌 이유다
    unlock_step: |
      ① `StreamMonitor.last_seen_at` (null 허용) 한 칸 + 마이그레이션
      ② 검출 파이프라인(`detection_event_bridge`)이 프레임을 받을 때마다 갱신 —
         **이벤트가 아니라 프레임**이다. 이벤트로 채우면 지금과 같은 신호가 된다
      ③ `ops_monitor` 의 `cameras_silent_24h` 술어를 그 칸으로 바꾸고, 임계를 분 단위로 조인다
      ④ 그때 이 잠금을 `blocked_now: false` 로 내린다 — **지우지 않는다**

      ★ [실측 2026-09-24 · 2파] **①②가 끝났다. ③이 남았다 — 그래서 아직 내리지 않는다.**
        · ① 칸: `StreamMonitor.last_frame_at` + 인덱스 (마이그레이션 0027 · 차선 Q).
          이름이 계획의 `last_seen_at` 이 아니라 `last_frame_at` 이다 — **프레임**을
          재는 칸임을 이름이 말하게 했다. 이 대장의 계획 이름을 고쳐 적지 않고 여기 남긴다.
        · ② 채우기: `grpc_dual_stream_service._publish_detection_events` 첫머리에서
          **검출 유무와 무관하게** 적는다(조율자 병합). ⚠ 이 배선은 차선이 낸 코드에
          **빠져 있었다** — 칸과 규칙과 판정기는 섰는데 채우는 호출이 0곳이었고, 시험은
          스스로 맥박을 심어서 전부 초록이었다. 운영에서는 영원히 `None` 이고 규칙은
          그것을 두절로 세지 않으므로 **0건만 내는 잠자는 기능**이 될 뻔했다(D-377).
          부작위 시험을 박았다: `test_q_camera_pulse.PulseIsFedByThePipelineTest`.
        · ③ 남음: `cameras_silent_24h` 는 여전히 **이벤트**를 본다. 술어를 맥박으로
          바꾸는 것은 그 신호의 뜻과 임계를 함께 바꾸는 일이라 별도 판정이 필요하다 —
          섞어서 하면 「가서 봐라」가 어느 날 다른 뜻이 된다.
    state_in_code: |
      scripts/ops_monitor.py — `cameras_silent_24h` · `cameras_never_seen` (둘로 가른 이유가
      주석에 있다) · docs/agent/evidence/D-373/monitor_last.json

  - id: DJCORE_CREATE_USER_NOT_ATOMIC
    title: "사용자 생성이 **원자적이지 않다** — 반쪽 사람이 남고 재시도가 영원히 막힌다"
    unlock_type: DEV
    unlock_owner: dj-core 소유팀 (§0.4 — 우리가 못 고친다)
    blocks: [시드 U1~U5, 온보딩 계정 생성, UX-02 관리 UI 사용자 등록]
    since: "2026-09-24"
    blocked_now: true
    verified_at: "2026-09-24"
    verified_by: |
      [실측 2026-09-24 · 차선 E3 가 **실제로 발생시켜** 확인했다] `POST /api/v1/user/create-user`
      가 프로필 생성 단계에서 죽으면 `CoreUser` 행만 남고 응답은 `400 Failed to create user.`
      다. 부른 쪽은 「안 생겼다」로 읽는데 **소속도 역할도 없는 반쪽 사람**이 남았고,
      같은 이름으로 재시도하면 `Username already exists` 가 나 **영원히 막힌다.**
      남은 행(id 107)은 손으로 치웠다.
    why: |
      「실패했다」와 「반쯤 성공했다」가 **같은 응답**으로 나온다. 그 둘은 다음 행동이
      다르다 — 앞엣것은 다시 부르면 되고, 뒤엣것은 **먼저 치워야** 다시 부를 수 있다.
      D-290 이 이름 붙인 자리이고, 여기서는 그 값이 특히 크다: 온보딩의 첫 걸음이
      사용자 생성이라 **처음 쓰는 사람이 가장 먼저 만나는 실패**가 이것이다.
      ★ 곁가지 하나: `user_profile_link.employee_id` 에 UNIQUE 가 있다. 같은 사번을
        두 사람에게 달면 둘째가 죽고 **사유가 응답에 안 실린다** — 같은 계열이다.
    internal_alternative_considered: |
      · 우리 층에서 감싸기(생성 → 확인 → 실패 시 정리): 정리 자체가 `CoreUser` 삭제라
        위험이 더 크다. 지우는 코드는 되돌릴 수 없다
      · 미리 이름 충돌을 검사: 경합에서 그대로 깨진다. 검사와 생성 사이가 열린 자리다
      · **지금 쓰는 우회**: 시드는 생성 뒤 프로필·역할을 확인하고, 안 서면 사유를
        출력하고 멈춘다. 조용히 넘어가지 않는 것까지가 우리가 할 수 있는 전부다
    why_not: |
      `core/api/v1/user.py` 는 dj-core(site-packages · §0.4 D-207)다. 파일을 고치면
      forbidden-zone 게이트가 STOP 을 낸다 — 그리고 그 게이트가 옳다.
      D-348 이 연 길(우리 층 미들웨어)은 **길목 차단**에는 쓰지만 트랜잭션 경계에는
      못 쓴다. 경계는 그 함수 안에 있어야 한다.
    unlock_step: |
      ① 소유팀이 `create_user` 를 한 트랜잭션으로 묶는다 (프로필·역할까지)
      ② 부분 실패 시 응답이 **무엇이 남았는지** 말한다 (400 한 줄이 아니라)
      ③ 그때 이 잠금을 `blocked_now: false` 로 내린다 — 지우지 않는다
    state_in_code: |
      backend/stream_monitors/management/commands/seed_role_users.py — 생성 뒤 확인하고
      안 서면 멈춘다 · docs/agent/evidence/OPS-SEED/ (차선 E3 실측 기록)

  - id: DJCORE_SINGLE_SESSION_TOKEN_FIELD
    title: |
      동시 접속 1개는 **설정이 아니라 자료구조**다 — `user.token` 이 한 칸이다
    unlock_type: ADMIN
    unlock_owner: 대표 (§0.4 해제 판정 또는 dj-core 측 수정 요청)
    unlock_step: |
      ① 대표가 §0.4 예외를 열거나, ② dj-core 소유자에게 「세션을 여러 벌 담는 칸」을 요청한다.
      둘 중 어느 쪽도 우리가 코드로 대신할 수 없다.
    blocked_now: true
    since: "2026-09-05"
    blocks: [UX-24]
    why: |
      관제실은 월 모드 대형 화면 · 자리 데스크톱 · 이동 중 휴대전화를 **동시에** 켠다.
      지금은 월 모드를 켜면 자리 화면이 튕기고, 자리에서 다시 로그인하면 월이 죽는다 —
      **제품이 실사용 형태 자체를 막는다.**
    state_in_code: backend/common/session_limit.py
    state_detail: |
      우리 층은 다 섰다 — 상한 표 · 월 12h TTL · 축출 순수함수 · 밀려난 화면의 안내 문구
      (시험 26 passed). **담을 자리가 없을 뿐이다.**
      dj-core 쪽 실측(저장소 밖 · 컨테이너 site-packages): `core/user/models.py:577` 의
      `user.token` = `"<session_id>:<jti>"` **한 칸** · `core/api/v1/auth.py:706` 로그인이
      그것을 덮어씀 · `core/auth.py:63` 세션 불일치 → 401.
    verified_at: "2026-09-05"
    verified_by: |
      [실측 · 턴 E · Security Agent] `test_dj_core_admits_exactly_one_session` 이
      **「지금은 1개다」를 characterization 으로 고정**한다 — 벽이 걷혀 여러 벌이 살면
      그 시험이 빨개진다. 진술이 아니라 시험이 잠금을 든다.
    internal_alternative_considered: |
      ① 우리 층 미들웨어에서 세션 표를 따로 들고 dj-core 토큰과 나란히 두기 —
         검토했고 **안 된다**: dj-core 가 401 을 내는 자리가 우리 미들웨어보다 앞이다.
      ② 접근 토큰 수명을 늘려 재로그인을 줄이기 — **거부**. 그것은 동시 접속이 아니라
         재로그인 빈도를 줄이는 것이고, 대가로 **제품 전체의 탈취 창**이 넓어진다.
    why_not: |
      ①은 순서 때문에 닿지 않고 ②는 다른 문제를 푸는 척하며 보안을 깎는다.
      **못 하는 것을 한 척하지 않는다** — 정책층만 세우고 판정 불가로 적었다.
    side_effect: |
      ★★ **밀려난 화면의 요청 한 번이 살아 있는 세션의 재발급 토큰을 전부 블랙리스트한다**
      (`core/auth.py` 바깥 except). 월 모드는 20초마다 두드리는 화면이다 —
      **죽은 화면 한 장이 앉아 있는 사람의 갱신을 끊는다.** 「가끔 로그아웃된다」의 유력한 뿌리.

  - id: PRODUCT_SCREENS_HAVE_NO_MENU_ROWS
    title: |
      사이드바에 **우리 제품 화면이 한 장도 없다** — 메뉴 행이 0건이다
    unlock_type: ADMIN
    unlock_owner: 세종 (절·시드 판정) + 대표 (정본 표 변경 승인)
    unlock_step: |
      ① 「제품 화면을 사이드바에 올린다」를 절로 승인한다 ② 어느 화면을 어느 역할에 붙일지 정한다
      ③ 우리가 시드 명령 한 자리를 짓는다(하루). **막는 것은 ③이 아니라 ①②다.**
    blocked_now: true
    since: "2026-09-05"
    blocks: [UX-25]
    why: |
      관제요원이 **사이드바에서 우리 제품으로 갈 수 있는 길이 없다** — URL 을 직접 쳐야 한다.
      그리고 이 사실은 「인수 자산을 끊는 일」만 하고 있으면 안 보인다:
      **끊을수록 사이드바는 0 에 가까워지고, 더할 것이 애초에 없었다.**
    state_in_code: backend/common/menu_exposure.py
    state_detail: |
      [실측] `/dsm/*` · `/wall` · `/start` 로 시작하는 `Menu` 행 **0건**.
      `Menu.objects` 를 만지는 파일을 저장소 전수로 찾았고 — **씨 뿌리는 코드가 없다.**
      이 파일은 **끊는 표**만 들고 있다. 더하는 표가 없다는 것이 이 잠금의 내용이다.
      사이드바는 dj-core `list_menus` 가 주는 목록으로만 그려진다.
    verified_at: "2026-09-05"
    verified_by: |
      [실측 · 턴 E · Product/User Agent] 역할별 메뉴 전수(`role_menus_before/after_P50.txt`) ·
      `Menu` 131행 · `RoleMenu` 969행이 왕복 내내 불변인 것까지 확인. 그 131행 어디에도
      우리 경로가 없다.
    internal_alternative_considered: |
      ① 우리 층에 별도 사이드바를 그린다 — **거부**. 사이드바가 두 벌이 되고, 두 벌은 어긋난다.
      ② 시드 명령으로 행을 넣는다 — **할 수 있다**(우리 손). 다만 그 표는 정본이고
         정본을 바꾸는 것은 승인의 일이다(`MENU_REGISTRY_LIVES_IN_DJCORE_DB` 와 같은 이유).
    why_not: |
      ①은 어긋남을 만들고, ②는 기술이 아니라 **판정**을 기다린다.
      그래서 이 잠금의 종류는 DEV 가 아니라 ADMIN 이다.
