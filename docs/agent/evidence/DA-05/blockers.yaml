  - id: GATE_ROUTE_ALIVE_CREDENTIAL
    title: route-alive 가 자격증명이 없어 아무것도 못 재고 있었다 — **해제됨**
    unlock_type: DEV
    unlock_owner: Code
    blocks: [P-12①]
    since: "2026-09-14"
    blocked_now: false
    verified_at: "2026-09-17"
    verified_by: |
      [실측] 같은 게이트를 두 번 돌려 갈라지는 것을 확인했다:
        자격증명 있이  → exit 1 (죽은 라우트 2건을 잡는다)
        자격증명 없이  → exit 2 (판정 불가)
      증거: docs/agent/evidence/D-386/route_alive.json — 26건 · 200 24 · 500 2.
    why: |
      값이 저장소에 있으면 안 되고(D-204), 없으면 게이트가 못 잰다. 그 사이에서
      이 자리는 **영원히 회색**이었다.
      ★ 그리고 풀고 나서 더 나쁜 것이 나왔다: 자격증명을 넣자 게이트가 **exit 0** 을 냈는데,
        26건 중 24건이 401 이었다. `/api/token/pair` 가 내주는 JWT 를 dj-core 가
        `user.token` 이 없다고 거절했고(core/auth.py:38 "Token expired"),
        판정 규칙이 401 을 「문지기가 섰다(살아 있다)」로 읽었다.
        **토큰을 받았다는 사실이 토큰이 먹힌다는 증거가 아니었다.**
        그 401 밑에 `/api/media-data(/)` **500 두 자리**가 덮여 있었다.
    unlock_step: |
      ① 값은 로컬 `.env.gates`(gitignored)에 산다. 저장소엔 이름만 —
         docs/agent/ENV_EXAMPLE_게이트자격증명.txt (D-204)
      ② 서버가 호스트에서 안 보이면(gx-shell 이 8000 을 게시하지 않는다)
         `GX_ROUTE_CONTAINER` 로 컨테이너 안에서 같은 코드를 돌린다 — 두 벌을 만들지 않는다
      ③ 로그인 뒤 **익명으로 한 번 더 때려** 토큰이 무엇을 바꿨는지 센다.
         0건이면 판정 불가다 — 못 들어간 채로 본 401 을 초록으로 적지 않는다
    state_in_code: |
      scripts/verify_route_alive.py — LOGIN_PATHS · _extract_token(조용한 성공 거절) ·
      token_changed_anything(익명 대조) · load_local_env · delegate_to_container ·
      BIRTH_SAMPLE_TOKEN_DEAF (출생 표본 ② 26건 중 24건 401)

  - id: GATE_SECRET_SCANNER_ABSENT
    title: 시크릿 스캐너가 설치되어 있지 않아 못 재고 있었다 — **해제됨**
    unlock_type: DEV
    unlock_owner: Code
    blocks: [P-12②]
    since: "2026-08-13"
    blocked_now: false
    verified_at: "2026-09-17"
    verified_by: |
      [실측] gitleaks 8.21.2 를 판·해시 고정으로 설치하고(sha256 대조 일치),
      게이트가 SKIP → PASS 로 갈렸다. 자기시험 양성 1(심은 키 32자를 잡는다) ·
      음성 2(플레이스홀더를 안 잡는다 · 큰 잠금 파일의 integrity 해시를 안 잡는다).
      분류기 양성 대조: 저장소가 나르는 자리에 심으니 exit 1, 치우니 exit 0.
    why: |
      ★ 깔고 처음 돌린 날 나온 수가 스캔 면에 따라 **19건 대 1건**이었다.
        파일 면(--no-git)은 빌드 산출물과 로컬 `.env.stg` 까지 세고,
        이력 면은 커밋된 것만 센다. 물어야 할 것은 **「저장소가 무엇을 나르는가」**다.
      실제 발견 1건: backend/stream_monitors/example_frontend.html:813 에
        Django CSRF 토큰 32자가 하드코딩. 게다가 그 값이 차 있어서 바로 아래
        `if (!csrfToken)` 대체 경로 세 갈래가 **한 번도 안 돌고 있었다** — 유출이면서
        동시에 기능 결함이었다. 값을 비워 두 가지를 함께 고쳤다.
      ★ 측정기 결함 하나도 함께 나왔다: `regexTarget="line"` 허용목록이
        **~100KB 넘는 파일에서 조용히 꺼진다**(gitleaks 청크 경계). 같은 한 줄이
        118바이트에서는 허용되고 202KB 에서는 오탐이었다. 자리(paths)로 한 번 더 잠갔고
        그 잠금이 살아 있는지를 **4000줄 표본**으로 매번 확인한다.
    unlock_step: |
      python scripts/install_secret_scanner.py — 판·해시는 scripts/secret_scanner.lock.json
      이 고정한다(D-387). 해시가 다르면 **설치를 거절한다.** 받은 물건은 tools/(gitignored)에
      두고 저장소는 lock 만 든다.
    state_in_code: |
      scripts/install_secret_scanner.py — 판·해시 고정 설치 ·
      scripts/secret_scanner.lock.json(판 8.21.2 + sha256) ·
      scripts/verify_secret_scan.py(스캔 면 판정 + 자기시험) ·
      .gitleaks.toml(자리 허용목록) · .gitleaksignore(래칫 D-311)

  - id: BYPASS_FRAMEWORK_MODELS
