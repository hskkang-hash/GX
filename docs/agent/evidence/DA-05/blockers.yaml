          타입   `tsc --noEmit` → **3229건.**  그대로다.

      즉 이 잠금은 **캡처를 막지 않는다** — 그래서 `blocks` 에서 BROWSER_E2E_HARNESS 를
      뺐다. 타입검사와 번들링은 다른 일이고, 스크린샷에 필요한 것은 후자였다.

      ⚠ [실측] 처음 돌린 빌드는 **JS 힙 부족으로 죽었다**(기본 2GB).
        `NODE_OPTIONS=--max-old-space-size=6144` 로 넘겼다. 이것은 판 어긋남이 아니라
        **번들 크기**의 문제다 — 단일 청크가 16MB 다. 둘을 섞어 읽지 말 것.

      ⚠ [실측] `frontend/` 에 **lock 파일이 없다.** D-381 ④ 가 「lock 이 없으면 그것이
        진짜 결함」이라 한 그 상태다. 그리고 `rj-core` 는 커밋이 아니라 **브랜치**를
        가리킨다(`#rj-core-v2`) — 같은 명세가 날마다 다른 것을 설치할 수 있다.
        **판의 진실이 저장소에 없다.** 이것이 3229건의 뿌리이고, 아래 unlock_step ①이다.
    progress_20260913: |
