          설치본의 커밋을 실측했다 (컨테이너 `gx-fe-build` 의 package-lock.json):
              rj-core        commit_sha 51b01e56da253e1b601fb97efd65d10dafe6b7a0
              @gaion/gcs-fe  commit_sha a7846a02bbf790738f894a115d54667128d9b2c9
          그 해시로 `frontend/package.json` 을 **커밋 핀**으로 바꾸고,
          lock 파일을 저장소에 올렸다 (2,384 패키지가 판·해시로 고정된다).
          **브랜치 참조 잔여 0건** [실측] — `scripts/verify_deploy_ready.py` 가 센다.

          재현: 같은 입력으로 **두 번 빌드**해 산출물 197개의 이름·해시가 전부 일치.
