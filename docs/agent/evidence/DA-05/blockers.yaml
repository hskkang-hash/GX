  - id: MEDIA_LIST_SHOWS_EMPTY_WHEN_STORAGE_DOWN
    title: 저장소 미도달 시 미디어 목록이 오류 대신 **빈 목록**으로 보인다
    unlock_type: DEV
    unlock_owner: Code (화면 쪽은 rj-core 인수 화면이라 그쪽 판정이 필요하다)
    blocks: [UX-09]
    since: "2026-09-14"
    blocked_now: true
    verified_at: "2026-09-18"
    verified_by: |
      ★ 갱신 [실측 2026-09-18 · P-5]: **MinIO 를 세웠고 500 은 사라졌다** —
        두 자리 모두 `200 · success:true`. `route-alive` 도 초록이 되었다.
        그러나 **이 등재는 내려가지 않는다.** 여기 적힌 결함은 「저장소가 죽었을 때」의
        일이고, 저장소를 실제로 내려 다시 재어 보니 **그때가 더 나빠졌다:**
            저장소 살아 있을 때   200 · success:true · 1건
            저장소 **내렸을 때**   200 · success:true · 1건   ← 아무 일도 안 일어난다
        `minio_client.available` 이 **기동 시 한 번** 정해지고 다시 보지 않기 때문이다
        (`stream_monitors/utils/minio_client.py:21,41` — `__init__` 에서만 True 가 된다).
        예전에는 저장소가 없으면 최소한 **500 으로 소리쳤다.** 지금은 조용하다.
        운영에서 새벽 두 시에 저장소가 죽으면 화면은 계속 「자료가 있습니다」라고 말하고,
        당직자는 파일을 눌러 본 뒤에야 안다. 자세한 것은 MINIO_AVAILABILITY_IS_BOOT_TIME_ONLY.
      [실측 2026-09-14] `scripts/capture_screens.py` 16장 실행 중 `/media-data` 화면이 부른
      `GET /api/media-data/?page_size=25&current_page=1` 이 **500**.
      토큰으로 직접 재현했고 응답 본문을 그대로 받았다. 화면은 그 500 을 받고도
      「0 of 0」 을 그려 **자료가 없는 것처럼** 보였다 (본문에 오류 문구 0자).
      `scripts/verify_route_alive.py` 가 같은 자리를 **죽은 라우트 2건**(경로 끝
      빗금 있는 것과 없는 것)으로 잡고 exit 1 이다 — 게이트는 빨간 채로 둔다(D-327).
    why: |
      ★ 이번 턴에 **응답이 말하던 두 거짓말은 고쳤다** [실측]:
        · `success: true` · `status: 500`  →  `success: false`
          (dj-core `BaseResponse(success=True, …)` 가 기본값이다. 안 넘기면 조용히 참이 된다)
        · 「Failed to retrieve **operational notice** list」 → 「Failed to retrieve media list」
          (`MESSAGE_ENUM.GET_LIST_FAILED` 하나를 여러 앱이 나눠 쓰는데 영문이 한 앱 것이었다)
      **그러나 화면은 그대로다.** 화면이 `success` 를 보지 않기 때문이고, 그 화면은
      인수 자산이다. 즉 **서버는 이제 진실을 말하는데 화면이 안 듣는다.**
      ★ 500 자체는 이 환경에 MinIO 가 없어서다(`minio.invalid`). 그것은 환경이다.
        여기 등재하는 것은 **「저장소가 죽었을 때 사용자가 그것을 알 수 있는가」**이고,
        지금 답은 **아니오**다 (D-378 — 결함 등급은 보이는 것으로 정한다).
    internal_alternative_considered: |
      같은 저장소에 이미 **저하 운전** 처리가 있다 —
      `[DEGRADED] 외부 의존 실패 … 저하 운전으로 계속한다` (streaming.invalid 자리).
      미디어 목록을 그 방식으로 바꾸면 200 + 빈 목록이 되는데, **그것은 지금 화면이
      보이는 것과 똑같다.** 사용자에게는 아무것도 나아지지 않는다 — 그래서 안 했다.
    why_not: |
      고칠 자리는 서버가 아니라 **화면**이다. 그 화면(rj-core 계열 인수 자산)은
      우리가 고치지 않는다. `/users` 빈 화면(RJCORE_BLANK_ON_NO_PERMISSION)과
      **같은 갈래**다 — 서버는 옳게 말하는데 화면이 그 말을 버린다.
    unlock_step: |
      ① 화면이 `success:false` 를 받으면 안내를 띄우도록 인수 화면 쪽 판정을 받는다
      ② 그때까지 게이트 `route-alive` 는 이 자리에서 **빨간 채로 둔다** —
         초록으로 만드는 예외를 넣지 않는다. 넣는 순간 이 대장이 하는 일이 없어진다
    state_in_code: backend/media_data/views/media_data_view.py — list_media 가 success=False 를 내리도록 고쳤다 (화면은 그대로다)

