  - id: CAMERA_LIVENESS_HEARTBEAT
    title: "카메라가 **살아 있는지 묻는 칸이 없다** — `is_active` 는 스위치이지 맥박이 아니다"
    unlock_type: DEV
    unlock_owner: Code (스키마 한 칸 · 파이프라인이 채운다)
