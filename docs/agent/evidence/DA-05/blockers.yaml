  #   우리 기능 어디에도 입력으로 들어가지 않는다.
  #
  #   ★ 그동안 이것이 잠금으로 남아 있던 이유는 하나다 — **이름이 우리 도메인과 닮아서.**
  #     "CCTV·재난안전정보" 는 우리가 하는 일처럼 들린다. 그러나 하는 일이 아니다.
  #     **이름의 유사성을 기능의 필요성으로 읽은 것** — 이것도 착시의 한 종류다.
  #   국립공원(5)·아동센터(6)도 같다: 컨텍스트 보강용이고 계약 AC 어디에도 걸리지 않는다.
  #   셋의 상태는 .env.example 에 `source: doc_only` + `status: not_required` 로 남는다.

