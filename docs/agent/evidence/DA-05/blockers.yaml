    verified_by: |
      익명 GET 51자리를 캐시 우회로 호출한 실측(docs/agent/evidence/D-343/authn_gap_calls.json)
      에서 **20건이 HTTP 200 + 본문 status_code 403** 이었다.
      코드 자리도 확인했다: site-packages/core/role/permission.py:508 —
      `return {"success": False, ..., "status_code": 403}` 을 그대로 돌려주고
      django-ninja 가 그것을 200 으로 직렬화한다.
    why: |
      **막고 있으므로 유출은 아니다.** 권한은 실제로 거부됐다.
      그러나 호출자가 HTTP 상태를 믿으면 **거부를 성공으로 읽는다** — D-284(거짓 성공)의 HTTP 판이다.
      ★ blocked_now 가 false 인 이유: 지금 어떤 기능도 이것 때문에 멈춰 있지 않다.
        막고 있는 것이 아니라 **틀린 신호를 내보내는 것**이다. 그러나 외부 App 이 붙는 순간
        이것은 연동 규격의 결함이 된다 — F-05 진입면에 파트너가 붙기 전에 풀려야 한다.
    unlock_step: |
      ① dj-core 소유팀에 시정 요청 (permission.py 가 403 상태로 응답하게)
      ② 그때까지 **우리 층 대응**: 우리가 만드는 진입면(F-05 · apps/dsm)은
         `common/api_contract.py` 의 상태 승격을 지나므로 이 모양이 나오지 않는다.
         새 라우트는 우리 층에서 만든다 — 금지구역 안으로 손을 넣지 않는다(D-207).
    internal_alternative_considered: |
      미들웨어에서 본문의 status_code 를 읽어 HTTP 상태로 승격시키는 것.
    why_not: |
      전역 승격은 **응답 모양을 바꾸는 일**이라 프런트 계약 전체를 건드린다.
      지금 그것을 하면 무엇이 깨졌는지 모르는 채로 초록이 된다(D-343 의 경고와 같은 이유).
      그래서 지금은 **재고 기록**으로 두고, 범위 판정을 받는다.
    state_in_code: |
      scripts/probe_authn_gap_calls.py — effective_status() 가 봉투가 아니라 내용을 읽는다.
      dj-core 쪽 자리는 site-packages/core/role/permission.py:508 이고
      **저장소 밖(§0.4 금지구역)이라 여기에 경로로 적지 않는다** — 읽기만 했다.

  - id: BROWSER_E2E_HARNESS
    title: E2E 가 브라우저를 열지 않아 **실행 중 화면을 찍을 수 없다**
    unlock_type: DEV
    unlock_owner: 우리 (개발)
    blocks: [상용 오픈 ⑦사용성-UX-04, 피드백 콘솔의 스크린샷 자리]
    since: "2026-09-08"
    blocked_now: true
    verified_at: "2026-09-08"
    verified_by: |
      backend/tests/e2e/ 의 시나리오 두 벌이 전부 django.test.TestCase 다 —
      Client 로 HTTP 를 때리고 DB·메일을 단언한다. 브라우저를 띄우는 구동체가 저장소에 없다
      (playwright·selenium 어느 것도 requirements 에 없음을 파일에서 확인).
    why: |
      D-347 은 **「E2E 실행 중에 찍는다 · 별도로 화면을 만들어 찍지 마라 · 그림·모형·합성 금지」**다.
      지금 E2E 가 지나가는 자리에는 **화면이 없다.** 그래서 찍을 것이 없다.
      ★ 화면을 따로 띄워 찍으면 그것이 바로 D-347 이 금지한 합성이고,
        「고객이 보는 자리에 실제가 아닌 화면」이 된다 — 착시가 아니라 거짓말이다(D-284).
      그래서 **한 장도 넣지 않고 0장으로 시작한다.** 틀과 게이트는 세웠다 —
      docs/agent/evidence/D-347/screens/INDEX.yaml · scripts/verify_screens.py
    unlock_step: |
      ① 브라우저 구동 E2E 한 벌 (프런트를 띄우고 로그인→대시보드→이벤트 상세까지)
      ② 그 실행 중에 캡처하고 메타 4칸(route·user_role·scenario·captured_at)을 남긴다
      ③ verify_screens.py 가 E2E 로그의 단계·시각과 ±5분 안에서 맞는지 대조한다
      ★ ①이 서기 전에는 INDEX.yaml 이 **비어 있는 것이 정직한 상태다.**
    internal_alternative_considered: |
      기존 Django E2E 가 렌더한 HTML 을 헤드리스로 그려 캡처하는 것.
    why_not: |
      우리 E2E 는 JSON API 를 때린다 — 그릴 HTML 자체가 없다.
      프런트를 따로 띄워 같은 화면을 흉내 내면 그것은 **시험이 지나간 그 화면이 아니다**(D-347 ①).
    state_in_code: |
      backend/tests/e2e/e2e_contract.py — 단계 등재부. **화면 단계가 없다.**
      (0장으로 시작하는 틀은 D-347 의 화면 인덱스에 있다 — 그쪽은 이 잠금의 결과이지
       상태의 자리가 아니다.)

  - id: DELIVERY_ZONE_ANON_LEAK
    title: 금지구역(backend/delivery) 의 2자리가 익명에게 데이터를 돌려주던 것 — **해소됨**
    unlock_type: DEV
    unlock_owner: backend/delivery 소유팀 (§0.4) — 다만 **해소는 우리 층에서 했다**
    blocks: []
    since: "2026-09-08"
    resolved_at: "2026-09-09"
    blocked_now: false
    verified_at: "2026-09-09"
    verified_by: |
      [2026-09-09 · 해소 후 재호출 · 익명 · 캐시 우회]
        GET /api/delivery/drone-monitoring/drone-status   **401** (63 B) ← 그날 17,416 B
        GET /api/delivery/etri-mock/test-scenarios        **401** (63 B) ← 그날  1,976 B
      backend/tests/test_access_gate.py 가 이 둘을 회귀로 못박는다.
      forbidden-zone 게이트는 초록이다 — 그 파일은 한 줄도 안 바뀌었다.

      [2026-09-08 · 해소 전 실측] 같은 두 자리가 200 으로 데이터를 돌려주고 있었다.
      음성 대조 3자리는 같은 실행에서 401 — 환경이 인증을 안 거는 것이 아니었다.
    why: |
      ★ **해소 [판정 D-348 · 2026-09-09]** — 막는 자리를 바꿔서 풀었다.
        D-207 이 금지한 것은 **그 파일을 수정하는 것**이고, 그 경로로 가는 요청을
        **우리 층에서 막는 것**은 금지된 적이 없다. `common/access_gate.py` 한 겹이다.
        「어느 규칙을 어길까」를 고르지 않고 **절차에 예외 경로를 만들었다** —
        규칙도 안 어기고 구멍도 안 남겼다.

      ── 아래는 해소 전의 기록이다. 지우지 않는다(없앤 것과 미룬 것은 다르다) ──
      ★ **우리가 고칠 수 있었고, 실제로 한 번 고쳤다가 되돌렸다.**
        `backend/delivery/views/api.py` 의 4자리에 `JwtOrInboundKey()` 를 붙였더니
        `verify_gates.sh` 의 forbidden-zone 게이트가 **STOP(blocked)** 로 잡았다.
        `backend/delivery/` 는 §0.4 금지구역이다(D-207 · 불변 제약).
      **게이트가 내 손을 잡았다** — 그리고 그것이 맞다(D-327: 게이트 > 지시).
      사고를 알면서 두는 것은 나쁘지만, **금지구역에 손을 넣는 것은 더 나쁘다.**
      막는 방법을 아는 채로 등재해 둔다 — 이 항목은 「모른다」가 아니라 「못 한다」이다.
    unlock_step: |
      셋 중 하나. 어느 것이든 **우리 판정이 아니다.**
      ① 금지구역 소유팀이 그 4자리에 인증을 붙인다 (붙일 코드는 아래 그대로다)
      ② 대표·기획이 이 파일을 티켓의 `reuse_targets` 로 **명시 지목**한다
         (forbidden-zone 게이트가 지목된 파일은 허용한다 — 이미 그 문이 있다)
      ③ 앞단(nginx)에서 그 두 경로를 막는다 — 우리 층 밖이라 금지구역이 아니다.
         다만 **인증이 아니라 차단**이라 정식 해소가 아니다
    internal_alternative_considered: |
      우리 층 미들웨어에서 그 경로만 익명 차단.
    why_not: |
      경로 문자열로 남의 라우트를 막는 것은 **그 파일이 바뀌면 조용히 풀린다** —
      게이트가 못 보는 자리에 방어선을 두는 것이고, 그것이 D-334 가 만든 상태다.
      막을 것은 라우트 선언 자리에서 막는다.
    state_in_code: |
      backend/tests/test_authn_gap_closed.py — 닫은 24자리의 회귀. **이 2자리는 그 목록에 없다** ·
      docs/agent/evidence/D-343/INCIDENT.md §4 — 왜 안 닫혔는지.
