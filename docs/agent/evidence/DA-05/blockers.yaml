# 잠금 대장 — **무엇이 막고 있고, 누가 푸는가** (D-307)
#
# ★ 지금까지 잠김은 전부 "막혔다" 한 단어였다. 셋은 성격이 전혀 다르다:
#     DEV       개발로 풀린다        → 일정 문제
#     CONTRACT  상대방 이행이 필요   → 책임 문제
#     ADMIN     우리 쪽 사무 1회     → **하루면 풀리는데 안 한 것**
#     OPS       현장이 아는 값       → **우리가 만들 수 없는 것** (D-338)
#   섞어 두면 하루짜리가 계약 리스크 뒤에 숨는다. 그래서 유형을 칸으로 만든다.
#
# ⚠ `unlock_type` · `unlock_owner` 가 비면 `scripts/verify_blockers.py` 가 exit 1 한다.
#   등재는 면제가 아니라 **선언**이다 — 여기 이름을 적는 일이 곧 "이것이 막혀 있음을
#   알고 있고, 누가 푸는지도 안다"는 진술이다 (D-264 · D-281 계열).
#
# ═══════════════════════════════════════════════════════════════════════════
# ★ 판정 술어 (D-323) — 「끝났는가」가 아니라 **「지금 막혀 있는가」**
# ═══════════════════════════════════════════════════════════════════════════
#
#     blocked_now = 「그것 때문에 **지금 이 환경에서** 막혀 있는가」
#
#   · **발급 완료 ≠ 전달 완료 ≠ 환경 존재.** 세 사실을 한 칸에 두지 않는다 (D-290 계열).
#   · 「유형을 사실과 다르게 적으면 그 순간 이 대장이 하는 일이 없어진다.」
#   · 잠김 총수와 **지금 막고 있는 수**는 다른 수다. 게이트가 둘을 따로 출력한다.
#
#   verified_at / verified_by — **"완료했다"는 진술이 아니라 확인 행위가 잠금을 내린다.**
#   두 칸이 비면 exit 1. 무엇으로 확인했는지(파일·호출·화면)를 적는다.
#
#   ★ 없앤 것과 미룬 것은 다르다 — `blocked_now: false` 인 항목을 **지우지 않는다.**
#     지우면 나중에 왜 안 했는지 아무도 모른다.
#
# ★ D-333 — CONTRACT·ADMIN(= 우리 밖에 기대는 잠금)에는 두 칸이 더 필요하다:
#     internal_alternative_considered : 무엇을 검토했는가 (없으면 "없음"이라고 적는다)
#     why_not                          : 왜 안 되는가
#   외부 의존 하나를 **안 만드는 것**이 외부 의존 하나를 잘 만드는 것보다 언제나 싸다.

