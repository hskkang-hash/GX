        ② 그 키로 FX-5 를 할 수 없음이 확정됐다(D-329). API 유형이 **도로명주소 팝업 API**
           였다 — 브라우저에 주소검색 창을 띄우는 UI 위젯이고 서버 조회 API 조차 아니다.
           **막고 있던 이유 자체가 사라졌다.**
      그래서 유형은 ADMIN 그대로이되 `blocked_now: false` 다.
      ★ 지우지 않는 이유: **없앤 것과 미룬 것은 다르다.** 지우면 나중에 왜 안 했는지
        아무도 모르고, 다음 사람이 같은 키를 다시 신청한다.
      직전(2026-09-04) 사유는 「승인키 미전달 + 방향 미판정」이었다 — 그 기록도 남긴다.
