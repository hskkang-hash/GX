  - id: DELIVERY_ZONE_ANON_LEAK
    title: 금지구역(backend/delivery) 의 2자리가 익명에게 데이터를 돌려주던 것 — **해소됨**
    unlock_type: DEV
    unlock_owner: backend/delivery 소유팀 (§0.4) — 다만 **해소는 우리 층에서 했다**
    blocks: []
    since: "2026-09-08"
    resolved_at: "2026-09-09"
    blocked_now: false
    verified_at: "2026-09-09"
    verified_by: |
      [2026-09-09 · 해소 후 재호출 · 익명 · 캐시 우회]
        GET /api/delivery/drone-monitoring/drone-status   **401** (63 B) ← 그날 17,416 B
        GET /api/delivery/etri-mock/test-scenarios        **401** (63 B) ← 그날  1,976 B
      backend/tests/test_access_gate.py 가 이 둘을 회귀로 못박는다.
      forbidden-zone 게이트는 초록이다 — 그 파일은 한 줄도 안 바뀌었다.

      [2026-09-08 · 해소 전 실측] 같은 두 자리가 200 으로 데이터를 돌려주고 있었다.
      음성 대조 3자리는 같은 실행에서 401 — 환경이 인증을 안 거는 것이 아니었다.
    why: |
      ★ **해소 [판정 D-348 · 2026-09-09]** — 막는 자리를 바꿔서 풀었다.
        D-207 이 금지한 것은 **그 파일을 수정하는 것**이고, 그 경로로 가는 요청을
        **우리 층에서 막는 것**은 금지된 적이 없다. `common/access_gate.py` 한 겹이다.
        「어느 규칙을 어길까」를 고르지 않고 **절차에 예외 경로를 만들었다** —
        규칙도 안 어기고 구멍도 안 남겼다.

      ── 아래는 해소 전의 기록이다. 지우지 않는다(없앤 것과 미룬 것은 다르다) ──
      ★ **우리가 고칠 수 있었고, 실제로 한 번 고쳤다가 되돌렸다.**
        `backend/delivery/views/api.py` 의 4자리에 `JwtOrInboundKey()` 를 붙였더니
        `verify_gates.sh` 의 forbidden-zone 게이트가 **STOP(blocked)** 로 잡았다.
        `backend/delivery/` 는 §0.4 금지구역이다(D-207 · 불변 제약).
      **게이트가 내 손을 잡았다** — 그리고 그것이 맞다(D-327: 게이트 > 지시).
      사고를 알면서 두는 것은 나쁘지만, **금지구역에 손을 넣는 것은 더 나쁘다.**
      막는 방법을 아는 채로 등재해 둔다 — 이 항목은 「모른다」가 아니라 「못 한다」이다.
    unlock_step: |
      셋 중 하나. 어느 것이든 **우리 판정이 아니다.**
      ① 금지구역 소유팀이 그 4자리에 인증을 붙인다 (붙일 코드는 아래 그대로다)
      ② 대표·기획이 이 파일을 티켓의 `reuse_targets` 로 **명시 지목**한다
         (forbidden-zone 게이트가 지목된 파일은 허용한다 — 이미 그 문이 있다)
      ③ 앞단(nginx)에서 그 두 경로를 막는다 — 우리 층 밖이라 금지구역이 아니다.
         다만 **인증이 아니라 차단**이라 정식 해소가 아니다
    internal_alternative_considered: |
      우리 층 미들웨어에서 그 경로만 익명 차단.
    why_not: |
      경로 문자열로 남의 라우트를 막는 것은 **그 파일이 바뀌면 조용히 풀린다** —
      게이트가 못 보는 자리에 방어선을 두는 것이고, 그것이 D-334 가 만든 상태다.
      막을 것은 라우트 선언 자리에서 막는다.
    state_in_code: |
      backend/tests/test_authn_gap_closed.py — 닫은 24자리의 회귀. **이 2자리는 그 목록에 없다** ·
      docs/agent/evidence/D-343/INCIDENT.md §4 — 왜 안 닫혔는지.

  - id: AI_CALLBACK_NEEDS_CREDENTIAL
    title: AI 서비스의 검출 콜백 2자리가 **인증 없이 쓰고 있었다** — 막았고, 그 클라이언트를 고쳐야 한다
    unlock_type: DEV
    unlock_owner: AI 서비스 팀 (호출하는 쪽)
    blocks: [미디어 분석 결과 콜백(VideoAnalysis 갱신)]
    since: "2026-09-11"
    blocked_now: true
    verified_at: "2026-09-11"
    verified_by: |
      [실측 2026-09-11 · scripts/probe_write_surface.py · 익명 호출]
        POST /api/media-data/detect-callback    익명이 핸들러 자리에 **도달** · 본문은 update_or_create/add
        POST /api/media-data/upload-detection   익명이 핸들러 자리에 **도달** · 본문은 create/save
      (대체물을 끼우고 때렸다 — 본체는 한 줄도 돌지 않았다. D-334 의 방법)
    why: |
      D-368 이 정한 것: **「깨지는 클라이언트가 있으면 그것이 곧 발견이다.
      쓰기 면이 막혀서 깨지는 것은 인증 없이 쓰고 있던 클라이언트다.
      그건 보호할 것이 아니라 고칠 것이다.」**

      이 두 자리는 익명이 `VideoAnalysis` 행을 만들고 고칠 수 있는 자리였다.
      쓰기 오염은 조용하다 — 심어진 분석 결과는 진짜와 섞여서 **나중에 골라낼 수 없다.**
      그래서 같은 파일의 형제 라우트들과 **같은 관문**(`CustomJWTAuth`)을 붙였다.

      ★ 이것은 「우리가 못 하는 일」이 아니라 **「우리가 했고, 상대가 맞춰야 하는 일」**이다.
        그래서 `blocked_now: true` 이지만 주인은 우리가 아니다 — 대장에 두는 이유가 그것이다.

      ⚠ 배포 전에 AI 서비스 쪽 자격증명을 먼저 준비해야 한다. 준비 없이 배포하면
        **미디어 분석 콜백이 401 로 떨어진다.** 이 항목이 그 경고다.
        (재난 검출 본선은 이 경로가 아니다 — 그쪽은 gRPC 이고
         `stream_monitors/services/grpc_dual_stream_service.py` → K1 로 간다.
         즉 **F-02·F-10 계약 경로는 이 변경에 닿지 않는다** [실측].)
    unlock_step: |
      ① AI 서비스에 자격증명 하나를 발급한다 —
         `POST /api/dsm/settings/api-keys` (K5 발급면 · D-367 트리의 F-05 발급)
         또는 서비스 계정의 접근 토큰
      ② AI 서비스가 콜백에 `Authorization` 헤더를 붙이도록 고친다
      ③ 붙인 뒤 `scripts/probe_write_surface.py` 를 다시 돌려
         그 두 자리가 `rejected_elsewhere` 로 내려갔는지 확인한다
      ★ 되돌리는 것은 해소가 아니다 — 관문을 떼면 이 항목이 아니라 사고가 돌아온다.
    internal_alternative_considered: |
      두 자리만 인증 예외로 남기고 IP 허용목록으로 막는 것.
    why_not: |
      IP 는 인증이 아니다. 같은 망 안의 무엇이든 그 자리에 쓸 수 있고, **누가 썼는지가
      기록에 안 남는다.** 오염된 행을 나중에 골라내려면 「누가」가 있어야 한다.
    state_in_code: |
      backend/media_data/views/media_data_view.py — 두 라우트에 auth=CustomJWTAuth() ·
      scripts/verify_write_auth.py — `writes` 0건 래칫(이 자리가 다시 열리면 exit 1) ·
      docs/agent/evidence/D-368/write_surface.json — 전수와 갈래

  - id: FRONTEND_DEPS_DRIFT
    title: 프런트 의존 설치본이 저장소와 어긋난다 — **타입오류 3229건** (빌드는 [2026-09-12] 선다)
    unlock_type: DEV
    unlock_owner: rj-core 소유팀 + 우리 (판 맞추기)
    blocks: [상용 오픈 ⑦사용성-UX-04, 타입 검사]
