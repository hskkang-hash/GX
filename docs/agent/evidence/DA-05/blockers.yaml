      그러면 D-347 의 스크린샷 자리가 계속 0장이다. 즉 이 잠금이
      `BROWSER_E2E_HARNESS` 보다 **앞에** 있다.

      ★ 고치지 않았다. `rj-core` 는 §0.4 이관 자산(git+ssh 사내 저장소)이고,
        **어느 판이 정본인지는 우리가 정할 수 없다.** 판을 맞추는 일은 버전 판정이지
        코드 수정이 아니다 — **남의 뿌리는 대장에** (D-358 원칙 그대로).

      ⚠ 3229 를 「우리 코드의 빚」으로 읽지 말 것. 분모가 다르다.
    unlock_step: |
      ⓪ ★ **lock 을 만든다.** 지금 `frontend/` 에는 lock 파일이 없고, `rj-core` 는
         브랜치(`#rj-core-v2`)를 가리킨다 — 그래서 「저장소가 정본」이라는 D-381 ③ 을
         적용할 대상 자체가 없다. **lock 고정이 첫 일이다** (D-381 ④ 그대로).
      ① `frontend/package.json` 의 `rj-core#rj-core-v2` 가 가리키는 커밋과
         컨테이너 설치본의 커밋을 **대조한다** (둘 중 무엇이 정본인지가 첫 질문이다)
      ② 정본 판으로 `npm ci` 를 다시 하고 `npx tsc --noEmit` 건수를 다시 센다
      ③ 0 이 아니어도 좋다 — **줄어드는 것이 보이면** 그다음이 브라우저 E2E 다
      ★ 새 화면(features/dsm)의 오류가 0건인 상태를 **기준선으로** 잡아 두면,
        판을 맞추다 새 화면이 깨지는 것을 그 자리에서 안다
    internal_alternative_considered: |
      새 화면만 따로 빌드해 캡처하는 것 (별도 vite 진입점).
    why_not: |
      그것은 **시험이 지나간 그 화면이 아니다** — D-347 ①이 금지한 합성이다.
      로그인·사이드바·권한 배선을 지나오지 않은 화면은 고객이 보는 화면이 아니고,
      그런 캡처를 검수 콘솔에 넣으면 착시가 아니라 거짓말이 된다 (D-284).
    state_in_code: |
      frontend/src/features/dsm/ — 새 화면 셋 (타입오류 0건) ·
      docs/agent/evidence/D-347/screens/INDEX.yaml — 0장 사유에 이 사실이 함께 적혀 있다

  # ═════════════════════════════════════════════════════════════════════════
  - id: RJCORE_BLANK_ON_NO_PERMISSION
    title: 권한 없는 화면이 안내 대신 **빈 화면**을 낸다 — `/users` 본문 0자 [실측 2026-09-13]
    unlock_type: DEV
    unlock_owner: rj-core 소유팀 (§0.4 이관 자산 — 우리가 고칠 수 없다)
    blocks: [상용 오픈 ⑦사용성-UX-06, DA-03 §3-4 화면 규약]
    since: "2026-09-13"
    blocked_now: true
    verified_at: "2026-09-13"
    verified_by: |
      [실측 2026-09-13] 브라우저(playwright chromium)로 로그인 뒤 `/users` 로 갔다:
          본문 글자 수 **0** · JS 오류 **0건** · 그 화면이 부른 API **6건 전부 200**
      즉 **서버도 살아 있고 스크립트도 안 죽었는데 화면에 아무것도 없다.**
      원인 [실측]: 이 계정의 `role` 이 **None** 이다 — 읽기 권한 판정이 거짓이 되어
      `rj-core` 의 `UserManagement` 가 **아무것도 그리지 않는다**.
    why: |
      DA-03 §3-4 는 「"권한없음"은 미렌더가 기본이나, **화면 전체가 권한없음이면 빈 화면
      대신 '이 화면에 접근할 권한이 없습니다 · 관리자 문의' 한 장을 낸다**」로 정해 두었다.
      지금 동작은 그 규약 위반이고, **당직자에게는 「화면이 고장 났다」로 보인다**
      (D-378: 결함 등급은 내부 원인이 아니라 보이는 것으로 정한다).

      ★ 이 결함은 **화면을 띄우기 전에는 보이지 않았다.** 단위 538건과 E2E 23건이
        전부 초록인 채로 이 화면은 비어 있었다 — D-386 이 말한 그 층이다.
    unlock_step: |
      ① rj-core 소유팀에 전달: 권한 0인 화면은 안내 한 장을 렌더한다 (DA-03 §3-4)
      ② 우리가 할 수 있는 것 — **우리 화면(features/dsm)에는 같은 구멍을 만들지 않는다.**
         새 화면은 권한 없음일 때 안내를 낸다. 남의 화면은 대장에 둔다 (D-358)
      ③ 검수 콘솔 UX-05(역할↔화면 매핑)와 **같은 자리에서 묻는다** — 「이 역할에 이 화면이
         보이면 안 된다」의 답이 오면, 그때 「보이면 안 될 때 무엇을 보이나」도 정해진다
    internal_alternative_considered: |
      우리 App.tsx 에서 그 라우트를 감싸 안내 화면을 덧대는 것.
    why_not: |
      덧대면 **우리 코드가 남의 화면의 권한 판정을 흉내내게 된다** — 판정식이 두 벌이 되고
      (D-212 가 금지한 모양), rj-core 가 규약을 고치는 날 두 안내가 겹친다.
      지금은 **사실을 대장에 두고**, 우리 화면에만 규약을 지킨다.
    state_in_code: |
      scripts/capture_screens.py — `KNOWN_BLANK` 「열어 봤더니 빈 화면」 목록 ·
      docs/agent/evidence/D-386/screen_routes.json 의 `blank_screens`

  # ═════════════════════════════════════════════════════════════════════════
  - id: K3_ROLE_MAPPING_UNCONFIRMED
    title: 역할↔프리셋 매핑 — **7종은 우리 판정이고, 8종은 미배선이다.** 정답은 고객이 안다
    unlock_type: CONTRACT
    unlock_owner: 안양 관제팀 (고객)
    blocks: [상용 오픈 ⑦사용성-UX-05, 역할별 화면의 정확성]
    since: "2026-09-12"
    # ★ 게이트가 요구해서 채우는 칸이 아니다 — **묻지 않은 질문은 지연이 시작되지도
    #   않는다.** CONTRACT 로 올린 순간 「언제 물었고 언제까지 답을 받나」가 없으면
    #   그 잠금은 영원히 「고객 대기」로 늙는다 (D-320 · 계약 6조3항 기산).
    #   그래서 이 턴의 회신에 이 질문을 실어 보내는 것을 발송으로 잡는다.
    sent_at: "2026-09-12"        # 이 턴 회신 §7 「역할↔화면 매핑 확인」으로 발송
    due_by: "2026-09-27"         # 발송 + 15일 (계약 3조2항 준용)
    blocked_now: true
    verified_at: "2026-09-12"
    verified_by: |
      [실측 2026-09-11 · role.Role 전수] 이 저장소의 역할 코드는 **15종**이다.
      DA-03 §3-4 는 역할을 **「다섯 종류의 사람」**으로 적었다. 그 둘을 잇는 표가
      문서 어디에도 없다 — 그래서 `backend/config/k3_roles.py` 에서 **우리가 이었다.**

      이은 것 7종 (근거는 파일의 주석마다 있다):
        OPERATOR  : fire_user · surveillance_operation · operator
        MANAGER   : fire_admin · surveillance_order · admin
        EXECUTIVE : view_only_-_anyang
      비운 것 8종 (`K3_UNMAPPED_BY_DECISION` · **추측으로 채우지 않았다**):
        order · delivery_admin · delivery_order · delivery_operation ·
        drone_robot_admin · drone_robot_user · user · superuser
    why: |
      ★ **이것은 인용이 아니라 우리 판정이다** (D-383). 그 표기를 여기 남기는 이유는
      다음 사람이 이 표를 「DA-03 에서 옮겨 적은 것」으로 읽지 않게 하기 위해서다 —
      옮겨 적은 표는 원본을 찾아 대조할 수 있지만, **판정한 표는 판정한 사람에게
      물어야 한다.** 어느 쪽인지 모르면 아무도 못 고친다 (D-322 의 계열).

      ★ 그리고 이 매핑의 정답은 우리에게 **없다.** 「재난관제 관리자가 임계값을 편집할
        수 있는가」는 코드가 답할 수 있는 질문이 아니라 **운영 규정**이다.
        틀리면 두 방향으로 틀린다: 넓으면 볼 것이 아닌 사람이 보고, 좁으면 일이 안 된다.

      ⚠ 지금 상태는 **안전한 쪽으로 틀려 있다** — 매핑에 없는 역할은 `matched=False` 로
        가장 좁은 프리셋(OPERATOR)에 떨어지고, 편집(E)은 설정 없이는 **절대 참이 되지
        않는다**. 그래서 이 잠금은 「위험」이 아니라 「미확정」이다.
    unlock_step: |
      ★ **화면이 없어도 할 수 있는 검수다** — 이것이 검수 콘솔의 첫 실전 용도다(D-383).
      ① 검수 콘솔의 `UX-05` 항목으로 관제팀에 셋을 묻는다:
         ㉠ 이은 7종이 **맞는가**
         ㉡ **빠진 것**이 있는가 (미배선 8종 중 화면을 받아야 하는 역할)
         ㉢ **이건 보이면 안 된다** 가 있는가
      ② 받은 답만 `K3_ROLE_PRESET_MAP` 과 `K3_WIDGET_MATRIX` 에 넣는다.
         **답이 없는 칸은 비운 채로 둔다** — 비어 있는 것이 틀린 것보다 낫다(D-280).
      ③ 답을 받은 날짜와 답한 사람을 여기 `verified_by` 에 적는다 — 진술이 아니라 출처다.
    internal_alternative_considered: |
      역할 이름의 유사도로 나머지 8종도 자동 매핑하는 것.
    why_not: |
      이름이 비슷한 것과 **권한이 같은 것**은 다르다. `drone_robot_admin` 에 MANAGER 를
      주면 배송 관리자가 재난 임계값 편집 화면을 얻는다 — 그것은 추측이 만든 권한이고,
      추측으로 만든 권한은 **아무도 자기가 가진 줄 모른다.** (D-280 추정 금지)
    state_in_code: |
      backend/config/k3_roles.py — 이은 7종 · 비운 8종(사유 포함) ·
      backend/kernels/k3_dashboard/presets.py — 설정이 비면 가장 좁은 쪽으로 떨어진다 ·
      docs/agent/evidence/D-347/screens/SCREENS-1/OPERATOR/dsm_dashboard.png —
        ★ **그 상태가 화면에 찍혀 있다**: 「역할 매핑을 찾지 못해 가장 좁은 화면으로
        떨어졌습니다」. 캡처가 이 잠금의 증거를 겸한다

