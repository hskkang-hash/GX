                빌드 exit 0 · 각 50초 (`NODE_OPTIONS=--max-old-space-size=6144`).

      ⚠ **아직 확인하지 못한 것 — 핀이 실제로 그 커밋을 가져오는지는 못 봤다.**
        이 환경에서 사내 git(192.168.0.22:22)은 **연결이 거부된다** [실측:
        `ssh: connect to host 192.168.0.22 port 22: Connection refused`].
        그래서 `npm ci` 로 처음부터 설치해 보는 갈래는 **돌리지 못했다.**
        지금 증거가 말하는 것은 **번들의 재현성**이고, **설치의 재현성이 아니다** —
        둘을 섞어 읽지 말 것 (D-301: 검사 못한 것은 0건 검사가 아니다).

      ⚠ 타입오류 **3229건은 그대로다.** 고정은 그 수를 줄이지 않는다 —
        **늘지 않게 잠그는 일**이다 (D-387: 래칫으로 두고 새 코드 100%).

    verified_by: |
      [실측 2026-09-11]
        · 호스트에 `frontend/node_modules` 가 **없다** (`npx tsc` 가 tsc 를 못 찾는다)
        · 있는 설치본은 컨테이너 `gx-fe-build` 뿐이다 (node_modules 778개)
        · 그 안에서 `npx tsc --noEmit -p tsconfig.app.json` → 저장소 전체 **3229건**
