    unlock_step: |
      ★ [2026-09-11 · D-371 갱신] **①의 절반이 풀렸다.** 지우지 않고 덧붙인다:
        화면 셋이 코드에 섰다 — frontend/src/features/dsm/pages/{ControlDashboard,
