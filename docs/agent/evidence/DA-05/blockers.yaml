        `kernels.k5_trust.refresh_credential(name=..., verified_by=...)` 이 채운다(D-325).
    internal_alternative_considered: |
      **카메라 설치 주소**(D-330). 카메라는 고정 설치물이므로 설치할 때 주소를 안다.
    why_not: |
      ★ 반대다 — **내부가 이겼다.** 이벤트 위치는 그 카메라의 주소이고, 외부 호출 0건 ·
      타임아웃 없음 · 비용 0 이다. 결과까지 더 좋다: 「정문 (서울시 …로 12)」.
      남은 팝업 키의 용처는 **주소를 입력할 때 오타를 막는 것** 하나이고, 그것은
      지금 막고 있는 일이 아니다.
    why: |
      ★ 2026-09-06 **사유가 통째로 바뀌었다** — 두 가지가 동시에 일어났다(D-332):
        ① 키가 왔다(파일로). 다만 **아직 개발 환경에 넣지 않았다** — 발급 ≠ 전달 ≠
