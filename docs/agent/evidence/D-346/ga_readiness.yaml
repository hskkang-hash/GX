            ④ 회수를 **프로세스를 건너** 실측(발급 직후 200 → 회수 뒤 401) ·
               전부 끊기는 `WALL_TOKEN_EPOCH` · 되돌리기 `WALL_TOKEN_ENABLED=False`
          시험 30건 초록(대조군 「로그인으로 월을 켜면 자리가 죽는다」 포함).
          ⚠ **잰 것은 서버 면이다.** 브라우저 캡처 0장 — 화면 배선은 UX-24c 로 쪼갰다.
          ⚠ 월 계정의 **역할 범위**를 이 절이 정하지 않았다. 토큰은 그 계정 자격으로 읽으므로
            넓은 역할을 주면 두 문이 내주는 범위가 넓어진다 — 좁은 전용 계정 판정 대기.

      - id: UX-24c
        title: "`/wall` 화면이 표시 토큰을 **싣는다** — 브라우저로 실측한다"
        status: 구현
        proof: docs/agent/evidence/P-78/README.md
        hand: in
        note_closed: |
          [실측 2026-09-06 · 턴 H 차선 C · **조율자 검수**] 자기 손으로 적은 조건 셋을 **전부** 갚았다.
            ① 「쿼리 파라미터는 접근로그에 남으므로 안 된다」 — **받는 자리를 조각부로 옮겼다.**
               앞단이 적는 요청 줄을 그대로 대조했다:
                 `/wall?token=<토큰>` → `"GET /wall?token=<토큰> HTTP/1.1"`  토큰이 남는다
                 `/wall#token=<토큰>` → `"GET /wall HTTP/1.1"`               **토큰이 없다**
               조각부는 브라우저가 서버로 보내지 않는다. 그리고 옛 주소는 **받지 않는다** —
               지우기만 하고 「이 주소로는 열 수 없습니다」를 말한다(코드 확인: `adoptWallToken`
               의 질의부 갈래는 `legacyQuerySeen` 만 세우고 토큰을 안 읽는다).
               ★ 턴 G 는 같은 자리에서 `?token=` + `history.replaceState` 였고 **닫지 않았다** —
                 지워지는 것은 주소창이지 이미 나간 요청이 아니었다. 그 판정이 옳았다.
               ⚠ 절이 예시로 적은 「교환 코드 POST」는 **하지 않았다.** 그러려면 발급 문을
                 HTTP 에 내야 하는데 UX-24a 가 자기 손으로 「발급 문 자체가 새 공격면이다」를
                 적어 두었다. 한 글자로 닫히는 조건을 새 문으로 닫지 않았다 — 예시가 아니라
                 **조건**을 갚은 것이고, 조건의 문장은 「접근로그에 남지 않는다」였다.
            ② 브라우저가 두 문에 `X-GX-Wall-Token` 을 **실제로 실었다**(턴 G 엔 0건).
               그때 막던 것은 서버가 아니라 `CORS_ALLOW_HEADERS` 의 프리플라이트였다.
            ③ `docs/agent/evidence/P-78/shots/{wall_fragment,wall_query_refused,desk_alive_after_wall}.png` —
               **자리 데스크톱이 `/dsm/queue` 를 보는 동안** 월이 떴고 튕기지 않았다.
               동시 접속 1 의 제품에서 이것이 이 절의 심장이다.
          ⚠ 남은 것(이 절의 몫이 아니다): 월 계정의 **역할 범위**가 아직 넓다 —
            좁은 전용 계정 판정은 UX-24a 가 대기로 적어 둔 자리다. 두 테넌트 교차 확인도 못 했다
