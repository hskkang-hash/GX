        title: 부하 시험 시나리오와 도구
        status: 구현
        proof: scripts/perf_load.py
        note: |
          [실측 2026-09-26 · 차선 Q · 동시 10 · 5라운드 · 워밍업 1라운드 버림 · 오류 0건]
            S1 목록      p50 397.9ms · p95 424.6ms
            S2 대시보드  p50 389.9ms · p95 431.0ms
