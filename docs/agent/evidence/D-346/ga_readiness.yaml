      - id: PERF-05
        title: 처리량 — **어디서 먼저 무너지는가**
        status: 구현
        proof: docs/agent/evidence/D-359/perf_load.json
        note: |
          ★ [실측 2026-09-10 · D-359 · 동시 1→16 계단 · 호출 310건]
                동시  1 · p95   45.30ms · 처리량  29.68/s
                동시  2 · p95   54.13ms · 처리량  78.01/s
                동시  4 · p95   42.81ms · 처리량 108.71/s   ← **처리량이 여기서 평평해진다**
                동시  8 · p95  103.41ms · 처리량  92.52/s
                동시 16 · p95  191.45ms · 처리량  96.34/s   ← 기준의 3배를 넘는다
          ★ **먼저 무너지는 자리**: 처리량은 동시 4에서 평평해지고 지연은 8부터 오른다.
            즉 **더 넣어도 더 처리되지 않고 느려지기만 한다.**
          ★ 예상 못 한 것: 부하를 올리자 `detectionevent` 에 **분당 200건 속도제한**이
            걸렸다. 이 환경에서 먼저 무너진 것은 DB 도 CPU 도 아니라 **우리 쪽
            속도제한**이다. 그 값의 근거와 운영 적정성은 **아직 모른다** — PERF-06.
          ★ 이 수를 「카메라 몇 대」로 읽지 마라. 잰 것은 이벤트 쓰기·알림의 동시성이고
            스트림 수집·디코딩·추론은 들어 있지 않다(PERF-02 가 그 자리다).

          ★★ **[정정 2026-09-27 · 조율자 · PERF-06 실측 뒤] 윗줄이 오독을 낳는다.**
            「먼저 무너진 것은 우리 쪽 속도제한」은 **「이벤트 처리량이 200/분에서 막혔다」**
            로 읽힌다. **그 읽기는 틀렸다** [실측 · 호출로 확인]:
              투입 300건 → DB 행 **300건** · **dropped 0** · 5.345초 = **56.1건/초(3,366건/분)**
            무너진 것은 이벤트 경로가 아니라 **캐시 무효화 신호**이고, 그것은 버려진 것이
            아니라 **미뤄졌다**. 이벤트 기록 경로에는 상한도 큐도 없다.
            ⚠ 그러므로 **「200/분」을 이 제품의 처리량으로 인용하지 마라** — 영업·제안서에
              그 수가 들어가면 실측의 60분의 1을 스스로 적는 것이 된다.
            **로그가 소리친 자리와 무너진 자리는 다르다.** 자세한 것은 PERF-06.

      - id: PERF-06
        title: 이벤트 속도제한 200/분 — **근거와 운영 적정성**
        status: 구현
        proof: scripts/probe_event_rate_limit.py
        why: |
          ★ [D-359 · 2026-09-10 부하시험 중 발견] 부하를 올리자
            "Rate limit exceeded for detectionevent (200/min) - skipping" 이 나왔다.
            **먼저 무너진 것이 이 제한**이다.
          모르는 것 셋: 이 값이 어디서 왔는가 · 재난 상황의 실제 이벤트율은 얼마인가 ·
          `skipping` 이 **이벤트를 버리는 것**인가 미루는 것인가.
          ★ 마지막 것이 특히 급하다 — 버리는 것이면 **재난이 몰릴 때 이벤트가
            사라진다.** 그 순간이 정확히 시스템이 필요한 순간이다.
          해소: 그 제한의 출처를 코드에서 찾고, 버리는지 미루는지를 **호출로** 확인한다.
        note_closed: |
          ★★ **닫혔다 [실측 2026-09-27 · 턴 B 차선 Q] — 그리고 가장 무서웠던 답이 아니었다.**
          `skipping` 은 **이벤트를 버리는 것이 아니라 미루는 것**이고, 애초에 미뤄지던 것도
          **이벤트 행이 아니라 캐시 무효화 신호**였다. 이벤트 기록 경로(`record_detection`)에는
          **상한도 큐도 없다** — 200/분은 이벤트를 한 번도 막은 적이 없다.
          [실측 · 호출로 확인 · `scripts/probe_event_rate_limit.py` · 되돌리는 트랜잭션]
            투입 **300건** · DB 행 **300건** · **dropped 0** · deferred 817 · coalesced 3,383 ·
            ran_inline 0 · failed 0 · 5.345초 = **56.1건/초(3,366건/분)** · 되돌린 뒤 남은 행 0.
          ★ **표본을 서로 다른 스트림 300대로 세웠다.** 같은 스트림이면 10초 기록창이 접어
            「속도제한」 대신 **「중복 억제」를 재게 된다** — 접힘 0건을 함께 세어 그것을 보였다.
          출처: `common/universal_optimization.py:2385` `CACHE_INVALIDATION_RATE_LIMIT=200`
          (표 ① `event.invalidation_rate_limit`). 지키던 것은 DB 가 아니라 **Redis 와 응답 지연**
          이고, 물려받은 값이다.
          재난 이벤트율 [추정]: 카메라 40대 · 종류 7 · 기록창 10초 → 대당 최대 42건/분 →
          **상한 1,680건/분**. 200/분은 **카메라 5대만 전 종류를 잡아도 넘는다** —
          그러나 **넘는 것 자체가 결함이 아니다. 넘어도 소실이 0이다.**
          ★ **[판정] 값 200 을 바꾸지 않는다**: ① 이벤트를 막지 않고 ② 넘어도 잃지 않으며
            ③ P-19 가 `dsm/` 를 통째로 캐시 우회로 올려 **미룬 무효화가 관제 화면에 닿지 않는다.**
            큐잉 갈래는 이미 옳게 서 있다(D-367): 접기 · 심각등급 불가침 · 흘리개 600건/분
            (잔량 767건 → 약 77초 — 이는 **무효화 지연**이지 F-10 의 30초가 아니다).
          ⚠ **정본 PERF-05 의 문안을 조율자가 정정했다**(아래 PERF-05 참조):
            「먼저 무너진 것은 우리 쪽 속도제한」은 **「이벤트 처리량이 200/분에서 막혔다」로
            오독된다.** 실측은 56.1건/초 · 소실 0이다.

      - id: PERF-04
        title: 응답시간 예산과 그 회귀 감시
        status: 구현
        proof: scripts/verify_perf_budget.py
        note_closed: |
          ★★ **[실측 2026-09-05 · 턴 D] 이 절의 예산 게이트가 지금 빨갛다 — 그리고 그 빨강은
            응답시간이 아니라 오류다.** 앞단(gunicorn+nginx) 위에서 3,722 요청을 네 벌 냈더니
            502 가 8 · 1 · 1 · 0 건이었고, 게이트는 설계상 **「오류가 있으면 예산과 무관하게 빨강」**이다.
            응답시간 자체는 오류가 0 인 벌(run3)에서 **네 면 전부 예산 안**이었다.
            그 오류의 몸은 이 절이 아니라 **OPS-13a**(앞단이 워커 재활용을 삼킨다)이고,
            거기서 인과까지 증명됐다.
            ⚠ 그래서 이 칸을 초록으로 **두되**, 「예산 게이트가 초록이다」라고 읽지 말 것 —
              **지금 이 부하에서 그 게이트는 빨갛다.** 「502 8건/3,722요청이 감당할 수 있는 수인가」는
              **세종·대표 판정 요청**이다. 두 수를 나란히 두는 것이 한 수로 뭉개는 것보다 옳다.
          ★★ **닫혔다 [실측 2026-09-05 · 턴 C] — 그리고 대장의 예상이 반대로 틀렸다.**
          OPS-13 이 서자 게이트가 `Server: nginx` 를 보고 **저절로 합격선 모드**로 갈렸다.
          여기서 **빨강이 될 거라던 두 자리가 초록**이 됐다:

          | 면 | 예산 | 기준선(runserver) | **합격선(앞단)** |
          |---|---|---|---|
          | **F05** 계약 진입면 | 500ms | 524.7 **초과** | **167ms** |
          | **STATUS** (캐시 금지) | 300ms | 363.3 **초과** | **171ms** |
          | SCREEN 화면 API | 800ms | — | 262ms |
          | MEDIA 스냅샷·미디어 | 1,000ms | — | 174ms |

          ★ **넘게 만든 것은 코드가 아니라 환경이었다.** 09-05 에 「이 둘은 OPS-13 뒤
            합격선에서 **빨강이 된다**」고 이 대장에 적었고, 그 예상은 틀렸다.
            `pending_acceptance` 는 이제 **빈 목록**이다.
            ⚠ 그래도 **그때 「기준선으로 초록」이라 적지 않고 넘긴 것은 옳았다** —
              예상이 맞았는지가 아니라 **잰 자리에서만 판정한 것**이 옳았다.

          ★★ **회귀 감시가 넷 중 셋에서 판정을 냈다** — 그리고 **뿌리는 앞단이 아니라
            기계였다** [실측]: 같은 코드·같은 앞단인데 loadavg **2.36 에서 잡음 34~67%**,
            **0.10 에서 16~18%**.

          | 면 | 잡음 | 회귀 판정 |
          |---|---|---|
          | **F05** | 16% | **초록** — 167ms ≤ 516ms |
          | **MEDIA** | 16% | **초록** — 174ms ≤ 614ms |
          | **STATUS** | 18% | **초록** — 171ms ≤ 500ms |
          | **SCREEN** | 39% | **회색** |

          ⚠ **SCREEN 하나는 조용한 기계에서도 회색이다. 그대로 적는다 — 회색은 초록이 아니다.**
            [추정] 이 면만 호출이 넷이고 집계 질의가 섞여 있어, 남은 잡음의 출처가
            환경이 아니라 **그 면의 질의**일 수 있다. 단정하지 않는다.
            다음 걸음: **네 호출을 따로 잰다** — 면으로 접으면 가장 흔들리는 하나가
            나머지를 가린다(P-35 가 SEC-11 을 쪼갠 것과 같은 이유).

          ⚠ **게이트 자체는 `exit 1`(빨강)이다. 그 빨강은 성능이 아니라 502 3건이다** —
            **느린 것보다 틀린 것이 먼저다.** 그 자리는 `OPS-13a` 로 따로 등재했다.
            이 절이 「구현」인 것과 그 게이트가 지금 빨간 것은 어긋나지 않는다:
            이 절은 **예산과 그 감시가 서 있는가**를 묻고, 빨강은 **감시가 일하고 있다**는 뜻이다.
        why: |
          [실측 2026-09-27 · 턴 B 차선 Q] **예산은 정해졌고 도구도 섰다. 판정이 안 난다.**

          ① **예산 표 — 확정**(세종 위임 판정 P-34 · 2026-09-27):
             계약 F-05 진입면 **p95 ≤ 500ms**(NFR-05-1) · 화면 API **≤ 800ms** ·
             스냅샷·미디어 **≤ 1,000ms** · 상태·가용성(캐시 금지 P-19) **≤ 300ms** ·
             회귀 = 기준선 대비 **+20% 초과 시 빨강**.
          ② **회귀 감시 도구 — 섰다**: `scripts/verify_perf_budget.py`
             (자기시험 **39갈래** exit 0 · 동시 10 · 3벌 · 면당 n=300 · 호출마다 `?bust=`).
          ③ **그런데 판정이 안 난다** — 게이트가 **exit 2(회색)** 를 낸다:
             F05 의 3벌 p95 **513–541ms** 가 회귀 문턱 **516ms**(기준선 430 × 1.20)를
             **걸친다.** 넘은 벌도 있고 든 벌도 있다. **회색은 초록이 아니다.**

          ★ **세종 P-34 의 단서는 집행했다 — 그리고 절은 다른 이유로 안 닫힌다.**
            P-34 는 「`runserver` 수는 기준선 · 그때까지 회색 아님 — 기준선으로 초록」이라
            했고, 그것은 **절대 예산**에 대한 판정이다. 그대로 집행했다: 예산 초과 둘은
            이제 빨강(`X`)이 아니라 **기록(`!`)** 이고 종료 코드를 물들이지 않는다.
            지금의 회색은 **회귀**가 낸 것이고, 회귀는 P-34 가 「+20% 초과 시 빨강」이라고
            직접 재라고 한 자리다. **판정을 시킨 자리에서 판정을 못 하고 있다.**
          ★ 뿌리는 코드가 아니라 환경이다: `runserver` 는 한 프로세스라 꼬리가 스케줄러를
            타고, 이 컨테이너에는 **runserver 가 여럿 서 있다**(차선 병렬 · `co_resident`).
            내 p95 가 남의 부하를 함께 잰다.
          ★★ **넘은 자리 둘을 이름으로 남겼다** — `budget.json` 의 `pending_acceptance`:
            **F05** 524.7ms(513–541) > 500ms · **STATUS** 363.3ms(358–377) > 300ms.
            STATUS 는 **캐시 금지 면이라 캐시로 갚을 수 없다** — 질의 자체가 빨라져야 한다.
            이 둘은 OPS-13 뒤 합격선 모드에서 **빨강**이 된다(`--acceptance` 로 확인 · exit 1).
          ★ 모드는 `Server:` 헤더로 **저절로 갈린다** — `WSGIServer` → 기준선,
            `gunicorn`·`nginx`·**못 읽음** → 합격선. 모르는 서버를 기준선으로 접으면
            **진짜 운영이 조용히 면제를 받는다.** 사람이 기억해야 켜지는 규칙은 바쁜 날
            깨진다(D-286).
          해소: OPS-13 이 서면 그 앞단에서 다시 잰다 — 그 한 번으로 이 절이 색을 얻는다.

      # ── PRD v2.5 신규 (2026-09-24 · P-26 등재) ──────────────────────────
      - id: PERF-07
        title: VLM 사유 시간 예산 (p95 ≤ 2s · GPU 1장)
