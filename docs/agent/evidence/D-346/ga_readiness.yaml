            `POST /api/user-groups` — **끝의 `/` 가 없는 모음 라우트**라 `startswith` 접두에
            안 걸린다. **목록·생성처럼 가장 많이 불리는 자리가 정확히 그 모양이다.**
            `path_in_scope()` 로 메웠고 프로브도 그 정본을 쓴다 → 224.
            「한 건쯤」으로 넘겼으면 승격이 가장 뜨거운 자리를 비켜 간 채 초록이 났을 것이다.
          ★ **남은 224 중 화면이 실제로 부르는 것은 7건**이고 전부 이름으로 적는다:
            departments 3 (`POST /api/departments` · `DELETE …/delete/{department_ids}` ·
