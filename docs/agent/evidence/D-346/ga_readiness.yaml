            ⚠ **지우지 않았다** — 승인받은 것은 두 모듈이고, 세 번째는 다음 승인의 자리다.
            기준선에 이름으로 남겨 두었다(`D-377/dormant_baseline.txt`): 조용히 사라지지
            않게 하는 것이 이 대장의 일이다.
