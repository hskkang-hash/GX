  - id: "4"
    name: 운영 (설치·백업·복구·감시)
    weight: 15
    clauses:
      - id: OPS-01
        title: 설치·운영 매뉴얼이 있다
        status: 구현
        proof: docs/agent/runbook/설치운영매뉴얼_v0.1.md

      - id: OPS-02
        title: "**빈 환경에서** 매뉴얼대로 설치가 재현된다"
        status: 미측정
        hand: in
        hand_why: |
          빈 컨테이너 하나면 잰다 — 도구·환경이 손 안이다
        why: |
          매뉴얼은 「빈 것에서 세워 보며」 적었으나, 인수자가 빈 환경에서 재현한 기록이 없다.
          우리가 우리 환경에서 한 번 더 도는 것은 재현이 아니다(착시 ⑤ — 환경).

      - id: OPS-03
        title: 마이그레이션이 한 줄로 선다
        status: 잠김
        hand: in
        hand_why: |
          dj-core 는 못 고치지만 **우회 경로를 우리 층에 둔다**고 이 대장이 이미 적었다
        blocker: MIGRATE_ONE_LINER
        why: dj-core `logger/0009` 의존 미선언. §0.4 라 우리가 못 고친다 — 우회 경로를 우리 층에 둔다.

      - id: OPS-04
        title: 백업 — DB 를 뜨고 **무엇을 떴는지 대장을 남긴다**
        status: 구현
        proof: scripts/ops_backup.py
        note: |
          [실측 2026-09-09] db_database_guardianx_20260829T134442Z.dump · 4,447,529 bytes ·
          증인 표 5개의 행 수를 대조표에 함께 남긴다(카메라 39 · 사용자 103).
          ★ 클라이언트 판이 서버 판과 맞아야 한다 — 앱 컨테이너의 pg_dump 17.7 로는
            서버 18.1 을 못 뜬다(실측). 그래서 「어디서 뜨는가」가 인자다.

      - id: OPS-05
        title: 복구 — **해 봤다.** 임시 DB 로 살려 행 수를 맞췄다
        status: 구현
        proof: docs/agent/evidence/D-354/restore_run.md
        note: |
          [실측 2026-09-09] 카메라 39→39 · 사용자 103→103 · 이벤트 0→0. 쓴 명령을 그대로 남겼다.
          원본은 세 겹으로 지킨다: 이름이 원본과 같으면 시작하지 않고, `restore_check_` 로
          시작하지 않으면 거부하고, 끝나면 지운다(실패해도 지운다).

      - id: OPS-09
        title: 백업·복구 — **영상 객체저장**
        status: 구현
        proof: docs/agent/evidence/D-356/restore_objects_run.md
        note: |
          ★ [실측 2026-09-10 · D-356] **되살려 봤다.** 대상 3개 · 되살림 3개 ·
            **해시 일치 3개.** 원본 버킷에는 쓰지 않았다(새 버킷 gx-restore-* 로만 간다 —
            DB 복구가 gx_restore_* 임시 DB 로만 가는 것과 같은 규약).
          ★ 「파일이 생겼다」는 성공이 아니다. 0바이트 파일도 생긴다 —
            **바이트가 그때 그 바이트인지**를 재는 것만이 복구 판정이다.
          ★ 범위는 **이벤트에 묶인 것만**(기본 --object-scope event_bound).
            버킷 전량은 크고 비싸고 제품에 맞지도 않는다 — 증빙이 되는 것은
            「그 이벤트의 그 장면」이고 그것을 아는 표가 EventClip(D-306)이다.
            음성 대조: 이벤트에 안 묶인 객체 2개는 **안 떴다**(skipped 2).
          ★ 보존 기간 90일(RETENTION_DAYS). 계약이 정한 수가 아니다(D-280) —
            정하지 않으면 디스크가 정책을 대신 정한다.
          ★ 덤으로 얻은 것: 백업이 **이미 잃어버린 것을 드러낸다.** 「이벤트에 묶였는데
            버킷에 없는 객체」를 건수로 낸다 — 그 수가 0이 아니면 복구해도 안 돌아온다.
            음성 대조로 1건을 심어 실제로 잡히는 것을 확인했다.

      - id: OPS-12
        title: 백업 **목적지** — 다른 볼륨·다른 호스트
        status: 미착수
        why: |
          ★ [D-356 ②] 지금 백업 목적지는 **저장소 안**이다. **같은 디스크는 백업이 아니다.**
          운영에서는 최소 다른 볼륨, 가능하면 다른 호스트여야 하고, 그 목적지는
          **배포 구성에서 정해진다.** 실측하지 않은 경로를 매뉴얼에 적으면
          문서가 거짓말을 시작한다(D-286) — 그래서 「해 봤다」와 「어디에 둘지는 아직」을
          매뉴얼 §4-B-5 에 함께 적었다.
          ★ OPS-09(복구해 봤다)와 **다른 절**이다. 되살릴 수 있는 것과 안전한 곳에
            두는 것은 다른 일이고, 한 절로 묶으면 뒤엣것이 앞엣것에 가려 잊힌다.

      - id: OPS-13
        title: 배포 앞단 이중방어 (리버스 프록시)
        status: 미착수
        why: |
          ★ [D-361 · 판정: **건다. 다만 지금이 아니다**] 원칙은 하나 —
            **단일 방어선은 방어선이 아니다.** 미들웨어는 코드이고, 코드는 리팩터링
            중에 순서가 바뀐다. 앞단은 그때 남는다.
          지금이 아닌 이유: 앞단 구성은 배포 문서 작업의 일부이고, 그 구성을 실측하지
          않은 채 규칙만 적으면 **문서가 거짓말을 시작한다**(D-286).
          해소: 배포 구성 작업에서 함께 세우고, 그때 미들웨어 순서 시험
          (test_access_gate.py::GateIsOutsideTheCacheTest)을 앞단까지 넓힌다.
          ★ 이 절이 여기 **등재된 것 자체**가 D-361 의 이행이다 — 판정을 받고
            안 한 것과, 판정을 받고 자리에 적어 둔 것은 다르다.

      - id: OPS-06
        title: 감시 3종 — 살아 있는가 · 밀리는가 · 채워지는가
        status: 구현
        proof: scripts/ops_monitor.py
        note: |
          [실측 2026-09-09] 신호 7개 · OK 6 · UNKNOWN 1(이벤트 0건이라 「밀림」을 잴 수 없다).
          `--check` 가 exit 0/1/2 로 답한다 — 크론에 걸고 exit 1 을 사람에게 보내면 경보다.
          ★ 임계값마다 **왜 이 수인가**를 적었다. 적을 수 없는 임계값은 임계값이 아니다.
          ★ 보내는 자리(메일·문자·챗)는 고객 환경마다 달라 여기서 정하지 않았다 — OPS-10.
          [실측 2026-09-20 · D-415] 신호 **11개**로 늘었다 (평상 운영 ① 죽은 카메라 ·
          ④ 저장 용량). 상태는 그대로 「구현」이다 — 신호가 늘었다고 절이 더 되는 것은
          아니다. 다만 ①은 **간접 증거**임을 이름과 사유에 적었다:
          `StreamMonitor` 에 맥박 칸이 없어 「조용한 카메라」와 「죽은 카메라」를 못 가른다
          (잠금 `CAMERA_LIVENESS_HEARTBEAT`). ④는 용량 상한이 선언되지 않으면
          **UNKNOWN** 이다 — 분모 없이 %를 만들지 않는다.

      - id: OPS-10
        title: 경보 발송처 (누구에게 · 어떤 경로로)
        status: 미착수
        why: |
          감시는 exit 1 까지 만들었다. 그 1 을 **사람에게 보내는 자리**는 고객 환경마다 다르다.
          여기서 정하면 그 환경에서만 도는 감시가 된다. 설치 시 정한다.

      - id: OPS-07
        title: 로그 수집·보존 기간
        status: 미측정
        hand: in
        hand_why: |
          보존 기간은 우리가 정하고 우리가 구현한다
        why: 컨테이너 stdout 으로 나가는 것 외에 수집처·보존 정책이 정해진 바 없다.

      - id: OPS-08
        title: 되돌리기 절차 (배포 실패 시)
        status: 미측정
        hand: in
        hand_why: |
          되돌리기 절차는 문서 + dry-run — 손 안
        why: 매뉴얼 §5 에 문장은 있으나 **되돌려 본 기록이 없다.** 해 본 적 없는 절차는 절차가 아니다.

      - id: OPS-11
        title: 장애 대응 1쪽 — 새벽 세 시에 읽는 순서
        status: 구현
        proof: docs/agent/runbook/장애대응_1쪽.md
        note: |
          감시 신호 6개마다 첫 손을 적었고, **하지 말 것**과 **사람을 부르는 선**을 함께 적었다.
          ★ 마지막 절에 「이 문서가 아직 못 적는 것」을 남겼다 — 실운영 복구·롤백·경보 발송처.

  # ═══════════════════════════════════════════════════════════════════════
  - id: "5"
    name: 성능·확장
    weight: 10
    clauses:
      - id: PERF-01
        title: 부하 시험 시나리오와 도구
        status: 미착수
        why: 0건. 도구도 시나리오도 없다.

      - id: PERF-02
        title: 동시 스트림 상한 실측
        status: 미측정
        hand: out
        hand_why: |
          동시 스트림 상한은 **GPU 서버**가 있어야 잰다
        why: |
          [실측 2026-09-09] 이 환경에는 RTSP 원본도 AI 서버도 없다(`ai.invalid`).
          그래서 **선언된 상한**(설정값)과 **실제 상한**을 나눠 적었다 —
          「선언된 상한」을 「실제 상한」으로 적는 순간 그것이 착시 ①이다.
          잴 수 있으려면: RTSP 원본 N개 · AI 추론 서버 1대 · 프레임 드롭률·자원·열화 지점 관측.

      - id: PERF-03
        title: 이벤트 처리 지연 · 알림 발송 지연 **1차 측정**
        status: 구현
        proof: docs/agent/evidence/D-354/perf.json
        note: |
          [실측 2026-09-09 · CPU 8 · mem 7.7GiB · GPU 없음 · n=30 · 워밍업 5회 버림]
            이벤트 처리(K1) p50 12.28ms · p95 13.25ms · 최대 13.62ms
            알림 발송(K2)  p50  2.89ms · p95  3.42ms · 최대  3.75ms
          ★ 이 수는 **목표가 아니라 출발점**이다(D-280). 그리고 **한 건씩** 잰 수다 —
            초당 몇 건까지 F-10 의 30초가 지켜지는지는 PERF-05 다.
          ★ 환경 없는 성능 수치는 착시 ⑤라 환경을 함께 박았다.

      - id: PERF-05
        title: 처리량 — **어디서 먼저 무너지는가**
        status: 구현
        proof: docs/agent/evidence/D-359/perf_load.json
        note: |
          ★ [실측 2026-09-10 · D-359 · 동시 1→16 계단 · 호출 310건]
                동시  1 · p95   45.30ms · 처리량  29.68/s
                동시  2 · p95   54.13ms · 처리량  78.01/s
                동시  4 · p95   42.81ms · 처리량 108.71/s   ← **처리량이 여기서 평평해진다**
                동시  8 · p95  103.41ms · 처리량  92.52/s
                동시 16 · p95  191.45ms · 처리량  96.34/s   ← 기준의 3배를 넘는다
          ★ **먼저 무너지는 자리**: 처리량은 동시 4에서 평평해지고 지연은 8부터 오른다.
            즉 **더 넣어도 더 처리되지 않고 느려지기만 한다.**
          ★ 예상 못 한 것: 부하를 올리자 `detectionevent` 에 **분당 200건 속도제한**이
            걸렸다. 이 환경에서 먼저 무너진 것은 DB 도 CPU 도 아니라 **우리 쪽
            속도제한**이다. 그 값의 근거와 운영 적정성은 **아직 모른다** — PERF-06.
          ★ 이 수를 「카메라 몇 대」로 읽지 마라. 잰 것은 이벤트 쓰기·알림의 동시성이고
            스트림 수집·디코딩·추론은 들어 있지 않다(PERF-02 가 그 자리다).

      - id: PERF-06
        title: 이벤트 속도제한 200/분 — **근거와 운영 적정성**
        status: 미착수
        why: |
          ★ [D-359 · 2026-09-10 부하시험 중 발견] 부하를 올리자
            "Rate limit exceeded for detectionevent (200/min) - skipping" 이 나왔다.
            **먼저 무너진 것이 이 제한**이다.
          모르는 것 셋: 이 값이 어디서 왔는가 · 재난 상황의 실제 이벤트율은 얼마인가 ·
          `skipping` 이 **이벤트를 버리는 것**인가 미루는 것인가.
          ★ 마지막 것이 특히 급하다 — 버리는 것이면 **재난이 몰릴 때 이벤트가
            사라진다.** 그 순간이 정확히 시스템이 필요한 순간이다.
          해소: 그 제한의 출처를 코드에서 찾고, 버리는지 미루는지를 **호출로** 확인한다.

      - id: PERF-04
        title: 응답시간 예산과 그 회귀 감시
        status: 미착수
        why: 예산 자체가 정해진 바 없다.

