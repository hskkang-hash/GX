      - id: OPS-13a
        title: 앞단이 뒷단의 **워커 재활용을 삼킨다** — 502 3건 / 3,600 (0.083%)
        status: 구현
        proof: scripts/verify_front_line_502.py
        note_closed: |
          [실측 2026-09-05 · 턴 D 차선 E] 세종이 등재한 이 절의 내용은 「**하지 말아야 할 것 넷**」이고,
            넷을 실측으로 채웠다(턴 C 가 겪은 하나 + 이번 턴 넷 = 여섯).
            ★★ **502 를 0 으로 만드는 방법은 있다. 그리고 그것을 쓰면 안 된다** — 워커 재활용을 끄면
              502 도 재시도도 정확히 0 이 된다. 그 0 은 결함을 고친 0 이 아니라 **숨긴 0** 이고,
              그 실험이 오히려 **모든 502 가 재활용에서 왔다**는 것을 상관이 아니라 **인과로** 증명했다.
            ★ 언제 나는가 — **대조와 함께**: 같은 초 502 10/10 = **100%** · 정상 200 대조 72/400 = **18%**.
              ±5초로 넓히면 정상 응답의 **72%** 도 재활용 옆에 놓인다 — **대조가 없으면 이 표를 못 읽는다.**
            ★★ **같은 설정이 8건과 1건을 냈다**(run0/run2). 502 건수는 기계 상태가 좌우한다 —
              한 벌만 재고 설정을 바꾸는 것이 「하지 말아야 할 것」의 첫째다.
            ★ 앞단 설정에 적혀 있던 이유가 **틀렸다**: 「peer 하나면 재시도가 안 일어난다」 → 실측 28건.
              그리고 peer 를 둘로 적으면 `tries 3` 의 실효 시도가 **2** 다.
            ⚠ **502 는 0 이 아니다**(3,722 요청 중 8 · 1 · 1). 「감당할 수 있는 수인가」는
              이 차선이 정할 것이 아니다 — **세종·대표 판정 요청.**
        hand: in
        hand_why: |
          고칠 코드가 둘 다 우리 것이다(`backend/gunicorn.conf.py` · `nginx/`).
          상대방·기관·기계를 기다리는 자리가 아니다
        why: |
          ★ [실측 2026-09-05 · 턴 C 차선 E] 3,600 요청 중 **502 3건.** 작아 보이지만
            **재난 경보에서 1,000건에 1건이 조용히 사라진다**는 뜻이고, 조용히 사라지는 것이
            이 제품의 최악이다(SEC-16 규약이 적은 그대로).

          ★★ **언제 나는지 갈랐다 — 그리고 그것을 가른 것은 음성 대조다.**
            502 20건 전수 × gunicorn `Autorestarting worker` 86건을 시각으로 맞대고,
            **정상 200 응답 174건을 대조로 함께** 쟀다:

            | 창 | 502 | 정상 200 (대조) |
            |---|---|---|
            | **±0초** | **18/20 = 90%** | **37/174 = 21%** |
            | ±1초 | 100% | 53% |
            | ±5초 | 100% | 91% |

            ⚠ **대조가 없었으면 이 표를 못 읽는다.** 2,709초에 재활용이 86번이라 창을
              넓히면 무엇이든 옆에 놓인다 — ±5초에서는 **정상 응답도 91%** 가 재활용 옆이다.
              「502 가 전부 재활용 근처에서 났다」만 보면 원인을 찾은 줄 안다.
              **가르는 것은 같은 초뿐이고, 거기서 90% 대 21% 로 갈렸다.**

          ★ **하지 말아야 할 것 넷 — 전부 재서 나온 것이라 이것도 이 절의 내용이다:**
            ① `keepalive_requests` 로 앞단이 먼저 끊기 ② 지터 넓히기
            ③ `max_requests` 를 키우거나 끄기 ④ `non_idempotent` 재시도
            [실측] ①②를 걸었더니 **502 3 → 5건**, p95 F05 174 → 295ms, 잡음 21~37 → 46~67%
            로 **함께 나빠졌다.** 까닭: **낡은 연결을 피하려다 새 연결을 더 많이 만들었다** —
            연결을 휘저을수록 죽어 가는 워커와 마주칠 기회가 는다. 되돌렸고, **되돌린 이유를
            설정 파일에 남겼다** — 사유가 없으면 다음 사람이 같은 생각으로 같은 값을 다시 건다.
            ③은 502 를 없애는 게 아니라 **더 드물게** 만든다. 드물어진 결함은 재현이 안 되고,
            재현 안 되는 결함은 **운영에서 처음 보인다.**

          다음 걸음: 재활용 시 유휴 keepalive 연결의 **우아한 배수(drain)** —
          gunicorn 이 나가기 전에 앞단에 「이 연결 그만 써라」를 말할 길이 있는가.
          설정으로는 여기까지였다.
          닫는 조건: **같은 부하(3,600 요청)에서 502 0건.**
          증거: docs/agent/evidence/OPS-13/proxy_502_opinion_20260905_TC.md

