      - id: SEC-03
        title: 익명 반출 0건 — **우리가 고칠 수 있는 자리**
        status: 구현
        proof: backend/tests/test_authn_gap_closed.py
        note: |
          [실측 2026-09-08] 11자리에서 나가고 있었다. 그중 우리 소관 9자리가 속한 컨트롤러의
