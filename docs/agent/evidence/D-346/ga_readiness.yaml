          핀은 박았으나 **그 핀이 실제로 그 커밋을 가져오는지는 확인하지 못했다.**
          「검사하지 못했다」와 「0건이었다」는 다르다(D-301). 해소는 사내망에서 `npm ci` 1회.

      # ★ D-388 — **코드를 줄이는 것도 진척이다.** 읽을 것이 줄고 시험할 것이 준다
