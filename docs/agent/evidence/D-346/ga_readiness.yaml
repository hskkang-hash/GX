      - id: UX-24
        title: 역할별 동시 세션 상한 — 관제실은 월·데스크·휴대전화를 **함께** 켠다
        status: 잠김
        blocker: DJCORE_SINGLE_SESSION_TOKEN_FIELD
        hand: out
        hand_why: |
          [실측 2026-09-05 · 턴 E] **정책층은 섰다**(상한 표 · 월 12h · 축출 순수함수 · 밀려난 화면의
          안내 문구 · 시험 26 passed). 그런데 **동시 접속 1개는 설정이 아니라 자료구조**였다 —
          `user.token` 이 한 칸이고 §0.4 라 못 고친다(`DJCORE_SINGLE_SESSION_TOKEN_FIELD`).
          **「동시 3대가 실제로 산다」는 판정 불가**다. 지어내지 않고 「지금은 1개다」를
          characterization 시험으로 **고정**했다 — 벽이 걷히는 날 그 시험이 빨개진다.
        why: |
          ★ [실측 2026-09-05 · 턴 E · P-47] 지금 이 제품은 **동시 접속이 1개**다
          (`end_previous_session` — 로그인하면 앞 세션을 끊는다). 그런데 관제실의 실제 모습은
          월 모드 대형 화면 · 자리 데스크톱 · 이동 중 휴대전화를 **동시에** 켜는 것이다.
