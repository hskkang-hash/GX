      - id: UX-17
        title: 훈련 모드 (`drill_mode` · 실채널 발송 0 · 종료 보고서 1장)
        status: 구현
        proof: backend/tests/test_c_drill_mode.py
        origin: PRD-2.5
        note: |
          [실측 2026-09-24 · 차선 C 16 passed + 조율자 배선] 스위치·창·`data_source` 판정·
          종료 보고서는 차선 C 가, **K2 채널 어댑터 한 자리는 조율자가** 이었다
          (발송 경로는 하나이고 그 파일은 차선의 것이 아니다).
          ★ 차선 C 는 어댑터 앞에서 **멈추고 부작위 시험을 남겼다** —
            「K2 가 아직 훈련 스위치를 보지 않는다」. 배선이 들어오자 그 시험이 빨개졌고,
            **그 빨강이 「배선이 왔다」는 선언**이었다. 갈아 끼운 것이
            `DrillIsWiredToChannelsTest`(훈련 중 채널이 `log` 로 간다 + 양성 대조).
          ★ **이름을 가장하지 않는다**: 행의 `channel` 에 `log` 가 그대로 적힌다.
            원래 채널로 적어 두고 몰래 로그로 보내면 그 행은 **보냈다는 거짓말**이 된다.
          ★ 안전한 기본값은 **실발송**이다 — 테넌트를 못 읽으면 훈련이 아니다.
            스위치를 못 읽는 상태에서 조용해지는 것이 이 절이 막으려는 사고 그 자체다.
          ★ `data_source=drill` 은 **칸이 아니라 창 판정**이다(D-347 화면 메타) —
            새 칸을 만들면 과거가 비고, 빈 과거는 「훈련이 아니었다」로 읽힌다.
        why: |
          [인용] 지자체는 연 2회 이상 재난 대응 훈련을 한다(안전한국훈련·을지).
          훈련 때 실제 알림이 소방·팀장에게 나가면 **그날로 알림을 끈다**(U2#18).
          테넌트 스위치 하나로 채널이 로그 어댑터로 바뀌고 이벤트는 `data_source=drill` 이다.
          ★ K2 채널 어댑터는 **조율자만 만진다**(지시서 §2 차선 규칙).

      - id: UX-18
        title: 벌크 등록 — **CSV**(주소 열 포함)
        status: 구현
        origin: PRD-2.5
        proof: backend/tests/test_c_bulk_register.py
        note_closed: |
          ★ **닫혔다 [실측 2026-09-05 · 턴 C 차선 C] — 그리고 바뀐 것은 하나뿐이다.**
          CSV 서버 면·시험·부재 판정은 09-24 에 이미 서 있었다(아래 note 그대로).
          이번 턴에 바뀐 것은 **그 화면의 쓰기가 실제로 되게 된 것**이다: **422 → 200** [실측].
          라우트 인자 `csv_text` 가 원시 타입이라 django-ninja 는 **질의**로 받는데
          화면이 **본문**으로 보내고 있었다.
          ★★ **「구현했다」와 「쓸 수 있다」가 갈려 있었고, 아무도 그것을 못 봤다** —
            캡처가 제목 글자만 단언해서 화면은 멀쩡히 떠 있었기 때문이다.
            착시 ⑨(**함수는 문이 아니다**)의 화면판: **문이 있어도 열쇠 구멍이 다르면 안 열린다.**
            이 절이 09-24 에 「닫혔다」로 적히지 않고 미착수로 남아 있던 것이 결과적으로 옳았다.
        note: |
          ★ [실측 2026-09-24 · 차선 C] **셋 중 하나가 섰고, 나머지 둘은 이 저장소에서
            열리지 않는다** — 그 판정이 이 절의 값이다.
            · CSV 벌크 등록: **닫혔다.** dry-run 표 먼저 → 집행 · 「주소 없는 카메라 N대」
              배지(분모와 함께) · 남의 테넌트에 심으면 `PermissionDenied` + 행 0
              (격리 probe `BULK.apply_camera_import`). 화면
              `SCREENS-1/NO_ROLE/dsm_cameras_import_dryrun.png`.
            · **ONVIF: 이 저장소에 없다** — `grep -ril onvif backend/` = **0건**.
              라이브러리도 어댑터 자리도 없다. 없는 것 위에 화면을 얹지 않았다(P-15).
              `Row.source` 칸을 비워 두었으니 어댑터가 오면 값 하나만 는다.
            · **좌표→도로명 역지오코딩: 이미 「불가」 판정이다**(D-329 ·
              `JUSO_REVERSE_SUPPORTED='no'` — 승인키 2건이 둘 다 팝업 API).
              게다가 `StreamMonitor` 에 **위·경도 칸이 아예 없다** — 역지오코딩할 좌표가
              없다. 주소는 D-330 이 정한 길(CSV `address` 칸)로 들어온다.
            부재를 못박는 시험: `test_c_bulk_register.AbsentPathsAreNamedTest` —
            생기는 날 그 시험이 빨개진다.
        why: |
          [실측] 주소 미입력 **39/40** 이다. 파일럿 39대는 손으로 하지만 안양 8,300대 [인용]는 못 한다.
          CSV 일괄 등록 + 「주소 없는 카메라 N대」 배지.
          ★ 쓰기 면이므로 **dry-run 이 먼저다**(D-209) — 100행 표를 보여 주고 나서 쓴다.
          ★ [P-31 판정 2026-09-26] **쪼개지 않는다. CSV 로 확정한다.** 제목이 ONVIF 와
            역지오코딩을 말하는 동안 이 절은 영원히 닫히지 않는다 — 둘 다 이 저장소에
            **없거나 불가**로 이미 판정됐다(ONVIF 0건 · 역지오코딩 불가). 없는 프로토콜
            위에 절을 세우지 않는다. ONVIF 는 절이 아니라 **T-OUT 후보 한 줄**이다
            (조건: ONVIF 어댑터 도입 결정). 분모 +0.

      - id: UX-19
        title: 외부 웹훅 — CAP 1.2 로 낸다 (우리 스키마로 내보내지 않는다)
        status: 구현
        origin: PRD-2.5
        proof: backend/common/webhook_outbox.py
        why: |
          [실측 2026-09-24 등재] 나가는 이벤트 스키마가 **우리 것**이다. 상급기관·SDN·에스비 App 이
          각자 파싱하면 우리가 바뀔 때마다 셋이 깨진다. 표준(OASIS CAP 1.2)으로 낸다.
          서명·재시도는 SEC-16 이다 — **문과 규약을 다른 절로 둔다.**
        note_closed: |
          ★ **닫혔다 [실측 2026-09-05 · 턴 C 차선 S]** — 그리고 **규약을 고치지 않고 불러서
          맞췄다.** `webhook_contract.py`(SEC-16)는 한 줄도 안 건드렸다. 새로 낸 것:
          `common/cap_1_2.py`(OASIS CAP 1.2 번역·닫힌 어휘) · `common/webhook_outbox.py`(문) ·
          `WebhookSubscription`(마이그 0028 · 역방향 확인) · 라우트 셋.
          완주가 시험으로 보인다: `test_s_webhook_outbox.py` **43 passed** —
          구독 → 발송(본문이 우리 스키마가 아니라 CAP 1.2) → 서명 검증(규약 `verify()` 가
          우리 헤더를 통과 · **한 글자 바꾸면 거절**) → 재시도(**정확히 5회** · 포기가 행으로).
          ★★ **그리고 이것이 P-42 의 첫 이행이다** — 「규약은 부르는 곳과 같은 턴에 태어난다」.
            문을 내기 전 `dormant` 가 규약 함수 셋을 **부르는 곳 0** 으로 빨갛게 잡고 있었고,
            문을 내니 **0건이 되었다**(조율자 재측 동일). **빨강이 스스로 꺼진 것이 아니라
            원인이 없어져서 꺼졌다** — 기준선에 이름을 넣어 껐다면 이 초록은 없었다.
          함정 지켰다: 라우트는 **F-05 구독 등록 위**(`JwtOrInboundKey()`) · 새 인증 경로 0 ·
          무계정 링크 0 · `INBOUND_KEY_ALLOWED` 한 줄도 안 넓힘 · 서명키 **값**은 저장소·표
          어디에도 없다(이름만). 시험이 넷 다 잰다.

      # ── PRD v2.6 신규 (2026-09-26 · P-28 등재) ──────────────────────────
      # 넷 다 **「짓는 일」이 아니라 「고치는 일」**이다 — 이미 선 화면의 말을 바꾼다.
      - id: UX-20
        title: 제품 언어 — 화면이 우리 대장의 말로 말하지 않는다
        status: 구현
        gate: scripts/verify_ui_copy.py
        origin: PRD-2.6
        proof: scripts/verify_ui_copy.py
        why: |
          [실측 2026-09-25 · 24장 중 11장] D-번호 · 절 ID · 백틱 경로 · 마크다운 원문(`**`) ·
          영문 열거값 · 개발 주석이 사용자 본문에 있다(결함 31 중 뿌리 ①).
          ★ **Code 의 잘못이 아니다** — 「사유를 화면에 적어라」「출처를 표기하라」가
            시킨 결과다. 정정: 사유·출처·판정 근거는 **관리자 패널과 「?」 뒤**에 산다.
          닫는 조건: 사용자 언어 사전 1벌(`docs/design/GX-COPY_v1.md`) ·
          `scripts/verify_ui_copy.py` 잔여 0 · 개발 노트는 관리자 자리로 이동.
        note_closed: |
          ★ **닫혔다 [실측 2026-09-27 · 턴 B 차선 C]** — `verify_ui_copy` **잔여 18 → 0건**
          (갚은 것 18 · 새로 생긴 대장 언어 0 · exit 0 · 조율자 재측 동일).
          7개 파일 18자리: 절 ID(`UX-17`·`UX-18`·`P-16`·`P-25`·`F-10`) · 백틱 10곳 ·
          마크다운 `**` 2곳 · 영문 열거값(`response_state=occurred`) · 내부 경로.
          ★ **사유를 지우지 않고 옮겼다** — 「표시 7건(요청 상한 50건)」은 「7건 + ?」로,
            `Network Error` 원문은 「사진을 불러오지 못했습니다 · 다시 시도」로.
            지웠으면 UX-20 을 닫으면서 「사유를 적어라」를 깬 것이 됐을 것이다.
          ★★ **함께 고친 것 — `scripts/capture_screens.py` 의 `must_see` 8건.**
            그 상수는 화면 문자열의 **사본**이다. 화면만 고쳤으면 턴 D 재촬영이 전부
            빨개졌을 것이고, **그 빨강은 화면 결함이 아니라 사본이 뒤처진 것** —
            가장 헷갈리는 종류다. 화면과 같은 커밋에 둔다.
          ⚠ **기준선을 `--freeze` 하지 말 것.** 잔여 0 상태에서 freeze 하면
            `load_baseline()` 이 빈 집합이 되고 게이트가 **exit 2(판정 불가)** 를 낸다.

      - id: UX-21
        title: 역할별 메뉴·첫 화면 — 관제 역할에 드론·항공·영문 CRUD 0개
        status: 구현
        origin: PRD-2.6
