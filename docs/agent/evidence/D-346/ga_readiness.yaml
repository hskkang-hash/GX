            정본이고, 같은 사실을 두 곳에 적으면 반드시 갈린다(D-227).
        why: |
          준비만 있었다 — 대조표가 없었다.
          ★ [실측 2026-09-05 · 턴 F 차선 E] **자리는 섰다**:
            `docs/agent/evidence/LAW-04/gs인증_항목_대조표.md`. 본문(등급·시험기관·신청시기)은
            세종 몫이라 비워 두었고, **우리가 잰 수만** 넣었다 — 기능적합성 786 passed(9-26 인용 ·
            이번 턴 재측정 안 함, 그 사실을 표에 적었다).
            ⛔ **셋은 잴 도구가 아예 없다**: 호환성 · 사용성 지표 · 이식성.
          아직 「미착수」인 이유: 대조표에 **채워진 칸보다 빈 칸이 많고**, 빈 칸을 채우는 것이
          우리 판정이 아니다(시험기관·등급·신청시기 미정). **자리가 섰다고 절이 되지 않는다.**

      - id: LAW-05
        title: SLA (가용성·응답·복구 목표)
        status: 미측정
        hand: in
        gate_missing_why: |
          SLA 는 **수 셋의 합**이라 게이트 하나로 판정되지 않는다. RTO 만
          `ops_restore_drill.py` 가 받치고, RPO·가용성은 각각 OPS-19 와 스테이징을
          기다린다. 게이트 하나를 근거로 달면 셋 중 하나의 초록이 셋 전부의 초록처럼
          읽힌다 — 이 저장소가 「한 갈래만 재면 어느 쪽이든 그럴듯하다」로 부르는 자리다.
        note_turn_i: |
          [실측 2026-09-06 · 턴 I · 차선 E · P-86] **상태는 미측정 그대로다 — 바뀐 것은
          「왜 미측정인가」가 문서 밖이 아니라 문서 안에 있다는 것이다.**
          `docs/design/GX-LAW-05_SLA_초안_v0.2.md` §0-A 「받칠 수 셋」 표:
            RTO   0.13분   **실측**   — 근거 `ops_restore_drill.py` (표 223/223)
            RPO   부분실측  대기      — 회수점 나이 0.4분은 쟀고 **간격(상한)은 못 쟀다.**
                                       대기 조건: `gx-celery-e` 에 `/backup` 마운트(사람)
            가용성 미측정   대기      — 대기 조건: 운영형 인스턴스 30일. 지금 있는 수
                                       (gx-gunicorn-e 연속 31.0시간·재기동 0)는 **안에서 잰
                                       수**라 가용성이 아니다 — 참고로만 적었다.
          ★ 회색은 회색이되 **방치가 아니다**: 미측정의 사유와 그 사유를 푸는 조건이
            약속 문서 자체에 적혀 있다. 고객에게 못 지킬 수를 적는 것보다 낫다.
        hand_why: |
          약속을 쓰는 것도, 그 약속을 받칠 수를 재는 것도 **손 안**이다.
          다만 두 칸(가용성 · RPO)은 **공개 URL 과 도는 백업**을 기다린다 —
          공개 URL 은 대표 승인이고 백업은 차선 E 다. 상대방·기관을 기다리는 자리는 아니다.
        why: |
          ⑤ 성능이 0건이라 약속할 수 있는 수가 없었다. **재지 않은 것을 약속하지 않는다.**
          ★ [실측 2026-09-05 · 턴 F 차선 E] **다섯 칸 중 둘을 실측으로 채웠다** —
            `docs/agent/evidence/LAW-05/sla_실측표.md`:
            5xx **0.0776%**(46,425건 중 502가 36건 · 09-02~09-05 · 앞단 접근로그) ·
            HTTP p50 **30.7ms** / p95 **45.7ms**(`/api/v1/health` n=20 동시 1) ·
            이벤트 처리 p95 **38.59ms** · 알림 발송 p95 **11.18ms** ·
            롤백 훈련 **381초 통과** · DB 복구 **성공**(4,447,529 bytes).
          ★★ **한 칸은 「지금 못 지킨다」로 적었다 — RPO 24h.** 자동 백업이 한 번도 안 돈다
            (OPS-19 신설). 손으로 뜬 덤프는 RPO 가 아니다.
          「못 쟀다」로 남긴 칸: 가용성 99.9(**밖에서 두드리는 자리가 없다** — G1 이 열려야 잰다) ·
            전체 RTO(알아채기·판단 시간 미측정) · 객체(영상) 복구.
          아직 「미착수」인 이유: SLA 는 **약속**이고, 약속하려면 다섯 칸이 다 차야 한다.
            둘을 쟀다고 약속이 서지 않는다. ⚠ 응답 예산은 **엔드포인트 하나 · 동시 1 · DB 95MB**
            에서 잰 수이고 5xx 0.0776%는 **개발 트래픽**이다(502 36건은 백엔드 재기동 순간의 것).
          ★★ [2026-09-06 · 턴 G · 세종] **상태를 「미착수」에서 「미측정」으로 고친다 — 수는 안 움직인다.**
            문서는 섰다(`docs/design/GX-LAW-05_SLA_초안_v0.2.md`). 남은 것은 **측정**이지 착수가 아니다.
            v0.2 가 한 일은 **약속을 늘린 것이 아니라 줄인 것**이다: v0.1 의 약속 **8개 중 6개를
            「약속하지 않는 것」으로 내렸다.**
              내린 것: 가용성 99.9(잴 자리 없음) · RPO 24h(자동 백업 0회) · 전체 RTO 30분(못 쟀다) ·
                       경보 5분 도달(사람 도달 0건) · 응답 예산(엔드포인트 1·동시 1) · 접수 확인 90초(추정)
              남긴 것: 5xx ≤ 0.1%(**계획 배포 창 제외**를 문장에 넣었다) · 탐지→발송 30초
                       (**기점은 「이벤트가 기록된 시각」**이지 현장에서 불이 난 시각이 아니다 —
                        카메라→탐지 구간은 실카메라가 없어 못 쟀다)
            ★ **지킬 수 없는 SLA 를 파는 것이 가장 큰 상용 위험이다.** 못 지키는 약속은 계약이 되는
              순간 우리가 물어내는 돈이 되고, 그 전에 신뢰를 잃는다.
            ★ 세종이 답한 판정 셋: 밖에서 두드리는 자리는 **우리가 세운다**(파는 쪽이 재는 쪽이어야
              한다) · RTO 는 **기능 복구와 영상 복구를 나눠 적는다**(합치면 「영상이 있었다고 말하는
              DB」를 복구라 부르게 된다) · 응답 예산은 **네 층으로 걸되 계약 문장이 아니라 내부 목표**다.
            [실측 2026-09-06 16:0x · 차선 E 결과 반영] **백업 파일이 처음 생겼다** —
              볼륨 `gx_backup_vault_e` 에 9,209,410바이트 · sha256 기록 · 다른 컨테이너에서
              `pg_restore --list` 목차 3,351줄로 읽혔다 · 저장소 밖. P-67 선언도 섰다.
              **그런데도 RPO 를 약속하지 않았다** — 이유 넷을 SLA v0.2 §3-A 에 적었다:
                ㉠ beat 가 스스로 돌린 것이 아니라 **스크립트가 뜬 것**이다
                ㉡ **하루치 하나**다(24시간을 약속하려면 연속을 봐야 한다)
                ㉢ **목차가 읽힌 것**이지 **빈 DB 를 세워 본 것**이 아니다
                ㉣ **볼륨 갈래이지 호스트 갈래가 아니다** — 기계가 타면 백업도 같이 탄다
              RTO 도 여전히 못 쟀다(복구 시간이 그 증거에 없다). 경보 도달은 mailpit 으로
              **발송→도착**이 기계로 확인됐으나 **사람이 아니고 TLS 도 안 탔다**(OPS-10 회색 유지).
              「한 번도 없던 것」이 「하나 있다」가 된 날이고, **「하나 있다」와 「약속한다」 사이에
              위 넷이 있다.** 그 넷을 건너뛰는 것이 상용 사고의 모양이다.
            아직 「구현」이 아닌 이유: **가용성을 약속하지 않는 SLA 는 완성이 아니다.** 그 칸은
              공개 URL(대표 승인)과 외형 감시가 서야 처음 수를 갖는다.
