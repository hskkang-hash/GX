      - id: SEC-15
        title: 거절이 **HTTP 상태로** 나간다 — 계약 상대가 읽는 면(F-05)
        status: 구현
        proof: backend/tests/test_api_contract.py
        note: |
          [실측 2026-09-09] 663건 중 봉투 불일치 296건 · F-05 진입면 11건은 **승격**된다.
          전역 승격은 무증상 실패 후보 21곳을 건드려 아직 래칫이고(W0-18 §2-2),
          계약 면만 경로로 좁혀 먼저 걸었다(D-349 ③).

      - id: SEC-04
        title: 우리 층에 **인증 관문 없는 라우트** 0건
        status: 미착수
        why: |
          [실측 2026-09-09] 79 → 55건(라우트 선언으로 24 차단). 그중 24건은 authz 가 익명을
          떨어뜨리고, 31건은 관문이 아예 없으나 호출에서 데이터가 나오지 않았다.
          **「데이터가 안 나왔다」는 「안전하다」가 아니다** — 핸들러는 돌았다.
          닫을 범위는 판정 대상이다. 그동안 래칫으로 잠갔다(route_baseline.txt).

      - id: SEC-05
        title: 시크릿이 커밋되는 것을 막는다
        status: 구현
        proof: .gitleaks.toml

      - id: SEC-06
        title: 나가는 키(자격증명)를 코드가 아니라 저장처에 둔다
        status: 구현
        proof: backend/tests/test_k5_credential_store.py

      - id: SEC-07
        title: 키 회전 절차 (발급·폐기·주기)
        status: 미착수
        why: FR-05-3 의 「발급·폐기」 절이 미착수다. 회전 주기는 그 뒤의 일이다.

      - id: SEC-08
        title: 침투 시험 (외부 또는 자체)
        status: 미착수
        why: 0건. 상용 오픈 전 1회는 필요하다 — 지금 있는 것은 우리가 스스로 때린 호출뿐이다.

      - id: SEC-09
        title: 운영 포트 노출 점검
        status: 미측정
        hand: out
        hand_why: |
          운영 서버 포트는 **운영 접근**이 있어야 잰다 — 대표 작업 창(D-209 운영 로그인 금지)
        why: |
          운영 서버를 직접 건드리지 않는다(불변 제약). 개발 환경의 포트 노출은 운영과 다르다 —
          **개발에서 잰 수를 운영의 수로 적으면 그것이 착시 ⑤(환경)다.**

      - id: SEC-10
        title: 들어오는 키를 평문으로 흘리지 않는다 (HTTPS 강제)
        status: 구현
        proof: backend/tests/test_f05_inbound_api_key.py

      - id: SEC-11
        title: 권한 거부가 **거부의 상태 코드**로 나간다 — 전 라우트
        status: 잠김
        hand: in
        hand_why: |
          §4 판정으로 길이 생겼다 — 접두를 한 개씩 승격하고 §0.4 화면은 **프론트 인터셉터**로 밖에서 잇는다(D-335/D-348). 우리가 닫는다
        blocker: DJCORE_200_ENVELOPE_403
        why: |
          dj-core 가 HTTP 200 봉투에 403 을 담아 보낸다. §0.4 라 우리가 못 고친다.
          [실측 2026-09-09] 663건 중 **296건**이 그 모양이다(전수 · D-349).
          계약 면(F-05) 11건은 SEC-15 가 갚았고, 나머지는 전역 승격의 범위 판정을 기다린다.

      - id: SEC-12
        title: 주석 처리된 권한 뒤의 **열린 문** 0건
        status: 구현
        proof: backend/tests/test_commented_guards.py

      - id: SEC-13
        title: 캐시가 관문 판정을 대신하지 않는다
        status: 구현
        proof: scripts/verify_cache_bypass.py

