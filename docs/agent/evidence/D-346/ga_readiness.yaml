    #   구현/전체를 계산한다. 옮겨 적으면 두 표가 갈리고, 갈리는 순간 하나는 거짓말이다.
    derived_from: docs/agent/evidence/D-309/contract_ac_ledger.yaml
    # ★★ [P-106 · 2026-09-07 · 턴 M] **이 영역에 게이트가 생겼다.**
    #
    #   턴 L 까지 이 영역은 가중치 20%를 들고 있으면서 `gate:` 가 **0개**였다.
    #   그래서 P-85 의 여덟째 눈(대장 상태 = 게이트 색)이 ①을 통째로 건너뛰었고,
    #   82.2 라는 수의 20%가 **아무에게도 안 물어본 수**였다 — 절의 `state` 를
    #   절 자신이 적고, 그 적은 것을 그대로 세고 있었다.
    #
    #   이제 세는 쪽이 바뀐다. `verify_feature_reach.py` 가 절마다 사슬 다섯을 잇는다:
    #       절 ↔ 화면 ↔ 라우트 ↔ **역할 계정의 200** ↔ data_source
    #   이어지면 구현, 끊기면 빨강, **못 이으면 미측정(회색)** 이다.
    #   ⚠ 그래서 이 영역의 수는 **내려간다.** 세종 판정(턴 M): 「내려가도 좋다.
    #     나오는 대로 보고하라.」 못 잰 것을 구현으로 세는 것이 더 나쁘다 (D-301).
    gate: scripts/verify_feature_reach.py
    note: |
      계약 기능 39절(F-01~F-14를 절로 쪼갠 것). 상용 전용 기능은 아래 ⑦(사용성)에 있다.
      상태는 `gate:` 가 센다 — 절이 스스로 적은 `state` 가 아니라 **도달**이 기준이다(P-106).

