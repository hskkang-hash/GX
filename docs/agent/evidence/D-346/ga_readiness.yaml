          ★★ ⚠ **[실측 2026-09-06 · 차선 V] 그 「7건」은 술어가 얇아서 나온 수다.**
            7건은 **화면 캡처 28장**(`D-386/screen_routes.json` · 호출 44자리)과의 교집합이다.
            캡처는 **열어 본 화면만** 센다. 같은 질문을 **프런트 원본 전수**
