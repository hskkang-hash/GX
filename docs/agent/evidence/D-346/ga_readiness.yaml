          관문 없는 라우트 24자리를 닫고 재호출로 0건을 확인했다.
          docs/agent/evidence/D-343/INCIDENT.md

      - id: SEC-14
        title: 익명 반출 0건 — **§0.4 금지구역**
        status: 구현
        proof: backend/tests/test_access_gate.py
        note: |
          [실측 2026-09-09 · 호출·캐시우회] 401 · 401. 그날 17,416B 가 나가던 자리다.
          ★ 판정 D-348 이 길을 열었다: **D-207 이 금지한 것은 파일 수정이지 길목 차단이 아니다.**
          `backend/delivery/` 도 dj-core 도 한 줄 안 바뀌었다 — 미들웨어 한 겹을 우리 층에 올렸다.
