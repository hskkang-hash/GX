            미들웨어·직렬화·인증·커넥션 풀은 함수 안에 없다. 12.28ms 를 「응답이 12ms」로
            읽었으면 그것이 착시 ①(부분을 전체로)이다. 이 도구가 태어난 이유가 그것이다.
          ★ ⚠ **이 수는 `runserver` 의 수다**(개발 서버). 운영은 gunicorn 이고 워커 수도
            다르다 — 개발에서 잰 수를 운영의 수로 적으면 착시 ⑤(환경)다. 그래서 예산
            판정은 하지 않았다: **첫 수는 기준선이지 합격선이 아니다.** 예산은 PERF-04 가 정한다.
          ★ 읽기만 때린다. 쓰기 면을 부하로 때리면 그 데이터가 진짜와 섞이고, 섞이면
