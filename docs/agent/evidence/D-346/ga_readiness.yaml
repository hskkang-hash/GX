            `clean` 이던 라우트였다. 「대부분 갚았다」고 적었으면 거짓말이 될 자리다(§4-3).
            ⚠ 그 사실이 **두 턴 동안 안 보였던** 이유: 인벤토리 json 이 낡아 있었다.
