          그러므로 **RPO 24h 를 지금 약속할 수 없다** — 손으로 뜬 덤프는 RPO 가 아니다.
          「할 수 있다」와 「하고 있다」는 다르다. 앞엣것만 세면 복구 목표가 종이가 된다.
