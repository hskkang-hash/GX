  status_enum: [구현, 미착수, 잠김, 미측정]
  banned_status: [부분, 진행중, 일부, 대부분, 거의]
  note: |
    이 표는 네 번 쓴다 (D-346 ★): ① 상용 로드맵 ② 투자·영업 자료
    ③ GS인증 준비 체크리스트 ④ 계약 작업이 상용을 얼마나 밀어주는지의 지도.

