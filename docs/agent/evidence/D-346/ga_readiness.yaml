# 상용 서비스 오픈 기준 — 8영역 · **절 단위** (D-346)
#
# 왜 이 표가 따로 있나
# --------------------
#   계약 39절을 100% 채워도 **상용 출시는 되지 않는다.** 계약에 없는 것이 상용에는 필수다.
#   그래서 축을 둘로 나눠 잰다 (D-345): 계약 진척과 기반 진척을 하나의 %로 합치지 않는다.
#
# 규칙 (D-314 · D-346)
# --------------------
#   · 상태는 넷뿐이다: 구현 · 미착수 · 잠김 · 미측정.  **「부분」 금지** —
#     「부분」은 상태가 아니라 **아직 안 쪼갠 것의 이름**이다. 쪼개면 잔여가 숫자가 된다
#   · ★ **증명이 없는 칸은 '구현'으로 적을 수 없다.** 그런 칸은 '미측정'이다
#     → '구현' 에는 `proof` 가 있어야 하고, 그 **파일이 실재**해야 한다 (없는 시험은 문서다)
#   · '잠김' 에는 `blocker` 가 있어야 하고 `DA-05/blockers.yaml` 에 그 id 가 있어야 한다
#   · '미착수' 와 '미측정' 에는 `why` 가 있어야 한다 — 사유 없는 빈칸은 잊은 것과 구별되지 않는다
#   · ★★ [P-85 · 2026-09-06 턴 I] `gate:` 칸 — **그 절을 지키는 판정기의 이름**을 적는다.
#     게이트는 판정기를 **부르고**, 대장 상태와 색이 갈리면 exit 1 이다:
#         게이트 초록 · 대장 미구현  → 다 해 놓고 안 적었다 (수가 실제보다 낮게 나간다)
#         대장 구현 · 게이트 빨강    → 적어 놓고 무너졌다 (**이쪽이 더 나쁘다**)
#     회색(exit 2)은 갈림이 아니라 **못 잰 것**이다 — 따로 세고, 하나라도 있으면 exit 2.
#     ⚠ **아무 게이트나 적으면 안 된다.** 여기 적을 수 있는 것은
#       **그 게이트의 초록이 곧 이 절의 닫힘인** 판정기뿐이다. 래칫형 게이트
#       (「새로 생긴 것 0건」)의 초록은 「늘지 않았다」이지 「닫혔다」가 아니다 —
#       그런 게이트를 미구현 절에 붙이면 **없는 갈림**이 매번 빨강으로 선다.
#       예: SEC-11a 는 `verify_envelope.py`(래칫)가 초록이어도 잠김이 옳다. 그래서 안 붙인다.
#
# 가중치는 [판정]이다 — 세종이 정했다. 각 절의 상태는 [실측]이다 — 여기서 갈아 끼운다.
#
# 강제: scripts/verify_ga_readiness.py — 위 규칙 전부 + 가중 합계 출력. 어긋나면 exit 1.

