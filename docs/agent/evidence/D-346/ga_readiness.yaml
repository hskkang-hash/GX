      - id: OPS-08
        title: 되돌리기 절차 (배포 실패 시)
        status: 구현
        proof: scripts/ops_rollback_drill.py
        note: |
          [실측 2026-09-24 · 차선 E3 · 381초] **해 본 기록이 생겼다.** 빈 DB 를 매뉴얼 §2-3
          대로 세우고(표 220개 · head 0027), `migrate stream_monitors 0019` 로 되돌리자
