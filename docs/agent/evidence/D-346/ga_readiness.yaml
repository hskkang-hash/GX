               [추정] 렌더 실패의 **원인이 공백인지는 확인하지 않았다** — 재촬영(턴 D)이 가른다.
            ② 첫 화면 역할 경고를 사전 문장(「화면 구성이 아직 정해지지 않았습니다」)으로.
            ③ 개발 계수기 「패널 상태 data 0/0 loading 0/0」을 「화면 점검」 + 「?」 뒤로.
          ★ 그리고 **역할 기본 프리셋은 이미 시드돼 있었다** [실측 · 차선 E] —
