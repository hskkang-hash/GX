  # ═══════════════════════════════════════════════════════════════════════
  - id: "2"
    name: 보안
    weight: 20
    clauses:
      - id: SEC-01
        title: 들어오는 키의 수용 면을 **라우트마다 선언**하게 한다 (기본값 거절)
        status: 구현
        proof: backend/tests/test_f05_inbound_api_key.py

      - id: SEC-02
        title: 그 기본값 거절을 **전역**으로 올린다 (전 라우트)
        status: 미착수
        why: |
          [실측 2026-09-08] 663 라우트 중 515자리가 지금도 들어오는 키를 받는다.
          D-343 이 순서를 못박았다 — ①② 인벤토리·분류까지 하고 ③ 전역 적용은
          **범위 판정을 받은 뒤**에 한다. 판정 대기 중이며 임의로 넓히지 않는다.

      - id: SEC-03
        title: 익명 반출 0건 — **우리가 고칠 수 있는 자리**
        status: 구현
        proof: backend/tests/test_authn_gap_closed.py
        note: |
          [실측 2026-09-08] 11자리에서 나가고 있었다. 그중 우리 소관 9자리가 속한 컨트롤러의
          관문 없는 라우트 24자리를 닫고 재호출로 0건을 확인했다.
          docs/agent/evidence/D-343/INCIDENT.md

      - id: SEC-14
        title: 익명 반출 0건 — **§0.4 금지구역**
        status: 잠김
        blocker: DELIVERY_ZONE_ANON_LEAK
        why: |
          [실측 2026-09-08] backend/delivery 의 2자리가 지금도 익명에게 나간다
          (드론 텔레메트리 17KB · 시험 시나리오 2KB). 막는 코드를 붙였다가
          forbidden-zone 게이트가 STOP 으로 잡아 되돌렸다 — **게이트가 옳다**(D-327 · D-207).
          「모른다」가 아니라 **「못 한다」**이다.

      - id: SEC-04
        title: 우리 층에 **인증 관문 없는 라우트** 0건
        status: 미착수
        why: |
          [실측 2026-09-08] 79 → 51건. 남은 51건 중 24건은 authz 가 익명을 떨어뜨리고(호출로 확인),
          27건은 관문이 아예 없으나 호출에서 데이터가 나오지 않았다.
          **「데이터가 안 나왔다」는 「안전하다」가 아니다** — 핸들러는 돌았다.
          닫을 범위는 SEC-02 와 함께 판정받는다. 그동안 래칫으로 잠갔다(route_baseline.txt).

      - id: SEC-05
        title: 시크릿이 커밋되는 것을 막는다
        status: 구현
        proof: .gitleaks.toml

      - id: SEC-06
        title: 나가는 키(자격증명)를 코드가 아니라 저장처에 둔다
        status: 구현
        proof: backend/tests/test_k5_credential_store.py

      - id: SEC-07
        title: 키 회전 절차 (발급·폐기·주기)
        status: 미착수
        why: FR-05-3 의 「발급·폐기」 절이 미착수다. 회전 주기는 그 뒤의 일이다.

      - id: SEC-08
        title: 침투 시험 (외부 또는 자체)
        status: 미착수
        why: 0건. 상용 오픈 전 1회는 필요하다 — 지금 있는 것은 우리가 스스로 때린 호출뿐이다.

      - id: SEC-09
        title: 운영 포트 노출 점검
        status: 미측정
        why: |
          운영 서버를 직접 건드리지 않는다(불변 제약). 개발 환경의 포트 노출은 운영과 다르다 —
          **개발에서 잰 수를 운영의 수로 적으면 그것이 착시 ⑤(환경)다.**

      - id: SEC-10
        title: 들어오는 키를 평문으로 흘리지 않는다 (HTTPS 강제)
        status: 구현
        proof: backend/tests/test_f05_inbound_api_key.py

      - id: SEC-11
        title: 권한 거부가 **거부의 상태 코드**로 나간다
        status: 잠김
        blocker: DJCORE_200_ENVELOPE_403
        why: dj-core 가 HTTP 200 봉투에 403 을 담아 보낸다. §0.4 라 우리가 못 고친다.

      - id: SEC-12
        title: 주석 처리된 권한 뒤의 **열린 문** 0건
        status: 구현
        proof: backend/tests/test_commented_guards.py

      - id: SEC-13
        title: 캐시가 관문 판정을 대신하지 않는다
        status: 구현
        proof: scripts/verify_cache_bypass.py

