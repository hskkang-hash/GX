      - id: LAW-06a
        title: AI기본법 5의무 — **제품 안의 자리 5** (고지 문구·판정 근거·열람 절차·사람 확인·문서 생성) (위험관리·설명가능성·이용자보호·사람감독·문서)
        status: 구현
        proof: backend/tests/test_l_ai_act.py
        note_closed: |
          [실측 2026-09-05 · 턴 D 차선 L] 10 passed, 1 skipped. 다섯 의무의 자리표가 **다섯 칸 전부**를
            갖고 각 칸이 실재하는 자리를 `import` 로 확인한다. 고지 문장은 한 곳에서만 정해지고
            **알림 본문과 관제 대시보드 둘 다**에 닿는다 — 법이 요구하는 고지는 **닿는 자리**에 있어야 한다.
            ★ **문서화 의무의 한 칸(AI 모델 기술문서)은 「없다」로 적혀 있다 — 지우지 않았다.**
              빈칸과 「없음」은 다르다. 빈칸은 잊은 것과 구별되지 않는다.
            ⚠ **다섯 의무 각각의 충족 수준은 법률 검토 대기**다. 자리표가 섰다는 것과 의무를
              다했다는 것은 다른 사실이고, 뒤엣것은 이 자리에서 판정할 것이 아니다 — **세종 판정 요청**.
            ⚠ 착지 화면이 사람마다 다르다(`home_screen_setting`) — 붙인 곳은 관제 대시보드와 청구 화면이다.
        origin: PRD-2.5
        hand: in
        why: |
          [인용] 2026-01-22 시행 · 고영향 AI 11분야에 **공공안전** 포함 · 계도기간 1년+.
          다섯 중 넷은 제품 안에 조각이 이미 있다(월간 오탐률 · 규칙 판정 근거 표시 ·
          사람 확인 없는 외부 전파 0 · 알림 예산). **없는 것은 그것을 다섯으로 묶어 적은 자리와
          사전 고지 문구**다: 「이 화면의 판정 후보는 AI 가 제안하고 사람이 확정합니다」.

      - id: LAW-07
        title: 개인정보 열람·삭제 청구 대응 (접수 → 마스킹본 조회 → 회신 기록)
        status: 구현
        proof: backend/tests/test_l_privacy_request.py
        note_closed: |
          [실측 2026-09-05 · 턴 D 차선 L] 20 passed. 접수 → 마스킹본 조회 → 회신 기록이 한 줄로 이어지고
            **원본 경로가 응답에 0건**이다. 그 0 을 **양성 대조와 함께** 냈다 — 픽스처 이벤트의
            원본 경로가 실제로 채워져 있음을 먼저 단언한 뒤 0 을 쟀다. 빈 자료에서 난 0 은 0 이 아니다.
            ★ 남의 테넌트 청구는 「권한 없음」이 아니라 **「없다」**로 답한다 — 「권한 없음」은
              그 접수번호가 **있다는 사실**을 알려 준다.
            ★ **청구인 이름·연락처가 처리방침 초안의 수집 항목 표에 없다.** 표에 없는 것을 모으기
              시작했다 — CPO 가 한 줄을 더해야 한다(세종에게 넘긴다).
            ⚠ 법정 회신 기한을 시험이 강제하지 않았다 — **없는 기한을 시험이 강제하면 그 수가
              계약처럼 읽힌다.** 기한 · 전면 마스킹의 충분성 · 청구 기록의 보존기간은 **법률 검토 대기**.
        origin: PRD-2.5
        hand: in
        why: |
          [인용] 고정형 영상정보처리기기는 정보주체의 **열람·존재확인 청구**에 답할 법정 의무가 있다
          (위반 과태료 3천만~5천만). U4#17 「내 모습 지워 달라」에 답할 자리가 지금 없다.
          ★ 원본 영상은 여전히 나가지 않는다 — 법이 요구하는 것은 열람·존재 확인이지 **반출이 아니다**(11조 유지).

