            **「빠뜨린 것」과 「안 하기로 한 것」을 같은 칸에 세지 않는다.**

      - id: UX-22
        title: 등급·처리 단계 용어 — 「심각·경계·주의」 · 처리 단계 1축
        status: 구현
        origin: PRD-2.6
        proof: frontend/src/features/dsm/components/ResponseSteps.tsx
        note_closed: |
          ★ **닫혔다 [실측 2026-09-27 · 턴 B 차선 C]** — **라벨 사전만 바꿨다.**
          `severity` 값(`critical`/`warning`/`info`)은 **그대로 두고** 표시만
          「심각·경계·주의」로. 값을 바꿨으면 계약이 바뀌었을 것이다.
          축을 줄였다: 목록 **세 열 → 두 열**(처리 단계 · 판정 배지) · 상세 **넷 → 둘** ·
          모바일 상세도 같이. 진위 축(`status`)은 **렌더에서만** 내렸다 — 라우트·값 무수정.
          「기각」을 없애 **오탐 한 낱말**로. 「종결(으)로」는 동사꼴(`접수하기`·`조치 시작`·
          `종결하기`)로 바꿔 **프로그램이 만든 조사 0건**.
          새 컴포넌트 `ResponseSteps.tsx`(단계 한 줄 + `VerdictBadge`)를 세워
          **관제와 모바일이 같은 말을 쓰게** 했다 — 두 화면이 다른 말을 쓰면 그것이 다음 결함이다.
        why: |
          [실측 2026-09-25] 화면 등급이 「위험·경고·정보」인데 계약 3등급은
          **심각·경계·주의**(DA-01 F-04)다. 표에는 대응·상태·판정 **세 열**이 나란히 서고,
          상세에는 넷이 선다 — 사람이 어느 축을 보는지 모른다.
          ★ **표시만 바꾼다.** `severity` 값(info/warning/critical)은 계약 스키마이고
