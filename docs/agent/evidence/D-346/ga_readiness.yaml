            09-26 의 「미시드」는 틀린 진단이었다. 지금 매핑을 **빠뜨린** 역할은 **0종**이고,
            매핑하지 않은 9명은 `order` 역할 — `K3_UNMAPPED_BY_DECISION` 에 이름이 적힌
