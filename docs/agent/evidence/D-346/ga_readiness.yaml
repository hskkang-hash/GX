          (§0.4 126건 제외 · 우리 관할 188). 지운 줄 수 **0줄**.
          지우는 것은 되돌리기 어렵고, **분류의 정확도를 먼저 봐야 한다.**
          증거: docs/agent/evidence/D-388/dormant_classified.md
