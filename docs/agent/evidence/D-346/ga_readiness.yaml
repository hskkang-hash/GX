            「K2 가 아직 훈련 스위치를 보지 않는다」. 배선이 들어오자 그 시험이 빨개졌고,
            **그 빨강이 「배선이 왔다」는 선언**이었다. 갈아 끼운 것이
            `DrillIsWiredToChannelsTest`(훈련 중 채널이 `log` 로 간다 + 양성 대조).
