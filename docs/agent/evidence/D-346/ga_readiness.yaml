            안 들어 있다 · **다른 호스트가 아니다**. 그러므로 **RPO 24h 는 아직 약속할 수 없다.**
          ★ [2026-09-06 · 턴 H · 차선 E] **재기동 창 준비물을 완성해 조율자에게 넘겼다 —
            컨테이너는 하나도 다시 만들지 않았다**(창은 조율자가 병합 시점에 한 번 연다).
            `docs/agent/evidence/OPS-19/재기동창_준비물.md` 에 넷이 적혀 있다:
            ㉠ **마운트가 필요한 것은 beat 가 아니라 워커다** — `beat` 는 시각만 쏘고
              태스크를 **실제로 돌리는 것은 `gx-celery-e`** 다. 하나만 고른다면 그것이다.
            ㉡ 판(version) 벽의 갈래를 **골랐다: 워커 이미지에 `postgresql-client-18`**.
              규칙은 「클라이언트 major >= 서버 major」 하나이고, 이 갈래만 **개발과 운영이
              같은 형상**이다. `docker.sock` 갈래는 **거부**했다 — 백업 하나 때문에 워커에게
              호스트 도커 전권(=호스트 루트)을 주는 것이고, 매니지드 환경에는 그 소켓이 없다.
              사이드카 갈래는 **주기가 두 벌**이 되어 보류했다.
            ㉢ 창 전 확인 셋은 **RUNBOOK STEP 2D ⓪ 을 인용**했다 — 새로 짓지 않았다.
            ㉣ **창이 닫힌 뒤 무엇을 재면 이 절이 닫히는지**를 명령으로 적었다:
              `/backup/<날짜>/` 에 **사람 손 없이** 생긴 파일 1개 + `backup_last.json` 의
              `verdict=="OK"`. 손으로 뜬 덤프는 `/backup/` **뿌리**에 있으므로 자리로 갈린다.
          ⚠ **OPS-19 가 닫혀도 RPO 24h 는 아직 약속하지 못한다** — SLA v0.2 §4 의 셋 중
            ㉡(빈 DB 를 세워 본다)만 갚혔고 ㉠(2일 연속)·㉢(호스트 갈래)이 남는다.
