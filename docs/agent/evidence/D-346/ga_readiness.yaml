      - id: SEC-07
        title: 키 회전 절차 (발급·폐기·주기)
        status: 구현
        proof: backend/tests/test_s_key_rotation.py
        note: |
          [실측 2026-09-26 · 차선 S · 18 passed] `backend/common/key_rotation.py` —
          발급 · 폐기 · 회전 · 주기 넷을 세웠다.
          ★ **회전은 「끊고 새로 주기」가 아니다.** 그 자리에서 끊으면 상대 연동이 그 순간
            죽고, **끊긴 쪽에서는 우리 잘못으로 보이지 않는다.** 그래서 옛 키를 겹치는
            창(기본 7일)만큼 더 살려 둔다 — 그리고 창이 닫힌 뒤 죽는 것까지 시험이 잰다.
          ★ 회전이 **수명을 늘리는 일**이 되지 않게 한다: 겹치는 창이 지금 만료보다 뒤면
            당기지 않는다. 이 갈래가 없으면 회전이 곧 연장이 된다.
          ★ 만료 없는 키를 **기본값으로 내지 않는다**(기본 90일). 기본값이 「영원」이면
            회전 정책은 문서로만 존재한다.
          ★ 폐기는 행을 **지우지 않는다** — 지우면 그 키가 무엇을 했는지가 함께 사라진다.
            사고 뒤에 필요한 것이 정확히 그것이다. 그리고 「끊었다」의 증거는 `is_active`
            열이 아니라 **제품이 인증에 쓰는 그 함수**(`verify_key`)가 거절하는 것이다.
          ★ 격리: 남의 테넌트 키는 못 만진다 — 거절만이 아니라 **새 키 행이 안 늘고**
            남의 키 수명도 안 바뀌는 것까지 잰다(선등록이 경고한 자리).
          ★ **잇는 것은 제품이 한다**: `common.key_rotation_watch_beat`(매일 03:50)가
            「돌려야 할 때가 된 키」를 센다. 자동으로 돌리지는 않는다 — 상대의 연동을
            언제 흔들지는 사람이 정한다. beat 가 정책을 실제로 부르는지도 시험이 잰다.

      - id: SEC-08
        title: 침투 시험 (외부 또는 자체)
        status: 구현
        proof: scripts/probe_self_pentest.py
        why: 0건. 상용 오픈 전 1회는 필요하다 — 지금 있는 것은 우리가 스스로 때린 호출뿐이다.
        note_closed: |
          ★ **자체 침투 1회 [실측 2026-09-05 · 턴 C 차선 S] — `scripts/probe_self_pentest.py`**
          **PASS 6 · FAIL 0 · 회색 0 · 익명 2xx 누출 0건.** 술어 여섯 — ①익명 차단
          ②토큰이 문을 열었나 ③봉투 승격(200봉투 0건) ④익명 쓰기 삼킴 0건
          ⑤부재·IDOR 둘 다 404 ⑥캐시 우회 둘 다 401.
          모수와 술어를 함께 적었다(D-301) — 쓰기는 **실재 id 로 안 두드렸고**,
          라우트 존재는 `PROPFIND` 로, 캐시는 `?bust=` 로 비꼈다.
          ★★ **그리고 이번엔 「닿았다」는 증거가 결과와 함께 있다**: 자기표본 401 ·
            `reached: true` · 로그인 성공 · **토큰이 5/5 라우트의 응답을 바꿨다.**
            그 마지막 술어가 특히 값이다 — 토큰을 들고도 응답이 하나도 안 바뀌면
            「인증을 쟀다」가 아니라 **「인증이 아무것도 안 하는 것을 못 본 것」**이다.
          곁가지 둘: `POST /api/dsm/webhook-subscriptions` PROPFIND **405**
          (UX-19 의 문이 실제로 서 있다) · ③ PASS(SEC-11a 승격이 **살아 있는 프로세스에서**
          듣는다 — 첫 실행의 FAIL 이 재기동 대기였다는 판단이 확인됐다).
          ★ **차선 S 의 첫 실행에는 FAIL 이 하나 있었고, 그것이 코드 구멍이 아니라
            「낡은 프로세스」임을 S 가 스스로 갈랐다** — 같은 서버에서 이번 턴 신설
            라우트를 PROPFIND 로 두드려 404 가 나오는 것으로 **그 프로세스가 이 턴 코드
            이전임을 실측**했다. 조율자가 8000 을 새로 띄우자 그 FAIL 이 사라졌다.
            **「우리 코드가 틀렸다」와 「내가 옛 코드를 재고 있다」를 가른 것이 이 절의 값이다.**
          ★★ ⚠ **그리고 이 프로브 자신에게 결함이 있었다 [실측 2026-09-05 · 조율자].**
            호스트에서 돌리면 `gx-shell` 의 8000 이 안 보이는데(그 컨테이너는 8000 을
            게시하지 않는다), 그 상태에서도 **PASS 4 · 누출 0건**이 나왔다 —
            술어가 「익명으로 두드려 2xx 가 아니면 PASS」인데 **못 닿은 것도 2xx 가
            아니라서** 통과로 셌다. 아무것도 안 두드리고 「안전하다」고 답한 것이다.
            **침투 시험에서 이 모양이 특히 나쁘다 — 틀린 안심은 무지보다 나쁘다.**
            (D-400 「판정 불가를 통과로 세고 있었다」의 재발.)
            → 고침: 자기표본으로 **도달을 먼저 증명**하고, 못 닿으면 **exit 2** ·
              로그인 실패는 SKIP 이 아니라 회색 · `GX_ROUTE_CONTAINER` 를 보고 스스로
              컨테이너에서 다시 돈다 · 못 닿는 주소로 exit 2 가 나오는 음성 대조를 자기시험에.

