          두 번 빌드 + 깨끗한 디렉터리 빌드 = **산출물 197개 이름·해시 전부 일치.**
          브랜치 참조 잔여 **0건** (`scripts/verify_deploy_ready.py` 가 매번 다시 센다).

      - id: QA-09
        title: 설치가 재현된다 (`npm ci` 가 같은 것을 가져온다)
        status: 미측정
        hand: out
        hand_why: |
