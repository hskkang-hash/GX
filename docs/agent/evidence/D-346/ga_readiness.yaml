        why: |
          [등재 2026-09-05 · 턴 F 병합] 차선 S 가 「부분」으로 내려 했으나 **「부분」은 상태가
          아니라 아직 안 쪼갠 것의 이름**이다(D-314). 그래서 쪼갠다 — 문(UX-24a)은 닫혔고,
          **그 문을 화면이 아직 안 두드린다.**
          닫는 조건: ① 토큰을 브라우저에 어떻게 넣는가 [판정 필요] — 쿼리 파라미터는
          접근로그에 남으므로 안 된다 ② `/wall` 이 `X-GX-Wall-Token` 을 싣는다
          (`authn_paths.md` §9-6) ③ **데스크 로그인 세션이 살아 있는 채로** 월 화면이
          그려진 캡처 1장. 서버 면 실측만으로는 「관제실 대형화면이 열린다」를 말할 수 없다.

        note_turn_g: |
          [실측 2026-09-06 · 턴 G · 차선 C 작업 · **조율자 검수**] 조건 셋 중 **②③ 충족 · ① 위반**.
          그래서 **미착수로 둔다** — 세 조건은 이 절이 자기 손으로 적은 것이고,
          작업이 끝났다는 것과 조건이 충족됐다는 것은 다른 사실이다.
            ② 충족: 앞판이 `X-GX-Wall-Token` 을 싣는다(`frontend/src/features/dsm/wallToken.ts`).
              ★ 그전까지 **브라우저는 그 문을 한 번도 부른 적이 없었다** — `CORS_ALLOW_HEADERS`
                에 그 이름이 없어 프리플라이트에서 막혔다. 서버 면은 초록(쓰기 20 거부 20)이고
                화면도 떴고 콘솔 오류도 0건이라, **캡처만 봤으면 초록으로 보였을 자리다.**
            ③ 충족: `docs/agent/evidence/P-74/shots/wall_with_token.png`(1920×1080 · 실제 사건) ·
              대조군 `wall_without_token.png`(토큰 없으면 로그인으로 튕긴다).
            ① **위반**: 이 절은 「쿼리 파라미터는 접근로그에 남으므로 안 된다」고 적었는데
              구현은 `?token=` 으로 받는다. 받은 즉시 `history.replaceState` 로 주소창에서
              지우지만, **지워지는 것은 주소창이지 이미 나간 요청이 아니다.**
              [실측] `nginx/gx-front.conf:39` 의 `log_format gx` 가 `"$request"` 를 적고,
              그 문자열은 `GET /wall?token=<토큰> HTTP/1.1` 이다 — 토큰이 접근로그에 그대로 남는다.
              ⚠ 「관제실 화면은 사진에 자주 찍힌다」는 사유로 주소창을 지운 것은 옳다.
                그러나 그것은 **다른 위험**을 막은 것이고, 이 절이 금지한 위험은 그대로다.
          닫는 길 둘 — **세종 판정 필요**: ㉠ 받는 자리를 바꾼다(예: 한 번 쓰는 교환 코드를
          POST 로 바꿔 토큰을 받는다) ㉡ 「접근로그에 남아도 된다」로 조건 ①을 고친다
          (그러려면 **12시간 수명 + 즉시 회수**가 그 위험을 감당한다는 판정이 함께 있어야 한다).

        note_turn_h: |
          [실측 2026-09-06 · 턴 H · 차선 C · P-78 ④] **조건 ①을 ㉠ 으로 닫았다 — 다만
          예시로 적힌 방법과는 다른 방법이다.** 상태를 내가 바꾸지 않는다: 조율자·세종이
          읽고 판정한다.
            ㉠ 을 어떻게 했나 — **받는 자리를 질의부에서 조각부로 옮겼다** (`?` → `#`).
              조각부는 규약상 요청에 실리지 않는다: 브라우저가 서버로 보내지 않으므로
              **어떤 앞단도 적을 수 없고**, 바깥으로 나가는 `Referer` 에도 안 붙는다.
              [실측 · 앞단이 적는 요청 줄을 그대로 본다 —
               docs/agent/evidence/P-78/ux24c_remeasure.json]
                 옛 주소 `/wall?token=<토큰>` → 로그에 `"GET /wall?token=<토큰> HTTP/1.1"`
                 새 주소 `/wall#token=<토큰>` → 로그에 `"GET /wall HTTP/1.1"`  ← 토큰 없음
            ★ 예시로 적힌 「한 번 쓰는 교환 코드를 POST 로」는 **하지 않았다.** 사유를 적는다:
              그것은 **발급 문을 HTTP 에 내는 일**이고, UX-24a 가 자기 손으로 그 반대를
              적어 두었다(「발급 문을 HTTP 에 내지 않았다 — 발급 문 자체가 새 공격면이다」).
              뒤집으려면 새 인증 경로 한 줄(P-15 · `authn_paths.md`)과 그 판정이 먼저다.
              **한 글자로 닫히는 조건을 새 문 하나로 닫지 않았다.**
            ⚠ 옛 주소는 **더는 받지 않는다.** 받아 주면 조건 ①이 계속 깨진 채로 산다.
              대신 조용히 무시하지 않는다 — 자판도 사람도 없는 대형 화면이 로그인 화면을
              띄운 채 밤을 새우지 않게, 관문 밖에 **말하는 자리 하나**를 두었다:
              「이 주소로는 월 모드를 열 수 없습니다. 관리자에게 새 주소를 받으십시오.」
            ② 재실측: **브라우저가 그 문을 실제로 불렀다** — 턴 G 에는 요청이 0건이었다
              (`CORS_ALLOW_HEADERS` 에 이름이 없어 프리플라이트가 막았다). 이제
              `/api/dsm/events/queue` · `/api/dsm/cameras/pulse` 두 문에 `X-GX-Wall-Token`
              이 실려 나간다.
              ⚠⚠ **그 고침은 코드에는 있었으나 도는 서버에는 없었다** [실측]: 8000·8400·8401
                에 떠 있던 서버들의 프리플라이트 응답에 그 이름이 아직 없다(전부 `--noreload`
                로 그 고침 이전에 떴다). 그래서 이 재실측은 **이번 턴에 새로 띄운
                8402**에서 했다. 고친 것과 도는 것은 다른 사실이다.
            ③ 재실측: 자리 데스크톱이 `/dsm/queue` 를 보고 있는 **동안** 월 화면이 떴고,
              월을 켠 뒤에도 자리 화면이 로그인으로 안 튕겼다
              (`shots/wall_with_token_desk_alive.png` · `shots/desk_alive_after_wall.png`).
            남은 위험(숨기지 않는다): 조각부는 **브라우저 방문 기록**에는 남는다.
              받은 즉시 `history.replaceState` 로 주소창에서 지우지만, 그것은 조건 ①이
              말한 위험이 아니라 종전 판이 이미 막던 위험(사진)이다.


      - id: UX-25
        title: 제품 화면이 **사이드바에 있다** — 관제요원이 URL 을 치지 않고 갈 수 있다
        status: 구현
        gate: scripts/verify_sidebar.py
        proof: scripts/verify_sidebar.py
        hand: in
        note_closed: |
          [실측 2026-09-05 · 턴 F 차선 C · 세종 P-61] 메뉴 정본이 dj-core DB 이므로
            **코드가 아니라 시드(데이터)** 로 넣었다 — `Menu` 모델도 `CustomSidebar` 도
            한 줄 안 고쳤다(§0.4 · forbidden-zone 게이트 PASS). 제품 메뉴 **10행** ·
            역할 연결 34개. 시드는 멱등이고 되끄기(`--unlink`)가 있다.
          역할별 [실측 · **실제 로그인** GET /api/menu/menus]:
            U1 12줄/제품 0 → **5줄/제품 5** · U2 14/0 → 21/**7** · U4 24/0 → 26/**2** ·
            U5 70/**3**(링크 표로만 — U5 시드 계정이 없다).
            U1 은 다섯 줄 전부가 우리 제품이고 전부 한국어다(P-61 9장 상한 충족).
          ★ **소속을 안 붙였다 — 붙일 수가 없었다.** `RoleMenu` 가 (메뉴,역할) 유일이고
            `list_menus` 가 메뉴를 소속으로 안 가린다[실측]. 테넌트마다 심으면 모든
            테넌트의 사본이 모두에게 보인다. 정본은 **소속 없는 한 벌**이고, 그래서
            새 테넌트는 만들어지는 순간 이미 본다(구조로 닫힘). 신호(`UserGroup`·`Role`
            post_save)는 표가 늘었을 때와 새 역할이 생겼을 때를 메운다.
          ★★ **두 눈 대조가 거짓 초록을 막았다**: 계정 하나(`fire_user`)로는 5줄이었는데
            같은 U1 의 `operator` 는 **19줄**이었다 — 아무 계정으로도 재 본 적이 없던 자리다.
            판정기가 「링크표 19 ≠ 로그인 5」로 잡았다. 계정 하나로 재고 닫았으면 거짓 초록이다.
          ⚠ P-61 의 스물한 자리 중 **여덟은 화면이 없어 안 걸었다**(요원별 현황 · 설정 ·
            보고서 · 이벤트 검색 · 감사 기록 · 시스템 · 알림 규칙 · 백업).
            이름을 `common/product_menus.py::P61_NO_SCREEN_YET` 에 적었다 — 면제가 아니라 선언이다.
          ⚠ 하단 줄은 사이드바 하단이 아니라 **화면 하단**이다(rj-core §0.4). 소스는 들어갔으나
            **번들로 찍어 보지 못했다** · 지원 창구 값이 비어 배포가 `GX_SUPPORT` 를 줘야 한다.
          ⚠ U2 21줄 · U4 26줄에는 여전히 영문 이름과 배송·드론 화면이 있다 —
            P-61 이 상한을 U1 에게만 줬고, 재지 않은 것을 함께 끊으면 그 결정이 추측이 된다.
        hand_why: |
          시드 명령 한 자리는 **우리가 짓는다** — 손 안이다. 막는 것은 짓는 일이 아니라
          **정본(dj-core `Menu` 표)을 고치는 판정**이고, 그 판정은 세종·대표의 것이다
          (`MENU_REGISTRY_LIVES_IN_DJCORE_DB` 와 같은 이유).
          판정이 나면 같은 턴에 닫힌다.
        why: |
          ★★★ [실측 2026-09-05 · 턴 E · Product/User Agent] **`/dsm/*` · `/wall` · `/start` 로
          시작하는 메뉴 행이 DB 에 하나도 없다.** 사이드바는 dj-core 가 주는 목록으로만 그려지고
          그 목록에 우리 화면이 **한 장도 없다.** 씨 뿌리는 코드도 저장소 전체에 없다.
          즉 **관제요원이 사이드바에서 우리 제품으로 갈 수 있는 길이 없다** — URL 을 직접 쳐야 한다.
          ★ 이 절이 태어난 자리가 중요하다: 우리는 「인수 자산 화면을 끊어서 관제 화면 9장을
            만든다」를 하고 있었다. 끊기는 잘 됐다(12개 · 삭제 0 · 왕복 실측). 그런데
            **끊을수록 사이드바는 0 에 가까워진다** — 더할 것이 애초에 없었기 때문이다.
            **빼는 일만 하고 있으면 더할 것이 없다는 사실이 안 보인다.**
          ⚠ 우리가 할 수 있는 일이다(시드 명령 한 자리). 막는 것은 **정본을 고치는 판정**이다.

