      - id: UX-14
        title: 대응 시계 표시 (카드 4단계 · 상세 4시각 · 월간 p50/p95)
        status: 구현
        proof: backend/tests/test_c_response_clock.py
        origin: PRD-2.5
        note: |
          [실측 2026-09-24 · 차선 C] 문턱 넷 (30초·2분·5분·8분) · 상세 타임라인
          (`GET /events/{id}/timeline`) · 월간 분포(`GET /events/response-times`).
          ★ **자동 종결은 분모에서 빠진다**: `excluded_auto_closed=3 · close.n=1` [실측].
            빼지 않으면 오탐 자동 종결이 대응 시간을 좋게 만든다(D-293 의 새 얼굴).
            분모가 0이면 p50 은 `null` 이다 — 0 이 아니다.
          ★ **지시서와 갈린 자리 — 차선 C 가 착수 전 실측으로 고쳤다.**
            「네 시각은 모델에 이미 있다」가 **아니었다**: `DetectionEvent` 에 있는 것은
            `occurred_at` 하나뿐이고 나머지 셋은 칸이 없다. D-399 는 `response_state`
            **한 칸**을 세웠고 그 주석이 「이 칸은 who·when 을 들지 않는다 — 어떻게
            왔는지는 감사가 안다」라고 적어 두었다. 그래서 네 시각은 감사에서 센다.
            **칸 셋을 새로 만들지 않았다** — 새 칸은 태어나는 순간 과거가 비고,
            빈 과거는 「대응이 빨랐다」로 읽힌다.
          ★ 화면에 그려지는 것까지 단언하지 않는다: 캡처는 초점 화면이 떴다는 것을
            읽었고, **카드 글자가 4단계로 커지는 모양**은 아직 시험이 아니라 코드다.
        why: |
          [실측 2026-09-24 등재] 네 시각(occurred/acknowledged/arrived/closed)은 모델에 **이미 있다**
          (P-1 · D-399 대응 축). 없는 것은 **계산과 표시**다 — 카드 경과 시간 4단계(30초·2분·5분·8분) ·
          상세 타임라인 · 월간 분포.
          ★ **자동 종결(D-401)은 분모에서 뺀다** — 빼지 않으면 오탐 자동 종결이 대응 시간을 좋게 만든다
            (D-293 의 새 얼굴 · 지시서 §3-4).

