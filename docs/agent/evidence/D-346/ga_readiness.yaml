      - id: SEC-04
        title: 우리 층에 **인증 관문 없는 라우트** 0건
        status: 구현
        gate: scripts/verify_authn_paths.py
        proof: backend/tests/test_authn_gap_closed.py
        note: |
          ★ [실측 2026-09-26 · 차선 S] **28 → 0.** 우리 층 28자리에 인증 관문을 걸었다
            (`auth=CustomJWTAuth()` · 12파일). 익명 호출 6자리 재확인: **전부 HTTP 401**
            (200 봉투가 아니라 진짜 401). 관문 없음 100 → **72**, 남은 72는 전부
            저장소 밖 49 · §0.4 금지구역 23 — 우리가 못 고치는 자리다.
          ★ 「데이터가 안 나왔다」는 「안전하다」가 아니다(지시서 §4-2). 그래서 응답 본문이
            아니라 **관문이 붙어 있는가**로 판정했다 — 그 28건 중 10건은 `path_permission`
            이 익명을 떨어뜨리고 있었지만 그것은 인증이 아니다(D-342).
          ★ 눈에 띄던 것을 이름으로 적는다: `POST /api/stream-monitors/stream-monitors`(등록) ·
            외부 스트림 등록·수정 · 녹화 시작/중지 · AI 이중 스트림 시작/중지 —
            **쓰기 면이 관문 없이 서 있었다.** 그리고 partner 콜백 모형 4자리는 익명 POST 로
            **소켓 알림을 밀어 넣을 수 있는 자리**였다.
          ★ 부작위 시험을 함께 세웠다(`OurLayerHasNoGatelessRouteTest`) — 이름을 적은
            컨트롤러만 보는 앞 시험과 달리 **레지스트리 전수**를 훑고 관할로 가른다.
            관할 술어는 계측기와 **같은 한 벌**이다(`common/route_ownership.py` · D-369).
          ★ 그리고 「모듈 해석 실패」를 따로 시험한다 — **못 본 것을 0으로 세지 않는다**(D-301).
        why: |
          [실측 2026-09-09] 79 → 55건(라우트 선언으로 24 차단). 그중 24건은 authz 가 익명을
          떨어뜨리고, 31건은 관문이 아예 없으나 호출에서 데이터가 나오지 않았다.
          **「데이터가 안 나왔다」는 「안전하다」가 아니다** — 핸들러는 돌았다.
          닫을 범위는 판정 대상이다. 그동안 래칫으로 잠갔다(route_baseline.txt).
          ★ [실측 2026-09-24 · 차선 S · 인벤토리 재측정] **「55」가 틀린 수였다.**
            라우트 **685건** 중 인증 콜백 없음 **100건**을 관할로 갈랐다:
              · **우리 층 28건** ← SEC-04 의 진짜 표적 (authz 있음 10 · 아무것도 없음 18)
              · 저장소 밖(dj-core 등) 49 · §0.4 금지구역 23 · 모듈 해석 실패 **0**
            55 는 09-09 자 수이고 **관할 구분이 없었다** — 우리가 못 고치는 자리와
            고쳐야 하는 자리가 한 수에 섞여 있었다. 표적이 절반으로 준 것이 아니라
            **처음으로 표적이 무엇인지 알게 됐다.**
            눈에 띄는 것: `stream_monitors` 12건에 **쓰기 면**이 섞여 있다
            (녹화 시작/중지 · 외부 스트림 등록).
          전수: docs/agent/evidence/SEC-04/authn_gap_ownership.json

