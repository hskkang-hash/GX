  - id: "8"
    name: 법·인증 (개인정보·GS·SLA)
    weight: 5
    clauses:
      - id: LAW-01
        title: 계약 11조 — 영상 반출 4규약
        status: 구현
        gate: scripts/verify_clip_extraction.py
        proof: backend/tests/test_clip_playback.py

      - id: LAW-02
        title: 영상정보처리기기 설치·운영 고지
        status: 미측정
        hand: in
        hand_why: |
          초안도 배선도 섰다. 남은 것은 **법률 대조 한 번**이고 그것은 우리가 잡는다 —
          상대방·기관을 기다리는 자리가 아니다
        why: |
          문서 0건이었다. [2026-09-05 · 턴 C] **세종이 초안을 썼고**(대표 지시 ④ ·
          `docs/design/GX-LAW-02_영상정보처리기기_고지_초안_v0.1.md`) 차선 E 가 **배선만** 했다:
          `GET /api/dsm/settings/notice-draft` — 안내판의 「제품 자동」 칸을 설정값에서 채운다.
          ★ **상태를 「구현」으로 적지 않는다 — 법률 검토를 안 받았다.** 고지문은 게시하는
            순간 대외 문서가 되고, 틀린 고지는 되돌릴 수 없다. **초안이 있다는 것과
            법을 지킨다는 것은 다른 사실이다.**
          ★★ 차선 E 가 **보존 일수를 적지 않고 `None`+「확인」으로 두었다** — 서식의
            「기본 30일」을 베껴 적을 수도 있었지만, **제품 어디에도 보존 일수를 선언한
            자리가 없다.** 없는 수를 안내판에 적으면 그 순간 **문서가 실측 행세**를 한다
            (D-316 과 같은 얼굴). 그 부재 자체가 다음에 닫아야 할 자리다.

      # ── LAW-02a (2026-09-05 TC 신설 · 분모 127 → 128) ─────────────────────
      #   차선 E 가 LAW-02 를 배선하다 **없는 것**을 찾았고, 등재 형태까지 제안했다.
      #   조율자가 그 제안을 그대로 채택한다 — 논거가 이 저장소의 규칙과 맞다:
      #     「잠금은 *우리가 만들 수 없는 값*이거나 *남이 고쳐야 하는 코드*에 쓴다.
      #      **손 안의 일을 잠금으로 적으면 「못 하는 일」로 보이고, 못 하는 일 목록은
      #      아무도 손대지 않는다.**」 — P-35 가 SEC-11 을 쪼갠 것과 같은 결이다.
      - id: LAW-02a
        title: 영상 **보존 일수**를 제품이 선언한다 (그리고 그대로 지운다)
        status: 구현
        gate: scripts/verify_retention_declared.py
        proof: backend/tests/test_l_retention.py
        note_closed: |
          [실측 2026-09-05 · 턴 D 차선 L] 13 passed. 보존 일수를 `apps/dsm/retention.py` 가 선언하고
            같은 파일의 `sweep()` 이 그 수대로 **진짜로 지운다** — 절의 이름이 요구한
            「적었다가 아니라 그대로 지운다까지」의 둘째 조건이다. 안내판이 이제 삭제와 **같은 수**를 본다.
            dry-run 이 기본값 · 지운 식별자와 해시가 감사에 남는다 · 되돌릴 수 없다는 사실을
            화면이 누르기 전에 말한다.
            ★★★ **이 저장소의 `delete()` 는 대개 지우지 않는다** — dj-core `BaseModel` 이
              `SafeDeleteModel(SOFT_DELETE_CASCADE)` 다. 보존기간을 약속해 놓고 소프트 삭제를 쓰면
              **지운 척**이 되고, 평범한 조회에서는 똑같이 안 보이므로 **아무도 모른다.**
              `HARD_DELETE` 를 명시했다. 이 한 줄이 이 절의 값이다.
            ★ **보존기간은 지금 테넌트별일 수 없다** — 녹화 표에 소속 칸이 없다. 그래서 집행이
              전역이고, 실행 라우트를 전역 관리자로 막았다. **없는 축을 있는 척하지 않았다.**
            ⚠ 객체저장소에서 **바이트가 실제로 사라지는 것**은 못 쟀다(이 환경의 저장소가 `minio.invalid`).
              실패 갈래를 대신 쟀다. 30일이 법정 기준에 맞는 수인가는 **법률 검토 대기**.
        hand: in
        hand_why: |
          설정 자리를 만드는 것도, 그 수대로 지우는 것도 **손 안**이다.
          상대방·기관·대표를 기다리는 자리가 아니다
        why: |
          ★ [실측 2026-09-05 · 턴 C 차선 E] **제품 어디에도 보존 일수를 선언한 자리가 없다.**
          LAW-02 안내판 서식에는 「기본 30일」이 적혀 있는데, 그 수를 **제품이 모른다.**
          차선 E 는 그 수를 베껴 적지 않고 `None` + 「확인」으로 두었다 — **옳다.**
          없는 수를 안내판에 적으면 그 순간 **문서가 실측 행세**를 한다(D-316 과 같은 얼굴).
          그리고 안내판은 **게시하면 되돌릴 수 없다.**

          ★★ 닫는 조건이 둘이고, **둘째가 진짜다**(차선 E 제안 그대로):
            ① 보존 일수를 선언하는 설정 자리가 생긴다
            ② **삭제가 그 수를 실제로 본다** — 「적었다」가 아니라 「그대로 지운다」까지.
            ⚠ 선언만 하고 삭제가 그 수를 안 보면 **안내판은 여전히 거짓말**이다.
              그때는 거짓말이 **법적 효력을 가진 문서**로 걸려 있다는 점에서 더 나쁘다.
          ★ OPS-07(로그 보존)이 이미 같은 교훈을 남겼다: **크기 기반 회전으로는 기간을
            약속할 수 없다.** 영상도 같다 — 「30일」을 적으려면 30일에 지우는 것이 있어야 한다.

