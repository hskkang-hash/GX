          ★ **이벤트는 접지 않는다** — F-14 통계는 원본 건수를 본다. 접는 것은 화면이지 기록이 아니다.

      - id: UX-14
        title: 대응 시계 표시 (카드 4단계 · 상세 4시각 · 월간 p50/p95)
        status: 구현
        proof: backend/tests/test_c_response_clock.py
        origin: PRD-2.5
        note: |
          [실측 2026-09-24 · 차선 C] 문턱 넷 (30초·2분·5분·8분) · 상세 타임라인
          (`GET /events/{id}/timeline`) · 월간 분포(`GET /events/response-times`).
          ★ **자동 종결은 분모에서 빠진다**: `excluded_auto_closed=3 · close.n=1` [실측].
            빼지 않으면 오탐 자동 종결이 대응 시간을 좋게 만든다(D-293 의 새 얼굴).
            분모가 0이면 p50 은 `null` 이다 — 0 이 아니다.
          ★ **지시서와 갈린 자리 — 차선 C 가 착수 전 실측으로 고쳤다.**
            「네 시각은 모델에 이미 있다」가 **아니었다**: `DetectionEvent` 에 있는 것은
            `occurred_at` 하나뿐이고 나머지 셋은 칸이 없다. D-399 는 `response_state`
            **한 칸**을 세웠고 그 주석이 「이 칸은 who·when 을 들지 않는다 — 어떻게
            왔는지는 감사가 안다」라고 적어 두었다. 그래서 네 시각은 감사에서 센다.
            **칸 셋을 새로 만들지 않았다** — 새 칸은 태어나는 순간 과거가 비고,
            빈 과거는 「대응이 빨랐다」로 읽힌다.
          ★ 화면에 그려지는 것까지 단언하지 않는다: 캡처는 초점 화면이 떴다는 것을
            읽었고, **카드 글자가 4단계로 커지는 모양**은 아직 시험이 아니라 코드다.
        why: |
          [실측 2026-09-24 등재] 네 시각(occurred/acknowledged/arrived/closed)은 모델에 **이미 있다**
          (P-1 · D-399 대응 축). 없는 것은 **계산과 표시**다 — 카드 경과 시간 4단계(30초·2분·5분·8분) ·
          상세 타임라인 · 월간 분포.
          ★ **자동 종결(D-401)은 분모에서 뺀다** — 빼지 않으면 오탐 자동 종결이 대응 시간을 좋게 만든다
            (D-293 의 새 얼굴 · 지시서 §3-4).

      - id: UX-15
        title: 키보드·사운드 (J/K 이동 · 1/2/3 판정 · Enter 상세 · M 음소거 · 사운드 3종)
        status: 구현
        gate: scripts/verify_wall_keys.py
        proof: scripts/verify_wall_keys.py
        note_closed: |
          [실측 2026-09-05 · 턴 D 차선 C1] 판정기 술어 6종 전부 PASS · 자기시험 양성 6 · 음성 10.
            J/K 이동 · Enter 상세 · 1/2/3 **처리 단계** · M 음소거. 소리 3종은 WebAudio 로 만든다
            (에셋 0건). **심각에서만** 울고 묶음(×N)은 1회로 접힌다.
            ★ 1/2/3 은 **판정이 아니라 처리 단계**에 붙였다 — 이 화면이 가진 단추가 그것뿐이고,
              판정 키를 여기 붙이면 「한 화면에 축은 하나」가 깨진다(GX-COPY 규칙 4).
              자리는 **고정**이다(1=접수 · 2=조치 시작 · 3=종결) — `allowed_next` 의 순서에 붙이면
              카드마다 1 의 뜻이 달라지고, 뜻이 흔들리는 키는 관제실에서 오조작을 만든다.
            ★★ **한글 입력기가 켜지면 `event.key` 단축키는 전멸한다** — `j` 를 눌러도 `ㅓ` 로 온다.
              관제요원은 한국어를 친다. `key` 로 짰으면 「가끔 안 먹는다」로 보고되고 아무도
              재현 못 했을 고장이다. **자판의 자리(`event.code`)로 읽어** 막았다.
            ★★ **「음소거가 아닌데 안 들리는」 세 번째 상태가 실재한다** — 브라우저 자동재생 잠금.
              `muted` 하나로 그리면 화면은 「소리 켜짐」이라 말하는데 아무 소리도 안 나고,
              관제요원은 조용한 화면을 「사건이 없다」로 읽는다. 잠금 풀림을 따로 세어 갈랐다.
            ⚠ 소리가 **실제로 나는가** · 키가 **실제로 먹는가** 는 브라우저를 열어야 안다 —
              이 턴에 안 열었다(동시 접속 1개). **코드와 판정기까지만 초록이다.**
        origin: PRD-2.5
        hand: in
        why: |
          [실측 2026-09-24 등재] 판정 경로가 클릭뿐이고 소리는 0종이다.
          관제요원은 8시간 마우스를 쥐지 않는다. **심각만 소리가 난다** — 묶인 반복 이벤트는 1회.

