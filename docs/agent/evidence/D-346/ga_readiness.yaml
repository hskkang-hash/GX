      # ★ D-390 — 회피가 아니라 해결로 올린다. 지금은 「순차로 돌린다」로 피하고 있다
      - id: QA-11
        title: 단위 시험과 E2E 가 서로의 DB 를 다투지 않는다
        status: 구현
        proof: backend/tests/test_q_test_db_split.py
        note: |
          [실측 2026-09-26 · 차선 Q] **동시에 돌렸고 둘 다 초록이다.**
            단위 779 passed · 1 skipped (241초) · E2E 23 passed (173초) — **같은 순간에.**
            `DuplicateDatabase`/`ObjectInUse` **0건**. 도는 동안 DB 두 개가 나란히 있었다:
            `test_database_guardianx` · `test_database_guardianx_e2e` [psql 실측].
          ★ **회피가 해결이 됐다**(D-390). 지금까지의 「순차로 돌린다」는 사람의 기억을
            요구했고, 기억을 요구하는 규칙은 바쁜 날 깨진다(D-286). 이제 **실행 자체가**
            이름을 정한다 — `tests/e2e` 를 겨누면 `…_e2e`.
          ★ **고친 것은 코드 한 줄이 아니라 순서였다.** 처음에는 conftest 최상단에서
            `DB_TEST_NAME` 환경변수를 세웠는데 안 먹었다 — pytest-django 가 **먼저**
            `django.setup()` 을 부르고 그때 settings 가 이미 그 값을 읽어 버린다.
            그 실패는 로그에 안 나오고 **조용히 옛 이름으로 돌았다**(동시 실행 재현으로 잡았다).
            지금은 `django_db_modify_db_settings` 픽스처 — DB 를 만들기 직전에 불린다.
          ★ 그리고 **그 갈래를 살린 것은 `backend/pytest.ini` 의 존재**였다. ini 가 없으면
            rootdir 이 인자의 공통 조상(`tests/e2e`)이 되고, 그러면 `backend/conftest.py` 는
            그 위라 **아예 안 읽힌다** — 고친 코드가 조용히 안 도는 상태다.
            파일이 사라지면 시험이 말한다(`RootConfigIsPinnedTest`).
          ★ `DB_TEST_NAME` 을 사람이 준 실행에서는 그 값이 이긴다 — 차선마다 이름을 가르는
            P-18 의 길을 막지 않는다. xdist 워커 접미사도 지우지 않는다.

