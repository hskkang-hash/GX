            ③은 502 를 없애는 게 아니라 **더 드물게** 만든다. 드물어진 결함은 재현이 안 되고,
            재현 안 되는 결함은 **운영에서 처음 보인다.**

          다음 걸음: 재활용 시 유휴 keepalive 연결의 **우아한 배수(drain)** —
          gunicorn 이 나가기 전에 앞단에 「이 연결 그만 써라」를 말할 길이 있는가.
          설정으로는 여기까지였다.
          닫는 조건: **같은 부하(3,600 요청)에서 502 0건.**
          증거: docs/agent/evidence/OPS-13/proxy_502_opinion_20260905_TC.md

      - id: OPS-13b
        title: 앞단의 **재시도가 두 번에서 멈춘다** — 새어 나간 502 13건의 갈림길
        status: 미착수
        hand: in
        gate_missing_why: |
          고쳐서 502 가 주는지 **안 쟀다.** 앞단 `reload` 는 살아 있는 컨테이너를 만지는
          일이고, 이 자리에서 이미 두 번 「생각으로」 골랐다가 악화된 적이 있다.
          판정기는 고친 뒤 전/후를 재고 나서 단다.
        why: |
          ★ [실측 2026-09-07 · 턴 J · 차선 E] 새어 나간 502 **13건 전부**의
          `$upstream_addr` 이 `"172.18.0.6:8000, 172.18.0.6:8000, gx_app"` 로
          **한 글자도 다르지 않고**, 같은 순간 앞단이 `no live upstreams` 를 적었다.
          `upstream gx_app` 에 **같은 서버가 두 줄**이고 `proxy_next_upstream_tries`
          선언이 없어 nginx 는 **딱 두 번**만 시도한다 — 끊긴 연결을 연달아 둘 뽑으면
          **세 번째 기회가 없다.**
          이것이 「재시도 138건 중 125건 되살림 · **13건 새어 나감**」의 갈림길이고,
          SLA 가 약속한 5xx ≤ 0.1% 를 정본 **0.105%** 가 넘게 만드는 그 13건이다.
          ⚠ 뿌리는 뒷단이 아니다. 뒷단은 재활용을 예고하고 정상적으로 죽는다 —
            **앞단이 그 죽음을 두 번까지만 견딘다.**
          해소: `nginx/` 의 upstream 선언(`proxy_next_upstream_tries` · 서버 줄 수)을
            고치고 **전/후를 잰다.** `nginx/` 는 차선 E 소유가 아니라 제안만 남겼다.
