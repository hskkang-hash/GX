              (밀린 건수·쓰는 속도)에서 셈하고, 속도 0이면 「마지막 쓰기 이후」를 **하한**으로 적는다.
            ⚠ **이미 밀린 사흘은 못 되돌린다** — 그 행들은 요청 시각이 아니라 빠져나간 시각을 단다.
              이 신호는 재발만 막는다.

      - id: OPS-10
        title: 경보 발송처 (누구에게 · 어떤 경로로)
        status: 미착수
        gate: scripts/ops_alert_routing.py
        gate_why: |
          ⚠ **처음에 `verify_alarm_budget.py` 를 적었다가 P-85 검사에 걸렸다** — 그것은
          초록인데 이 절은 미착수라 「다 해 놓고 안 적었다」가 났다. 그 판정기는 QA-12
          (시험이 경보 건수를 내는가)를 재지 이 절(사람에게 도달하는가)을 재지 않는다.
          **초록인 게이트를 아무 절에나 달면 대장이 스스로를 부풀린다.**
          이 절의 판정기는 `ops_alert_routing.py` 이고 오늘 **빨강**이다 — 색이 맞다.
        note_turn_i: |
          [실측 2026-09-06 · 턴 I · 차선 E] **발송 경로와 운영 수신처는 다른 칸이다 — 갈라 적는다.**
            · **발송 경로 ✔** — `k2_notify/services.py::send()` 전 구간을 실제로 태웠다.
              mailpit 수신함에 한 통이 실재한다(id `7TqZLu6wm2eB1VI99IvnPB` ·
              `[GuardianX] 경고 — 저장 용량 임계` · `gx-alerts@` → `ops-duty@` · 총량 3→4).
              `DeliveryRecord` 120→121행 · id=361 `channel=email succeeded=True`.
              ★ **음성 대조군을 같이 냈다** — 허용목록 밖 주소는 **안 도착**(4→4)하고
                막힌 사유가 행에 남는다(id=362 `succeeded=False`). 무엇이든 초록으로
                만드는 측정이 아니라는 것을 그 한 건이 보인다.
            · **운영 수신처 ✗ 대표 대기** — 주소와 발송 업체. 변동 없음.
          ⚠ `ops_alert_routing` ④는 **여전히 빨강**(규칙 9줄 전부 `log`). 켜지 않았다 —
            켜면 개발 DB 의 사람 주소 30명(yopmail 24 · seed.invalid 6)에게 **진짜로 나간다.**
            그것을 막는 것은 `K2_SEND_ALLOWED_DOMAINS` 한 줄이고, 이름은 `.env.example` 에 섰다.
          그러므로 「경보 발송처 0」은 이 턴부터 **틀린 문장**이다. 옳은 문장:
            **경로는 섰고 수신처가 없다.**
        why: |
          감시는 exit 1 까지 만들었다. 그 1 을 **사람에게 보내는 자리**는 고객 환경마다 다르다.
          여기서 정하면 그 환경에서만 도는 감시가 된다. 설치 시 정한다.
          ★ [실측 2026-09-24 · 차선 E3] **표는 섰다 — 그리고 그 표가 빨갛다.**
            소속 4(ETRI-Group) critical: `fire_admin`/log 1명 · `operator`/log 12명 ·
            `view_only_-_anyang`/log 1명 · **`fire_user`/log 0명**.
            info·warning 등급은 **규칙 0건** — 아무에게도 안 간다.
            ★★ **모든 규칙의 채널이 `log` 다 — 사람에게 도달하는 경보 0건.**
            이것이 대표 결정 ①(알림 채널: 문자/카톡/앱)이 없으면 못 넘는 자리다.
            「발송처 표」는 세울 수 있었고 **세웠다**; 「사람에게 간다」는 아직이다.
          증거: docs/agent/evidence/OPS-10/ · scripts/ops_alert_routing.py

          ★ **[실측 2026-09-27 · 턴 B 차선 E] 「발송까지」 섰다 — 「수신」은 대기다.**
            세종 §5 대로 영실은 발송까지 세우고 멈춘다. 주소가 오면 캡처 한 장으로 닫는다.
            등급 전수 구멍을 메웠다: info **0 → 2건** · warning **0 → 3건** · 총 **4 → 9건**.
            새 명령 `manage.py seed_alert_routing`(`--channel` · 기본 `K2_ALERT_CHANNEL`).
            규칙 정체는 (등급·역할·구역)이라 **채널만 갈아끼운다** — 두 번 받는 일이 없다.
            시드 사람도 함께 갚았다: `fire_user` **0 → 1명** · critical 수신자 **14 → 15명**
            (조율자 재측 `verify_seed_roles` 컨테이너 exit 0 · 매핑 경고 0종).
          ★ **이메일 어댑터는 이미 있었다. 없던 것은 「설정됐는가」를 묻는 자리다** —
            `EMAIL_HOST_USER` 기본값이 `your-email@gmail.com` 이라 `getattr` 로는 **언제나
            「값이 있다」로 보였다.** 자리 표시자를 아는 `EmailChannel.configured()` /
            `deliverable()` 을 붙여 이제 **명확한 회색**을 낸다.
            **「값이 있다」와 「보낼 수 있다」는 다르다** — 기본값이 그 둘을 붙여 놓고 있었다.
          ★★ ⚠ **이번 턴에서 가장 중요한 발견 — 「수신 주소가 0개」가 아니었다.**
            규칙이 고르는 사람의 도메인을 실측하니 **yopmail.com 24 · org.kr 12 ·
            seed.invalid 6**. 채널을 `email` 로 켜는 순간 기존 **개발 계정 12명에게
            진짜로 메일이 나간다.** 그러므로 대표 주소를 넣는 것만으로는 안 된다 —
            **규칙이 고르는 역할을 먼저 좁혀야 한다.** 주소를 받기 전에 이것을 몰랐으면
            첫 발송이 곧 사고였다. 문자·카톡·앱 어댑터는 만들지 않았다(대표 결정 ① 대기).
          시험: `tests/test_e_ops10_alert_routing.py` **12 passed**(양성 대조 포함 —
          실값 SMTP 는 초록 · `log` 채널은 행은 남되 메일 0 · 채널 한 칸 바꾸면 실제로
          메일 물건이 만들어진다).

      - id: OPS-07
        title: 로그 수집·보존 기간
        status: 구현
        proof: scripts/ops_log_collectors.py
        why: |
          ★ [실측 2026-09-24 · 차선 E3] **회색이 빨강으로 갈렸다** — 재고 나서 알았다.
          수집기 6개 전수: 컨테이너 stdout 5개(gx-shell·postgres·redis·minio·gx-fe-build)가
          `json-file` 에 `max-size`·`max-file` **둘 다 없다 → 무한 적재.**
          파일 핸들러는 0개(`settings.LOGGING` 에 FileHandler 없음).
          보존 정책이 있는 것은 **DB 감사 로그 하나뿐**이다(90일 · beat `ops-audit-purge-daily`
          03:10 · 1,374행 · 3.5MB).
          ★ 「미측정」에서 「미착수」로 내려온 것이 이번 턴의 값이다 — 못 잰 것이 아니라
            **재 보니 없었다.** 남은 일은 재는 것이 아니라 **거는 것**이다.
          증거: docs/agent/evidence/OPS-07/

          ★ **[실측 2026-09-27 · 턴 B 차선 E] 걸었다 — 그리고 절은 아직 안 닫힌다.**
            `docker-compose.yml`·`docker-compose.stg.yml` **11개 서비스 전부**에 앵커
            하나(`x-gx-logging`)로 `json-file` + `max-size: 10m` / `max-file: 5`.
          ★ **보존 기간 [판정]: 컨테이너당 50MB 상한.** 근거는 총량÷가동기간 [실측] —
            postgres **363 KB/일** · redis 50 KB/일 · minio 2 KB/일 · gx-shell·gx-fe-build 0.
            50MB 는 가장 시끄러운 것에도 약 140일 치다.
            ★★ **그런데도 「N일 보존」이라고 적지 않는다.** `json-file` 회전은 **크기 기반**
              이라 약속할 수 있는 것은 상한이지 기간이 아니다. 시끄러운 하루가 오면 140일이
              14일이 된다. 그러므로 **감사에 답하는 정본은 DB 감사 로그(90일 · beat 실재)**
              이고 컨테이너 stdout 은 **단기 버퍼**다. 이 판정이 없으면 상한을 거는 일이
              곧 **증거를 지우는 일**이 된다.
          ★ `ops_log_collectors.py` 에 판정 **④ 선언**을 붙였다 — **적용**(도커
            `HostConfig.LogConfig`)과 **선언**(compose 파일)을 따로 읽어 셋으로 가른다.
            [실측 · 조율자 재측 exit 1]
              ② 적용: **여전히 빨강 5개** — `LogConfig` 는 컨테이너를 **만들 때 굳는다.**
              ④ 선언: **빨강 2개** — `postgres`·`gx-fe-build` 는 **compose 밖 `docker run`**
                 으로 떴다(떠 있는 다섯 중 compose 라벨은 minio 하나뿐). **compose 를
                 고쳐도 안 닿는다.** `--log-opt` 문장을 `RUNBOOK_로컬기동.md` STEP 2A 에
                 넣었고, 이 빨강은 **다음에 그 컨테이너를 띄우는 사람**이 지운다.
              gx-shell·redis·minio 3개는 「**선언은 섰고 적용은 다음 재기동**」이다.
          ⚠ **컨테이너를 하나도 재기동하지 않았다** — 다른 차선 셋이 그 위에서 동시에
            일하고 있었다. 판정기가 정할 일이 아니다(조율자 판정).
            **「선언이 섰다」를 「보존이 걸렸다」로 적지 않는다** — 그래서 이 절은 넘긴다.
        note_closed: |
          ★★ **[실측 2026-09-05 · 턴 F] 걸었고 · 적용을 쟀고 · 잔재를 치웠다 — 그리고
            남은 하나를 이 절에서 떼어 냈다(OPS-07b).**
            ㉠ **재기동 창(P-63)을 집행**해 상한 없던 다섯(`gx-shell`·`postgres`·`redis`·
              `minio`·`gx-fe-build`)을 다시 만들었다 → **9/9 컨테이너 전부**
              `max-size=10m`/`max-file=5`. **compose 파일이 아니라 도커에게 물어 확인**했다.
            ㉡ 앞단 접근로그가 **파일을 떠났다** — `access_log /dev/stdout` reload 뒤
              파일이 **6,612,367 바이트에서 멈추고** 접근 줄이 `docker logs` 에 나온다.
            ㉢ **판정기가 틀린 수를 적고 있었다**: 창의 시작을 「파일의 마지막 줄 − 60분」으로
              잡아 **이미 멈춘 파일이 189바이트/시간을 내고** 있었다. 창을 「지금 − 60분」으로
              고쳤다. 그리고 색을 **지우지 않고 옮겼다** — ②는 「자라는가」만 묻고, 멈춘 잔재는
              **새 판정 ⑤**가 빨갛게 센다. 둘이 함께 초록이 되는 길은 파일을 치우는 것 하나다.
            ㉣ 치우기 전에 **증거인지 물었다** — gzip 보관 + md5 일치 확인 뒤 제거.
              앞단 `/api/v1/health` 200 · 컨테이너 재생성 없음.
              **그 파일이 아니었으면 LAW-05 의 5xx 실측(0.0776%)을 못 냈다.**
            ㉤ 꼬리말의 「선언할 자리조차 없는 3개」가 ④와 어긋나 「빨강 3개」라고 말하고
              있었다 — 지금은 「선언 없음 · **상한은 걸림** · 빨강 아님 · 경고」로 나간다.
            지금 판정: ① 수집기 10개 전수 OK · ② 보존 기간 — **DB 감사 로그 하나만 남았고
            그것은 OPS-07b 로 뗐다** · ③ 자라는 속도 OK · ④ 선언 OK · ⑤ 멈춘 잔재 OK.
            증거: `docs/agent/evidence/OPS-07/멈춘_파일_정리.md`


      - id: OPS-07b
        title: DB 감사 로그 보존 — 보존 일수를 **선언하고** 파기가 되돌릴 수 있어야 한다
        status: 구현
        gate: scripts/verify_purge.py
        proof: backend/tests/test_be_purge.py
        hand: in
        why: |
          ★★ [실측 2026-09-05 · 턴 F 차선 E] **판정기가 적던 「보존 90일이 선언돼 있고」가
            거짓이었다.** 재고 나서 알았다:
            ㉠ 표시값 탐침 → `AdminConfig::System` 에 `security.audit_log_retention_days` 가
              **없다.** 90은 `purge_old_audit_logs` 의 **코드 기본값**이다 — 아무도 정하지 않았다.
            ㉡ dj-core 의 그 태스크는 `_base_manager` 의 평범한 `QuerySet.delete()` 를 쓴다 →
              **하드 삭제**(safedelete 정책 밖).
          즉 지금 beat 항목을 켜면 **아무도 정하지 않은 수로 감사 기록을 되돌릴 수 없게 지운다.**
          그래서 「스위치만 켜면 초록」이 **더 이상 안 되도록** 판정기 자기시험에 양성 표본을 박았다.
          여는 조건 셋(순서가 곧 내용이다): ① `System.security.audit_log_retention_days` 를
          **선언한다**(수는 세종·대표 판정) ② `verify_purge.py` 초록 ③ **그 다음에** beat 항목을 켠다.
          ⚠ 감사 로그는 4,624행 · 11.0MB 로 자라고 있다 — 여는 것이 늦으면 상한 없는 표가 된다.
        note_turn_g: |
          ★ [실측 2026-09-06 · 턴 G 차선 E · 세종 P-67] **여는 조건 ①②를 갚았다. ③은 사람의 몫으로 남는다.**
            ① **선언했다** — `scripts/seed_retention_declaration.py --apply` 로
              `AdminConfig::System > security.audit_log_retention_days = 365` 를 **그 자리에** 심었다
              (dj-core 가 읽는 자리 하나. 우리 쪽 `settings` 에 적어 두면 우리는 365로 판정하고
              dj-core 는 90으로 지운다 — 그 갈림이 D-369 다). 되돌리기 `--unseed`.
            ② **미선언이면 안 부른다** — `ops_audit_purge_beat` 가 선언을 먼저 묻고, 없으면
              dj-core 태스크를 **호출 0** 으로 두고 `SKIPPED_UNDECLARED` 를 증거에 남긴다.
              판정기 `scripts/verify_retention_declared.py` ②가 그 호출 수를 센다(exit 0).
            실제로 한 번 불렀다: `{"verdict":"OK","retention_days":365,"rows_before":7371,
            "rows_after":7371,"purged":0}` — 만료 행이 없어 **0건**이고 그것이 옳은 결과다.
          ⚠ ③ **beat 항목은 여전히 꺼져 있다**(`enabled=false`). 켜는 시각은 사람이 정한다 —
            시각만 코드 선언대로 03:10 → 02:40 으로 옮겼고 `enabled` 는 안 건드렸다.
          ⚠ 낡은 항목 `purge-audit-logs-daily`(dj-core 태스크 직접 호출)는 **우리 감싸개를 우회한다.**
            켜지 말고 지우는 것이 옳다 — 지우는 판단은 조율자의 것이라 손대지 않았다.
          증거: docs/agent/evidence/OPS-07b/감사로그_보존_선언.md
        note_turn_h: |
          ★★ [실측 2026-09-06 · 턴 H · 차선 E] **남은 하나 「되돌림」을 갚았다. 절이 닫힌다.**
            제목이 요구한 둘은 이제 둘 다 선다: **선언했고**(턴 G) **되돌릴 수 있다**(이번 턴).
            ㉠ **되돌림 저널** — `backend/common/audit_purge_journal.py`(신규).
              `ops_audit_purge_beat` 은 dj-core 를 부르기 **전에** 지워질 행을
              `django.core.serializers` 로 뜬다(pk 보존 · `save_base(raw=True)` 라
              `auto_now_add` 인 `create_datetime` 이 다시 안 찍힌다). sha256 곁파일을 붙인다.
            ㉡ **되돌릴 수 없으면 지우지 않는다** — 저널을 못 뜨면 dj-core 를 **호출 0** 으로
              두고 `SKIPPED_UNREVERSIBLE` 을 낸다. 저널 자리가 **붙은 볼륨이 아니어도** 안 지운다
              (컨테이너 루트에 떨어진 저널은 재생성 한 번에 사라지고, 그 전까지 「되돌릴 수
              있다」가 초록으로 보인다 — OPS-12a 의 착시와 같은 모양).
            ㉢ **실측 한 바퀴** — `scripts/ops_audit_purge_undo.py --drill` · exit **0**:
              심음 3행(pk 158788·158791·158792 · create_datetime 2025-08-30) →
              **제품의 태스크가** 파기(`verdict=OK` · 3건 · 하드 삭제 확인 0행 남음) →
              저널 `/backup/audit_purge_journal/audit_purge_20260906T102805Z.json` 로
              되돌림 3/3행 → **직렬화 지문 sha256 동일**(pk 만 견주면 다시 쓰기와 구별 못 한다) →
              심은 표본 하드 삭제로 치움. 저널은 **다른 컨테이너**(alpine)에서 4,908바이트로 읽혔다.
            ㉣ **음성 대조군** — `/backup` 이 안 붙은 `gx-shell` 에서 같은 태스크를 부르니
              `SKIPPED_UNREVERSIBLE` · **purged 0** · 표 20,345 → 20,345 [실측].
              즉 **지금 이 기계의 워커에서는 켜도 한 행도 안 지운다** — 그것이 옳은 상태다.
            시험 5갈래를 `test_be_purge.py::AuditPurgeIsReversibleTest` 에 박았다(왕복 ·
              변조된 저널 거부 · 0건인 날 빈 파일 안 만듦 · 미선언 자리 · 볼륨 아닌 자리).
          ⚠ **여전히 못 넘은 것 — 지우지 않는다**
            - beat 항목 `ops-audit-purge-daily` 는 **꺼진 채다**(`enabled=false`). 켜는 시각은
              사람이 정한다. 지금 켜도 `/backup` 이 워커에 안 붙어 있어 **호출 0** 이다.
            - 낡은 항목 `purge-audit-logs-daily`(dj-core 태스크 직접 호출)는 **우리 감싸개를
              우회한다** — 켜지면 저널 없이 하드 삭제가 돈다. 지우는 판단은 조율자의 것이다.
            - 저널은 **평문 JSON** 이고 감사 로그의 사용자명·IP 가 들어 있다 —
              그 볼륨은 백업과 같은 취급을 받아야 한다(D-204).
            - 저널이 사는 볼륨은 **같은 기계** 안이다(OPS-12a 미완). 기계가 타면 저널도 탄다.
          증거: docs/agent/evidence/OPS-07b/파기_되돌림_실측.md ·
                docs/agent/evidence/OPS-07b/undo_drill_last.json

      - id: OPS-17
        title: 배치는 절차가 아니라 **명령 하나**다 — 빌드→배치→번들 신원→걷기 · 실패하면 되돌린다
        status: 구현
        proof: scripts/deploy.sh
        hand: in
        note_closed: |
          ★★ [실측 2026-09-05 · 턴 F 차선 Q · 세종 P-64] 이 절이 태어난 자리: 턴 E 에
            **09-04 07:17 자 낡은 번들이 하루 동안 서비스되고 있었다.** 배치가 손 절차
            (RUNBOOK STEP 2C)였고 그 절차의 한 줄을 빠뜨린 결과다. 그 사이 찍힌 화면 증거
            24장은 전부 낡은 번들의 증거였다. **「빌드했다」와 「서비스된다」 사이에 게이트가 선다.**
          `scripts/deploy.sh` 하나 — 빌드 → 다이제스트 → **원자적 배치** → 번들 해시 게이트
            (서버가 내는 번들 == HEAD) → `walk_scenarios` 1회 → 실패 시 exit 1.
            `verify_bundle_hash.py`·`walk_scenarios.py` 를 **재사용**한다(두 벌을 두지 않는다).
            `--self-test` 12갈래 통과. RUNBOOK STEP 2C 는 이 한 줄로 대체됐다.
          **다섯 번 돌려 다섯 번 배웠다** [실측]:
            1회 exit 1 — 게이트 통과·걷기 실패 → **되돌렸고 3002 가 이전 번들을 냈다**(함정 ③ 실증)
            2회 exit 1 — `rm: Directory not empty` 로 **자리를 안 바꿈**(이전 번들 그대로 섬)
            3회 exit 1 — **되돌리기 자체가 깨졌다**(빈 폴더·3002 404) → 복사 기반 백업·복원 + 검증으로 고침
            4회 exit 1 — **더러운 작업본 차단이 실제로 걸렸다**(다른 차선이 `frontend/src` 를 고치는 중)
            5회 exit 0 — 배치 + 번들 해시 게이트 통과
          ★ **이 윈도 마운트에서 폴더 이름 바꾸기는 못 믿는다**를 사고로 배웠다 —
            지금은 ㉠복사 백업(못 뜨면 배치 안 함) ㉡`index.html` 실재 확인 ㉢복사로 수리.
            리눅스 스테이징에서는 필요 없지만 **재기 전에 지우지 않는다**.
          ★ 부수로 `walk_scenarios` 의 걸음표 기대 둘이 **09-04 번들 기준으로 낡아 거짓 빨강**을
            내고 있었다(1/3 → **3/3**). 콘솔의 자원 실패 줄에 URL 이 없어 분류가 불가능하던 것도
            고쳤다 — 「URL 없는 404 는 분류되지 않는다」를 자기시험에 박았다.
          ⚠ `package.json` 이 host 와 빌드 컨테이너에서 **다르다**(`5902f8bb…` ≠ `ef2e4b32…`).
            `deploy.sh` 는 말해 줄 뿐 `npm install` 을 안 한다 — 의존성이 바뀐 턴의 사고 후보.

      - id: OPS-19
        title: 백업이 **주기로 돈다** — 손으로 뜬 덤프는 RPO 가 아니다
        status: 미착수
        hand: in
        gate_missing_why: |
