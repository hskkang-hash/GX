          초록인 게이트 때문에 이 절이 「다 해 놓고 안 적었다」로 읽힌다(조율자가 턴 I 에
          실제로 그렇게 적었다가 P-85 검사에 걸렸다). 필요한 판정기는
          「마지막 자동 덤프의 나이 < 주기 + 여유」를 재는 것이고, 그것은
          `gx-celery-e` 에 마운트가 붙은 뒤에야 초록이 될 수 있다.
        note_turn_i: |
