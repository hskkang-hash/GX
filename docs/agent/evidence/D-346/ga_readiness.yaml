          ★★ **지우자 세 번째 모듈이 드러났다** [실측 2026-09-26]. 잠자는 기능 게이트가
            바로 잡았다: `stream_monitors/tasks/record_task.py::start_recording`·`stop_recording`
            이 **새로 잠들었다** — 지운 두 모듈이 그 클래스의 **유일한 사용처**였다.
            `RecordingTask` 를 부르는 곳은 이제 backend 전체에 0곳이고, 살아 있는
