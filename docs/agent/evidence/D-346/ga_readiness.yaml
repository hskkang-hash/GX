      - id: OPS-13
        title: 배포 앞단 이중방어 (리버스 프록시)
        status: 구현
        proof: scripts/ops_front_line.py
        note_closed: |
          ★ **닫혔다 [실측 2026-09-05 · 턴 C 차선 E]** — `gx-gunicorn-e`(워커4×스레드4) +
          `gx-nginx-e`(8500). **새 컨테이너 둘**로 세웠다: 떠 있던 다섯을 재기동하지 않았다
          (다른 차선 셋이 그 위에서 동시에 일하고 있었다).
          **두 번째 방어선 실측**: `ops_front_line.py --probe` **exit 0 · 18갈래** —
          익명 14자리(§0.4 경로 7 × 슬래시 변형) 전부 401 · 키 기본값 거절 2 ·
          양성 대조 1 · 음성 대조(`/_front/health` 200) 1.
          ★ **앞단 401 과 뒷단 401 을 본문의 `(front line)` 표식으로 갈랐다** —
            구별 못 하면 **뒷단이 죽어도 앞단이 401 을 내주어 거짓 초록**이 난다.
          ★ 관문 설정을 `common/access_gate.py` 목록에서 **생성한다** — 두 벌로 적으면
            앞단이 낡고, 낡은 앞단은 있는 줄 알았던 방어선이 없는 상태다.
          미들웨어 순서 시험을 앞단까지 넓혔다(`FrontLineIsTheSecondDefenseTest` 5갈래 ·
          `test_access_gate.py` 23 passed).

          ★★ **앞단이 뒷단 결함 둘을 드러냈다 — runserver 에서는 안 보이던 것이다:**
            ① `nginx -t` 가 기동을 거부해 잘못된 조건식을 잡았다(조용히 통과시키지 않았다).
            ② **`gunicorn.conf.py` 의 `keepalive = 2`** — nginx 가 60초 쥔 연결을 뒷단이
               2초에 끊어 **502**. `keepalive 75` + `Connection ""` 로 **6건 → 3건**.
            ★ 「앞단을 세운다」가 곧 「뒷단을 처음으로 제대로 두드린다」였다.

          ⚠ **남은 502 3건(0.083%)은 닫지 않았다 — `OPS-13a` 로 등재했다.**
            0.083% 는 작아 보이지만 **재난 경보에서 1,000건에 1건이 조용히 사라진다**는 뜻이다.
        why: |
          ★ [D-361 · 판정: **건다. 다만 지금이 아니다**] 원칙은 하나 —
            **단일 방어선은 방어선이 아니다.** 미들웨어는 코드이고, 코드는 리팩터링
            중에 순서가 바뀐다. 앞단은 그때 남는다.
          지금이 아닌 이유: 앞단 구성은 배포 문서 작업의 일부이고, 그 구성을 실측하지
          않은 채 규칙만 적으면 **문서가 거짓말을 시작한다**(D-286).
          해소: 배포 구성 작업에서 함께 세우고, 그때 미들웨어 순서 시험
          (test_access_gate.py::GateIsOutsideTheCacheTest)을 앞단까지 넓힌다.
          ★ 이 절이 여기 **등재된 것 자체**가 D-361 의 이행이다 — 판정을 받고
            안 한 것과, 판정을 받고 자리에 적어 둔 것은 다르다.

          ★★ **닫는 조건이 하나 늘었다 [2026-09-27 · 조율자 · 턴 B]:**
            이 절을 닫는 사람은 앞단이 선 뒤에 **`python scripts/verify_perf_budget.py` 를
            그 앞단에 대고 한 번 돌려야 한다.** 모드는 `Server:` 헤더로 저절로
            **합격선**으로 갈리고, 그 순간 지금 기록으로만 남아 있는 두 자리가 **빨강**이 된다:
            **F05** 524.7ms > 500ms · **STATUS** 363.3ms > 300ms
            (`docs/agent/evidence/PERF-04/budget.json` 의 `pending_acceptance`).
            ★ 왜 여기 적나 — PERF-04 가 지금 「기준선으로 초록」인 것은 **세종 P-34 의
              판정이지 예산을 지켰다는 뜻이 아니다.** 그 구별은 시간이 지나면 흐려진다.
              흐려지지 않게 하는 유일한 방법은 **다음 사람이 반드시 지나는 자리에 적어
              두는 것**이고, 그 자리가 OPS-13 이다. PERF-04 와 이 절은 **함께 색을 얻는다.**
          ★ [2026-09-05 TC] 그렇게 됐다 — 앞단이 서자 게이트가 `Server: nginx` 를 보고
            **저절로 합격선 모드**로 갈렸고, `pending_acceptance` 는 빈 목록이 됐다.

      # ── OPS-13a (2026-09-05 TC 신설 · 분모 128 → 129) ─────────────────────
