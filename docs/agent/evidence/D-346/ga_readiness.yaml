      # ★ D-394 — **잠자는 기능 전수가 낸 첫 제품 절.** 코드는 다 있고 꺼져 있다
      - id: UX-08
        title: 관제 화면 실시간 탐지 알림 (WebSocket 브로드캐스트)
        status: 구현
        proof: backend/tests/test_c2_realtime_ping.py
        note_closed: |
          [실측 2026-09-05 · 턴 D 차선 C2] **운영 설정의 redis 레이어**로 두드림 왕복을 쟀다.
            고치기 전에 **빨강 넷을 먼저 냈다**(수신기를 임시로 떼고 잰 뒤 되돌림) — 빨강 넷이 전부
            양성 쪽이고 부작위 넷은 초록으로 남았다. **「아무것도 안 하는 배선」이 부작위만으로는
            통과한다**는 대조가 그렇게 남았다.
            ★★★ **꺼진 스위치가 그 전등의 스위치가 아니었다**(턴 C 가 넘긴 그 미지의 답).
              두드림을 부르는 곳이 **단 하나**(gRPC 배선)였고, `record_detection` 을 부르는 다른
              경로 — **카메라 군집 두절(OPS-15)** 과 검수 시드 — 로 태어난 이벤트는 화면을
              **한 번도 두드리지 않았다.** 재난 징후인데 관제 화면이 조용했다.
              고침: 두드림을 갈래가 아니라 **`DetectionEvent` 의 탄생**에 매달고
              `transaction.on_commit` 뒤로 미뤘다(커밋 전 두드림은 화면이 없는 행을 보러 가게 한다).
            ★ 받는 쪽을 먼저 세우고 보내는 쪽을 켰다 — 핸들러 없이 켰으면 그 방의 세션이 다 끊긴다.
            ⚠ **브라우저 ↔ 소켓 왕복은 못 쟀다.** 레이어가 돌고 방으로 두드림이 가는 것까지가 실측이다.
        why: |
          [실측 2026-09-14 · D-394] **코드는 있고 두 겹으로 꺼져 있다.**
            ① `backend/surveillance/signals.py` 의 `@receiver(post_save, sender=VideoAnalysis)`
               가 **주석**이다
            ② `surveillance/apps.py::SurveillanceConfig` 에 `ready()` 가 없어
               **signals 모듈을 아무도 import 하지 않는다** — 주석을 풀어도 안 돈다
          그리고 크기가 여기 있다: `SurveillanceDashboardService.broadcast_detection_message`
          를 부르는 **운영 코드는 그 시그널 한 자리뿐**이다 (1507줄은 docstring 안의 예시다).
          → **새 탐지가 저장돼도 관제 화면으로 가는 알림이 한 번도 발화하지 않는다.**
            당직자에게는 「새 이벤트가 안 뜬다」로 보인다 (D-378).

          ★ 「잠김」이 아니라 「미착수」다 — 우리가 하면 되는 일이다. 다만 **한 줄 주석 해제가
            아니다**: `post_save` 마다 브로드캐스트를 쏘는 것은 D-369 가 다룬 **폭주 경로**이고,
            재난 때 그대로 채널 레이어를 때린다. 켜려면 **큐잉 · 같은 (모델,pk) 접기**를
            함께 얹어야 한다. 그것은 켜기가 아니라 설계이므로 세종의 판정을 기다린다.

          ★★ **[실측 2026-09-05 · 턴 C 차선 C] 겹이 둘이 아니라 셋이었다 — 그리고 셋째가
            이 절의 진짜 크기다.**
            ⓪ `consumers.py` 에 `detection_message` 핸들러가 **없다** — 핸들러 없는 `type`
               으로 그룹에 쏘면 Channels 가 **그 그룹의 모든 관제 세션을 끊는다.**
               두 겹만 믿고 켰으면 「알림이 안 온다」가 아니라 **「화면이 다 떨어진다」**가 났다.
            ★★★ 그리고 정본이 못 본 것: **잠자던 시그널은 `VideoAnalysis` 에 붙어 있고,
              관제 화면이 읽는 것은 `DetectionEvent` 다.** 두 겹을 다 풀어도 **관제 화면에는
              한 장도 안 붙는다.** 「꺼져 있다」를 「켜면 된다」로 읽은 것이 이 절의 착시였다 —
              **꺼진 스위치가 그 전등의 스위치인지는 따로 확인해야 한다.**
            → 그래서 두드림을 `detection_event_bridge.publish_detections` 끝에 얹었고,
              화면은 `useDetectionPing` 으로 목록을 다시 읽는다.
            ★ F-04 와 안 부딪힌다: 나가는 것은 **카드가 아니라 신호 하나**다 — 무엇이 한
              장인지(5분 창·알림 억제)는 **서버 목록 문 한 곳**이 그대로 정한다.
              폭주는 3초 창으로 **합친다**(억제가 아니다 — 합쳐진 사이에 늘어난 것도
              다음 두드림에 함께 온다).
            ⚠ **넘긴다 — 「새로고침 없이 카드가 붙는다」를 못 봤다.** WS 인증이 세션 기반
              (`AuthMiddlewareStack`)이라 JWT 만 든 SPA 가 붙는지 **[미확인]** 이다.
              그래서 **주기 갱신 15초를 바닥으로 남겼다** — 소켓을 바닥으로 삼으면
              안 붙는 날 화면이 **조용히** 멈춘다. 조용한 멈춤이 이 제품의 최악이다.

