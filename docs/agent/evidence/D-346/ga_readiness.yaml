          ★★ **[실측 2026-09-06 · 턴 I · 차선 S] 193 그대로. 갚은 것은 수가 아니라 술어다.**
            잠금 `SEC11A_REMAINDER_MEASURED_TOO_THIN` 이 요구한 ①(닫는 조건의 술어를
            **캡처 교집합 → 프런트 원본 교집합**으로)을 이번 턴에 갚았다 [실측]:
