      - id: OPS-14
        title: 생존 알림 — 매일 08:00 (dead man's switch)
        status: 구현
        proof: backend/tests/test_q_heartbeat_digest.py
        origin: PRD-2.5
        note: |
          [실측 2026-09-24 · 차선 Q 16 passed + 조율자 배선] 함수는 차선이 세우고
          **주기는 조율자가 걸었다** — `beat_schedule["ops14-heartbeat-digest"]`
          (crontab 08:00) · `common.heartbeat_digest_beat`.
          ★ 등록만 확인하지 않고 **한 번 돌렸다**: `{"sent": 1, "no_recipients": 9}`.
            수신자 0명인 테넌트 9개를 **조용히 넘기지 않고 수로** 남긴다 —
            「보냈는데 대상이 없었다」가 성공으로 보이는 것이 가장 조용한 고장이다.
          ★ 이 절의 값은 발송이 아니라 **부재의 신호**다: 안 오면 장애다.
            그 규약이 매뉴얼 첫 쪽에 있어야 신호가 신호가 된다.
          ★ 격리: `group=` 은 테넌트를 고르는 손잡이가 아니다 — 사람이 남의 group 을
            가리키면 `NotifyPermissionDenied`. 이 문지기는 선등록이 경고한 반출을
            **실제로** 막았다(`services._owner_for`).
        why: |
          [실측 2026-09-24 등재] 서버 1대다. 죽으면 탐지도 알림도 멈추는데
          **침묵과 정상이 같은 모양**이다 — 지금 그 둘을 가르는 발송이 0건이다.
          매일 08:00 U5 에게 「정상 · 어제 이벤트 N · 카메라 맥박 N/N」 1통.
          **안 오면 장애다** — 이 규약을 매뉴얼 첫 쪽에 적는다.

      - id: OPS-15
        title: 카메라 맥박 군집 두절 (구역 3중 2 · 5분) → `camera_cluster_down`
        status: 구현
        proof: scripts/verify_camera_pulse.py
        origin: PRD-2.5
        note: |
          [실측 2026-09-24 · 차선 Q 18 passed · 판정기 exit 0]
            3중 2 두절 → 이벤트 **1건** · **1대만 두절 → 0건** · 따로 죽은 2대 → **0건**.
          ★ **초록의 절반이 부작위다**(지시서 §3-3): 「2대가 죽어 있다」와 「2대가 **함께**
            죽었다」는 다르다. 한 달 전 고장 옆에서 오늘 한 대가 끊긴 것을 재난 징후라고
            말하면 그 말은 틀렸다 — 창(5분) 판정이 그것을 가른다.
          ★ **조율자가 병합에서 잡은 것**: 칸과 규칙과 판정기는 섰는데
            **맥박을 채우는 호출이 0곳**이었다. 시험은 스스로 맥박을 심어서 전부 초록이었고,
            운영에서는 `last_frame_at` 이 영원히 `None` 이라 규칙이 **0건만 내는 잠자는
            기능**이 될 뻔했다(D-377). `_publish_detection_events` 첫머리에
            **검출 유무와 무관하게** 적도록 이었고, 부작위 시험을 박았다
            (`PulseIsFedByThePipelineTest` — 검출 0건 콜백도 맥박이다).
            주기는 `beat_schedule["ops15-camera-pulse-scan"]` 1분(창이 5분이라 5분 주기면
            창 하나를 통째로 놓친다).
          ★ **정직 고지**: 판정기의 초록은 **합성 구역** 위에서 났다 — 개발 DB 에 카메라
            3대 이상인 활성 구역이 **0개**다. 판정기 `[입력]` 줄에 「구역 출처」 칸이 있어
            시드가 구역을 심으면 그 값이 바뀐다. 합성으로 낸 초록을 시드의 초록처럼
            보고하지 않으려고 그 칸을 만들었다.
          ★ **F-08 을 구현으로 바꾸지 않는다** — F-08 은 SDN 링크 상태이고 손 밖에 그대로 있다.
            이것은 새 절이고, F-08 이 열리면 이 시험이 재사용된다.
        why: |
          [실측 2026-09-24 등재] D-415 의 `cameras_silent_24h` 는 「조용함」과 「죽음」을 못 가른다
          (onboarding_48 U1#3 에 그렇게 적혀 있다). 맥박 칸(`last_frame_at`)이 그 둘을 가른다.
          단일 카메라 죽음은 **시스템 이벤트**(운영), 군집 죽음은 **재난 징후**(관제) — 다른 화면에 간다.
          ★ 초록의 절반은 **단일 두절에서 0건**이다(부작위 · 지시서 §3-3).
          ★ 정직 고지: 이것은 F-08 을 「구현」으로 바꾸지 않는다 — F-08 은 SDN 링크 상태이고
            그 절은 손 밖에 그대로 있다. 이것은 **새 절**이고, F-08 이 열리면 시험이 재사용된다.

