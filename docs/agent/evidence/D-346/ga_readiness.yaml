          `authz_path_permission` 0건. 남은 수를 이름으로 적는다 — 「대부분」이라 적지 않는다.

          ★★ **[실측 2026-09-27 · 턴 B 차선 S] 접두 셋 승격 — 248 → 224.** 갚은 것 **24건**.
            (조율자 재측: 신선본 인벤토리의 `authz_envelope` = **224**.)
