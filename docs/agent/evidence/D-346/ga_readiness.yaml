      - id: LAW-06b
        title: AI기본법 5의무 — **자기평가서 서명 · 법률 대조** (제품 밖)
        status: 미착수
        hand: out
        hand_why: |
          대표 서명과 법무 대조가 필요하다 — 조건이 성립하면 손 안으로 옮긴다.
        why: |
          ★ [P-54 · 2026-09-05] LAW-06 을 쪼갠 뒷조각이다. **자리표가 선 것과 의무를 다한 것은
          다른 사실이고**, 뒤엣것은 코드가 낼 수 있는 것이 아니다 — 서명하는 사람과 법률 대조가 있어야 한다.
          쪼개지 않고 한 칸에 두면 「제품이 다 했다」와 「아직 서명 전이다」가 같은 색이 된다.
          ★ [2026-09-06 · 턴 G · 세종] **자기평가서 초안을 썼다** —
            `docs/design/GX-LAW-06b_AI기본법_자기평가서_초안_v0.1.md`. 다섯 의무의 자기평가(① 충족
            ② 충족 ③ 충족 ④ 충족 ⑤ **미충족** — AI 모델 기술문서가 없다)와 **서명란**까지 만들었다.
            **상태는 그대로 미착수(손 밖)다** — 서명 전의 자기평가서는 자기평가서가 아니라 초안이고,
            초안을 「구현」으로 세면 **서명 없이 법을 지킨 것처럼 보인다.**
            남은 일은 **대표 서명 한 장과 법률 대조**이고, 문서는 그 한 장만 남기도록 써 두었다.
