      - id: SEC-18
        title: 보안 설정의 **기본값이 닫힌 쪽**이다 — 잊은 사람을 벌하지 않는다
        status: 미착수
        gate: scripts/verify_settings_fail_closed.py
        hand: in
        proof: scripts/verify_settings_fail_closed.py
        why: |
          ★ **이 절은 턴 G 에 `SEC-14` 로 태어났다가 턴 H 에 이름을 바꿨다**(P-81).
            그 id 는 이미 「익명 반출 0건」이 쓰고 있었고, **대장이 조용히 덮였다** —
            `verify_ga_readiness` 가 중복 id 를 안 봤기 때문이다. 세종·영실 둘 다 못 봤고
            게이트가 봤어야 했다. 이번 턴에 중복 id 검사를 넣었다(exit 1).
          [실측 2026-09-06 · 차선 V 가 떠 있는 서버의 settings 를 읽어 발견 · 조율자 재확인]
          `backend/config/settings.py` 의 넷이 **아무 선언 없이 뜨면 가장 열린 쪽**으로 선다:
            :28 `SECRET_KEY = env(…, default="your-secret-key-here")`  ← 저장소에 적힌 서명 키
            :31 `DEBUG = env.bool("DJANGO_DEBUG", default=True)`       ← 트레이스백이 나간다
            :34 `ALLOWED_HOSTS = ["*"]`                                ← 어떤 Host 든 받는다
            :45,47 `CSRF_COOKIE_SECURE`·`SESSION_COOKIE_SECURE` 가 **주석**  ← 평문 쿠키
          ★ **이 절이 왜 이제야 등재되나** — 이 넷을 보는 판정기가 저장소에 0건이었다
            (`scripts/`·`backend/tests/` 전수). 세는 자리가 없으면 결함은 나이를 안 먹는다.
            등재는 **분모를 138 → 139 로 늘린다.** 수가 내려가는 것이 옳다 —
            내려간 수가 더 참이다(D-420 과 같은 문장).
          ★ 이것은 P-67 과 **같은 원칙**이다: 「기본값은 없다. 선언만 있다」.
            보존 일수에 대해 이번 턴에 세운 그 원칙을 보안 설정이 아직 안 지킨다.
          닫는 조건: `verify_settings_fail_closed.py` 가 exit 0 — 다섯 수 전부.
            지금 **5/5 빨강**이고, 자기시험은 초록이다(양성 대조 1 · 변이 5/5 · 빈 소스 빨강).
          ⚠ **이번 턴에 안 고친 사유(회피가 아니라 순서)**: `SECRET_KEY` 의 기본값을 지우면
            `DJANGO_SECRET_KEY` 가 없는 지금 컨테이너들은 **settings 를 읽는 순간 죽는다**.
            `DEBUG=False`·`ALLOWED_HOSTS=[]` 도 같다 — 손으로 만든 `gx-shell`·`gx-gunicorn-e` 는
            compose 를 안 물고 있어 환경을 **재생성해야** 받는다(차선 E 의 `/backup` 과 같은 벽).
            그래서 **선언을 먼저 세우고 기본값을 지운다** — P-67 이 밟은 순서 그대로이며,
            그 순서를 뒤집으면 개발 환경 전체가 뜨지 않는다.
          다음 턴 첫 일: ① 개발·스테이징 선언(`DJANGO_SECRET_KEY`·`DJANGO_DEBUG`·
            `DJANGO_ALLOWED_HOSTS`)을 재기동 창에서 환경에 심는다 ② 코드 기본값 넷을 지운다
            ③ 이 판정기를 게이트 목록에 넣어 되돌아오지 못하게 한다.

          ★★ **[실측 2026-09-06 · 턴 H · 차선 S] 절반을 세웠다 — 운영 프로필과 그 판정기.**
            · `backend/config/settings_prod.py` (P-75). 개발 프로필을 **import 해서 덮는다** —
              개발 값은 한 자도 안 지웠다(지우면 `DJANGO_SECRET_KEY` 가 없는 지금 컨테이너들이
              settings 를 읽는 순간 죽는다 · §4 함정 ①).
            · 실제로 띄워 본 결과 [실측 · `gx-shell`]:
                선언 넷을 다 준 판  → **떴다** (`django.setup()` 까지 · DEBUG False ·
                  ALLOWED_HOSTS 선언대로 · 쿠키 여섯 닫힘 · HSTS 31536000 · 프록시 머리글자)
                선언을 뺀 판        → **기동 거부** (`ImproperlyConfigured` · rc=1)
                `DJANGO_DEBUG=true` → **여전히 False** (환경변수로 못 켠다)
            · 게이트 `scripts/verify_prod_settings.py` **5/5 초록** [실측] —
              다섯 수마다 **음성 대조를 실제로 띄워서** 보인다(9판: 양성 1 · 거부 6 ·
              DEBUG 대조 1 · 개발 프로필 대조 1). 자기시험 + 출생 표본(그날의 다섯 줄) 포함.
            · `scripts/deploy.sh` 에 프로필 관문 — 개발 프로필로 스테이징·운영을 열려 하면
              **배치 거부(exit 1)** · prod 프로필이면 이 게이트 5/5 를 먼저 잰다.
          ⚠ **닫는 조건은 그대로다** — 이 절이 묻는 것은 「개발 소스가 아무 선언 없이 뜨면
            무엇이 되는가」이고, 그것은 아직 **5/5 빨강**이다(옳은 색이다).
            운영 프로필 5/5 는 **RC-1 의 전제**이지 이 절의 닫힘이 아니다 —
            둘을 섞으면 **기본값이 열린 채로 절이 닫힌다.** 순서: 선언 → 프로필(했다) →
            재기동 창 → **그 다음** 코드 기본값 제거 → 이 절이 닫힌다.
        blocker: SETTINGS_FAIL_OPEN_DEFAULTS

      # ★★ [P-85 · 2026-09-06 턴 I · 차선 S] **게이트 초록 · 대장 미착수** 를 여기서 갚는다.
      #   세종이 본 것은 참이다: `scripts/verify_prod_settings.py` 가 **5/5 초록**인데
      #   대장의 그 자리는 미착수였다. 다만 그 초록이 닫는 것은 **SEC-18 이 아니다** —
      #   SEC-18 이 묻는 것은 「개발 소스가 아무 선언 없이 뜨면 무엇이 되는가」이고
      #   그 답은 오늘도 **5/5 빨강**이다(`verify_settings_fail_closed.py` rc=1 · 실측).
      #
      #   한 절에 두 사실이 들어 있었다. 그래서 **쪼갠다**(D-314: 「부분」은 상태가 아니라
      #   아직 안 쪼갠 것의 이름이다). SEC-18 의 id 는 재활용하지 않는다 —
      #   같은 이름 아래 다른 것을 넣으면 대장이 또 조용히 갈린다(D-337 · P-81).
      #
      #     SEC-18   개발 소스의 **기본값**이 닫힌 쪽인가   → 아직 빨강. 미착수 그대로
      #     SEC-18a  **운영 프로필**이 선언 없이는 뜨지 않는가 → 5/5 초록. 여기서 닫힌다
      #
      #   이렇게 두면 두 게이트의 색과 두 절의 상태가 **한 짝씩 맞는다** — 그것이 P-85 다.
      - id: SEC-18a
        title: 운영 프로필이 **선언 없이는 뜨지 않는다** — 열린 기본값으로 상용에 서지 못한다
        status: 구현
        gate: scripts/verify_prod_settings.py
        proof: scripts/verify_prod_settings.py
        note_closed: |
          ★ **닫혔다 [실측 2026-09-17 17:03 · 턴 T · 재생성 창 ④ · D-485]** — 창 안에서 자격 3 과 가드 한 벌을
          **함께** 내렸고, 그 뒤 `python scripts/verify_prod_settings.py` → **통과 7/7 · EXIT=0**:
          ⑦ `MinIO 접근/비밀 20·40자 · DB 비밀 32자 · 서명 키 103자 · 자리표 없음 · 자리표→거부 O · 5자→거부 O ·
          둘이 같음→거부 O` · ①~⑤ `선언 없음→거부 O`. 닫는 조건 ㉠~㉣ 넷 다(runbook ④). 아래 `hand: out` 이하는
          닫히기 전의 기록이라 지우지 않는다 — 「왜 창에서만 닫히는가」가 거기 있다.
        hand_was: out
        hand_why: |
          남은 한 수(⑦ 자격의 모양)는 **컨테이너 재생성 창**에서만 닫힌다 — 그 창은 대표 승인이다.
          자격은 `.env` 가 아니라 **컨테이너 생성 시각에 굳은 환경**에 들어 있고(실측), 코드로는
          안 닿는다. 우리 손 안의 몫(가드 한 벌)은 **그 창에서 자격과 함께** 내려야 한다 —
          따로 내리면 기준판이 안 떠서 나머지 여섯 수가 「못 쟀다」가 된다(아래 A/B).
        blocker: PLACEHOLDER_CREDENTIALS_BAKED_INTO_CONTAINERS
        note: |
          ★★ **[실측 2026-09-11 · 턴 P · 차선 E] 이 칸은 오늘 '구현'에서 '잠김'으로 내렸다.**
            아래 「5/5 초록」은 **2026-09-06 의 참**이고 오늘의 참이 아니다. 그 뒤 판정기에
            수 둘이 늘었다(⑥ ERROR_BODY · ⑦ CREDENTIAL_FORMAT). 오늘 다시 돌리니:
              `python scripts/verify_prod_settings.py` → **exit 1 · 실패 1/7**
              O SECRET_KEY · O DEBUG · O ALLOWED_HOSTS · O COOKIES · O ORIGINS_TLS · O ERROR_BODY
              X CREDENTIAL_FORMAT  MinIO 접근/비밀 **5·5자 · 둘이 같은 문자열** · DB 비밀 5자 ·
                자리표→거부 **X 떴다** · 5자→거부 **X 떴다** · 둘이 같음→거부 **X 떴다**
            ★ **수가 안 늘었는데 색이 바뀐 것이 아니라, 판정기가 더 많이 보게 된 것이다.**
              대장이 '구현'으로 남아 있던 5일 동안 이 절은 「닫혔다」고 말하고 있었다 —
              그 사이 빨간 수는 한 번도 초록인 적이 없다. 게이트 빨강 + 대장 구현은
              P-85 가 「가장 나쁜 갈림」이라 부르는 모양이다(적어 놓고 무너졌다).
            ★ **격리 A/B 로 「코드로 지금 닫는다」를 기각했다** [실측 2026-09-11 · 컨테이너 /tmp]:
              A 이 기계의 자격 그대로 + ⑦ 가드 → **기동 거부**(5/5자 · 접근키==비밀키)
              B 자격만 24자 두 개로 바꾸고 같은 가드 → **떴다**
              A 는 판정기의 기준판 `full` 과 같은 환경이다. 즉 가드만 넣으면 `full` 이 거부되고
              나머지 여섯 수가 「판이 안 떴다」로 빨개진다 — **실패 1/7 → 7/7.**
              더 닫힌 것이 아니라 **덜 재진 것**이므로 하지 않았다. 잠금:
              `PLACEHOLDER_CREDENTIALS_BAKED_INTO_CONTAINERS`(재생성 창에서 자격+가드를 함께).
            ⚠ **6/7 을 '구현'으로 적지 않는다.** 이 절의 닫는 조건은 게이트 exit 0 이다.

          [실측 2026-09-06 · 턴 I · 차선 S 재확인 · **당시 판정기는 5수였다**]
          `python scripts/verify_prod_settings.py` **exit 0 · 5/5**:
            SECRET_KEY     선언 없음→기동 거부 · 자리표→거부 · 길이 103
            DEBUG          기본 False · `DJANGO_DEBUG=true` 를 줘도 False (환경변수로 못 켠다)
            ALLOWED_HOSTS  선언대로 · 선언 없음→거부 · `*`→거부
            COOKIES        여섯 다 닫힘 (개발 프로필 대조: 3/6 이 열려 있다)
            ORIGINS_TLS    출처 2 · 스킴 없음→거부 · HSTS 31536000s · 프록시 머리글자
          다섯 수마다 **음성 대조를 실제로 띄워서** 보인다(9판) — 읽어서 답하지 않았다(D-210).
          몸통: `backend/config/settings_prod.py` (P-75) · 배치 관문: `scripts/deploy.sh`
          (개발 프로필로 스테이징·운영을 열려 하면 배치 거부 exit 1).
          ⚠ 이 절은 **RC-1 의 전제**이지 SEC-18 의 닫힘이 아니다. 둘을 섞으면
            **기본값이 열린 채로 절이 닫힌다** — 그 문장은 SEC-18 의 사유에 그대로 있다.
          ⚠ 게이트가 자기 배너에 `[SEC-18]` 을 찍는다(파일은 차선 S 소유가 아니다).
            **그 배너를 SEC-18a 로 읽어라** — 세종이 절을 잘못 본 것이 이 배너 때문이다.

      # ── PRD v2.5 신규 (2026-09-24 · P-26 등재) ──────────────────────────
      - id: SEC-16
        title: 웹훅 서명·재시도 규약 (HMAC · 스키마 버전 헤더 · 지수 백오프 5회)
        status: 구현
        gate: scripts/verify_webhook_contract.py
        origin: PRD-2.5
        proof: scripts/verify_webhook_contract.py
        why: |
          [실측 2026-09-24 등재] 나가는 웹훅이 아직 0개다 — 문은 UX-19 가 낸다.
          문이 서기 전에 규약을 먼저 적는다: **서명 없는 웹훅은 누구나 보낼 수 있는 경보**이고,
          재시도 규약이 없으면 상대가 한 번 죽었을 때 그 경보는 조용히 사라진다.
          강제 도구 예정: 서명 불일치 거절 · 5회 뒤 포기 기록 · 스키마 버전 헤더 부재 거절.
        note_closed: |
          ★ **닫혔다 [실측 2026-09-27 · 턴 B 차선 S]** — 이 절은 **규약**이고 규약이 섰다.
          닫는 조건 셋 전부 강제된다: 서명 불일치 거절 · **5회 뒤 포기 기록** ·
          스키마 버전 헤더 부재 거절. 시험 `test_s_webhook_contract.py` **32 passed** ·
          판정기 자기시험 24/24 · 조율자 재측 `verify_webhook_contract` exit 0.
          서명은 **타임스탬프+판+본문**을 덮어 재생 공격도 막는다.
          ★ 함정 지켰다(세종 §4-4 · P-37): 규약 모듈에 **라우트 0** · 무계정 링크 없음 ·
            `INBOUND_KEY_ALLOWED` 한 줄도 안 넓혔다. 시험과 판정기가 둘 다 그것을 본다.
          ★ **저장소에 결함을 심어 보고 잡았다** 셋: `compare_digest`→`!=` ·
            `MAX_ATTEMPTS 5`→`9` · 새 `requests.post(webhook_url,…)` — 셋 다 FAIL,
            되돌린 뒤 PASS. **잡는 것을 보고 나서 초록을 믿는다.**
          ★★ **이 턴에 판정기가 세 번 틀렸고 그것이 이 절의 값이다.**
            ⓐ 낱말 검색이 **자기 문서**를 위반으로 셌다(「`==` 쓰지 마라」라고 적은 줄).
            ⓑ 그 고침이 토큰을 공백으로 이어 붙여 `requests . post` 를 만들며
               **진짜 발송자 2건을 0건으로** 셌다 — **0건이 초록으로 보였다.**
            ⓒ 가장 나쁜 것: 낱말 검색이 **심은 결함을 놓쳤다.** `compare_digest` 가
               **독스트링에 남아 있어** PASS 였다 — **규약을 설명한 문장이 규약을 지켰다는
               증거로 셌다.** → 판정을 **AST(구조)** 로 옮겼다.
            낱말은 코드가 아니다. 같은 뿌리를 이 저장소가 전에도 밟았다(D-414 쉼표 하나).
          남은 것 셋은 **문 쪽(UX-19 몫)**: 구독 등록 라우트 · 서명키 보관처
          (`signing_key_ref`) · 포기 행의 실제 저장. 문이 서면 판정기 래칫이 규약 사용을 강제한다.

          ⚠⚠ **그리고 그 대가로 게이트 하나가 빨갛다 — 가리지 않는다** [실측 2026-09-27 · V].
            `dormant` 게이트가 이 모듈의 함수 셋을 **새로 잠든 것**으로 잡았다:
              `webhook_contract.py::attempts_from` · `::giveup_record` · `::outbound_headers`
            D-377 의 규칙은 「**새로 만드는 것은 켜진 상태로 태어나야 한다**」이고,
            이 셋은 **부르는 곳이 0** 이다 — 문(UX-19)이 아직 없기 때문이다.
            ★ **기준선에 넣지 않았다.** `dormant_baseline.txt` 는 스스로 「이 목록은
              **줄어들기만 한다**」고 적고 있다. 거기 이름을 더하는 것은 게이트를 끄는 일이고,
              그러면 「규약을 지었다」와 「규약이 쓰인다」의 구별이 사라진다 —
              그 구별이 정확히 이 저장소의 착시 ⑨(**함수는 문이 아니다**)다.
            ★ **이것은 순서가 만든 빨강이다.** 세종 09-27 §3 이 규약을 턴 B, 문을 턴 C 로
              놓았고 그 순서에는 이유가 있다(서명 없는 웹훅은 누구나 보낼 수 있는 경보다).
              턴 C 에 UX-19 가 문을 내면 이 빨강은 **저절로 초록이 된다.**
              그때까지 빨간 채로 두는 것이 사실이다 — **빨강을 지우는 것과 원인을 없애는
              것은 다르다**(D-327).
            → 세종 판정 요청 1: 「규약 먼저」와 D-377「켜진 채로 태어나라」가 부딪힌다.
              이번은 턴 C 로 저절로 풀리지만, 다음에 같은 모양이 오면 규칙이 필요하다.

