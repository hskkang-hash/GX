          구독 → 발송(본문이 우리 스키마가 아니라 CAP 1.2) → 서명 검증(규약 `verify()` 가
          우리 헤더를 통과 · **한 글자 바꾸면 거절**) → 재시도(**정확히 5회** · 포기가 행으로).
          ★★ **그리고 이것이 P-42 의 첫 이행이다** — 「규약은 부르는 곳과 같은 턴에 태어난다」.
