        note: |
          ★ [실측 2026-09-22 · 차선 E2] **회색이 색으로 갈렸다.** 도구를 깔고 한 번 쟀다:
              pytest-cov 6.0.0 · coverage 7.16.0 — `backend/requirements-dev.txt` 에
              **판과 해시로 고정**했다(`--require-hashes` · D-387). 「깔았다」가 진술이
              아니라 재현 가능한 사실이 된다.
              첫 수 — TOTAL 12,356 stmts · 5,934 miss · **52%**
              커널 k1 92% · k2 90% · k3 88% · k4 90% · k5 92~100% · apps/dsm 서비스 84% · api 45%
          ★ **52% 는 낮다. 그리고 그것이 이 절의 초록이다** — 이 절이 재는 것은
            「커버리지가 높은가」가 아니라 **「어디를 지나는지 아는가」**다. 몰랐던 것을
            알게 된 것이 상태 변화이고, 수를 올리는 일은 다른 절(QA-01 계열)의 일이다.
          ⚠ 이 수를 「시험 품질」로 읽지 말 것. 52% 를 끌어내리는 것은 대부분
            `stream_monitors` 의 인수 코드다 — 분모가 우리 것이 아니다.
        why: |
          [이력 · 지우지 않는다] 2026-09-21 까지 미측정이었던 사유는 **도구 부재**였다 —
          `pytest-cov` 가 컨테이너에 없었다. 「손 밖」으로 옮기지 않은 판단이 옳았음이
          이번에 확인됐다: 막는 것이 상대방도 기관도 아니라 **설치 한 번**이었다.

      # ★ D-387 — 재현되지 않는 빌드는 상용에 나갈 수 없다. **두 절로 쪼갠다**(D-314):
      #   번들이 재현되는 것과 설치가 재현되는 것은 다른 사실이고, 지금 하나만 참이다.
