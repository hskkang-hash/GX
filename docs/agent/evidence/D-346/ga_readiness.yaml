      - id: UX-17
        title: 훈련 모드 (`drill_mode` · 실채널 발송 0 · 종료 보고서 1장)
        status: 구현
        proof: backend/tests/test_c_drill_mode.py
        origin: PRD-2.5
        note: |
          [실측 2026-09-24 · 차선 C 16 passed + 조율자 배선] 스위치·창·`data_source` 판정·
          종료 보고서는 차선 C 가, **K2 채널 어댑터 한 자리는 조율자가** 이었다
          (발송 경로는 하나이고 그 파일은 차선의 것이 아니다).
          ★ 차선 C 는 어댑터 앞에서 **멈추고 부작위 시험을 남겼다** —
            「K2 가 아직 훈련 스위치를 보지 않는다」. 배선이 들어오자 그 시험이 빨개졌고,
            **그 빨강이 「배선이 왔다」는 선언**이었다. 갈아 끼운 것이
            `DrillIsWiredToChannelsTest`(훈련 중 채널이 `log` 로 간다 + 양성 대조).
          ★ **이름을 가장하지 않는다**: 행의 `channel` 에 `log` 가 그대로 적힌다.
            원래 채널로 적어 두고 몰래 로그로 보내면 그 행은 **보냈다는 거짓말**이 된다.
          ★ 안전한 기본값은 **실발송**이다 — 테넌트를 못 읽으면 훈련이 아니다.
            스위치를 못 읽는 상태에서 조용해지는 것이 이 절이 막으려는 사고 그 자체다.
          ★ `data_source=drill` 은 **칸이 아니라 창 판정**이다(D-347 화면 메타) —
            새 칸을 만들면 과거가 비고, 빈 과거는 「훈련이 아니었다」로 읽힌다.
        why: |
          [인용] 지자체는 연 2회 이상 재난 대응 훈련을 한다(안전한국훈련·을지).
          훈련 때 실제 알림이 소방·팀장에게 나가면 **그날로 알림을 끈다**(U2#18).
          테넌트 스위치 하나로 채널이 로그 어댑터로 바뀌고 이벤트는 `data_source=drill` 이다.
          ★ K2 채널 어댑터는 **조율자만 만진다**(지시서 §2 차선 규칙).

