      - id: UX-10
        title: 저장소가 죽었을 때 사용자가 그것을 안다
        status: 구현
        proof: frontend/src/features/MediaData/hooks/useMediaData.ts
        note_closed: |
          ★★ **닫혔다 [실측 2026-09-27 · 턴 B 차선 C]** — 그리고 **막던 것은 한 줄이었다.**
          `useMediaData.ts` 에 `catch (error) { console.error(error); }` 가 있었다.
          실패가 콘솔에만 남고 표는 앞의 빈 상태로 서 있어 **「0 of 0」** 이 됐다.
          이제 실패를 `listError` 로 올리고 화면이 두 문장을 **갈라서** 그린다:
          저장소 미도달이면 「**저장소에 연결할 수 없습니다 · 다시 시도**」(세종 P-36),
          그 밖의 실패면 「목록을 불러오지 못했습니다 · 다시 시도」. 표를 억지로 비우지
          않고 그 위에 덮어 말한다 — 빈 표는 「없다」로 읽히기 때문이다.
          서버도 함께 고쳤다: `500 → 503`, 다만 **저장소 미도달일 때만**
          (`minio_client.available` 로 가름 · `backend/media_data/views/media_data_view.py`).
          500 은 「우리가 깨졌다」고 말하고 그 말은 고치는 사람을 볼 것 없는 곳으로 보낸다.
          ⚠ **`route-alive` 에 예외를 넣지 않았다**(D-327). 그 게이트는 `status >= 500` 을
            죽은 것으로 읽고 503 도 그 안이다 — 저장소를 붙이기 전까지 이 자리는 빨간 채로
            있는 것이 옳다. **화면이 사실을 말하게 된 것과 저장소가 살아난 것은 다른 일이다.**
          ⚠ 잠금 `MEDIA_LIST_SHOWS_EMPTY_WHEN_STORAGE_DOWN` 은 대장에 그대로 둔다 —
            그 잠금은 UX-09(인수 화면 쪽)도 막고 있고, 그쪽은 아직 안 열렸다.
        note: |
          ★ [실측 2026-09-14 · D-397] 16장을 여는 중에 `/api/media-data/` 가 **500** 이었다.
          그런데 화면은 「0 of 0」 을 그렸다 — **당직자에게는 「영상 자료가 없다」로 보인다**(D-378).
          이번 턴에 **응답이 말하던 두 거짓말은 고쳤다**: `success: true`→`false` ·
          「operational notice」→「media list」. **그러나 화면은 그대로다** — 화면이 안 듣는다.
          게이트 `route-alive` 는 이 자리에서 **빨간 채로 둔다**(D-327). 예외를 넣지 않는다.

          ★★ [실측 2026-09-04 · 조율자 V] **그 500 의 원인을 이번에 갈랐다.**
          같은 라우트를 두 번 때렸다 — 오직 다른 것은 저장소 연결이다:
              MinIO 미연결(기본 `minio.invalid`)  → `/api/media-data(/)` **500 두 자리**
              MinIO 연결                          → **31건 전부 2xx · 게이트 exit 0**
          즉 이 500 은 코드의 상시 결함이 아니라 **저장소가 죽었을 때의 행동**이다.
          그리고 그것이 정확히 이 절이 재려는 것이다: 저장소가 죽으면 **500 이 나가고
          화면은 「0 of 0」을 그린다.** 저하 운전(DA2-21 ④)이 요구하는 것은 그 반대다 —
          목록은 살고, 사용자는 **왜 비었는지**를 읽어야 한다.
          ⚠ 이 사실이 **게이트를 초록으로 만들지 않는다.** 이 환경에서 초록인 이유는
            저장소를 붙였기 때문이고, 붙이지 않으면 여전히 빨갛다 — 그 빨강이 이 절이다.

