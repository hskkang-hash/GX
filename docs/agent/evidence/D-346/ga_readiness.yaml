      - id: UX-17
        title: 훈련 모드 (`drill_mode` · 실채널 발송 0 · 종료 보고서 1장)
        status: 구현
        proof: backend/tests/test_c_drill_mode.py
        origin: PRD-2.5
        note: |
          [실측 2026-09-24 · 차선 C 16 passed + 조율자 배선] 스위치·창·`data_source` 판정·
          종료 보고서는 차선 C 가, **K2 채널 어댑터 한 자리는 조율자가** 이었다
          (발송 경로는 하나이고 그 파일은 차선의 것이 아니다).
