            대장에 올렸다(RJCORE_BLANK_ON_NO_PERMISSION). **화면이 시험이었다.**

      - id: UX-07
        title: 화면 캡처 증거 — 남은 화면 8개 (감시·영상·운영 계열)
        status: 구현
        proof: docs/agent/evidence/D-396/screens_16.md
        note: |
          ★ [실측 2026-09-14 · D-396] **8장 → 16장. 16/16 이 찼다.**
          고르기 전에 **후보 16개를 실제로 열어 본문을 읽었다**(추측 금지 · D-386):
            찍을 수 있는 것 13 · 찍을 수 없는 것 3.
          찍은 여덟:
            /surveillance-dashboard「Last Updated」 /survey-profile「Add New Profile」
            /media-data「No preview available.」 /flight-log-analysis「Drone State Prediction」
            /multi-stream-monitor「Participants」 /operation-settings「API URL」
            /report-template「Usage Count」 /notam「SNOWTAM」
          브라우저 오류 **0건** · `verify_screens.py` 통과(16장 · ±5분 대조).
        why: |
          [이력 · 지우지 않는다] 2026-09-13 에 이 절이 미착수였던 사유는
          「구동체는 섰고 이번 턴 표적이 5장이었다」였다. 이번에 채웠다.

      # ★ D-396 — **16장이 결함 셋을 더 냈다.** 이 절은 그 셋을 위한 자리다
      - id: UX-09
        title: 열었더니 못 찍은 화면 셋 (빈 화면 1 · 도달 불가 2)
        status: 잠김
        hand: out
        hand_why: |
          셋 다 인수 자산(rj-core §0.4) 화면에서 갈린다 — 소유팀
        blocker: RJCORE_BLANK_ON_NO_PERMISSION
        proof: docs/agent/evidence/D-386/screen_routes.json
        note: |
          ★ [실측 2026-09-14 · D-396] 후보 16개를 열어 **셋을 못 찍었다.**
          **왜 못 찍었는지로 갈라 적는다** — 한 칸에 두면 고치는 사람이 어디를 볼지 모른다:
            ㉠ **빈 화면**    `/handover` — 본문 0자 · API 실패 0건 · JS 오류 0건.
               `/users` 와 **같은 모양**이다. 한 건이면 그 화면의 사정이지만
               **둘이면 성질**이다 — RJCORE_BLANK_ON_NO_PERMISSION 에 표본을 더했다
            ㉡ **도달 불가** `/monitoring-dashboard` · `/intergrated-dashboard` —
               요청한 경로가 아니라 이 계정의 홈(`/profile`)이 떴다. 빈 화면과 다르다:
               빈 화면은 「왔는데 아무것도 없다」이고 이것은 **「거기 갈 수 없다」**이다
          ⚠ 이 계정의 `role` 은 `NO_ROLE` 이다 — 역할이 있는 계정에서는 다를 수 있고
            그것은 **아직 재 보지 않았다.** 「권한 때문」이라고 적지 않는다 (D-322).
        why: |
          셋 다 화면 쪽(인수 자산)에서 갈린다. 서버는 이 셋에서 오류를 내지 않았다.

      - id: UX-10
        title: 저장소가 죽었을 때 사용자가 그것을 안다
        status: 잠김
        hand: in
        hand_why: |
          `/media-data` 는 **우리 화면**이다. 서버는 이미 500 을 말한다 — 화면이 듣게 하면 닫힌다
        blocker: MEDIA_LIST_SHOWS_EMPTY_WHEN_STORAGE_DOWN
        proof: docs/agent/evidence/D-396/screens_16.md
        note: |
          ★ [실측 2026-09-14 · D-397] 16장을 여는 중에 `/api/media-data/` 가 **500** 이었다.
          그런데 화면은 「0 of 0」 을 그렸다 — **당직자에게는 「영상 자료가 없다」로 보인다**(D-378).
          이번 턴에 **응답이 말하던 두 거짓말은 고쳤다**: `success: true`→`false` ·
          「operational notice」→「media list」. **그러나 화면은 그대로다** — 화면이 안 듣는다.
          게이트 `route-alive` 는 이 자리에서 **빨간 채로 둔다**(D-327). 예외를 넣지 않는다.

          ★★ [실측 2026-09-04 · 조율자 V] **그 500 의 원인을 이번에 갈랐다.**
          같은 라우트를 두 번 때렸다 — 오직 다른 것은 저장소 연결이다:
              MinIO 미연결(기본 `minio.invalid`)  → `/api/media-data(/)` **500 두 자리**
              MinIO 연결                          → **31건 전부 2xx · 게이트 exit 0**
          즉 이 500 은 코드의 상시 결함이 아니라 **저장소가 죽었을 때의 행동**이다.
          그리고 그것이 정확히 이 절이 재려는 것이다: 저장소가 죽으면 **500 이 나가고
          화면은 「0 of 0」을 그린다.** 저하 운전(DA2-21 ④)이 요구하는 것은 그 반대다 —
          목록은 살고, 사용자는 **왜 비었는지**를 읽어야 한다.
          ⚠ 이 사실이 **게이트를 초록으로 만들지 않는다.** 이 환경에서 초록인 이유는
            저장소를 붙였기 때문이고, 붙이지 않으면 여전히 빨갛다 — 그 빨강이 이 절이다.

      # ★ D-401 — 검수 화면이 설 수 있는 데이터가 생겼다 (P-9)
      - id: UX-12
        title: 검수용 이벤트가 **실제 경로로** 심긴다 (시드 · 데이터 출처 표기)
        status: 구현
        proof: docs/agent/evidence/D-401/seed_is_real_path.md
        note: |
          ★ [실측 2026-09-16 · D-401] `seed_dsm_events` 가 `record_detection` 만 불러
          **20건**을 심는다(판정 12 · 대응 전이 36). 두 축을 모두 채운다 —
          대응 4/4/4/8 · 판정 8/8/4 · 유형 4종 각 5.
          ★★ 그리고 **기존 씨앗이 모형이었다**: 캡처 실행체가 `_base_manager.create()` 로
            행을 직접 만들고 있었고 화면 16장이 그 위에서 찍혔다. 실제 경로로 바꿨다.
          `verify_screens` 필수 메타를 4칸 → **5칸**으로 늘렸다(`data_source`) —
          시드로 찍은 화면은 실제 화면이지만 **실제 사고는 아니다**.
          ⚠ 스냅샷·구간은 **비어 있다**(MinIO 부재). 비어 있는 채로 찍었다.

      # ★ D-399 — 지시서(세종 2026-09-14)가 낸 첫 제품 절
      - id: UX-11
        title: 이벤트 대응 진행이 기록된다 (발생→접수 확인→조치중→종결)
        status: 구현
        proof: backend/tests/test_response_flow.py
        note: |
          ★ [실측 2026-09-14 · D-399] 지시서는 「상태를 4값으로」 를 냈고 실측하니
          `status` 는 **이미 4값**이었다. 다만 **축이 다르다** — `status` 는
          「이 탐지가 진짜인가」이고 대응은 「사람이 어디까지 했나」다.
          한 칸에 넣으면 D-293 이 가른 것이 다시 섞이므로 **세 번째 칸**을 세웠다.
          전이는 앞으로만 · 되돌림은 「종결→조치중」 하나(팀장·사유 필수) ·
          감사는 새 표 없이 `logger.AuditLogs` 에 남는다.
          거절은 **실제 4xx**: 409·400·403·404 (200 봉투 안 오류 아님).
          시험 11건 · 특히 `AxesStayApartTest` 가 두 축이 섞이지 않는지 본다.

      # ★ D-394 — **잠자는 기능 전수가 낸 첫 제품 절.** 코드는 다 있고 꺼져 있다
      - id: UX-08
        title: 관제 화면 실시간 탐지 알림 (WebSocket 브로드캐스트)
        status: 미착수
        why: |
          [실측 2026-09-14 · D-394] **코드는 있고 두 겹으로 꺼져 있다.**
            ① `backend/surveillance/signals.py` 의 `@receiver(post_save, sender=VideoAnalysis)`
               가 **주석**이다
            ② `surveillance/apps.py::SurveillanceConfig` 에 `ready()` 가 없어
               **signals 모듈을 아무도 import 하지 않는다** — 주석을 풀어도 안 돈다
          그리고 크기가 여기 있다: `SurveillanceDashboardService.broadcast_detection_message`
          를 부르는 **운영 코드는 그 시그널 한 자리뿐**이다 (1507줄은 docstring 안의 예시다).
          → **새 탐지가 저장돼도 관제 화면으로 가는 알림이 한 번도 발화하지 않는다.**
            당직자에게는 「새 이벤트가 안 뜬다」로 보인다 (D-378).

          ★ 「잠김」이 아니라 「미착수」다 — 우리가 하면 되는 일이다. 다만 **한 줄 주석 해제가
            아니다**: `post_save` 마다 브로드캐스트를 쏘는 것은 D-369 가 다룬 **폭주 경로**이고,
            재난 때 그대로 채널 레이어를 때린다. 켜려면 **큐잉 · 같은 (모델,pk) 접기**를
            함께 얹어야 한다. 그것은 켜기가 아니라 설계이므로 세종의 판정을 기다린다.

      # ★ D-383 — **화면이 없어도 할 수 있는 검수.** 이 절의 정답은 우리에게 없다
      - id: UX-05
        title: 역할↔화면 매핑 확인 (안양 관제팀 검수 항목)
        status: 잠김
        hand: out
        hand_why: |
          매핑의 정답은 **안양 관제팀**이 안다 — 검수 항목
        blocker: K3_ROLE_MAPPING_UNCONFIRMED
        proof: backend/config/k3_roles.py
        note: |
          ★ 우리가 이은 **7종은 인용이 아니라 우리 판정**이다 (D-383). DA-03 §3-4 는
          역할을 「다섯 종류의 사람」으로 적었고, 이 저장소의 `role.Role.code` 는
          **15종**이다 [실측]. 그 둘을 이은 것이 우리이고, 근거는 코드 주석마다 있다.

          **나머지 8종은 「미배선」이다** — 추측으로 채우지 않았다
          (`K3_UNMAPPED_BY_DECISION`). 비워 두면 `get_preset` 이 `matched=False` 로
          **말해 준다** — 조용히 기본값을 주지 않는다.

          ★ 이 매핑의 정답은 **안양 관제팀이 안다.** 검수에서 물을 것 셋:
            ① 우리가 이은 7종이 **맞는가**
            ② **빠진 것**이 있는가 (미배선 8종 중 화면을 받아야 하는 역할)
            ③ **이건 보이면 안 된다** 가 있는가
          ★ 이것이 검수 콘솔의 첫 실전 용도다 — **화면이 없어도 할 수 있는 검수**이고,
            실제로 `SCREENS-1/OPERATOR/dsm_dashboard.png` 에 그 질문이 찍혀 있다:
            「역할 매핑을 찾지 못해 가장 좁은 화면으로 떨어졌습니다」.
        proof_detail: |
          이은 7종 [우리 판정 · 2026-09-11]
            OPERATOR  : fire_user · surveillance_operation · operator
            MANAGER   : fire_admin · surveillance_order · admin
            EXECUTIVE : view_only_-_anyang
          미배선 8종 [판정 · 추측 아님]
            order · delivery_admin · delivery_order · delivery_operation ·
            drone_robot_admin · drone_robot_user · user · superuser

