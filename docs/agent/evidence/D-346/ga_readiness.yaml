          **관제 역할 메뉴의 드론·항공·영문 CRUD: 11 → 0**

          | 역할 | 끊기 전 | 끊은 뒤 |
          |---|---|---|
          | fire_user (U1) | 2 | **0** |
          | operator (U1) | 1 | **0** |
          | fire_admin (U2) | 2 | **0** |
          | view_only_-_anyang (U4) | 6 | **0** |
          | **admin (U5)** | 8 | **8 유지**(세종 지시) |

          ★ **그리는 쪽에서도 쟀다** — `core.menu.get_user_menu_structure` 를 실사용자로
            펼쳐: fire_user1 17·대상 0 · operator_user 20·0 · anyang_sv 27·0 ·
            son(admin) **107·11 유지**. 표를 세는 것과 사람이 보는 것은 다른 수다.
          ★★ **「107행」의 정체가 드러났다** — 메뉴 표의 크기가 아니라 **관리자 한 사람이
            보는 메뉴 수**였다. 지난 턴에 내가 그것을 「Menu 107행」이라 적었고 그것은
            틀렸다(실제 Menu 131행 · RoleMenu 969행). **세어 본 수와 옮겨 적은 수가 갈렸다.**
          ★ **삭제 0건**: Menu 131 · RoleMenu 969 가 끊기 전후 **같다.** 끊은 것은 행이
            아니라 **그 행의 네 칸**이다. `core.*` 는 한 줄도 안 고쳤다 — 읽고 칸만 바꾸는
            **데이터 작업**이다(forbidden-zone 게이트 초록).
          ★★ **되돌릴 수 있다 [실측 왕복]**: 11 → 0 → **11** → 0 을 같은 DB 에서 실제로
            돌렸다. 그리고 되돌리기는 **장부대로**다(`UX-21/menu_unlink_ledger.json` 에
            연결마다 `before` 를 남겼다) — **표만 보고 켜면 끊기 전부터 꺼져 있던 연결까지
            켜서 없던 권한을 준다.** 되돌리기가 권한 부여가 되는 자리다.
          ★ U5 에 남는 인수 화면 8장은 **한국어 헤더 한 줄로 감쌌다**(`InheritedScreen`) —
            인수 코드는 안 고치고 우리 층에서 덧댔다.
          ★ 로고: 번들 자산이 `logo-full-black-*.png` 로 나온다 — `%20` **0건** [실측].
            다만 **실제 렌더는 여전히 [추정]** 이다(재촬영이 가른다) — 번들 URL 이 고쳐진
            것과 화면에 그려지는 것은 다른 사실이다.

          ★★★ **[정정 2026-09-05 TC · 병합 중] 이 절이 한 번 더 고쳐졌고, 그것을 시킨 것은
            분류 게이트다 — 그리고 조율자가 시킨 답이 틀렸다.**
            커밋 훅(`verify_classification` · D-270 ③)이 두 명령을 막고 물었다:
            **「`core.menu.RoleMenu` 는 어느 테넌트의 표인가.」**
            조율자는 「공용 마스터일 테니 **전역 변경임을 선언**하고 지나가라」고 지시했다.
            차선 C 가 등록부를 읽고 **선언하지 않았다** — 답이 둘 중 하나가 아니었다:

            | 표 | 등록부 분류 | 등록부의 사유 |
            |---|---|---|
            | `menu.RoleMenu` | **`DEFERRED`** | 「역할↔메뉴 매핑(923행). **일부만 공용일 수 있다**」 |
            | `menu.Menu` | **선언 없음** | 등록부에 아예 없다 |

            **「아직 아무도 정하지 않았다」가 셋째 답이었다.** 선언이 없으니 실물을 쟀다:
              `RoleMenu` 969행의 group 분포 `{6: 616, 5: 204, 7: 67, 4: 39, None: 43}`
              — **926행(95.6%)이 소속을 갖는다.** 공용 마스터가 **아니다.**
              그리고 **내가 끊은 11행은 소속 둘에 걸쳐 있었다**: `{6: 7, 5: 4}`.
            → 진짜 결함은 「전역이라 위험하다」가 아니라 **「내 명령이 소속을 안 물었다」**였다.
              `role__code` + `menu__path` 로만 걸러 **소속이 몇이든 전부 쳤다.**
            ⚠ **시킨 대로 「전역이다」라고 선언했으면 틀린 것을 선언한 것이 된다** —
              그리고 그 선언은 다음 사람에게 **거짓 안심**으로 남는다.
              **게이트의 물음에 답하는 것과 게이트를 통과시키는 것은 다르다.**
            고침: `--group <id>`(여럿) **또는** `--all-tenants` 를 **반드시** 받는다 —
            **기본값을 두지 않았다. 기본이 전역인 명령은 언젠가 반드시 모르고 눌린다.**
            돌 때마다 등록부에 분류를 물어 출력에 찍고, `DEFERRED` 가 아니면 **멈춘다**
            (전제가 깨진 채로 조용히 도는 것이 가장 나쁘다). 장부에 `group_id`·`scope`·
            `classification` 을 적는다 — 소속을 안 적으면 되돌리기가 어느 소속 것인지 말하지 못한다.
            시험 9 → **16건**. 양성 대조: 소속 필터를 죽이니
            `test_group_scope_leaves_the_other_tenant_alone` **하나만** 빨개졌다
            (「남의 소속까지 끊었습니다」) — **시험이 진짜로 문다.**
        why: |
          [실측 2026-09-25 · 24장 중 9장] 인수 자산이 관제 메뉴에 그대로 있다 —
          드론 Device · NOTAM · 비행로그 · 조사 프로파일 · 영문 CRUD 4장 · 프로필의
          통화·소수점·외국 국기. 첫 로그인에는 역할 매핑 경고 · 빈 사이드바 · 깨진 로고.
          ★ **§0.4 는 수정 금지이지 노출 의무가 아니다.** 라우트는 그대로 두고
            **메뉴 등재를 뺀다** · 남는 인수 화면은 한국어 헤더 한 줄로 감싼다.
          닫는 조건: 관제 역할 메뉴에 드론·항공·영문 CRUD 0개 · 로고 렌더 ·
          역할 기본 프리셋 시드로 첫 로그인 경고 0.

          ★★ **[실측 2026-09-27 · 턴 B] 「메뉴 등재를 뺀다」가 우리 손 안이 아니었다.**
            사이드바는 서버가 준 `menusWithPermissions` 로 그리고, 그 **정본은
            DB 의 `core.menu.models.Menu` 107행**이다 — 드론 Device · NOTAM · 비행로그 ·
            조사 프로파일 · 영문 CRUD 가 전부 그 안에 있다. `core.*` 는 **dj-core = §0.4**
            이고, 우리 저장소 어디에도 메뉴를 등재하는 코드가 없다
            (`grep role_menus|user_menus backend/` → **0건**).
            남은 길은 **DB 행 제거뿐이고 그것은 삭제** — 대표 승인 사항(위임 밖)이다.
            ⚠ 09-26 에 적은 「라우트는 그대로 두고 메뉴 등재를 뺀다」는 **옳은 방침이었고
              틀린 전제**였다: 우리가 뺄 수 있는 등재가 있다고 보았는데 없었다.
              **방침을 바꾸지 않는다 — 여는 열쇠가 우리 손이 아님을 적을 뿐이다.**

          ★ 이번 턴에 **닫은 셋**(화면 쪽 · 손 안):
            ① 로고 자산 이름의 공백 제거(`Full Version-Black.png` → `logo-full-black.png` ·
