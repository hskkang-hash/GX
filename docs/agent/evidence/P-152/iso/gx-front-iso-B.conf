# P-152 격리 설정 — **생성물**. docs/agent/evidence/P-152/iso_cause_table.py 가
#   nginx/gx-front.conf 에서 주석을 걷고 upstream 의 server 줄만 세 줄로 폈다(P-137 B 와 같은 모양).
#   ⚠ nginx/ 아래에 두지 않은 까닭: verify_live_freshness 가 gx-nginx-e 를 nginx/**.conf 의
#     시각으로 잰다 — 거기 새 .conf 가 생기면 도는 앞단이 「낡았다」로 읽힌다(거짓 빨강).
# B — 같은 peer 세 줄: tries 3 이 세 번 다 peer 로 간다
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx-front.pid;
events {
    worker_connections 2048;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/json;   # 관문의 거절 본문이 JSON 이다
    log_format gx '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  '$request_time "$upstream_addr" $upstream_response_time';
    access_log /dev/stdout gx;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    upstream gx_app {
        server gx-gunicorn-i152:8000 max_fails=0;
        server gx-gunicorn-i152:8000 max_fails=0;
        server gx-gunicorn-i152:8000 max_fails=0;
        keepalive 32;
        keepalive_timeout 60s;
    }
    server {
        listen 8500;
        server_name _;
        client_max_body_size 64m;
        location = /_front/health {
            access_log off;
            return 200 '{"front":"nginx","upstream":"gunicorn"}';
        }
        include /etc/nginx/gx/generated/gx-gate.conf;
    }
}
