# 피드백 콘솔 화면 인덱스 — **실제 실행 캡처만** (D-347)
#
# ═══════════════════════════════════════════════════════════════════════════
# ★ [실측 2026-09-12 · D-384 ②] **3장이 섰다.** 0장이던 두 턴이 끝났다.
#
#   풀린 것은 「화면을 만든 것」이 아니라 **찍을 수 있게 된 것** 둘이다:
#     ① 브라우저 구동체를 세웠다 — playwright chromium (`scripts/capture_screens.py`)
#     ② **빌드가 1회 성공했다** — `vite build` 66초 · exit 0.
#        D-381 이 문턱을 낮춘 그대로다: 타입오류 3229건이 있어도 번들은 만들어진다.
#        **타입검사와 번들링은 다른 일**이고, 스크린샷에 필요한 것은 후자다.
#
#   ★ 그리고 이 세 장은 **결함 하나를 잡고 나서야** 찍혔다:
#     첫 시도에서 `이벤트 목록` 화면이 「불러오지 못했습니다 · status code 500」 이었다.
#     `/api/dsm/events` 가 pydantic `QueryParams is not fully defined` 로 죽고 있었다 —
#     `from __future__ import annotations` + `@tenant_scoped` 가 겹쳐 주석이 안 풀린 것.
#     **단위 시험 530건이 전부 초록인 채로** 그 라우트는 운영에서 죽어 있었다(착시 ⑨).
#     화면을 띄운 첫 순간에 나왔다 — **화면이 시험이었다.**
# ═══════════════════════════════════════════════════════════════════════════
#
# D-347 이 정한 것:
#     ① **E2E 실행 중에 찍는다.** 별도로 화면을 만들어 찍지 마라 —
#        **시험이 지나간 그 화면**이어야 한다
#     ④ 개인정보·실제 영상 프레임이 들어간 캡처는 넣지 마라. 시험 데이터만
#
# [실측 2026-09-08] 지금 E2E 는 `django.test.TestCase` 다. HTTP 를 때리고 DB·메일을
# 단언한다 — **브라우저를 열지 않는다.** 즉 시험이 지나가는 자리에 **화면이 없다.**
# 브라우저 구동체(playwright·selenium)는 requirements 에 없다.
#
# 그래서 한 장도 넣지 않았다. 화면을 따로 띄워 찍으면 그것은
#   · 「시험이 지나간 그 화면」이 아니고(① 위반)
#   · **고객이 보는 자리에 실제가 아닌 화면**이 된다 — 착시가 아니라 **거짓말**이다(D-284)
#
# 잠금: DA-05/blockers.yaml :: BROWSER_E2E_HARNESS (blocked_now: true)
# 강제: scripts/verify_screens.py — 항목마다 파일 실재 · 메타 4칸 · E2E 로그 시각 ±5분
#
# ───────────────────────────────────────────────────────────────────────────
# 항목 형식 (한 장에 다섯 칸. 넷은 메타, 하나는 파일)
#
#   - route: /dashboard              # 어느 경로의 화면인가
#     user_role: OPERATOR            # 어느 사용자로 찍었나
#     scenario: E2E-1/8              # 어느 시나리오의 몇 단계인가
#     captured_at: "2026-09-08T11:20:03"   # 찍힌 시각 (E2E 로그와 ±5분 안이어야 한다)
#     file: E2E-1/OPERATOR/dashboard.png   # screens/ 아래 상대 경로 · 폭 1440 · PNG
# ───────────────────────────────────────────────────────────────────────────

meta:
  decision: D-347
  updated_at: "2026-09-08"
  width_px: 1440
  format: png
  root: docs/agent/evidence/D-347/screens
  #: E2E 실행 로그. 여기 시각과 캡처 시각을 ±5분으로 대조한다.
  #: 아직 없다 — 브라우저 E2E 가 서면 그 실행이 만든다.
  run_log: docs/agent/evidence/D-347/screens/run_log.json
  tolerance_minutes: 5
  #: [실측] 이 실행체가 찍는다. 씨앗은 시험 데이터뿐이고 끝나면 지운다(D-347 ④).
  harness: scripts/capture_screens.py
  empty_reason: |
    브라우저를 여는 E2E 가 없다 (BROWSER_E2E_HARNESS).
    **찍을 화면이 실행 중에 존재하지 않는다.** 만들어 찍는 것은 D-347 ①이 금지한다.

    ★ [실측 2026-09-11 · D-371] 사유가 **한 겹 바뀌었다.** 지우지 않고 덧붙인다:
      화면 셋은 이제 **코드에 있다** — frontend/src/features/dsm/pages/
        ControlDashboard.tsx (관제 대시보드) · EventList.tsx · EventDetail.tsx
      즉 「그릴 화면이 없다」는 더 이상 사유가 아니다. 남은 사유는 둘이다:
        ① 브라우저 구동체가 여전히 없다 (playwright·selenium 어느 것도 requirements 에 없음)
        ② 이 작업 환경에 프런트 의존 설치본이 없다 — `frontend/node_modules` 부재.
           있는 것은 컨테이너 `gx-fe-build` 뿐이고, 그 안의 `rj-core` 판이 저장소와
           어긋나 저장소 전체 타입오류 **3229건**이 난다 [실측].
           (**새 화면 셋에서 난 오류는 0건**이다 — 어긋난 것은 기존 화면과 rj-core 다)
      ★ [실측 2026-09-12] **둘 다 풀렸다.** 사유를 지우지 않고 이력으로 남긴다 —
        ①은 `scripts/capture_screens.py`(playwright chromium)로, ②는 빌드 1회 성공으로.
        지금은 **0장이 아니므로 이 사유는 더 이상 적용되지 않는다.**
        ⚠ 남은 사실 하나: 타입오류 3229건은 **그대로다.** 빌드가 서는 것과 타입이
          깨끗한 것은 다른 일이고, 이번에 푼 것은 앞의 것뿐이다 (D-381).
  expected_when_unlocked: |
    E2E-1(화재) · E2E-2(침수) 의 화면 단계마다 역할 1개 이상.
    최소 대상: 로그인 · 대시보드 · 이벤트 목록 · 이벤트 상세(영상 구간) · 보고서.

