  #: E2E 실행 로그. 여기 시각과 캡처 시각을 ±5분으로 대조한다.
  #: 아직 없다 — 브라우저 E2E 가 서면 그 실행이 만든다.
  run_log: docs/agent/evidence/D-347/screens/run_log.json
  tolerance_minutes: 5
  #: [실측] 이 실행체가 찍는다. 씨앗은 시험 데이터뿐이고 끝나면 지운다(D-347 ④).
  harness: scripts/capture_screens.py
  empty_reason: |
    브라우저를 여는 E2E 가 없다 (BROWSER_E2E_HARNESS).
    **찍을 화면이 실행 중에 존재하지 않는다.** 만들어 찍는 것은 D-347 ①이 금지한다.

    ★ [실측 2026-09-11 · D-371] 사유가 **한 겹 바뀌었다.** 지우지 않고 덧붙인다:
      화면 셋은 이제 **코드에 있다** — frontend/src/features/dsm/pages/
        ControlDashboard.tsx (관제 대시보드) · EventList.tsx · EventDetail.tsx
      즉 「그릴 화면이 없다」는 더 이상 사유가 아니다. 남은 사유는 둘이다:
        ① 브라우저 구동체가 여전히 없다 (playwright·selenium 어느 것도 requirements 에 없음)
        ② 이 작업 환경에 프런트 의존 설치본이 없다 — `frontend/node_modules` 부재.
           있는 것은 컨테이너 `gx-fe-build` 뿐이고, 그 안의 `rj-core` 판이 저장소와
           어긋나 저장소 전체 타입오류 **3229건**이 난다 [실측].
           (**새 화면 셋에서 난 오류는 0건**이다 — 어긋난 것은 기존 화면과 rj-core 다)
      ★ [실측 2026-09-12] **둘 다 풀렸다.** 사유를 지우지 않고 이력으로 남긴다 —
        ①은 `scripts/capture_screens.py`(playwright chromium)로, ②는 빌드 1회 성공으로.
        지금은 **0장이 아니므로 이 사유는 더 이상 적용되지 않는다.**
        ⚠ 남은 사실 하나: 타입오류 3229건은 **그대로다.** 빌드가 서는 것과 타입이
          깨끗한 것은 다른 일이고, 이번에 푼 것은 앞의 것뿐이다 (D-381).
  expected_when_unlocked: |
    E2E-1(화재) · E2E-2(침수) 의 화면 단계마다 역할 1개 이상.
    최소 대상: 로그인 · 대시보드 · 이벤트 목록 · 이벤트 상세(영상 구간) · 보고서.

screens:
  # ★ 아래는 `scripts/capture_screens.py` 가 **실행하면서 직접 쓴다.** 손으로 고치지 말 것 —
  #   손으로 옮겨 적으면 이벤트 id 하나가 어긋나는 날 인덱스가 거짓말을 하고,
  #   그 거짓말은 고객이 보는 자리에 실린다 (D-284).
  #
  #   ★★ [실측 2026-09-16 · 턴 R] **생성기가 이 대장을 지웠다.** U3 차선이
  #     `capture_screens.py` 를 돌리자 이 파일이 **이번 실행분 2항목만 남기고** 다시
  #     쓰였다 — 32 → 2. 짝인 `run_log.json` 도 같이 지워졌다(1,513B → 232B).
  #     디스크의 PNG 30장은 그대로 남았으므로, 그 순간 그것들은 전부
  #     **「출처 없는 캡처」**가 되었고 `verify_screens` 가 30건으로 멈춰 세웠다.
  #     게이트가 먼저 알아냈다 — 커밋 ③이 그 자리에서 막혔다.
  #
  #     조율자가 **HEAD + 이번 턴 갱신분**으로 다시 세웠다(턴 Q 의 인구조사와 같은 처방).
  #     생성기 출력만 남기면 **지워진 것이 지워진 줄 모르게 된다.**
  #     ⚠ 위의 「손으로 고치지 말 것」과 어긋나 보이지만, 여기서 한 일은 내용을 짓는 것이
  #       아니라 **덮어쓰기를 되돌린 것**이다. 다시 찍힌 두 항목만 이번 턴 판을 얹었다 —
  #       PNG 가 09-16 것인데 09-07 시각을 달면 그것이야말로 이 파일이 막으려는 거짓말이다.
  #     ⚠ 남은 결함(다음 턴): `capture_screens.py` 가 **누적하지 않고 덮어쓴다.**
  #       그 생성기가 고쳐지기 전까지 이 파일을 건드리는 실행 뒤에는 반드시 항목 수를 센다.
  #
  #   전부 **브라우저가 실제로 지나간 화면**이다. 이 실행체는 화면마다
  #   「그 화면에만 있는 글자」를 먼저 찾고, 못 찾으면 **찍지 않고 실패한다** —
  #   로그인으로 튕긴 뒤 찍은 PNG 도 파일은 생기므로, 「파일이 생겼다」를 성공으로
  #   두면 이 인덱스가 거짓말을 싣게 된다.
  #
  #   ★★ [실측 2026-09-07 · P-98] **앞선 33장은 전부 역할 없는 계정이 찍은 것이었다.**
  #     `gxprobe_e2e` 의 역할 목록은 비어 있다(`user.roles` = []). 그 벌은 「제품이
  #     된다」의 증거가 아니라 **「역할 없는 사람에게 무엇이 보이는가」**의 측정이었고,
  #     그 자체로 값이 있으므로 지우지 않고 옮겼다:
  #         docs/agent/evidence/P-98/denied/  (33장 · 판정문 FINDINGS.md 와 함께)
  #     이번 벌은 **역할을 실제로 가진 계정 넷**으로 다시 찍는다. 그래서 항목마다
  #     `viewed_by` 가 붙는다 — 「누가 봤나」를 인덱스가 말하지 않으면 같은 사고가
  #     또 난다. 그 한 칸이 없어서 33장이 넉 달치 인수 증거 행세를 했다.
  #
  #   ⚠ `user_role` 은 계정의 **역할 코드**다(fire_user·fire_admin·admin·
  #     view_only_-_anyang). `NO_ROLE` 이 보이면 그것은 화면의 사실이 아니라
  #     **계정의 사실**이고, 그 줄은 인수 증거가 아니다.
