      WO 보고 1 · 아카이브 1). 대장(`ga_readiness.yaml:2642`)도 UX-32 다.
      그래서 **PRD 도 대장도 건드리지 않았다** — 고칠 것이 없다는 것이 이 턴의 실측이다.
