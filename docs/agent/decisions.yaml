- id: D-363
  title: "비율 규정이 첫 턴에 작동했다 — 유지한다"
  status: decided
  raised_by: "세종(기획) 2026-09-10 · 대표 위임"
  decision: |
    ▣ 새 게이트 **1종만** 만들고 나머지는 기존 게이트가 증명 파일의 실재로 판정하게 한 것 —
      **D-353 비율 규정의 정확한 실행이다.**
    ▣ 목표를 초과한 턴에도 **계약이 0인 것을 그대로 적은 것**이 옳다.
    ▣ 분모가 85 → 90 으로 는 것: 절 분해가 진행되면 분모는 는다. **정상이고,
      늘었다고 적은 것이 정직하다.**
    ▣ [2026-09-10 이행] 이번 턴 **새 게이트 0종.** 지시서가 허용한 둘
      (폴리곤 경계 · 반출 부작위) 중 어느 것도 새 게이트로 만들지 않았다 —
      **기존 게이트가 이미 그 일을 하고 있었기 때문이다:**
        · 폴리곤 경계 → `verify_zone_polygon.py` 가 상수를 올리는 순간
          `test_f03_polygon_contract_ac` 를 **요구했다**. 새 게이트가 필요 없었다
        · 반출 부작위 → `test_clip_playback.py` 규약 ④가 이미 서 있다(D-306)
      새 도구는 **판정기 1종**(probe_gap_route_settlement.py)뿐이고, 그것은 게이트가
      아니라 **호출 측정기**다 — 지시(D-362)가 요구한 것이 측정이었다.
  enforced_by: |
