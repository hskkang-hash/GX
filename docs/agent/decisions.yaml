- id: D-291
  title: "E2E 3시나리오 체계 신설 — 계약 6차(2027.1) 통합시험을 지금부터 자동으로 쌓는다"
  status: decided
  raised_by: "세종(기획) 2026-08-30 · 대표 위임"
  decision: |
    계약 [별첨1] 8장의 시나리오 3종이 곧 통합시험 과녁이다. 그때 수동 시연을 하지 않기 위해,
    **커널이 하나 붙을 때마다 E2E 시나리오를 한 단계씩 늘린다. 끝에 몰아넣지 않는다.**

      E2E-1 화재    : 프레임 투입 → AI 탐지 → K1 이벤트 → F-04 판정 → K2 알림(30초) →
                      SDN QoS 요청(Mock·10초) → K3 대시보드(클릭→영상 3초) → K4 보고서 PDF
      E2E-2 침수    : 수위선 초과 → F-02 이벤트(30초) → 같은 구역 인명(F-03) 결합 → 등급 상향 →
                      등급별 수신자 그룹이 실제로 달라지는지
      E2E-3 통신두절: SDN 링크다운(Mock I-3) → F-08 이벤트(60초) → F-07 대체 경로 요청 →
                      F-13 정찰 프로파일 초안 + **비행 명령 미전송 단언**(spec_claim=0 유지)

    ▣ **공통 규약 (하나라도 빠지면 E2E 로 인정하지 않는다)**
      ① 실 마이그레이션 DB 에서 돈다 — --nomigrations 금지 (착시 ⑤ 대응, D-282 의 실전판)
      ② 격리 단언 포함 — 다른 테넌트 계정으로 전 단계 조회 시 0건. **읽기·쓰기 양방향**(D-290)
      ③ 양성 대조 포함 — 이벤트를 심지 않으면 이 E2E 가 실패하는가. 표본 최소 1건은 실물(D-289)
      ④ 저하 변형 포함 — 외부 의존을 죽인 상태에서 핵심 경로가 200 을 유지하는가
      ⑤ 시간 단언은 **논리 시계**로 — 실시간 sleep 금지. CI 에서 30초를 실제로 기다리지 않는다
      ⑥ 증거를 evidence/e2e/<시나리오>/ 에 남기고, 실패 시 **어느 단계에서 끊겼는지 표로** 낸다
         (D-274 "실패는 뒤를 가리지 않는다"의 E2E 판)

    ▣ **증분 규칙 — 커널 완료 시점마다 시나리오가 길어진다**
       K2 done → E2E-1 의 1~5단계 가동 · K6 done → 피드백 단계 추가
       K3 done → 7단계(대시보드) 추가 · K4 done → 8단계(보고서) 추가
       SDN 어댑터 → E2E-3 전체 가동
  enforced_by: |
    · backend/tests/e2e/e2e_contract.py 의 E2E_SCENARIOS 등재부 +
      backend/tests/e2e/test_e2e_contract.py — 공통 규약 ①~⑥ 을 **시험이 시험을 검사한다.**
      어느 E2E 가 격리 단언·양성 대조·저하 변형·논리 시계 중 하나라도 빠뜨리면 실패한다.
      규약을 문서에만 두지 않는다.
    · python scripts/verify_e2e_contract.py — 시나리오 3종의 **등재 집합**과 단계표를
      이름으로 잠근다(D-285 ②). 시나리오가 조용히 사라지면 exit 1.
    · E2E 는 --nomigrations 없이 돈다 — 실행 명령 자체가 규약 ①의 강제다
      (pytest tests/e2e -q -p no:randomly).
  affects: [K1, K2, K3, K4, K6, SDN, WP-DA2a, WP-DA2b, WP-DA2c, WP-DA3]

- id: D-292
  title: "세종 오판 인정 + Code 선행 착수 사후 승인 + D-210(실측 우선) 재확인"
  status: decided
  raised_by: "세종(기획) 2026-08-31 · 대표 위임"
  decision: |
    ▣ 오판: "K4 가 막힌다(OPEN-03 격리 결함 + 백필 필요)"는 **문서를 읽고 내린 판단**이었고
      실측하지 않았다. 실측하니 전제가 둘 다 틀렸다 —
       · 실행 중인 dj-core 의 BaseModel 이 **이미** group FK + CustomManagerGroup 을 갖고 있고
         (BaseModelWithGroup 은 같은 파일에 DEPRECATED)
       · report_template 의 살아 있는 13행은 **전부 소유가 채워져 있다**(NULL 4행은 전부 soft-deleted)
      → 기저 클래스 변경도 마이그레이션도 백필도 필요 없었다. AUTHOR-ERROR 로 기록한다(D-214).

    ▣ 선행 착수 인정: 승인을 기다리지 않고 K4 를 세운 것 — 절차상 앞서갔지만
      ① 전제가 틀렸음을 실측으로 증명했고 ② "전제가 다시 바뀌면 시험이 멈추게" 걸어 뒀고
      ③ 오판을 지우지 않았다. 셋이 다 있으므로 **사후 승인한다.**

    ▣ 재확인 D-210(실측 우선): 앞으로 기획이 내리는 전제 판단에도
      **"이 판정의 근거는 문서인가 실측인가"** 를 한 줄로 명시한다.
      문서 근거면 Code 가 실측으로 뒤집는다.
  enforced_by: |
    · backend/tests/test_k4_report_kernel.py 의 OpenIssuePremiseTest — 전제(dj-core BaseModel 이
      group FK 를 갖는다 · report_template 살아 있는 행의 소유가 채워져 있다)가 다시 바뀌면
      **시험이 멈춘다.** 오판을 지우는 대신 그 오판이 다시 서면 잡히게 한 것이 이 판정의 도구다.
    · docs/agent/evidence/W2-K4/open03_premise.md — 실측 근거를 문서가 아니라 증거로 남긴다.
  affects: [K4, D-210, D-214, DA-01 OPEN-03, P-ENV-3]

- id: D-293
  title: "종료된 판정을 지우지 않는다 — 지표가 스스로 좋아지는 구조를 금지"
  status: decided
  raised_by: "세종(기획) 2026-08-31 · 대표 위임 (P-K6-1 판정)"
  question: "K1.close_event 가 status 를 closed 로 덮어 판정(confirmed/rejected)이 사라진다. 둘 것인가 고칠 것인가?"
  decision: |
    문제: 종료된 판정을 지우면 오탐률이 시간이 갈수록 **저절로 좋아진다.**
    개선된 것이 아니라 나쁜 데이터가 사라진 것이다 — 착시의 새 얼굴이다.
    U1 의 "오탐률 월 하락"이 **판정을 종료하기만 해도** 달성될 수 있었다.

    판정: 종료 판정도 **보존**한다(soft-delete/아카이브, 물리 삭제 금지).
    오탐률은 **발생 코호트 기준**으로 계산한다 —
    이번 달 발생분의 오탐률은 다음 달에도 같은 값이어야 한다.

    구현: DetectionEvent.verdict 열 신설(마이그레이션 0018). status 는 수명주기로 남기고
    판정은 덮이지 않는 칸에 둔다. 오탐률은 verdict 에서만 센다 —
    **별도 집계 테이블을 만들지 않는다**는 DA-04 K6 의 요구는 그대로다(같은 행, 같은 경로).
    close_event 의 update_fields 에 verdict 가 **없는 것**이 보존의 보장이다.
    F-11(보고서) 트리거로서의 close_event 계약은 바뀌지 않는다.
  enforced_by: |
    · backend/tests/test_d293_cohort_regression.py — **같은 코호트를 두 시점에 계산해 값이
      동일한지** 확인하는 회귀 시험. 종료·soft-delete·신규 유입 셋을 지나가고, 값이 변하면 exit 1.
      양성 대조 포함(판정을 실제로 지워 값이 움직이는지 먼저 증명한다 — D-277).
    · backend/tests/test_k6_feedback_kernel.py 의 ClosedEventKeepsItsVerdictTest —
      종료 후에도 분모·분자·비율이 그대로인가. P-K6-1 을 닫는 시험이다.
    · docs/contracts/detection-event.md v1.1 불변규칙 6 — 계약 문서에 같은 문장이 박혀 있다.
  affects: [K1, K6, U1, F-14, P-K6-1, DA-01 F-14]

- id: D-294
  title: "침수 전용 이벤트 타입 신설 — 타입 부재는 설계 선택이 아니라 누락"
  status: decided
  raised_by: "세종(기획) 2026-08-31 · 대표 위임 (P-E2E-1 판정)"
  question: "E2E-2 의 수위 초과 신호를 기존 event_type 에 실을 것인가, 전용 타입을 만들 것인가?"
  decision: |
    기존 타입에 실어 보내지 않은 판단이 옳다 — **오탐률 분모가 오염되고 아무도 모른다.**
    F-02(침수·수위)는 계약 M 기능이므로 타입 부재는 **설계 선택이 아니라 누락**이다.

    판정: DetectionEvent.EventType 에 flood(침수)를 신설한다.
    계약 문서(docs/contracts/detection-event.md)를 v1.1 로 올리고 W2-3 색 규칙과
    배선 사전(detection_event_bridge)을 **같은 커밋에서** 함께 고친다.
    E2E-2 의 잠긴 2단계는 이것으로 열린다(3단계 ZONE 은 P-K2-2 로 계속 잠김).

    ※ 임계값은 코드에 박지 않는다 — 지점별 수위 기준선은 F-12 설정의 일이다(FR-02-2).
      여기서 정하면 그 값이 곧 F-02 의 AC 판정 근거가 된다.
  enforced_by: |
    · backend/tests/test_d294_event_type_separation.py — 오탐률·통계 집계가 **타입별로
      분리**되는지 시험. 한 타입의 판정이 다른 타입의 분모에 들면 exit 1.
      전체 = 타입별 합 대조와 양성 대조(필터가 실제로 거르는가)를 함께 본다.
    · 같은 파일의 test_the_contract_document_lists_it — 모델에는 있고 계약 문서에 없으면 실패한다.
      문서와 코드가 갈리면 어느 쪽이 계약인지 아무도 모른다(D-227 이 만든 상황).
    · backend/tests/e2e/test_e2e_2_flood.py — 2단계가 다시 닫히면 실패한다.
  affects: [K1, K6, E2E-2, F-02, W2-3, DA-01 OPEN-05, P-E2E-1]

- id: D-295
  title: "BaseModelWithGroup 을 제거하지 않는다 — 대신 신규 상속을 게이트로 막는다"
  status: decided
  raised_by: "세종(기획) 2026-08-31 · 대표 위임 (P-ENV-3 판정)"
  question: "DEPRECATED 인 BaseModelWithGroup 을 8개 앱에서 걷어낼 것인가?"
  decision: |
    상황: DEPRECATED 이지만 8개 앱 16개 모델이 상속 중이고, dj-core 는 §0.4 금지구역(D-207)이다.
    **제거 시도 금지.** 별칭 상태로 그대로 둔다 — 8개 앱 동시 수정은 이득 대비 위험이 크다.

    대신 **신규 코드에서 BaseModelWithGroup 상속 금지**를 게이트로 막는다.
    기존 16건은 허용 목록에 **개수가 아니라 이름으로** 등재한다(D-285 ②).
    개수로 잠그면 낡은 상속 하나가 지워질 때 새 상속 하나가 들어올 자리가 생긴다.
    목록에 없는 새 상속이 생기면 exit 1. 목록이 **줄어드는 것은 환영**이고 실패가 아니다.

    신규 모델의 정답은 언제나 BaseModel 이다 — 실행 중인 dj-core 에서 두 기저의
    격리 수준은 **같다**(D-292 실측).
  enforced_by: |
    · scripts/verify_model_inheritance.py — AST 로 전수를 세고 허용목록(16건, 이름)과 대조한다.
      --self-test 가 양성/음성 대조를 먼저 돈다(심은 위반을 잡는가 · BaseModel 은 안 잡는가).
      전수가 0건이면 통과가 아니라 **열거기 고장**으로 보고 exit 1 한다(D-271 ②).
    · .pre-commit-config.yaml 훅 gx-model-inheritance — 커밋 시점에 건다.
    · docs/agent/verify_gates.sh GATE deprecated-base — 게이트 러너에 등재.
  affects: [dj-core, P-ENV-3, D-207, D-285, 전 앱]

- id: D-296
  title: "P-K6-3(KPI 계측 적재처) 판정 보류 — 근거 부족"
  status: pending
  raised_by: "세종(기획) 2026-08-31 · 대표 위임"
  decision: |
    회신에 항목명만 있고 내용이 없어 판단 근거가 없다. **모르는 것을 판정하지 않는다.**
    다음 회신 첫머리에 **한 줄 요약 + 선택지 + 권고**를 붙여 재제출하면 즉시 답한다.
    이것은 지연이 아니라 절차다 — 근거 없이 찍은 판정이 나중에 더 비싸다.
  enforced_by: |
    · backend/kernels/k6_feedback/services.py 의 kpi_series — 구현하지 않고 NotImplementedYet 을
      던진다. 조용히 0 이나 빈 dict 를 돌려주지 않는다(D-284) — 표본 없는 p95 는 만들어진 수다.
    · backend/tests/test_k6_feedback_kernel.py 의 HonestAbsenceTest — 그 자리가 성공을
      반환하기 시작하면 실패한다. 보류가 조용히 "구현됨"으로 바뀌는 것을 막는다.
    · docs/agent/decisions_pending.yaml 의 P-K6-3 — 재제출 형식(요약+선택지+권고)이 적혀 있다.
  affects: [K6, U4, W4-1, P-K6-3]

- id: D-297
  title: "실행 순서 재편 — F-09~F-12 를 SDN 앞으로. ⑦은 개발 블로커가 아니라 계약 블로커"
  status: decided
  raised_by: "세종(기획) 2026-08-31 · 대표 위임"
  decision: |
    SDN 어댑터는 **개발로 풀 수 없다.** 에스비 SDN API 명세 미수령(계약 3조2항, 기한 2026-08-25 경과).
    "Mock 조차 I-1~I-5 의 필드 이름과 타입이 있어야 만들 수 있다"(DA-02 §0) — 맞다.
    추측 필드 위에 어댑터를 만들면 재작업이 확정되고 D-280 위반이다. **만들지 마라.**

    순서 개정:
      기존: … ⑦ SDN 어댑터 → ⑧ F-09~12 → ⑨ 릴리스 후보
      개정: … ⑦′ **F-09~F-12 조립**(지금 가능) → ⑧′ E2E-1·E2E-2 완주 →
            ⑨′ **릴리스 후보(SDN 제외판)** → [명세 수령 후] SDN 어댑터 → E2E-3 → 전체판

    **"릴리스 후보(SDN 제외판)"을 정식 산출물로 인정한다.** 화재·침수 시나리오는 SDN 없이
    완결되므로 에스비에 보여줄 것이 생기고, 그 자체가 명세 독촉의 지렛대다.
    ⑦ 블로커는 기술 항목이 아니라 **계약 항목**으로 이관 — 대표 조치 대기.

    ▣ 2026-08-31 추가(대표 지시): SDN API 는 다음 지시가 있을 때까지 **제외**하되,
      **연결할 수 있는 표준은 사전 작성**한다. 명세 없이도 확정 가능한 것(DA-02 §3)만이다:
      포트 인터페이스·우리 쪽 요청 의도·수령 요건 목록·오류 계약·갈아끼우기 자리.
      엔드포인트·필드 이름·타입·오류 코드·Mock 은 **만들지 않는다.**
  enforced_by: |
    · backend/adapters/sdn/ — 포트(backend/adapters/sdn/port.py)와 수령요건(backend/adapters/sdn/requirements.py)만 선다. 부르면
      SpecNotReceived 로 **왜 못 하는지 말하며 멈춘다**(조용한 성공 금지 · D-290).
    · backend/tests/test_sdn_port_standard.py — 표준이 섰는가 **그리고 그 이상을 만들지
      않았는가**를 함께 잰다: Mock 부재 · URL 0건 · 결과코드 열거 0건 · I-3 통보 불투명 유지 ·
      비행 명령 메서드 부재(AC-13 부정 조건). 하나라도 어기면 exit 1.
    · backend/tests/e2e/e2e_contract.py 의 kernel_present — 모듈이 KERNEL_READY=False 를
      선언하면 없는 것으로 본다. 파일이 생겼다고 E2E-3 이 의무가 되지 않는다.
      올리는 순간 E2E-3 전체가 의무가 되므로 **거짓 선언이 통하지 않는다.**
    · scripts/verify_e2e_contract.py 의 not_ready_declarations — NOT_READY_REASON 이 비면 exit 1.
      "안 됐다"는 말은 사유를 요구한다(D-264).
  affects: [SDN, F-06, F-07, F-08, F-09, F-10, F-11, F-12, E2E-1, E2E-3, DA-02, D-280]

- id: D-298
  title: "공공 Data API 29종 선별 — 제품 기능 관련 11종만 .env.example 에 등재 + 융합 규칙 2종"
  status: decided
  raised_by: "세종(기획) 2026-08-31 · 대표 위임"
  decision: |
    【등재 — .env.example 로 커밋】(실값 금지, 변수명과 설명만 — D-204)
     P0 : 기상청 API허브 키 · 포털 일반키(인코딩/디코딩) · 기상특보(23)★ ·
          단기예보(27) · 중기예보(25) · CCTV·재난안전정보(11)
     P1 : 주소정보 연계(9)★ · 특일정보(24) · 학교위치(3/29) · 국립공원(5) · 아동센터(6)

    【제외】NEIS · 대구교육청 · Open DART · 국세청 · 금융위 4종 · 관세청 · 가맹사업 ·
          소상공인 상가 · 범죄정보(개인정보 부담) — 제품 도메인과 무관
    【P2 예약】건축HUB(18) · 토지이용규제(19) → 시설물 App(향후 슬롯). 계약 범위 밖
    【사업개발용·저장소 밖】조달청 나라장터 3종(14/15/21)

    ★ 신규 융합 규칙 2종:
     FX-5 주소 자동 변환 — 이벤트 좌표 → 도로명 주소. F-10 알림·F-11 보고서에 사람이 읽는
          위치가 들어간다. **K4 완료 후 즉시 착수 가능**으로 예외 인정.
     FX-6 휴일 인지 알림 — 특일정보로 공휴일 판별 → 수신자 그룹·에스컬레이션 분기. 2027.2.

    ▣ 키는 파일에 쓰지 않는다. 대표 지시는 "env 파일에 기록"이었으나 실값을 저장소에 넣으면
      D-204 위반이자 유출이다. .env.example 에는 **변수 이름과 설명만** 넣고, 실값은
      vault → 로컬 .env(gitignore)로 간다. 결과는 같고 안전만 더해진다.
    ▣ 엔드포인트 미상 항목은 포털 "활용신청 상세"에서 **실측해 채운다. 추정 금지(D-280).**
      확인 전에는 빈 값으로 두고 **어댑터를 만들지 않는다.**
    ▣ 코드 착수 시점은 종전대로 2027.2(K7 구간). FX-5 만 예외.
  enforced_by: |
    · backend/.env.example — 11종을 변수명과 설명만으로 등재. 실값 0개.
    · docs/agent/verify_gates.sh GATE secrets — **신규 키 형태 2종을 추가했다**:
      ① 변수 이름에 KEY 가 없어도 값 안에 인증키가 박힌 경우(..._URL=...?serviceKey=<실값>)
      ② 포털 인증키 형태(인코딩본 %2B·%3D%3D / 디코딩본 base64 60자+)
      게이트가 판정 전에 **자기시험**을 먼저 돈다 — 심은 실값 2건을 잡고 빈 값·공개 URL·
