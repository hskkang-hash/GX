- id: D-384
  author_tree_id: "지시서 D-384"
  title: "표적 셋 이행 — 잠자는 기능 **326건** · 스크린샷 **3장** · 영상 백업은 **이미 측정돼 있었다(정정)**"
  status: decided
  raised_by: "Code 2026-09-12 (지시 D-384 이행) · 세종 판정 위임"
  decision: |
    ▣ ① **잠자는 기능 전수** — 건수는 D-377 에 있다. 여기에는 **켠 것과 안 켠 것**을 적는다.

      ★★ **켠 것: 감사 로그 보존기간 집행** (㉡ · 주석으로 꺼져 있던 자리)
        core.logger.tasks.purge_old_audit_logs 가 **이미 있었다**(dj-core).
        beat 표에 주석으로 꺼진 채였고 **끈 사유는 어디에도 없었다.**
        common.ops_audit_purge_beat 로 감싸 03:10 에 등록했다 — **기본 켬**.

        ★ 왜 백업(D-375)은 끄고 이것은 켜는가 — **두 질문이 다르기 때문이다**:
            백업 : 「어디에 얼마나 오래 쌓을 것인가」 — 제품 안에 **답이 없다** → 끈다
            정리 : 「감사 로그를 며칠 보관할 것인가」 — 제품 안에 **이미 답이 있다**
                   (System > security.audit_log_retention_days, 기본 90) → 켠다
          꺼 두는 것은 **고객이 정한 보존기간이 아무 일도 하지 않는다**는 뜻이고,
          그것이 바로 착시 ⑨ 다. 켜는 것이 그 설정을 처음으로 뜻있게 만든다.
        ★ 감싼 이유 셋: 몇 건을 지웠는지 적기 위해 · 끄는 손잡이를 두기 위해 ·
          그리고 dj-core 를 한 줄도 고치지 않기 위해(§0.4).

      ★★★ **그리고 그 시험이 첫 실행에 D-373 의 결함을 잡았다** [실측 2026-09-12]
        test_every_beat_entry_points_at_a_registered_task 가 세 줄을 뱉었다:

            ops-monitor-3signals:  common.ops_monitor_beat 이 등록된 태스크가 아니다
            ops-backup-daily:      common.ops_backup_beat 이 등록된 태스크가 아니다
            ops-audit-purge-daily: common.ops_audit_purge_beat 이 등록된 태스크가 아니다

        celery 의 autodiscover_tasks() 는 각 앱의 **tasks.py 라는 이름만** 읽는다.
        우리 태스크는 common/ops_tasks.py 에 있었고 common/tasks.py 는 없었다 —
        그래서 그 모듈은 워커에서 **한 번도 import 되지 않았고**, @shared_task 는
        실행되지 않았으며, beat 는 매일 없는 이름을 부를 참이었다.

        ▣▣ **즉 D-373 이 「주기를 등록했다」고 보고한 감시·백업은 실제로 돌지 않았다.**
          beat 표에 줄이 있고, 태스크 함수가 있고, 시험은 함수를 직접 불러 통과했다.
          셋 다 초록이었다. **착시 ⑨ 를 잡으러 만든 시험이 착시 ⑨ 를 잡았다.**
          고침: backend/common/tasks.py (celery 가 찾는 이름의 자리).
          ★ apps.py::ready() 에 import 를 넣지 않은 이유 — 그 함수는 본문 전체가
            try/except Exception 이라 **import 실패가 조용히 지나간다.** 방금 고친
            바로 그 실패의 다른 판이 된다.

      ★ **안 켠 것과 그 사유** (켜기만 하고 안 도는 것은 착시 ⑨ 의 재발이다):
        · flight_log.tasks.fetch_flight_log_data_from_opensearch — 사유 **둘**이다.
          이 환경의 OpenSearch 는 opensearch.invalid 라 닿지 못하고 [실측],
          ★ 더 중요한 것: **그 주석은 켜도 안 돌아간다.** flight_log.task… 가 오타이고
            실제 모듈은 flight_log.tasks 다(task.py 는 없다). 그대로 풀면 beat 가
            15분마다 NotRegistered 를 낸다 — **꺼진 것이 틀린 것을 숨기고 있었다.**
            이름만 고쳐 두고 끈 채로 둔다. 켜는 날 오타부터 다시 만나지 않도록.
        · delivery·orders 의 태스크 — §0.4 금지구역. 목록만 낸다.
        · 나머지 ㉡ 은 **주기가 없는 것이 아니라 배선이 없는 것**이다(㉠ 성질):
          upload_operational_log_{drone,robot}_task 는 서비스가 **import 만 하고
          부르지 않는다** [실측]. 고칠 방법이 등록이 아니라 배선이므로 여기서 켜지 않고
          목록으로 보고한다 — **셋을 한 수로 합치지 말라**(D-377)는 규약 그대로다.

      ★ ㉢ 2건(OPS_BACKUP_DIR · OPS_BACKUP_SCHEDULE_ENABLED)은 **D-375 가 일부러
        비운 것**이다. 판정기가 그 둘을 정확히 집어낸 것이 판정기의 양성 대조가 됐다.

    ▣ ② **빌드 1회 성공 → 스크린샷 3장** — **0/16 → 3/16** [실측]
      순서대로: lock 실측(→ 없음 · D-381) → 빌드 1회 성공(66초) → 브라우저 구동체 세움
      → **화면 셋 캡처.** 캡처는 scripts/capture_screens.py 가 로그인부터 지나가며
      화면마다 「그 화면에만 있는 글자」를 확인한 뒤에만 찍는다 — **단언이 캡처보다 먼저다.**
      로그인으로 튕긴 뒤 찍은 PNG 도 파일은 생기고, 「파일이 생겼다」를 성공으로 두면
      이 인덱스가 거짓말을 싣게 된다.
      · verify_screens.py 통과 (3장 · run_log 와 ±5분 대조 · 브라우저 오류 0건)
      · ★ 첫 시도에서 **화면이 결함을 잡았다** — /api/dsm/events 500. D-378 참조.
      · ★ 씨앗을 심을 때 **격리를 끄지 않았다.** 1차판은 group 없이 심었고 세 화면이
        전부 「0건」·「404」로 찍혔다 — 테넌트 좁히기가 **제대로 걸린 결과**다(F-09).
        격리를 끄는 대신 계정에 소속을 주고 그 소속으로 심었다.
      · ★ 씨앗은 시험 데이터뿐이고 끝나면 지운다(D-347 ④). 실제 영상 프레임 0건.

    ▣ ③ **영상 백업 — ★ 정정한다. 「두 턴 미측정」이 아니었다** (D-379 · D-322)

      ★★ **지시서의 전제가 틀렸다.** 「지난 두 턴 미측정으로 남았다」고 적혀 있으나,
        착수 전에 뒤졌더니 **이미 측정돼 있었다**:

            docs/agent/evidence/D-356/restore_objects_run.md  [실측 2026-08-29]
              뜬 객체 3개 · 4,992 B · 되살림 3개 · **해시 일치 3개**
            ga_readiness.yaml :: OPS-09 「백업·복구 — 영상 객체저장」 = **구현**

        ▣▣ 이것이 이번 턴 **네 번째 「이미 있음」**이다(D-379 표). 그리고 앞의 셋과
          성질이 다르다 — 앞의 셋은 **코드가** 이미 있었고, 이번 것은 **측정 자체가**
          이미 있었다. 「미측정」이라는 진술을 인용하기 전에 대장을 봤어야 했고,
          그 확인이 D-322(태그 없는 수는 인용을 거부한다)의 정확한 집행이다.

      ★ 그러면 이번 턴에 한 것은 무엇인가 — **재현**이다 (D-344). 그것도 값이 있다:
        · [실측 2026-09-12] **이 환경에서는 닿지 못했다** — 지시가 예상한 그대로 ㉢ 이었다:
            MINIO_ENDPOINT=minio.invalid · MINIO_ACCESS_KEY=dummy → 이름 풀이부터 실패
          즉 D-356 의 초록은 **그때 그 환경의 사실**이었고, 이 환경에서 저절로 서지 않는다.
        · MinIO 를 세우고 다시 쟀다. **같은 답이 나왔다** [실측 2026-09-12]:
              백업  ops_backup.py --objects → 객체 3개 · 30,720 B · 범위 event_bound · 보존 90일
              복구  ops_restore.py --objects-only → 대상 3 · 되살림 3 · **해시 일치 3**
              (원본 버킷에는 쓰지 않았다 — 새 버킷 → 해시 대조 → 삭제)
        · ★ 그리고 **다음에도 잴 수 있게** 발판을 남겼다 — `scripts/probe_video_backup.py`.
          D-356 이 쓴 씨앗은 그때뿐이었고, 그래서 이번 턴에 「미측정」으로 보였다.
          **잴 수 없는 초록은 다음 턴에 미측정과 구별되지 않는다** — 그것이 이 발판의 이유다.

      ★ 잰 뒤 만든 것을 전부 지웠다(`--clean`). 남은 것은 대조표와 증거 문서뿐이고,
        재기 위해 만든 blob 은 저장소에 넣지 않았다.
      ★ 용량은 여전히 **영상이 전부다** — DB 1.81 GB/년은 문제가 아니다(D-374 실측 유지).
      ★ OPS-09 의 상태는 **바꾸지 않았다.** 이미 구현이었고 재현이 그것을 확인했을 뿐이다 —
        같은 절을 두 번 세면 진척률이 거짓으로 오른다.

    ▣ 하지 않은 것 (D-300 부작위): 타입오류 3229 정리 · 나머지 화면 13개 ·
      8종 매핑 추측 채우기 · ㉠ 314건의 배선(목록만 냈다) · 자동 복구.
