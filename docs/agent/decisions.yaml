- id: D-252
  title: "격리 즉시 통제 = 플래그 우선 (중대 발견)"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 3차 §1) — W0-14 파일럿 실측에 대한 대표 판정"
  decision: |
    발견: 역할 회수 없이 `TENANT_TRUST_LEGACY_SUPERUSER=False` 한 줄로 son 의 누출이 15 → 0 이 됐다
          (evidence/W0-14/pilot_scope_stream_monitors.md §2).
    결정: 격리 **1차 통제는 플래그**로 한다 — 즉시·가역·업무 무중단.
          13계정 역할 회수(W0-16)는 위험한 **선행조건이 아니라 뒤따르는 정리 작업**으로 재순위한다.
          이로써 D-243 의 무중단 우려는 대부분 해소된다.
    단서: **운영 플래그 전환은 W0-13 백필 완료 후**다 (D-254 — orphan 손실 방지).
          로컬·파일럿은 이미 검증됐다.
  affects: [W0-14, W0-16, W0-13, WP-2]

- id: D-253
  title: "P-W0-14-2 승인 — 격리 시험 '배선'만 수정 (A안)"
