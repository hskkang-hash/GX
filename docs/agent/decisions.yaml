#
#   이번에는 **어긋난 것이 없다.** 지시서가 D-377 부터 시작했고 이 트리의 다음 가용
#   번호도 D-377 이었다 — 지난 턴에 D-369~376 으로 이어 둔 결과다.
#
#       지시서 D-377 → 이 트리 D-377      지시서 D-381 → 이 트리 D-381
#       지시서 D-378 → 이 트리 D-378      지시서 D-382 → 이 트리 D-382
#       지시서 D-379 → 이 트리 D-379      지시서 D-383 → 이 트리 D-383
#       지시서 D-380 → 이 트리 D-380      지시서 D-384 → 이 트리 D-384
#
#   ⚠ **1:1 인 것도 대응표에 적는다.** 「어긋났을 때만 적는다」로 두면, 다음에 표가
#     없는 턴을 보고 「대조를 안 한 것」인지 「대조했는데 같았던 것」인지 알 수 없다.
