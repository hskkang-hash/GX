- id: D-439
  author_tree_id: "조율자 병합 판정 · 세종 지시서 턴 C §1 P-42·P-44"
  title: "게이트가 **자기가 본 곳에서만** 재고 있었다 — 그리고 잠든 것을 적은 도구가 잠든 것을 깨울 뻔했다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 TC · 턴 C 병합"
  decision: |
    ▣ **`verify_dormant` 의 눈을 고쳤다 — 주장보다 좁게 재고 있었다.**
      차선 E 의 `common/front_line.py` 함수 셋이 「잠들었다」로 나왔는데,
      `scripts/ops_front_line.py` 가 **셋을 전부 부르고 있었다** — 그 파일이 앞단(nginx)
      설정을 만들어 내는 우리 운영 도구다.
      뿌리는 코드가 아니라 **판정기의 눈**이었다: 독스트링은 「**운영 코드가** 그 이름을
      부르지 않는다」라고 적어 놓고 참조를 **`backend/**` 안에서만** 찾고 있었다.
      → 참조 스캔만 `scripts/**` 로 넓혔다. **모수는 안 넓혔다** — scripts 의 함수까지
        모수에 넣으면 판정기·프로브의 내부 도우미가 「잠들었다」로 쏟아지고 **그 소음이
        진짜 하나를 덮는다.** **넓히는 것은 보는 눈이지 재는 대상이 아니다.**
      ⚠ 이것은 게이트를 무르게 하는 변경이 아니다. 무르게 하는 것은 「부르는 곳이 없는데
        통과시키는 것」이고, 이것은 「부르는 곳이 있는데 못 보던 것을 보는 것」이다.

    ▣ ★★★ **첫 판은 너무 무뎠고, 그것을 잡은 것이 이 결정의 값이다.**
      맨이름 등장으로 세었더니 **13건이 깨어났는데 여럿이 가짜**였다:
        · `probe_commented_guards.py` 는 `oauth2_required` 를 **감사 대상으로 찾는다** —
          부르는 것이 아니라 **찾는** 것이다. 그것을 「부른다」로 세면 **정반대**다.
        · `classify_dormant.py` 는 **잠든 이름을 나열하는 도구**다. 맨이름으로 세면
          **잠든 것을 적어 둔 도구가 잠든 것을 깨운다 — 판정기가 자기 꼬리를 문다.**
        · `setUp` 같은 흔한 이름은 아무 도구에나 있어 backend 의 동명이인을 전부 깨운다.
      → `from <모듈> import <이름>` 과 `import <모듈>` + `<모듈>.<이름>` **만** 인정한다.
        **가져오는 것은 쓰겠다는 선언이고, 이름을 적는 것은 아니다.**
        결과 깨어난 것은 **2건**이고 **둘 다 진짜**다(`models_touched` — 도구가 실제로
        import · `video_analysis_post_save` — 차선 C 가 시그널을 켰다).
      ★ 그 둘을 기준선에서 걷어냈다(319 → 317). **그 파일은 줄어들기만 한다** —
        「여기서 이름이 빠지는 것이 「켰다」는 뜻이다」.
      ★ 그리고 **매 실행에 무엇을 부르는 쪽으로 셌는지 적게 했다** —
        그 줄이 없으면 「부르는 곳이 없다」가 **「내가 본 곳에 없다」와 구별되지 않는다.**

    ▣ **두 차선에 걸친 자리는 조율자가 맞춘다.**
      `EntrySurfaceIsLocked` 가 36 vs 38 로 빨개졌다 — 차선 S 와 E 가 각자 라우트를 얹고
      **각자 자기 것만** 등재했다. 조율자가 LAW-02·03 두 라우트를 사유와 함께 등재했다(12 passed).
      ★ **이것이 그 시험이 병합 때 빨개지는 이유이자 값이다** — 진입면은 계약이고,
        계약을 넓히는 손은 한 곳이어야 한다.

    ▣ **분모 127 → 129** (세종 보고 대상):
      · **`LAW-02a` 영상 보존 일수 선언**(hand: in) — 차선 E 제안 채택.
        닫는 조건 둘 중 **둘째가 진짜다**: 「적었다」가 아니라 **「그대로 지운다」**까지.
        **선언만 하고 삭제가 그 수를 안 보면 안내판은 여전히 거짓말**이고, 그때는 그 거짓말이
        **법적 효력을 가진 문서**로 걸려 있다.
      · **`OPS-13a` 앞단이 뒷단의 워커 재활용을 삼킨다**(hand: in) — 502 3건/3,600.
        **하지 말아야 할 것 넷**을 절의 내용으로 함께 적었다(전부 재서 나온 것이다).
      ★ 둘 다 **잠금이 아니라 절**로 등재했다. 차선 E 의 논거를 채택한다:
        「잠금은 *우리가 만들 수 없는 값*이거나 *남이 고쳐야 하는 코드*에 쓴다.
         **손 안의 일을 잠금으로 적으면 「못 하는 일」로 보이고, 못 하는 일 목록은
         아무도 손대지 않는다.**」

    ▣ **낡은 프로세스가 게이트를 속인다 — 「낡은 입력」의 셋째 얼굴.**
      게이트가 때리는 8000 runserver 가 **이번 턴 코드 이전**이라 차선 S 의 침투 항목
      하나가 FAIL 이었고, 차선 Q 의 CORS 고침도 안 실려 있었다. 조율자가 다시 띄우자
      둘 다 풀렸다. 앞의 둘은 **낡은 인벤토리**(D-430)와 **낡은 증거**(D-429)였고,
      이번은 **낡은 프로세스**다. 셋 다 같은 문장으로 묶인다:
      **게이트가 읽는 것이 늙으면 게이트도 늙는다.**

    ▣ [실측] 세 수 — 상용 **78.5%**(129) · 손 안 도달율 **86.0%**(98/114) · 구현 **98**.
      단위 **918 passed** · E2E **23 passed** · 게이트 **14종 전부 초록**.
      ⚠ 중간에 단위 시험이 `DuplicateDatabase` 8 errors 를 냈는데 **조율자가 앞 실행이
        도는 중에 하나를 더 띄운 것**이었다 — 코드 결함처럼 보이는 환경 충돌(P-18).
        test DB 를 지우고 다시 돌려 918 passed 로 확인했다.
  enforced_by: |
    · scripts/verify_dormant.py :: ref_only_trees (가져온 이름만) · 부르는 쪽 출력 한 줄
    · docs/agent/evidence/D-377/dormant_baseline.txt (319 → 317)
    · backend/tests/test_f05_event_api.py :: EVENT_ENTRY_SURFACE + LAW 라우트 둘
    · docs/agent/evidence/D-346/ga_readiness.yaml :: LAW-02a · OPS-13a (분모 129)
    · docs/agent/evidence/DA-05/blockers.yaml :: MENU_REGISTRY… 해소 · 제목 정정(131행)
  affects: [D-286, D-301, D-314, D-327, D-346, D-377, D-400, D-429, D-430, D-434, D-435, D-437, D-438]

