- id: D-256
  title: "DA-01 · DA-03 · DA-04 승인 — WP-DA1 설계 정본 확정 (P-DA-1/3/4 동반 확정)"
  status: decided
  raised_by: "대표 2026-08-27 — human_gate 3건에 대한 판정"
  decision: |
    DA-01(요구사항정의서) · DA-03(화면설계안) · DA-04(공유커널 API스펙)를 **승인**한다.
    셋 다 status → done. 승인 표시는 대표 지시 대행으로 에이전트가 기입했다.

    ★ **승인은 그 문서들이 딛고 선 기본값 3건을 함께 확정한다.** 문서가 이미 그 위에 쓰였으므로
      따로 답하지 않으면 승인의 의미가 정해지지 않는다:
        · P-DA-1 → **A**. U 매핑의 정본은 **정의 원본**(GuardianX_상품화_개발방안_20260822.pdf §2)이다:
                   U1=이벤트 증거화 · U2=보고 자동화 · U3=3계층 대시보드 · U4=격리·계측 봉인.
                   지시서 §1 의 "U1↔F-11 · U2↔F-10" 한 줄이 밀린 것이고, 같은 지시서의 v2.1
                   커널 절과 D-246 은 이미 원 정의를 쓴다. **지시서 §1 을 정정 대상으로 남긴다.**
        · P-DA-3 → **C**. ReportTemplate 은 지금 문지기(assert_scoped) 유지 + **격리 시험
                   레지스트리 등록만** 한다. BaseModelWithGroup 전환은 K4 착수 시(WP-DA2c)
                   백필과 함께 — A(지금 전환)는 WP-2 EXIT 를 늦추고 그것이 전체 일정을 민다.
                   `dashboard.DashboardPanel` 미등록도 같은 성격이므로 함께 처리한다.
        · P-DA-4 → **A**. "5상태"는 **화면 상태 5종**(기본/로딩/빈/오류/권한없음)이다.
                   계약 [별첨 1] F-09 AC 원문이고 변경은 양 당사자 서면 합의를 요한다.
                   재난 등급은 F-04 의 3종(주의·경계·심각)이며 그중 심각이 F-06 발동 조건이다.

    ⚠ **승인이 OPEN 을 지우지 않는다.** DA-01 §6 의 OPEN 7건 중 OPEN-07(F-10 GAP)만
      D-257 로 닫힌다. 나머지 6건(F-01 성능 목표치 · p95 부하조건 · 격리 결함 · U 매핑 문서정정 ·
      열거값 절차 · 명세 미수령)은 **WP-DA2a ENTRY 의 입력**으로 이월한다.
  affects: [DA-01, DA-03, DA-04, WP-DA1, WP-DA2a]

- id: D-257
  title: "P-DA-2 승인 (B안) — F-10 알림(K2) 티켓 즉시 등재"
  status: decided
  raised_by: "대표 2026-08-27 — P-DA-2 에 대한 판정"
  decision: |
    상황: 계약 필수(M) 기능 F-10(알림 발송)에 대응하는 정본 티켓이 **0건**이었다.
          지금 정본대로 전부 done 이 되어도 F-10 은 구현되지 않는다.
          이 GAP 은 DA-04 가 커널 매핑을 **기계로** 대조했기 때문에 드러났다 —
          손으로 셌으면 6/6 으로 보였을 것이다.
    결정: **지금 등재한다** (B안). 티켓 `DA2-21` · P0 · WP-DA2b(11월) · status=backlog.
          코드 착수는 여전히 WP-2 EXIT 후이므로 A안(착수 시 등재)과 실질 차이가 없고,
          **등재해 두면 잊히지 않는다.** 계약 필수 기능이 정본에서 빠진 상태를 유지하는 것이 위험이다.
    후속: DA-04 §2·§3·§4 의 GAP 표기를 함께 정정했다 (GAP 이 있었다는 사실은 지우지 않는다).
          `python scripts/verify_kernel_map.py` → **커널 6/6 배정 · 대조 통과**.
    ⚠ 미해결 선행: 외부 발송 업체(SMS·푸시) 선정은 계약·비용 사안이다 (DA-04 D4-1).
      기한을 **WP-DA2b ENTRY(2026-10)** 로 못박았다. 미정이면 메일 채널만으로 착수한다 —
      AC "심각 30초 내 발송 기록"은 채널 종류와 무관하다.
    P-DA-2 status → answered (B).
  affects: [DA2-21, DA-01, DA-04, WP-DA2b]

- id: D-258
  title: "DA-05 등재 — 데이터 어댑터 4종 · K7 컨텍스트 커널 API 스펙 (지시서 v2.2)"
  status: decided
  raised_by: "대표 2026-08-27 — 지시서 v2.2 Code 지시의 미이행분 확인"
  decision: |
    상황: 지시서 v2.2 가 "DA-05 데이터 어댑터 4종·K7 API 스펙 등재"를 지시했으나
          tickets.yaml 에 `DA-05`·`K7` 문자열이 **0건**이었다 — 미이행.
    결정: `DA-05`(P1 · kind=doc · WP-DA1 잔여)로 등재한다. **문서만. 코드 0줄.**
          코드 착수는 2027.2~(WP-DA4) — 12월까지는 계약 M 기능에 집중한다(v2.1 규칙 2 유지).
          예외 1건: 10~12월에 **F-04 규칙 스키마의 `context` 필드만 예약**한다.
          나중에 스키마를 바꾸면 저장된 규칙을 전부 이관해야 하고, 그 비용을 지금 0 으로 만든다.
    ★ **K7 은 아직 `kernel:` 필드로 달지 않는다.** DA-04 매핑표에 K7 행이 없는 상태에서
      정본에만 K7 을 달면 verify_kernel_map.py 가 그것을 **보지 않는다** — 무검증 매핑이
      조용히 남는다(D-227 manifest 유실과 같은 실패 모양). 그래서 두 가지를 함께 했다:
        (a) DA-05 dod (6) 에 "K7 을 문서 표와 스크립트에 **함께** 편입" 을 조건으로 넣었다.
        (b) `scripts/verify_kernel_map.py` 에 **미지 커널 검사**를 추가했다 —
            화이트리스트 밖 코드가 정본에 있으면 exit 1. 주입 시험으로 동작 확인함.
  affects: [DA-05, WP-DA1, WP-DA4]

- id: D-259
  title: "WP-DA2 3분할 승인 — 월별 릴리스를 WP 경계로 (착수 조건 3건 포함)"
  status: decided
  raised_by: "대표 2026-08-27 — WP-DA2 구조에 대한 판정"
  decision: |
    상황: WP-DA2(F-01~F-14 구현)를 통으로 두면 대표 검토가 **3개월에 한 번**이 된다.
          그것이 v3.0 무인완주가 실패한 모양이고 D-215 가 기록한 위험이다.
    결정: 지시서 §5 의 **월별 증분 릴리스를 그대로 WP 경계**로 쓴다. 릴리스 = 검토 지점.
          · **WP-DA2a**(10월) 릴리스#1 — K1 이벤트 커널 + F-01~03 탐지 확장 + F-05 이벤트 API
          · **WP-DA2b**(11월) 릴리스#2 — SDN 어댑터 F-06~08(Mock→실기) + K2 알림 + K6 피드백
          · **WP-DA2c**(12월) 릴리스#3 — K3 대시보드 프레임 + K4 보고서 엔진 → F-09·11·12 + 검수
          · **WP-DA3**(2027.1) 통합시험·최종검수  · **WP-DA4**(2027.2~8) 안정화 + K7 + F-13/14
          ENTRY/EXIT 는 WP 마다 각각 — AGENT_LOOP v4.1 그대로.

    ★ **착수 조건 3건 (셋 모두 공통, 하나라도 빠지면 착수 금지):**
      (1) WP-2 EXIT — 누출 0건. 지시서 §5 Code 지시 (3) 그대로.
      (2) 대표 승인 — WP 마다 ENTRY.
      (3) **정적 계층 검사 CI 등재** — App(L4) 이 커널(L3) 모델을 직접 import 하면 실패.
          DA-04 §5 가 올린 조건을 여기서 착수 조건으로 승격한다. 이유: 커널 재사용률을
          **사람이 세면 항상 90% 가 나온다.** 이 규칙이 계약 8조 IP 경계의 코드상 표현이고,
          커널 로직이 App 으로 새면 경계가 코드에서 소멸한다.

    ★ **ID 대역**: DA2-1x = WP-DA2a / DA2-2x = b / DA2-3x = c. 기존 정본 ID 집합과 충돌 없음
      (`gen_manifest.py` 대조 통과 · 75→77). D-246 의 교훈을 대역 분리로 절차화한다.
      티켓 전건 등재는 **2026-09** — 지금은 F-10(DA2-21) 한 건만 (D-257).

    ★ **DA-02 blocked 가 F-06~08 을 인질로 잡지 않는다.** 어댑터 인터페이스 I-1~I-5 와 Mock 은
      에스비 명세와 **독립**이어야 한다 — 계약 9조2항이 "타 SDN 교체 가능"을 요구하므로
      그것이 원래 옳은 설계다. 인터페이스 확정은 WP-DA1 잔여(9월), 실기 결선만 명세 후.
  affects: [WP-DA2a, WP-DA2b, WP-DA2c, WP-DA3, WP-DA4, DA-02, DA2-21]

- id: D-260
  title: "격리 시험 대상 확대 착수 승인 — 판정 도구를 10종에서 전수로 (W0-14c 의 실제 남은 일)"
  status: decided
  raised_by: "대표 2026-08-27 — 계획 §4 (5) 승인"
  decision: |
    ★ **전제 정정이 먼저다.** 2026-08-24 정정본(evidence/W0-14/w0_14c_write_guards_and_correction.md)
      이 정본이다: **격리는 HTTP 레벨에서 버티고 있다.** 직전 보고의 "detail 5 · update 3 ·
      delete 5 누출"은 **시험 픽스처 오염**이었다(`acting_as()` 가 dj-core 의 created_by 자동
      채움을 못 덮어 tenant-B 레코드가 실제로는 tenant-A 소유였다). 남은 실패 3건은 누출이
      아니라 **응답 계약 위반**(Order 상세 500 · Terminal 수정 400 · Terminal 삭제가 성공이라
      거짓말)이고 셋 다 §0.4 금지구역 — W0-18 / P-W0-14-4 의 몫이다.

    결정: 그러므로 W0-14c 의 남은 일은 "648 라우트 부착"이 아니다. **판정 도구의 커버리지**다.
          격리 시험은 지금 **10종**만 본다(MODELS 레지스트리). 테넌트성 모델은 **131종**이다.
          보지 않은 121종에 대해 우리는 "누출이 없다"가 아니라 **"모른다"**고 말해야 한다.
          EXIT 조건 1(재현 누출 0건)은 **모수를 밝히지 않으면 판정 자체가 성립하지 않는다.**

    실행: 정적 생성기 `scripts/build_leak_targets.py` 를 만든다 —
          (a) 테넌트성 모델을 소스에서 열거하고
          (b) 기존 실측본 `evidence/W0-14/openapi_routes.json`(531 오퍼레이션)과 대조해
              모델별 단건 경로(detail·update·delete) 후보를 뽑고
          (c) 현재 MODELS 레지스트리와의 **커버리지 델타**를 낸다.
          결과가 W0-14c 의 작업 목록이자 EXIT 의 모수 근거가 된다.
    ⚠ **분류는 자동, 판정은 수동.** 생성기는 후보를 뽑을 뿐 "안전하다"고 말하지 않는다.
      자동 분류를 면제로 쓰면 PUBLIC_ROUTES 도피로(coverage.md §2)와 같은 착시가 된다.
    ⚠ 이 티켓은 **누출을 고치지 않는다.** 무엇을 보지 않고 있었는지를 세는 데까지다.
  affects: [W0-14, W0-3, WP-2]

# --- 2026-08-27 세종(기획) 위임 판정 — RESUME_NEXT 2026-08-27 ------------------
# 대표가 판정 권한을 세종에게 위임했다. 아래 6건은 대표 승인과 동일한 효력을 가진다.
# D-242 프로토콜: RESUME_NEXT 붙여넣기 = 결정 확정 + 계속 진행 승인.

- id: D-261
  title: "W0-13 백필 판정 — 갈래별 3분할 확정 (P-W0-13-1 · P-W0-13-2 답)"
  status: decided
  raised_by: "세종(기획) 2026-08-27 · 대표 위임 — dry-run 실측(evidence/W0-13/backfill_dryrun.md)에 대한 판정"
  decision: |
    **임계경로 해제.** W0-13 → W0-14c(652 확대) 로 바로 진행한다.
    30,200 행(group NULL)을 셋으로 가르고 각각 다르게 처리한다 — 전량 백필은 불가능하고
    그렇게 해서도 안 된다.

    (a) **부모 상속 가능 23,616행 → 적용.**
        소유가 부모 레코드에서 **결정론적으로 도출**되므로 추측이 아니다.
        (MissionWaypoint→SurveyMission 8,877 · OrderHistory→Order 5,696 ·
         승인체크리스트 3,013 · RouteTerminal→Routes 1,807 · created_by 소속 343 …)
        ★ 조건 3건 — 하나라도 빠지면 적용 금지:
          (1) dry-run 리포트 첨부 (D-209)
          (2) **역방향 롤백 스크립트 동시 작성** — 23,616행은 되돌릴 수 없으면 사고다
          (3) 사전 백업 (D-002)

    (b) **terminals.Terminal 3,399행 → 분할.**
        역추론 모호 0건이므로 **단일소유 1,809 적용**. 미사용 1,590 은 **백필하지 않는다** —
        채우면 소유자를 "추측"하게 된다.
        ★ 다만 **보류로 두지 않는다.** `tenant_unassigned` 로 **표기**하고, 격리 시험에
          "전역 관리자 외 어떤 테넌트에도 비노출"을 **기대값 단언으로 고정**한다.
          → 미분류가 조용히 남는 것이 아니라 **선언된 상태가 되고 시험이 지킨다.**

    (c) **공용 마스터(Timezone·Country·GridSetting 등) 약 2,000행 → 백필 금지 확정.**
        채우면 다른 테넌트 화면에서 국가·시간대·상태값이 사라진다.
        ★ 조치: `shared: true`(PUBLIC 분류)로 **면제대장에 명시 등록 + 근거 1줄씩.**
          격리 시험 기대값은 "전 테넌트 조회 가능" — 이것도 단언으로 고정한다.
          **PUBLIC 은 검사 면제가 아니라 "공용임을 시험으로 증명한 것"이어야 한다.**
    P-W0-13-1 · P-W0-13-2 status → answered.
  affects: [W0-13, W0-14, W0-3, WP-2]

- id: D-262
  title: "WP-2 EXIT 조건 1 재정의 — 시나리오 수가 아니라 '모델 커버리지'로"
  status: decided
  raised_by: "세종(기획) 2026-08-27 · 대표 위임 — D-260 실측(시험 9종 / 모델 131종)에 대한 판정"
  decision: |
    ★ **"누출 0건"이 거짓 완결이 될 뻔했다.** 시험이 보는 모델은 9종이고 테넌트성 모델은
      131종이다. 나머지 122종에 대해 말할 수 있는 것은 "누출 없음"이 아니라 **"모른다"** 다.
      이 상태로 EXIT 하면 **D-249 에서 고친 것과 똑같은 실수의 재발**이다
      (그때는 부착률, 이번엔 시나리오 수 — 둘 다 모수를 밝히지 않은 수다).

    기존: 재현 누출 0건 · 시나리오 5/5              ← 대상 9종에서만 성립. 불충분.
    개정 (EXIT 조건 1 은 아래 넷으로 대체한다):
      (1) 시나리오 5/5 green — 유지
      (2) **P0 6종 전수 격리 시험 통과(누출 0건)** — 신설, **EXIT 필수**
      (3) P1 17종 — 시험 계획 등재 + WP-2 EXIT 후 착수 일정 명시 (EXIT 필수 아님)
      (4) P2 99종 — **각각의 분류 사유를 문서로 첨부** (자동 면제 금지 — D-263)

    → **"우리가 무엇을 검증했고 무엇을 아직 모르는지"를 EXIT 문서가 스스로 말하게 한다.**
       에스비 검수의 "보안 점검 통과"(계획서 7장)도 이 문서로 답한다.
  affects: [WP-2, W0-3, W0-14, W0-13]

- id: D-263
  title: "P2 99종 자동 면제 금지 + 앱 단위 매칭 금지 (에이전트 경고 수용)"
  status: decided
  raised_by: "세종(기획) 2026-08-27 · 대표 위임 — D-260 §3-2 경고에 대한 판정"
  decision: |
    "라우트 없음"으로 자동 면제하면 **미분류가 면제로 위장하고, 시험은 초록이 되고 노출은 남는다.**
    93종은 같은 앱에 단건 경로가 있다 → **면제 불가.** `UNREVIEWED` 로 명시 등록하고 사유를 기재한다.

    ★ **측정 결함 시정**: `delivery` 12모델이 똑같이 "단건 23건"으로 나온 것은 **앱 단위 매칭**의
      산물이다. **앱 단위 매칭 금지** → **모델별 실경로 매칭**으로 재측정한다.
      **수가 커서 진척처럼 보이는 수는 버린다.**
  affects: [W0-14, W0-3, WP-2]

- id: D-264
  title: "커널 맵 게이트 강화 승인 — 미지 커널 검출 시 실패 (에이전트 선조치 인정)"
  status: decided
  raised_by: "세종(기획) 2026-08-27 · 대표 위임 — 2026-08-27 선조치에 대한 사후 승인"
  decision: |
    `verify_kernel_map.py` 가 K1~K6 만 알던 것을 **미지 커널(K7 등)에서 실패**하도록 고친 것,
    주입 시험(K7 주입 → exit 1 · 되돌림 → 통과)으로 확인한 것 — 전부 옳다. **정본으로 승격.**

    ★ **원칙화**: 검증 스크립트는 "아는 것만 통과"가 아니라
      **"모르는 것을 만나면 멈춘다"** 로 작성한다. 이후 모든 게이트에 적용한다.
  affects: [DA-04, DA-05]

- id: D-265
  title: "DA-02 기한 초과(8/25 → 2일) 처리 — Mock 우선 계속 · 서면 통지 발송"
  status: decided
  raised_by: "세종(기획) 2026-08-27 · 대표 위임 (서면 통지만 대표 직접 수행)"
  decision: |
    진행: SDN API 명세 미수령 상태이므로 **Mock 우선 개발을 계속한다.**
          **가이온 귀책 아님**을 티켓에 기록한다 — 계약 6조3항에 따라
          협조 지연분만큼 해당 과업의 이행 기한이 자동 연장된다.
    예외 1건(위임 불가): 계약 상대방에 대한 **서면 통지는 회사 행위**라 대표가 보내야 한다.
    ★ **2026-08-27 대표 발송 완료** — RESUME_NEXT §4 초안대로 에스비정보기술 담당자에게
      발송했다(계약 6조3항 근거 기록). 이로써 이 결정의 위임 불가 항목은 **닫혔다.**
      이제 지연의 귀속을 다툴 근거는 기억이 아니라 이 기록과 그 메일이다.
  affects: [DA-02, WP-DA1, WP-DA2b]

- id: D-266
  title: "재난안전 App 선결 격리 2종 — WP-DA2 착수 전 필수"
  status: decided
  raised_by: "세종(기획) 2026-08-27 · 대표 위임 — D-260 P0 목록에 대한 판정"
  decision: |
    P0 6종 중 **`flight_log.FlightLog`(308행 · F-13 정찰)** 와
    **`surveillance.VideoAnalysis`(117행 · F-01~03 탐지)** 는 **DSM App 이 직접 쓸 데이터**다.
    에스비 채널은 **고객사별 분리가 전제**이므로(계약 §2.2-4 · 검수 §7 보안 점검),
    이 2종의 격리가 닫히지 않은 상태에서 **WP-DA2(10월 코드) 착수 금지.**
    → P0 6종 중 **최우선**으로 처리한다.
    ★ WP-DA2a/b/c 의 착수 조건(D-259)에 이 항목이 더해진다 — 조건은 이제 넷이다.
  affects: [W0-14, W0-3, WP-2, WP-DA2a, WP-DA2b, WP-DA2c]

- id: D-267
  title: "백필 적용 승인 — 25,296행 (23,487 + 1,809) · 적용 완료 · 검증 3건 green"
  status: decided
  raised_by: "세종(기획) 2026-08-27 2차 · 대표 위임"
  decision: |
    준비 4건(dry-run 리포트 D-209 · 백업 3.7MB 이중 보관 D-002 · 롤백 저널 쓰기 전 기록+fsync ·
    대상이 로컬 복제본임)이 전부 충족되어 **적용을 승인한다.**

    (1) 129행 차이 인정 — 승인 수치를 시뮬레이션 값으로 갱신한다.
        · (a) R3 23,273 → 23,265 (−8, 공용 마스터 menu.Tab 제외)
        · (a) R2 343 → 222 (−121, 생성자 소속 미확인 행)
        차이가 전부 "덜 쓰는" 방향이고 각각 설명되므로 승인 범위 내다.
        더 쓰는 방향이었다면 반려했다.

    (2) 적용 직후 검증 3건 — 통과해야 커밋도 다음 단계도 간다.
        ① 반영 행수 == 25,296 (초과 1행이라도 있으면 즉시 롤백)
        ② 공용 마스터 무변경 — shared:true 전건 group_id NULL 유지, 쿼리 결과를 증거로
        ③ 롤백 저널 무결성 — 저널 행수 == 반영 행수 · 롤백 dry-run 이 원상복구를 계산

    ★ **2026-08-27 실행 완료 · 검증 3건 전부 green** (evidence/W0-13/backfill_apply_verify.md)
      ① 25,296행 · 초과 0행. 자기 보고를 믿지 않고 백업 덤프를 별도 DB 로 복원해
         group_id 를 가진 211 테이블 45,499행을 양쪽에서 diff 했다 — 변경 25,296 그 외 0건.
         전부 NULL→값 방향이고 기존 소유자를 덮은 행 0건.
      ② 공용 마스터 12종 무변경 (GridSetting 903 NULL 유지 · menu.Tab 27건 유지).
         ①의 diff 가 211 테이블 전체를 본 것이므로 "12종 밖에서도 변경이 없었다"까지 증명된다.
      ③ 저널 25,296행 == 반영 행수 · 저널 기록과 DB 실측 변경의 집합이 완전히 동일 ·
         롤백 dry-run 이 22개 모델 25,296행 전건 복원을 계산 (건너뜀 0 · 행 없음 0).

    ★ **실행 前에 잡은 결함 1건** — apply 본의 문자열 4곳이 `"\n"`(역슬래시+n)이었다.
      `newline="\n"` 은 ValueError 를 던지는데 **그 전에 저널이 0바이트로 생성**되어
      재실행이 영구히 막히고, 저널 줄바꿈 2곳은 개행 없이 한 줄로 이어붙어 롤백이 0행을 읽는다.
      즉 앞의 1곳만 고쳤다면 **백필은 성공하고 25,296행을 되돌릴 수 없게 됐다.**
      D-270 ① 과 같은 계열의 사고이고, 이번에도 잡은 것은 게이트가 아니라 사람의 눈이다.
  affects: [W0-13, WP-2, W0-14, W0-14c]

- id: D-268
  title: "742행 2차 판정 — 【채우지 않는다】 확정 (에이전트 보류 인정)"
  status: decided
  raised_by: "세종(기획) 2026-08-27 2차 · 대표 위임"
  decision: |
    (b) 일반화 재유도로 나온 2,551/848 은 틀린 수가 아니지만, 그중 742행은 D-261 이
    "채우지 않는다"로 분류한 대상이다. **지금 안 써서 잃는 것은 없고, 잘못 쓰면 되돌려야 한다.**

    처분: 1,590행과 동일 취급 — `tenant_unassigned` 로 상태를 명시하고,
          격리 시험에 "전역 관리자 외 비노출" 기대값을 단언으로 고정한다.
          **보류 상태로 남기지 않는다.**
    재론 조건: 실제 사용처가 발견될 때만 3차 판정. 그 전에는 열지 않는다.
  affects: [W0-13, W0-14, W0-14c]

- id: D-269
  title: "스냅샷 의미론 정본화 — 백필은 '계획 전체를 먼저, 쓰기는 그 다음'"
  status: decided
  raised_by: "세종(기획) 2026-08-27 2차 · 대표 위임"
  decision: |
    원칙: 대상 집합은 **백필 前 상태에서 1회 확정**하고, 쓰기 중 발생하는 연쇄 파급을
          대상에 포함하지 않는다.
    이유: 연쇄를 허용하면 승인 수치가 실행 중에 움직여 **"무엇을 승인했는지"가 사라진다.**
          (실측: 연쇄를 허용하면 R3 가 23,265 → 24,340 으로 늘었다)
    적용 범위: 이번 백필뿐 아니라 **이후 모든 파괴적 데이터 변경**에 동일 적용한다.
  affects: [W0-13, WP-2, WP-DA2a, WP-DA2b, WP-DA2c]

- id: D-270
  title: "쓰기 안전 3원칙 정본화 — 원자 교체 · 연쇄 결합 · 등록부 참조 게이트"
  status: decided
  raised_by: "세종(기획) 2026-08-27 2차 · 대표 위임"
  decision: |
    ① **원자 교체**: 파일 쓰기는 임시 파일 + `os.replace`. 원본을 truncate 하는 방식 금지.
       (`io.open(p,"w",newline=...)` 가 인자 검증 전에 truncate 해 24KB 스크립트가
        0바이트가 된 사고)
    ② **연쇄 결합**: 순차 실행이 전제인 명령은 반드시 `&&` 로 묶는다.
       앞이 실패해도 뒤가 도는 구조 금지. (잘린 파일이 컨테이너로 복사된 원인)
    ③ **등록부 참조 의무 + 게이트**: 데이터를 쓰는 모든 스크립트는 분류 등록부
       (shared / PUBLIC / tenant_unassigned)를 반드시 참조하고, 참조하지 않으면
       **실행 자체가 실패하도록** 게이트를 건다.
       → `verify_kernel_map.py` 의 "모르는 것을 만나면 멈춘다"(D-264)와 같은 계열이다.

    ★ 2026-08-27 적용 실적: ① 로 apply 본을 원자 교체 수정, ② 로 컨테이너 복사를 `&&` 결합해
      sha256 동일까지 확인, ③ 은 `verify_classification.py` 신설로 이행한다.
  affects: [W0-13, W0-14, WP-2, DA-04, DA-05]

- id: D-271
  title: "P-LOCAL-3 확정 — is_group_isolatable 술어 확장 (권고 A 승인) + 증명 게이트 3조건"
  status: decided
  raised_by: "세종(기획) 2026-08-28 · 대표 위임"
  decision: |
    판정: `groups` M2M 만 보던 술어를 **`groups` M2M ∪ `group` FK** 로 확장한다.
    근거: 격리 메커니즘이 없는 게 아니라 **술어가 FK 를 못 본 것**이다.
          W0-13 백필이 채운 25,296행이 바로 그 `group_id` 다 — 메커니즘은 실재한다.
          현 정의를 두면 "격리 메커니즘이 없다"는 **틀린 사실을 정본에 새기게** 된다.

    ★ 그냥 확장하면 초록을 칠하는 것이므로 **3조건을 함께 건다**:
      ① **모델별 실증 필수** — 비소유 테넌트 계정으로 HTTP 프로브해 **누출 0 확인된 FK 모델만**
         isolatable 로 계상한다. 미실증 FK 모델은 `unproven` — **초록으로 세지 않는다.**
      ② **registry 시험 모수를 131종 전수로 교정.** D-260 의 초록은 작은 모수의 착시였음을
         결정문에 명시한다.
      ③ `has_group_fk()` 는 픽스처 전용으로 유지하고, 단언이 그것을 근거로 삼을 때는
         반드시 ①의 실증 결과를 함께 참조한다. **픽스처는 사실을, 단언은 증명을 쓴다.**

    ※ **D-105(격리 시험 약화 금지) 저촉 아님.** 이 변경은 시험을 무르게 하는 것이 아니라
      술어의 사실오류를 교정하는 것이며, ①의 실증 조건이 오히려 요구 수준을 **높인다.**
  affects: [W0-3, W0-14, W0-14c, WP-2]

- id: D-272
  title: "P-W0-14-5 확정 — 도달 가능성은 3값으로 센다 (권고 A 승인)"
  status: decided
  raised_by: "세종(기획) 2026-08-28 · 대표 위임"
  decision: |
    "라우트가 닿는다"의 두 뜻을 갈라 등재 방식을 확정한다. 남은 13종도 이 방식으로 등재한다.

      · `direct_pk`  : pk 를 지목하는 경로 있음 → **그 경로에 스코프 부착·시험**
      · `via_parent` : 부모를 통해 노출 (예: `MissionWaypoint` 8,877행) →
                       **부모 경로 스코프 + 자식 필터 둘 다** 시험 대상.
                       **"직접 경로 없음"은 안전이 아니다.**
      · `no_route`   : 어떤 경로로도 안 닿음 → 면제가 아니라 `no_route` 로 등재하고
                       **전수 라우트 대조 근거를 첨부**한다.
                       라우트가 추가되면 재검사되도록 게이트에 연결한다.

    근거: **D-263(자동 면제 금지)의 연장.** 93종이 같은 앱에 단건 경로를 가졌던 것과 같은 함정이다.
  affects: [W0-14, W0-14c, W0-3, WP-2]

- id: D-273
  title: "P-LOCAL-1 해제 (DB 시험 불가 전제 폐기) + 초안 검증 원칙 신설"
  status: decided
  raised_by: "세종(기획) 2026-08-28 · 대표 위임 — 2026-08-27 실측에 대한 인정"
  decision: |
    · **P-LOCAL-1 해제**: `--nomigrations` 로 모델 선언에서 테스트 DB 를 직접 만들어
      80건이 17~26초에 돈다. "dj-core 가 마이그레이션을 0부터 못 쌓아 DB 시험을 못 돈다"는
      전제는 **폐기**한다. 그 전제로 미뤄 둔 항목 전부를 **지금 가능 목록으로** 옮긴다.
      ⚠ 운영 스키마 정합(P-LOCAL-4)은 별건으로 남는다 — 시험이 도는 것과 스키마가 맞는 것은 다르다.

    · **초안 검증 원칙(신설)**: 라우트 매핑은 **모델별 실경로 실측**으로 확인한 뒤 등재한다.
      `p0_target_draft.md` 의 VideoAnalysis 상세 경로가 실제로는 **SurveillanceProfile 라우트**였다 —
      그대로 갔으면 "VideoAnalysis 통과"라 적으면서 **같은 모델을 두 번 재는 시험**이 됐다.
  affects: [W0-3, W0-14, W0-14c, WP-2, W2-1]

- id: D-274
  title: "FlightLog 누출 차단 인정 + 시험 결함 3건 배선 수정 인정 · '실패는 뒤를 가리지 않는다' 원칙 승격"
  status: decided
  raised_by: "세종(기획) 2026-08-28 · 대표 위임"
  decision: |
    · `FlightLog._base_manager.get(id=id)` — 요청자도 테넌트도 인자에 없었다.
      **500 을 "막힌 것"과 "찾고 나서 죽은 것"으로 프로브로 가른 판단이 옳다.**
    · **`download-log/{id}` 가 상세보다 큰 위험이었다** — 죽지도 않고 비행 로그 전문을
      파일로 내려줬다. 이걸 같이 잡은 것이 이번 턴의 최고 성과다.
      `assert_scoped` 3곳 부착(try 밖) → 500·400 → 404 인정.
    · VideoAnalysis 400 이 "우연한 차단"이었다는 판단과, 그럼에도 고친 선택 인정.
      `created_by__isnull` OR 절은 소유가 빈 행을 못 거른다 — 우연에 기대지 않는 것이 맞다.
    · 시험 결함 3건은 D-253 선례대로 **단언 무변경·배선만** 수정한 것 인정.

    ★ **원칙 승격 — "실패는 뒤를 가리지 않는다."**
      "실패 1건"이 실제로는 **"1건 실패 + N건 미측정"** 이었던 교정을 원칙으로 올린다.
      시나리오마다 **대상별 표**를 낸다. 미측정을 통과로 읽지 않는다.

    ★ **초록의 세 가지 착시 — 신설 규칙**
      ① 부착률(D-249) ② 시나리오 수(D-262) ③ **모수와 술어(D-271)**
      → 초록을 보고할 때는 **분모와 술어를 함께 적는다.**
        `green 75/80 (대상=P0 15종 전수, 술어=M2M∪FK-실증)` 형식.
        **분모 없는 초록은 보고로 인정하지 않는다.**

    ※ **수치 정정 1건**: 지시서는 "389명·6개 테넌트가 한 줄로 열렸다"고 적었다.
      실측은 **308행·6개 테넌트**다 (`probe_flightlog_lookup.py` 출력 · 204/80/15/3/3/3).
      결론은 같지만 수를 조용히 넘기지 않는다 — D-262 §2 가 요구한 그대로다.
  affects: [W0-14, W0-14c, W0-3, WP-2, DA-04]

- id: D-275
  title: "WP-2 EXIT 승인 (조건부) — 미지 3건은 지우지 않고 각각 후속을 배정한다"
  status: decided
  raised_by: "세종(기획) 2026-08-28 2차 · 대표 위임"
  decision: |
    **WP-2 EXIT 를 승인한다.** D-262 개정 4조건 대조:
      ① 시나리오 → **33/33** (등재 25종 × 5시나리오, 술어=남의 테넌트 pk → 403/404) — 초과 충족
      ② P0 전수 → **15/15**
      ③ P1 계획 등재 → 완료 (수치는 정정본 **P1 50** — D-276)
      ④ P2 분류 사유 문서화 → 완료 (정정본 **P2 39**)
      + green 90/90 · 게이트 3종 exit 0 · 새 결함 0.

    ★ **승인의 진짜 이유는 숫자가 아니다.** EXIT §5 의 **미지 3건을 지우지 않고 남긴 것**이다.
      D-262 가 EXIT 문서에 요구한 것이 정확히 그것이다 —
      "무엇을 검증했고 무엇을 아직 모르는지 스스로 말하는 문서".

    **미지 3건 처분** (지우지 말고 각각 후속을 배정한다):
      §5-1  주인 없는 행이 매니저 수준에서 보임 (§0.4 `created_by__isnull` OR)
            → 근원은 저장소 밖이라 못 고친다. 대신 **【필수 부대조건】신규 경로 트립와이어**:
              `verify_tenant_scope` 를 **"런타임 라우트 전수 열거 → 테넌트 모델 접촉 &
              문지기 없음 = fail"** 로 확장한다.
              ★ **이것 하나가 EXIT 승인의 유일한 필수 조건이다.**
              "문지기 없는 새 경로가 생기면 그 순간 다시 샌다"는 문장을 **게이트가 대신 지키게** 한다.
      §5-2  목록 격리 판정 불가 5종(양성 대조 실패) → **"통과 아님, 판정 불가"** 로 정확히 등재.
            **P1 최우선**으로 이관하고 목록 판정기 재작성을 **별도 티켓**으로 연다.
            상세·수정·삭제·부모경로 green 은 인정한다.
      §5-3  unproven FK 132종 → **"안전"이 아니라 "아직 모른다"** 로 등재 유지.
            P1 계획에 **배치별 실증 일정**을 포함한다.

    → EXIT 승인. 실행판 §4 대로 **K1 착수**. 직렬은 K1 하나, 이후 K2‖K6 · K3‖K4.
  affects: [WP-2, W0-3, W0-13, W0-14, W0-14c, WP-DA2a, K1]

- id: D-276
  title: "수치 정정 3건 + 작성자 오류 자인 — 분모를 적으라 시킨 쪽의 분모가 인용이었다"
  status: decided
  raised_by: "세종(기획) 2026-08-28 2차 · 대표 위임"
  decision: |
    · **모수**: D-271 ②의 "131종 전수"는 **인용값이지 실측이 아니었다.**
      실측 **142종** (`groups` M2M ∪ `group` FK − dj-core 23종).
      옛 술어의 모수는 131도 아닌 **2종**이었다 — 모수 2 위에서 "누락 1건"을 말하고 있었다.
      **AUTHOR-ERROR 로 기록한다** (D-214 절차). 분모를 적으라고 시켜 놓고 내 분모가 인용이었다.
    · **P1/P2**: 지시서 §3⑤의 "P1 17 · P2 99"는 1차(D-260) 값이다.
      **저장소 관할 정본은 P1 50 · P2 39** (3차 57 중 18종이 dj-core `user.*`). 정정 수용.
    · **D-274 의 "389명"** 도 실측 **308행**이다. 정정 수용.
    · **인구조사 결함**: 덤프 집계라 **행 0인 표가 안 보여** 29종을 못 봤고,
      그중 3종은 행이 있는데도 빠졌다.
      → ★ **원칙: 행 0은 안전이 아니라 "아직 안 썼다"다.**
        인구조사는 **스키마 기준**으로 세고, **행 수는 별도 열**로 둔다.
  affects: [W0-3, W0-13, W0-14, W0-14c, WP-2]

- id: D-277
  title: "양성 대조 의무화 — 초록의 네 번째 착시는 탐지기 자체다"
  status: decided
  raised_by: "세종(기획) 2026-08-28 2차 · 대표 위임"
  decision: |
    `assertNotContains('"id":N')` 은 응답이 `"id": N`(공백)이라 **구조적으로 실패할 수 없었다.**
    "list 8/8 통과"는 D-253 이후 줄곧 거짓이었다.
    **시험이 틀린 게 아니라 탐지기가 눈이 멀어 있었다.**

    · **규칙**: 격리 단언은 반드시 짝이 되는 **양성 대조**(있는 것을 심어 놓고 잡히는지)를 동반한다.
      **양성 대조 없는 단언은 green 으로 세지 않는다** — 실패할 수 없는 시험은 시험이 아니다.
    · **문자열 매칭 금지**: 고유값 우선 + **본문 파싱 구조 판정**을 정본으로 한다.
    · 공백을 지우자 두 번 오탐(중첩 panels · shift)한 것까지 포함해 전 과정 인정.

    ▣ **착시 4형 — 앞으로 이 넷을 매 보고에서 스스로 점검한다**
      ① 부착률 (D-249)   ② 시나리오 수 (D-262)
      ③ 모수와 술어 (D-271)  ④ **탐지기 자체 (D-277)**
      ①~③은 "무엇을 얼마나 쟀나", ④는 "**재는 기계가 작동하나**".
      **④를 통과 못하면 나머지 셋은 의미가 없다.**
  affects: [W0-3, W0-14, W0-14c, WP-2, K1, K2, K3, K4, K5, K6, K7]

- id: D-278
  title: "정적 계층 검사 CI 승인 — K1 전에 세운다 (WP-DA2 착수 조건 (3))"
  status: decided
  raised_by: "세종(기획) 2026-08-28 2차 · 대표 위임 — 제안 수용"
  decision: |
    · **App(L4) → 커널(L3) 직접 import 금지**를 CI 로 강제한다(정적 검사).
      **커널이 서기 전에 세우는 것이 옳다** — `verify_tenant_scope` 를 커널 0줄일 때 세운 이유와
      같은 계열이다. 나중에 오는 게이트는 이미 쌓인 빚을 만나고, 그러면 래칫밖에 못 건다.
    · 위반 시 **exit 1**. **K1 첫 커밋 전에 이 CI 가 green** 이어야 한다.
    · 이로써 D-259 의 WP-DA2 착수 조건 (1)(3)이 닫힌다. 남은 것은 (2) 대표 승인(WP 별 ENTRY).
  affects: [WP-DA2a, WP-DA2b, WP-DA2c, DA-04, K1]

- id: D-279
  title: "§0.4 오분류 정정 — '금지구역'은 파일 경로로 확인한 뒤에만 붙인다"
  status: decided
  raised_by: "세종(기획) 2026-08-28 2차 · 대표 위임"
  decision: |
    · 문지기 7곳이 **전부 저장소 코드**였다. `get_order` 500→404 하나로
      `OrderHistory` · `Payment` · `DeliveryOperation` **via_parent 3건이 함께 초록**이 된 것 —
      앞 기록이 "§0.4 금지구역"이라 적은 것이 실은 **우리 코드**였다.
      `terminals` 에서 `request` 조차 받지 않는 핸들러 3개가 나온 것도 같은 계열이다.
    · ★ **원칙: "금지구역"은 파일 경로로 확인한 뒤에만 붙인다.**
      추정으로 붙이면 **고칠 수 있는 것을 포기하게 된다.**
    · D-207 §0.4 는 유효하되 **이 확인 절차를 전제로** 적용한다(불변 제약 갱신).
  affects: [W0-14, W0-14c, W0-18, WP-2]

- id: D-280
  title: "공공 데이터 API 선별 적용 — 관련 5종만 등재 · 키는 저장소 밖"
  status: decided
  raised_by: "세종(기획) 2026-08-28 2차 · 대표 위임"
  decision: |
    대표가 발급한 키 목록 중 **GuardianX 관련 5종만** 적용한다.

    **【적용 — 5종】**
      P0-1  기상청 데이터            특보·예보·관측   → FX-1(건조특보+연기=심각) · FX-2(호우특보+수위)
      P0-2  공공데이터포털 일반키     포털 전체 공통    → 이 키 하나로 아래 3종 및 향후 포털 API 호출
      P1-1  전국초중등학교위치        학교 좌표        → 대피소·우선보호시설.
                                                      F-03 위험구역 자동 제안 · F-10 알림 우선순위
      P1-2  국립공원 안전정보         산악 안전        → F-01 화재 탐지의 지역 컨텍스트, 조난 대응
      P1-3  아동센터·돌봄센터 안전정보 취약계층 시설    → 대피 우선순위 · F-10 수신자 그룹 가중

    **【미적용 — 3종】** NEIS(교육행정) · 대구교육청 방과후학교 공모 · Open DART(기업공시)
      → GuardianX 도메인과 무관. **어댑터·등록부에 넣지 않는다.**

    **【아직 없는 P0】** 하천 수위(홍수통제소) · 재난대응기관 · 시설자원 · 안전정보 통합공개
      → 포털 일반키로 활용신청만 하면 된다. 대표께 추가 신청 안내.

    **【DA-05 확장 — 지금 할 것】**
      · **코드 구현은 여전히 2027.2** (계약 M 기능 우선, v2.1 규칙② 유지).
      · 다만 키가 생겼으므로 **읽기 전용 실호출로 응답 스키마를 실측**해 DA-05 스펙에 박는다.
        추정으로 쓴 스펙은 2027.2 에 전부 재작업이 된다 — **지금 30분이 그때 며칠을 아낀다.**
      · 산출물: `docs/agent/evidence/DA-05/{source}_schema.md`
        (요청 예 · 응답 필드 · rate limit · 오류 코드).
        **응답 본문 샘플에 키가 섞이지 않게 마스킹**할 것.

    **【키 취급 — 필수】**
      · 대표가 올린 문서에는 인증키 4개가 **평문**으로 있다. **저장소에 절대 넣지 않는다.**
      · 키는 `C:\GuardianX-vault\` → 환경변수/비밀저장소로만. 저장소에는 **형태 검증만** (D-204).
      · `verify_secrets` 에 이번 키들의 **형태 패턴**(URL 인코딩된 포털키 `%2B`·`%3D%3D` 포함 형태,
        기상청 22자 토큰 형태)을 추가해, 실수로 커밋되면 **exit 1** 이 되게 한다.
  affects: [DA-05, DA-04, WP-DA1, WP-DA2c, W0-19]

- id: D-281
  title: "P-K1-1 확정 — C-3.1 을 계층별로 나눈다 (커널에는 데코레이터를 쓰지 않는다)"
  status: decided
  raised_by: "세종(기획) 2026-08-29 · 대표 위임"
  decision: |
    커널 계층(L3)에서 **request 기반 데코레이터 사용 금지.**
    대신 **테넌트 없이는 호출 자체가 불가능한 시그니처**로 만든다.

    · HTTP 계층(뷰): `@tenant_scoped()` 유지 — `request` 가 실제로 있으므로 유효하다.
    · 커널 계층(L3): 스코프를 **키워드 전용 필수 인자**로 받는다.

          def list_events(*, scope: TenantScope, ...)   # scope 없으면 호출 자체가 불가

      데코레이터는 "붙였는가"만 보지만, 필수 인자는 **부르는 쪽이 테넌트를 알아야만**
      호출된다. 표식이 아니라 **구조**다 — 우회할 자리가 없다.
    · P-K1-1 의 잠정 적용안(통과 형태로 문지기 호출을 더해 요구 수준을 올림)도
      **함께 채택한다. 시그니처가 1차, 문지기가 2차.**
    · 게이트: `verify_tenant_scope` 에 **"커널 공개 함수 중 scope 인자 없는 것 = fail"** 추가.
    · C-3.1 문언은 이 판정으로 **개정된 것으로 본다** (임의 이행 아님 — 승인부다).

    ※ D-105 저촉 아님: 통과 형태를 무르게 하는 것이 아니라, 데코레이터라는 **약한 형태를
      커널에서 제거하고** 더 강한 두 형태(시그니처·문지기)만 남기는 것이다.
  affects: [W2-1, W2-2, K1, K2, K3, K4, K5, K6, K7, C-3.1, DA-04]

- id: D-282
  title: "착시 ⑤ 환경 — 시험 환경이 실물과 다르면 초록은 실물을 말하지 않는다"
  status: decided
  raised_by: "세종(기획) 2026-08-29 · 대표 위임"
  decision: |
    `DetectionEvent` 표가 DB 에 없는데 시험은 초록이었다. `--nomigrations` 가 **모델 선언에서**
    테스트 DB 를 만들어 줬기 때문이다. **재는 환경이 실물과 달랐다.** 앞의 넷과 다른 종류다.

    · **대응 게이트(신설):** 마이그레이션 정합 검사를 CI 에 넣는다.

          python manage.py makemigrations --check --dry-run   → 미반영 모델 변경이 있으면 exit 1

      "모델 14건 / 표 0건" 같은 격차가 **조용히 유지되는 것**을 막는다.
    · **원칙:** `--nomigrations` 는 **속도용 보조 수단**이지 정본 판정 환경이 아니다.
      최소 1개 시험 경로는 **실제 마이그레이션을 적용한 DB** 에서 돌아야 한다.

    ▣ 착시 5형 (매 보고 자가점검)
      ① 부착률(D-249) ② 시나리오 수(D-262) ③ 모수와 술어(D-271)
      ④ 탐지기 자체(D-277) ⑤ **환경(D-282)**
      ①~③ = 무엇을 얼마나 쟀나 · ④ = 재는 기계가 작동하나 · ⑤ = **재는 자리가 실물인가**
  affects: [W2-1, W2-2, K1, CI, 전 티켓 보고]

- id: D-283
  title: "0016_detectionevent 적용 승인 — W2-2 배선보다 먼저"
  status: decided
  raised_by: "세종(기획) 2026-08-29 · 대표 위임"
  decision: |
    근거: **신규 표 생성은 기존 데이터를 건드리지 않으므로** 백필(D-261 계열)과 성격이 다르다.
    표 없이 배선하면 첫 검출에서 죽는다.

    조건 4건:
     ① 실행될 DDL 을 **먼저 출력해 첨부**: `python manage.py sqlmigrate <app> 0016` (D-209 신규표 판)
     ② **역방향(reverse) 가능 여부 확인** — 되돌릴 수 없는 마이그레이션이면 사유를 적고 멈춘다
     ③ 대상은 **로컬 복제본만. 운영 DB 금지.** 적용 전 스냅샷 1회 (D-002 관례)
     ④ 적용 후 **D-282 게이트(makemigrations --check)가 green** 인지 확인
        — 이번 사고의 재발 방지가 곧 검증이다
  affects: [W2-1, W2-2, K1, D-209, D-269, D-270]

- id: D-284
  title: "호출처 2곳 시정 + 거짓 성공 반환 금지(원칙 신설)"
  status: decided
  raised_by: "세종(기획) 2026-08-29 · 대표 위임"
  decision: |
    **검출이 없던 게 아니라 버려지고 있었다.** AI 서버는
    `Detection{x,y,w,h,label,confidence,color}` 를 이미 돌려주는데
    `grpc_client.py:147` 이 이미지만 디코딩하고 `detections` 를 통째로 버린다.
    즉 **추가 AI 개발 없이 배선만으로 탐지가 살아난다.**

    (1) `grpc_client.py:147` — `detections` 를 K1 이벤트로 넘긴다. proto 실측이 이미 근거다.
        → W2-2(AI 이벤트 센터) 배선의 핵심이자, K1 호출처 ①의 실질을 만드는 작업.
    (2) `detect_and_save` — 독스트링은 "저장한다"인데 본문이 비어 있고 `True` 를 낸다.

    ★ **원칙(신설): 구현이 없는 함수는 성공을 반환하지 않는다.**
      빈 본문은 `NotImplementedError` 를 던진다.
      **조용한 성공이 가장 나쁘다** — 부르는 쪽이 "저장됐다"고 믿고 다음을 쌓는다.
      → 저장소 전수로 "본문 없이 True/None 을 반환하는 공개 함수"를 훑어 **목록을 낸다**(1회 조사).
  affects: [W2-2, K1, DA-04, 전 저장소]

- id: D-285
  title: "DA-05 미완 인정 · 대표 조치 대기 · 트립와이어 설계 정본화"
  status: decided
  raised_by: "세종(기획) 2026-08-29 · 대표 위임"
  decision: |
    (1) **DA-05: 실호출 0/5 은 잘못이 아니다.** 키가 이 PC 에 없다 — vault 에도 없고
        문서는 채팅에만 있었다. **추정으로 스펙을 채우지 않은 것은 D-280 준수다.** 인정한다.
        키가 오면 `python scripts/probe_public_data_schema.py` 한 줄로 끝나는 상태까지
        세워 둔 것도 인정. 대표 조치 2건 대기(환경변수 2개 · API 서비스명 확인 1건).

    (2) 트립와이어를 **"수가 아니라 이름으로" 잠근 설계를 정본화한다.**
        수 래칫은 라우트 하나가 지워질 때마다 **새 라우트가 들어올 자리를 만든다.**
        → 앞으로 **모든 커버리지 게이트는 이름 집합(set) 기준**으로 잠근다. **개수 기준 금지.**
        진짜 무방비 라우트를 심어 양쪽이 멈추는 것과 `assert_scoped` 한 줄로 다시 통과하는
        것까지 확인한 절차(**양성 대조**, D-277)도 정본이다.

    (3) 계층 검사 CI 가 대상 0건일 때 **판정기 자체를 시험한 것**(대조 14/14) —
        D-277 의 자발적 적용. 인정.

    (4) skip 1(컨테이너에 `scripts/` 미마운트) — 사실대로 남긴 것 인정.
        `docker-compose` 에 마운트 추가해 해소하라.
  affects: [DA-05, W0-19, W2-2, D-275, D-277, D-280]

# --- 2026-08-30 RESUME_NEXT (세종 위임 판정) — D-286 ~ D-291 -----------------
# ★ D-286 이 신설한 최상위 원칙에 따라 **이 블록부터 모든 결정문은 `enforced_by` 를 갖는다.**
#   없으면 `python scripts/verify_decision_tools.py` 가 exit 1 로 멈춘다.

- id: D-286
  title: "승인 밖 마이그레이션 3건 — 되돌리지 않는다 + 최상위 원칙 「문서는 기억을 요구하고, 도구는 기억을 요구하지 않는다」"
  status: decided
  raised_by: "세종(기획) 2026-08-30 · 대표 위임"
  decision: |
    **되돌리지 않는다.** 역방향이 varchar 좁히기라 되돌림이 원상복구가 아니라 **새로운 파괴**다.
    확인된 사실 5건(운영 DB 아님 · DROP/DELETE 0줄 · 4건 전부 역방향 있음 · 행 수 보존 ·
    적용 후 스냅샷 확보)이 위험 미실현을 보인다.

    단, 지우지 않는다:
     ① "승인 범위 밖 3건이 적용됐고 **선행 스냅샷이 없다**"를 결정문에 그대로 기록한다(은폐 아님).
     ② 적용 후 스냅샷을 **이 시점의 기준선**으로 명시 등재하고, 3건의 DDL 전문을 증거로 남긴다.
     ③ 이후 되돌림이 필요해지면 **기준선 복원**으로 처리한다 — 역방향 마이그레이션은 쓰지 않는다.

    ★★ **최상위 원칙 신설 — 「문서는 기억을 요구하고, 도구는 기억을 요구하지 않는다」**
       사람의 기억에 맡긴 절차는 도구가 우회한다. 그러므로 판정·규약·금지는 전부
       **깨지면 멈추는 도구**로 내려앉아야 한다.
       계보: D-264(모르면 멈춘다) · D-270③(등록부 게이트) · D-277(양성 대조) ·
             D-281(시그니처) · D-282(환경 정합) · **D-286(엔트리포인트 고정)**
       **앞으로 모든 결정문은 마지막 줄에 "이 판정을 강제하는 도구"(enforced_by)를 적는다.
       없으면 미완이다.**
  enforced_by: |
    · docker-compose.yml 의 entrypoint: ["sleep", ...] — 컨테이너 기동이 마이그레이션을
      **자동 적용하지 못한다.** 절차가 아니라 구성으로 막는다.
    · python scripts/verify_decision_tools.py — D-286 이후의 결정문에 enforced_by 가
      없으면 **exit 1**. 이 원칙 자체를 강제하는 도구이며, 스스로에게도 적용된다.
    · docs/agent/evidence/W2-2/d286_migration_baseline.md — 기준선 스냅샷과 3건 DDL 전문의 등재처.
  affects: [W2-1, W2-2, K1, K2, K6, CI, 전 결정문]

- id: D-287
  title: "K1 done 승인 + 커널 done 요건 재정의 (AUTHOR-ERROR 자인 — 호출처 2곳을 뺀다)"
  status: decided
  raised_by: "세종(기획) 2026-08-30 · 대표 위임"
  decision: |
    ▣ **작성자 오류(D-214)**: 실행 순서 ⑥("호출처 2곳이 실제로 이벤트를 넘기는 것")과
      D-284 본문(②는 정직화만)이 서로 어긋났다. 지적이 정확하다.

    ▣ **재정의 — 커널 done 요건에서 "호출처 2곳"을 뺀다:**
         기존: 이중 AC green + 호출처 2곳
         개정: 이중 AC green + **실제로 산출물을 만드는 경로 1곳** + 계약 AC 충족
       이유: "2곳"은 재사용을 증명하려던 **대리 지표**였다. 진짜 재사용은 K2·K3·K4 가
             K1 을 소비하는 것으로 증명된다 — AI 호출처 개수가 아니다.
             대리 지표를 만족시키려 추정 파서를 쓰는 것은 본말전도이고 D-280 위반이다.

    ▣ **②(detect_and_save) 처분: 정직화 상태 유지.**
       ai-analysis.invalid 로 응답 모양을 못 재는 동안 잇지 않는다 — 추정 파서 금지(D-280).
       → 신규 티켓 「AI 응답 스키마 실측」 등재. 실 서버 응답을 캡처해 스키마를 확정한 뒤
         ②를 K1 에 잇는다.

       ※ **판정문 문언 정정 (D-214 절차 · 2026-08-30)**: 판정문은 "정직화 상태
         (NotImplementedError) 유지" 라고 적었으나, 실측은 다르다. 직전 턴(REPLY_20260829 §정정)이
         이미 보고한 대로 `detect_and_save` 는 **NotImplementedError 를 던지지 않는다** —
         저장이 실제로 일어나기 때문이다(`detect_media` 안의 `threading.Timer` 가
         `create_video_analysis_records()` 를 돌린다). 그래서 그 턴은 예외 대신
         **독스트링을 사실로 고치고** 반환을 `(ok, results)` 로 바꿔 상류 모양 불일치가
         빈 목록으로 뭉개지지 않게 했다(D-290 의 원형).
         D-287 의 **취지**(잇지 않는다 · 추정 파서 금지)는 그대로이고, 그것을 강제하는 것은
         예외가 아니라 아래 `enforced_by` 의 세 가지다. 없는 예외를 있다고 적지 않는다.

    ▣ **K1 done.** 다음은 K2 ‖ K6 착수.

    ※ **ID 충돌 — 작성자 오류 2건째(D-214 절차로 기록)**: 판정문은 신규 티켓 ID 를 W2-3 으로
      지정했으나 W2-3 은 이미 "AI 이벤트 센터 화면(3열 콘솔)"로 정본에 있다(WP-3).
      D-246 이 만든 ID 충돌 검사 관례에 따라 **실측 우선(D-210)** 으로 W2-2b 로 등재한다
      (W0-1a/W0-1b 가 이미 쓰는 후속 티켓 표기). 판정의 내용은 그대로다.
  enforced_by: |
    · backend/tests/test_k1_event_kernel.py::KernelPublicSurfaceTest — DA-04 §2 표와
      공개 면이 갈리면 **실패**. 커널 done 의 "계약 AC 충족"을 코드가 판정한다.
    · python scripts/verify_kernel_map.py — 커널↔티켓 매핑이 문서와 갈리면 exit 1.
      "호출처 2곳" 대신 **"K2·K3·K4 가 K1 을 소비한다"** 를 재사용의 증거로 쓰는 근거표가 이것이다.
    · backend/tests/test_w2_2_detection_wiring.py 의 SilentSuccessSurveyTest —
      "본문 없이 True 를 반환하는 공개 함수" 조사기가 돈다. `detect_and_save` 의 옛 모양
      (`return True, results`)이 **실물 표본**으로 들어 있어(D-289), 누가 그 모양을 되살리면 잡힌다.
    · backend/media_data/services/media_data_detect_service.py 의 `_UPSTREAM_SHAPE_MISMATCH` —
      상류 응답이 계약 모양이 아니면 **빈 목록이 아니라 불일치 값**으로 올라간다.
      추정 파서를 끼우려면 이 갈래를 먼저 지워야 하고, 지우는 순간 위 조사기가 본다.
    · scripts/scan_silent_success.py --self-test — 조용한 성공 형태를 저장소 전수로 훑고,
      대조 표본에 **실물 1건 이상**을 요구한다 (D-289).
  affects: [K1, W2-2, W2-2b, DA-04, D-284, D-214]

