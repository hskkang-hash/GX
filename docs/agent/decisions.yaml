- id: D-430
  author_tree_id: "세종 지시서 2026-09-27 §3 턴 B · 차선 S"
  title: "낱말은 코드가 아니다 — **규약을 설명한 문장이 규약을 지켰다는 증거로 셌다**"
  status: decided
  raised_by: "조율자(Code) 2026-09-27 · 차선 S (SEC-11a · 게이트 입력 신선도 · SEC-16)"
  decision: |
    ▣ **SEC-11a — 접두 셋 승격 · 248 → 224** [실측 · 조율자 재측 동일]. 갚은 것 24건.
      ★ **접두를 추측으로 고르지 않았다** — 인벤토리 `authz_envelope` ∩ 화면 24장의 실제
        호출(`D-386/screen_routes.json`)의 **교집합**에서 골랐다:
        `/api/advanced-table/`(12·호출24) · `/api/config-management/`(7·24) ·
        `/api/user-groups/`(5·51). 셋 다 화면이 열리는 순간 불린다.
      ★★ **함정 하나: 켠 뒤 225였다(기대 224).** 남은 1건이 `POST /api/user-groups` —
        **끝의 `/` 가 없는 모음 라우트**라 `startswith` 접두에 안 걸린다.
        **목록·생성처럼 가장 많이 불리는 자리가 정확히 그 모양이다.** 「한 건쯤」으로
        넘겼으면 승격이 가장 뜨거운 자리를 비켜 간 채 초록이 났을 것이다.
        `path_in_scope()` 로 메웠다.
      ★ **닫지 않았다 — 부르는 자리 7건이 남았고 이름을 다 적었다**(departments 3 ·
        flight-log 4). 「대부분 갚았다」가 아니다. 다음 턴 접두 둘이면 0이다.

    ▣ **게이트 입력 신선도 — 뿌리를 재현하고 도구를 세웠다** (D-429 원칙의 집행).
      [실측] 커밋된 인벤토리의 `measured_at` 이 **빈 문자열**이었고, 게이트는 그것을
      「(측정일 미기재)」라고 **적기만 하고 exit 0** 이었다.
      이제 ① 프로브가 **시간대 붙은** 현재 시각을 스스로 적고(컨테이너 UTC vs 호스트 +09:00
      차이로 방금 뜬 파일이 9시간 낡아 보이던 것을 실측 후 고쳤다) ② 24시간 초과·측정일
      부재·읽기 불가는 **회색 exit 2** ③ `--refresh` 로 게이트가 스스로 다시 뜬다.
      ★ **낡음을 `judge()` 의 실패 목록에 넣지 않았다** — 섞으면 「환경이 낡았다」가
        「코드가 틀렸다」(exit 1)로 보고된다. 회색과 빨강은 다른 말이다.
      [실측 세 갈래] 신선 → exit 0 · 측정일 없음 → **exit 2** · 97.4시간 → **exit 2**.

    ▣ **SEC-16 규약 — 닫는 조건 셋 전부 강제**(서명 불일치 거절 · 5회 뒤 포기 기록 ·
      스키마 헤더 부재 거절). 시험 32 passed · 판정기 자기시험 24/24.
      서명은 **타임스탬프+판+본문**을 덮어 재생 공격도 막는다.
      함정 지켰다(세종 §4-4 · P-37): 규약 모듈에 **라우트 0** · 무계정 링크 없음 ·
      `INBOUND_KEY_ALLOWED` 한 줄도 안 넓혔다.
      ★ **저장소에 결함을 심어 보고 잡았다** 셋: `compare_digest`→`!=` ·
        `MAX_ATTEMPTS 5`→`9` · 새 `requests.post(...)`. 셋 다 FAIL, 되돌린 뒤 PASS.
      ★★★ **그런데 이 턴에 판정기가 세 번 틀렸고, 그것이 이 절의 진짜 값이다:**
        ⓐ 낱말 검색이 **자기 문서**를 위반으로 셌다(「`==` 쓰지 마라」라고 적은 줄).
        ⓑ 그 고침이 토큰을 공백으로 이어 붙여 `requests . post` 를 만들며
           **진짜 발송자 2건을 0건으로** 셌다 — **0건이 초록으로 보였다.**
        ⓒ 가장 나쁜 것: 낱말 검색이 **심은 결함을 놓쳤다.** `compare_digest` 가
           **독스트링에 남아 있어** PASS 였다 — **규약을 설명한 문장이 규약을 지켰다는
           증거로 셌다.**
        → 판정을 **AST(구조)** 로 옮겼다. **낱말은 코드가 아니다.**
           같은 뿌리를 이 저장소가 전에도 밟았다(D-414 쉼표 하나가 패턴 하나를 삼켰다).

    ▣ ⚠ **그 대가로 `dormant` 가 빨갛다 — 가리지 않았다.**
      `webhook_contract.py` 의 함수 셋이 **부르는 곳 0** 이다(문은 UX-19 · 턴 C).
      **`dormant_baseline.txt` 에 넣지 않았다** — 그 파일은 스스로 「이 목록은 줄어들기만
      한다」고 적는다. 거기 이름을 더하는 것은 게이트를 끄는 일이고, 그러면
      「규약을 지었다」와 「규약이 쓰인다」의 구별이 사라진다 — 착시 ⑨ 그 자체다.
      턴 C 에 문이 서면 저절로 초록이 된다. **빨강을 지우는 것과 원인을 없애는 것은 다르다**(D-327).
  enforced_by: |
    · backend/config/settings.py :: A2 접두 셋 · path_in_scope()
    · backend/common/api_contract.py · backend/tests/test_api_contract.py :: 30건
    · backend/common/webhook_contract.py · backend/tests/test_s_webhook_contract.py :: 32건
    · scripts/verify_webhook_contract.py :: 자기시험 24건 (판정 = AST)
    · scripts/probe_route_inventory.py · scripts/verify_route_inventory.py :: 신선도 exit 2
    · docs/agent/evidence/SEC-11a/ · docs/agent/evidence/SEC-16/
  affects: [D-286, D-327, D-335, D-348, D-349, D-368, D-377, D-414, D-429]

- id: D-431
  author_tree_id: "세종 지시서 2026-09-27 §2 P-34 · §3 턴 B · 차선 Q"
  title: "로그가 소리친 자리와 무너진 자리는 달랐다 — **200/분은 이벤트를 한 번도 막은 적이 없다**"
  status: decided
  raised_by: "조율자(Code) 2026-09-27 · 차선 Q (PERF-04 · PERF-06)"
  decision: |
    ▣ **PERF-06 닫힘 — `skipping` 은 버리는 것이 아니라 미루는 것이고, 미뤄지던 것도
      이벤트가 아니라 캐시 무효화 신호였다.** [실측 · 호출로 확인]
        투입 **300건** → DB 행 **300건** · **dropped 0** · deferred 817 · coalesced 3,383 ·
        5.345초 = **56.1건/초(3,366건/분)** · 되돌린 뒤 남은 행 0.
      ★ **표본을 서로 다른 스트림 300대로 세웠다.** 같은 스트림이면 10초 기록창이 접어
        「속도제한」 대신 **「중복 억제」를 재게 된다** — 접힘 0건을 함께 세어 그것을 보였다.
        **재려던 것을 재고 있는지 확인하는 것이 재는 일의 절반이다.**
      출처: `common/universal_optimization.py:2385` `CACHE_INVALIDATION_RATE_LIMIT=200` —
      지키던 것은 DB 가 아니라 **Redis 와 응답 지연**이고, 물려받은 값이다.
      ★ **[판정] 값 200 을 바꾸지 않는다**: ① 이벤트를 막지 않고 ② 넘어도 잃지 않으며
        ③ P-19 가 `dsm/` 를 캐시 우회로 올려 **미룬 무효화가 관제 화면에 닿지 않는다.**
      ★★ **정본 PERF-05 의 문안을 정정했다.** 「먼저 무너진 것은 우리 쪽 속도제한」은
        「이벤트 처리량이 200/분에서 막혔다」로 읽힌다 — 실측의 60분의 1이다.
        ⚠ 그 수를 영업·제안서에 인용하면 **우리 손으로 우리 제품을 60배 깎는다.**

    ▣ **PERF-04 — 예산은 정해졌고 도구도 섰다. 그런데 판정이 안 난다 → 미측정.**
      ① 예산 표 확정(세종 P-34) ② 게이트 `verify_perf_budget.py` 자기시험 **39갈래** exit 0
      ③ **exit 2(회색)** — F05 의 3벌 p95 **513–541ms** 가 회귀 문턱 **516ms** 를 **걸친다.**
      ★ **세종 P-34 의 단서는 집행했고, 절은 다른 이유로 안 닫힌다.** P-34 의
        「기준선으로 초록」은 **절대 예산**에 대한 판정이다 — 그대로 집행해서 예산 초과 둘은
        빨강(`X`)이 아니라 **기록(`!`)** 이 됐다. 지금의 회색은 **회귀**가 낸 것이고,
        회귀는 P-34 가 「+20% 초과 시 빨강」이라고 직접 재라고 한 자리다.
        **판정을 시킨 자리에서 판정을 못 하고 있다. 회색은 초록이 아니다.**
    ▣ **게이트가 배운 규칙 넷 — 전부 「같은 것을 견주고 있는가」를 묻는다:**
      ① **캐시 적중 시간은 성능이 아니다** — 비낌 없이 잰 수는 초록이 아니라 회색(D-412).
      ② **동시성이 다른 두 p95 는 같은 것이 아니다** — 같은 코드가 동시 4에서 122ms ·
         동시 10에서 445ms. 그것을 회귀로 적으면 **다음 사람이 이 게이트를 끈다.**
      ③ **잡음이 문턱보다 넓으면 판정하지 않는다** — 한 벌만 재면 F05 가 414↔528ms 로
         흔들려 20% 문턱을 저 혼자 넘는다. 3벌 · 가운데값.
      ④ **폭이 문턱을 걸치면 회색** — 예산 갈래에만 있던 규칙을 **회귀 갈래에도** 걸었다
         (조율자 정정). 잡음은 「폭이 얼마나 넓은가」, 걸침은 「폭이 어디에 놓였는가」 —
         **다른 것을 잰다.** 잡음 5%로 좁아도 문턱 위에 걸터앉을 수 있다.
    ▣ **모드 둘 · 자동 전환이 본줄기** (조율자 정정): `Server:` 헤더로 갈린다 —
      `WSGIServer` → 기준선 · `gunicorn`·`nginx`·**못 읽음** → 합격선.
      ★ **모르는 서버를 기준선으로 접으면 진짜 운영이 조용히 면제를 받는다.**
        사람이 기억해야 켜지는 규칙은 바쁜 날 깨진다(D-286).
      면제로 굳지 않게 **못 셋**: 출력 마지막 줄의 「이 초록은 합격선이 아니다 — 넘은 자리
      2곳」 · `budget.json` 의 `pending_acceptance` · **OPS-13 의 닫는 조건에 등재**
      (그 절을 닫는 사람이 반드시 지나는 자리다 — PERF-04 와 OPS-13 은 함께 색을 얻는다).
      남은 두 자리: **F05** 524.7ms>500 · **STATUS** 363.3ms>300(**캐시 금지 면이라
      캐시로 갚을 수 없다** — 질의 자체가 빨라져야 한다).
  enforced_by: |
    · scripts/verify_perf_budget.py :: 자기시험 39갈래 · mode_for(Server 헤더) · pending_acceptance
    · scripts/probe_event_rate_limit.py :: 되돌리는 트랜잭션 · 스트림 300대 · 접힘 0건 대조
    · docs/agent/evidence/PERF-04/budget.json · budget_table.md
    · docs/agent/evidence/PERF-06/calls.json · rate_limit_basis.md
    · docs/agent/evidence/D-346/ga_readiness.yaml :: OPS-13 닫는 조건 +1
  affects: [D-286, D-359, D-367, D-412, D-428, D-429]

- id: D-432
  author_tree_id: "세종 지시서 2026-09-27 §3 턴 B · 차선 E"
  title: "「수신 주소가 0개」가 아니었다 — **켜는 순간 개발 계정 12명에게 진짜로 나간다**"
  status: decided
  raised_by: "조율자(Code) 2026-09-27 · 차선 E (시드 사람 3 · OPS-10 · OPS-07)"
  decision: |
    ▣ **시드 사람 3 — 닫힘.** `fire_user` **0 → 1명** · critical 수신자 **14 → 15명** ·
      시드 사람 2 → **3명** [실측 · 조율자 컨테이너 재측 exit 0].
      기존 방식 그대로 갔다 — 심는 것은 여전히 `POST /api/v1/user/create-user`
      **진짜 HTTP 한 자리**뿐이다. 비밀번호는 저장소 밖 `.env.gates` 로만 넘겼다.
      ★★ **그리고 「역할 기본 프리셋 미시드」는 틀린 진단이었다** [실측] —
        `settings.K3_ROLE_PRESET_MAP ← config/k3_roles.py` 로 **이미 시드돼 있었다**(09-11).
        매핑을 **빠뜨린** 역할은 **0종**이고, 매핑 안 된 9명은 `order` 역할 —
        `K3_UNMAPPED_BY_DECISION` 에 이름이 적힌 **선언된 결정**이다(매핑하면 배송 담당이
        재난 화면을 얻는다 · D-264).
        ★ **「빠뜨린 것」과 「안 하기로 한 것」을 같은 칸에 세지 않는다.** 판정기의 다섯째
          눈은 ㉡(빠뜨린 매핑)만 센다 — ㉠과 역할 0개 계정은 **세지 않고 찍는다.**

    ▣ **OPS-10 — 「발송까지」 섰다 · 「수신」은 대기**(세종 §5 · 닫지 않는다).
      등급 전수 구멍을 메웠다: info **0 → 2건** · warning **0 → 3건** · 총 **4 → 9건**.
      규칙 정체는 (등급·역할·구역)이라 **채널만 갈아끼운다** — 두 번 받는 일이 없다.
      ★ **이메일 어댑터는 이미 있었다. 없던 것은 「설정됐는가」를 묻는 자리다** —
        `EMAIL_HOST_USER` 기본값이 `your-email@gmail.com` 이라 `getattr` 로는
        **언제나 「값이 있다」로 보였다.** **「값이 있다」와 「보낼 수 있다」는 다르다**;
        기본값이 그 둘을 붙여 놓고 있었다. `configured()`/`deliverable()` 로 갈랐다.
      ★★★ **이번 턴에서 가장 중요한 발견 — 「수신 주소가 0개」가 아니었다.**
        규칙이 고르는 사람의 도메인을 실측하니 **yopmail.com 24 · org.kr 12 · seed.invalid 6.**
        채널을 `email` 로 켜는 순간 **기존 개발 계정 12명에게 진짜로 메일이 나간다.**
        그러므로 대표 주소를 넣는 것만으로는 안 되고 **규칙이 고르는 역할을 먼저 좁혀야 한다.**
        ⚠ 주소를 받기 전에 이것을 몰랐으면 **첫 발송이 곧 사고였다.**
        「발송처가 비어 있다」와 「발송처가 틀린 사람으로 차 있다」는 다른 문제이고,
        후자가 더 나쁘다 — 전자는 조용하고 후자는 소리를 낸다.

    ▣ **OPS-07 — 걸었다. 절은 안 닫는다.** compose 11개 서비스 전부에 앵커 하나로
      `json-file` + `max-size: 10m`/`max-file: 5`.
      ★ **보존 기간 [판정]: 컨테이너당 50MB 상한.** 근거 [실측] postgres 363 KB/일 ·
        redis 50 · minio 2 · gx-shell·gx-fe-build 0 → 50MB 는 약 140일 치.
        ★★ **그런데도 「N일 보존」이라고 적지 않는다.** `json-file` 회전은 **크기 기반**이라
          약속할 수 있는 것은 상한이지 기간이 아니다 — 시끄러운 하루가 오면 140일이 14일이 된다.
          그래서 **감사에 답하는 정본은 DB 감사 로그(90일)** 이고 컨테이너 stdout 은 단기 버퍼다.
          **이 판정이 없으면 상한을 거는 일이 곧 증거를 지우는 일이 된다.**
      ★ 판정기에 **④ 선언**을 붙여 **적용**(도커 `LogConfig`)과 **선언**(compose)을 갈랐다:
        ② 적용 빨강 5(컨테이너를 만들 때 굳는다) · ④ 선언 빨강 2 —
        `postgres`·`gx-fe-build` 는 **compose 밖 `docker run`** 으로 떴다(compose 라벨을 가진
        것은 minio 하나뿐). **compose 를 고쳐도 안 닿는다.**
      ⚠ **컨테이너를 하나도 재기동하지 않았다** — 다른 차선 셋이 그 위에서 동시에 일했다.
        **「선언이 섰다」를 「보존이 걸렸다」로 적지 않는다.** 그래서 넘긴다.
