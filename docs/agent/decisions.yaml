- id: D-421
  author_tree_id: "세종 지시서 2026-09-24 §2 S행 · LAW-08 · SEC-04 · ISO-03"
  title: "차선 S 병합 — **판정기가 제 눈으로 못 보던 자리**를 찾았고, 「55」가 틀린 수였다"
  status: decided
  raised_by: "차선 S 보고 2026-09-24 → 조율자 병합·검증"
  decision: |
    ▣ **LAW-08 증거 해시 체인 — 닫혔다** [실측 · 22 passed · 게이트 자기시험 17건]
      감사 한 줄이 저장될 때 `common/audit_writer.write()` **안쪽에서** 체인에 이어진다.
      실 DB 292행에서 3행을 이은 뒤 **한 행의 내용을 고치자 `ok=False` · hash_mismatch 1건**
      (트랜잭션 롤백). 「고치면 어긋난다」가 이 절의 전부이고, 그것을 실제로 보였다.

    ▣ ★ **PRD 와 갈린 자리를 차선이 덮지 않았다** — 이 병합의 값이 여기 있다
      「기존 `AuditLogs` 에 두 칸」이 **안 됐다**: 그 표는 dj-core §0.4 이고, 시험이
      `--nomigrations` 로 돌아 **모델에 없는 열은 시험 DB 에 서지 않는다** —
      열을 더하는 길은 **증거를 못 내는 길**이었다. 두 값을 우리 것인 `data_after` 의
      예약 키 둘로 두었다. 성질은 같고, 진짜 열로 옮길 때 고칠 곳은 두 함수뿐이다.
      ★ 그리고 `kernels/k1_event/evidence_chain.py` 를 **안 만들었다**: 증거 행 전부가
        이미 `audit_writer.write()` 한 곳을 지나고, 체인을 K1(L3)에 두면 L1 이 커널을
        import 해야 해 계층이 역전된다(`verify_layers` 가 멈춘다). `common/` 에 두었다.

    ▣ ★★ **ISO-03 — 두 실험의 차이가 게이트의 존재 이유다** [실측]
        · 문지기가 **없는** 새 라우트            → 기존 트립와이어 exit 1
        · 문지기는 부르되 **선언이 없는** 라우트 → 같은 게이트 **exit 0 (통과)** ← 구멍
        · 같은 라우트에 새 게이트                → **exit 1**, 이름으로 지목
      기존 461건은 **이름으로** 잠갔다(수가 아니라 이름 · D-249 · 래칫 D-311).
      절이 묻는 것은 「**새** 라우트가 선언하고 태어나는가」이므로 구현으로 적는다.

    ▣ ★★★ **SEC-04 의 「55」가 틀린 수였다** [실측 2026-09-24 · 인벤토리 재측정]
      라우트 **685건** 중 인증 콜백 없음 **100건**을 관할로 갈랐다:
        **우리 층 28** (authz 있음 10 · 아무것도 없음 18) · 저장소 밖 49 ·
        §0.4 금지구역 23 · 모듈 해석 실패 **0**
      55 는 09-09 자 수이고 **관할 구분이 없었다** — 우리가 못 고치는 자리와 고쳐야 하는
      자리가 한 수에 섞여 있었다. **표적이 준 것이 아니라 처음으로 표적을 알게 됐다.**
      그중 `stream_monitors` 12건에 **쓰기 면**이 섞여 있다(녹화 시작/중지 · 스트림 등록).

    ▣ 조율자 몫: `WRITE_NO_PROBE` 의 `append_evidence_hash` 를 **지우지 않고 사유를 바꿨다** —
      「아직 없다」→「면을 열지 않기로 했다」. 공개 면으로 내면 부르는 쪽이 **어느 체인에
      이을지 고르게 되고, 고를 수 있으면 남의 체인에 붙일 수 있다.**
