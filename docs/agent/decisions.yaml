- id: D-448
  author_tree_id: "세종 지시서 턴 E(2026-09-05) · QA/E2E"
  title: "3002 가 내주던 번들은 하루 낡은 사본이었다 — 이 턴의 모든 화면 증거가 그 사본의 증거였다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 E 병합(`5b00d13`) · QA/E2E (P-53 · P-59 · P-60)"
  decision: |
    ▣ ★★★ **3002 가 내주던 번들은 2026-09-04 07:17 사본이었다** — 현재 커밋보다 하루
      앞선다. **그래서 이 턴의 모든 화면 증거는 9-04 번들의 증거다.** 세 차선이 서로
      모르고 각자 같은 벽에 부딪혔고, **P-59 게이트가 태어난 첫날 그것을 지목했다.**
      ★★ P-53 재측: 5xx 턴 D **0.194%**(빨강) · 턴 E **0.083%**(초록) — **예산 0.1%가 두 벌
      사이에 놓인다.** 게이트가 「한 벌로 판정하지 마라」를 찍게 했고 **판정은 뒤집지 않았다**.
      ★ 오류가 표본의 5%를 넘으면 응답시간은 **회색**이다 — **502 는 빠르다.**
      서버가 죽을수록 초록이 되는 것을 막는다.
      ★ `capture_screens` 가 첫 불일치에서 죽어 **뒤 12장을 삼키고** 있었다 ·
      **세션을 빼앗기면 화면 결함이 아닌데 그렇게 적고 있었다**(16장이 「문구가 없다」로).
      ★ P-60 검증: 온보딩 63% 는 **셋째 술어로 잰 수가 맞다** — 갈린 행 0 · 내려간 행 0.
  enforced_by: |
    · scripts/verify_perf_budget.py :: 예산 게이트 넷 분리 · 오류율 5% 회색 규칙
    · scripts/verify_bundle_hash.py :: P-59 번들 해시 게이트
    · scripts/capture_screens.py :: 첫 불일치에서 죽지 않게 고침
  affects: [D-444]

- id: D-449
  author_tree_id: "세종 지시서 턴 E(2026-09-05) · Security"
  title: "동시 접속 1개는 설정이 아니라 자료구조였다 — 그리고 밀려난 화면 하나가 남의 세션을 끊었다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 E 병합(`5b00d13`) · Security (SEC-11a · P-58 · UX-24)"
  decision: |
    ▣ SEC-11a 217 → **205** · P-58 술어 ⑦ 신설 · UX-24 **판정 불가**.
      ★★★ **동시 접속 1개는 설정이 아니라 자료구조였다** — `user.token` 이 한 칸이고
      §0.4 라 못 고친다. 지어내지 않고 「지금은 1개다」를 characterization 으로 **고정**했다
      — 벽이 걷히면 빨개진다.
      ★★ 운영 사고 하나: **밀려난 화면의 요청 한 번이 살아 있는 세션의 재발급 토큰을 전부
      블랙리스트한다.** 월 모드는 20초마다 두드리는 화면이다 — **죽은 화면 한 장이 앉아 있는
      사람의 갱신을 끊는다.** 「가끔 로그아웃된다」의 유력한 뿌리.
      ★ 봉투 래칫이 **91 만큼 헐거웠다**(기준선 296 · 실제 217) — 205 로 조였다.
      ★ 술어 ①의 사각: `ev.code` 를 **읽지만** `switch(ev.key)` 로 **고르는** 코드 —
      그때 넷은 죽고 넷은 산다. 「가끔 안 먹는다」의 정확한 모양이다.
  enforced_by: |
    · backend/tests/test_s_session_limit.py :: UX-24 — 동시 1개 characterization · 토큰 수명 불변 고정
    · backend/tests/test_s_ime_keys.py :: ⑦ 한글 IME 상태 재현(P-58) — check_ime_replay
    · scripts/verify_envelope.py :: SEC-11a 봉투 래칫 205
  affects: [D-440, D-341]

- id: D-450
  author_tree_id: "세종 지시서 턴 E(2026-09-05) · DevOps/Release"
  title: "감사 쓰기가 3일치 12,468건 밀려 있었다 — 그리고 워커가 상한에 걸려 통째로 멈춰 섰다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 E 병합(`5b00d13`) · DevOps/Release (celery 워커·beat 신설)"
  decision: |
    ▣ celery 워커 1 · beat 1 신설(발화 누계 139 · 워커 수신·성공 실측) · OPS-07 **넘김**
      (상한 걸린 컨테이너 4/9 · 적용은 재기동 창).
      ★★★ **감사 쓰기가 3일치 12,468건 밀려 있었다.** 「감사에 답하는 정본」이 지워지지도
      않았지만 **쓰이지도 않고 있었다** — 안 지워진 것보다 이쪽이 크다.
      ★★ **워커가 통째로 멈춰 섰다** — 감사 쓰기 두 건이 상한을 넘긴 채 슬롯 둘을 다 잡아
      90초간 처리량 0 · 큐 +134. 운영에서 이것은 **감사 쓰기 몇 건이 파기·08:00 생존 알림·
      일일 앵커를 다 멈춘다**는 뜻이다. 하드 상한으로 지혈했다.
      ★★ **beat 는 뜨는 순간 즉시 발화한다** — 기동 0.5초에 14개가 나갔고 그 안에 감사
      파기가 있었다. **다치지 않은 이유는 시각이 아니라 잰 수다**(만료 행 0). 운영 DB
      였으면 그 순간 지워졌다.
      ★ **`purge_old_audit_logs` 도 하드 삭제가 아니다** — P-57 이 영상에 대해 고치는 그
      문제가 **감사 로그에도 그대로 있고 거기는 아무도 안 본다.**
      ★ 감사 로그가 FK 위반으로 **60건 영구 소실**되고 있었다.
      ★ 동시성 2→4 를 올렸다가 **되돌렸다** — 실패의 **종류**가 바뀌었다.
    ▣ 조율자 — 분모 133 등재 · 잠금 둘 신설(칸을 전부 채웠다) · 라우트 705 잠금
      (관문 없음 72 불변) · RUNBOOK STEP 2C 에 **빌드 → 배치 → 측정**(순서가 곧 내용이다:
      커밋 → 빌드 → 배치 → 잰다). 남은 빨강 1 — `test_screens_browser`. 씨앗 id 가 증거의
      열쇠에 들어가 같은 화면이 벌마다 다른 이름이 되던 것은 정규화로 고쳤고, **남은 하나는
      진짜다**: 새로 찍은 `/m/inbox` 의 API 기록이 없다. **덮지 않고 다음 촬영에서 갚는다.**
  enforced_by: |
    · backend/config/celery.py :: 워커 1 · beat 1
    · backend/common/audit_queue.py :: 하드 상한 지혈
    · backend/tests/test_q_heartbeat_digest.py
    · scripts/ops_monitor.py
  affects: [D-447]

- id: D-451
  author_tree_id: "조율자 운영 검증 · 턴 E(2026-09-05)"
  title: "판정기가 자기가 만든 폴더를 근거로 삼고 있었다 — 하루 낡은 번들을 갈아 끼웠다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 · 턴 E 병합(`5b00d13`) 뒤 운영 검증(`cce7f7b`)"
  decision: |
    ▣ ★★★ **번들을 갈아 끼웠다 — 하루 낡은 것이 서비스되고 있었다.**
      커밋 → 새 HEAD 로 빌드(`GX_COMMIT=5b00d13…`) → `gx-shell:/app/_fe_dist` 로 배치 → 잰다.
      `verify_bundle_hash --dist <배치된 자리>` → **exit 0 · `5b00d13 = 5b00d13`**
      이 순서(커밋 → 빌드 → 배치 → 측정)를 RUNBOOK STEP 2C 에 못박았다 —
      **순서가 곧 내용이다.**
      ★★★ **`capture_screens` 가 두 파일을 서로 다른 곳에 쓰고 있었다.**
      인덱스는 저장소에 닿는데 API 기록은 **컨테이너 안에 갇혔다.** 저장소의
      `screen_routes.json` 은 하루 전에서 멈춰 있었다.
      뿌리: 라우트 기록의 자리를 «`/repo/docs` 가 **있으면** 거기» 로 골랐는데,
      **자기가 `mkdir(parents=True)` 로 그 폴더를 만든다.** 첫 실행이 만들고 나면
      그 다음부터 이 판정은 언제나 「여기가 맞다」고 답한다 —
      **판정이 자기가 만든 흔적을 근거로 삼는다.**
      (인덱스 쪽은 폴더가 아니라 **파일의 실재**로 골라서 안 속았다.)
      고침: 라우트 기록도 **인덱스가 실제로 있는 자리**를 기준으로 삼는다.
      갇혀 있던 진짜 측정치를 꺼내 저장소에 넣었고(28장 · 라우트 27), 속이던 폴더를 지웠다.
      ★ **화면 28장 전부 통과**(`verify_screens` exit 0). 낡은 번들에서는 18장이었고
      10장을 못 찍었다.
      ★ 온보딩 화면의 파일 이름이 규약과 달랐다(`dsm_onboarding_start` → `start_onboarding`).
      이 화면의 뿌리는 `/dsm/...` 이 아니라 **`/start`** 다.
      게이트 13종 통과 11 · 실패 0 · 대기 2. `test_screens_browser` **3 passed**
      (턴 E 의 마지막 빨강 1 → 0).
  enforced_by: |
    · scripts/verify_bundle_hash.py :: --dist 배치 자리 검증
    · scripts/capture_screens.py :: 라우트 기록 자리를 파일 실재로 판단
    · scripts/verify_screens.py :: 28/28 · 페이지 오류 0
    · scripts/deploy.sh :: RUNBOOK STEP 2C 순서(커밋→빌드→배치→측정)
  affects: [D-427]

- id: D-452
  author_tree_id: "세종 지시서 턴 F(2026-09-05) · P-63 재기동 창"
  title: "게이트가 유령 파일 953개를 훑고 있었다 — gx-shell 의 /repo/frontend 는 마운트가 아니라 사본이었다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 F 병합(`a3f63d1`) — 재기동 창(P-63)을 차선 착수 전에 집행"
  decision: |
    ▣ ★★★ 재기동 창(P-63)을 차선 착수 **전에** 집행했다. 그 창에서 이 턴의 가장 큰 것이
      나왔다: `gx-shell` 의 `/repo/frontend` 는 마운트가 아니라 **사본**이었고 파일이
      1,956개 — 저장소 실제는 1,003개다. **953개가 유령**이었고 컨테이너 안에서 도는
      게이트 여섯이 그것을 훑고 있었다. 마운트로 바꾸니 1,003 으로 일치한다.
      「빌드했다」와 「서비스된다」 사이에 게이트가 서듯 —
      **「저장소에 있다」와 「게이트가 보는 것」 사이에도 게이트가 서야 한다.**
      · P-63 재기동 창: 상한 없던 다섯을 다시 만들어 **9/9 컨테이너 전부** 10m×5 ·
      전부 생존 · 앞단은 reload 하나(접근로그가 파일을 떠났다)
      ⚠ **번호-내용 매핑 주의**: 커밋 `a3f63d1` 은 D-452~D-456 다섯 번호를 한 번에
      선언했고, 이후 다섯 항목(UX-25 · UX-24a · OPS-17 · OPS-07 · P-65/OPS-19)에 개별
      D-번호를 붙이지 않았다. 이 등재는 커밋 본문의 서술 순서(유령 파일/P-63 → UX-25 →
      UX-24a → OPS-17 → OPS-07)를 그대로 따라 D-452~D-456 에 배정한 것이며, 조율자가
      실제로 어느 항목에 어느 번호를 매겼는지는 커밋 밖에서 확인되지 않는다.
  enforced_by: |
    · docker-compose.yml :: gx-shell 프런트 마운트(사본 아님)
    · scripts/verify_dormant.py — 스캔 대상이 유령 사본을 훑던 게이트 중 하나
  affects: []

