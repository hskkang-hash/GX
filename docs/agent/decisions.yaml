- id: D-433
  author_tree_id: "세종 지시서 2026-09-27 §3 턴 B · 차선 C"
  title: "화면을 「0 of 0」으로 만든 것은 **한 줄**이었다 — 그리고 메뉴는 우리 것이 아니었다"
  status: decided
  raised_by: "조율자(Code) 2026-09-27 · 차선 C (UX-20 · UX-21 · UX-22 · UX-10)"
  decision: |
    ▣ **UX-20 닫힘 — `verify_ui_copy` 잔여 18 → 0** [실측 · 조율자 재측 동일].
      7개 파일 18자리: 절 ID · 백틱 10곳 · 마크다운 `**` 2곳 · 영문 열거값 · 내부 경로.
      ★ **사유를 지우지 않고 옮겼다** — 「표시 7건(요청 상한 50건)」은 「7건 + ?」로,
        `Network Error` 원문은 「사진을 불러오지 못했습니다 · 다시 시도」로.
        지웠으면 UX-20 을 닫으면서 「사유를 적어라」를 깬 것이 됐을 것이다.
      ★★ **함께 고친 것 — `capture_screens.py` 의 `must_see` 8건.** 그 상수는 화면
        문자열의 **사본**이다. 화면만 고쳤으면 턴 D 재촬영이 전부 빨개졌을 것이고,
        **그 빨강은 화면 결함이 아니라 사본이 뒤처진 것** — 가장 헷갈리는 종류다.
        **두 자리에 같은 문자열이 살면 하나를 고칠 때 둘을 고쳐야 한다.**
      ⚠ **기준선을 `--freeze` 하지 말 것** — 잔여 0에서 freeze 하면 기준선이 빈 집합이 되고
        게이트가 **exit 2(판정 불가)** 를 낸다. 닫은 절이 회색으로 되돌아간다.

    ▣ **UX-22 닫힘 — 라벨 사전만 바꿨다.** `severity` 값(critical/warning/info)은
      **그대로 두고** 표시만 「심각·경계·주의」로 — 값을 바꿨으면 계약이 바뀌었다.
      축을 줄였다: 목록 **세 열 → 두 열** · 상세 **넷 → 둘** · 모바일도 같이.
      「기각」을 없애 **오탐 한 낱말**로. 「종결(으)로」는 동사꼴로 → **프로그램이 만든 조사 0건.**
      새 `ResponseSteps.tsx` 로 **관제와 모바일이 같은 말을 쓰게** 했다 —
      두 화면이 다른 말을 쓰면 그것이 다음 결함이다.

    ▣ **UX-10 닫힘 — 막던 것은 한 줄이었다.**
      `useMediaData.ts` 의 `catch (error) { console.error(error); }`. 실패가 콘솔에만 남고
      표는 앞의 빈 상태로 서 있어 **「0 of 0」** 이 됐다 — **당직자에게는 「영상이 없다」다.**
      이제 저장소 미도달은 「**저장소에 연결할 수 없습니다 · 다시 시도**」(세종 P-36),
      그 밖은 「목록을 불러오지 못했습니다」 — **두 문장을 가른다.**
      표를 억지로 비우지 않고 **그 위에 덮어 말한다** — 빈 표는 「없다」로 읽힌다.
      서버도 `500 → 503`, **저장소 미도달일 때만**(`minio_client.available` 로 가름).
      500 은 「우리가 깨졌다」고 말하고 그 말은 고치는 사람을 **볼 것 없는 곳으로 보낸다.**
      ★ **`route-alive` 에 예외를 넣지 않았다**(D-327). 그 게이트는 `status >= 500` 을
        죽은 것으로 읽고 503 도 그 안이다 — **화면이 사실을 말하게 된 것과 저장소가
        살아난 것은 다른 일이다.**

    ▣ **UX-21 — 화면 쪽 셋은 닫았고, 남은 하나는 우리 손이 아니었다 → 잠김.**
      닫은 셋: 로고 자산 이름의 공백 제거(**사본을 더했고 원본은 안 지웠다** — 삭제는
      위임 밖 · [실측] 번들 URL 에서 `%20` 이 사라졌다 · [추정] 그것이 렌더 실패의
      원인인지는 **재촬영이 가른다**) · 첫 화면 역할 경고를 사전 문장으로 · 개발 계수기를 「?」 뒤로.
      ★★ **「메뉴 등재를 뺀다」가 우리 손 안이 아니었다** [실측]. 사이드바 정본은
        **dj-core DB 의 `core.menu.models.Menu` 107행**이고, 우리 저장소에 메뉴를 등재하는
        코드가 **0건**(`grep role_menus|user_menus backend/`). `core.*` 는 §0.4 다.
        남은 길은 **DB 행 제거 = 삭제 = 대표 승인**(위임 밖).
      ★ **09-26 의 「라우트는 그대로 두고 메뉴 등재를 뺀다」는 옳은 방침이었고 틀린
        전제였다** — 우리가 뺄 수 있는 등재가 있다고 보았는데 없었다.
        **방침을 바꾸지 않는다 — 여는 열쇠가 우리 손이 아님을 적을 뿐이다.**
      ★ **우회를 만들지 않았다.** 프런트에서 손수 걸러내면 **서버가 준 목록과 화면이
        보여 주는 목록이 갈린다.** 갈리는 순간 하나는 거짓말이고 다음 사람은 어느 쪽이
        정본인지 모른다 — 두 표를 두지 않기로 한 규칙(D-346)의 화면판이다.
      잠금 `MENU_REGISTRY_LIVES_IN_DJCORE_DB` 등재 · 해소는 **역할-메뉴 연결만 끊는 것**
      (메뉴 행도 라우트도 지우지 않는다 — 그래서 되돌릴 수 있다).
  enforced_by: |
    · scripts/verify_ui_copy.py :: 잔여 0 (기준선 18 · 갚은 것 18)
    · scripts/verify_ui_secrets.py :: 렌더 문자열 0건 (775개 파일)
    · frontend/src/features/dsm/components/ResponseSteps.tsx (신규) · severity.ts
    · frontend/src/features/MediaData/hooks/useMediaData.ts :: listError
    · backend/media_data/views/media_data_view.py :: 503 (storage_down 일 때만)
    · scripts/capture_screens.py :: must_see 8건 — 화면과 같은 커밋
    · docs/agent/evidence/DA-05/blockers.yaml :: MENU_REGISTRY_LIVES_IN_DJCORE_DB
  affects: [D-264, D-286, D-327, D-346, D-378, D-396, D-397, D-412, D-429]

- id: D-434
  author_tree_id: "대표 승인 2026-09-05 (삭제 · 이메일 주소) · 세종 지시서 턴 C §1 판정 P-40~P-46"
  title: "한 층을 걷어내자 **다음 층이 보였다** — 그리고 「09-27」은 날짜가 아니었다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 · 턴 C 선작업 (대표 승인 집행 + P-42·P-43·P-44 집행)"
  decision: |
    ▣ **대표 승인 1 집행 — `stream_monitors/tasks/record_task.py` 삭제 (328줄).**
      ★ **지우기 전에 다시 쟀다**(D-428 의 규율 그대로 — 분류는 늙는다):
        저장소 전체에서 `RecordingTask`·`record_task` 참조 **0곳** · import **0건**.
        D-428 이 지운 두 서비스(999줄)가 그 클래스의 유일한 사용처였다.
      ★★ **그리고 지우자 두 개가 더 드러났다 — 세 번째 층이다.**
        ① 함수 `stream_monitors/utils/redis_client.py::update_recording_status`
           — 지운 파일이 유일한 호출처였다. `dormant` 게이트가 즉시 잡았다.
        ② 필드 `stream_monitors.StreamMonitorRecord.stream_id`
           — 지운 파일이 유일한 기록자였다. `dead-fields` 게이트가 즉시 잡았다.
             ⚠ **읽는 곳도 시험 2곳뿐이다 — 시험만 쓰는 필드는 운영에서 죽은 것이다.**
        둘 다 **지우지 않고 이름으로 등재**했다(삭제는 대표 승인 사항).
        기준선은 여전히 **줄었다**: 2줄 빼고 1줄 더했다.
      ★ **죽은 코드는 층으로 쌓이고, 한 층을 걷어야 다음 층이 보인다.**
        D-428 이 「죽은 코드는 층으로 쌓인다」고 적었을 때 그것은 **한 번의 관찰**이었다.
        이번에 같은 일이 다시 났으므로 이제 그것은 **패턴**이다 — 다음 삭제 승인을 올릴
        때는 「이것을 지우면 무엇이 드러나는가」를 **미리 세어서** 함께 올린다.
      ★ 게이트 둘이 사람보다 먼저 알았다. 내가 「다 지웠다」고 보고할 뻔한 자리를
        `dormant` 와 `dead-fields` 가 각각 한 건씩 잡았다 — **삭제의 값은 지운 줄 수가
        아니라 드러난 층이다.**

    ▣ **대표 승인 2 집행 — 경보 수신 주소.** 값은 **로컬 `backend/.env` 로만**(D-204).
      저장소에는 이름만 있다(`backend/.env.example`).
      ⚠ **채널은 `log` 로 두었다.** 주소를 받았다고 켜지 않는다 —
        P-41 허용 도메인 게이트가 서기 전에 켜면 그 주소가 아니라
        **개발 계정 12명에게 나간다**(D-432 실측). **순서를 바꾸면 사고다.**
        「수신 주소를 넣었다」와 「그 사람에게만 간다」는 다른 일이다.

    ▣ **P-42 집행 — 규약은 부르는 곳과 같은 턴에 태어난다.**
      `webhook_contract.py` 머리에 `intended_caller: UX-19 웹훅 CAP 1.2 · 턴 C` 를 적었다.
      dormant 빨강 3은 **그대로 둔다** — 기준선 등재 금지(세종 판정).
      그 줄은 장식이 아니라 **기한**이다: 그 턴이 지나도 안 불리면 삭제 후보로 간다.

    ▣ **P-43 집행 — `.gitattributes` 로 줄 끝을 못 박았다** (`* text=auto eol=lf`).
      ★ 왜 이것이 규율의 문제인가 — `core.autocrlf=true` 인 기계에서 작업 트리를 보면
        **손대지 않은 파일 수백 개가 「변경됨」으로 뜬다.** 그 상태의 `git add -A` 는
        **무엇을 고쳤는지를 커밋에서 지운다.** 이 저장소는 커밋 메시지에 무엇을 왜
        고쳤는지 적는 것을 규율로 삼는데(D-301), 개행 잡음이 그 규율을 조용히 무력화한다.
      [실측] 이번 커밋의 스테이지 73건은 `--ignore-cr-at-eol` 로 세어도 73건 —
      개행만 바뀐 파일은 **한 건도 섞이지 않았다.**

    ▣ **P-44 집행 — 시계를 바로잡았다. `docs/agent/CLOCK.md` 신설.**
      ★★ **지시서의 「2026-09-27」은 날짜가 아니라 발행 순번이었다.** 기계 시계로
        그날은 **2026-09-05** 다. 세종이 순번을 날짜처럼 적었고 Code 는 그것을 날짜로
        읽어 증거에 `[실측 2026-09-27]` 로 옮겨 적었다. 세종 오류 +1 (누계 **13**).
      ★ **왜 오래 안 보였나 — 두 수가 둘 다 그럴듯했기 때문이다.** 09-27 은 진행감과
        맞았고 09-05 는 파일 타임스탬프와 맞았다. 어느 쪽도 혼자서는 이상하지 않다.
        갈린 것은 **차선 E 가 두 수를 나란히 놓고 물었을 때**다 —
        「증거 머리는 09-05 인데 본문은 09-24 다. 어느 쪽으로 통일할까」.
        **한 갈래만 재면 어느 쪽이든 그럴듯하다**(D-408)가 날짜에서 다시 났다.
      규칙: 이제부터 기계 날짜 + 턴 부호(`20260905_TC`). **지난 파일은 이름을 바꾸지
      않는다**(`remaining_40.md` 와 같은 이유) — 대신 CLOCK.md 의 대응표가 열쇠다.
      ⚠ 옛 문서의 `[실측]` 은 **여전히 실측이다 — 잰 것은 진짜이고 날짜만 틀렸다.**
        둘을 같이 버리면 멀쩡한 증거를 함께 잃는다.

    ▣ **P-41 선작업 — 허용 도메인 이름 셋을 `.env.example` 에 세웠다**(값은 로컬).
      `K2_SEND_ALLOWED_DOMAINS` · `K2_OPS_ALERT_ROLE_CODES`.
      ★ **왜 차단 목록이 아니라 허용 목록인가** — 막을 것을 세는 방식은 **새로 생긴
        개발 계정을 자동으로 통과시킨다.** 오늘 42명을 다 적어도 내일 43번째가 들어온다.
        허용 목록은 **모르는 것을 기본으로 막는다** — 실수의 방향이 안전한 쪽이다.
      ★ 비어 있으면 **전부 로그**다: 「목록을 잊었다」가 「전부 허용」이 되지 않게.
      구현·판정기(`verify_send_allowlist.py`)는 턴 C 차선 Q 몫이다.

    ▣ **차선 Q 의 프로브가 분류 게이트에 걸렸고, 그 걸림이 옳았다.**
      `probe_event_rate_limit.py` 가 **스트림 300대를 진짜로 심는다.** 그 표가 공용
      마스터였다면 측정하는 4초 동안 **전 테넌트 관제 화면에 유령 카메라 300대가 떴을
      것이다.** 이제 심기 **전에** `verify_alarm_budget::_refuse_if_shared_master` 를
      **재사용해서**(판정식을 복사하지 않는다 · D-212) 등록부에 묻는다.
      ★ 음성 대조를 함께 돌렸다 — 공용 마스터(`user.Timezone`)를 넘기니 **실제로 멈췄다.**
        **물지 않는 문지기는 세워 둔 것과 같다.**
  enforced_by: |
    · .gitattributes — * text=auto eol=lf (P-43)
    · docs/agent/CLOCK.md — 순번↔기계일 대응표 (P-44)
    · backend/common/webhook_contract.py :: intended_caller (P-42)
