- id: D-442
  author_tree_id: "세종 지시서 턴 D(2026-09-05) · 차선 L"
  title: "이 저장소의 delete() 는 대개 지우지 않는다 — 보존기간 약속과 소프트 삭제가 충돌했다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 D 병합(`3d40cf6`) · 차선 L (LAW-02a · LAW-06 · LAW-07)"
  decision: |
    ▣ ★★★ **이 저장소의 `delete()` 는 대개 지우지 않는다** — dj-core 가 소프트 삭제다.
      보존기간을 약속해 놓고 소프트 삭제를 쓰면 **지운 척**이 되고, 평범한 조회에서는
      똑같이 안 보이므로 **아무도 모른다.** `HARD_DELETE` 를 명시했다.
      ★ LAW-07 의 「원본 0건」을 **양성 대조와 함께** 냈다 — 원본 경로가 실제로 채워져
      있음을 먼저 단언한 뒤 0 을 쟀다. **빈 자료에서 난 0 은 0 이 아니다.**
      ★ 남의 테넌트 청구는 「권한 없음」이 아니라 **「없다」**로 답한다 —
      「권한 없음」은 그 접수번호가 **있다는 사실**을 알려 준다.
      ★ 법정 회신 기한을 시험이 강제하지 않았다 — **없는 기한을 시험이 강제하면 그 수가
      계약처럼 읽힌다.** 다섯 의무의 충족 수준은 법률 검토 대기.
    43 passed, 1 skipped. 영역 ⑧ 22% → 56%.
  enforced_by: |
    · backend/tests/test_l_retention.py :: LAW-02a — HARD_DELETE 명시
    · backend/tests/test_l_ai_act.py :: LAW-06
    · backend/tests/test_l_privacy_request.py :: LAW-07 — 「없다」 응답 · 원본 양성 대조
    · backend/apps/dsm/legal_notice.py
  affects: [D-437]

- id: D-443
  author_tree_id: "세종 지시서 턴 D(2026-09-05) · 차선 E"
  title: "502 를 0 으로 만드는 방법은 있다 — 그리고 그것을 쓰면 안 된다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 D 병합(`3d40cf6`) · 차선 E (OPS-13a 닫힘 · OPS-07 넘김)"
  decision: |
    ▣ ★★ **OPS-13a 닫힘.** 502 를 0 으로 만드는 방법은 있다. 그리고 **그것을 쓰면 안 된다**
      — 워커 재활용을 끄면 502 도 재시도도 정확히 0 이 된다. **결함을 고친 0 이 아니라
      숨긴 0** 이고, 그 실험이 오히려 모든 502 가 재활용에서 왔다는 것을 상관이 아니라
      **인과로** 증명했다. 같은 초 502 100% · 정상 응답 대조 18% — 대조가 없으면 이 표를
      못 읽는다.
      ★★ **정본이 지워지지 않고 있었다.** 「감사에 답하는 것은 DB 감사 로그(90일)」라고
      못박아 두었는데 이 기계에 **celery 워커가 0개**다. purge beat 는 적혀만 있고
      **실행할 자리가 없다** — 감사 로그도 무한 적재다.
      ★★ **「50MB = 140일」 판정이 뒤집혔다** — 앞단 뒷단이 247MB/일을 토한다(약 5시간 치).
      옛 판정을 지우지 않고 뒤집힌 채로 남겼다.
      ★ **판정기가 눈이 멀어 있었다**: 턴 C 가 세운 앞단 둘이 컨테이너 목록에 없어
      일곱 중 여섯을 세고 「전수」라며 초록을 냈다. 목록 신선도 검사를 달았다.
    ▣ **OPS-07 은 넘겼다** — 쟀고 exit 1(celery 워커 0개 · 재기동 창이 여는 문제).
  enforced_by: |
    · scripts/verify_front_line_502.py :: 목록 신선도 검사 · 컨테이너 7종 전수
    · docs/agent/evidence/OPS-13/ · docs/agent/evidence/OPS-13a/ · docs/agent/evidence/OPS-07/
  affects: [D-437]

- id: D-444
  author_tree_id: "조율자 병합 판정 · 턴 D(2026-09-05)"
  title: "내가 낸 초록 하나가 거짓이었다 — 빌드가 낡은 사본을 빌드했다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 D 병합(`3d40cf6`)"
  decision: |
    ▣ ★★★ **내가 낸 초록 하나가 거짓이었다 — 빌드가 낡은 사본을 빌드했다.**
      `vite build` exit 0 · 57초를 「병합된 코드가 선다」로 적었는데, `gx-fe-build` 의
      `/app` 은 저장소를 물고 있지 않았고 그 사본에 이 턴의 화면 셋이 **한 장도 없었다.**
      소스를 넣고 다시 빌드해(55초) 번들에 `Wall`·`CameraGrid`·`PrivacyRequests` 가
      실재하는 것까지 봤다. **exit 0 은 무엇이 성공했는지 말해 주지 않는다.**
      ★★ **게이트를 빨갛게 만든 것도 차선이 아니라 나였다.** 새 라우트 9건 404 는
      서버가 옛 코드를 물고 있어서였고, 재기동한 뒤 난 503 둘은 내가 **MinIO 자격증명
      없이** 띄워서였다. 원래 프로세스는 손으로 얹어 띄운 것이고 **그 절차가 어디에도
      적혀 있지 않았다** — 게이트가 초록이던 것은 그것이 죽지 않았기 때문이다.
      ★ **낡은 인벤토리가 또 초록을 만들고 있었다**(D-427 재발): 사진이 2.8시간 전 것이라
      690=690 PASS 가 났는데 코드는 이미 699였다. `--refresh` 로 9건을 잡고 `--freeze`.
      관문 없는 라우트 **72 불변** — 새 아홉 전부 문지기가 섰다.
      ★ 온보딩 재측에서 **올리지 않은 행 둘**이 이 재측의 값이다: 스냅샷 문은 열렸으나
      휴대전화 화면이 안 그리고, 카메라 상태 칸은 월 모드가 냈으나 그것은 자리 화면이 아니다.
      **문이 열린 것과 그 사람이 여는 것은 다르다.**
      ★ PERF-04 에 빨강 한 줄을 못박았다 — 예산 게이트는 「오류가 있으면 예산과 무관하게
      빨강」이라 지금 빨갛다. 응답시간 자체는 예산 안이다. **두 수를 나란히 둔다.**
      ★ 커밋 훅이 셋을 잡았고 셋 다 진짜였다: 새 판정기 둘의 **출생 표본 없음**(D-310) ·
      새 시험의 **캐시 처리 표기 없음**(D-341) · 파일 끝 개행. 갚고 다시 커밋했다.
  enforced_by: |
    · scripts/verify_route_inventory.py :: --refresh · --freeze — 관문 없는 라우트 72 불변
    · scripts/probe_route_inventory.py
    · scripts/verify_perf_budget.py :: PERF-04 오류 우선 판정
  affects: [D-427, D-310, D-341]

