- id: D-378
  author_tree_id: "지시서 D-378"
  title: "**「사용자에게는 같은 일이다」** — 결함 등급은 내부 원인이 아니라 보이는 것으로 정한다"
  status: decided
  raised_by: "세종(기획) 2026-09-12 · 자기 오류 정정 · Code 판단 채택"
  decision: |
    ▣ 정본으로 올린다: **결함의 등급은 내부 원인이 아니라 「사용자에게 무엇으로
      보이는가」로 정한다.** 이벤트가 사라지는 것과 화면이 안 바뀌는 것은 내부적으로
      전혀 다르지만, **당직자에게는 같다.**

    ▣ 세종의 정정 인정: 「재난 때 이벤트가 사라진다」는 **일어나지 않았다** — rate_limited(200)
      은 캐시 무효화 하나뿐이고 이벤트 행은 상한도 큐도 없다. D-369 는 원인을 잘못 짚었다.
      그러나 처리는 옳았다: 폭주는 곧 재난이고, 그때 관제 화면이 옛 데이터를 보여 주면
      **보는 사람에겐 같은 일**이다.

    ▣ ★ **이 결정이 이번 턴에 곧바로 값을 했다** [실측 2026-09-12]
      브라우저를 처음 붙였더니 「이벤트 목록」 화면이 「불러오지 못했습니다 ·
      Request failed with status code 500」 이었다. 내부 원인은 사소해 보였다 —
      from __future__ import annotations 와 @tenant_scoped 가 겹쳐
      pydantic 이 datetime 주석을 못 푼 것(QueryParams is not fully defined).
      **그러나 당직자에게 그것은 「이벤트가 안 보인다」이다.** 등급을 원인이 아니라
      보이는 것으로 정했으므로 그 자리에서 고쳤고, 500 → 200 이 됐다.

      ★ 그리고 이 결함은 **단위 시험 530건이 전부 초록인 채로** 운영에서 죽어 있었다 —
        시험은 services.recent_events 를 직접 부르고, 죽는 자리는 **라우트가 질의
        인자를 만드는 순간**이기 때문이다. 착시 ⑨(D-377)의 교과서적 사례이고,
        **화면을 띄운 첫 순간에 나왔다. 화면이 시험이었다.**
  enforced_by: |
    · backend/apps/dsm/api.py — 미래 임포트를 **일부러 쓰지 않는다**(사유 주석 포함)
    · docs/agent/evidence/D-347/screens/SCREENS-1/OPERATOR/dsm_events.png — 고친 뒤의 목록
  affects: [D-284, D-290, D-301, D-369, D-377]

- id: D-379
  author_tree_id: "지시서 D-379"
  title: "「구현하라」를 **「동작하게 하라」**로 바꾼다 — 수단을 지시하지 않는다"
  status: decided
  raised_by: "세종(기획) 2026-09-12 · 자기 규약 개정"
  decision: |
    ▣ 규약: 지시서의 「구현하라」 항목은 **착수 전 확인이 의무**다.
      확인 결과를 한 줄로 회신한다: 이미 있음(경로) / 부분 있음(무엇이 없나) / 없음.
      「이미 있음」이면 만들지 않는다 — 없는 것(배선·주기·설정)만 채우고 **정정 보고**를 낸다.

    ▣ ★ 세종이 스스로 내린 결론: **「구현하라」를 쓸 자격이 없다.**
      앞으로 **「이 기능이 동작하게 하라」**로 쓴다. 만들지 켤지는 실측이 정한다.
      D-312(보안 지시는 수단이 아니라 금지 대상으로)의 형제다 — **수단을 지시하지 않는다.**

    ▣ ★ 이번 턴의 착수 전 확인 [실측 2026-09-12] — **또 「이미 있음」이 나왔다**

        지시 ③ 영상 백업     **이미 있음 — 도구도, 그리고 ★ 측정까지도**
                             scripts/ops_backup.py · ops_restore.py (D-354 ①) 뿐 아니라
                             evidence/D-356/restore_objects_run.md 가 **이미 해시 3/3 을
                             적어 두고 있었다** [2026-08-29]. 지시서의 「두 턴 미측정」이
                             사실과 달랐다 — 정정은 D-384 ③ 에 있다.
                             없던 것은 **이 환경에서의 재현**과 **다시 잴 발판**이다
        지시 ⑥ 자격증명 등재 **부분 있음** — 표 ②(k5_trust/credentials.py)가 있다.
                             없던 것은 **들어오는 키의 줄**과 **배포 전 점검**이다
        지시 ⑦ 역할 매핑     **이미 있음** — config/k3_roles.py 에 7종이 이어져 있다(D-373).
                             없던 것은 **검수 항목**과 **대장 등재**다
        지시 ② 브라우저 캡처 **없음** — 구동체가 실제로 없었다. 이번에 만들었다

      ★ 넷 중 셋이 「이미 있음/부분 있음」이다. **세 턴 연속으로 같은 비율**이다.
  enforced_by: |
    · scripts/verify_dormant.py — **「이미 있는가」를 사람이 아니라 도구가 답한다.**
      「구현하라」를 받았을 때 먼저 이것을 돌리면 ㉠㉡㉢ 어디에 있는지가 나온다.
      규약을 주석에 적는 것으로는 부족하다는 것이 D-379 의 요지이므로, 이 결정문의
      집행자도 문서가 아니라 도구여야 한다 (D-286).
    · docs/agent/decisions.yaml — 이 결정문의 착수 전 확인 표
      (D-371 ④ 가 정본 형식으로 정한 그 표 · 이번 턴 4건)
  affects: [D-286, D-312, D-333, D-369, D-371, D-377]

- id: D-380
  author_tree_id: "지시서 D-380"
  title: "결정 번호는 **저장소가 정본**이다. 지시서의 번호는 제안이다"
  status: decided
  raised_by: "세종(기획) 2026-09-12 · 상시 규약"
  decision: |
    ▣ 규약(상시): 지시서의 번호는 **제안**이다. 착수 시 **저장소 기준 다음 가용 번호로
      재배치**하고 **대응표를 남긴다.** 다시 묻지 않는다.
    ▣ [실측 2026-09-12] 이번에는 **어긋난 것이 0건**이다 — 지시서도 이 트리도 D-377 이
      다음이었다. 지난 턴에 덮지 않고 이어 둔 결과다.
    ▣ ★ **1:1 인 것도 대응표에 적는다.** 「어긋났을 때만 적는다」로 두면 다음 사람이
      표 없는 턴을 보고 「대조를 안 했다」인지 「대조했는데 같았다」인지 구별하지 못한다.
      0건도 세는 것이 D-301 이다. 표는 이 절 머리말에 있다.
  enforced_by: |
    · docs/agent/decisions.yaml — 이 절 머리말의 번호 대응표 (1:1 · 어긋남 0건)
  affects: [D-301, D-322]

- id: D-381
  author_tree_id: "지시서 D-381"
  title: "문을 여는 것은 「타입오류 0」이 아니라 **「빌드 1회 성공」**이다 — 그리고 실제로 열렸다"
  status: decided
  raised_by: "세종(기획) 2026-09-12 판정 · Code 실측 이행"
  decision: |
    ▣ 지시대로 **둘을 나눠 답한다** [실측 2026-09-12]:

          빌드   npx vite build → **exit 0 · 66초** · 번들 산출됨.  **선다.**
          타입   tsc --noEmit   → **3229건.**  그대로다. 손대지 않았다.

      ★ 그리고 **그 하나로 문이 열렸다** — 스크린샷 **0장 → 3장**(D-384 ②).
        문턱을 낮춘 판정이 옳았다. 타입오류 0을 목표로 삼았으면 이번 턴에도 0장이다.

    ▣ ★ 판 결정 ①~④ 을 실측했고, **④에 걸렸다** — 그것이 진짜 결함이다:
        ① 저장소가 요구하는 판  frontend/package.json :
             "rj-core": "git+ssh://…/rj-core.git#rj-core-v2" — **커밋이 아니라 브랜치**다
        ② 컨테이너에 설치된 판  gx-fe-build:/app/node_modules/rj-core → version 1.0.0
        ③ 둘을 대조하려 했으나 —
        ④ ★ **frontend/ 에 lock 파일이 없다** [실측]. package-lock.json 도
           yarn.lock 도 pnpm-lock.yaml 도 없다.
           → **「저장소가 정본이다」를 적용할 대상 자체가 없다.** 브랜치 참조는 같은
             명세로 날마다 다른 것을 설치한다. **판의 진실이 저장소에 없다.**
             D-381 ④ 가 「lock 이 없으면 그것이 진짜 결함」이라 한 그 상태이고,
             3229건의 뿌리가 여기다. **lock 고정이 첫 일**로 대장에 올렸다.

    ▣ ⚠ [실측] 첫 빌드는 **JS 힙 부족으로 죽었다**(기본 2GB · 단일 청크 16MB).
      NODE_OPTIONS=--max-old-space-size=6144 로 넘겼다. 이것은 **판 어긋남이 아니라
      번들 크기**의 문제다 — 둘을 섞어 읽으면 lock 을 고쳐도 빌드가 안 서는 이유를 못 찾는다.

    ▣ 처리 원칙 그대로: **새 코드 100% · 기존 래칫.** 3229 를 0 으로 만드는 일은
      이번 국면의 일이 아니다. features/dsm/ 의 오류는 여전히 **0건**이다.
  enforced_by: |
    · docs/agent/evidence/DA-05/blockers.yaml :: FRONTEND_DEPS_DRIFT
      (partial_unblock 에 「빌드는 선다 · 타입은 3229」를 **나눠서** 적었다 ·
       blocks 에서 BROWSER_E2E_HARNESS 를 뺐다 · unlock_step ⓪ = lock 고정)
  affects: [D-207, D-301, D-347, D-348, D-358, D-376]

- id: D-382
  author_tree_id: "지시서 D-382"
  title: "**막은 것에는 여는 절차가 함께 있어야 한다** — 차단은 절반이고 나머지 절반은 복구 경로다"
  status: decided
  raised_by: "세종(기획) 2026-09-12 판정 · Code 이행"
  decision: |
    ▣ 판정 유지: AI 서비스 콜백 두 자리를 막은 것을 **되돌리지 않는다.** 계약 경로
      (gRPC · F-02·F-10)에 안 닿으니 계약 위험이 없고, 인증 없는 쓰기 콜백을 열어 두는
      쪽이 더 나쁘다.

    ▣ ★ 그러나 **막기만 하고 여는 절차가 없으면 다음 배포에서 조용히 깨진다.**
      깨지는 모양이 특히 나쁘다: AI 서버가 401 을 받고, **아무도 안 죽으므로 아무도
      모른다.** 며칠 뒤 「검출이 왜 안 되지」가 된다. 그래서 셋을 함께 만들었다:

        ① 표 ② 등재 — INBOUND_AI_CALLBACK_KEY · api_type · capability · 5값 상태
           ★ **들어오는 키가 표 ②에 처음 들어온다.** 그래서 이름에 INBOUND_ 를 박는다 —
             D-337(동음이의)이 잡은 혼동은 「API Key」 한 단어가 두 방향을 가리킨 것이고,
             방향을 **이름으로** 말하지 않으면 그 혼동이 표 안으로 들어온다.
           ★ 상태는 absent 다. **아직 받지 않았다는 것이 사실**이고,
             「받을 예정」을 present 로 적으면 표가 계획서가 된다. 계획서는 배포를 못 막는다.
        ② 배포 전 점검 — scripts/verify_deploy_ready.py.
           --for-deploy 로 부르면 present 미만일 때 **exit 1**.
           ★ 문턱이 typed 가 아니라 present 인 이유: 기능 코드가 읽어도 되는가
             (typed · verify_credential_store)와 **이 환경에 값이 실렸는가**는 다른
             질문이다. 합치면 「무슨 키인지 아직 안 적었다」가 배포를 막는다 — 서류
             문제이지 운영 문제가 아니다.
        ③ 「없으면 무엇이 깨지나」를 요구 목록에 **함께** 적는다.
           배포를 막는 빨간불은 **막힌 사람이 스스로 풀 수 있어야** 한다.

    ▣ ★ 원칙으로 올린다: **차단은 절반이다. 나머지 절반은 복구 경로다.**
      앞으로 무언가를 막을 때 여는 절차가 없으면 그 차단은 미완이다.
  enforced_by: |
    · backend/kernels/k5_trust/credentials.py :: INBOUND_AI_CALLBACK_KEY (표 ② · absent)
    · scripts/verify_deploy_ready.py — 자기시험 6갈래 · --for-deploy 에서 exit 1
    · docs/agent/evidence/DA-05/blockers.yaml :: AI_CALLBACK_NEEDS_CREDENTIAL
  affects: [D-204, D-319, D-325, D-328, D-335, D-337, D-367, D-370]

- id: D-383
  author_tree_id: "지시서 D-383"
  title: "역할↔프리셋 7종 승인 — **인용이 아니라 우리 판정**이다. 나머지 8종은 고객이 정한다"
  status: decided
  raised_by: "세종(기획) 2026-09-12 승인 · Code 이행"
  decision: |
    ▣ 7종 이음 **승인.** 그리고 그 표기를 대장에 남겼다 —
      **「인용이 아니라 우리 판정」**이라는 사실 자체가 이 표에 대한 가장 중요한 정보다.
      ★ 왜 그런가: 옮겨 적은 표는 원본을 찾아 대조할 수 있지만, **판정한 표는 판정한
        사람에게 물어야 한다.** 어느 쪽인지 모르면 아무도 못 고친다 (D-322 의 계열).

    ▣ 나머지 8종은 **「미배선」으로 대장에 등재**했고 **추측으로 채우지 않았다.**
      이름의 유사도로 자동 매핑하는 대안을 검토하고 **버렸다** — drone_robot_admin 에
      MANAGER 를 주면 배송 관리자가 재난 임계값 편집 화면을 얻는다. **추측이 만든 권한은
      아무도 자기가 가진 줄 모른다** (D-280).

    ▣ ★ 검수 콘솔에 **UX-05 「역할↔화면 매핑 확인」**을 추가했다. 셋을 묻는다:
        ㉠ 이은 7종이 맞는가  ㉡ 빠진 것이 있는가  ㉢ 이건 보이면 안 된다 가 있는가
      **이것이 검수 콘솔의 첫 실전 용도다 — 화면이 없어도 할 수 있는 검수다.**

    ▣ ★★ 그리고 이번 턴에 **그 질문이 화면에 찍혔다** [실측 2026-09-12]:
      캡처한 관제 대시보드(SCREENS-1/OPERATOR/dsm_dashboard.png) 상단에
      「역할 매핑을 찾지 못해 가장 좁은 화면으로 떨어졌습니다」가 그대로 나와 있다.
      **캡처가 잠금의 증거를 겸한다** — 검수 자리에서 말로 설명할 필요가 없다.
      지우지 않았다. 예쁘게 만든 화면은 D-347 ①이 금지한 그것이다.

    ▣ ⚠ 지금 상태는 **안전한 쪽으로 틀려 있다**: 매핑에 없는 역할은 가장 좁은
      프리셋으로 떨어지고, 편집(E)은 설정 없이는 절대 참이 되지 않는다.
      그래서 이 잠금은 「위험」이 아니라 **「미확정」**이다.
