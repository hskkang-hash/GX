- id: D-440
  author_tree_id: "세종 지시서 턴 D(2026-09-05) · 차선 C1"
  title: "한글 입력기가 켜지면 event.key 단축키가 전멸한다 — 그리고 음소거 아닌 무음이 실재했다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 D 병합(`3d40cf6`) · 차선 C1 (UX-15 · UX-16)"
  decision: |
    ▣ **UX-15 닫힘 — 키보드·사운드.** 판정기 6술어(양성 6 · 음성 11).
      ★★ **한글 입력기가 켜지면 `event.key` 단축키는 전멸한다** — `j` 를 눌러도 `ㅓ` 로 온다.
      관제요원은 한국어를 친다. `key` 로 짰으면 「가끔 안 먹는다」로 보고되고 아무도 재현
      못 했을 고장이다 — 재현하려는 사람의 자판이 영문이면 언제나 잘 된다. 자판의 자리
      (`event.code`)로 읽어 막았고, 그 사례를 판정기의 출생 표본으로 박았다.
      ★★ **「음소거가 아닌데 안 들리는」 세 번째 상태가 실재한다**(브라우저 자동재생 잠금).
      `muted` 하나로 그리면 화면은 「소리 켜짐」이라 말하는데 아무 소리도 안 나고, 관제요원은
      조용한 화면을 「사건이 없다」로 읽는다.
    ▣ **UX-16 닫힘 — 월 모드.**
      ★ 세션 12시간은 **미측정으로 되돌렸다**(차선은 「미달」로 넘겼다). 접근 토큰 200분 ·
      재발급 7일 · 회전 켜짐 · 앞판이 재발급을 부른다 — 한 갈래만 재면 어느 쪽이든 그럴듯하다.
      접근 토큰을 720분으로 올리지 않았다: 바뀌는 것은 화면 하나가 아니라 제품 전체의 탈취
      창이고, 그것은 절을 닫는 일이 아니라 **보안 결정**이다.
  enforced_by: |
