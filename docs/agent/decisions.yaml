- id: D-447
  author_tree_id: "세종 지시서 턴 E(2026-09-05) · Backend/DB"
  title: "sweep() 은 하드 삭제였는데 delete() 는 아니다 — 그리고 소프트 삭제 행이 objects 에서도 보였다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 턴 E 병합(`5b00d13`) · Backend/DB (P-57 · OPS-16)"
  decision: |
    ▣ P-57 파기 · OPS-16 계량. 파기 44 passed · `verify_purge` 행 0 · 객체 0 · 기록 1.
      ★★ **`sweep()` 은 이미 하드 삭제였다 — 그런데 `delete()` 는 아니다.** 같은 표에서
      `clip.delete()` 는 행을 **남기고** `_hard_delete()` 는 0 이다.
      ★★★ 그리고 더 나쁜 것: **소프트 삭제된 행이 `objects` 에서도 보인다** — dj-core 가
      `objects` 를 safedelete 가 아닌 매니저로 덮어썼다. **지운 카메라가 청구서에 오른다.**
      이것은 계량만의 것이 아니라 **「세는 코드」 전부의 전제**다.
      ★ 「길이 없는 줄 알았던 것에 길이 있었다」 — `stream_id → StreamMonitor.group` 으로
      좁혀졌다.
      ★ `tsc --noEmit -p tsconfig.json` 은 **아무것도 안 본다**(`files: []`) — exit 0 이
      「형이 맞다」가 아니라 **「안 봤다」**였다. P-59 계열의 거짓 초록 자리 하나 더.
  enforced_by: |
    · backend/tests/test_be_purge.py :: 파기 44 passed
    · backend/apps/dsm/retention.py
    · backend/apps/dsm/metering.py · backend/tests/test_be_metering.py :: OPS-16
