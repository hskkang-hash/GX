- id: D-460
  author_tree_id: "세종 지시서 턴 P(2026-09-15) · ③a"
  title: "공용 로그인이 속도 제한(IP 분당 5회)을 만나면 게이트가 61초 기다려 한 번 재시도한다"
  status: decided
  raised_by: "조율자(Code) 2026-09-15 턴 P ③a(`ed3eaa7`)"
  decision: |
    ▣ ★★ **로그인에는 속도 제한이 있다 — IP 기준 분당 5회.** dj-core
      `core/api/v1/auth.py:348` `@ratelimit(key='ip', rate='5/m', block=True)`.
      게이트는 전부 `gx-shell` 한 IP 에서 로그인하므로 **계정이 달라도 5회를 나눠 쓴다.**
      대장 게이트를 두 번 돌리면 1회차 꼬리(seed_roles·sidebar·write_auth 의 역할별
      로그인)가 2회차 머리(authn_paths·contract_route_reach)의 몫을 먹어 **2회차만**
      `403 135B` 를 받았다 [실측: 8000 로그 · measure_repro 두 회차가 갈린 자리].
      제품의 보안 장치라 풀지 않는다 — 게이트가 **기다린다.** 한 번만 다시 묻고,
      그래도 막히면 전과 같이 「못 받았다」(회색)로 둔다. 기다린 사실은 적는다.
  enforced_by: |
    · scripts/verify_route_alive.py:118 :: RATE_LIMIT_WAIT_S = 61
    · scripts/verify_route_alive.py:162 :: HTTPError 403 → 61초 대기 후 1회 재시도
  affects: [D-459]

- id: D-461
  author_tree_id: "세종 지시서 턴 P(2026-09-15) · ③b"
  title: "닫은 문이 로그인 부제목을 지웠다 — 막지 않고 좁힌다, 화면이 로그인 전에 읽는 두 칸만 공개 투영"
  status: decided
  raised_by: "조율자(Code) 2026-09-15 턴 P(`a2e99af`) — P-133 익명 반출 차단의 회귀를 되돌리지 않고 좁혀서 닫음"
  decision: |
    ▣ 로그인 화면(§0.4 rj-core)이 로그인 전에 부르는 `GET /api/config-management/list-optimized`.
      P-133 이 익명에게 닫자 로그인 부제목 「AI기반 드론.로봇 통합 운영 서비스」가 사라지고
      콘솔 401 두 줄 → 배치의 걷기가 되돌렸다 [실측 walk_20260915_142614]. 부르는 쪽이
      rj-core 라 `frontend/src` 검색에 없었다.
      원 응답(16,436 B)의 `System` 묶음은 `cidr`·`security`·`otp`·`validation`·`domain` 을
      싣는다 — 다시 열지 않는다. `access_gate` 가 익명 GET 에 한해 **허용 두 칸만 새로
      만든다**(`System.subtitle` · `system_register.is_allow_register`) · 거르지 않고
      만든다(거부 기본값) · `is_sensitive` 행 제외 · 1KB 넘으면 닫는다 · `is_active` 로는
      거르지 않는다(원 뷰가 비활성 `system_register` 를 실었고 로그인 화면이 읽었다) ·
      자격증명 있는 요청은 손대지 않는다 · 앞단 nginx 401 목록에서도 한 곳으로 함께
      빠진다(50→48).
      [실측] 8000 · 8500 익명 → 200 · 256 B · `X-GX-Public-Projection: login-config` ·
      보안 칸 글자 0 · timezones·register-settings 는 여전히 401. 시험 ⑦ 7종.
      익명 탐침 공개 선언(사유·1KB).
      **원칙 등재: 공개 투영은 화면이 읽는 칸만, 이름을 헤더에 적는다.**
  enforced_by: |
    · backend/common/access_gate.py:305 :: ANON_PUBLIC_PROJECTIONS — 허용 두 칸만 선언
    · backend/common/access_gate.py:359 :: AccessGateMiddleware._anon_projection() — 거부 기본값 · 1KB 상한 · X-GX-Public-Projection 헤더
    · backend/tests/test_p133_anon_read_closed.py :: 7종
  affects: [D-284, D-349]

