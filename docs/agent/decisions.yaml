- id: D-435
  author_tree_id: "세종 지시서 턴 C(2026-09-05) §3 · 차선 S"
  title: "규약이 문을 만나 빨강이 스스로 꺼졌다 — 그리고 **못 닿고도 PASS 를 냈다**"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 TC · 차선 S (UX-19 · SEC-11a · SEC-08)"
  decision: |
    ▣ **UX-19 닫힘 — 그리고 P-42 의 첫 이행이다.**
      `common/cap_1_2.py`(OASIS CAP 1.2 번역·닫힌 어휘) · `common/webhook_outbox.py`(문) ·
      `WebhookSubscription`(마이그 0028) · 라우트 셋. 시험 **43 passed** —
      구독 → 발송(본문이 우리 스키마가 아니라 CAP 1.2) → 서명 검증(**한 글자 바꾸면 거절**)
      → 재시도(**정확히 5회** · 포기가 행으로) **완주**.
      ★ **규약을 고치지 않고 불러서 맞췄다** — `webhook_contract.py` 는 한 줄도 안 건드렸다.
        규약이 문에 맞춰 바뀌면 그것은 규약이 아니라 기록이 된다(그 파일이 스스로 적은 말).
      ★★ **`dormant` 빨강 3이 0이 됐다 — 기준선에 이름을 넣어서가 아니라 원인이 없어져서다.**
        턴 B 에 그 셋을 기준선에 넣었으면 이 초록은 없었고, 「규약을 지었다」와 「규약이
        쓰인다」의 구별도 사라졌을 것이다. **넣지 않기로 한 판단이 한 턴 만에 값을 냈다.**

    ▣ **SEC-11a 닫힘 — 224 → 217 · 화면이 부르는 authz_envelope 7 → 0.**
      접두 둘(`/api/flight-log/` · `/api/departments/`)을 **정본 한 곳**
      (`settings.API_CONTRACT_PROMOTE_PATHS`)에 더한 것뿐 — 금지구역 파일은 안 건드렸다.
      미들웨어가 **밖에서** 상태줄을 바꾼다. `backend/tests/test_api_contract.py` 31 passed.

    ▣ **SEC-08 닫힘 — PASS 6 · FAIL 0 · 회색 0 · 익명 2xx 누출 0건.**
      ★ 첫 실행의 FAIL 하나를 차선 S 가 **스스로 갈랐다**: 같은 서버에서 이번 턴 신설
        라우트를 PROPFIND 로 두드려 **404** 가 나오는 것으로 「그 프로세스가 이 턴 코드
        이전」임을 실측했다. **「우리 코드가 틀렸다」와 「내가 옛 코드를 재고 있다」를 가른 것**
        이 이 절의 값이고, 조율자가 8000 을 새로 띄우자 그 FAIL 이 사라졌다.

    ▣ ★★★ **그러나 이 절의 진짜 값은 초록이 아니라 초록이 틀렸던 사실이다.**
      조율자가 그 프로브를 **호스트에서** 돌렸다. 호스트에서는 `gx-shell` 의 8000 이
      보이지 않는다. 결과: **PASS 4 · 누출 0건 · `url_a: null`** —
      **아무것도 못 두드렸는데 통과가 났다.**
      술어가 「익명으로 두드려 2xx 가 아니면 PASS」인데 **못 닿은 것도 2xx 가 아니다.**
      ⚠ **침투 시험에서 이 모양이 특히 나쁘다 — 틀린 안심은 무지보다 나쁘다.**
        D-400(판정 불가를 통과로 세고 있었다)의 재발이고, 이번엔 **안전을 재는 도구**에서 났다.
      고침: 자기표본(`verify_route_alive.SELF_SAMPLE` 을 **빌려 왔다** — 두 벌 금지)으로
      **도달을 먼저 증명**하고 못 닿으면 exit 2 · 로그인 실패는 SKIP 이 아니라 **회색** ·
      `GX_ROUTE_CONTAINER` 를 보고 **스스로 컨테이너에서 다시 돈다**(사람의 기억에 안 맡긴다) ·
      **토큰이 무엇을 바꿨는지**를 술어로 센다(토큰을 들고도 응답이 하나도 안 바뀌면 회색).
      ★ **그리고 그 음성 대조가 자기 병을 하나 더 잡았다**: 첫 고침은 `--api` 를 줘도
        컨테이너 위임이 그것을 삼켜 기본 주소로 다시 돌았고, **닿을 수 없는 주소를 줬는데
        401 · exit 0** 이 났다. 음성 대조가 없었으면 고쳤다고 믿었을 자리다.
      자기시험 **17건**(판정식 11 · 출생 표본 4 · 못 닿는 주소 2). 출생 표본은 **그날의 표**
      (전부 `null` 인데 FAIL 이 없어 PASS 4)를 그대로 판정해 **회색이 나오는지**를 본다.
  enforced_by: |
    · backend/common/cap_1_2.py · backend/common/webhook_outbox.py
    · backend/stream_monitors/migrations/0028_webhooksubscription.py
    · backend/tests/test_s_webhook_outbox.py :: 43건 · backend/tests/test_api_contract.py :: 31건
    · scripts/probe_self_pentest.py :: 자기시험 17건 · 도달 증명 · 회색 규칙
    · backend/config/settings.py :: API_CONTRACT_PROMOTE_PATHS (접두 둘 추가)
  affects: [D-286, D-301, D-327, D-349, D-368, D-377, D-400, D-410, D-430, D-434]

- id: D-436
  author_tree_id: "세종 지시서 턴 C(2026-09-05) §1 P-41 · §3 · 차선 Q"
  title: "문지기가 **문다** — 그리고 화면이 스냅샷을 한 장도 못 받고 있었다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 TC · 차선 Q (send_allowlist · walk_scenarios · PERF-07)"
  decision: |
    ▣ **P-41 집행 — `verify_send_allowlist.py`. 강제를 게이트가 아니라 런타임에 넣었다.**
      `EmailChannel.send()` 가 `send_mail` **앞에서** `send_allowed(address)` 를 부르고,
      목록 밖이면 로그 어댑터로 떨어뜨린 뒤 `ok=False` 로 사유를 남긴다 —
      **로그 도달을 사람 도달로 말하지 않는다.** 순서 판정은 **AST** 로 본다
      (문지기가 발송 뒤에 선 소스가 빨강인지 자기시험이 확인).
      ★ **음성 대조 [실측]: 목록 밖은 실제로 안 나갔다.** `dev-account-12@yopmail.com`
        → **발송함 0통** · `ok=False` · 로그 어댑터로 떨어짐. 양성 대조로 목록 안은 1통 나간다
        (**전부 막는 문지기는 고장**이므로 함께 잰다). 꼬리 일치 차단도 확인
        (`notyopmail.com` ≠ `yopmail.com`).
      ★ **문다는 증거**: `K2_SEND_ALLOWED_DOMAINS=yopmail.com` 을 주면 **exit 1** —
        「개발 계정 8명이 허용 목록을 타고 나간다」.
      [실측] 지금: 수신자 항목 42 · 고유 주소 15명 · `yopmail 8 · org.kr 4 · seed.invalid 3` ·
      **채널을 email 로 켜도 실발송 0명 / 로그 강제 15명.**
      ★ **허용 목록이지 차단 목록이 아니다** — 막을 것을 세는 방식은 **내일 생길 43번째
        개발 계정을 자동으로 통과시킨다.** 비어 있으면 **전부 로그**다: 「목록을 잊었다」가
        「전부 허용」이 되지 않게. **실수의 방향이 안전한 쪽이다.**

    ▣ ★★ **걸으면서 잡은 것 — 이벤트 스냅샷이 브라우저에서 한 장도 안 떴다.**
      프런트가 **일부러** 보내는 `X-No-Cache`(D-341 · 캐시가 장애를 덮는 것을 막으려고
      우리가 넣은 헤더)가 **CORS 프리플라이트에서 거부**되고 있었다.
      같은 주소를 토큰으로 부르면 200 JPEG [실측] — **서버는 멀쩡했고 브라우저만 못 받았다.**
      ★ **캐시를 비끼려고 넣은 헤더가 요청 자체를 막고 있었다.** 고침을 위해 만든 것이
        새 결함의 원인이 되는 자리이고, **걸어 보지 않으면 안 보인다** —
        시험도 게이트도 브라우저의 프리플라이트를 흉내 내지 않는다.

    ▣ **`walk_scenarios.py` (390×844) — 이름은 `perf_load.SCENARIOS` 에서 가져온다**
      (표를 둘로 만들지 않는다). [실측] S1 클릭 2회·1,730ms · S2 1회·1,622ms · S3 1회·1,963ms ·
      3/3 완주 · 세션 `logout 200`. 심은 대기를 총 경과와 갈라 적었다.
      ★ **콘솔 오류를 「0건」이라 적지 않았다**: 알려진 잡음 32건(§0.4 orders·partner 웹소켓
        404 재접속)과 **분류되지 않은 9건**으로 나눠 **후자만 빨강**으로 판정한다.
        0건이라 적었으면 그것은 거짓이고, 전부 빨강이라 적었으면 아무도 안 본다.

    ▣ **PERF-07 — 표만 낸다**(대표 결정 ④ 전에는 착수하지 않는다).
      Qwen2.5-VL-7B(**apache-2.0** · `[호출]`) · InternVL2_5-8B(**mit** · `[호출]`).
      ★ **한국어는 둘 다 확인되지 않았다** — Qwen 은 **앞 세대 카드**에만 "Korean" 이 있고
        2.5 카드의 언어 태그는 `en` 뿐, InternVL 은 `multilingual` 낱말뿐.
        **「비슷한 모델의 앞 판에 적혀 있다」를 「이 모델이 한다」로 옮기지 않았다**(D-316).
      모델은 받지도 돌리지도 않았다 — 속도·VRAM 은 `[미측정]`.
  enforced_by: |
    · scripts/verify_send_allowlist.py :: 일곱 수 · AST 순서 판정 · 음성 8 · 양성 1
    · backend/kernels/k2_notify/channels.py :: send_allowed() — send_mail 앞
    · backend/config/settings.py :: CORS_ALLOW_HEADERS + "x-no-cache"
    · scripts/walk_scenarios.py :: SCENARIOS 재사용 · 콘솔 오류 분류
    · docs/agent/evidence/P-41/ · UX-WALK/ · PERF-07/
  affects: [D-204, D-286, D-316, D-341, D-412, D-432]

- id: D-437
  author_tree_id: "세종 지시서 턴 C(2026-09-05) §3 · 차선 E"
  title: "앞단을 세우자 **예상이 반대로 틀렸다** — 그리고 502 는 워커가 죽는 그 초에만 났다"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 TC · 차선 E (OPS-13 · OPS-12a · OPS-03 · OPS-10 · CPO 문서)"
  decision: |
    ▣ **OPS-13 닫힘 — 앞단이 섰다**(`gx-gunicorn-e` + `gx-nginx-e` · 새 컨테이너 둘).
      떠 있던 다섯을 재기동하지 않았다 — 다른 차선 셋이 그 위에서 동시에 일하고 있었다.
      두 번째 방어선 [실측] `--probe` **exit 0 · 18갈래**.
      ★ **앞단 401 과 뒷단 401 을 본문 표식으로 갈랐다** — 구별 못 하면 **뒷단이 죽어도
        앞단이 401 을 내주어 거짓 초록**이 난다.
      ★ 관문 설정을 `access_gate.py` 목록에서 **생성한다** — 두 벌로 적으면 앞단이 낡고,
        **낡은 앞단은 있는 줄 알았던 방어선이 없는 상태**다.

    ▣ ★★ **PERF-04 닫힘 — 그리고 대장의 예상이 반대로 틀렸다.**
      게이트가 `Server: nginx` 를 보고 **저절로 합격선 모드**로 갈렸고,
      **빨강이 될 거라던 두 자리가 초록**이 됐다: F05 524.7 → **167ms** ·
      STATUS 363.3 → **171ms**. `pending_acceptance` 는 **빈 목록**이다.
      **넘게 만든 것은 코드가 아니라 환경이었다.**
      ⚠ 그래도 턴 B 에 「기준선으로 초록」이라 적지 않고 넘긴 것은 옳았다 —
        **예상이 맞았는지가 아니라 잰 자리에서만 판정한 것이 옳았다.**
      회귀는 **넷 중 셋에서 판정을 냈다**(F05·MEDIA·STATUS 초록 · SCREEN 회색).
      뿌리는 앞단이 아니라 **기계**였다 [실측]: 같은 코드·같은 앞단인데
      **loadavg 2.36 에서 잡음 34~67%, 0.10 에서 16~18%.**
      ★ SCREEN 하나는 조용한 기계에서도 회색이고 **그대로 적었다** — [추정] 이 면만
        호출이 넷이고 집계가 섞여 있다. 단정하지 않았고, 다음 걸음은 **네 호출을 따로 재는 것**
        이다(면으로 접으면 가장 흔들리는 하나가 나머지를 가린다).

    ▣ ★★★ **502 3건 — 고치려다 나빠져서 되돌렸고, 되돌린 이유를 설정에 남겼다.**
      건 것: `max_requests` 지터 넓히기 · `keepalive_requests 50`(앞단이 먼저 끊게).
      [실측] **502 3 → 5건** · p95 F05 174 → 295ms · 잡음 21~37 → 46~67%. **함께 나빠졌다.**
      까닭: **낡은 연결을 피하려다 새 연결을 더 많이 만들었다** — 휘저을수록 죽어 가는
      워커와 마주칠 기회가 는다. 되돌렸고 **사유를 설정 파일에 남겼다** —
      **사유가 없으면 다음 사람이 같은 생각으로 같은 값을 다시 건다.**
      ★★ **그리고 언제 나는지 갈랐다 — 그것을 가른 것은 음성 대조다.**
        502 20건 × `Autorestarting worker` 86건을 시각으로 맞대고
        **정상 200 응답 174건을 대조로 함께** 쟀다:
            ±0초  502 **18/20 = 90%**   정상 **37/174 = 21%**
            ±5초  502 100%              정상 **91%**
        ⚠ **대조가 없었으면 이 표를 못 읽는다.** 2,709초에 재활용 86번이라 창을 넓히면
          무엇이든 옆에 놓인다 — ±5초에서는 정상 응답도 91%가 재활용 옆이다.
          「502 가 전부 재활용 근처에서 났다」만 보면 원인을 찾은 줄 안다.
        **0이 아니다. 0이 안 됐다고 적고 `OPS-13a` 로 등재했다.**

    ▣ **OPS-12a 닫힘** — exit 0 · 덤프 4,511,332B · 목적지 `gx_backup_vault_e` ·
      **다른 컨테이너**에서 `pg_restore --list` 3,337줄. **쓴 것을 다른 곳에서 읽었다.**
    ▣ **OPS-03 닫힘** — `manage.py migrate_bootstrap`(우리 층 · 스키마 변경 0 · dj-core 무수정).
      빈 DB 에서 exit 0 · 적용 436건 · 표 221개. 이미 선 DB 에서는 **멈춘다**(D-283 방지).
      ★ **잠금 자체는 안 풀렸다 — 푼 것은 설치 절차다.** 「돌아간다」와 「고쳐졌다」는 다르고,
        여기서 「고쳐졌다」고 적었으면 다음 사람이 dj-core 를 믿고 우회층을 걷어낸다.
    ▣ **OPS-10 은 닫지 않았다 — SMTP 자격증명이 없다.** 대표가 주신 것은 **받을 주소**이고
      **보낼 계정**이 아니다. `EmailChannel.configured()` 가 그 빈칸을 **회색**이라 말한다.
      ★ 차선 E 가 **대표 실주소를 공유 개발 DB 에 심지 않았다** — 지시와 다른 판단이었고
        **옳다**: SMTP 가 없으면 U5 등록은 아무것도 열지 않고 실주소만 남는다.
    ▣ **CPO 문서 4 배선** — LAW-02·03 라우트 둘(`{domain}` **위**에) · UX-14 월간 변수 35개.
      대장 상태는 **미측정**(법률 대조 대기) — **초안이 있다는 것과 법을 지킨다는 것은 다르다.**
      ★ **보존 일수를 적지 않고 `None`+「확인」으로 두었다** — 제품 어디에도 그 수를 선언한
        자리가 없다. 없는 수를 안내판에 적으면 **문서가 실측 행세**를 하고, **게시된 안내판은
        되돌릴 수 없다.** 그 부재를 `LAW-02a` 로 등재했다.
  enforced_by: |
    · nginx/gx-front.conf · nginx/gx-proxy.inc · backend/gunicorn.conf.py (되돌린 사유 포함)
