- id: D-248
  title: "R3 재범위 — 상태코드는 소스 수정 불가, 응답 후처리 계층으로"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 2차 §1) — WP-2 ENTRY §3-2 에 대한 대표 판정"
  decision: |
    권한거부가 HTTP 200 으로 나가는 원인은 core/role/permission.py:512 가 dict 를 반환하기
    때문이고, 그 파일은 §0.4 금지구역이다(D-207). 소스 수정 금지.
    정정: 저장소 쪽 **응답 후처리 계층(미들웨어/렌더러)**에서
          200-body-403 형태를 감지해 실제 HTTP 403 으로 승격한다.
    하위호환 계획 필수 — 기존 클라이언트가 200 을 기대할 수 있다.
      ① 프론트에서 status_code 를 읽는 지점 전수 영향조사를 **첫 작업**으로
      ② 설정 1곳의 플래그 뒤에 둔다 (D-212) — 즉시 롤백 가능해야 한다
      ③ 단계적 전환 / 버전 플래그로 롤아웃
  affects: [W0-18]
  author_error: "#16 — 작성자가 저장소 코드로 고칠 수 있다고 가정"

