- id: D-468
  author_tree_id: "세종 지시서 턴 R(2026-09-16) · 조율자 병합"
  title: "병합에서 게이트 넷을 닫았다 — 넷 다 차선이 못 닫는 자리였다"
  status: decided
  raised_by: "영실(조율자) 2026-09-16 턴 R 병합"
  decision: |
    ▣ **진입면 대장 +4** (`test_f05_event_api.py::EVENT_ENTRY_SURFACE`) — F 하나
      (`onboarding/progress`) · U56 셋(`settings/people/create` ·
      `settings/people/{int:user_id}/deactivate` · `settings/webhook-subscriptions/issue`).
      차선 셋(U1·U3·U56)이 각자 「내 것은 등재했고 남은 빨강은 내 결함이 아니다」로
      보고했고 **셋 다 옳았다.** 그 파일이 이미 적어 둔 규약 그대로다 —
      **두 차선에 걸친 자리는 조율자가 병합에서 맞춘다.** U56 은 자기 셋만 채워도
      F 의 한 줄이 비어 여전히 빨갛다는 것을 보고 손대지 않았다. 12 passed.
    ▣ **dead_fields 등재 6줄 만료 → 지움** — D-463 이 「U1 차선 파 1 턴 2 가 쓴다」·
      「F 차선 파 1 턴 2 가 쓴다」로 적어 둔 `DsmHandover` 넷 · `DsmOnboardingProgress`
      둘. **그 턴이 왔다.** 게이트가 먼저 알아냈다(쓰기가 생기자 「등재를 지워라」로
      빨개졌다) — 등재는 면제가 아니라 **만료일이 적힌 이름표**라고 적어 둔 그대로다.
      D-338 선례대로 지운 자리에 「왜 지웠나」를 남겼다. 새 빚 0.
    ▣ **homonyms 기준선 4 → 6 (159 → 161)** — U56 의 새 시험이 같은 **서버가 정한
      경로 문자열** "/api/dsm/settings/api-keys" 를 두 번 더 썼다. 우리 식별자에는
      새 단독 `api_key` 가 0건이다. ★ `--freeze` 를 **부르지 않았다** — 턴 Q 가
      「freeze 가 사람의 문단을 지운다」를 실측으로 남겼기 때문이다. 데이터 한 줄만
      손으로 고쳤다. **기준선은 기계가 쓰고 사유는 사람이 쓴다.**
    ▣ **cache_bypass 표기 1건** — F 의 `test_onboarding_progress.py` 가 익명 401 을
      묻느라 스택을 타는데 선언이 없었다. `NO_CACHE` 우회 + 「캐시 처리: 우회」 한 줄.
      관문이 열려 있던 동안 채워진 항목을 돌려받으면 **고친 뒤에도 초록**이 된다(D-341 착시 ⑦).
  enforced_by: |
    · backend/tests/test_f05_event_api.py :: EVENT_ENTRY_SURFACE
    · scripts/verify_dead_fields.py :: DECLARED_UNWIRED
    · docs/agent/evidence/D-337/homonym_baseline.txt
