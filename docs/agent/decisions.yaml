# ═══════════════════════════════════════════════════════════════════════════

- id: D-369
  author_tree_id: "지시서 D-367"
  title: "「재난 시스템에서 폭주는 정상 동작이다」 — **이벤트는 버리지 않는다.** 그리고 버려지던 것은 이벤트가 아니었다"
  status: decided
  raised_by: "세종(기획) 2026-09-11 지시 · 판정 위임"
  decision: |
    ▣ ★ **정정 보고부터.** 지시는 「`skipping` 이 drop 인가 queue 인가를 실측하라」였다.
      실측했다 [2026-09-11 · 코드]:

          common/cache_signal_protection.py::rate_limited
            상한 초과 → print("... skipping") → `return`        ← **drop 이었다**
          유일한 사용처: common/universal_optimization.py::universal_cache_invalidation
            (`post_save`·`post_delete` **전역** 수신기 · 200/분)

      즉 버려지던 것은 **이벤트 행이 아니라 캐시 무효화**다. 이벤트는
      `kernels/k1_event/services.py::record_detection` 이 `@transaction.atomic` 안에서
      저장하고 **그 경로에는 상한도 큐도 없다.** DRF/ninja 스로틀도 어디에도 안 걸려 있다.
      「재난 때 이벤트가 사라진다」는 **일어나지 않았다.**

    ▣ ★ 그런데도 등급을 낮추지 않는다. 결함이 맞다:
      무효화를 버리면 **낡은 화면이 남는다.** 폭주는 곧 재난이고, 그때 관제
      대시보드·이벤트 목록이 옛 데이터를 보여 준다 — **보는 사람에게는 이벤트가
      사라진 것과 같은 일**이고, F-10 「30초」를 재는 화면이 그 화면이다.

    ▣ 고친 규칙 — **지연은 허용, 소실은 불허**
        ① 상한 아래면 지금 한다
        ② 넘으면 **미룬다.** 버리지 않는다
        ③ 같은 (모델, pk) 의 미룬 것은 **접는다** — 같은 행의 무효화 두 번은 같은
           무효화 한 번이다. ★ 이 접기가 상한이 하던 일(순간 부하 억제)을 대신 한다.
           접기가 없으면 큐가 폭주를 그대로 받아 상한이 있던 이유가 사라진다
        ④ 큐가 차면 **가장 낮은 등급부터** 버린다. 가장 오래된 것이 아니다
        ⑤ ★ **심각 등급은 어떤 경우에도 버리지 않는다.** 큐가 심각 등급으로 가득 차면
           새 심각 등급은 **그 자리에서 처리한다** — 느려지는 것은 허용, 잃는 것은 불허

    ▣ 등급은 `severity` 가 아니라 **모델**로 정한다 (D-290). `severity='info'` 인 탐지도
      **오탐률의 분모**이고, 그 분모가 조용히 줄면 U1 의 수가 거짓이 된다.
      「낮은 등급 이벤트」와 「이벤트가 아닌 것」은 다르다.

    ▣ 200 이라는 수의 사유를 찾았다 (지시 ④). 옛 주석은 「prevent abuse」 한 줄뿐이었다.
      코드를 읽어 답했다: 이 수신기는 전역 `post_save` 이고 한 번 돌 때 Redis 를 훑는다 —
      **지키던 것은 DB 가 아니라 Redis 와 응답 지연**이고, 「abuse」는 외부 공격이 아니라
      **신호 폭풍**을 가리킨 말이었다. 그래서 상한은 남기고 **넘었을 때의 행동만** 바꿨다.
      표 ①(C-4)에 `event.invalidation_rate_limit` 으로 올리고 사유를 적었다.

    ▣ ★ `contract_fixed` 로 **올리지 않았다** (지시 ⑤). 미루기로 바꾼 뒤로는 이 값이
      낮아도 무효화가 소실되지 않으므로 F-10 「30초」에 닿지 않는다.
      **계약이 안 정한 것을 계약으로 만들지 않는다** (D-280).

    ▣ [실측] 부작위 결과: 폭주 투입 300건 = 실행 300건 · **버린 것 0건** ·
      큐가 5000칸 전부 심각 등급일 때 새 심각 등급의 처분 `run_now`(버리지 않음) ·
      큐가 찼을 때 버린 것은 **가장 낮은 등급 1건**(심각 등급 0건) ·
      DB 층: 투입 300건 = 저장 300건.

    ▣ ★ 게이트를 고쳤다 (D-350 「측정기를 먼저 의심한다」). `verify_threshold_table.py` 의
      위반 문구는 「표 ①에 올리거나 … 등재하라」인데, **표에 올려도 래칫이 계속 잡았다** —
      래칫이 표의 `used_by` 를 안 봤다. 도구가 시킨 대로 했는데 도구가 계속 빨간 상태는
      사람에게 「그냥 등재해 버려」를 가르친다. `table_owned()` 를 더해 그 자리를 막았다.
  enforced_by: |
    · scripts/verify_event_drop.py — 소실 경로 부작위 검사(모양 + 폭주 + 심각 등급 + 등급 축출).
      출생 표본(D-310): 부하시험에서 처음 `skipping` 이 뜬 조건(200/분 상한 초과) 그대로
    · backend/tests/test_event_no_drop.py — 8건. DB 층 「투입 n = 저장 n」 포함
    · backend/kernels/k5_trust/thresholds.py — event.invalidation_rate_limit (사유 포함)
    · scripts/verify_threshold_table.py::table_owned — 표에 올린 값을 래칫이 두 번 세지 않는다
  affects: [D-212, D-271, D-280, D-284, D-290, D-300, D-301, D-310, D-311, D-322, D-325, D-350]

- id: D-370
  author_tree_id: "지시서 D-368"
  title: "쓰기는 읽기보다 위험하다 — 관문 없이 **쓰던** 네 자리를 막았고, 깨질 클라이언트를 대장에 올렸다"
  status: decided
  raised_by: "세종(기획) 2026-09-11 지시 · 판정 위임"
  decision: |
    ▣ D-358(한꺼번에 막으면 제품이 깨진다)의 **범위를 좁힌다**: 그것은 읽기 면의 규칙이다.
        읽기 유출 — 나간 것은 되돌릴 수 없다. 그러나 **무엇이 나갔는지는 안다**
        쓰기 오염 — 들어온 것도 되돌릴 수 없고, **게다가 조용하다.**
                    심어진 행은 진짜와 섞여 **나중에 골라낼 수 없다**

    ▣ ★ **정정 보고.** 지시서는 「관문 없는 쓰기 면 **20자리**」라고 적었다.
      호출로 다시 세니 [실측 2026-09-11 · scripts/probe_write_surface.py]:

          관문 없는(=`auth=` 콜백 없는) 쓰기 라우트 전수      **47자리**
            public_by_design       11자리   로그인·토큰 — 익명이어야 성립한다(선언)
            rejected_elsewhere     28자리   익명이 핸들러에 **도달하지 못한다**
            read_only_in_practice   4자리   도달하지만 그 핸들러가 쓰지 않는다
            writes                  4자리   ★ **이번 턴의 표적**

      20 이 어디서 나온 수인지는 우리 대장에 없다. **그래서 20을 인용하지 않는다** —
      태그 없는 수는 인용을 거부한다(D-322). 위 넷은 전부 호출로 얻었다.

    ▣ 막은 네 자리 (전부 §0.4 **밖**이다 — 금지구역에 손을 넣지 않았다):
        POST   /api/media-data/detect-callback                       update_or_create/add
        POST   /api/media-data/upload-detection                      create/save
        DELETE /api/flight-log/flight-log/delete/{ids}               delete
        DELETE /api/stream-monitors/.../external-stream-monitors/{id} delete
      전부 같은 파일의 형제 라우트와 **같은 관문**(`CustomJWTAuth`)을 붙였다 —
      새 방식을 들이지 않는다. 붙인 뒤 다시 재서 `writes` **0자리**를 확인했다.

    ▣ ★ **깨질 클라이언트 보고** (지시 ③ — 「깨지면 그것이 곧 발견이다」):
      `media-data` 두 자리는 **AI 서비스가 인증 없이 부르던 콜백**이다. 배포 전에
      그쪽에 자격증명을 붙여야 한다. 대장 등재: `AI_CALLBACK_NEEDS_CREDENTIAL`.
      ★ 재난 검출 **본선은 이 경로가 아니다** [실측] — 본선은 gRPC
        (`stream_monitors/services/grpc_dual_stream_service.py` → K1)이므로
        **F-02·F-10 계약 경로는 이 변경에 닿지 않는다.** 닿는 것은 미디어 분석 콜백이다.

    ▣ ★ 측정기를 먼저 의심했다 (D-350). 첫 실행에서 네 자리가 아니라 **여덟 자리**가
      `writes` 로 나왔다 — `inspect.getsource` 가 데코레이터 붙은 함수의 들여쓰기를
      남겨 파싱이 통째로 실패했고, 실패를 「모르는 것은 쓰는 쪽으로」 센 결과였다.
      `textwrap.dedent` 로 고치고 **그 사례를 자기시험에 박았다**(출생 표본).
  enforced_by: |
    · scripts/probe_write_surface.py — 네 갈래 분류. 도달은 **호출**로(본체는 한 줄도 안 돈다),
      쓰는가는 **정적**으로. 두 방법이 다르다는 사실을 `writes_by` 에 적는다
    · scripts/verify_write_auth.py — `writes` 0건(래칫 없음) · 새 면 100% · 나머지 래칫 ·
      선언 대조 · 증거 신선도. 출생 표본은 위 네 자리 그대로
    · docs/agent/evidence/D-368/write_surface.json
    · docs/agent/evidence/D-368/write_auth_baseline.json
    · docs/agent/evidence/DA-05/blockers.yaml :: AI_CALLBACK_NEEDS_CREDENTIAL
  affects: [D-207, D-210, D-280, D-301, D-311, D-322, D-334, D-342, D-343, D-350, D-358]

- id: D-371
  author_tree_id: "지시서 D-369"
  title: "「두 벌은 반드시 어긋난다」 — 정본으로 올린다 · D-333 의 네 번째 얼굴"
  status: decided
  raised_by: "세종(기획) 2026-09-11 · 자기 오류 인정"
  decision: |
    ▣ D-333(밖을 사기 전에 안을 뒤진다)에 **네 번째 얼굴**을 더한다:
        ① 밖에 사러 가기 전에 안을 뒤진다        ② 만들기 전에 이미 있는지 뒤진다
        ③ 이미 있으면 얼마나 열려 있는지 잰다    ④ **구현을 지시하기 전에 그것이
                                                    이미 있는지 실측한다**
    ▣ 집행: 「구현하라」고 적힌 항목은 착수 전에 **이미 있는지 먼저 확인**하고,
      있으면 만들지 말고 **정정 보고**를 낸다.
    ▣ ★ 이번 턴에 그 규칙이 **세 번** 걸렸다. 셋 다 만들지 않고 정정했다:
        · 「K3 역할별 프레임」  — 커널이 **이미 서 있었다**. 없던 것은 **배선**이다 (D-373)
        · 「모니터링 3종」      — `scripts/ops_monitor.py` 가 **이미 있었다**.
                                  없던 것은 **주기**다 (D-375)
        · 「백업 자동화」       — `ops_backup.py`·`ops_restore.py` 가 **이미 있었다**.
                                  없던 것은 역시 주기다
      셋 다 「구현하라」로 적혀 있었고, 셋 다 만들었으면 두 벌이 됐을 것이다.
    ▣ 번호도 어긋났다. 이 트리는 2026-09-10 에 D-367·D-368 을 이미 썼고,
      지시서가 같은 번호를 다른 뜻으로 썼다. **덮지 않고 대응표를 남긴다**
      (이 파일 D-369 위의 머리말). 덮으면 어제의 판정 둘이 소리 없이 사라진다.
  enforced_by: |
    · docs/agent/decisions.yaml — 각 항목의 `author_tree_id` 와 D-369 위의 번호 대응표
    · backend/config/k3_roles.py · backend/common/ops_tasks.py — 두 파일 다 머리말 첫 절이
      **「착수 전 실측」**이다. 정정의 근거가 코드 옆에 남는다
  affects: [D-280, D-301, D-333, D-337, D-360]

- id: D-372
  author_tree_id: "지시서 D-370"
  title: "계약 국면 종료 — **82% 가 우리 손의 천장이다.** 이후로는 「상대방 대기 6절」 한 줄로 보고한다"
  status: decided
  raised_by: "세종(기획) 2026-09-11 판정 · 대표 위임"
  decision: |
    ▣ 잔여 7절 중 **6절이 상대방 이행 대기**다 (SDN 명세 5 · 정찰 1).
      개발로 풀리는 것은 CLIP_EXTRACTION 하나뿐이고, 그것은 영상 백업(D-356)과
      **한 덩어리**라 그쪽에서 함께 처리한다.
    ▣ **82% 는 실패가 아니라 사실이다.** 계약서에 상대방 이행 조항이 있고 그것이 오지 않았다.
      여기서 더 밀면 **없는 일을 만들어 갚는 척하게 된다.**
    ▣ 집행: 계약 축은 이제 **「상대방 대기 6절」이라는 한 줄로** 보고한다.
      **매 턴 %를 다시 세지 않는다** — 움직이지 않는 수를 매 턴 적으면 그 수가 소음이 된다.
      SDN 명세가 오는 날 다시 센다.
    ▣ 이번 턴 계약 절 목표: **없음.** 그래서 갚은 절도 0절이고, 그 0이 정직한 수다.
  enforced_by: |
    · scripts/verify_contract_ac.py — 계약 AC 대장. 세는 자리는 여기 하나뿐이다
    · docs/agent/RESUME_NEXT.md — 보고 형식(한 줄)을 이 결정이 정한다
  affects: [D-284, D-301, D-314, D-356]

- id: D-373
  author_tree_id: "지시서 D-371 ①"
  title: "⑦사용성 착수 — **K3 프레임은 이미 있었고 비어 있었다.** 배선하고 화면 셋을 얹었다"
  status: decided
  raised_by: "세종(기획) 2026-09-11 지시 · 판정 위임"
  decision: |
    ▣ ★ **정정 보고** (D-371 ④). 「K3 역할별 프레임」은 만들 것이 아니었다 —
      `backend/kernels/k3_dashboard/` 가 이미 서 있었다(프리셋 3종 · 가시성 3값 ·
      설정 위젯 8종 · 5상태 주입 · 시험까지). **없던 것은 배선이다.**
      `presets.py` 는 매핑을 코드에 박지 않고 설정에서 읽게 해 두었는데(D-280),
      **그 설정이 어디에도 없었다.** 그래서 실제 동작은:
          모든 사용자 → `matched=False` → 가장 좁은 프리셋 · 모든 위젯 → VISIBLE
      **프레임이 있는데 배선이 없으면 역할별 화면이 아니라 한 가지 화면이다.**
      ⑦사용성이 두 턴 동안 0%p 였던 자리 하나가 여기다.

    ▣ 역할 코드를 **실측했다** — `presets.py` 가 「실측으로도 찾지 못했다」고 적어 둔 것이다.
      [실측 2026-09-11 · role.Role 전수 **15종**] 그중 **7종**을 DA-03 의 다섯 사람에 이었고,
      **8종은 일부러 비웠다**(배송·물류 역할과 `user`·`superuser`). 비운 것도 판정이므로
      `K3_UNMAPPED_BY_DECISION` 에 이름과 사유를 적는다 — 「깜빡했다」와 갈라야 한다.
      ★ `superuser` 를 비운 이유는 다르다: 전역 판정은 `tenant_roles.is_global_admin`
        한 곳이 한다(D-212). 여기 적으면 판정식이 두 벌이 된다.

    ▣ 위젯 가시성은 **DA-03 §3-4 표를 그대로** 옮겼다. ★ `–`(미렌더)를 **비워 두지 않고
      `hidden` 이라고 적는다** — `widget_permission` 은 값이 없으면 `VISIBLE` 로 떨어지므로,
      비워 두면 「숨기기로 했다」가 「아직 설정 안 했다」와 같아진다(D-290).

    ▣ 화면 셋 — 관제 대시보드 · 이벤트 목록 · 이벤트 상세. **기존 앱 위에 얹었다**
      (`frontend/src/features/dsm/`, 기존 `PrivateLayout`+`Sidebar` 아래). 새 앱을 만들지 않았다.
      세 화면이 **E2E-1 전 구간**을 덮는다: 탐지 → 목록 → 상세 → 알림 확인.
      · 응답 판정은 **HTTP 상태 + 본문 `status_code` 둘 다** 본다 (D-349 착시 ⑧ · D-358)
      · 로딩 10초 초과는 **오류로 전이**한다 — 영원한 스피너는 「기다리는 중」으로 보인다
      · 「빈」과 「오류」를 같은 그림으로 그리지 않는다 (DA-03 §2-5)
      · 등급은 색 + 아이콘 + 라벨 셋으로 낸다. 빨강은 `critical` 전용 (ISA-101)
      · `preset_matched=false` 를 **화면에 띄운다** — 설정 누락이 안 보이면 영원히 안 고쳐진다

    ▣ ★ 역할 시험은 **화면이 아니라 서버 판정**에 걸었다.
      DA-03 §3-4 불변 규칙 1: **「화면에서 감추는 것은 통제가 아니다.」**
      역할 4종 × 위젯 8종 = 32칸을 DA-03 정본과 한 칸씩 대조하고, 부작위로
      「관제요원에게 없어야 하는 여섯이 정말 없는가」·「API Key 발급은 운영자 하나인가」를 본다.
      ★ 그리고 **배선을 빼면 빨개지는 시험**을 함께 뒀다(양성 대조 · D-277) —
        없으면 위의 초록이 「배선이 있어서 초록」인지 「원래 초록」인지 구별되지 않는다.

    ▣ ★ **스크린샷은 여전히 0장이다.** 그리고 0장인 것이 정직한 상태다(D-347).
      사유가 한 겹 바뀌었다: 「그릴 화면이 없다」는 풀렸고, 남은 것은 둘이다 —
      ① 브라우저 구동체가 없다(playwright·selenium 부재)
      ② 이 환경에 `frontend/node_modules` 가 없다. 컨테이너 `gx-fe-build` 의 `rj-core`
         판이 저장소와 어긋나 저장소 전체 타입오류 **3229건**이 난다 [실측] —
         **새 화면 셋의 오류는 0건**이다. 어긋난 것은 기존 화면과 rj-core 다.
      「화면을 만들었으니 한 장 만들어 넣자」가 D-347 ①이 금지한 바로 그 일이다.

    ▣ 진입면이 하나 늘었다(`GET /api/dsm/events/{id}`). **게이트가 먼저 멈춰 세웠고**
      (`test_f05_event_api.EntrySurfaceIsLockedTest`), 손으로 그 줄을 더하는 일이 곧
      「진입면을 넓힌다」는 선언이다 — D-327(게이트 > 지시) 그대로.
      ★ 목록에서 골라내지 않고 라우트를 늘린 이유: 화면이 목록 응답의 한 줄을 상세로 쓰면
        **문지기가 목록에만 서고 상세에는 안 선다.** 그 자리가 IDOR 이 태어나는 자리다.
  enforced_by: |
    · backend/config/k3_roles.py — 역할↔프리셋↔위젯 배선. 비운 것의 목록과 사유 포함
