- id: D-385
  author_tree_id: "지시서 D-385"
  title: "「켰다」는 보고에는 **「돌았다」의 증거**가 함께 있어야 한다"
  status: decided
  raised_by: "세종(기획) 2026-09-13 판정 · Code 이행"
  decision: |
    ▣ 규약(상시): **「켰다」·「등록했다」·「연결했다」는 보고는 「돌았다」의 증거를 함께 낸다.**
      증거는 **운영 경로에서의 관찰**이다 — 등록 목록에 이름이 있는 것은 증거가 아니다.
          스케줄러 : 실제 실행 로그 1건    라우트 : 실제 응답 1건    시그널 : 실제 발화 1건
    ▣ 이번 턴의 집행 [실측 2026-09-13]:
      · 새 게이트 `route-alive` 는 **실제 HTTP 응답 13건**을 증거로 낸다
        (docs/agent/evidence/D-386/route_alive.json). 「등록했다」가 아니라 「때렸다」이다
      · 새 시험 `backend/tests/test_screens_browser.py` 는 **브라우저를 실제로 연다.**
        열 수 없으면 **건너뛴다(SKIP)** — 건너뛴 것을 통과로 적지 않는다(D-301)
    ▣ ★ 이번 턴에 **켠 것은 없다.** ㉠ 314건은 가르기만 했다(D-388) — 그래서 이 규약에
      걸릴 「켰다」 보고도 없다. **없는 것을 없다고 적는 것**이 D-389 의 적용이다.
  enforced_by: |
    · scripts/verify_route_alive.py — 실제 HTTP 로 때린다 (서버 없으면 exit 2 판정 불가)
    · backend/tests/test_screens_browser.py — 브라우저를 연다 (없으면 SKIP)
  affects: [D-301, D-310, D-373, D-377]

- id: D-386
  author_tree_id: "지시서 D-386"
  title: "화면을 띄우는 것이 **가장 강한 시험**이다 — 8장을 찍으며 결함 1건을 또 잡았다"
  status: decided
  raised_by: "세종(기획) 2026-09-13 판정 · Code 실측 이행"
  decision: |
    ▣ 판정 수용: 스크린샷은 **문서 작업이 아니라 결함 발견 도구**다. 단위는 함수를 부르고
      브라우저는 **라우트를 때린다.** 그 사이(URL 배선·스키마 해석·직렬화·권한·미들웨어
      순서·정적 자산)를 단위 시험은 전부 건너뛴다.

    ▣ 이행 [실측 2026-09-13] — **3장 → 8장** (0/16 → 3/16 → **8/16**)
      더한 다섯은 **인수받은 화면**이다: /device · /roles · /menu ·
      /configuration-management · /profile. `must_see` 는 **실제로 띄워 보고** 골랐다.

    ▣ ★★ **그리고 화면이 또 결함을 잡았다** — `/users` 가 **본문 0자**다.
          본문 글자 수 0 · JS 오류 0건 · 그 화면의 API **6건 전부 200**
      즉 서버도 살아 있고 스크립트도 안 죽었는데 **화면에 아무것도 없다.**
      원인 [실측]: 이 계정의 `role` 이 **None** 이고, 읽기 권한이 거짓이 되어
      rj-core 의 `UserManagement` 가 아무것도 그리지 않는다.
      DA-03 §3-4 는 「화면 전체가 권한없음이면 **빈 화면 대신 안내 한 장**」으로 정했다 —
      **규약 위반**이고, 당직자에게는 「화면이 고장 났다」로 보인다(D-378).
      rj-core 는 §0.4 라 고치지 않고 대장에 올렸다: RJCORE_BLANK_ON_NO_PERMISSION.

    ▣ ★ **둘째 수확 — 찍는 사람의 역할이 진술이었다.** 1차판 `capture_screens.py` 에는
      `role = "OPERATOR"` 가 박혀 있었고 바로 위 주석은 「우리가 정해서 적지 않는다」고
      말하고 있었다. 실측하니 **NO_ROLE** 이다. 이제 제품이 든 값을 읽는다(`read_role`) —
      그 한 줄이 없었으면 위 빈 화면의 원인이 통째로 가려졌을 것이다 (D-323).

    ▣ 강제 도구 — `scripts/verify_route_alive.py` (게이트 9번째)
      · 무엇을 때릴지 **우리가 정하지 않는다.** 캡처가 기록한 「브라우저가 실제로 부른 API」
        (8화면 51건)를 읽어 그중 GET 을 다시 때린다 → **13건 전부 2xx** [실측]
      · 자기표본(D-310): **500 을 내던 그 라우트**(/api/dsm/events)가 목록에서 빠지면
        자기시험이 먼저 실패한다
      · 서버·자격증명이 없으면 **SKIP(판정 불가)** — 통과가 아니다(D-301)

    ▣ ★★ **세 번째 수확 — 시험 파일이 수집만으로 다른 시험을 빨갛게 만들었다** [실측 2026-09-13]
      새 시험 `test_screens_browser.py` 의 1차판은 **모듈 수준**에서 「서버가 서 있나」를
      HTTP 로 물었다. 즉 **pytest 수집 단계에서** 개발 서버를 두 번 쳤다. 그러자
      전혀 다른 시험 하나가 실패했다:
          tests/test_event_no_drop.py::test_full_queue_evicts_the_lowest_grade_not_the_oldest
          (dropped 0 != 1)
      대조 [실측 2회]: 그 파일을 빼면 **538 전부 초록**, 넣으면 그 하나가 빨강.
      혼자 돌리면 그 시험은 통과한다 — **순서와 바깥 건드림이 만든 실패**다.
      고침: 판정을 시험 안으로 옮겼다(`_live_reason()`). 결과 **541 passed · 1 skipped**.
      ★ 배운 것: **시험 파일이 수집만으로 바깥을 건드리면 다른 시험의 초록을 좀먹는다.**
        그리고 그 실패는 **코드 결함처럼 보인다** — 원인을 엉뚱한 데서 찾게 만든다.

    ▣ ★ 판정기를 **두 번 고쳤고 두 번 다 판정기가 틀렸다** (D-350):
      ① 기록기가 URL 을 `/api/` 로 잘라 **구글 지도**(maps.googleapis.com/maps/api/js)를
         우리 라우트 `/api/js` 로 둔갑시켰다 → 「죽은 라우트 404 2건」이 전부 가짜였다
      ② 질의문자열을 지우고 때려 **살아 있는 라우트가 422** 로 나왔다(필수 인자 소실)
      **죽은 것은 라우트가 아니라 측정이었다.**
  enforced_by: |
    · scripts/verify_route_alive.py + docs/agent/verify_gates.sh :: gate_route_alive
    · backend/tests/test_screens_browser.py — 증거 정합 3갈래 + 브라우저 1갈래
