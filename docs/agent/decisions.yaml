- id: D-493
  author_tree_id: "턴 U 조율자 · 자진(오판)"
  title: "조율자가 API 주소 없이 번들을 지어 V 의 측정 전부를 막았다 — 그리고 그 자리에서 거짓 초록의 씨를 찾았다"
  status: decided
  raised_by: "V 단독 세션 (2026-09-18 14:2x · 로그인 실패 → 501 → 번들 안 apiBase() 빈 문자열)"
  decision: |
    ▣ **조율자가 틀렸다.** 병합 뒤 「V 가 재는 것은 소스가 아니라 번들」이라며 프런트를 다시 지어
      `_fe_dist` 에 심었는데, **작업본을 컨테이너의 `/tmp/gxb` 에 복사해 지으면서 `/app/.env` 를
      가져가지 않았다.** `VITE_API_URL` 이 안 박힌 번들은 `apiBase()` 가 빈 문자열이 되어 로그인이
      **자기 원점(3002)** 으로 나갔고, 정적 서버는 `POST` 를 모르니 **501** 을 냈다. 화면은
      「지금 로그인할 수 없습니다」에서 멈췄다 — **걷기·캡처·FC·온보딩이 전부 그 한 줄에 막혔다.**
    ▣ V 가 그것을 **측정 대상을 바꾸지 않고** 우회했다: 3002 를 한 글자도 안 건드리고 gx-shell 안에
      같은 원점 프록시(3011)를 세워 운영 모양(nginx 한 원점)으로 쟀다. 옳은 판단이다 — 재는 도중에
      대상을 고치면 그 판은 수가 아니다. (첫 판은 `Accept-Encoding` 을 그대로 넘겨 gzip 본문이
      평문으로 읽혔고, 상류에 `identity` 를 요구해 닫았다 — 함정으로 적어 둔다.)
    ▣ **그 자리에서 더 무거운 것이 드러났다 — 거짓 초록의 씨.** 게이트용 SPA 정적 서버는 확장자 없는
      경로면 무엇이든 `index.html` 을 **200** 으로 줬다. 즉 `GET /api/무엇이든` 이 **200 + HTML** 이다.
      상태코드로 「문이 살아 있다」를 세는 도구는 그 200 을 그대로 먹는다. 닫았다: `/api/...` 는
      **폴백하지 않고 404**(`scripts/gate_spa_server.py` — 이제 저장소에 둔다 · 종전에는 컨테이너
      `/tmp` 에만 살아서 재생성 창마다 사라졌다).
    ▣ 조율자가 창 뒤에 한 일: `.env` 를 함께 넣어 **다시 지었다**(번들에 `http://localhost:8000` 이
      실제로 박힌 것을 확인) · 새 SPA 서버로 바꿔 `/login` 200 · `/dsm/reports` 200 · `/api/dsm/health`
      **404** 를 눌러 봤다. ⚠ **이번 턴의 수는 다시 재지 않았다** — V 의 판은 3011(같은 원점)에서 났고
      그 모양이 운영과 같다. 다시 재면 수가 좋아질 수는 있으나, 그것은 **측정 뒤에 대상을 고치고
      다시 잰 수**다. 다음 턴의 첫 실측으로 넘긴다.
  enforced_by: |
    · scripts/gate_spa_server.py (/api 폴백 금지 — 이 파일이 규칙을 들고 있다)
    · docs/agent/evidence/P-157/runs (V 가 3011 로 잰 판 · 씨앗 파이프)
  affects: [D-487, D-475]
