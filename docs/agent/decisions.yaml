- id: D-364
  title: "★ **측정기가 리다이렉트 뒤에 3자리를 숨기고 있었다** — D-350 의 두 번째 적용"
  status: decided
  raised_by: "Code 2026-09-10 (D-362 이행 중 발견) · 세종 판정 위임"
  decision: |
    ▣ 무슨 일이 있었나 [실측]:
      D-362 의 전수 호출 첫 실행에서 GET 5자리가 **301** 로 나왔다. 301 은 관문의 답이
      아니라 `APPEND_SLASH` 의 답이다. **따라가지 않으면 그 301 이 답으로 남고**,
      301 은 「막혔다」로도 「닿았다」로도 읽힌다.
      `follow=True` 로 다시 재자 **셋이 200 + 본문**이었다:
          GET /api/orders/banks             200 ·  87 B
          GET /api/orders/delivery-option   200 ·  96 B
          GET /api/orders/payment-methods   200 ·  97 B
          GET /api/orders/item-types        500        (터져서 데이터는 안 나갔다)
    ▣ ★ **직전 턴의 「2 → 0」은 틀린 수가 아니었다** — 그 측정기가 **볼 수 없던
      자리**가 따로 있었을 뿐이다. 두 문장은 다르고, 그 구별을 지운 채
      「0이었는데 3이 나왔다」로 적으면 지난 턴의 정직한 보고가 거짓이 된다.
      **못 본 것과 없는 것은 다르다** — 이 판정의 전부가 그것이다.
    ▣ ★ 그리고 `data: []` 를 안전으로 읽지 않는다. 그 표가 **이 환경에서 비어 있을
      뿐**이고, 행이 있는 환경에서는 같은 호출이 목록을 통째로 내놓는다
      (D-301 「검사 못함 ≠ 0건 검사」).
    ▣ 처리: `backend/orders/` 는 §0.4 다. **라우트가 아니라 길목을 막았다**(D-357) —
      4자리를 `AUTHN_REQUIRED_PATHS` 에 올렸고 orders 는 한 줄도 안 바뀌었다.
      재호출 결과 **still_reached 3 → 0**, blocked 27 → 31.
    ▣ ★ 규정 신설: **관문을 호출로 잴 때는 리다이렉트를 따라간다.**
      따라가지 않은 측정은 「막혔다」를 증명하지 못한다. 그리고 고친 자리에서는
      관문이 리다이렉트보다 **앞**에 서므로 301 조차 안 나온다 —
      착시를 시험으로 잡는 대신 **구조로 없앴다**(D-357 그대로).
      ★ 다만 착시 자체가 사라진 것은 아니므로, **막지 않은 자리에서 301 이 여전히
        나온다는 것**을 음성 대조로 시험에 박았다. 그것이 없으면 다음 사람이
        「이제 301 은 안 나온다」로 읽고 같은 착시를 다시 겪는다.
  enforced_by: |
    · backend/common/access_gate.py — AUTHN_REQUIRED_PATHS 에 orders 4자리
    · backend/tests/test_access_gate.py::RedirectHiddenRoutesRejectAnonymousTest — 4건
      (따라간 끝에서 401 · 관문이 리다이렉트보다 앞 · 막지 않은 자리엔 301 이 남음 · 선언 대조)
    · scripts/probe_gap_route_settlement.py — GET·쓰기 모두 follow=True
  affects: [D-301, D-341, D-343, D-348, D-350, D-357, D-362]

- id: D-365
  title: "F-03 폴리곤 — **좌표계를 골랐다.** 이 선택이 곧 계약이다"
  status: decided
  raised_by: "Code 2026-09-10 (지시 D-360 ② 이행) · 세종 판정 위임"
  decision: |
    ▣ D-280 이 미뤄 둔 선택을 이번 턴에 한다. **미룬 이유가 사라져서가 아니라
      미루는 값보다 갚을 절의 값이 커져서**다. 고른 것을 고른 자리에 적는다:
        표현    GeoJSON Polygon 부분집합 (RFC 7946) · 바깥 고리 하나 · **구멍 없음**
        좌표계  **WGS84** · 경도-위도 순서 · 평면 판정
        경계    경계 위의 점은 **안**(BOUNDARY_IS_INSIDE) — 경계에 선 사람을 밖으로
                세면 **놓친다.** 재난안전에서 두 오류는 값이 다르다:
                헛경보는 사람이 지우고, **놓친 것은 아무도 모른다**
        거절    자기교차 폴리곤은 **판정하지 않는다** — 안이 하나로 정해지지 않고
                어느 규칙을 골라도 화면이 그린 모양과 갈린다. 그리는 쪽에 되돌린다
    ▣ 왜 GeoJSON 인가: 구역을 그리는 쪽(지도 화면·QGIS·SDN 좌표)이 전부 그 모양으로
      낸다. 우리 고유 표현을 만들면 **변환기가 하나 생기고, 변환기는 조용히 좌표를 뒤집는다.**
    ▣ 왜 GIS 의존을 안 쓰나: 계약에 GIS 요구가 없고, 의존 하나가 배포 하나를 어렵게 한다.
      순수 함수(광선 투사)로 선다. 부작위 시험이 그것을 계속 지킨다.
    ▣ ★ **잠금 규약이 값을 냈다** — 상수를 올리자 `verify_zone_polygon.py` 가
      `test_f03_polygon_contract_ac` 를 요구했고, **구현만 올리고 시험을 안 낼 길이
      없었다.** 선언된 미완성은 「언젠가 하겠다」는 문서가 아니라 **해소될 때 값을
      받는 장치**다(D-299).
    ▣ 부작위 시험 둘이 **답을 바꿨다**(지운 것이 아니라 교대): 「안 만들었는가」를
      재던 자리를 「만든 것이 계약을 지키는가」가 이어받았다. 다만 부작위 자체는
      남는다 — `test_no_gis_dependency_was_pulled_in` 이 그것이다.
  enforced_by: |
    · backend/stream_monitors/services/zones.py — ZONE_POLYGON_READY=True · ZONE_CRS · LON/LAT
    · backend/tests/test_zone_judgment.py — 31건 (경계 사례 넷 각각 별 시험)
    · scripts/verify_zone_polygon.py — 상수·구현·시험이 함께 서 있는지
  affects: [D-280, D-284, D-290, D-299, D-300, D-360]

- id: D-366
  title: "F-12 구역 — 막고 있던 것은 **표가 아니라 체계**였다"
  status: decided
  raised_by: "Code 2026-09-10 · 세종 판정 위임"
  decision: |
    ▣ 이 절의 사유는 「위험구역을 저장할 표가 없다」였다. [실측] **틀렸다** —
      `Zone` 은 D-299 로 이미 서 있었고, 미정이던 것은 **체계**(행정구역인지
      카메라 묶음인지 폴리곤인지)였다. D-365 가 그 셋 중 둘을 고르며 사유가 해소됐다.
      행정구역은 **안 만든다** — 계약 F-03 이 부르는 것은 「지정 위험구역」이다(D-280).
    ▣ ★ 이 절과 F-03 폴리곤은 **한 뿌리**다: 지정하는 면이 없으면 판정기는 픽스처로만
      도는 코드이고, 판정이 없으면 지정은 장식이다. 한 시험이 둘을 잇는다.
    ▣ ★ **시험이 건 조건을 먼저 지키고 면을 열었다.** 직전
      `test_zone_editing_surface_was_not_built` 는 *"쓰기 면이 늘면 WRITE_PROBES 도
      함께 늘어야 한다"* 를 조건으로 걸고 있었다. 그래서 probe 를 먼저 넣고,
      대장 검사가 `stream_monitors.services.zones` 까지 훑도록 넓힌 뒤 면을 열었다.
      **면을 열고 시험을 지우는 것과는 다른 일이다.**
    ▣ 저장 전에 판정해 본다 — 못 판정할 도형은 저장하지 않는다. 저장해 두고 부를 때
      터지면 화면에는 '가동' 인 구역이 판정에서만 사라지고, **그 상태는 아무도
      신고하지 않는다**(D-284).
    ▣ 남의 카메라를 붙이면 **조용히 빼지 않고 멈춘다.** 조용히 빼면 운영자는 붙었다고
      믿고 그 카메라의 진입은 영영 이 구역으로 안 온다.
  enforced_by: |
    · backend/stream_monitors/services/zones.py — save_zone · list_zones
    · backend/apps/dsm/api.py — POST /api/dsm/settings/zones
    · backend/tests/test_dsm_app.py::ZoneSettingTest — 8건
    · backend/tests/test_tenant_isolation.py — WRITE_PROBES 에 구역 쓰기 probe
  affects: [D-212, D-269, D-284, D-290, D-299, D-365]

- id: D-367
  title: "F-05 API Key 발급·폐기 — **세 번 미룬 것이 세 번 다 옳았다**"
  status: decided
  raised_by: "Code 2026-09-10 (지시 D-360 ③ 이행) · 세종 판정 위임"
  decision: |
    ▣ 이 절의 내력이 이 절의 값이다:
        2026-09-06 (D-325)  표 ②가 갚을 줄 알았다 → **방향이 반대**였다(D-337)
        2026-09-07 (D-335)  인증은 이미 성했고 성하지 않은 것은 **범위**였다 → 좁혔다.
                            그러나 좁히기는 **소비 면**이고 이 절은 **발급 면**이다
        2026-09-10 (이번)   남은 하나 — 발급·폐기의 면
      세 번 다 「올릴 수 있을 것 같은」 상태였고 **세 번 다 안 올렸다.** 그 덕에 지금
      무엇을 갚았는지가 정확히 남아 있다(D-314).
    ▣ 한 일: **만들지 않고 감쌌다** — 지시 D-360 ③ 「만들지 말고 이어라」 그대로.
      발급기는 `core.apikey_account`(§0.4)에 이미 있고 **읽고 호출만** 한다.
      우리가 더한 것 셋:
        ① **테넌트 귀속** — dj-core 의 키는 `user` FK 만 갖는다. 테넌트 개념이 없다
        ② **마스킹 조회** — 조회 dataclass 에 **값 칸 자체가 없다**(D-319).
           "마스킹해서 저장"은 저장이다. 칸이 있으면 언젠가 채워진다
        ③ **회전** — 폐기+발급을 한 동작으로. 둘로 두면 폐기만 하고 발급을 잊는 날
           그 앱이 죽고, 반대면 낡은 키가 계속 산다
    ▣ 표 ②의 **어휘를 빌리되 표 ②에 넣지 않는다**(D-337). 들어오는 키는 테넌트별
      DB 행이라 환경변수 표에 들어갈 수 없다 — 넣으면 표 하나가 두 방향을 갖고,
      그 순간 D-337 이 잡은 혼동이 표 안으로 들어온다.
    ▣ 5값 상태를 옮긴 규칙을 코드에 적었다. **`present` 는 쓰지 않는다** — 우리가
      발급한 키에는 「값은 있는데 무슨 API 인지 모른다」는 상태가 없다. 없는 상태를
      억지로 채우면 그 칸이 곧 거짓이 된다(D-290).
    ▣ ★ 발급 라우트 셋은 **들어오는 키를 받지 않는다.** 키로 키를 발급받을 수 있으면
      키 하나가 영원히 자기를 갱신하고, **폐기가 폐기가 아니게 된다.**
    ▣ capability 는 문장으로 안 적고 **미들웨어의 허용 집합에서 읽는다** — 적으면 그
      집합이 바뀌는 날 문장만 옛말이 되고, 옛말이 된 문장은 옛말인 것이 안 보인다(D-286).
  enforced_by: |
    · backend/kernels/k5_trust/inbound_keys.py — 발급·폐기·회전·목록
    · backend/apps/dsm/api.py — POST/DELETE /api/dsm/settings/api-keys[/{id}[/rotate]]
    · backend/tests/test_f05_inbound_key_lifecycle.py — 16건
  affects: [D-204, D-269, D-281, D-290, D-314, D-319, D-325, D-335, D-337]

- id: D-368
  title: "F-12 등급규칙 (표 ③) — **무재기동 반영은 한 줄에서 나온다**"
  status: decided
  raised_by: "Code 2026-09-10 · 세종 판정 위임"
  decision: |
    ▣ 표 ①(임계값)과 **같은 모양**으로 세운다: 정의는 코드, 값은 DB.
      같은 모양인 이유는 하나 — 운영자가 설정 화면 두 곳에서 다른 규칙을 배우지 않아도 된다.
      정의를 DB 로 옮기지 않는 이유도 표 ①과 같다: **지워진 정의는 코드가 부를 때 터진다.**
    ▣ ★ 계약 F-04 「JSON **무재기동** 반영」이 코드에서 나오는 자리는 한 줄이다 —
      배선이 사전을 직접 읽지 않고 **매번 DB 를 본다.** 사전은 import 시점에 한 번
      읽히고, 그것만 있으면 규칙 변경이 재기동을 요구한다.
      **재기동은 재난 상황 중에 하면 안 되는 일**이고, 규칙을 고치는 시점은 대개
      경보가 쏟아지는 그 순간이다. 캐시도 두지 않는다 — 두면 「바꿨는데 안 먹는다」가
      생기고 그 상태는 화면에서 안 보인다.
    ▣ ★ 이 표에서 가장 위험한 동작은 **하향**이다. fire 를 info 로 내리면 화재가
      조용해지고, **경보가 안 오는 것은 「아무 일도 없음」으로 보인다.** 막지 않되
      (현장에 따라 필요할 수 있다) 셋을 요구한다: 사유 · 이력 · `lowered` 표식.
      설정 화면은 **낮춘 것의 수를 따로 낸다**(D-301) — 목록에 섞이면 안 보인다.
    ▣ ★ [시험이 잡은 것] 첫 구현은 테넌트가 없으면 좁히지 **않았고**, 그래서 파이프라인
      판정이 **아무 테넌트의 규칙이나 집었다** — 남이 우리 화재 경보를 끌 수 있었다.
      원인: 「좁히지 않는다」와 「전역만 본다」를 한 값(None)에 둔 것.
      지금은 판정의 테넌트를 **그 카메라의 주인**에서 얻는다 — 파이프라인에 요청자가
      없는 자리(D-281)의 정답이 그것이다.
      ★ 이 갈래를 안 썼으면 그 누출은 **초록으로 들어왔다.**
    ▣ 계약이 **안 정한 것을 계약인 척하지 않는다**(D-280): 계약 [별첨1] 은 두 열거를
      각각 정의하되 둘을 잇는 규칙은 적지 않았다. 그래서 이 표의 어떤 행도
      `contract_fixed` 가 아니다 — 표 ①의 F-04 「5분」·F-10 「30초」와 다른 자리다.
  enforced_by: |
    · backend/kernels/k5_trust/grade_rules.py + 마이그 0023 (GradeRule · GradeRuleChange)
    · backend/stream_monitors/services/detection_event_bridge.py — resolve_severity 호출
    · backend/apps/dsm/api.py — POST /api/dsm/settings/grade-rules
    · backend/tests/test_grade_rules.py — 18건
  affects: [D-212, D-280, D-281, D-284, D-290, D-301, D-325]

# ═══════════════════════════════════════════════════════════════════════════
# ★ 번호 충돌 — 2026-09-11 지시서와 이 트리가 **D-367 · D-368 을 서로 다르게 쓴다**
# ═══════════════════════════════════════════════════════════════════════════
#
# 지시서(2026-09-11)는 D-367 =「이벤트는 버리지 않는다」· D-368 =「쓰기는 읽기보다
# 위험하다」로 적었다. 그런데 **이 트리는 2026-09-10 에 그 두 번호를 이미 썼다**:
#     D-367 = F-05 API Key 발급·폐기 면
#     D-368 = F-12 등급규칙 (표 ③)
#
# ★ 덮어쓰지 않았다. 덮으면 어제 확정한 판정 둘이 대장에서 사라지고,
#   사라진 것은 사라진 줄도 모른다. 대신 이 트리에서는 **D-369~D-376** 으로 잇고,
#   각 항목에 `author_tree_id` 로 지시서의 번호를 함께 적는다.
#   두 벌은 반드시 어긋난다 — 그러니 **어긋난 자리를 적어 둔다** (D-369 본문 그대로).
