- id: D-221
  title: "W0-2 의 dod ③ 은 WP-1 로 이월 — W0-2 는 성능대조 기록으로 완료 가능"
  status: decided
  raised_by: "agent (P-W0-2-1 · WP-0 ENTRY 작성 중 §3-5)"
  question: >-
    W0-2 의 dod ③ 이 "W0-14 가 done 또는 verify-pending" 인데,
    W0-14 는 WP-1 소속이고 현재 ready 다. WP 순서 고정 규칙(금지 #18) 때문에
    에이전트가 W0-14 를 WP-0 으로 당겨올 수 없다. W0-2 를 WP-0 에서 어떻게 닫는가.
  decision: |
    A안 확정. dod ③ 은 WP-1 EXIT 로 이월한다.
    W0-2 는 ①(우회 목록에서 업무 데이터 모델 제거) + ②(BypassListTest 계열 회귀 확인)
    + 성능 대조 기록으로 완료 가능하다.
    성능 대조를 요구하는 이유: W0-2 의 실질 리스크는 "우회를 제거했더니 느려져서
    누군가 되돌리는 것"이다. 되돌리지 못하게 하려면 느려졌는지 아닌지가 숫자로 남아야 한다.
    느려졌다면 인덱스·select_related/prefetch_related 로 푼다. 우회로 되돌리지 않는다.
  rationale: |
    에이전트의 4원칙 ④(범위가 작은 쪽) 판단이 옳다. ③은 후속 티켓의 '존재 확인'일 뿐이고
    실질 통제는 W0-14 의 산출물이다. B(WP 구성 변경)·C(WP 이동)는 대표 승인 사항이며,
    이 건 때문에 WP 경계를 흔들 이유가 없다.
  affects: [W0-2, W0-14, WP-0, WP-1]
  supersedes_pending: P-W0-2-1

- id: D-222
  title: "W0-4 의 실효 DoD 는 D-218 문구 — 정본 dod 를 그 문구로 교체한다"
  status: decided
  raised_by: "agent (P-W0-4-1 · WP-0 ENTRY 작성 중 §3-1)"
  question: >-
    D-218 이 W0-4 의 dod 를 "플래그 OFF 청크에 데모 식별자 0건 + 라우터 테이블 부재(홈 폴백 허용)"
    로 교체하기로 결정했으나, v3.1 tickets.yaml 의 dod 텍스트는 여전히 옛 문구
    ("해당 URL 직접 접근 시 404")다. 어느 것을 실효 DoD 로 보는가.
  decision: |
    A안 확정. D-218 문구가 실효 DoD 다. 그리고 이번에는 기록에 그치지 않고
    tickets.yaml 의 dod 텍스트 자체를 그 문구로 교체한다 (이 결정이 승인부).
    "결정은 D-218 에, 정본은 옛 문구로" 갈라진 상태를 유지하면 다음 사람이 또 404 를 구현한다.
  rationale: |
    에이전트가 A 를 고르고 차이를 AUTHOR-ERROR 로 기록한 처리는 맞았다.
    남은 문제는 정본이 여전히 틀려 있다는 것이고, 그것은 에이전트 권한 밖이었다(금지 #11).
    이 결정으로 권한을 열어 정본을 맞춘다.
  affects: [W0-4]
  supersedes_pending: P-W0-4-1
  related: [D-218]

- id: D-223
  title: "W0-10 의 done 소급 강등은 옳았다 — settings.py 16곳 치환으로 재충족 인정"
  status: decided
  raised_by: "agent (P-W0-10-1 · WP-0 ENTRY 작성 중 §3-6)"
  question: >-
    W0-10 은 정본에 done 이지만, v3.1 이 dod 를 넓히면서(settings.py 기본값 포함)
    미충족 상태가 됐다. status 를 되돌리고 치환하는 것이 맞는가, 치환 범위는 어디까지인가.
  decision: |
    A안 확정. done 소급 강등이 맞았고, 커밋 97c0924 의 settings.py 16곳 치환으로
    재충족됐다 — 현행을 인정한다.
    원칙: dod 가 넓어지면 이미 done 인 티켓도 재판정 대상이다. done 은 영구 면허가 아니다.
  rationale: |
    4원칙 ①(더 안전한 쪽)이 맞다. 기본값이 코드에 남아 있으면 .env 누락 시 조용히
    사내 주소로 붙는다 — 외부 납품 빌드에서 특히 위험하다.
    2026-08-16 이후 이 위험의 성격이 바뀌었다: 사내망이 소멸했으므로 잔존 기본값은
    "잘못된 곳에 붙는다"가 아니라 "있지도 않은 곳에 붙어 조용히 죽는다"가 된다.
    치환의 정당성은 오히려 커졌다.
  affects: [W0-10]
  supersedes_pending: P-W0-10-1

- id: D-224
  title: "격리 테스트에 xfail 금지 유지 — 예상 실패는 문서 등록부(coverage.md)가 정본"
  status: decided
  raised_by: "agent (P-W0-3-1 · WP-0 §11-2 @expectedFailure 등록 수행 중)"
  question: >-
    ENTRY §11-2 는 예상 실패 3건을 @expectedFailure 로 등록하라고 했다. 그런데 파일
    머리말이 xfail 금지를 명시하고, 절대금지 #5 가 격리 테스트 수정을 금지하며,
    D-209 는 "실패가 산출물"이라고 결정했다. 코드 표기인가 문서 등록부인가.
  decision: |
    A안 확정. xfail 금지를 유지한다. 예상 실패의 정본은 evidence/*/coverage.md 의
    문서 등록부다. ENTRY §11-2 의 지시는 철회한다 — 작성자 오류였다.
    @expectedFailure 는 실패를 스위트 집계에서 지운다. 그것은 금지 #5 가 막으려던 상태와
    결과가 같다: 빨간불이 사라져 아무도 보지 않게 된다.
  rationale: |
    에이전트의 판단이 지시서보다 옳았던 사례다. 덧붙여 실측으로 잡아낸 것이 하나 더 있다 —
    예상 실패는 3건이 아니라 1건만 확정이었고(나머지 둘은 통과 예상·판정 불가),
    3건 전부에 xfail 을 걸었다면 뒤 둘이 unexpected success 로 스위트를 깨뜨렸을 것이다.
    지시대로 했으면 게이트가 죽었다.
  affects: [W0-3, W0-14]
  supersedes_pending: P-W0-3-1
  related: [D-209]

- id: D-225
  title: "CORS_ALLOW_ALL_ORIGINS 제거는 신규 티켓 W0-15 (P1·S) — WP-2 소속"
  status: decided
  raised_by: "agent (P-W0-10-2 · settings.py 치환 중 발견 — 범위 밖)"
  question: >-
    backend/config/settings.py L629 의 CORS_ALLOW_ALL_ORIGINS = True 때문에
    CORS_ALLOWED_ORIGINS 허용목록이 아무 효력이 없다. 운영 배포에서 전 origin 을
    허용한다는 뜻이다. 어느 티켓에서 다루는가.
  decision: |
    A안 확정. 신규 티켓 W0-15 를 신설한다 (P1 · effort S · WP-2 소속).
    이 결정이 티켓 신설의 승인부다 — 에이전트가 tickets.yaml 에 등재한다.
    범위: CORS_ALLOW_ALL_ORIGINS 를 env.bool(..., default=False) 로 내리고
    허용목록을 실제로 작동시킨다. 개발 편의는 .env 로만 연다.
  rationale: |
    4원칙 ④(범위가 작은 쪽)가 맞다. 지금 끄면 프런트 개발 서버·고객사 origin 이 즉시 막혀
    회귀 범위가 넓다. WP-2 goal("외부에 내보낼 수 있는 빌드")과 정확히 같은 문제이므로
    거기서 다른 릴리스 위생 항목과 함께 한 번에 검증하는 것이 맞다.
    다만 기록만 하고 티켓이 없으면 잊힌다 — 그래서 티켓을 만든다.
  affects: [W0-15, W0-10, WP-2]
  supersedes_pending: P-W0-10-2

- id: D-227
  title: "meta.manifest 는 v3.0 개편 때 작성자가 유실한 것 — 실측 생성으로 복원"
  status: decided
  raised_by: "agent (P-LOOP-2 · WP-0 EXIT §6 #5 · STEP 0 무결성 검사 수행 시도)"
  question: >-
    STEP 0-2·0-3 이 meta.manifest 를 요구하는데 tickets.yaml v3.1 의 meta 에
    manifest 키가 없다. 무결성 검사를 어떻게 성립시키는가.
  decision: |
    A안 확정. manifest 를 신설한다. 원인은 규칙의 문제가 아니라 유실이다 —
    v3.0 개편 때 작성자가 떨어뜨렸고, 그래서 STEP 0-3 은 처음부터 실행 불가능한 조항이었다.
    복원 방식: scripts/gen_manifest.py 가 tickets 배열을 실측해 생성하고 대조한다.
    total / by_phase / ids 세 값. 손으로 세지 않는다.
  rationale: |
    B(검사를 문서에 맞춰 낮추기)를 택하지 않는 이유는 하나다 — 잡히는 것이 줄어든다.
    66개 id 목록이 정본에 박혀야 티켓 유실·중복이 실제로 잡힌다.
    손으로 세지 않게 만드는 것이 이 결정의 절반이다. 손으로 센 수가 틀렸던 것이
    애초에 manifest 가 사라진 경위다.
  affects: [AGENT_LOOP, tickets.yaml]
  supersedes_pending: P-LOOP-2

- id: D-228
  title: "tickets.sha256 폐기 — 파일 전체 해시는 설계 자기모순이었다"
  status: decided
  raised_by: "agent (P-LOOP-1 · WP-0 EXIT §6-1 무결성 검사 재현)"
  question: >-
    docs/agent/tickets.sha256 이 베이스라인 커밋(4afca2b)을 포함한 전 커밋에서
    실제 파일 해시와 불일치한다. hard_stop 5종 중 하나인 registry-mismatch 의
    판정 근거가 한 번도 참을 낸 적이 없다. 이 파일을 어떻게 할 것인가.
  decision: |
    B안 확정 — 파일 폐기. (에이전트 의견은 A(부분집합 해시)였으나 채택하지 않는다.)
    STEP 0-3 은 manifest 대조로 일원화한다 (D-227).
  rationale: |
    파일 전체 해시는 설계 자기모순이다. 에이전트는 status·evidence·updated_at 을
    정상 작업으로 계속 고치므로, 그 해시는 정상 동작에서 항상 어긋난다.
    실제로 한 번도 맞은 적이 없고 verify_gates.sh 에도 CI 에도 배선된 적이 없다.
    A(부분집합 해시)를 택하지 않는 이유: 정규화 규칙이 또 하나의 유지 대상이 되고,
    그 규칙이 틀리면 같은 실패가 반복된다. manifest 는 사람이 티켓을 넣고 뺄 때만
    바뀌는 것을 세므로 유지 대상이 없다.
    이 문제의 본질은 해시 알고리즘이 아니라 "게이트가 있다는 착시"가 없는 것보다 나쁘다는 것이다.
  affects: [AGENT_LOOP, tickets.yaml]
  supersedes_pending: P-LOOP-1
  related: [D-227]

- id: D-234
  title: "승인 전 선행 구현은 '패치 격리' 원칙 — 작업트리 잔류는 불허"
  status: decided
  raised_by: "agent (P-LOOP-3 · WP-0 EXIT §7-1 · ENTRY 승인줄 없이 §11 5건이 커밋됨)"
  question: >-
    review/WP-0/ENTRY.md 에 APPROVED: 줄이 없는 상태에서 §11 오프라인 작업 5건이
    이미 실행·커밋되었다(97c0924·dfced8d·7af88b6). 승인이 있었던 것으로 보는가.
  decision: |
    이번 건은 A안(소급 승인)으로 처리한다 — 대표 지시에 의한 커밋이므로 사후 승인으로 기록한다.
    앞으로의 규칙은 패치 격리다:
      · 승인 전 프로토타입 작성은 허용한다. 설계를 말로만 검토하면 틀린 것을 승인하게 된다.
      · 다만 작업트리에 잔류시키지 않는다. 승인 전 산출물은 패치(diff)로 격리해 두고,
        승인 후에 적용·커밋한다.
    금지 #17 에 이 각주를 단다.
  rationale: |
    "승인 전 한 줄도 쓰지 마라"는 실제로는 지켜지지 않았고(3회), 지켜졌더라도
    검토 품질을 떨어뜨렸을 것이다 — ENTRY 의 전제 검증은 코드를 만져봐야 나온다.
    문제는 구현 자체가 아니라 커밋되지 않은 채 떠 있는 구현이다. 그 상태가
    baseline 을 어긋나게 하고, 실제로 WP-1 EXIT §2 의 커밋 해시 칸을 비웠다.
    금지의 대상을 '구현'에서 '잔류'로 옮기는 것이 이 결정이다.
  affects: [AGENT_LOOP, "WP 관문 운영"]
  supersedes_pending: P-LOOP-3

- id: D-241
  title: "W0-14 롤아웃 3원칙 — 파일럿 우선 · dod③ 경로 정정 · print_format 동반 처리"
  status: decided
  raised_by: "agent (P-W0-14-1 · P-W0-12-1 · P-W0-12-2 — WP-1 구현 중 3건)"
  question: >-
    (1) @tenant_scoped 를 실 컨트롤러에 언제 부착하는가.
    (2) W0-12 dod ③ 이 지목한 test_service_layer_does_not_pick_arbitrary_group 이 없다.
    (3) print_format/models.py:98 의 미리보기 표본 오열람을 어디서 다루는가.
  decision: |
    세 건 모두 에이전트 기본값(A)을 확정한다.

    ① 부착 순서 (P-W0-14-1): ScopeDecoratorIntegrationTest 2건이 초록이 된 뒤
       파일럿 컨트롤러 1개부터. 466개 일괄 부착은 금지한다.
       위험이 차단이 아니라 기동 실패이고, 그것은 경고 모드로 막히지 않는다.
       (ninja 가 inspect.signature 로 요청 스키마를 만들기 때문 — 래퍼가 시그니처를 가리면 앱이 안 뜬다)

    ② dod ③ 경로 정정 (P-W0-12-2): 정본 dod ③ 을
       tests/test_route_tenant_scope.py::ServiceLayerGroupSelectionTest 로 정정한다
       (이 결정이 승인부 — 에이전트가 tickets.yaml 에 반영한다).
       격리 테스트 파일에 신규 테스트를 넣는 B 는 금지 #5 에 정면으로 닿는다.

    ③ print_format (P-W0-12-1): W0-14 롤아웃 ②단계에서 print_format 컨트롤러와
       함께 다룬다. 결함의 성격이 W0-12(쓰기 오배정)가 아니라 W0-14(읽기 노출)다.
  rationale: |
    셋을 한 결정으로 묶는 이유: 전부 "W0-14 를 언제 어떻게 실제 코드에 붙이는가"의 하위 문제다.
    따로 답하면 서로 어긋난 시점에 각각 적용될 수 있다.
    ①의 근거가 나머지를 지배한다 — 통합시험 2건이 초록이 되기 전에는 아무것도 붙이지 않는다.
  affects: [W0-12, W0-14, print_format]
  supersedes_pending: [P-W0-14-1, P-W0-12-1, P-W0-12-2]

# --- 아래 4건은 RESUME_NEXT(2026-08-16) 본문에서 인용된 결정이다. -------------
# 작성자 트리(v3.6)에 원문이 있으나 이 트리에 미수령이라, 인용문 범위에서 정서했다.
# 원문 수령 시 이 항목을 대체할 것.

- id: D-236
  title: "동결 (FREEZE) — 신규 기능 구현 중지, 기동·검증·정비만"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-16 §5-⑤ 인용)"
  decision: |
    신규 기능 구현을 금지한다. 허용 범위는 기동 · 검증 · 정비뿐이다.
    검증되지 않은 코드가 1,217줄 떠 있는 상태에서 기능을 더 쌓지 않는다.
    예외: RUNBOOK_로컬기동.md 실행은 "조사·측정 + 환경 복구"로 허용한다. 소스 수정은 여전히 금지.
    해제 조건: 로컬 기동 성공 → 미검증 재고 전량 검증 → 대표 승인.
  affects: ["전 WP"]
  note: "원문 미수령 — RESUME_NEXT 인용 범위에서 정서"

- id: D-237
  title: "WP-0·WP-1 EXIT 는 승인하지 않는다 — goal 이 아직 거짓"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-16 §4 인용)"
  decision: |
    review/WP-0/EXIT.md · review/WP-1/EXIT.md 는 승인하지 않고 비워 둔다.
    이유: 두 EXIT 의 goal 이 아직 거짓이다(증명 수단이 실행되지 않았다).
    로컬 기동 성공 후 갱신 재제출 → 그때 승인.
    ENTRY 2장은 승인한다 — 계획은 옳았고 이미 이행됐으므로 정합화 목적.
  affects: [WP-0, WP-1]
