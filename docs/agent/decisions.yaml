- id: D-400
  author_tree_id: "지시서 P-10 (세종 2026-09-16)"
  title: "**판정 불가는 통과가 아니다** — 집계기가 SKIP 을 exit 0 으로 세고 있었다"
  status: decided
  raised_by: "세종(기획) 2026-09-16 P-10 · Code 실측"
  decision: |
    ▣ 세종의 물음(§1): 「직전 턴 route-alive 는 빨갰는데 이번 보고는 게이트 9종 전부
      exit 0 이다. **왜 초록이 됐는지가 보고에 없다.**」
    ▣ 답 — **(c) 의 변형** [실측 2026-09-16]:
      · (a) 아니다 — 죽은 라우트 2건은 **처분되지 않았다.** 지금 자격증명을 주고 때리면
        `verify_route_alive.py` 는 여전히 **exit 1 · 죽은 라우트 2건**이다
      · (b) 아니다 — 시험을 한 줄도 고치지 않았다 (D-327)
      · (c) 그렇다. 다만 **목록에서 빠진 것이 아니다** — route-alive 는 9종에 있었다.
        빠진 것은 **판정**이다: 자격증명이 없으면 SKIP(판정 불가)이고,
        **집계기가 그 SKIP 을 exit 0 으로 셌다.**
      → 「게이트 9종 전부 exit 0」은 **빨간 것을 재지 않고 낸 초록**이었다.
        09-14 회신 본문에는 적었으나 **커밋 메시지에는 안 적었다** — 세종이 읽는 것은 커밋이다.
    ▣ ★★ 그리고 route-alive 하나가 아니었다 [실측]: 다섯 자리가 SKIP 이었다 —
      `secrets`(스캐너 미설치 · 다만 pre-commit 훅은 커밋마다 실제로 돈다) ·
      `bypass`(프레임워크 모델 잔존) · `model-inheritance`·`ui-library`(볼 대상 0건) ·
      `route-alive`. **아홉 중 넷만 실제로 쟀다.**
    ▣ 고침: 종료 코드가 스스로 말한다 — **0 쟀고 통과 · 1 쟀고 실패 · 2 못 쟀다.**
      이 저장소는 이미 `verify_migrations.py` 등에서 exit 2 = 판정 불가를 쓴다.
      **집계기만 그것을 몰랐다.**
      ★ 실패(1)로 하지 않은 이유: 서버 없는 환경에서 CI 를 빨갛게 만들면 **그 게이트는
        결국 꺼진다**(D-353). 꺼진 게이트는 아무것도 안 지킨다.
        「모른다」는 **자기 칸이 있어야 한다** — D-290 의 집계기 판이다.
      ★ 판정식은 **한 벌**이다(`summary_rc`). 세 자리가 각자 계산하면 어긋나고,
        어긋난 판정식 복사본 하나가 D-212 였다.
    ▣ 세종 오류 **1건** [실측]: 지시서가 「죽은 라우트 2: /monitoring-dashboard ·
      /intergrated-dashboard」라 적었다. **그 둘은 죽은 라우트가 아니다** — 화면 경로이고
      열었더니 홈으로 튕긴 **도달 불가** 건이다(D-396 ③④). 죽은 라우트 2건은
      `/api/media-data/` 와 `/api/media-data` — **같은 자리의 두 형태**다.
  enforced_by: |
    · docs/agent/verify_gates.sh :: summary_rc() — 판정식 한 벌
    · docs/agent/verify_gates.sh --self-test — 세 갈래(판정불가 2 · 통과 0 · 실패+판정불가 1)
      ★ 음성 갈래 실측: `summary_rc` 를 망가뜨리자 자기시험이 exit 1 로 빨개졌고,
        되돌리자 초록이 됐다 (D-310 · D-350)
    · docs/agent/evidence/D-400/undecidable_is_not_pass.md
  affects: [D-212, D-290, D-301, D-310, D-327, D-350, D-353, D-386, D-396]

- id: D-401
  author_tree_id: "지시서 P-9 (세종 2026-09-16)"
  title: "P-9 시드 — 그리고 **기존 씨앗이 모형이었다.** 화면 16장이 그 위에서 찍혔다"
  status: decided
  raised_by: "세종(기획) 2026-09-16 P-9 · Code 이행"
  decision: |
    ▣ 지시서가 「실제 이벤트」를 정의했다 [인용]: **K1 생성 경로를 통과한 행.
      DB 직접 INSERT 나 화면 고정값은 모형이다 — 금지.**
    ▣ ★★ 그 정의로 재니 **기존 씨앗이 걸렸다** [실측]:
      `scripts/capture_screens.py::seed_events` 가 `_base_manager.create(...)` 로 행을
      직접 만들고 있었다. **화면 16장은 그 모형 위에서 찍혔다.**
    ▣ 무엇을 숨겼나 — 구체적으로:
      · `event_type` 이 `gxprobe-D384-screen` 이었다. **열거값이 아니다** — K1 의
        `_validate` 를 안 지나므로 아무 문자열이나 들어가고, 화면·통계는 그것을 유형으로 읽는다
      · 중복 억제(F-04)·주소 조회(FX-5)·클립 참조가 **한 번도 안 돈다**
      · **모형 데이터는 파이프라인을 건너뛴 만큼 결함을 숨긴다.** 이것이 D-386(화면을
        띄우는 것이 가장 강한 시험)을 정확히 그만큼 약하게 만든다 — 브라우저가 라우트를
        때려도, 그 라우트가 읽는 행이 파이프라인을 안 지났으면 결함이 나타날 수 없다
    ▣ 고침: `seed_dsm_events` 커맨드 신설(`record_detection` 만 부른다) ·
      캡처 씨앗을 실제 경로로 · **정리 근거를 유형에서 씨앗 카메라로** (유형이 열거값이
      되면서 옛 기준으로는 못 고른다 — 그대로 뒀으면 씨앗이 안 지워진 채 남았다)
    ▣ 심은 것 [실측]: **20건** · 판정 12 · 대응 전이 36 ·
      대응 진행 occurred 4/acknowledged 4/in_progress 4/closed 8 ·
      탐지 판정 new 8/confirmed 8/rejected 4 · 유형 fire·flood·intrusion·person 각 5.
      ★ **두 축을 모두 채운 이유**: 한 축만 채우면 화면에서 **두 축이 있다는 사실 자체가
        안 보인다** — 「종결」이 대응 종결인지 판정 종료인지 모른 채 검수에 나간다.
      ★ 스냅샷·구간은 **비어 있다**(MinIO 부재). 지시서대로 비어 있는 채로 찍었다.
    ▣ 실측이 도구를 한 번 고쳤다(D-350): 1차판이 `DataError: varchar(16)` 로 죽었다 —
      `address_source` 는 **자유 문자열이 아니라 열거값**(unset/manual)이고 설치 주소는
      `install_address` 다. **이름이 비슷한 칸 둘을 섞었다** — 동음이의의 작은 판(D-337).
    ▣ 데이터 출처를 화면마다 적는다: `verify_screens` 필수 메타 **4칸 → 5칸**(`data_source`).
      늘리자마자 기존 16장이 **전부 빨개졌고**(출처 미표기), 실제 경로 씨앗으로 다시 찍었다.
      ★ 시드로 찍은 화면은 **실제 화면이지만 실제 사고는 아니다.** 구분되지 않으면
        검수에서 시드 화면이 현장 화면으로 읽힌다 — **착시가 아니라 거짓말이다**(D-284).
  enforced_by: |
    · backend/stream_monitors/management/commands/seed_dsm_events.py (--purge · --report)
    · scripts/capture_screens.py :: seed_events(record_detection) · clean_events(카메라 기준)
    · scripts/verify_screens.py :: META_FIELDS 5칸 (data_source 필수)
    · backend/tests/test_f05_event_api.py :: K1_CONSUMERS(seed_dsm_events 등재)
    · docs/agent/evidence/D-401/seed_is_real_path.md
  affects: [D-284, D-290, D-301, D-330, D-337, D-347, D-350, D-386, D-396, D-399]

- id: D-402
  author_tree_id: "지시서 P-12 (세종 2026-09-17)"
  title: "회색 다섯을 열어 보니 **성격이 셋이었다** — 잼 7 · 회색 0 · 대기 2"
  status: decided
  raised_by: "세종(기획) 2026-09-17 P-12 · Code 실측 이행"
  decision: |
    ▣ 착수 전 실측 [D-379 의무 · 2026-09-17]: 게이트 9종을 하나씩 돌려 기준선을 잡았다 —
      **잼고 통과 4 · 잼고 실패 0 · 못 잼 5.** 지시서 기록과 일치.
    ▣ ★★ 다섯을 열어 보니 **성격이 셋으로 갈렸다.** 「회색 5」는 한 종류가 아니었다:
        ① 진짜 빚 2   route-alive(자격증명 없음) · secrets(도구 없음) — **갚았다**
        ② 잘못 칠한 색 1  bypass — **쟀고 알고 있었는데** SKIP 을 냈다
        ③ 빚이 아닌 것 2  model-inheritance · ui-library — **볼 대상이 0건**이었다
      「회색 5」라는 수는 **다섯 자리가 안 지켜진다**로 읽힌다. 실제로는 셋이었다.
    ▣ 결과 [실측]: **잼고 통과 6 · 잼고 실패 1 · 못 잼 0 (대기 2).** 잼 = 7.
      목표(잼 ≥ 6 · 회색 ≤ 3)를 넘겼다. 집계 줄이 이제 네 수를 병기한다.
    ▣ ★ **대기**라는 칸을 새로 만들었다(P-12 ④). 「못 봤다」와 「볼 것이 없었다」는
      다른 사실이다. 앞의 것은 갚아야 할 빚이고 뒤의 것은 아니다. 종료 코드는 둘 다 2 다 —
      재지 않은 것은 초록이 아니다. 갈리는 자리는 **집계 줄**이고, 거기서 갈려야
      「무엇을 갚아야 하는가」가 보인다. ⚠ 없애지 않는다: 대상 0과 게이트 부재는 다르다.
    ▣ bypass 는 회색에서 **래칫**으로 옮겼다(D-311). 프레임워크 모델 7건은 아는 빚이고,
      아는 빚에는 회색이 아니라 기준선이 맞다. 「언젠가 없앤다」가 **「오늘 안 늘었다」**로
      바뀐다 — 뒤엣것만 매일 확인할 수 있다. 래칫 대조 [실측] 양성 1 · 음성 3.
  enforced_by: |
    · docs/agent/verify_gates.sh — waiting() · tally() · gate_bypass 의 FW_BASELINE 래칫
    · scripts/verify_gate_counts.py — 게이트마다 [입력] 건수를 말하는지 (D-301)
    · docs/agent/evidence/DA-05/blockers.yaml — GATE_ROUTE_ALIVE_CREDENTIAL ·
      GATE_SECRET_SCANNER_ABSENT · BYPASS_FRAMEWORK_MODELS · GATE_TARGETS_ZERO_WAITING
    · docs/agent/evidence/P-12/greys.md
  affects: [D-290, D-301, D-311, D-350, D-353, D-400]

- id: D-403
  author_tree_id: "지시서 P-12 ① (세종 2026-09-17)"
  title: "route-alive — **로그인 성공이 토큰이 먹힌다는 증거가 아니었다.** 26 중 24가 401이었다"
  status: decided
  raised_by: "Code 2026-09-17 실측 (P-12 ① 이행 중 발견)"
  decision: |
    ▣ 지시대로 자격증명을 로컬 `.env.gates`(gitignored)에서 읽게 하고 게이트를 돌렸다.
      **exit 0 이 나왔다.** 그런데 출력을 보니 **26건 중 24건이 401** 이었다.
    ▣ 원인 [실측]: 판정기가 `/api/token/pair` 를 **첫째로** 물었고 그것이 231자 JWT 를
      내주었다. 그러나 dj-core `core/auth.py:38` 은 `user.token`(저장된 세션 토큰)이 없으면
      그 JWT 를 **"Token expired"** 로 거절한다 — `token/pair` 는 세션을 세우지 않는다.
      제품의 진짜 문은 `/api/v1/auth/login` 이고 **`end_previous_session` 칸이 필요하다**
      (동시 접속 1개라 없으면 **200 + `success:false`** 가 온다 — 조용한 성공).
    ▣ ★★ 그런데 더 나쁜 것은 원인이 아니라 **판정이 초록이었다는 사실**이다.
      401 을 「문지기가 섰다(살아 있다)」로 읽는 규칙은 **옳다.** 틀린 것은
      **들어가지 못한 채로 그 규칙을 쓴 것**이다. 그 파일 첫머리가 「이 판정기의 가장 나쁜
      실패」라 스스로 적어 둔 그 모양이 그대로 일어났다 — 적어 두는 것으로는 안 막힌다.
    ▣ ★ 고침은 규칙이 아니라 **증거**다: 로그인 뒤 **같은 목록을 익명으로 한 번 더 때려**
      토큰이 무엇을 바꿨는지 센다(`token_changed_anything`). 0건이면 판정 불가다.
      **토큰을 넣은 것과 안 넣은 것의 결과가 같으면 그 토큰은 없는 것과 같다.**
      양성 대조를 손으로 정하지 않는 것이 요점이다 — 「이 라우트는 200 이어야 한다」를
      적어 두면 그 목록이 곧 옛말이 된다.
    ▣ 고친 뒤 [실측]: 토큰이 바꾼 라우트 **24/26** · 토큰 들고도 401/403 인 자리 **0**.
      그리고 그 401 밑에 덮여 있던 것이 드러났다 — `/api/media-data(/)` **500 두 자리**.
      게이트는 **exit 1**. §1 이 「옳은 색」이라 한 그 색이다. P-5(MinIO)가 서면 풀린다.
    ▣ 대조 [실측]: 자격증명 있이 **exit 1** · 없이 **exit 2**. 갈린다.
    ▣ 환경 [실측]: `gx-shell` 이 8000 을 게시하지 않아 호스트에서 서버가 안 보인다.
      `GX_ROUTE_CONTAINER` 로 **자기 자신을 컨테이너 안에서 다시 돌린다** — 두 벌을
      만들지 않는다(두 벌은 반드시 어긋난다 · D-369).
  enforced_by: |
    · scripts/verify_route_alive.py — token_changed_anything(익명 대조) ·
      BIRTH_SAMPLE_TOKEN_DEAF(26,24) · _extract_token(조용한 성공 거절) · LOGIN_PATHS 순서 ·
      load_local_env · delegate_to_container. 자기시험이 음성 2갈래로 무는 것을 확인했다
    · docs/agent/ENV_EXAMPLE_게이트자격증명.txt — 저장소엔 이름만 (D-204)
    · docs/agent/evidence/D-386/route_alive.json — 26건 · 200 24 · 500 2
    · docs/agent/evidence/DA-05/blockers.yaml :: GATE_ROUTE_ALIVE_CREDENTIAL
  affects: [D-204, D-284, D-301, D-310, D-350, D-369, D-386, D-400]

- id: D-404
  author_tree_id: "지시서 P-12 ② (세종 2026-09-17)"
  title: "시크릿 스캔 — **어디를 보는가가 판정의 절반이었다.** 같은 저장소에 19건과 1건"
  status: decided
  raised_by: "Code 2026-09-17 실측 (P-12 ② 이행)"
  decision: |
    ▣ gitleaks 8.21.2 를 **판·해시 고정**으로 세웠다(D-387). 받은 파일이 lock 의 sha256 이
      아니면 **설치를 거절한다** — 「깔았다」가 진술이 아니라 확인 행위가 된다(D-323).
      판은 `.pre-commit-config.yaml` 과 같은 것으로 맞췄다 — 두 벌이 어긋나지 않게(D-369).
      받은 물건은 `tools/`(gitignored). **저장소가 드는 것은 lock 이지 물건이 아니다.**
    ▣ ★★ 깔고 처음 돌린 날 [실측]: 파일 면 **19건** · 이력 면 **1건**.
      같은 저장소, 같은 규칙, 열아홉 배. 어느 쪽도 거짓말이 아니었다 —
      **서로 다른 질문에 답하고 있었다.** 물어야 할 것은 「저장소가 무엇을 나르는가」다.
      그래서 파일 면을 훑고 **git 이 그 파일을 나르는지**로 가른다. 저장소 밖(빌드 산출물·
      로컬 `.env.stg`)은 건수로 말하되 빨강으로 세지 않는다 — 지우지도 않는다.
    ▣ 실제 발견 **1건**: `backend/stream_monitors/example_frontend.html:813` 에
      Django CSRF 토큰 32자가 하드코딩. **게다가 그 값이 차 있어서 바로 아래
      `if (!csrfToken)` 대체 경로 세 갈래가 한 번도 안 돌고 있었다** — 유출이면서 동시에
      기능 결함이었다. 값을 비우니 둘이 함께 고쳐졌다. **지우는 것이 곧 고치는 것**이었다.
      회전 불필요 [판정]: Django CSRF 토큰은 세션 범위이고 그 세션은 오래 전에 끝났다.
      장수 자격증명이었다면 여기 적지 않고 폐기·재발급이 먼저였다.
    ▣ ★ 측정기 결함 둘도 함께 나왔다 (D-350 — 측정기를 먼저 의심한다):
      ① `regexTarget="line"` 허용목록이 **~100KB 넘는 파일에서 조용히 꺼진다**(청크 경계).
         같은 `integrity` 한 줄이 118바이트에서 허용, 202KB 에서 오탐. **규칙이 아니라
         크기가 갈랐다.** 자리(paths)로 한 번 더 잠그고 4000줄 표본으로 매번 확인한다.
      ② `git check-ignore` 가 **한 건도 못 맞히고 있었다** — 파이썬 `text=True` 가 개행을
         CRLF 로 바꿔 경로에 CR 이 섞였고, git 은 그것을 C-따옴표로 감싸 돌려주었다.
         결과는 **무시되는 파일을 「저장소가 나른다」로 읽는 것** — 있지도 않은 유출로
         빨개졌다. NUL 구분(`-z`)으로 고쳤다.
         **잘못된 빨강은 잘못된 초록만큼 빨리 게이트를 죽인다.**
    ▣ 래칫 [D-311]: 이력에 이미 든 1건은 `.gitleaksignore` 가 **사유와 함께** 고정한다.
      이력 재작성은 대표 결정이고 공유 저장소를 쓰는 모두의 작업본을 깨뜨린다.
      기존 빚에 영원히 빨간 게이트는 꺼지고, 꺼진 게이트는 아무것도 안 지킨다(D-353).
    ▣ 대조 [실측]: 저장소가 나르는 자리에 심으면 **exit 1**, 치우면 **exit 0**.
      자기시험 양성 1(심은 키 32자) · 음성 2(플레이스홀더 · 큰 잠금 파일).
      ⚠ 첫 심기는 AWS 문서 예제값이라 기본 허용목록에 걸려 **안 잡혔다** — 나쁜 표본이었다.
        무엇을 심는지가 자기시험의 절반이다.
  enforced_by: |
    · scripts/install_secret_scanner.py — 해시 불일치면 설치 거절 (D-387)
    · scripts/secret_scanner.lock.json — 판 8.21.2 + sha256 2종
    · scripts/verify_secret_scan.py — 스캔 면 판정 · BIRTH_SAMPLE_SURFACE · BIRTH_SAMPLE_CHUNK ·
      자기시험 양성 1 · 음성 2
    · docs/agent/verify_gates.sh — gate_secrets 가 이 판정기를 부른다 (0/1/2 그대로 전달)
    · .gitleaks.toml — 자리(paths) 허용목록
    · .gitleaksignore — 래칫 (사유 포함)
    · docs/agent/evidence/DA-05/blockers.yaml :: GATE_SECRET_SCANNER_ABSENT
  affects: [D-003, D-301, D-310, D-311, D-323, D-350, D-353, D-387]

- id: D-405
  author_tree_id: "Code 자발 (지시서 §5 「확인해 [실측]으로」)"
  title: "오탐 ① 결합 규칙은 **없다** — 시드가 두 축을 각각 불렀을 뿐이다"
  status: decided
  raised_by: "Code 2026-09-17 실측"
  decision: |
    ▣ 지시서 §5: 「① 결합 규칙(REJECTED→대응 자동 closed)은 시드 `rejected 4 · closed 8` 로
      보아 **돌아가는 듯하다** — 확인해 [실측]으로.」
    ▣ 실측 결과: **없다.** `review_event` 는 `response_state` 를 한 번도 건드리지 않는다
      (`update_fields=["status","verdict","reviewed_by","reviewed_at","reject_reason"]`).
      시드가 `review_event` 와 `advance_response` 를 **각각** 부른다
      (`seed_dsm_events.py` — `if verdict: review_event(...)` 다음에 `for to in FORWARD[:steps]`).
      즉 「rejected 4 · closed 8」은 결합의 증거가 아니라 **시드가 두 번 쓴 결과**다.
    ▣ ★ 이것이 D-401 이 이름 붙인 모양의 재발이다 — **출력의 수를 보고 원인을 추정했다.**
      같은 수가 「규칙이 있다」에서도 「시드가 두 번 썼다」에서도 나온다.
      **수는 원인을 말하지 않는다.** 무엇이 그 수를 만들었는지는 코드가 말한다(D-280).
    ▣ 붙일 것인가는 **세종의 자리다.** 붙이면 D-399 가 갈라 둔 두 축이 한쪽에서 다시 묶인다.
      다만 오탐 기각에는 `reviewed_by` 가 있으므로 D-399 가 금지한 「접수한 사람이 없는
      종결」과는 다르다 — 그 점에서 결합은 **변호 가능하다.** 판정을 기다린다.
    ▣ 나머지 상태 [실측]: ② 판정 API — `review_event`·`record_feedback` 은 **있고**
      라우트 면은 **없다**(부분). ④ 오탐률 — `false_positive_rate` 가 **있다**(코호트 기준 ·
      `verdict` 로만 센다 · D-293). ③ 통지 — **없다**(쓰기 면이라 P-8 이 먼저다).
  enforced_by: |
    · backend/kernels/k1_event/services.py — review_event 의 update_fields 에
      `response_state` 가 **없는 것이 그 보장**이다. 붙이려면 이 줄이 먼저 바뀐다
    · backend/tests/test_response_flow.py — 두 축이 붙지 않았음을 보는 시험이 있다
    · backend/stream_monitors/management/commands/seed_dsm_events.py — 두 축을 각각 부른다
  affects: [D-280, D-290, D-293, D-399, D-401]

- id: D-406
  author_tree_id: "지시서 P-5 (세종 2026-09-18)"
  title: "저장소를 세웠다 — 그리고 **세우고 나서 더 조용한 결함**이 드러났다"
  status: decided
  raised_by: "세종(기획) 2026-09-18 순서 1 · Code 실측 이행"
  decision: |
    ▣ 착수 전 실측 [D-379 의무 · 2026-09-18]:
        MinIO 서비스     → **없음** (docker-compose 에 항목 자체가 없다)
        MinIO 이미지     → **이미 있음** (로컬에 `minio/minio` · D-333 ① — 밖에 사러 안 갔다)
        백엔드 배선      → **이미 있음** (`django_minio_backend` · settings 506~526행)
        기존 자격증명    → **더미** — 5자였다. MinIO 루트 요건은 8자 이상이다.
                            즉 **한 번도 진짜로 서 본 적이 없었다**
    ▣ 이행: compose 서비스 1개. 판을 **digest 로** 못박았다(D-387) — `:latest` 는 lock 이 아니다.
      태그(RELEASE.2025-09-07T16-13-09Z)는 사람이 읽으라고 옆에 적었다.
      자격증명은 뿌리 `.env`(gitignored)에서 compose 가 읽고 저장소엔 이름만 남는다(D-204).
      `${VAR:?}` 로 받는다 — 비면 **기본 자격증명으로 조용히 서는 대신 그 자리에서 멈춘다.**
    ▣ 강제 도구 [실측]: health 200 · 버킷 `guardianx-dev` · 탐침 객체 1건 ·
      `/api/media-data/` 와 `/api/media-data` **둘 다 500 → 200 · success:true** ·
      게이트 `route-alive` **잼고 실패 → 잼고 통과**(죽은 라우트 0).
      게이트 아홉: **잼고 통과 7 · 잼고 실패 0 · 못 잼 0 · 대기 2.**
    ▣ ★★ 그리고 세우고 나서 **더 나쁜 것**이 드러났다. 저장소를 실제로 내려 보았다:
          살아 있을 때  200 · success:true · 1건
          **내렸을 때**  200 · success:true · 1건   ← 아무 일도 안 일어난다
      `minio_client.available` 이 `__init__` 에서만 True 가 되고 다시 보지 않는다.
      **가용성이 기동 시점의 사진 한 장**이다. 저장소가 없던 동안에는 최소한 500 으로
      소리쳤다 — 이제는 조용하다. 새벽에 죽으면 당직자는 파일을 눌러 본 뒤에야 안다.
      ★ 이것을 이번 턴에 고치지 않는다. 매 요청 확인은 F-05 의 p95 를 먹고,
        처분(㉮ 짧은 TTL · ㉯ 실패 시 재확인 후 500 승격 · ㉰ 감시에만 맡김)은 **설계 판정**이다.
        고르는 자리가 세종이므로 대장에 올리고 셋을 적어 두었다(D-280 — 짐작해서 고르지 않는다).
    ▣ 정정 보고 (D-379): 지시서 §3 은 「P-5 가 media 화면·영상 백업·**EventClip** 을 한 번에
      연다」고 적었다. **EventClip 은 P-5 로 안 열린다** [실측] — `CLIP_EXTRACTION_READY=False` 는
      저장소 부재가 아니라 **계약 11조(원본 영상 반출 금지) 설계 잠금**이다.
      코덱·전송 방식·보존 기간이 정해져야 풀린다. 저장소는 그 셋 중 어느 것도 아니다.
    ▣ 목록의 내용은 MinIO 가 아니라 **DB** 가 낸다 [실측] — `MediaDataService.list_media` 는
      MinIO 로 **가용성만** 보고 항목은 질의로 만든다. 그래서 버킷에 객체를 직접 넣어도
      목록에 안 뜬다. **그것이 옳다.** 판정기가 「버킷의 객체」와 「라우트의 응답」을
      따로 세는 이유다 — 둘은 다른 것을 증명한다.
  enforced_by: |
    · docker-compose.yml — minio 서비스(digest 고정) · minio-data 이름 붙인 볼륨
    · .env.example — 이름만 (D-204). 값이 비면 compose 가 멈춘다
    · scripts/verify_minio.py — 저장소 살아있나 · 객체 ≥1 · 라우트가 받나(success 포함) ·
      출생 표본 2(죽은 두 자리 500 · 조용한 성공 500/true) · 대조 실측 내리면 1 · 세우면 0
    · docs/agent/verify_gates.sh — gate_route_alive (죽은 라우트 0)
    · docs/agent/evidence/DA-05/blockers.yaml :: MINIO_ABSENT_IN_DEV ·
      MINIO_AVAILABILITY_IS_BOOT_TIME_ONLY
    · docs/agent/evidence/P-5/minio.md
  affects: [D-204, D-301, D-333, D-350, D-378, D-386, D-387, D-397, D-403]

- id: D-407
  author_tree_id: "Code 자발 (P-5 를 재다가 나왔다)"
  title: "「살아 있는가」를 보라고 세운 신호가 **저장소가 죽어도 OK** 였다"
  status: decided
  raised_by: "Code 2026-09-18 실측"
  decision: |
    ▣ 실측: MinIO 를 내리고 `ops_monitor.py` 를 돌렸다.
          저장소 살아 있을 때   object_store_alive  **OK**
          저장소 **내렸을 때**   object_store_alive  **OK**   ← 눈이 감겨 있었다
    ▣ 원인: 신호가 `default_storage.exists("...존재하지_않는_이름")` 을 부르고
      **예외가 안 나면 닿은 것**으로 읽었다. 그런데 저장소가 죽어도 그 호출은
      예외 없이 **False** 를 돌려준다. 「없다」와 「못 물어봤다」를 **한 값으로 읽은 것**이다.
    ▣ ★ D-301 이 이름 붙인 바로 그 모양이고, 하필 **「살아 있는가」를 보라고 세운 신호**에서
      났다. 감시가 눈이 멀면 그것은 감시가 없는 것보다 나쁘다 — **있다는 착시**를 준다.
      그리고 이 결함은 **저장소를 세우기 전에는 드러날 수 없었다**: 없는 것을 감시하면
      무엇을 물어도 답이 같다. 세워 놓고 **일부러 내려 봐야** 보인다.
    ▣ 고침: 저장소에게 **저장소만 답할 수 있는 것**을 묻는다 — 버킷의 존재.
      닿지 못하면 그 호출은 예외를 던지고, 그 예외가 우리가 원하는 갈림이다.
      닿았는데 버킷이 없으면 그것도 ALARM 이다 — **닿았지만 담을 곳이 없다**는 다른 사실이다.
      쓰지 않는다: 감시가 데이터를 만들면 그건 감시가 아니다.
    ▣ 대조 [실측]: **OK → ALARM → OK.** 자기시험 7건 그대로 통과.
    ▣ ★ 원칙 하나를 여기 적는다: **가짜 환경에서 초록인 감시는 감시가 아니다.**
      의존이 없는 채로 「닿았는가」를 물으면 어떤 구현도 초록을 낼 수 있다.
      감시는 **의존을 세운 뒤 일부러 내려 봐야** 처음으로 시험된다.
  enforced_by: |
    · scripts/ops_monitor.py — object_store_alive 가 버킷 존재를 직접 묻는다.
      못 닿으면 ALARM(모름이 아니다) · 닿았는데 버킷이 없어도 ALARM
    · scripts/verify_minio.py — 같은 사실을 라우트 쪽에서 한 번 더 본다
    · docs/agent/evidence/P-5/minio.md §4
  affects: [D-290, D-301, D-350, D-378, D-403]

- id: D-408
  author_tree_id: "지시서 P-15 (세종 2026-09-18)"
  title: "인증 경로 대장 — **한 갈래만 재면 어느 쪽이든 그럴듯하다**"
  status: decided
  raised_by: "세종(기획) 2026-09-18 P-15 · Code 실측 이행"
  decision: |
    ▣ 물음: 「게이트는 다른 길로 들어갔다. **실제 클라이언트는 어느 길로 들어가나?**」
    ▣ 실측 — 손으로 적지 않고 **번들이 실제로 부르는 주소**를 읽었다(21개 파일):
        웹 UI       `/api/v1/auth/login` · `/api/v1/auth/refresh-token` — **`/api/token/pair` 0건**
        게이트      `/api/v1/auth/login` (`end_previous_session:true`)
        시드        HTTP 를 안 쓴다 — 서비스 함수를 직접 부른다
        모바일      화면(`LoginMobile.tsx`)이 **이미 있고** 같은 `loginAPI` 를 쓴다
        외부 U6     `X-API-Key` — 그런데 **발급 문이 도달 불가**다(D-409)
    ▣ ★★ **이 대장의 첫 판이 틀렸고, 판정기가 그것을 잡았다.**
      처음엔 「pair 토큰은 어디서도 401」이라 적었다. 돌려 보니 **200** 이었다 —
      직전에 로그인이 세션을 세워 두었기 때문이다. 한 갈래를 더 재고서야 규칙이 보였다:
          세션(`user.token`) **없음** → 401        세션 **있음** → 200
      즉 이 문은 죽은 것이 아니라 **남이 세운 세션에 기생한다.** 스스로는 못 세운다.
      **한 갈래만 재면 어느 쪽이든 그럴듯하다** — 2026-09-17 의 401 도 오늘의 200 도
      각각은 사실이었다. 규칙은 **두 갈래를 함께 재야** 나온다. 판정기가 이제 둘을 잰다.
    ▣ ★ 그리고 이 자리는 **이미 저장소에 적혀 있었다** —
      `tests/test_api_contract.py::test_token_pair_issues_tokens_that_do_not_work`(W0-18)가
      「200 으로 토큰을 준다. 그리고 그 토큰은 쓸 수 없다」를 못박고 있었다.
      그런데 **도구는 그 문으로 걸어 들어갔다.**
      **저장소가 아는 것과 도구가 아는 것은 다른 것이다.** 그래서 대장을 만든다 —
      시험은 그 시험을 부르는 사람만 보고, 대장은 **다음에 오는 사람이 먼저 본다.**
      ⚠ 그 계약 시험은 옳았다. **문장이 너무 넓었을 뿐이다** — 시험을 고치지 않는다(D-327).
    ▣ `/api/token/pair` 처분 [판정]: **㉰ 제거 후보이나 이번 턴에 빼지 않는다.**
      우리가 등록한 라우트가 아니다(dj-core · ninja_jwt) — §0.4 라 안에서 못 뺀다(D-207).
      밖에서 막는 길은 있으나(D-335/D-348), **막기 전에 저장소 안 사용처를 0 으로 만든다:**
      `tests/test_screens_browser.py::_force_logout` 하나가 남아 있다.
    ▣ `/api/v1/auth/logout` 은 `auth=` 가 없다 [실측] — 익명은 401(안전), 그러나
      **다른 라우트가 거절하는 pair 토큰을 이 문만 받는다.** dj-core 자산이라 안 고친다.
      ★ 재기 전 가설은 「`_force_logout` 은 성공이라 말하고 아무 일도 안 할 것」이었고
        **측정이 그 가설을 뒤집었다** — 세션이 실제로 지워진다(`user.token` True→False).
    ▣ 모바일 M1~M3 은 **이 대장이 확정한 문 하나**로만 로그인한다.
      로그인 화면은 **이미 있다** — 다시 만들지 않는다(D-333 ④).
  enforced_by: |
    · docs/agent/authn_paths.md — 면별 대장(정본)
    · scripts/verify_authn_paths.py — 번들이 부르는 주소를 **읽어서** 판정 ·
      제품 토큰이 실제로 들어가는지 · pair 토큰 **두 갈래**(세션 없이 401 · 있이 200) ·
      도달 불가 쓰기 면 래칫 · 출생 표본(24/26 401)
    · backend/tests/test_api_contract.py — 계약 시험(그대로 둔다)
    · docs/agent/evidence/DA-05/blockers.yaml :: TOKEN_PAIR_PARASITIC_SESSION
  affects: [D-204, D-207, D-280, D-301, D-310, D-327, D-333, D-337, D-386, D-403]

- id: D-409
  author_tree_id: "Code 자발 (P-15 를 재다가 나왔다)"
  title: "F-05·F-12 쓰기 라우트 **넷이 HTTP 로 도달 불가**였다 — 단위 시험은 전부 초록"
  status: decided
  raised_by: "Code 2026-09-18 실측"
  decision: |
    ▣ 실측 — 제품 토큰으로 직접 때렸다:
        POST /api/dsm/settings/api-keys      **405** (Allow: GET)   F-05 API Key 발급
        POST /api/dsm/settings/thresholds    **405**                F-12 임계값
        POST /api/dsm/settings/zones         **405**                F-12 구역
        POST /api/dsm/settings/grade-rules   **405**                F-12 등급규칙
      두 단짜리 형제는 멀쩡하다(403 — 문지기가 선 것이지 죽은 것이 아니다).
    ▣ 원인: 같은 컨트롤러의 `@route.get("/settings/{domain}")` 이 **먼저 선언되어**
      `settings/<한 단>` 을 통째로 먹는다. Django 는 첫 일치에서 멈추고 그 뷰는 GET 만 안다.
    ▣ ★★ **왜 여태 안 보였나 — 두 눈의 사각이 정확히 겹쳤다.**
        · 단위 시험은 **서비스 함수를 직접 부른다.** `verify_contract_ac.py` 도 절마다
          그 시험을 가리키므로 넷 다 초록이었다 — D-386 이 이름 붙인 층이다
        · `route-alive` 는 **화면이 실제로 부른 GET** 만 때린다. 이 넷은 쓰기 면이고
          화면이 아직 안 부른다
      두 도구 다 제 할 일을 했다. **아무도 안 보는 자리가 그 사이에 있었을 뿐이다.**
    ▣ ★ 계약 수에 대한 정직한 진술: 이 절들의 **로직은 구현되어 있고 시험도 있다.**
      틀린 것은 「구현되었다」가 아니라 **「외부 App 이 쓸 수 있다」**는 함의다.
      U6 는 HTTP 로만 들어오므로 **U6 에게 이 넷은 없는 것과 같다.**
      계약 수를 이번 턴에 내리지 않는다 — 절의 상태를 다시 매기는 것은 세종의 자리다.
    ▣ 고치지 않는다. 처분 셋이 **전부 경로 계약을 건드리기** 때문이다(D-280):
        ㉮ 선언 순서 교체 → GET /settings/thresholds 가 405 가 된다. **살아 있는 것을 깬다**
        ㉯ 조회 경로 이동 → 읽는 쪽 계약이 바뀐다
        ㉰ 쓰기 경로 이동 → DA-04 스펙과 대조가 필요하다
      지금 상태는 **래칫으로 잠갔다**(넷에서 늘면 빨개진다 · D-311).
  enforced_by: |
    · scripts/verify_authn_paths.py — SHADOWED_WRITE_ROUTES 래칫 · 넷을 매번 때려 센다
    · docs/agent/authn_paths.md — §3 처분 셋
    · docs/agent/evidence/DA-05/blockers.yaml :: DSM_SETTINGS_WRITE_ROUTES_SHADOWED
  affects: [D-280, D-301, D-309, D-311, D-314, D-386]

- id: D-410
  author_tree_id: "세종 지시서 2026-09-19 §1 판정 3 (Code 가 재어 올린 것을 세종이 판정)"
  title: "계약 쓰기 라우트 넷을 **고쳤다** — 그리고 세 번째 눈을 세우자 둘이 더 나왔다"
  status: decided
  raised_by: "D-409 (Code 2026-09-18 실측) → 세종 판정 2026-09-19"
  decision: |
    ▣ 재현 [실측 2026-09-19] — 제품 토큰으로: 넷 다 **405 (Allow: GET)**. D-409 그대로.
    ▣ 고침 — ㉮ 를 골랐다. **그러나 순서만으로는 반이었다.**
        `thresholds` · `zones` 는 **설정 영역 이름이면서 동시에 쓰기 경로**다.
        리터럴을 앞으로 옮기면 이번엔 그 둘의 **GET 이 405** 가 된다. 좁히는 정규식도
        같은 이유로 못 푼다 — 경로 문자열이 같기 때문이다.
        한 경로 = 한 `PathView` 이므로, **GET 과 POST 를 같은 문에 함께 세우는 것**이
        둘 다 사는 유일한 배선이다:
          ① 리터럴 쓰기 경로 넷을 `{domain}` **앞으로**
          ② 겹치는 둘에 **같은 리터럴 경로의 GET** 을 붙임 (같은 핸들러 `_setting_overview`
             · 같은 문지기 · 같은 응답)
          ③ `{domain}` 은 **맨 뒤** — 나머지 네 영역을 그대로 받는다
        라우트 계약 문서 **무변경**. 문서가 옳았고 배선이 틀렸다.
    ▣ 결과 [실측]: 넷 다 **405 → 422**(검증이 돌았다 = 도달). GET 여섯 영역 전부 그대로
      403/501. 바뀐 갈래 하나: `GET /settings/{api-keys,grade-rules}`(하이픈) 501 → **405**.
      그 둘은 애초에 영역 이름이 아니었고(영역은 밑줄), 이제 POST 전용이라 405 가 더 정확하다.
    ▣ `EVENT_ENTRY_SURFACE` 에 두 줄이 늘었으나 **진입면이 넓어진 것이 아니다** —
      같은 문이 제 이름으로 다시 걸렸다. 그 사유를 등재부에 함께 적었다.
    ▣ ★★ **세 번째 눈 신설** — `scripts/verify_contract_route_reach.py`.
      두 도구의 사각이 정확히 겹친 자리를 본다: 선언된 계약 진입면의 (method, path) 마다
      자격증명 있이 한 번씩 두드린다. **405 는 언제나 실패다.**
      · 목록은 손으로 안 적는다 — `EVENT_ENTRY_SURFACE` 를 AST 로 읽는다(두 벌은 어긋난다 · D-369)
      · 로그인·컨테이너 위임·익명 대조는 `verify_route_alive` 것을 **가져다 쓴다**(복사 금지)
      · ★ **404 를 가르는 자** [실측]: 「없는 문」과 「없는 행」은 같은 404 다. 그래서
        아무도 안 받는 메서드(PROPFIND)로 한 번 더 두드린다 — 라우트가 있으면 ninja 가 405,
        없으면 Django 가 404. 씨앗도 필요 없고 **아무것도 쓰지 않는다**
      · 씨앗은 **제품이 준다**(목록 응답에서 id 를 거둔다). ⚠ **쓰기 경로엔 실재 id 를
        쓰지 않는다** — 진짜 id 로 notify 를 두드리면 판정기가 **진짜로 발송하고**
        F-04 5분 중복 억제가 걸려 **그 다음 진짜 경보가 조용해진다**
    ▣ ★ 그 눈이 돌자마자 **아무도 안 보던 자리 둘**이 나왔다 — 둘 다 500:
        `GET /api/dsm/reports/templates`      `TemplateView` 에 **없는 칸** `renderer` 를 읽었다
        `POST /api/dsm/events/{id}/notify`    「그런 이벤트가 없다」를 **서버 결함**으로 냈다
      앞엣것은 App 이 커널 공개 면에 없는 칸을 지어내 읽은 것 — 부르는 즉시 죽었다.
      단위 시험은 서비스 함수를 부르고 **그 반환값을 이 자리에서 다시 읽지 않는다.**
      착시 ⑨(배선형)의 **두 번째 실사례**다.
      뒤엣것은 K2 에 좁은 갈래 `EventNotFound`(InvalidNotifyInput 상속)를 파서 갈랐다:
        404 없는 이벤트 · 409 수신자 0명(알림 체계가 꺼져 있다) · 400 그 밖
      셋을 뭉치면 U6 은 **자기 잘못인지 우리 잘못인지** 모르고, 우리 감시는 남의 오타를
      우리 장애로 센다.
    ▣ 되올림: 계약 진입면 **20건 전부 도달 · 못 닿음 0 · 못 잼 0** [실측].
      래칫 기준선 **4 → 0** (D-311) — 갚은 빚은 기준선에서 내린다. 안 내리면 그 자리가
      다시 썩어도 초록이 난다. 감시 목록은 지우지 않는다: **다시 405 가 되는 순간을
      보는 것**이 그 자리의 일이다(대상 0 과 게이트 부재는 다르다 · D-301).
  enforced_by: |
    · scripts/verify_contract_route_reach.py — 계약 진입면 전수 도달 (신설 게이트)
    · scripts/verify_authn_paths.py — UNREACHABLE_BASELINE = 0 래칫
    · backend/tests/test_f05_event_api.py — EVENT_ENTRY_SURFACE (등재부 · 두 줄 사유 포함)
    · backend/apps/dsm/api.py — 리터럴 경로가 `{domain}` 보다 **먼저** 등록된다(순서가 판정이다)
    · backend/tests/test_clip_playback.py — `backend/apps/dsm/api.py` 의 「F-12 관리자 설정」
      표지가 영상 구간의 끝을 가른다. 표지를 지우면 그 시험이 멈춘다 [실측 2026-09-19]
    · docs/agent/authn_paths.md §3
    · docs/agent/evidence/D-410/route_reach.json
  affects: [D-207, D-269, D-280, D-284, D-290, D-300, D-301, D-309, D-310, D-311,
            D-314, D-327, D-369, D-386, D-397, D-409]

- id: D-411
  author_tree_id: "세종 지시서 2026-09-19 §1 판정 2 (승인)"
  title: "`/api/token/pair` 를 **뺐다** — 쓸모없는 토큰을 내주는 문은 공격 면이다"
  status: decided
  raised_by: "D-408 (Code 2026-09-18 두 갈래 실측) → 세종 승인 2026-09-19"
  decision: |
    ▣ 사유 [실측] — 셋이 함께 성립한다:
        · 실제 클라이언트 **0건** (빌드 번들 21파일 정독)
        · 발급한 JWT 를 dj-core `core/auth.py:38` 이 `user.token` 없다고 거절
        · 세션 없으면 401 · 남이 세워 두면 200 — **죽은 문이 아니라 기생하는 문**
      아이디·비밀번호를 아는 쪽이 남의 세션 위에서 **동시 접속 1개 규약을 우회한 토큰**을
      더 찍어 낼 수 있었다. 쓸모없는 토큰을 내주는 문은 기능이 아니라 **공격 면**이다.
    ▣ 어떻게 — **dj-core 는 한 줄도 안 고쳤다**(D-207 · §0.4). 라우트는 `core.urls` 안에
      그대로 살아 있고, `config/urls.py` 에서 `include("core.urls")` **앞에** 같은 경로를
      놓아 404 를 낸다. Django 는 먼저 등록된 패턴에서 멈춘다.
      ⚠ **순서가 곧 판정이다** — 저 줄이 한 칸만 내려가면 문은 **소리 없이 다시 열린다.**
    ▣ **404 다. 401 이 아니다** — 401 이면 연동 담당자가 「자격증명이 모자란다」로 읽고
      계정을 고치려 든다. 없는 것은 없다고 말한다(D-290).
    ▣ 함께 옮긴 것: 저장소 안 유일한 사용처 `test_screens_browser.py::_release_session`
      → `/api/v1/auth/login`(`end_previous_session:true`). **없어도 되는 우회였다** —
      로그인 자신이 앞선 세션을 닫는다.
    ▣ ★ **Code 오판 1건 — 뺐다가 되돌렸다.** 처음엔 `common/tenant_scope.py::PUBLIC_ROUTES`
      에서 그 줄을 뺐다(「없어진 문의 면제를 남기지 않는다」). **시험이 그것을 잡았다**:
      미분류 라우트가 **648 → 649** 로 늘었다(`test_route_tenant_scope`).
      라우트는 URLconf 에서 **사라지지 않았다** — `core.urls` 안에 그대로 있고 우리는
      앞에 404 문을 세워 가리고 있을 뿐이다. 등재를 지우면 그 자리는 「인증 불요로
      판정이 끝난 것」에서 **「아직 아무도 안 본 것」**이 된다.
      **빚을 갚은 것이 아니라 빚을 안 보이게 한 것**이었다. 사유를 바꿔 되돌렸다:
      「제거된 문 — 404 만 낸다. 아무것도 내주지 않으므로 인증이 필요 없다」.
      거기 남는 것은 **면제가 아니라 판정**이다.
    ▣ 건드리지 않은 것: `token/refresh` · `token/verify`. 이번에 잰 것은 `pair` 하나이고,
      재지 않은 것을 함께 닫으면 그 순간 이 결정이 **추측**이 된다(D-301).
    ▣ ★ W0-18 계약 시험을 **부작위 시험**으로 바꿨다(404 기대 · D-300).
      **시험을 고쳐 초록을 만든 것이 아니다** — 앞판의 단언은 그날의 사실이었고 옳았다.
      바뀐 것은 시험이 아니라 **계약**이고, 그 변경은 세종 승인으로 이 대장에 남는다(D-327).
  enforced_by: |
    · backend/config/urls.py — 차단 줄(순서 · 사유 주석)
    · backend/tests/test_api_contract.py::test_token_pair_is_gone — 404 부작위
    · scripts/verify_authn_paths.py — 익명 POST → 404 기대
    · docs/agent/authn_paths.md §2
  affects: [D-004, D-103, D-204, D-207, D-290, D-300, D-301, D-327, D-337, D-408]

- id: D-412
  author_tree_id: "세종 지시서 2026-09-19 §1 판정 1"
  title: "MinIO 가용성은 **사진이 아니라 맥박**이다 — 그리고 캐시가 그 사진을 액자에 넣고 있었다"
  status: decided
  raised_by: "세종 판정 1 (D-406 의 「세우고 나서 더 조용해졌다」 후속)"
  decision: |
    ▣ 뿌리가 **둘**이었다. 하나만 고쳤으면 여전히 조용했을 것이다.
    ▣ 뿌리 ① `minio_client.available` 이 `__init__` 에서 한 번만 정해졌다 — **기동 시점의 사진.**
      고침: TTL 캐시(기본 5초 · `MINIO_AVAILABILITY_TTL`)로 갱신하는 **속성**으로 바꾸고,
      요청이 실패하면 **즉시 False 로 강등**해 다음 읽기에서 곧바로 재확인한다.
      기동 때 못 세웠어도 **다시 세워 본다** — 저장소는 나중에 뜬다.
      ⚠ `S3Error` 로는 강등하지 않는다: 그것은 **서버가 대답한 것**이다(없는 객체·권한 거절).
        대답한 서버를 죽었다고 적으면 파일 하나 없을 때마다 저장소가 죽었다 살았다 하고,
        그렇게 흔들리는 신호는 아무도 안 본다. 죽음의 증거는 **대답이 없는 것**이다.
    ▣ 뿌리 ② ★ **응답 캐시가 저장소 장애를 덮고 있었다** [실측 2026-09-19].
      MinIO 를 내린 채 같은 순간에 두 번 물었더니:
          GET /api/media-data/         **200 · success:true**  (0.01s · 캐시)
          GET /api/media-data/?bust=…  **500 · success:false** (6.68s · 실제)
      `UniversalCacheMiddleware` 는 적중한 본문을 **언제나 JsonResponse(200)** 으로 다시
      만든다. 그래서 살아 있을 때 담긴 200 이, 죽은 뒤에도 「목록을 가져왔다」고 말한다.
      고침: `BYPASS_PATTERNS` 에 `media-data` 를 넣었다 — 그 파일이 이미 세워 둔
      surveillance-dashboard 와 **같은 사유**다: 바깥에서 바뀌는 것은 무효화 신호가 없다.
      목록의 진실은 우리 DB 가 아니라 **저장소가 살아 있는가**에 달려 있다.
    ▣ 뿌리 ③ (곁가지) 죽은 저장소 탐침이 **6.6초** 였다 — 데이터용 풀(connect 3s · retry 1)로
      재고 있었다. 맥박 전용 접속(connect 1s · read 1s · retries 없음)을 따로 뒀다 → **3.3초**.
      맥박은 건강검진이지 데이터 왕복이 아니다.
    ▣ 강제 도구 [실측 2026-09-19 · HTTP 경로]:
        살아 있음        200 · success:true · **25~30ms** (매 요청 왕복 없음 — TTL 이 지킨다)
        내림 → 감지      **약 5초** 안에 500 · success:false
        올림 → 회복      **약 6초** 안에 200 · success:true
        죽은 동안 비용   5초에 한 번 3.3초 (나머지는 캐시된 False · 0ms)
      프로세스 안 대조: t+4s True(0.00s) → t+9.3s **False(3.31s)** → t+24.6s True(0.00s).
    ▣ 감시(`object_store_alive`)는 **그대로 둔다**(판정 1 ㉰) — 감시와 요청 경로가
      서로 다른 눈이어야 한다. 한 눈이 멀 때 둘 다 멀면 안 된다.
  enforced_by: |
    · backend/stream_monitors/utils/minio_client.py — available 속성 · _probe · _note_failure
    · backend/common/universal_optimization.py — BYPASS_PATTERNS 에 media-data
    · scripts/verify_minio.py · scripts/ops_monitor.py (object_store_alive)
  affects: [D-209, D-290, D-301, D-341, D-347, D-397, D-406, D-407]

- id: D-413
  author_tree_id: "세종 지시서 2026-09-20 §3 A3 (P-19)"
  title: "상태·가용성을 말하는 응답은 캐시를 지나지 않는다 — 그리고 **쉼표 하나가 패턴 하나를 삼키고 있었다**"
  status: decided
  raised_by: "세종 P-19 (D-412 뿌리 ②의 일반화)"
  decision: |
    ▣ 규칙 — **상태를 묻는 질문에 과거의 답을 주면, 그 답은 틀린 것이 아니라 질문에
      답한 것이 아니다.** `UniversalCacheMiddleware` 는 적중 본문을 언제나
      `JsonResponse(200)` 으로 되살린다. 그러므로 바깥에서 바뀌는 것(저장소·연계·경보)을
      말하는 라우트는 **캐시 밖**이어야 한다. D-412 가 `media-data` 하나에 대해 한 일을
      규칙으로 올린다.
    ▣ ★★ **실측 중 뿌리 하나를 더 찾았다 — 목록에 적혀 있는데 존재하지 않는 패턴.**
      `BYPASS_PATTERNS` 안에서 쉼표가 하나 빠져 있었다:
          'video-analysis','media-data'      ← 뒤에 쉼표 없음
          # ============ TASK STATUS ============
          'task-status', ...
      파이썬이 두 리터럴을 **암묵 이어붙이기**로 `'media-datatask-status'` 로 만들었다.
      아무 경로에도 안 맞는다. `'task-status'` 는 **사람이 목록을 읽으면 있고 정규식이
      읽으면 없었다** — `/api/task-status/...` 는 그동안 조용히 캐시되고 있었다.
      ⚠ 이 모양은 **눈으로 못 잡는다.** 리뷰도 grep 도 목록에서 그 낱말을 찾아낸다.
        갈리는 자리는 하나뿐이다: **AST 는 원소 하나, 토크나이저는 STRING 둘.**
    ▣ 고침 셋:
      ① 쉼표를 넣어 `'task-status'` 를 되살렸다 (캐시 안 38 → **37**).
      ② 상태·가용성 자리를 우회 목록에 명시 등재: `dsm/`(재난 감시 도메인 전수) ·
         `link-state`(연계 상태). **지금 캐시를 안 타는 것은 우연이지 규칙이 아니다** —
         `PATH_HINT_REGISTRY` 에 이름 하나가 늘면 그날부터 캐시된다. 규칙으로 적는다.
      ③ 판정기 신설 `scripts/verify_cache_frame.py` — 셋을 본다:
           ⓐ `STATE_SURFACES` 7자리가 전부 캐시 밖인가 (**이름으로** 못 박는다)
           ⓑ 이어 붙은 리터럴 0건인가 (토큰 수 vs AST 원소 수)
           ⓒ [입력] 캐시 등록부 69 · 우회 패턴 72 · 상태 자리 7 — 모수를 함께 낸다
         출생 표본은 그 쉼표 자리 그대로다. 호스트에서 돈다(Django 불요).
    ▣ 게이트 `minio` 에 **상시 항목 ④** 를 붙였다: 같은 순간 `/api/media-data/` 와
      `?bust=` 를 견주고 **답이 다르면 실패**. 「지금 받는다」와 「받았던 적이 있다」를
      가르는 자다. 통과 줄에 「캐시 안팎이 같다」가 함께 나온다.
    ▣ 안 한 것: 캐시 자체를 끄지 않았다. 성능 설정이 아니라 **어느 질문에 캐시가
      끼면 안 되는가**의 문제이고, 그 목록은 이름으로 관리한다.
  enforced_by: |
    · scripts/verify_cache_frame.py — 판정 ⓐⓑⓒ · --self-test (출생 표본 = 그 쉼표)
    · .pre-commit-config.yaml :: gx-cache-frame — universal_optimization/cache_hint_registry 가
      바뀌면 반드시 돈다
    · scripts/verify_minio.py — 상시 항목 ④ 캐시 안/밖 두 URL 대조
    · backend/common/universal_optimization.py — BYPASS_PATTERNS (dsm/ · link-state · task-status)
  affects: [D-290, D-301, D-310, D-311, D-341, D-350, D-412]

- id: D-414
  author_tree_id: "세종 지시서 2026-09-18 §1 판정 (P-16) · 09-20 §3 차선 B"
  title: "오탐 결합은 **붙였다 — 그러나 코드에서는 맞물리지 않게** (소비자 한 곳)"
  status: decided
  raised_by: "세종 판정 P-16 (D-405 「결합 규칙은 없다」 정정 보고의 후속)"
  decision: |
    ▣ 사용자에게는 한 가지 일이다 — U1 이 「오탐」을 누르고 나서 「종결」을 또 눌러야 하면
      **두 종류의 종결**이 화면에 보인다(P-1 이 막으려던 모양). 그래서 붙인다.
    ▣ 코드에서는 맞물리지 않는다 — D-399 가 가른 두 축이 다시 묶이면 다음 사람이
      판정을 고치려다 대응을 깨뜨린다. 배선은 셋이다:
        · `review_event` 는 `response_state` 를 **모른다** — 신호만 보낸다
          (`kernels/k1_event/verdict_events.py::verdict_changed`)
        · `close_as_false_positive` 는 `verdict` 를 **모른다** — 대응 축만 만진다
          (`response_flow.py` — 그 축을 쥔 **그 파일 안**이다. 대입 자리는 여전히 둘)
        · 둘을 아는 코드는 **한 파일**뿐이다:
          `stream_monitors/services/false_positive_closer.py` (K1_CONSUMERS 등재)
      ★ 그 「한 곳」을 **시험이 지킨다**: 소비자를 떼면 결합이 사라져야 한다
        (`CouplingLivesInOnePlaceTest`). ①만 재면 「어디서 닫히든」 초록이고,
        그러면 `review_event` 안에 한 줄이 들어가도 시험은 조용하다.
    ▣ **역방향 없음.** `rejected → confirmed` 재판정에도 대응 축은 `closed` 그대로다.
      다시 여는 것은 사람이 한다(U2 · `closed → in_progress` · 사유 필수 · 감사).
    ▣ 행위자는 `system:false_positive` — 사람이 한 것은 **판정**이고 종결은 규칙이 했다.
      다만 **문지기는 판정자의 스코프로 지난다.** 행위자가 시스템이라고 테넌트가
      없어지면 「시스템이 하는 일에는 테넌트가 없다」가 되고 그것이 격리의 부재다(D-281).
      누가 눌렀는지는 감사 본문(`reviewed_by`)에 남는다 — 한 칸에 둘을 넣으면 하나가 지워진다.
    ▣ `advance_response` 로 흉내 내지 않았다 — 세 번의 가짜 전이는 감사가
      「누가 접수했다」고 거짓말하게 만든다. 오탐은 계단을 오르는 일이 아니라
      **계단 자체가 없어지는 일**이다. 그래서 직행 함수를 따로 두되 같은 파일에 둔다.
    ▣ 오탐 ② **판정 라우트를 열었다** — `POST /api/dsm/events/{id}/review`.
      서비스는 2026-08 부터 있었고 **문이 없었다**(착시 ⑨ 세 번째 실사례).
      거절을 4xx 로 나눈다: 404(없는 것·남의 것) · 422(판정값이 아니다) · 403(요청자 없음).
      P-8 대로 **등록부를 먼저** 고쳐 빨감을 보고(3건) 구현했다.
    ▣ 오탐 ③ 종결 통지 — **1회**. ★ `DeliveryRecord` 행을 만들지 않는다:
      그 표는 F-10 의 30초를 재는 두 점이고 5분 억제가 세는 표다. 통지 행을 끼우면
      지연 통계가 경보 아닌 것을 세고, **억제가 다음 진짜 경보를 삼킨다.**
      통지는 발송이 아니라 뒷정리다 — 감사 한 줄로 남긴다(세종이 말한 「로그 어댑터」).
      1회는 그 감사 행의 존재로 지킨다.
    ▣ 오탐 ④ 오탐률 — **이미 있었다.** `false_positive_rate` 가 기간·카메라(stream_monitor_id)·
      시나리오(event_type)를 다 받는다 [실측: 지난 12시간 0.333 · 기각 4 / 판정 12].
      **다만 부르는 화면이 0곳**이다. 읽는 자리는 C 차선(W1 요약)이라 여기서 열지 않았다 —
      읽는 사람 없는 라우트를 미리 열면 그것이 다음 턴의 잠자는 기능이다.
    ▣ ★ 시드 재점검 — `rejected` 4건에서 **대응 축을 직접 닫던 호출을 뺐다.**
      직전까지 시드가 규칙을 흉내 내고 있었고, 그래서 규칙이 없어도 결과가 같았다.
      [실측] 대응 전이 36회 → **24회** · 자동 종결 **4건** · 분포는 그대로
      (closed 8 · rejected 4). **수는 같은데 원인이 다르다** — 시드가 그 차이를 직접
      확인하고, 안 닫혀 있으면 `CommandError` 로 멈춘다.
    ▣ 함께 고친 시험 둘 — **초록을 만들려고 고친 것이 아니다**(D-327):
      · `AxesStayApartTest` 의 판정값을 `rejected` → `confirmed` 로. 결합이 붙은 뒤로
        그 시험이 재려던 「사람이 네 칸을 걸어간다」가 애초에 일어나지 않는다.
      · `test_write_positive_control` 이 probe 를 **자리(index)가 아니라 뜻으로** 고르게.
        그 파일이 스스로 적어 둔 규칙인데 안 지키고 있었고, probe 하나가 늘자 `[2]` 가
        다른 함수를 가리켰다. 순서도 뜻을 갖는다 — 대응 양성 대조는 판정보다 먼저.
  enforced_by: |
    · backend/tests/test_false_positive_coupling.py — 13건 (①~⑥ · 결합의 자리 포함)
    · backend/tests/test_tenant_isolation.py :: WRITE_PROBES(close_as_false_positive)
    · backend/tests/test_f05_event_api.py :: EVENT_ENTRY_SURFACE(POST …/review) · K1_CONSUMERS
    · backend/stream_monitors/management/commands/seed_dsm_events.py — 자동 종결 대조(CommandError)
    · scripts/verify_contract_route_reach.py — 판정 라우트 도달 21/21
  affects: [D-212, D-281, D-290, D-293, D-300, D-311, D-327, D-333, D-347, D-377, D-399, D-405]

- id: D-415
  author_tree_id: "세종 지시서 2026-09-20 §3 차선 E (평상 운영 ①④)"
  title: "죽은 카메라를 재기 전에 **감시가 있는지부터 쟀다 — 없었다**"
  status: decided
  raised_by: "세종 차선 E ①(죽은 카메라 · **StreamMonitor 감시 유무 먼저**) ④(저장 용량)"
  decision: |
    ▣ ① **먼저 잰 것: 감시가 있는가. 답은 없다.**
      `StreamMonitor` 의 칸 전수를 읽었다 — 「마지막으로 살아 있던 시각」이 **없다.**
      `is_active` 는 운영자가 켜고 끄는 **스위치**이지 맥박이 아니다. 스위치가 켜진 채
      죽은 카메라와 살아 있는 카메라가 그 칸에서 같다.
      → 잠금 등재 `DA-05 :: CAMERA_LIVENESS_HEARTBEAT` (DEV · 해소 절차 4단계).
      **등재하지 않으면 다음 사람은 신호를 보고 감시가 있다고 믿는다.**
    ▣ 그래서 지금 낼 수 있는 것은 **간접 증거**이고, 그 사실을 신호 이름과 사유에 적었다.
      ★★ 그리고 **한 번도 안 울린 카메라와 울리다 멈춘 카메라를 갈랐다.**
        [실측 2026-09-20] 개발 DB: 등록 40 · 켜짐 39 · **한 번도 이벤트 없던 것 39**
        (배송 도메인 `drone_*`) · 전에 울렸는데 24시간 조용한 것 **0**.
        가르지 않았으면 경보가 **첫날부터 39** 로 시작했을 것이고, 그 경보는 아무도 안 본다
        (`ops_monitor` 머리말: 「더 보면 아무도 안 본다」). 39는 경보가 아니라 **세는 수**다.
      경보의 뜻도 좁혔다 — 「죽었다」가 아니라 **「가서 봐라」**. 못 가르는 것을 가른다고
      적으면 그것이 D-301 이다.
    ▣ ④ **저장 용량 — 분모 없이 「몇 % 찼나」에 답하지 않는다.**
      사용량(버킷 객체 합계)은 잰다. 상한은 **환경이 선언한다**(`GX_STORAGE_CAPACITY_GB`).
      선언이 없으면 `storage_used_pct` 는 **UNKNOWN** 이다 — 코드가 분모를 지어내면
      그 추측이 곧 초록이 된다.
      임계 **80% [추정]** — 근거는 저장소에 없다. 영상 보존기간·카메라 수가 정해지면
      다시 잡는다. 80 을 고른 이유는 **남은 20% 가 사람이 움직일 시간**(주말 하나)이라서다.
    ▣ 자기시험 4갈래를 더했다(11건) — 조용한 카메라 1대는 경보 · 0대는 정상 ·
      용량 상한 없으면 판정 불가 · 80.1% 는 경보. **양성과 음성을 함께 둔다.**
    ▣ 안 한 것(차선 E 잔여): ② 순회 · HWPX 일일 1종 · **P-11 onboarding_48.md**.
      P-11 의 48행 정본은 09-17 지시서 PDF 안에 있고 이 턴에 텍스트로 꺼내지 못했다 —
      **없는 것을 지어내지 않는다.** 온보딩 %는 이번 보고에도 「미측정」이다.
  enforced_by: |
    · scripts/ops_monitor.py — cameras_silent_24h · cameras_never_seen · storage_used_gb/pct
      + --self-test 11건 (양성·음성)
    · docs/agent/evidence/DA-05/blockers.yaml :: CAMERA_LIVENESS_HEARTBEAT —
      scripts/verify_blockers.py 가 유형·주인·해소 절차 없는 잠금을 exit 1 로 막는다
    · docs/agent/evidence/D-373/monitor_last.json — 실측 산출물
  affects: [D-280, D-290, D-301, D-307, D-338, D-354, D-373, D-412]

- id: D-416
  author_tree_id: "세종 지시서 2026-09-21 §2 (P-18 정정 · Code 제안 수용) · §3 (분류 판정)"
  title: "차선을 막던 것은 자원이 아니라 **이름 하나**였다 — 그리고 100%를 **두 수**로 갈랐다"
  status: decided
  raised_by: "Code 정정 제안 2026-09-20 → 세종 판정 2026-09-21"
  decision: |
    ▣ **P-18 정정 — 컨테이너 복제 없음. 이름 넷만 가른다.**
      시험 DB(`DB_TEST_NAME`) · 포트(8x00) · 버킷 접두(`<x>_`) · 시드 테넌트(`tenant_<x>`).
      코드가 강제할 수 있는 것은 첫째뿐이고, 그것이 유일한 진짜 벽이었다 —
      Django 는 시험 DB 이름을 `test_` + DB 이름으로 **정해서** 만들기 때문이다.
      고친 것은 `settings.py` 한 줄 + `.env.example` 한 줄이다.
    ▣ ★ **출생 표본을 두 갈래로 쟀다** [실측 2026-09-21]:
        (가) 이름을 가르면  test_gx_c ‖ test_gx_d → 13 passed ‖ 11 passed · **충돌 0**
        (나) 이름이 같으면  test_gx_same ‖ test_gx_same → **DuplicateDatabase + ObjectInUse**
      (나)가 도구의 이유다. 그 빨강은 **코드 결함처럼 보이지만 환경 충돌**이고,
      2026-09-10 에 실제로 그렇게 오독할 뻔했다.
    ▣ 기본값을 비워 둔 것이 이 정정의 조건이다 — **안 주면 지금까지와 똑같이 돈다.**
      차선을 안 쓰는 사람의 명령이 바뀌면 그것은 정정이 아니라 이사다.
    ▣ **§3 분류 — 분류하지 않은 것은 분모에서 뺄 수 없다.**
      「잠김 12 · 미측정 7」을 셋으로 갈랐다 [실측 분류 19건]:
        · 설계 잠금 **1** (계약 11조 CLIP_EXTRACTION) — **하지 않기로 한 것**이라
          분모에서 뺀다. 「못 했다」로 세면 영원히 안 채워지는 칸이 생긴다.
        · 손 밖 **11** (SDN 6 · 안양 검수 1 · rj-core 화면 1 · 운영 포트 1 · GPU 1 · 대표 승인 1)
        · 손 안 **7** (봉투 승격 · 설치 재현 · 마이그 한 줄 · 로그 보존 · 되돌리기 · 커버리지 · 저장소 장애 화면)
      → **두 수**: 상용 가중 **59.9%** (분모 105) · **손 안 도달율 72.0%** (67/93).
      손 안에 남은 26절(미착수 19 + 손 안 7)이 **우리가 닫을 수 있는 100%까지의 거리**다.
      ★ 도구가 `hand`·`hand_why` 없는 잠김·미측정을 **exit 1 로 막는다** — 사유 없는
        「손 밖」은 선언이 아니라 면제이고, 면제는 조용히 자란다.
      ★ QA-07(커버리지)은 손 안인데 **이번 턴에 못 쟀다** — `pytest-cov` 미설치, 설치에
        외부 네트워크 필요. 「손 밖」으로 옮기지 않았다. 막는 것이 설치 한 번이면 손 안이다.
    ▣ ★ **그 셋 중 첫째를 이 턴에 닫았다 (C 차선 선행)** — 목록이 `response_state` 를
      싣고 서버가 그것으로 거른다. `EVENT_RESPONSE_KEYS` 에 한 줄을 손으로 더했다
      (모양은 계약이므로 선언이다). ⚠ 넓힌 것은 **읽기 면**이다 — 그 값을 쓰는 문은
      여전히 `/events/{id}/response` 하나뿐이다.
      [실측 HTTP 2026-09-21] `GET /api/dsm/events` 한 줄의 키 13개(+response_state) ·
      `?response_state=occurred` **4건** · `closed` **8건** (시드 분포와 일치).
      화면이 페이지를 받아 스스로 거르면 **페이지 밖 이벤트는 없는 것이 된다** —
      DA-04 「필터는 전부 서버에서」.
    ▣ **P-11 온보딩 48행 실측 — 첫 수 47%** (22.5/48). 세종 판정 44%(21.0)와의
      어긋난 행 **3건**이고 **전부 위로**이며 **전부 09-20 커밋(2f2a47f) 때문**이다
      (죽은 카메라 · 장애 판단 · 저장 용량 신호). 세종의 44%는 09-17 시점에 옳았다 —
      어긋남은 판단의 차이가 아니라 **사흘 사이에 실제로 생긴 것**이다.
      경로가 없는데 ●인 행은 **0건**이었다(착시 ⑨로 내릴 행 없음).
      ★ 표를 채우며 드러난 것 셋: ① **목록 응답에 `response_state` 가 없다**
        (U2 「미처리 이벤트 확인」을 서버가 못 걸러 준다 — W1 프리셋의 첫 일)
        ② 개발 DB **알림 규칙 0건 · 스냅샷 0건** (화면이 생겨도 채울 것이 없다)
        ③ 죽은 카메라·장애·용량 신호가 **전부 `ops_monitor` 안에만** 있다(관리자 화면 0).
  enforced_by: |
    · scripts/verify_lane_isolation.py — 시험 DB 이름이 환경에서 오는가 · .env.example ·
      기본값 비움. 자기시험 3갈래 + 출생 표본
    · scripts/verify_ga_readiness.py — 잠김·미측정에 hand·hand_why 가 없으면 exit 1 ·
      손 안 도달율 산출 · 자기시험 14건
    · docs/agent/evidence/D-416/lane_isolation.md — 두 갈래 실측
    · docs/agent/onboarding_48.md — 48행 경로·실측 상태·어긋난 행 3
    · backend/tests/test_false_positive_coupling.py::EventListCarriesTheResponseAxisTest —
      목록이 대응 축을 싣는가 · 서버가 거르는가 · 오탐 하나로 미처리에서 빠지는가
  affects: [D-204, D-227, D-301, D-310, D-338, D-345, D-346, D-349, D-415]

- id: D-417
  author_tree_id: "세종 지시서 2026-09-22 §4-1(쓰기 면 선등록) · 차선 E2 가 잡은 것"
  title: "쓰기 대장이 **자기가 안 보는 곳**을 초록으로 통과시키고 있었다 — 판별기를 한 단계 넓혔다"
  status: decided
  raised_by: "차선 E2 보고 2026-09-22 → 조율자 실측·정정"
  decision: |
    ▣ 선등록 먼저 (지시 §4-1 이행) — 차선이 이번 턴에 열 **쓰기 면 8건**을 착수 **전에**
      `WRITE_NO_PROBE` 에 적었다: 인계 메모 · 전파 기록 · M3 회신 · 재알림 · 시드 알림 규칙 ·
      순회 설정 · 관리 UI · 경보 발송처.
      ★ 왜 미리 적나 — P-8 은 「탐침 없는 쓰기 면 금지」다. 면을 열고 **나서** 대장을 늘리면
        면이 먼저 서고 잣대가 뒤따르는 순서가 되고, **그 사이가 열린 자리**다.
        미리 적어 두면 면을 여는 커밋이 이 줄을 지우고 probe 를 넣어야 한다.

    ▣ ★★ 그리고 대장이 **K2 를 아예 안 보고 있었다** [실측 2026-09-22 · 차선 E2 가 지적]
      `test_write_probe_registry_covers_kernel_writes` 가 훑는 패키지가 둘뿐이었다
      (`kernels.k1_event` · `stream_monitors.services.zones`). K2 는 그 밖이었고,
      그 안에서 `save_notification_rule` 이 이번 턴에 새로 열렸다.
      → 훑는 곳에 `kernels.k2_notify` 를 더했다. **보는 곳만 세고 「미등재 0건」이라
        말하는 것**이 D-301 의 이 파일 판이다.

    ▣ ★★★ 더 나쁜 것이 그 뒤에 있었다 — **판별기가 `send` 를 「읽기」로 보고 있었다**
      `_writes_to_db` 는 공개 함수의 **자기 소스**에서 `.create(`·`.save(` 같은 표식을 찾는다.
      그런데 `kernels.k2_notify.send` 는 행을 만들지 않고 사설 헬퍼 `_send_one` 에게 시킨다 —
      표식은 그 안에 있다. 그래서 발송은 **쓰기 면으로 세어지지 않았다.**
          같은 날 시드가 `send` 하나로 **발송 이력 120행**을 만들었다 [실측].
      → 판별기가 **자기 모듈의 사설 헬퍼 한 단계**까지 따라가게 고쳤다. 고치자마자
        훑은 쓰기 면이 8 → **9**로 늘고 `kernels.k2_notify.send` 가 **미등재로 빨개졌다.**
      ★ 왜 한 단계만인가 — 끝까지 따라가면 결국 ORM 이 나오므로 **모든 함수가 쓰기**가 된다.
        한 단계는 「공개 면이 자기 모듈 헬퍼에게 시킨다」는 실제 모양을 덮으면서 판정을 뜻 있게
        남긴다. 두 단계가 필요한 사례를 **보고 나서** 늘린다.

    ▣ 그래서 무엇을 했나
      · `K2.send → 남의 이벤트를 내 스코프로 발송시키기` probe 를 대장에 넣었다(7번째).
        **그리고 그 probe 는 통과한다** — `send` 는 `assert_scoped` 로 이미 막고 있었다.
        ★ 즉 **구멍은 제품이 아니라 대장의 눈에 있었다.** 그 구별을 흐리지 않는다:
          제품이 새고 있었다고 적으면 사실이 아니고, 아무 일 없었다고 적으면 눈이 먼 채로 둔다.
      · `save_notification_rule` 은 사유를 **바꿔** 남겼다(지우지 않았다) — 면이 열렸고
        음성·양성 시나리오는 `tests/test_e_p20_seed.py` 가 잰다. 이 파일로 옮기려면
        러너에 `victim_kind="rule"` 갈래가 먼저 필요하다.
    ▣ [실측] 격리 시험 **28 passed · exit 0** (`DB_TEST_NAME=test_gx_z` · 쓰기 면 9 · probe 7 · 사유 등재 9).
  enforced_by: |
    · backend/tests/test_tenant_isolation.py :: WRITE_PROBES · WRITE_NO_PROBE ·
      test_write_probe_registry_covers_kernel_writes (훑는 패키지 3 · 위임 한 단계)
  affects: [D-285, D-290, D-301, D-366]

- id: D-418
  author_tree_id: "세종 지시서 2026-09-22 §2 C행 · 제3부 §3 1파"
  title: "차선 C — 프리셋 넷이 **서버 질의**로 섰다 · 온보딩 47 → 53% · 그리고 **판정기 둘이 눈이 멀어 있었다**"
  status: decided
  raised_by: "차선 C 보고 2026-09-23 → 조율자 병합·검증"
  decision: |
    ▣ 지은 것 [실측 2026-09-23 · 브라우저가 부른 URL 이 증거다(`screen_routes.json`)]
      · W1 프리셋 **4종이 전부 서버 필터**다:
            ?response_state=occurred · ?since=…&until=… · ?mine=true
            ?event_type=camera_down,storage_high
        화면에 `rows.filter(...)` 가 **한 줄도 없다** — 페이지 밖 이벤트가 없는 것이 되지 않는다.
        프리셋은 `?preset=` 으로 **주소에 산다**: 검수자가 그 주소로 바로 들어온다.
      · 요약 한 줄 — `GET /api/dsm/events/summary?hours=12` 신설. K6 `false_positive_rate` 를
        **부르는 첫 화면**이다(D-414 가 「부르는 화면이 0곳」이라 적어 둔 자리).
        ★ 분모 0이면 `null` 이고 화면은 「잴 수 없음」이라 적는다 — **0% 로 적지 않는다**(D-290 3값).
      · W2 상세 — 오탐 버튼·대응 진행. 전이 버튼은 **서버가 준 `allowed_next` 만** 그린다
        (화면이 전이표를 들면 두 벌이 되고, 두 벌은 반드시 갈린다).
      · 화면 **16 → 21장** · 브라우저 오류 0건.
    ▣ 온보딩 **47% → 53%** (22.5 → 25.5/48) — U2 가 44% → 75%.
      ★ 새로 만든 것은 화면 넷과 라우트 하나이고, 나머지는 **이미 있던 서버 필터에 누를 자리를
        붙인 것**이다 (D-379 의 반복 — 없던 것은 코드가 아니라 배선이었다).
      ★ 올리지 않은 행 둘을 함께 적는다(차선 C 판단 · 조율자 수용): 「내 담당」은 팀장이 보는
        요원별 집계가 아니고, 요약 라우트가 `hours=168` 을 받는 것은 화면이 있다는 뜻이 아니다
        — **라우트가 받는다 ≠ 화면이 있다**(착시 ⑨).

    ▣ ★★ 그리고 **판정기 둘이 눈이 멀어 있었다** — 화면을 늘리자 드러났다
      ① `verify_screens.py` 가 **컨테이너에서 역추적만 뱉고 죽었다**(`ModuleNotFoundError: yaml`).
         차선 C 는 그것을 「검증기만 판정 불가」로 읽었고, **그 사이 호스트에서는 진짜 빨강**이
         나 있었다(파일 이름 규약). 못 잰 것은 **못 잰다고 말하게** 고쳤다 — exit 2 + 사유 한 줄.
         ★ 「죽었다」와 「빨갛다」가 같은 화면으로 보이면, 빨강은 죽음 뒤에 숨는다.
      ② 그 빨강 자체 — 규약이 `<scenario>/<role>/<route>.png` 로 **라우트를 그대로** 파일명에
         넣게 돼 있었다. 두 자리에서 깨진다: ⓐ `?` 가 윈도우 마운트에서 **저장을 죽인다**
         ⓑ 한 라우트로 두 장을 찍으면 **뒤엣것이 앞엣것을 덮는데 인덱스에는 두 줄이 남는다**.
         → 규약을 **「뿌리로 시작한다」**로 늦추되 **끈은 남겼다**: 파일 이름의 뿌리는 여전히
           라우트에서 나오고(질의 제외 · 숫자 id 는 `id` 로 눕힘), 꼬리표만 허용한다.
           자기시험에 **그 세 자리를 출생 표본으로 박았다**(12갈래 · D-310).
      ③ 기록 쪽도 같은 모양이었다 — `capture_screens` 가 라우트를 키로 써서 한 라우트의
         두 번째 화면이 첫 번째의 API 기록을 **덮었다**(21장인데 20자리).
         합치도록 고치고, **화면 수와 라우트 수를 따로 적게** 했다.
         ★ **때릴 것이 줄어든 판정기는 조용히 더 초록이 된다**(D-301).

    ▣ 못 지은 것과 사유 — 셋 다 「쓰기 면을 열려면 탐침이 먼저」(P-8)
      · `/handover` 본문 — 화면이 `features/Handover/**` 라 차선 C 파일 범위 밖이기도 하다.
        **지시서와 파일 범위가 어긋난 자리**이므로 다음 턴에 한쪽으로 정한다.
      · W2 전파 기록 — 화면에 **없다고 적어 두었다**(「대외 전파를 적는 쓰기 면은 아직 없습니다」).
        아래 「발송 이력」이 F-10 알림이지 대외 전파가 아니라는 것도 함께 적었다.
      · 상태 이력 — 전이는 감사 로그에 남지만 **읽는 라우트가 없다.** 빈 표를 그리면
        「이력이 없다」로 읽히므로 현재 칸과 `allowed_next` 만 그리고 사유를 적었다(D-284).
      ★ `WRITE_NO_PROBE` 의 두 줄(`write_handover_note`·`record_dispatch`)은 **그대로 둔다** —
        면을 열지 않았으므로 지우면 「없는 면을 등재 해제」가 된다.

    ▣ 곁가지로 잡은 조용한 것 둘 [실측]
      · `VERDICT_LABEL` 의 키가 서버와 **어긋나 있었다**(화면 `true_positive` ↔ 서버 `confirmed`).
        「판정」 칸은 **한 번도 한국어를 그린 적이 없고 오류도 안 났다** — 원문이 그대로 나갔다.
      · `EVENT_TYPE_LABEL` 에 `sos` 가 빠져 있었다(서버 열거에는 있다). 둘 다 고쳤다.
    ▣ [실측] 단위 592 passed · 1 skipped · exit 0 / E2E 23 passed · exit 0 /
      `verify_screens` 호스트 exit 0 (21장) · 컨테이너 exit 2(판정 불가) · 자기시험 12갈래.
  enforced_by: |
    · backend/tests/test_c_w1_presets.py (9건) · backend/tests/test_f05_event_api.py(진입면 22)
    · scripts/verify_screens.py — 이름 규약 + 자기시험 12갈래 + PyYAML 부재 시 exit 2
    · scripts/capture_screens.py — 라우트별 API 기록을 **합친다**(덮지 않는다)
    · docs/agent/evidence/D-386/screen_routes.json · docs/agent/onboarding_48.md
