- id: D-438
  author_tree_id: "세종 지시서 턴 C(2026-09-05) §1 P-40 · §3 · 차선 C"
  title: "관제요원이 미처리를 접수로 못 넘기고 있었다 — **화면은 멀쩡히 떠 있었다**"
  status: decided
  raised_by: "조율자(Code) 2026-09-05 TC · 차선 C (UX-21 · UX-02 · UX-08 · UX-18 · M3 · UX-03)"
  decision: |
    ▣ ★★★ **본문/질의가 어긋난 자리 셋 — 그리고 셋 다 화면은 떠 있었다.**
      `backend/apps/dsm/api.py` 의 POST 는 인자가 **원시 타입**이라 django-ninja 규약상
      **질의**인데, 화면 셋이 **본문**으로 보내고 있었다:
        ① `CameraImport.tsx` → `/cameras/import`  본문 **422** / 질의 **200**
        ② `DrillMode.tsx` → `/drill`               본문 **422**
        ③ `FocusQueue.tsx` → `/events/{id}/response` 본문 **422** `loc:["query","to_state"]`
      ★ **③ 이 가장 나쁘다 — 「지금 처리할 것」에서 미처리를 접수로 넘기는 단추다.**
        U1 관제요원 **첫 근무일 경로 한복판**이고 온보딩 48행이 세는 칸이다.
      ⚠ **캡처가 제목 글자만 단언하므로 셋 다 멀쩡히 떠 있었다** — 착시 ⑨(함수는 문이
        아니다)의 화면판: **문이 있어도 열쇠 구멍이 다르면 안 열린다.**
      ★ 두드리는 법: **없는 id(999999999)** 로 두드리면 검증이 먼저 돌아 갈린다 —
        어긋나면 **422**, 맞으면 **404**. **아무것도 쓰지 않는다.**
      ★★ **전수 대조 [AST]**: 서버 POST 12건 = **QUERY 10 · NOARG 2 · BODY 0.**
        이 진입면에는 **본문으로 받는 POST 가 하나도 없다** — 본문으로 보내는 화면은
        전부 틀린 것이다. 화면 POST 호출 9건과 대조해 셋을 찾았다.
      ★★ **`grep` 이 실제로 두 자리를 놓쳤다** — `dsmPostQuery<ImportPlan>(` 처럼 제네릭이
        붙은 호출을 줄 정규식이 못 잡았다. 판정기는 **괄호 균형**으로 집는다.
      ★ **뿌리는 「맞게 짠 사본이 하나 있었다」는 것**이다 — 그 사본이 「손으로 짜도 된다」로
        읽혔고 셋이 빠졌다. **감싸개를 통째로 없앴다**(저장소에 `postWith` 0건) —
        판정기가 믿어야 할 이름을 하나 줄이는 것이 고침의 일부다.
      → 게이트 **`post-arg-style`** 신설(ALL_GATES 12 → 13종). 자기시험이 **판정기 자신의
        결함을 잡았다**: 1차판이 **문자열 안에 적힌 호출 모양**을 위반으로 셌다.

    ▣ ★★★ **분류 게이트가 물었고, 조율자가 시킨 답이 틀렸다 — 차선 C 가 안 따랐고 옳았다.**
      커밋 훅이 메뉴 끊기 두 명령을 막고 물었다: 「`core.menu.RoleMenu` 는 어느 테넌트의 표인가.」
      조율자는 「공용 마스터일 테니 **전역 변경임을 선언**하고 지나가라」고 지시했다.
      차선 C 가 등록부를 읽고 **선언하지 않았다** — 답이 둘 중 하나가 아니었기 때문이다:
        `menu.RoleMenu` = **`DEFERRED`**(「일부만 공용일 수 있다」) · `menu.Menu` = **선언 없음**.
      **「아직 아무도 정하지 않았다」가 셋째 답이었다.** 선언이 없으니 실물을 쟀다 —
      `RoleMenu` 969행 중 **926행(95.6%)이 소속을 갖는다.** 공용 마스터가 **아니다.**
      그리고 **끊은 11행이 소속 둘에 걸쳐 있었다**(`{6: 7, 5: 4}`).
      → 진짜 결함은 「전역이라 위험하다」가 아니라 **「명령이 소속을 안 물었다」**였다.
      ⚠ **시킨 대로 선언했으면 틀린 것을 선언한 것이고, 그 선언은 다음 사람에게 거짓
        안심으로 남는다. 게이트의 물음에 답하는 것과 게이트를 통과시키는 것은 다르다.**
      고침: `--group`/`--all-tenants` **필수**(**기본값을 두지 않았다 — 기본이 전역인 명령은
      언젠가 반드시 모르고 눌린다**) · 등록부 분류를 매 실행에 찍고 다르면 멈춤 ·
      장부에 소속 기록. 시험 9 → **16건**, 양성 대조로 「남의 소속까지 끊었습니다」가
      **하나만** 빨개지는 것을 확인했다.

    ▣ **UX-21 닫힘 (P-40 집행) — 관제 역할 메뉴의 드론·영문 11 → 0 · U5 8 유지.**
      ★ **삭제 0건**: Menu 131행 · RoleMenu 969행이 끊기 전후 **같다.** 끊은 것은 행이 아니라
        **그 행의 네 칸**이다. `core.*` 는 한 줄도 안 고쳤다 — **데이터 작업**이다.
      ★★ **되돌릴 수 있다 [실측 왕복]** 11 → 0 → **11** → 0. 그리고 되돌리기는 **장부대로**다
        (연결마다 `before` 를 남겼다) — **표만 보고 켜면 끊기 전부터 꺼져 있던 연결까지 켜서
        없던 권한을 준다.** 되돌리기가 권한 부여가 되는 자리다.
      ★ **「107행」은 틀린 수였다** — Menu 는 131행이고 107 은 **관리자 한 사람이 보는 메뉴 수**다.
        조율자가 세어 본 수가 아니라 **옮겨 적은 수**를 잠금 제목에 썼다. 바로잡았다.

    ▣ **UX-08 넘김 — 그러나 정본이 못 본 것을 찾았다. 겹이 둘이 아니라 셋이었다.**
      ⓪ `consumers.py` 에 `detection_message` 핸들러가 **없다** — 핸들러 없는 `type` 으로
         쏘면 Channels 가 **그 그룹의 모든 관제 세션을 끊는다.** 두 겹만 믿고 켰으면
         「알림이 안 온다」가 아니라 **「화면이 다 떨어진다」**가 났다.
      ★★★ 그리고: **잠자던 시그널은 `VideoAnalysis` 에 붙어 있고 관제 화면이 읽는 것은
        `DetectionEvent` 다 — 두 겹을 다 풀어도 한 장도 안 붙는다.**
        **꺼진 스위치가 그 전등의 스위치인지는 따로 확인해야 한다.**
      넘기는 이유: 「새로고침 없이 카드가 붙는다」를 **못 봤다**(WS 인증이 세션 기반이라
      JWT 만 든 SPA 가 붙는지 [미확인]). **주기 갱신 15초를 바닥으로 남겼다** —
      소켓을 바닥으로 삼으면 안 붙는 날 화면이 **조용히** 멈춘다.

    ▣ **UX-02 · UX-18 · UX-03 닫힘.**
      UX-02 는 **서버 면 신설 0건** — 기존 두 문을 감쌌다(새 문을 뚫으면 판정식이 두 벌이 된다).
      UX-18 은 이번 턴에 바뀐 것이 하나뿐이다: **그 화면의 쓰기가 실제로 되게 됐다**(422 → 200).
      UX-03 은 세종이 문서를 썼고 차선 C 는 **잇기만** 했다 — `/start` 는 **관문 밖에 서는
      유일한 화면**이되 서버 호출 0건이다(공개 가지에 두면 로그인한 사람이 튕기고, 관문 안에
      두면 처음 온 사람이 못 본다).
  enforced_by: |
    · scripts/verify_post_arg_style.py (신설 · ALL_GATES 13종) — 서버는 AST · 화면은 괄호 균형
