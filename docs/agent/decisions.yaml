- id: D-466
  author_tree_id: "세종 지시서 턴 Q(2026-09-15) · P-141 · 차선 Q 3종 분류"
  title: "여정 빨강 셋은 제품이 아니라 판정기의 기대식이었다 — 셋을 정본에 맞춰 고친다"
