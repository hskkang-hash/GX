- id: D-424
  author_tree_id: "세종 지시서 2026-09-24 §2 C행 · UX-13·14·17·18 · PRD v2.5 킥"
  title: "차선 C 병합 — **지시서가 셋 틀렸고 차선이 착수 전에 고쳤다** · 부작위 시험이 배선을 불렀다"
  status: decided
  raised_by: "차선 C 보고 2026-09-24 → 조율자 병합·배선·화면 캡처"
  decision: |
    ▣ ★★ **착수 전 실측이 지시서를 세 곳 고쳤다** — 이 차선의 가장 큰 값이다
      ① 「네 시각은 모델에 **이미 있다**」 — **아니었다.** `DetectionEvent` 에 있는 것은
         `occurred_at` 하나뿐이다. D-399 는 `response_state` **한 칸**을 세웠고 그 주석이
         「이 칸은 who·when 을 들지 않는다 — 어떻게 왔는지는 감사가 안다」라고 적어 두었다.
         → 네 시각은 **감사에서 센다. 칸 셋을 새로 만들지 않았다** — 새 칸은 태어나는 순간
           과거가 비고, **빈 과거는 「대응이 빨랐다」로 읽힌다.**
      ② **ONVIF 는 이 저장소에 없다** (`grep -ril onvif backend/` = 0건). 없는 것 위에
         화면을 얹지 않았다(P-15). `Row.source` 를 비워 두어 어댑터가 오면 값 하나만 는다.
      ③ **좌표 역지오코딩은 이미 「불가」 판정**이다(D-329). 게다가 `StreamMonitor` 에
         **위·경도 칸이 아예 없다** — 역지오코딩할 좌표가 없다.
      부재를 못박는 시험을 남겼다(`AbsentPathsAreNamedTest`) — 생기는 날 빨개진다.

    ▣ ★ **차선 C 의 시험이 차선 C 의 버그를 잡았다.** 1차판 ×N 묶음은 `timestamp() // 300`
      **고정 격자**여서 60초짜리 7건이 벽시계 5분 경계를 걸치면 두 장으로 갈렸다
      (한 번 초록 · 한 번 빨강). **시험이 흔들린 것이 아니라 규칙이 틀렸다** —
      **이어붙이는 창**(앞 건과의 간격 ≤ 300초)으로 바꿨다.

    ▣ **UX-14 대응 시계** — 문턱 넷(30초·2분·5분·8분) · 상세 타임라인 · 월간 p50/p95.
      **자동 종결은 분모에서 뺀다**: `excluded_auto_closed=3 · close.n=1` [실측].
      분모가 0이면 p50 은 `null` 이다 — **0 이 아니다.**
    ▣ **UX-13 단일 초점 큐** — `total_events=7 · card_total=1`. **이벤트는 접지 않는다**
      (F-14 통계가 원본 건수를 본다). 접는 것은 화면이지 기록이 아니다.

    ▣ ★★★ **부작위 시험이 배선을 불렀다** (UX-17)
      차선 C 는 스위치·창·보고서까지 짓고 **K2 채널 어댑터 앞에서 멈췄다**(발송 경로는
      하나이고 그 파일은 차선의 것이 아니다). 멈춘 자리에 시험 하나를 남겼다 —
      「K2 발송 경로가 **아직** 훈련 스위치를 보지 않는다」.
      조율자가 `_send_one` 에 한 자리를 잇자 **그 시험이 빨개졌고, 그 빨강이 「배선이
      왔다」는 선언**이었다. 갈아 끼운 것이 `DrillIsWiredToChannelsTest`(훈련 중 채널이
      `log` + 양성 대조). 화면의 「아직 배선 안 됨」 경고 문구도 함께 지웠다 —
      **안 고치면 화면이 없는 결함을 있다고 말한다.**
      ★ 이름을 **가장하지 않는다**: 행의 `channel` 에 `log` 가 그대로 적힌다. 원래 채널로
        적어 두고 몰래 로그로 보내면 그 행은 **보냈다는 거짓말**이다(D-284).
      ★ 안전한 기본값은 **실발송**이다 — 테넌트를 못 읽으면 훈련이 아니다.

    ▣ 조율자 몫 — **화면을 실제로 찍었다.** 차선 C 는 「화면이 그려지는 모양은 [추정]」이라
      정직하게 적었고(동시 접속 1개라 다른 차선의 세션을 끊게 되어 브라우저를 안 띄웠다),
      차선이 다 끝난 뒤 조율자가 번들을 다시 빌드해 심고 캡처했다:
      **21 → 24장** · `verify_screens` 통과 · `route-alive` **31 → 35건**.
      그 캡처가 없으면 UX-13·17·18 은 「서버 면은 섰고 화면은 못 봤다」이고, 그 상태에서
      '구현'으로 적는 것이 이 대장이 금지하는 부풀리기다(D-346 · P-9).
      ★ 게이트가 슬러그 규약도 잡았다 — 파일 이름이 라우트 뿌리로 시작해야 한다.
        `dsm_focus_queue` → `dsm_queue_focus` 로 고치고 다시 찍었다.

    ▣ 진입면 **여덟이 늘었다**(25 → 33). 손으로 그 줄을 더하는 일이 곧 선언이고,
      `test_f05_event_api` 가 먼저 멈춰 세웠다 — 게이트가 지시보다 위다(D-327).
      쓰기는 둘뿐(`POST /drill` · `POST /cameras/import`)이고 그 둘의 probe 는 선등록에서
      `WRITE_PROBES` 로 옮겼다.
