- id: D-299
  title: "Zone 모델 신설 — 카메라 묶음(지금) + 폴리곤 자리(계약 F-03, 비워 둠)"
  status: decided
  raised_by: "세종(기획) 2026-09-01 · 대표 위임 (P-K2-2 판정)"
  question: "DA-04 의 zone 은 무엇인가 — 행정구역인가 카메라 묶음인가 폴리곤인가?"
  decision: |
    계약 F-03 의 AC 는 "지정 위험구역(**폴리곤**) 내 사람·차량 진입"이다. 최종적으로 폴리곤이
    필요하다 — 에이전트 권고(카메라 묶음)는 **계약보다 약하다.** 그러나 지금 폴리곤 전체를
    만드는 것은 크고(GIS·좌표계·구역 편집 화면), 안 만들면 E2E-2 3단계가 계속 잠긴다.

    → **같은 모델에 둘 다 자리를 두고, 지금은 카메라 묶음만 채운다.** 나중 확장이
      재작업이 아니라 **빈칸 채우기**가 된다. 다른 모델을 새로 만들면 Zone 이 둘이 되고,
      둘이 되면 어느 쪽이 계약인지 아무도 모른다(D-227 이 만든 상태).

    ▣ 계층: **L3 Platform.** 구역은 재난안전 전용 개념이 아니다(산업안전·시설물 App 도 쓴다).
      카메라를 묶는 일이므로 카메라와 같은 층·같은 앱에 둔다 — 신규 앱을 만들지 않는다
      (DetectionEvent 를 stream_monitors 에 둔 것과 같은 이유).
    ▣ 기저는 `BaseModel` — 실행 중인 dj-core 가 group FK 를 자동으로 준다(D-292 실측).
      `BaseModelWithGroup` 은 신규 상속이 게이트로 막혀 있다(D-295).
    ▣ 폴리곤은 **선언된 미완성**이다: `ZONE_POLYGON_READY = False`.
      좌표 표현(GeoJSON 인지 좌표쌍 배열인지)·좌표계(WGS84/TM)를 지금 고르면 그 선택이 곧
      F-03 의 계약이 된다(D-280). 그래서 고르지 않고, **고르지 않았음을 시험이 잰다**(D-300).
    ▣ 결합(F-03)은 **값을 돌려주고 저장된 등급을 덮지 않는다.** 덮으려면 K1 공개 면에
      일곱 번째 함수가 필요하고 DA-04 §2 는 여섯으로 고정했다. 그리고 관측이 실제로 난
      등급은 오탐률·이력의 사실이다 — 덮으면 "무엇이 실제로 났는가"를 못 읽는다(D-293 계열).
      결합의 효과는 **누가 받는가**로 나타난다(resolve_recipients 의 입력이 바뀐다).
  enforced_by: |
    · backend/stream_monitors/models.py 의 Zone — kind · cameras(M2M) · geometry(비움) ·
      geometry_status. 마이그레이션 0019_zone. DDL·역방향 DDL 은
      docs/agent/evidence/W2-ZONE/0019_zone_sqlmigrate*.sql (D-283 절차).
    · backend/stream_monitors/services/zones.py — 카메라 묶음 판정 · combine_in_zone.
      폴리곤은 조용한 False 가 아니라 NotImplementedError 로 멈춘다(D-284).
    · scripts/verify_zone_polygon.py — 상수가 False 면 사유를 요구하고, True 로 올리면
      F-03 폴리곤 AC 시험(test_f03_polygon_contract_ac)과 구현을 요구한다. exit 1.
      --self-test 가 양성 3 · 음성 2 를 먼저 돈다(D-277).
    · backend/tests/test_zone_judgment.py — 섰는가 · 안 만들었는가(D-300) · 잠겨 있는가.
      ReadyPolygonDataTest 가 **데이터가 상수를 앞지르는 것**을 DB 쪽에서 잡는다.
    · backend/tests/e2e/test_e2e_2_flood.py — 3단계가 다시 닫히면 실패한다. E2E-2 4/4.
    · .pre-commit-config.yaml 훅 gx-zone-polygon — 커밋 시점에 건다.
  affects: [K2, K1, E2E-2, F-03, P-K2-2, DA-04, D-280, D-293]

- id: D-300
  title: "부작위 시험(negative construction test) 원칙 신설 — 만들면 안 되는 것이 안 생겼는지도 잰다"
  status: decided
  raised_by: "세종(기획) 2026-09-01 · 대표 위임"
  decision: |
    **금지된 산출물이 있는 작업에는 "만들지 않았음"을 검사하는 시험을 함께 붙인다.**
    "무엇을 만들었나"만 재면, 금지선을 넘은 것이 초록 속에 숨는다.

    인정 근거: adapters/sdn/ 에 포트(I-1~I-5)·호출 의도·수령요건 34건(A차단 24)·오류 계약·
    갈아끼우기 자리만 세우고 **엔드포인트·필드명·타입·결과코드·Mock 은 만들지 않은 것** —
    그리고 그 사실을 시험 15건이 함께 쟀다.

    ▣ KERNEL_READY 패턴을 **정본으로 올린다.** 잠긴 기능은 상수로 잠그고,
      · 사유(`*_NOT_READY_REASON`)가 비면 게이트 exit 1
      · 상수를 True 로 올리면 그 기능의 계약 AC 시험이 **즉시 의무**가 된다
      "안 됐다"는 말은 사유를 요구하고, "됐다"는 말은 시험을 부른다 —
      어느 방향으로도 조용할 수 없다. D-286("절차는 도구로")의 모범 구현이다.
    ▣ 부수 소득: 표준만으로도 F-09 연계 상태가 "대기 — 명세 미수령"을 정확히 말한다.
      에스비에 보여줄 화면이 우리 책임이 아님을 시스템이 스스로 말한다.
  enforced_by: |
    · backend/tests/test_sdn_port_standard.py 의 NothingWasGuessedTest — Mock 부재 ·
      URL 0건 · 결과코드 열거 0건 · 비행 명령 메서드 부재.
    · backend/tests/test_zone_judgment.py 의 NothingWasGuessedTest — point-in-polygon 부재 ·
      좌표계/GIS 의존 0건 · 구역 편집 공개 면 0건 (D-299 적용분).
    · backend/tests/test_fx5_address.py 의 NothingWasGuessedTest — HTTP 구현 부재 ·
      juso 응답 필드명 0건 · resolve 가 예외를 던지지 않음 (D-298 FX-5 적용분).
    · scripts/verify_zone_polygon.py · scripts/verify_e2e_contract.py 의
      not_ready_declarations — 사유 없는 미준비를 저장소 밖에서 한 번 더 잠근다.
  affects: [SDN, ZONE, FX-5, D-280, D-284, D-286, D-297, D-299]

- id: D-301
  title: "「검사 못함 ≠ 0건 검사」 원칙 신설 — 모든 게이트는 입력 건수를 출력한다"
  status: decided
  raised_by: "세종(기획) 2026-09-01 · 대표 위임"
  decision: |
    게이트 결함 3건을 인정한다.
      ① verify_layers.py 오판(DA-04 권장 사용법을 위반으로) → 술어를 커널 __all__ 로 교체.
      ② GATE model_inheritance 가 전수를 훑어 베이스라인 이전 위반까지 빨개진 것 → 추가된 줄만.
      ③ ★ `$PY - <<'PYEOF'` 가 stdin 을 스크립트로 써서 파이프가 덮이고,
        **아무것도 못 보면서 exit 0.** 심어 보고 잡았다.

    ▣ 원칙: **게이트는 "0건 검사했음"과 "검사하지 못했음"을 구분해야 한다.**
      입력이 비었거나 파이프가 끊겼으면 exit 0 이 아니라 exit 1 또는 **명시적 skip 사유**를 낸다.
      "아무것도 못 보면서 초록"은 착시 ④(탐지기 자체)의 게이트 판이고,
      D-290(기본값 오류 삼킴)의 형제다.
    ▣ 강제: 모든 게이트가 **입력 건수를 출력**한다. 0 건일 때는 사유를 함께 낸다.
      **건수 출력이 없는 게이트는 게이트로 인정하지 않는다.**

    · "셋 다 재지 않는 동안에는 초록이었습니다" — 이 문장을 결정문에 그대로 남긴다.
  enforced_by: |
    · docs/agent/verify_gates.sh 의 inputs() — 건수를 출력하고, 0건인데 사유가 없으면 실패.
      전 게이트 7종이 부른다(건수 출력 지점 9곳, 실측).
    · docs/agent/verify_gates.sh 의 run_gate() — 게이트 출력에 `[입력]` 표시가 없으면
      결과가 초록이어도 **그 게이트를 실패시킨다.** 출력은 명령 치환이 아니라 임시 파일로
      받는다 — 서브셸이면 집계가 부모에 안 남고, 그것이 이 결정문이 금지한 모양이다.
    · scripts/verify_gate_counts.py — 저장소 밖에서 한 번 더 잠근다: ALL_GATES 이름마다
      함수가 있는가 · 게이트마다 inputs 를 부르는가 · 헬퍼가 0건+무사유를 실패시키는가 ·
      run_gate 의 대조가 남아 있는가. --self-test 가 양성 3 · 음성 1 을 먼저 돈다.
    · scripts/verify_model_inheritance.py — 전수가 0건이면 통과가 아니라 열거기 고장으로
      exit 1 한다(D-271 ②). 같은 원칙의 선례다.
    · .pre-commit-config.yaml 훅 gx-gate-counts — 커밋 시점에 건다.
  affects: [게이트 전종, D-271, D-277, D-282, D-290, D-295]

- id: D-302
  title: "범위를 명시한 부분 완결을 '완주'로 적지 않는다 + VIDEO 잠김 사유 실측"
  status: decided
  raised_by: "세종(기획) 2026-09-01 · 대표 위임"
  decision: |
    ▣ 표기: 잠긴 칸(SDN·VIDEO)은 **잴 수 없는 것**이고, 정확한 표현은
      "릴리스 후보(SDN 제외판)의 범위 안에서는 끊긴 단계가 없다" 이다.
      앞으로도 범위를 명시한 부분 완결을 "완주"로 적지 않는다.

    ▣ VIDEO 잠김 사유 — **실측했다. 대표 추정(실 스트림 부재)과 다르다.**
      막고 있는 것은 스트림이 아니라 **배선**이다:
        · `DetectionEvent.clip_path` 는 정의 1건 · 읽기 2곳 · **쓰기 0곳** — 아무도 채우지 않는다.
        · 녹화는 스트림 단위로 존재한다(`/start-record`·`/stop-record` → MinIO object_path).
          그러나 그 산출물이 이벤트와 이어져 있지 않다.
        · 이벤트 시각으로 영상 구간을 찾아 돌려주는 재생 라우트가 **전수 라우트에 0건**이다.
      → ZONE 처럼 지금 열 수 없다. 열려면 그 배선을 만들어야 한다.
        다만 이것은 **개발로 풀 수 있는 항목**이고 계약 블로커가 아니다 — SDN 과 다르다.
        릴리스 후보(SDN 제외판)에는 넣지 않고, 다음 구간의 개발 항목으로 남긴다.
  enforced_by: |
    · backend/tests/e2e/e2e_contract.py 의 LOCKED_CAPABILITIES["VIDEO"] — 실측 사유가
      본문에 적혀 있다. 사유가 비면 `test_e2e_contract` 가 멈춘다.
    · backend/tests/e2e/test_e2e_1_fire.py 의 잠김 보고 시험 — 7·9단계가 표에서 빠지면 실패.
    · docs/agent/evidence/e2e/E2E-1/steps.md — 잠김 2칸이 표에 그대로 남는다(생성물).
    · docs/agent/RELEASE_CANDIDATE.md — 범위를 제목에 박는다("SDN 제외판").
  affects: [E2E-1, E2E-2, VIDEO, F-09, D-274, D-296]

- id: D-303
  title: "릴리스 후보(SDN 제외판) 도달 조건 5건 — 확정"
  status: decided
  raised_by: "세종(기획) 2026-09-01 · 대표 위임"
  decision: |
    다섯이 차면 **릴리스 후보(SDN 제외판)를 선언하고 멈춘다.**
      ① E2E-1 8/8 (SDN·VIDEO 칸 제외, 잠김 사유 명시)
      ② E2E-2 4/4 (D-299 로 열림)
      ③ 게이트 전건 exit 0 + 입력 건수 출력 (D-301)
      ④ F-09~F-12 라우트 트립와이어 통과 (완료)
      ⑤ 설치·운영 문서 초안

    ▣ 초효율 — 릴리스 후보를 만들면 계약 제7조 3단계(통합시험, 2027.1) 인도물 3종이
      **부산물로** 나오도록 설계한다. 나중에 따로 만들면 두 번 일한다.
        ① 통합시험 결과서   ← evidence/e2e/ 가 그대로 초안. 표지·요약만 얹는 스크립트.
        ② 설치·운영 매뉴얼  ← **아무것도 없는 상태에서** 한 번 세워 보며 그 명령을 그대로 적는다.
                              이미 돌던 환경에서 적으면 빠진 단계가 생긴다.
        ③ 소스코드·빌드     ← 태그 + 재현 가능한 빌드 명령(매뉴얼에 포함).
  enforced_by: |
    · scripts/verify_release_candidate.py — 다섯 조건을 **하나씩 판정**하고, 하나라도
      못 채우면 exit 1. 증거 파일이 없으면 "통과"가 아니라 **판정 불가로 exit 1** 한다
      (D-301 「검사 못함 ≠ 0건 검사」). --self-test 가 양성·음성 대조를 먼저 돈다.
    · scripts/gen_integration_test_report.py — evidence/e2e/ 에서 통합시험 결과서 초안을
      **생성한다.** 본문은 생성물이지 작성물이 아니다 — 손으로 쓰면 실측과 갈린다.
    · docs/agent/runbook/설치운영매뉴얼_v0.1.md — 빈 환경 기동 절차. 매 단계에 실행한
      명령과 그 결과가 붙어 있다.
