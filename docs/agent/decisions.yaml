    인터넷에 열려 있다. D-244 ②(접근 IP 제한) 대상에 이 둘을 포함한다.
    긴급도는 자격증명 회전과 동급. **수행 주체는 대표/운영자다 — 에이전트는 실행하지 않는다.**
    (D-244 그대로: 운영 서버 접속·설정 변경은 에이전트 소관이 아니다.)
