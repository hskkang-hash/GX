- id: D-458
  author_tree_id: "세종 지시서 턴 P(2026-09-15) · ③a"
  title: "dormant 판정기가 Django 미들웨어 훅을 몰랐다 — process_exception 을 잠자는 함수로 오판했다"
  status: decided
  raised_by: "조율자(Code) 2026-09-15 턴 P ③a(`ed3eaa7`)"
  decision: |
    ▣ dormant 판정기에 Django 미들웨어 훅 5종(process_request · process_view ·
      process_exception · process_response · process_template_response) 추가.
