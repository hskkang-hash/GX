  affects: [D-284, D-301, D-310, D-323, D-347, D-350, D-378]

- id: D-387
  author_tree_id: "지시서 D-387"
  title: "lock 고정 — **재현되지 않는 빌드는 상용에 나갈 수 없다.** 브랜치 참조 0건"
  status: decided
  raised_by: "세종(기획) 2026-09-13 판정 · Code 실측 이행"
  decision: |
    ▣ 실측 — 우리가 서 있던 땅 [2026-09-13]
      저장소에는 lock 이 **없었고**, 컨테이너 이미지 안에는 **있었다**(2026-02-10).
      그 lock 이 적어 둔 설치 커밋:
          rj-core        commit_sha 51b01e56da253e1b601fb97efd65d10dafe6b7a0
          @gaion/gcs-fe  commit_sha a7846a02bbf790738f894a115d54667128d9b2c9
      이미지의 package.json 과 저장소의 package.json 은 **의존 80·개발의존 26이 동일**하다.
    ▣ 한 일: lock 을 저장소로 올리고(2,384 패키지) 두 git 의존을 **커밋 핀**으로 바꿨다.
      **브랜치 참조 전수 → 잔여 0건** [실측]. 세는 자리는 배포 전 점검이다(새 게이트 아님).
    ▣ 재현 [실측]: 두 번 빌드 + **깨끗한 디렉터리** 빌드 = 산출물 **197개 이름·해시 전부 일치**
      (각 50초 · exit 0 · NODE_OPTIONS=--max-old-space-size=6144).
    ▣ ★ **확인하지 못한 것을 확인한 것처럼 적지 않는다** (D-301 · D-389):
      사내 git(192.168.0.22:22)이 **연결 거부**라 `npm ci` 로 처음부터 설치해 보지 못했다.
      지금 증거는 **번들의 재현성**이고 **설치의 재현성이 아니다.** 두 절로 쪼개 올렸다
      (상용 ⑥품질 QA-08 구현 · QA-09 미측정).
    ▣ ★ 대조 방법도 한 번 틀렸다 (D-350): `find | xargs md5sum` 이 **이름에 공백이 있는
      4개를 조용히 건너뛰고도** 「전부 일치」라고 말했다. `-print0 | xargs -0` 로 고쳐
      197/197 을 실제로 셌다. **빠뜨리고도 초록인 대조**가 이 국면이 잡으려는 모양이다.
    ▣ 타입오류 **3229건은 그대로다.** 고정은 그 수를 줄이지 않고 **늘지 않게 잠근다.**
  enforced_by: |
    · frontend/package.json · frontend/package-lock.json — 커밋 핀 + lock (저장소가 정본)
    · scripts/verify_deploy_ready.py — 브랜치 참조 건수 (양성·음성 자기시험 4갈래)
    · docs/agent/evidence/D-387/lock_pin_run.md
  affects: [D-301, D-344, D-350, D-358, D-381, D-389]

- id: D-388
  author_tree_id: "지시서 D-388"
  title: "㉠ 314건은 「고칠 목록」이 아니라 **「가를 목록」**이었다 — 넷으로 갈랐다"
  status: decided
  raised_by: "세종(기획) 2026-09-13 판정 · Code 실측 이행"
  decision: |
    ▣ 이행 [실측 2026-09-13] — `scripts/classify_dormant.py` (규칙 9종 · 자기시험 양성 9 + 음성 1)

          ㉠ 호출 없음  314건 = §0.4 금지구역 126 + 우리 관할 188
             ㉮ 켜야 할 것    41건  모듈은 운영이 import 하는데 그 함수만 아무도 안 부른다
             ㉯ 지워야 할 것   5건  그 모듈을 아무도 import 하지 않는다
             ㉰ 정상        132건  method 91 · test-file 31 · server-hook 9 · dynamic 1
             ? 판정 불가     10건  시험만 부른다 — 발판인지 잠든 자산인지 도구가 못 가른다

    ▣ ★ **넷째 칸(판정 불가)을 만든 이유**: 모르는 것을 셋 중 하나에 밀어 넣으면
      **추측이 실측 행세**를 한다 (D-290 3값 · D-301).
    ▣ ★ **한 건도 지우지 않았다** — 지시 그대로다. 지운 줄 수 **0줄**.
      상용 ⑥품질에 「죽은 코드 제거」를 절로 세웠다(QA-10 · 미착수).
    ▣ ★ 판정기를 **세 번 고쳤고 세 번 다 판정기가 틀렸다** (D-350):
      ① 저장소 전체의 md·json 을 「문자열 배선」의 근거로 읽어 **우리 증거 파일이 적어 둔
         함수 이름**이 배선으로 잡혔다 — 80건이 가짜였다. **문서가 이름을 적은 것은 배선이 아니다**
      ② 클래스가 자기 파일 안에서 등장하는 것까지 「살아 있다」로 세어 **188건 전부가
         ㉰정상**으로 나왔다. 0건 네 칸은 분류가 아니라 도장이다
      ③ `gunicorn.conf.py` 의 서버 훅 아홉을 **㉯지워야**에 넣었다 — 지웠으면 워커
         수명주기가 통째로 사라진다. **이 도구가 낼 수 있는 가장 비싼 오답**이라
         규칙(server-hook)을 더하고 그 사례를 자기시험 표본으로 박았다(D-310)
    ▣ ★ 그리고 ㉠ 판정기의 틈을 [실측]으로 남긴다: `verify_dormant._is_test` 는
      `tests/`·`test_*.py` 만 시험으로 본다 — **`test.py`·`tests.py` 는 안 걸린다.**
      분류기에서 `test-file` 규칙으로 메웠고 **래칫(기준선)은 건드리지 않았다.**
  enforced_by: |
    · scripts/classify_dormant.py (--self-test 로 규칙 9종 대조)
    · docs/agent/evidence/D-388/dormant_classified.json · .md (㉮ 41건 목록 포함)
  affects: [D-277, D-290, D-301, D-310, D-350, D-377]

- id: D-389
  author_tree_id: "지시서 D-389"
  title: "**부재 주장도 주장이다** — 「없다」·「미측정」에도 근거를 적는다"
  status: decided
  raised_by: "세종(기획) 2026-09-13 판정 (자기 정정) · 상시 규약"
  decision: |
    ▣ 규약(상시): D-322(출처 태그)의 집행 범위를 **부재 주장까지** 넓힌다.
      「없다」·「미측정」·「미착수」도 주장이고, **무엇을 확인하고 그렇게 적었는지**를 한 줄로 남긴다.
      근거 없는 부재 주장은 **인용을 거부하고 「부재 근거 미표기 N건」으로 돌려보낸다.**
    ▣ 이번 턴의 적용 [실측 2026-09-13]:
      · 「사내 git 에 닿지 못한다」 → ssh: connect to host 192.168.0.22 port 22: Connection refused
      · 「설치 재현은 못 쟀다」 → 위 사유를 QA-09 의 why 에 그대로 적었다
      · 「이번 턴에 켠 것은 없다」 → ㉠은 가르기만 했다는 사실과 함께 D-385 에 적었다
    ▣ ★ 이 규약이 없으면 「미측정」이 **다음 턴에 「해 볼 필요 없음」으로 늙는다.**
  enforced_by: |
    · docs/agent/evidence/D-346/ga_readiness.yaml — 미착수·미측정 칸은 why 가 없으면 exit 1
    · docs/agent/evidence/D-387/lock_pin_run.md §4 — 확인하지 못한 것을 절로 따로 적었다
  affects: [D-280, D-301, D-322]

- id: D-390
