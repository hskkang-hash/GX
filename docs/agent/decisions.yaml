  title: "WP-2 EXIT 판정 기준 정정 — 부착률이 아니라 '누출 0건'"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 2차 §1) — WP-2 ENTRY §1·§6 에 대한 대표 판정"
  decision: |
    데코레이터는 표식일 뿐이고 실제 좁힘은 핸들러가 한다. 전 라우트에 부착해도 데이터는 샐 수 있다.
    EXIT 격리 판정 기준을 다음으로 고정한다:
      · scripts/probe_tenant_isolation.py 재현 결과 **누출 0건** (착수 시점 man 15 · admin 18 · anyang01 1)
      · 격리 시나리오 **5/5** (착수 시점 0/5)
    라우트 총수는 실측값 **652** 를 쓴다. 지시서의 466 은 정적 추정치였다.
  affects: [W0-14, WP-2]
  author_error: "#17 — 부착률을 완결 기준으로 오정의 + 466 정적 추정"

- id: D-250
  title: "P-LOCAL-2 격리시험 픽스처 — 승인(옵션 A). 활성화한다"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 2차 §1) — P-LOCAL-2 에 대한 대표 판정"
  decision: |
    tests/test_tenant_isolation.py 의 _make_user 픽스처에 고유 email 을 부여해 5시나리오를 살린다.
    판정 로직은 한 글자도 바꾸지 않는다 — 픽스처만 유효해진다.
    근거: 살리면 빨간불이 켜진다 = 결함을 **드러내는** 방향이다. 감추는 방향이 아니다.
          D-105(격리시험 비활성/스킵 금지) 정신에 부합한다.
    P-LOCAL-2 status → answered.
  affects: [W0-3, W0-14, WP-2]

- id: D-251
  title: "D-244 보강(긴급) — 운영서버 9200 · 5601 포트 노출 IP 제한 대상 추가"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 2차 §1) — WP-2 ENTRY §8-4 실측에 대한 대표 판정"
  decision: |
