- id: D-485
  author_tree_id: "턴 T 조율자=집행자 · 대표 「창 열어라」"
  title: "재생성 창 집행 — 자격 3 · /backup · 운영 프로필 7/7 · storage_used_pct 가 수가 됐다 · 되돌리기 없음"
  status: decided
  raised_by: "대표 결정 ③(D-475 · 09-17 14:00) → 대표 한 줄 16:5x → 집행 16:54~17:05"
  decision: |
    ▣ RUNBOOK_재생성창 ⓪~⑤ 를 **그대로** 집행했다(기록은 그 문서의 「집행 기록」 절). 닫힌 것 넷:
      **자격 3**(P-138 · DB 역할 SCRAM · MinIO 루트 · 앱 env-file 넷) · **`/backup` 마운트**(OPS-12a ·
      celery·beat·shell · 장치 번호가 `/` 와 다르다) · **SEC-18a 7/7**(㉠ EXIT 0 ㉡ 20·40·32자 ㉢ 음성 셋
      ㉣ 선언 없음→거부) · **상한 반영**(P-139 · `GX_STORAGE_CAPACITY_GB=50` → `storage_used_pct` UNKNOWN→0.0).
    ▣ D-475 의 시각(14:00)과 실제 집행(16:54)이 다르다 — 집행자는 세션에 있었고 대표의 한 줄이 16:5x 에
      왔다. **주소 있는 승인의 시각은 그 한 줄이 정한다.** 미리 열지 않았다.
    ▣ 창 안에서 다른 변경을 섞지 않았다: P-161(앞단 순서)은 창 뒤 별건으로 격리 전/후를 재고 넣었고,
      `verify_prod_settings` VAPID 형식 검사 +1 은 **넣지 않았다** — 운영 모양 컨테이너의 env-file 에 VAPID 가
      없어(값을 싣는 것은 `.env*` 실값 변경 = 대표 결정) 지금 넣으면 게이트가 회색(exit 2)이 되고 그 회색은
      창의 수가 아니다. 다음 턴 대표 결정 뒤 같은 커밋에 넣는다.
    ▣ 남긴 사실: 잔존 시험 DB 4(`test_gx_lane_u24` 등)는 지우지 않았다(삭제는 대표) · 창 전 세션·토큰은 전부
      무효(서명 키 바뀜 · 자료 손실 없음 · 재로그인만).
  enforced_by: |
