- id: D-392
  author_tree_id: "지시서 D-392(실행 순서 ※)"
  title: "새 게이트는 **하나만** — `route-alive`. 나머지는 있던 도구에 한 줄을 더했다"
  status: decided
  raised_by: "세종(기획) 2026-09-13 (D-353 비율 규정) · Code 이행"
  decision: |
    ▣ 이행 [실측 2026-09-13]: 게이트 **8종 → 9종** (`route-alive` 하나만 늘렸다).
    ▣ 브랜치 참조 판정은 **새 게이트를 만들지 않고** 배포 전 점검(verify_deploy_ready.py)에
      한 줄을 더했다 — 자격증명과 **같은 성질**이기 때문이다: 없으면 배포하지 않는다.
    ▣ 분류기(classify_dormant.py)는 **게이트가 아니다.** 사람이 부르는 도구이고
