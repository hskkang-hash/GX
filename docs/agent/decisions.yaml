- id: D-463
  author_tree_id: "세종 지시서 턴 Q(2026-09-15) · WO-01 §5 「데이터」"
  title: "v1.1 표 일곱은 배선보다 먼저 태어난다 — 쓰기 0곳 칸은 배선할 차선·턴을 달고 선언한다"
  status: decided
  raised_by: "조율자(Code) 2026-09-15 턴 Q — verify_dead_fields 가 새 빚 14 로 커밋을 막음"
  decision: |
    ▣ WO-01 §5 는 스키마 일곱을 파 1 에 **한 벌로** 내라고 정했다(마이그레이션 두 벌 금지).
      그래서 칸이 라우트보다 먼저 선다 — 착시 ⑥(D-304)의 모양이다.
    ▣ 지우지 않고(삭제는 대표) 숨기지 않는다: 쓰기 0곳 14칸을 DECLARED_UNWIRED 에 **배선할
      차선·턴**과 함께 적는다. 배선되면 게이트가 「등재를 지워라」로 빨개진다(D-338 선례).
    ▣ 표는 stream_monitors 에 둔다 — apps.dsm 은 INSTALLED_APPS 밖의 서비스 패키지이고
      DSM 표는 전부 거기 산다. 이름은 db_table 로 dsm_* 를 박는다. 추상 TenantModel =
      BaseModel(group FK) + purpose_code(빈 값 CHECK 거절).
    ▣ 이번 턴 배선된 표: DsmFieldPhoto(U3 · POST field-photo).
  enforced_by: |
    · scripts/verify_dead_fields.py :: DECLARED_UNWIRED — D-463 14줄
    · scripts/gen_tenant_census.py :: NEW_SINCE_CENSUS — v1.1 표 여섯
    · backend/stream_monitors/migrations/0029_v11_tables.py
    · backend/tests/test_v11_tables.py
  affects: [D-304, D-338]

- id: D-464
  author_tree_id: "세종 지시서 턴 Q(2026-09-15) · WO-01 §4.2"
  title: "api.py 는 옮기지 않고 뒤에 붙인다 — 차선 라우터 넷은 기존 컨트롤러 둘 뒤에 등록한다"
  status: decided
  raised_by: "조율자(Code) 2026-09-15 턴 Q 첫 20분"
  decision: |
    ▣ WO-01 §4.2 「api.py 를 차선 모듈로 쪼갠다」를 **기존 라우트 이동 없이** 집행했다.
