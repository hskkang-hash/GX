# --- 2026-08-13 W0-0 완료 보고 대응으로 확정된 결정 (D-201~D-205) ---------
- id: D-201
  title: "npm peer 의존 충돌 해결 방식"
  status: decided
  raised_by: "agent (W0-0 blocker 초안)"
  question: "npm install 시 peer dependency 충돌이 난다. 어떻게 푸는가?"
  decision: |
    **A안 확정 — legacy-peer-deps 를 저장소 설정으로 고정한다.**
      프로젝트 루트에 .npmrc 를 만들고 커밋한다:
        legacy-peer-deps=true
      개별 명령에 --legacy-peer-deps 를 붙이는 방식은 금지한다(사람마다 다르게 실행되어 lock 이 흔들린다).
    ⚠️ 이것은 충돌을 **덮는** 조치이지 해결이 아니다.
       특히 react-text-mask 는 React 19 와 공식 호환이 아니므로 **실동작 검증이 필수**다 → W0-7 신설.
       W0-7 에서 깨지는 것이 확인되면 react-imask 또는 자체 포맷터로 교체를 별도 승격한다.
  rationale: |
    이 저장소는 React 19 + MUI 7 + AntD 5 + Bootstrap 이 혼재한다(B-04 정리 대상).
    지금 peer 트리를 정상화하려 들면 R1 일정이 통째로 무너진다.
    덮고 가되, 덮은 사실과 검증 티켓을 명시적으로 남긴다.
  affects: [W0-0, W0-7, W0-8]

- id: D-202
  title: "사내망 의존 패키지 — 오프라인 작업 정책 (verify-pending 모드)"
  status: decided
  raised_by: "agent (W0-0 DoD③ 실패: 192.168.0.22 SSH timeout)"
  question: |
    frontend(rj-core, @gaion/gcs-fe)와 backend(dj-core)가 모두 사내 git(192.168.0.22)에 의존한다.
    사외에서는 npm install 도 docker build 도 불가능하다. 루프를 어떻게 계속 도는가?
  decision: |
    **3단 정책으로 확정한다.**
      1) 티켓에 `requires_intranet: true|false` 를 표기한다.
         에이전트는 SELECT 시 현재 접속 상태를 확인하고, 오프라인이면
         requires_intranet=false 티켓을 우선 선택한다.
      2) **verify-pending 모드를 허용한다.**
         requires_intranet=true 인데 오프라인이면 → **구현은 하고 검증만 보류**한다.
           status = "verify-pending"
           evidence 에 "검증 보류 사유 + 사내망 접속 시 실행할 명령" 을 기록
           → 에이전트는 STOP 하지 않고 다음 티켓으로 전진한다.
         사내망 접속 시 verify-pending 티켓을 일괄 검증해 done 으로 올린다.
      3) 중기 해소: **W0-9** — 사내망에서 개발 컨테이너 이미지를 1회 빌드해 배포하면
         사외에서도 백엔드 검증이 가능해진다. 프론트는 W0-8 의 lock + node_modules 캐시로 해소.
    ⚠️ verify-pending 은 **done 이 아니다.** Phase Exit 판정에서 done 으로 세지 않는다.
  rationale: |
    '환경이 없어서 못 한다'와 '코드가 틀려서 못 한다'는 완전히 다른 문제인데,
    이것을 구분하지 않으면 루프가 첫 프론트엔드 티켓에서 영구 정지한다.
    구현은 오프라인에서도 90% 가능하다. 막히는 것은 마지막 검증뿐이다.
  affects: [전 티켓, AGENT_LOOP STEP 1/5/6]

- id: D-203
  title: "내부 토폴로지 노출 (사설 IP·내부 도메인)"
  status: decided
  raised_by: "agent (v2에서 제기, v3 미결정으로 2회 보류)"
  question: "192.168.0.48(DB) · 192.168.0.200(TURN) · *.gaion.dev · 192.168.0.22(사내 git) 을 어떻게 하나?"
  decision: |
    **정리하되 기능은 건드리지 않는다.** W0-10 으로 처리한다.
      정리 대상 : .env.example 2개, settings.py 기본값, 문서 내 하드코딩
                  → 플레이스홀더로 치환 (db.internal.example / turn:turn.internal.example:3478)
      유지 대상 : package.json 의 사내 git URL (기능상 필수)
                  docker-compose 의 서비스명 기반 호스트 (컨테이너 네트워킹)
    ⚠️ 사설 IP 는 외부에서 라우팅되지 않으므로 즉시 위험은 낮다.
       그러나 공공 보안성 검토·GS 심사에서 '내부 구성 노출'로 지적될 수 있어 정리한다.
       이것은 보안 사고 대응이 아니라 **정보 위생** 작업이다. 우선순위 P1.
  affects: [W0-10]

- id: D-204
  title: "티켓 verify 정규식에 실제 시크릿 값 금지 (정본 자체의 결함 정정)"
  status: decided
  raised_by: "agent (W0-0 재검사에서 tickets.yaml:65 발견)"
  question: |
    tickets.yaml 의 W0-0 verify 명령이 탐지용 정규식에 실제 DB 비밀번호와 MinIO 시크릿을
    문자열로 담고 있었다. 그 결과 베이스라인 커밋에 실값 2개가 들어갔다.
  decision: |
    **이것은 작업지시서 작성자(Cowork)의 오류다. 즉시 정정한다.**
      규칙: 탐지 정규식은 **값이 아니라 형태**로 쓴다.
        ✗ grep -E '(DB_PASSWORD=<실제값>|<실제 MinIO 시크릿>)'   ← 이 줄 자체가 유출이다
        ✓ grep -E '^(DB_PASSWORD|MINIO_SECRET_KEY)=(?!CHANGE_ME|your-)'
        ✓ grep -E '=(AIza|[0-9a-f]{32})'
      적용: W0-0 verify 를 패턴 기반으로 교체 완료 (tickets.yaml v2.2)
      후속: 이미 커밋된 2개 문자열은 W0-1b 재발급으로 무효화된다. 히스토리 세탁은 하지 않는다(D-004).
    또한 시크릿 스캔 대상에서 **docs/agent/* 를 제외하지 않는다.**
      정본·증거 파일도 스캔 대상이다. 실제로 blocker 인용문에 실값이 들어갈 뻔했다.
  rationale: "에이전트가 '내 수정 권한 밖'이라 판단해 손대지 않은 것은 규칙상 정확한 행동이었다. 규칙을 지킨 결과 결함이 남았으므로, 규칙이 아니라 원본을 고친다."
  affects: [W0-0, 전 티켓의 verify 작성 규칙]

- id: D-205
  title: "W0-0 완료 판정 — package-lock 을 분리한다"
  status: decided
  raised_by: "agent (W0-0 STOP(evidence-partial))"
  question: "DoD③ package-lock.json 생성이 사내망 없이는 불가능하다. W0-0 을 done 으로 올릴 수 있나?"
  decision: |
    **W0-0 은 done 으로 올린다. package-lock 은 W0-8 로 분리한다.**
      W0-0 새 DoD③ : 루트 yarn.lock 부재 + .npmrc 에 legacy-peer-deps=true 커밋
      W0-8 (신규)   : package-lock.json 생성·커밋 — human-required, requires_intranet
    이유: W0-1a(시크릿 게이트)·W0-2(권한 우회 제거)·W0-3(격리 테스트)·W0-4(데모 분리)는
          package-lock 과 아무 관련이 없다. lock 하나 때문에 4개 티켓을 막는 것은 설계 오류다.
    ⚠️ 단 W0-8 이 done 되기 전에는 프론트 빌드가 필요한 티켓이 verify-pending 에 머문다(D-202).
  affects: [W0-0, W0-8, W0-1a, W0-2, W0-3, W0-4]

- id: D-206
  title: "delivery 2곳 예외 승인분의 사후 처리"
  status: decided
  raised_by: "cowork (W0-0 보고의 '예외 승인분' 언급)"
  question: "W0-0에서 delivery 2곳을 '예외 승인분'으로 정리했는데, 계속 예외로 두는가?"
  decision: |
    **예외는 기한이 있어야 예외다.** 아래를 요구한다.
      1) 예외 항목을 docs/agent/evidence/W0-0/exceptions.md 에 기록한다
         (파일·라인 / 왜 예외인지 / 언제까지 / 해소 조건)
      2) 기한은 **R1 코드 동결(2026-12) 이전**으로 한다
      3) 기한 내 미해소 시 R1 Exit 체크리스트에서 자동으로 걸리게 한다
    예외 자체를 금지하지는 않는다. 추적되지 않는 예외를 금지한다.
  affects: [W0-0, R1 Exit]

