- id: D-246
  title: "티켓 ID 재부여 — 신규 3건은 W0-16 / W0-17 / W0-18"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 2차 §1) — WP-2 ENTRY §3-0 에 대한 대표 판정"
  decision: |
    직전 RESUME_NEXT 가 신규 작업 3건에 부여한 W2-2 / W2-3 / W2-4 는 정본에 이미
    AI 이벤트 센터(WP-3 · 상품화 2단계 U1)로 존재한다. 그대로 두면 U1 티켓 3개가 덮인다.
    신규 3건에 빈 번호를 준다:
      W0-16  superuser 역할 분리        (구 W2-2)
      W0-17  외부 의존 부분 실패 격리    (구 W2-3)
      W0-18  응답 후처리 + 계약 정합      (구 W2-4)
    기존 W2-2 / W2-3 / W2-4 (AI 이벤트 센터)는 무변경으로 남는다.
    manifest total 67 → 70 (R1 37 → 40).
  affects: [tickets.yaml, W0-16, W0-17, W0-18, W2-2, W2-3, W2-4]
  author_error: "#14 — 신규 티켓 번호 부여 전 기존 정본 번호 미대조 (D-214 절차대로 기록)"

- id: D-247
  title: "R1 실행 순서 정정 — 역할 분리(W0-16)가 뷰 스코프(W0-14)보다 먼저"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 2차 §1) — WP-2 ENTRY §3-1 에 대한 대표 판정"
  decision: |
    W0-14 현 구현은 dj-core 의 superuser 우회를 그대로 복제한다 —
      common/tenant_scope.py:165 `if is_superuser(user): return`
      common/tenant_filters.py:72 `is_superuser()` (base.py:308 과 동일 판정)
      _check · filter_by_group_field · filter_users_by_group · get_scoped_or_404 4곳
    "전역 superuser = GAION 운영자 전용"을 먼저 정의하지 않고 뷰부터 고치면 두 번 고친다.
    실행 순서를 고정한다:  W0-16(정의) → W0-14(뷰가 그 정의를 강제) → W0-13(백필).
  affects: [W0-16, W0-14, W0-13]
  author_error: "#15 — 작성자가 뷰-우선 순서로 지정"

- id: D-248
  title: "R3 재범위 — 상태코드는 소스 수정 불가, 응답 후처리 계층으로"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 2차 §1) — WP-2 ENTRY §3-2 에 대한 대표 판정"
  decision: |
    권한거부가 HTTP 200 으로 나가는 원인은 core/role/permission.py:512 가 dict 를 반환하기
    때문이고, 그 파일은 §0.4 금지구역이다(D-207). 소스 수정 금지.
    정정: 저장소 쪽 **응답 후처리 계층(미들웨어/렌더러)**에서
          200-body-403 형태를 감지해 실제 HTTP 403 으로 승격한다.
    하위호환 계획 필수 — 기존 클라이언트가 200 을 기대할 수 있다.
      ① 프론트에서 status_code 를 읽는 지점 전수 영향조사를 **첫 작업**으로
      ② 설정 1곳의 플래그 뒤에 둔다 (D-212) — 즉시 롤백 가능해야 한다
      ③ 단계적 전환 / 버전 플래그로 롤아웃
  affects: [W0-18]
  author_error: "#16 — 작성자가 저장소 코드로 고칠 수 있다고 가정"

