- id: D-243
  title: "superuser 역할 — 분리·순차 회수 (무중단)"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 §0) — P-LOCAL-5 에 대한 대표 판정"
  decision: |
    P-LOCAL-5 를 권고안대로 수용한다. superuser 역할을 회수하되 **즉시 회수는 아니다.**
      ① GAION 운영자 전용 슈퍼 역할 ↔ 고객 테넌트 내 운영 역할을 분리 정의한다.
      ② 고객 테넌트 계정에는 "자기 테넌트 관리" 대체 역할을 **먼저** 부여한다.
      ③ 검증 후 superuser 역할을 회차별로 무중단 회수한다.
    근거: 13개 실계정의 업무 중단을 막는다 (reversible:false 리스크 회피).
    범위: 에이전트는 로컬/스테이징에서 역할 재설계 스크립트·시험까지만 한다.
          운영 DB·운영 서버 직접 변경 금지 — 운영 반영은 대표/운영자 승인 후.
    효과: 이 결정으로 W0-13 진행 차단이 해제된다.
  affects: [W0-14, W0-13, W2-2]
  evidence: "docs/agent/evidence/W0-14/http_leak_probe.md §3 (13계정 · 3테넌트 실측)"

- id: D-244
  title: "보안 즉시조치 — 대표/운영자 수행. 에이전트는 저장소 정합만"
  status: decided
  raised_by: "cowork (RESUME_NEXT 2026-08-22 §0)"
  decision: |
    사람이 수행한다:
      ① 노출된 자격증명 즉시 회전  ② 운영서버 HTTPS + 접근 IP 제한
      ③ 서버 결제계정 생존 확인 (자산 소멸 시한)
    에이전트 역할: .env* 에 실값 무기입 유지(D-204), 검증은 **형태**로만, 노출 키 0건 유지.
    운영 서버 접속·설정 변경은 에이전트 소관이 아니다.
  affects: [W0-1b, W0-5, W0-15]
  note: "값은 이 파일에 적지 않는다 (금지 #2)"

- id: D-245
  title: "probe_guardianx 로컬 복제본 삭제"
  status: decided
