- id: D-356
  title: "객체저장(영상) 백업 — **운영이 아니라 기능 사안**이다"
  status: decided
  raised_by: "세종(기획) 2026-09-10 · 대표 위임"
  decision: |
    ▣ 판정: 영상 백업은 운영 항목이 아니라 **제품이 하는 일 자체**다.
      재난안전 시스템이 「무슨 일이 있었다」는 기록은 남기고 **그 장면은 못 내놓는다면**,
      그건 기능 결함이다. 계약 F-11(보고서)·C-2(영상 구간 참조)가 그 전제 위에 선다.
    ▣ ★ **닿지 못한 것과 백업이 없는 것은 다르다.** 직전 턴은 minio.invalid 라
      「미측정」으로 적었고 그것은 옳았다 — 다만 미측정이 「없어도 된다」로 읽히면 안 된다.
      [실측 2026-09-10] 갈라 보니: **백업 코드는 있었고**(ops_backup.mirror_objects),
      **복구 코드는 없었다.** 뜨는 것과 되살리는 것은 다른 일이다.
    ▣ 네 지시의 이행:
      ① 무엇을 뜨는가 → **이벤트에 묶인 것만**(`--object-scope event_bound` 기본).
         버킷 전량은 크고 비싸고 제품에 맞지도 않는다 — 증빙이 되는 것은
         「그 이벤트의 그 장면」이고 그것을 아는 표가 EventClip(D-306)이다.
         ★ 그래서 영상 백업과 EventClip 이 **한 덩어리**라는 지시가 맞았다.
      ② 어디에 → **아직 안 정했다.** 지금 목적지는 저장소 안이고 그것은 백업이 아니다.
         목적지는 배포 구성에서 정해지며, 실측 안 한 경로를 매뉴얼에 적으면
         **매뉴얼이 거짓말을 시작한다**(D-286). 「해 봤다」와 「어디에 둘지는 아직」을
         함께 적는다.
      ③ 복구해 본다 → **했다.** [실측] 대상 3개 · 되살림 3개 · **해시 일치 3개**.
         원본 버킷에는 쓰지 않았다(새 버킷 gx-restore-* 로만 간다 — DB 복구가
         gx_restore_* 임시 DB 로만 가는 것과 같은 규약).
      ④ 보존 기간 → **90일**(`RETENTION_DAYS`). 계약이 정한 수가 아니다(D-280).
         정하지 않으면 **디스크가 정책을 대신 정하고**, 디스크가 정하는 방식은
         「가득 차면 백업이 멈춘다」이다.
    ▣ ★ 함께 얻은 것 — 백업이 **이미 잃어버린 것을 드러낸다**:
      「이벤트에 묶였는데 버킷에 없는 객체」를 건수로 낸다. DB 는 영상이 있다고
      말하는데 그 장면이 실제로는 없는 상태이고, 그 수가 0이 아니면 그것은 백업
      문제가 아니라 **이미 잃은 것**이다. 복구해도 안 돌아온다. 음성 대조로 확인했다.
    ▣ 운영 사실 인정: `pg_dump 17.7` 로 서버 `18.1` 을 못 뜬다 —
      **백업은 뜨는 자리가 정해져 있다.** 매뉴얼 §4-B-1 에 굵게 적었다.
  enforced_by: |
    · scripts/ops_backup.py — event_bound 기본 · RETENTION_DAYS · missing_count 출력
    · scripts/ops_restore.py --objects-only — **해시로** 대조한다. 「파일이 생겼다」는 성공이 아니다
    · docs/agent/evidence/D-356/restore_objects_run.md — 실행 기록(명령 그대로)
    · docs/agent/runbook/설치운영매뉴얼_v0.1.md §4-B
  affects: [D-306, D-354, D-286, D-301]

- id: D-357
  title: "금지구역 문제는 **바깥에서 푸는 것이 첫 수단**이다 — 예외는 마지막"
  status: decided
  raised_by: "세종(기획) 2026-09-10 · 대표 위임"
  decision: |
    ▣ [실측 인정] drone-status 200(17,416B) → 401 · etri-mock/scenarios 200 → 401 ·
      REACHED_WITH_DATA **2 → 0** · forbidden-zone 게이트 초록 · **delivery·dj-core 무수정.**
      §0.4 보안 예외를 **승인해 두었으나 쓰지 않았다 — 가장 좋은 결말이다.**
    ▣ 원칙 확정: 금지구역 문제는 **우리 층 미들웨어**에서 푸는 것이 첫 수단이다.
      예외는 마지막이고, 마지막이 필요 없었다는 사실 자체가 그 처리의 값이다.
    ▣ ★ 그리고 「그 자리에 못 생기게 하는 것」이 「생긴 것을 잡는 것」보다 언제나 낫다 —
      관문을 캐시보다 **바깥**에 두고 미들웨어 **순서 자체를 시험이 단언**하게 한 것이
      그 예다. 착시 ⑦(캐시)을 시험으로 잡는 대신 **설계로 없앴다.** 정본으로 올린다.
    ▣ [2026-09-10 이 원칙의 두 번째 적용] D-364 의 orders 4자리도 같은 방식으로 닫았다 —
      `backend/orders/` 를 한 줄도 고치지 않았다.
  enforced_by: |
    · backend/common/access_gate.py — AUTHN_REQUIRED_PATHS (우리 층 · §0.4 무수정)
    · backend/tests/test_access_gate.py::GateIsOutsideTheCacheTest — 순서를 시험이 단언한다
