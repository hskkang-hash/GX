- id: D-374
  author_tree_id: "지시서 D-372"
  title: "용량 측정 ①② — **가정을 실측인 척하지 않는다.** 견적은 [실측]×[가정] 이고 그 곱은 [산출]이다"
  status: decided
  raised_by: "세종(기획) 2026-09-11 착수 승인 · 판정 위임"
  decision: |
    ▣ 승인된 둘을 붙였다. 그리고 **지시가 가정한 전제가 이 환경에 없었다** — 그것부터 적는다:
      [실측 2026-09-11] `DetectionEvent` **0건** · `EventClip` **0건** · `StreamMonitor` **39대**.
      즉 지시 ①의 「39대 **실제 쓰기량**에서」가 성립하지 않는다. 쓰기량이 없다.
      ★ 「0건」을 「쓰기량 0」으로 적지 않는다 — 그것은 **아직 안 재진 것**이다 (D-301).

    ▣ 그래서 ①을 둘로 갈랐다:
        [실측]   이벤트 행 하나의 바이트 — **직접 써 보고 표 크기 변화를 잰다.**
                 트랜잭션 안에서 재고 되돌린다(측정기가 재는 세상을 바꾸지 않는다).
                 `pg_total_relation_size` — 인덱스·TOAST 포함. 데이터만 세면 견적이 작아지고,
                 작게 잡은 견적은 현장에서 디스크가 찬다
        [가정]   대당 이벤트율 — **우리가 정하는 수가 아니다.** 값 하나를 내면 그것이
                 답으로 읽히므로 **시나리오 표**(시간당 1·6·60·600건)를 낸다
        [미측정] 객체저장(영상) — `minio.invalid` 로 닿지 못하고 클립도 0건이다.
                 필요한 것을 함께 적었다

    ▣ ★ **측정기를 먼저 의심했다** (D-350). 두 번 재니 1081 · 1344 바이트/건이 나왔다 —
      표는 8KB 페이지로, 인덱스는 덩어리로 자라기 때문이다. **한 번 재고 그 수를 견적에
      넣으면 25% 를 그냥 틀린다.** 그래서 3회 반복해 `최소·중앙·최대`를 다 내고,
      **견적에는 최대를 쓴다.**

    ▣ ②의 이름은 **「추론 제외 상한」**이다. 그 이름이 이 수의 한계를 말한다 —
      GPU 추론도 ffmpeg 디코딩도 RTSP 수신도 **이 수에 들어 있지 않다.**
      `--inference-ms` 로 추론 자리에 고정 지연을 끼울 수 있고, 기본 0 은
      「추론이 공짜」가 아니라 **「이 수에 추론이 안 들어 있다」**는 뜻이다.

    ▣ [실측 · commit 0ff5279 · cpu 8 · GPU 없음]
        카메라 **39대** · 이벤트 행 **950바이트/건**(폭 884.7~950.3 · 3회)
        [가정] 시간당 6건  → 39대 **1.81 GB/년**
        [가정] 시간당 60건 → 39대 **18.14 GB/년**
        추론 제외 상한 **51.3건/초** (1 프로세스 · 평균 19.5ms · p95 24.3ms)
        투입 60건 = 저장 60건 · **드롭 0.00%**
        종료 조건 셋(드롭 1% · p95 1초 · 계약 AC) — **걸린 것 없음** (이 표본 크기에서)
      ★ 위 GB/년은 **DB 만이다.** 영상이 빠져 있고, 실제 견적에서 큰 쪽은 영상이다.
        이 수를 「저장 견적」으로 옮기면 그 순간 착시가 된다.

    ▣ 지시서에 없던 것을 스스로 붙이지 않은 직전 턴의 판단을 유지한다 —
      ④(GPU 추론)는 환경 대기이고, 없는 환경에서 낸 수를 계단이라고 부르지 않는다.
  enforced_by: |
    · scripts/capacity_measure.py — 자기시험 9건(양성 4) · 환경·커밋 해시 기록 · 종료 조건 셋
    · docs/agent/evidence/D-372/capacity.json — 측정 원본
  affects: [D-280, D-284, D-301, D-322, D-350, D-354, D-365]

- id: D-375
  author_tree_id: "지시서 D-371 ②"
  title: "운영 자동화 — **도구는 이미 있었다. 없던 것은 주기다.** 감시는 켜고, 백업은 끈 채로 등록한다"
  status: decided
  raised_by: "Code 2026-09-11 (지시 D-371 표적 ② 이행) · 세종 판정 위임"
  decision: |
    ▣ ★ **정정 보고** (D-371 ④). 착수 전에 뒤졌더니 셋 다 있었다:
        scripts/ops_backup.py · ops_restore.py · ops_monitor.py (2026-09-09 · D-354 ①)
      **만들 것이 없었다.** 「백업 스크립트가 있다」와 「백업이 매일 돈다」는 다른 사실이고,
      **사람이 손으로 부르는 백업은 바쁜 날 안 돌아간다.** 그 간격만 메웠다.

    ▣ 크론이 아니라 **celery beat** 에 둔다. 크론은 운영 호스트의 것이라 저장소에
      커밋해도 문서로 남고, **문서는 기억을 요구한다**(D-286). beat 는 제품과 같은
      수명을 가지므로 앱이 뜨면 감시도 뜬다.

    ▣ ★ **감시는 켜고 백업은 끈 채로 둔다 — 그리고 그것이 판단이다.**
      백업은 **어디에 얼마나 오래 쌓을 것인가**를 정해야 도는 일이고, 그 답은 고객
      환경마다 다르다. 기본값으로 켜면 **우리가 남의 디스크에 대해 그 답을 정하는 것**이 된다.
      (「경보를 보내는 자리는 여기서 정하지 않는다」는 `ops_monitor.py` 의 판단과 같은 계열)
      · 그래도 **주기는 등록해 둔다.** 빼 두면 켜는 날 아무도 이 자리를 못 찾는다.
        등록해 두면 「꺼져 있다」가 로그에 매일 한 줄로 보인다 — 조용한 부재보다 낫다(D-290).
      · 켜졌는데 `OPS_BACKUP_DIR` 이 비면 **판정 불가로 멈춘다.**
        **어디에 뜰지 모르는 백업은 백업이 아니고**, 기본 경로를 지어내지 않는다(D-280).

    ▣ ★ 자동 복구는 하지 않는다. **복구를 해 보지 않은 백업은 백업이 아니지만**(D-354 ①),
      복구는 운영 DB 를 건드리는 일이라 사람이 한다 — 불변 제약(운영 DB 직접 변경 금지).

    ▣ 감시가 터지거나 도구를 못 찾으면 **`UNKNOWN` 이지 `OK` 가 아니다.**
      감시가 죽은 것을 초록으로 적으면 감시가 없는 것만 못하다 (D-301).

    ▣ [실측 2026-09-11 · 한 번 돌려 봄] 감시 `UNKNOWN` —
      신호 7개 중 6개 OK, `latest_event_age_min` 만 UNKNOWN(**이벤트가 0건이라 「밀렸다」가
      아니라 「비었다」**). 백업 `SKIPPED` — 꺼져 있다고 **적고** 돌아갔다.
  enforced_by: |
    · backend/common/ops_tasks.py — ops_monitor_beat · ops_backup_beat · ops_status()
    · backend/config/celery.py — beat 등록(감시 5분 · 백업 03:30, 태스크가 스스로 꺼져 있다)
    · backend/config/settings.py — OPS_BACKUP_SCHEDULE_ENABLED(기본 False) · OPS_BACKUP_DIR
    · docs/agent/evidence/D-373/monitor_last.json — 마지막 판정
  affects: [D-280, D-284, D-286, D-290, D-301, D-333, D-354]

- id: D-376
  author_tree_id: "(이 트리 고유 — 지시서에 대응 항목 없음)"
  title: "프런트 의존 설치본이 저장소와 어긋난다 — **타입오류 3229건.** 화면 캡처보다 먼저 풀 것"
  status: decided
  raised_by: "Code 2026-09-11 (D-373 착수 중 실측)"
  decision: |
    ▣ 화면 셋을 얹고 타입 검사를 돌리려다 알게 된 것 [실측 2026-09-11]:
        호스트에 `frontend/node_modules` 가 **없다**. 있는 것은 컨테이너 `gx-fe-build` 뿐이고,
        그 안의 `rj-core`(사내 private · git+ssh) 판이 저장소 코드와 **어긋난다.**
        `npx tsc --noEmit` → 저장소 전체 **3229건**. `App.tsx` 의 첫 오류들이
        「Module 'rj-core' has no exported member 'AddUser'」 류다.
        ★ **새로 얹은 `features/dsm/` 의 오류는 0건**이다 — 어긋난 것은 기존 화면과 rj-core 다.
    ▣ 판정: 이것은 **이번 턴의 결함이 아니라 발견**이다. 그리고 화면 캡처(D-347 · 0장)를
      푸는 데 **이것이 먼저**다 — 빌드가 안 서면 브라우저 E2E 도 안 선다.
    ▣ ★ 고치지 않았다. `rj-core` 는 §0.4 이관 자산이고, 판을 맞추는 일은 **버전 판정**이지
      코드 수정이 아니다. 어느 판이 정본인지는 우리가 정할 수 없다 —
      **남의 뿌리는 대장에** (D-358 원칙 그대로).
    ▣ ⚠ 이 수(3229)를 「우리 코드의 빚」으로 읽지 말 것. 분모가 다르다.
  enforced_by: |
