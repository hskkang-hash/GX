- id: D-377
  author_tree_id: "지시서 D-377"
  title: "초록의 착시 ⑨ — **배선의 착시.** 「만들어진 것」과 「켜진 것」은 다르다"
  status: decided
  raised_by: "세종(기획) 2026-09-12 · 실측은 Code"
  decision: |
    ▣ 착시 여덟 형에 아홉째를 더한다:
       ①부착률 ②시나리오 수 ③모수와 술어 ④탐지기 자체 ⑤환경 ⑥스키마 ⑦캐시 ⑧봉투 **⑨배선**
       · ⑥(스키마)은 **필드가 있으면 기능이 있다**고 읽는 것이었다
       · ⑨(배선)은 **코드가 있으면 동작한다**고 읽는 것이다. 한 단계 위다
       · 시험은 함수를 직접 불러 통과시킨다. **운영은 그 함수를 부르지 않는다.** 둘 다 초록이다

    ▣ ★ 이건 인수 자산의 성질이다. 전 개발자는 **만들어 놓고 켜지 않았다.**
      K3·모니터링·백업 셋이 같은 모양이었으므로 **전체를 전수 조사했다.**

    ▣ ★ [실측 2026-09-12 · scripts/verify_dormant.py] — 세 술어를 **따로** 센다.
      합치지 않는 이유는 **고치는 방법이 다르기 때문**이다: ㉠은 배선, ㉡은 등록, ㉢은 데이터.

          ㉠ 호출 없음   모수 1550   → **314건**
             (backend/** 함수 정의 · 사적 밑줄·프레임워크 훅 46종·진입 데코 23종 제외)
             술어: **운영 코드가 그 이름을 한 번도 부르지 않는다** (시험만 부르는 것도 여기다)
          ㉡ 주기 없음   모수   41   → **11건** → 켠 뒤 **10건**
             (celery 태스크 전수 + **주석으로 꺼진 beat 항목**)
          ㉢ 설정 빔     모수   30   → **2건**   (+ 접지 못한 13건은 모수 밖 — 「모른다」)

          합계 326건 · §0.4 금지구역 128건(잔여 분모에서 제외) · **우리 관할 198건**

    ▣ ★★ **판정기를 두 번 고쳤다 — 두 번 다 0건이 거짓말이었다** (D-350)
      ① ㉢ 첫 판이 **0건**을 냈다. 「빈 설정이 없다」가 아니라 **literal_eval 이
         env("X", default=…) 를 못 접은 것**이었다 — 이 저장소의 설정은 거의 전부
         그 모양이다. 착시를 잡으러 만든 도구가 착시를 하나 더 만들 뻔했다.
      ② 그리고 settings.py 만 읽으면 **표를 놓친다.** K3 역할↔프리셋 매핑은
         config/k3_roles.py 에 있고 settings 가 import 해 올린다. D-377 의 ㉢ 은
         「설정·표가 비어」이지 「settings.py 가 비어」가 아니다. import 를 따라간다.
      ★ 접지 못한 것은 **모수 밖으로 낸다.** 「비었는지 모른다」를 「비지 않았다」로
        읽으면 그것이 조용한 면제다(D-263 계열). 못 본 것은 못 봤다고 센다.

    ▣ ★ **켠 것이 실제로 도는 것을 시험이 본다** — 그리고 그 시험이 **첫 실행에
