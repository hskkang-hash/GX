- id: D-393
  author_tree_id: "Code 자발 (지시서 없음 · 현재 상태 분석에서 나왔다)"
  title: "**켜기 전에 판정기를 의심했다** — ㉮ 41 중 셋은 처음부터 켜져 있었다"
  status: decided
  raised_by: "Code 2026-09-14 (D-350 · D-385 계열)"
  decision: |
    ▣ 사실 [실측 2026-09-14]: D-388 이 낸 ㉮「켜야 할 것」 41건의 맨 위 셋
      (`backend/config/celery.py` 의 `init_worker_process` ·
       `close_db_connections_before_task` · `close_db_connections_after_task`)은
      `@worker_process_init.connect` 등으로 **처음부터 배선돼 있었다.**
      **켜라고 낸 것이 이미 켜져 있었다.**
    ▣ 구멍의 자리: `ENTRY_DECORATORS` 는 **이름 집합**이라 `@receiver` 는 잡지만
      `@sig.connect` 는 못 잡는다 — `_dec_names` 가 내는 이름 `{connect, worker_process_init}`
      둘 다 그 집합에 없다. **이름이 아니라 모양인 배선**이 통째로 빠져 있었다.
    ▣ ★ gunicorn `server-hook` 오답(D-388 ③)과 **같은 모양**이다 — 프레임워크가 부르는
      자리를 「아무도 안 부른다」로 읽는다. 그때는 **파일 이름**으로 메웠고 이번에는
      **배선 형태**로 잡는다. 파일 이름으로 메웠으면 `celery.py` 에서 다시 뚫렸을 것이다:
      그 파일에는 배선된 함수와 배선 안 된 함수가 **함께 있다.**
    ▣ 모수 정정 [실측]: ㉠ 314 → **311** · ㉮ 41 → **38** · 우리 관할 198 → **195**.
      저장소 전수에서 `@<x>.connect` 배선은 **정확히 3건**이고 셋 다 ㉮ 에 있었다.
    ▣ ★★ 그리고 래칫의 **말**을 갈랐다. 기준선에서 빠지는 길은 둘이고 전혀 다른 일이다:
        ① **켜졌다**          모수에 있는데 운영이 이제 부른다 — **진척이다**
        ② **자고 있지 않았다** 모수에서 빠졌다 — **판정기가 틀렸던 것이지 우리가 한 일이 없다**
      합쳐서 「켜졌다」로 적으면 **판정기 정정이 진척으로 둔갑한다.** D-385 가 금지한 모양이다.
      게이트가 이제 둘을 따로 출력한다. **이번 턴에 켠 것은 0건이다.**
    ▣ ★ 모수에서 빼는 일은 **좁게** 한다: `ENTRY_DECORATORS` 에 `"connect"` 를 넣지 않고
      **점 뒤가 `connect` 인 데코레이터**만 본다. 넓게 빼면 진짜 잠든 것이 조용히 사라진다(D-301).
  enforced_by: |
    · scripts/verify_dormant.py :: _wired_by_signal() · 자기시험 출생 표본 ③ (양성 1 · 음성 2)
      ★ 같은 파일에 `signal_not_wired` 를 두어 **파일째 면제가 아님**을 시험이 본다
    · backend/tests/test_dormant_wiring.py :: test_celery_signal_hooks_are_not_reported_dormant
