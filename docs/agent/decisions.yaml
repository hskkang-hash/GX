- id: D-419
  author_tree_id: "세종 지시서 2026-09-22 §2 D행 · §4 착수·병합 규약"
  title: "차선 D 병합 — **커널은 섰고 문이 없었다.** 게이트가 그것을 잡았고, 조율자가 문을 냈다"
  status: decided
  raised_by: "차선 D 보고 2026-09-04 → 조율자 병합·검증"
  decision: |
    ▣ 차선 D 가 지은 것 [실측 2026-09-04]
      · **M1 목록** — 「내게 온 이벤트」의 정본은 **발송 기록**이다(K2 `list_deliveries`).
        실제 응답 **200 · 50건**으로 빈 화면이 아님을 보였다.
      · **M2 상세** — 스냅샷 참조 · 구간 티켓(**참조까지만** · 계약 11조) · 카메라 주소 ·
        상태 전이(서버가 준 `allowed_next` 만 그린다). 전이 실호출 200 · audit 138959.
      · **M3 회신 · 재알림** — **커널 면만.** 문(HTTP 라우트)은 차선 C 의 파일이라 못 열었고,
        **죽은 길 위에 화면을 얹지 않았다**(P-15). 옳은 멈춤이다.
      · 프런트 타입검사 exit 0 · 빌드 exit 0 · 시험 151 passed.

    ▣ ★★ 그리고 **`dormant` 게이트가 병합을 멈춰 세웠다** — 그것이 이 결정문의 핵심이다
      `kernels/k1_event/field_reply.py::list_field_replies` 가 **아무도 안 부르는 채로**
      들어오려 했다. D-377 의 규약은 「새로 만드는 것은 **켜진 상태로 태어나야 한다**」이고,
      게이트는 정확히 그 자리에서 빨개졌다.
      → 조율자가 **문을 냈다**(기능이 아니라 배선이다 — 판정·문지기·감사는 전부 커널에 있다):
            POST /api/dsm/events/{id}/field-reply
            GET  /api/dsm/events/{id}/field-replies
        진입면 대장(`EVENT_ENTRY_SURFACE`)을 **같은 커밋에서** 늘렸다.
      ★ 처음엔 응답에 `at`·`actor` 를 실었다 — `FieldReply` 에 **없는 칸**이다. 지어낸 칸을
        읽는 라우트는 부르는 즉시 죽는다(D-410 이 같은 자리에서 이미 한 번). 실재하는 칸만 낸다.
      ★ 그리고 App 이 커널 **서브모듈**을 직접 가져오자 계층 시험 5개가 한꺼번에 빨개졌다 —
        옳은 빨강이다(D-278). 읽기 면도 커널 `__all__` 에 올려 **공개 면으로만** 소비한다.

    ▣ ★ 차선 D 가 잡은 것 셋 (전부 [실측] · 전부 남은 구멍)
      ① `GET /api/dsm/deliveries` 에 **수신자로 좁히는 인자가 없다** — 커널에는 `recipient_id`
        가 있는데 App 이 안 넘겼다. 즉 「내게 온 것」을 **서버가 거를 수 없었다.**
        차선 D 는 화면이 대신 거르지 않고 **띠로 적었다** — 옳다(거르면 페이지 밖 발송이
        없는 것이 된다). 조율자가 `mine` 을 이었다: **사번을 받지 않는다.** 요청은 「나」라고만
        말하고 **좁히는 값은 서버가 정한다** — 사번을 받으면 남의 수신 이력을 물을 수 있다.
      ② 탐침 계정 `gxprobe_e2e` 는 **역할이 0개**다(발송 기록 0건). 지시서가 「operator 계열」
        이라 적은 것은 사실이 아니었다. **계정을 만들어 덮지 않고 재고 보고했다** — 옳다.
      ③ 스냅샷 **바이트를 내보내는 라우트가 없다.** 프리사인드 URL 을 화면에서 만들지 않았다
        (**무계정 링크 금지**). U3 #3 이 ●가 되려면 **개인영상정보 반출 표면 하나를 여는
        판정**이 먼저다 — 조각을 일부러 내지 않은 것이 옳다(계약 11조 계열).

    ▣ ★ **판별기의 남은 반쪽** — 09-22 에 고친 것과 같은 계열
      `_writes_to_db` 의 위임 추적이 **같은 모듈의 `_` 헬퍼**만 따라갔고, `renotify` 는
      다른 모듈의 공개 이름 `send` 에게 시킨다 → **읽기로 봤다.** 부르는 이름을 그 모듈의
      이름 공간에서 찾도록 넓혔다(여전히 한 단계만).
      ★ 선등재가 없었으면 **조용히 통과했을 자리**다 — 선등록(D-417)이 그 사이를 메웠다.

    ▣ A2 접두 **한 개** — `/api/stream-monitors/` 승격 (지시 §4-4 · 조율자)
      반경을 **먼저 쟀다**: 라우트 28건 · 화면이 실제로 부르는 호출 3건 · 시험 2파일 [실측].
      다음 후보 `/api/handover/`(25건)는 **화면이 한 번도 안 부른다** — 켜도 지나가는 것이
      없어 확인이 안 된다. **지나가는 쪽을 먼저 켠다.** 전 시험 재실행에서 깨진 것 0건.

    ▣ ★ 대장 넷이 병합을 잡았고, 넷 다 등재로 닫았다 (조율자 몫)
      · `verify_dead_fields` — `NotificationRule.role·zone·channels` 가 **이제 쓰인다**.
        낡은 선언을 지웠다(남으면 다음에 죽는 필드를 그 이름이 가린다).
      · `verify_threshold_table` — 새 매직 넘버 **8건**. 여섯은 「부르는 쪽이 정하는 기본값」,
        둘(재알림 10분·24시간)은 **표 ① 후보**이나 지금은 인자로 받는다 — 사유 그대로 적었다.
      · `verify_tool_selftest` — `verify_seed_p20` 에 **출생 표본**을 박았다(착수 전 0·0·0·0 →
        시드 뒤 120·20·20·2 가 그 도구의 양·음 두 갈래다).
      · `verify_commit_trace` — **판정기가 제목을 안 읽고 있었다.** 이 저장소의 커밋 규약은
        번호를 `feat(D-4xx):` 로 **제목에** 단다. 직전 커밋(1da8468)은 규약을 지켰고
        판정기의 눈이 좁았다 — 제목도 읽게 고치고 자기시험에 두 갈래를 더했다(D-350).

    ▣ ★★ **게이트 10종 전부 통과 · 실패 0 · 대기 0** [실측] — 서버를 띄우고 재니
      `route-alive` 31건 전부 2xx · `contract-route-reach` 도 초록이다.
      ★ 그 과정에서 **`/api/media-data(/)` 500 두 자리의 원인을 갈랐다**: 저장소(MinIO)를
        붙이지 않으면 500, 붙이면 2xx. **코드의 상시 결함이 아니라 저장소가 죽었을 때의
        행동**이고, 그것이 정확히 UX-10 이 재려는 것이다. 대장에 그 대조를 적었다.
    ▣ [실측] 단위 **611 passed · 1 skipped** · E2E **23 passed** · `verify_*` **37종 exit 0**
      (7종은 서버·DB·MinIO 미기동으로 exit 2 = 판정 불가) · 화면 **21장** 재촬영 통과.
  enforced_by: |
    · backend/tests/test_tenant_isolation.py — WRITE_PROBES 9종(reply_from_field · renotify 포함)
    · backend/tests/test_f05_event_api.py — EVENT_ENTRY_SURFACE 에 현장 회신 두 문
    · scripts/verify_commit_trace.py
    · scripts/verify_threshold_table.py
    · scripts/verify_dead_fields.py
    · docs/agent/evidence/D-346/ga_readiness.yaml :: UX-10 (저장소 죽음의 실측 대조)
  affects: [D-278, D-290, D-301, D-310, D-325, D-350, D-377, D-410, D-417, D-418]

- id: D-420
  author_tree_id: "세종 지시서 2026-09-24 §1(P-25·P-26) · §5-1 조율자 선행 · PRD v2.5"
  title: "분모를 105 에서 120 으로 늘렸다 — 그리고 **스냅샷의 문을 서명 URL 없이** 냈다"
  status: decided
  raised_by: "조율자(Code) 2026-09-24 · 2파 착수 전 선행 작업"
  decision: |
    ▣ **P-26 — PRD v2.5 신규 15절 등재.** `ga_readiness.yaml` 에 15절을 **미착수**로 넣었다
      (⑦ 7 · ⑧ 3 · ④ 2 · ② 1 · ⑤ 1 · ⑥ 1). 각 절에 `origin: PRD-2.5` · `why` · `hand: in`.
      두 수를 나란히 적는다 [실측 2026-09-24 · `verify_ga_readiness.py`]:

          105절 기준  상용 가중 **60.8%** · 손 안 도달율 **73.1%** (68/93)
          120절 기준  상용 가중 **55.7%** · 손 안 도달율 **63.0%** (68/108)

      세종 산술 55.7% [추정]과 **자릿수까지 같다** — 대체할 것이 없었다.
      **다음 턴부터 120 이 유일한 분모다.** 래칫(D-311)은 이 턴에 한해 예외 — 사유 PRD-2.5.
      `remaining_26.md` → `remaining_40.md` (§2-7 에 15절).

    ▣ ★ 등재가 **판정기의 한 줄을 거짓말로 만들었다** — 그리고 그것이 이 절의 값이다
      `hand` 는 그동안 「잠김·미측정」에만 붙었다. 15절이 **미착수인데 `hand: in`** 으로
      들어오자 마지막 요약 줄이 「미착수 34 + 잠김·미측정 중 손 안 **22**」가 됐다 —
      합이 56 인데 남은 절은 40 이다. 분모는 멀쩡했고(설계·손 밖만 뺀다) **읽는 사람만
      틀렸을 줄**이다. 상태별로 갈라 세도록 고치고, 두 몫의 합이 남은 수와 다르면
      경고를 내게 했다. **수를 고친 것이 아니라 수를 설명하는 문장을 고쳤다.**

    ▣ **P-25 — 스냅샷 바이트 라우트 하나.** `GET /api/dsm/events/{id}/snapshot`
      · JWT · `@tenant_scoped` · `Content-Disposition: inline` · `no-store` · `nosniff`
      · **서명 URL 을 만들지 않았다**(무계정 링크 금지). 계정 없이 열리는 링크는
        한 번 새면 회수할 수 없다 — 라우트 하나가 그 링크보다 길지만 회수할 수 있다.
      · **소인**: 테넌트명 · 이벤트 번호와 시각 · 열람 시각을 JPEG 아래 띠에 그린다.
        「저장은 못 막는다. 그래서 출처를 남긴다.」
      · ★ **소인을 못 찍으면 내보내지 않는다**(500). 글꼴이 없을 때 원본으로 되돌아가면
        라우트가 준 것은 편의뿐이고 남긴 것은 없다 — 그리고 그것은 조용하다(D-284).
      · 상태를 넷으로 **나눈다**: 401(익명) · 404(없는/남의 이벤트 · 프레임 없음) ·
        503(저장소 연결 안 됨) · 500(소인 실패). 뭉치면 어디를 고칠지 알 수 없다(D-290).

    ▣ [실측 2026-09-24 · 살아 있는 서버] 익명 GET **401** · PROPFIND **405(Allow: GET)** ·
      없는 문 PROPFIND **404** — 라우트가 실재하고 삼키지 않는다(D-410 판별자).
      실 저장소 왕복: 원본 29,273B → 소인 37,272B · 해시 다름 · JPEG 유효.
      타 테넌트 8명 중 **7명 404**, 1명은 `rin_superuser`(전역 관리자)라 통과 —
      `get_scoped_or_404` 가 전역 관리자에게 필터를 걸지 않는 **기존 선언된 행동**이고
      이 라우트가 새로 연 구멍이 아니다. 적어 둔다: **가리지 않는다.**

    ▣ **쓰기 면 2파 선등록 넷** (지시 §2 차선 규칙 · 착수 전 한 번에) —
      `drill.set_drill_mode` · `bulk_register.apply_camera_import` ·
      `k2_notify.send_heartbeat_digest` · `k1_event.append_evidence_hash`.
      「회신」은 **넣지 않았다** — `reply_from_field` 는 09-04 에 열렸고 probe 가 이미 있다.
      이번 파의 C 차선이 얹는 것은 화면이지 새 쓰기 면이 아니다. **없는 것을 등재하면
      대장이 스스로를 부풀린다.**

    ▣ ★ 시험이 **거짓 초록 하나를 스스로 드러냈다** [실측 2026-09-24]
      HTTP 를 한 번 때린 시험이 스레드에 요청을 남겼고, dj-core 의 `CustomManagerGroup` 이
      그 익명 요청자로 **모든 조회를 좁혔다.** 그러자 뒤의 시험들에서 이벤트가 통째로
      사라졌고 — **404 를 기대하던 격리 시험(규약 ②)이 그 상태에서 초록이었다.**
      격리가 아니라 오염이 낸 초록이다. `tearDown` 에서 스레드 요청을 비운다.
      두 표본이 F-04 중복 억제로 **같은 행으로 접히던 것**도 함께 갈랐다(다른 스트림에 세운다).

    ▣ **게이트 자격증명이 죽어 있었다** — `contract-route-reach` 가 「토큰을 못 받았다 ·
      판정 불가」였다. `.env.gates` 의 값과 개발 DB 가 갈렸고, 되돌리려 하자 dj-core 가
      **비밀번호 재사용**을 거절했다. 새 값을 세우고 `.env.gates`(gitignored)를 갱신했다.
      ★ 그 값에 `#` 이 있으면 셸 소싱(`. ./.env.gates`)이 **거기서 잘라 먹는다** —
        오늘 실제로 그 잘린 값으로 한 번 로그인에 실패했다. 새 값에는 `#` 을 쓰지 않는다.
