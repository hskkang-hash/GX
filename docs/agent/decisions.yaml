  decision: |
    ▣ 사실: 지시서가 도착했을 때 저장소는 이미 D-393~397 을 쓰고 있었다(같은 날 작업분).
      D-380 이 정한 대로 **저장소가 정본**이고 지시서 번호는 제안이다. 덮지 않고 잇는다.
    ▣ 대응표:
        지시서 D-393 사용자 6종 PRD 등재  → 저장소 **D-401**
        지시서 D-394 이벤트 상태 4값       → 저장소 **D-399**  ← 이번 턴 이행
        지시서 D-395 모바일 3장 + 왕복      → 저장소 **D-400**
        지시서 D-396 오탐 처리             → 저장소 **D-402**
        지시서 D-397 평상 운영 3건          → 저장소 **D-403**
        지시서 D-398 HWPX                 → 저장소 **D-404**
        지시서 D-399 화면 순서 재조정        → 저장소 **D-405**
