- id: D-423
  author_tree_id: "세종 지시서 2026-09-24 §2 E3행 · 시드 U2·U4 · OPS-02·07·08·10·12"
  title: "차선 E3 병합 — **해 본 기록**이 셋 생겼고, 재 보니 없던 것이 둘이었다"
  status: decided
  raised_by: "차선 E3 보고 2026-09-24 → 조율자 병합·검증"
  decision: |
    ▣ **시드 U2·U4 — 진짜 사람 둘.** ORM 우회가 아니라 `POST /api/v1/user/create-user`
      **200** 으로 심었다. 착수 전 `fire_admin` 0명 · `view_only_-_anyang` 0명 →
      착수 후 각 1명 · critical 수신자 12 → **14명**. 두 계정으로 **실제 로그인·`/me`·
      logout 까지** 확인했다. 그동안 탐침 계정에 역할이 0이라 **역할별 화면 판정 자체가
      불가능**했다 — 그 벽이 내려갔다.

    ▣ **OPS-08 — 해 본 기록이 생겼다** [실측 · 381초]
        세운 직후 표 220 · head 0027 → `migrate stream_monitors 0019` → 표 **214**
        (0020 의 칸 2개 사라짐) → 다시 밀기 → 표 **220** (칸 2개 돌아옴). 훈련 DB 는 지웠다.
      직전까지 이 칸이 「미측정」이던 사유가 정확히 이것이었다 — **문장은 있고 해 본 적이
      없었다.** 해 본 적 없는 절차는 절차가 아니다.

    ▣ **OPS-12 볼륨 갈래 — 닫혔다.** 덤프 4,497,801B 를 **다른 볼륨**에 두고 **다른
      컨테이너**에서 `pg_restore --list` 목차 3,337줄로 읽어 냈다. 남은 갈래(다른 호스트)는
      배포 구성이 정한다. **절 제목이 둘을 말하므로 상태는 아직 미착수다** — 쪼개면 볼륨
      쪽이 숫자가 되지만 **분모를 이번 턴에 또 늘리지 않는다**(다음 턴 제안으로 올린다).

    ▣ ★ **회색 둘이 빨강으로 갈렸다 — 그것이 이번 턴의 값이다**
      · **OPS-07**: 수집기 6개 전수 중 컨테이너 stdout **5개가 `max-size`·`max-file`
        둘 다 없다 → 무한 적재.** 파일 핸들러 0개. 보존 정책이 있는 것은 DB 감사 로그 하나뿐.
        「미측정」에서 「미착수」로 내려왔다 — 못 잰 것이 아니라 **재 보니 없었다.**
      · **OPS-10**: 발송처 표는 섰고 **모든 규칙의 채널이 `log` 다 — 사람에게 도달하는
        경보 0건.** `critical/fire_user` 받을 사람 0명 · info·warning 규칙 0건.
        대표 결정 ①(알림 채널) 없이는 못 넘는 자리이고, **표를 세운 것까지가 우리 몫**이었다.

    ▣ **OPS-02 — 못 쟀고, 옮기지 않았다.** 사내 git `192.168.0.22` 의 22·9418 **둘 다 불통** ·
      `SSH_AUTH_SOCK` 없음 · 개인키 없음 [실측]. 이미 있는 이미지를 다시 쓰는 것은
      **재현이 아니라 재사용**이다(착시 ⑤). 「손 밖」 후보로 **올렸을 뿐 옮기지 않았다**
      (D-389 — 부재 주장도 근거가 필요하다). 컨테이너는 아무것도 지우지 않았다:
      지우기 전에 절차를 적어 보니 **지워서 얻을 것이 없었다.**
      ★ HWPX 도 같은 형으로 안 만들었다 — 저장소에 `.hwpx` 0건 · 파서 0개 · 한컴 없음.
        만들어도 「만들었다」이지 **「열린다」가 아니다.** 대표 결정 ③ 대기.

    ▣ ★★ **제품 결함 하나를 실제로 발생시켜 찾았다 — 등재했다**
      `core/api/v1/user.py::create_user` 가 **원자적이지 않다.** 프로필 생성에서 죽으면
      `CoreUser` 행만 남고 응답은 `400 Failed to create user.` — 부른 쪽은 「안 생겼다」로
      읽는데 **소속도 역할도 없는 반쪽 사람**이 남고, 재시도하면 `Username already exists`
      가 나 **영원히 막힌다**(실제로 발생시켜 확인 · id 107 은 손으로 치웠다).
      dj-core §0.4 라 우리가 못 고친다 → `DJCORE_CREATE_USER_NOT_ATOMIC` 로 등재.
      ★ 값이 특히 큰 이유: 온보딩의 첫 걸음이 사용자 생성이라 **처음 쓰는 사람이 가장 먼저
        만나는 실패**가 이것이다.

    ▣ 조율자 몫: 설치 매뉴얼 §2-3 의 낡은 수를 고쳤다(「214개 · 0020」 09-01 자 →
      **220개 · 0027**). **문서의 수는 조용히 낡는다** — 되돌리기 훈련이 빈 DB 를 실제로
      세우면서 그 사실이 드러났다.
  enforced_by: |
