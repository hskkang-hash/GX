- id: D-290
  title: "기본값으로 오류를 삼키지 않는다 + 쓰기 방향 격리 시나리오 정식 추가"
  status: decided
  raised_by: "세종(기획) 2026-08-30 · 대표 위임"
  decision: |
    (1) .get('results', []) 가 상류 오류를 빈 목록으로 바꿔 뷰의 400 갈래를 죽은 코드로 만들었다.
        **원칙: "없는 것"과 "실패한 것"을 같은 값으로 표현하지 않는다.**
        기본값은 **정상 부재에만** 쓰고, 실패는 예외나 명시적 오류 값으로 올린다.
        (D-284 "구현이 없는 함수는 성공을 반환하지 않는다"의 형제)

    (2) 곁가지 3건 전부 인정. 특히 **쓰기 쪽 IDOR 차단** — 남의 stream_monitor_id 로 남의
        테넌트에 이벤트를 심을 수 있었다. 우리는 **읽기 격리만** 보고 있었고,
        D-281 시그니처가 쓰기 구멍을 잡았다.
        → **격리 시험에 쓰기 방향 시나리오를 정식 추가한다 (읽기 5 + 쓰기 N).**

    (3) W2-2 배선 시험이 커널 결함(F-04 위반 — 접힌 관측이 매번 알림)을 잡은 것도 인정.
        기존 30초 간격 시험이 그 갈래를 안 지나갔다는 분석이 정확하다.
  enforced_by: |
    · backend/tests/test_tenant_isolation.py 의 TenantIsolationWriteTest — 쓰기 방향
      (create / cross-tenant FK 주입) 시나리오. 남의 테넌트에 **행을 심을 수 있으면 실패**.
    · docs/agent/verify_gates.sh GATE isolation — 읽기 5시나리오에 더해
      **쓰기 시나리오(test_write_*)가 없으면 fail**. 수가 아니라 **이름**으로 잠근다(D-285 ②).
    · scripts/scan_silent_success.py — 빈 기본값으로 실패를 덮는 형태를 저장소 전수로 훑는다.
