- id: D-425
  author_tree_id: "세종 지시서 2026-09-24 §5-3 병합 · §5-4 세 수 · 조율자 몫"
  title: "2파 병합 — **게이트가 차선 넷이 놓친 여섯을 잡았고**, 그중 하나는 켜 놓고 안 도는 기능이었다"
  status: decided
  raised_by: "조율자(Code) 2026-09-24 · S → Q → E3 → C 병합과 V"
  decision: |
    ▣ **세 수** [실측 2026-09-24 · 병합 뒤]
        상용 가중  55.7% → **64.3%** (120)
        손 안 도달율  63.0% → **71.3%** (77/108)
        남은 절  40 → **31** (미착수 27 · 미측정 4)
      영역 ③ 데이터 격리가 **4/4 = 100%** 가 됐다(ISO-03 닫힘).

    ▣ ★★ **잠자는 기능 게이트가 이 병합의 값을 절반 냈다.** 차선 넷이 낸 코드에서
      **새로 태어나 아무도 안 부르는 함수 여섯**을 잡았다(D-377 「켜진 상태로 태어나야
      한다」). 여섯 다 시험에서만 불리고 있었고, 시험은 스스로 상태를 심으므로 초록이었다.
      넷은 **제자리에 이었고** 둘은 새 자리를 만들었다:
        · `is_drill_event`      → 이벤트 상세의 `data_source`(drill/live). 표식 없이 섞이면
                                  그 달의 통계가 **훈련을 재난으로 센다**
        · `is_late`             → `heartbeat_watch` 신설 → 5분 감시의 `heartbeat_late` 신호.
                                  **안 온 것을 알아채는 자리**가 없으면 OPS-14 는 「보낸다」에서 끝난다
        · `verify_chain` ·      → `evidence_anchor_beat`(00:05) 신설. 매일 어제 것을 닫고
          `daily_anchor` ·        앵커 40자와 **무엇을 해시했는지**를 함께 남긴다 —
          `anchor_line` ·         필드 목록이 없으면 나중에 같은 값을 다시 못 만든다
          `iter_hashed_fields`
      ★ 그리고 같은 병 하나를 게이트 **전에** 손으로 잡았다: `record_frame`(맥박)을
        부르는 곳이 0곳이었다. 파이프라인에 이었고 부작위 시험을 박았다(D-422).

    ▣ ★ **거짓 초록 하나를 막았다** — 차선 Q 의 문지기가 `InvalidNotifyInput` 을 던졌는데
      그 이름은 「모르는 채널」 같은 평범한 입력 오류도 쓴다. 격리 러너의 거절 목록에
      넣었으면 **문지기에 닿지도 못하고 죽은 호출이 「막혔다」로** 세어졌을 것이다.
      `NotifyPermissionDenied` 를 좁게 팠다(D-366 의 재발 방지).

    ▣ **공용 등록부는 조율자만 고쳤다** — 차선 넷은 한 줄도 안 건드렸고 변경안을 코드로
      보고했다. 그 규약 덕에 네 차선이 같은 트리에서 동시에 돌고도 **등록부 충돌 0건**이다.
        · `EVENT_ENTRY_SURFACE` 25 → **33** (진입면 여덟이 늘었다 · 쓰기는 둘뿐)
        · `WRITE_PROBES` 9 → **12** (선등록 셋이 probe 로 옮겨 왔다) · 훑는 범위 +3 패키지
        · `K1_CONSUMERS` +1 (`camera_pulse`)
        · 선등록 둘은 **지우지 않고 사유를 바꿨다**(`append_evidence_hash` · `send_heartbeat_digest`)

    ▣ **K2 채널 어댑터(훈련 모드)는 조율자가 이었다** — 차선 C 가 남긴 부작위 시험이
      배선과 함께 빨개졌고, 그 빨강이 「배선이 왔다」는 선언이었다(D-424).

    ▣ **화면을 실제로 찍었다** — 21 → **24장**(`verify_screens` 통과) ·
      `route-alive` 31 → **35건**. 캡처 없이 UX-13·17·18 을 '구현'으로 적는 것이
      이 대장이 금지하는 부풀리기다(D-346 · P-9).

    ▣ 병합에서 **게이트 넷이 더 잡았고 넷 다 닫았다**:
      `verify_tenant_scope`(새 커널 공개 함수의 문지기 — 시스템 전용으로 좁히고 등재) ·
      `verify_threshold_table`(새 매직 넘버 15건 — 사유와 함께 등재, 그중 **일곱은
      「표 ① 이관 대상」으로 이름을 댔다**) · `verify_classification`(쓰기 3자리가
      분류 등록부를 안 봤다) · `verify_tool_selftest`(새 도구에 출생 표본이 없었다).

    ▣ [실측] 단위 **750 → 최종 재실행** · E2E 23 · 게이트 **9종 exit 0 · 실패 0 · 대기 0** ·
      `verify_*` **44 exit 0 · 빨강 0**(호스트 회색 6은 전부 컨테이너에서 초록).
  enforced_by: |
    · docs/agent/evidence/D-346/ga_readiness.yaml — 120절 · 구현 77
    · docs/agent/remaining_40.md — 31절 · §0-A 닫힌 아홉
    · backend/tests/test_f05_event_api.py :: EVENT_ENTRY_SURFACE 33 · K1_CONSUMERS
    · backend/tests/test_tenant_isolation.py :: WRITE_PROBES 12 · 훑는 범위 6패키지
    · backend/common/ops_tasks.py :: heartbeat_digest_beat · camera_pulse_scan_beat ·
      evidence_anchor_beat · ops_monitor_beat 의 heartbeat_late 신호
    · backend/config/celery.py :: beat 3 (08:00 · 60s · 00:05)
    · scripts/verify_tenant_scope.py :: KERNEL_PUBLIC heartbeat_watch
    · scripts/verify_threshold_table.py :: DECLARED_NOT_A_SETTING +15
    · docs/agent/evidence/D-347/screens (24장) · docs/agent/onboarding_48.md
  affects: [D-261, D-270, D-272, D-277, D-281, D-290, D-301, D-310, D-311, D-327,
            D-346, D-366, D-377, D-421, D-422, D-423, D-424]

- id: D-426
  author_tree_id: "세종 지시서 2026-09-26 §2 첫 일 넷 · 조율자 몫"
  title: "화면이 우리 서랍을 열고 있었다 — **막는 곳은 화면이 아니라 서버였다** (P-27~P-29 · 분모 126)"
  status: decided
  raised_by: "조율자(Code) 2026-09-26 · 차선 넷보다 먼저"
  decision: |
    ▣ **P-27 [P0] 기밀 노출을 닫았다.** `preset=system` 화면의 「연계 상태」 상자가
      상대사명 · 계약번호 · 조항 · 미이행 사실을 관제요원 앞에 문단으로 그리고 있었다.

      ★ **고친 자리가 화면이 아니라 서버다.** 화면에서 안 그리게 하는 방식은 다음 화면이
        다시 그린다 — 실제로 그 사유는 세 자리에 있었다(목록 카드 · 대시보드 배지의
        **툴팁** · 프레임 응답). 서버가 주지 않으면 어떤 화면도 그릴 수 없다:
          · `apps.dsm.services.LinkStateView.reason` 은 **우리 쪽 사실**로 남고
          · 응답에는 `status` 하나 · 관리자에게만 `detail` 한 줄(사전 `LINK_DETAIL`)
          · 역할 판정은 **서버 한 곳**에서 한다 — 화면이 역할을 판정하면 판정자가 둘이 되고,
            둘이면 한쪽은 반드시 틀린다
      [실측] 프런트 774파일 **0건** · API 5라우트 응답 본문 **0건**(로그인해서 실제로 받아 봄) ·
      시험 `LinkStateSecrecyTest` 4건(관제요원 응답에 사유 칸 **자체가 없다**를 단언).

      ★ 실측 중에 **낡은 서버가 옛 코드를 내주고 있었다** — 고친 뒤 띄운 runserver 가
        「port is already in use」로 죽고, 두 시간 전 프로세스가 계속 답하고 있었다.
        첫 판정은 그래서 빨강이었고, 그 빨강이 옳았다면 코드를 또 고쳤을 것이다.
        **응답을 믿기 전에 그 응답을 낸 프로세스가 언제 태어났는지 본다.**

    ▣ **판정기 둘을 세웠다. 둘의 성질이 다르다.**
        `verify_ui_secrets.py`  기밀 — **래칫 없음.** 한 건도 허용하지 않는다. V 의 첫 판정기
        `verify_ui_copy.py`     제품 언어 — **래칫**(D-311). 오늘 빚 18건을 이름으로 잠그고
                                새로 생기는 것만 막는다
      래칫을 가른 이유: 오늘 18건이 걸린 채로 병합을 막으면 사람이 게이트를 끈다.
      **꺼진 게이트는 없는 게이트보다 나쁘다.** 기밀은 18건이 아니라 0건이므로 래칫이 필요 없다.
      ★ 주석은 세지 않는다 — 금지된 것은 「사용자 본문」이지 「소스」다가 아니다.
        주석 걷어내기는 한 벌뿐이고(`verify_ui_secrets.strip_comments`), 음성 표본이 그것을 지킨다.
      ★ `verify_ui_copy` 의 첫 수는 **127건이었고 그중 대부분이 코드였다**(템플릿 경로 ·
        식별자). 그 수를 그대로 잠갔으면 기준선이 코드로 채워지고 진짜 빚이 그 안에 묻힌다.
        **문자열의 몸통만** 보게 고쳐 18건이 됐다 — 백틱이 구분자인 자리는 본문이 아니다.

    ▣ **분모 120 → 126** [실측]. SEC-17 · UX-20 · UX-21 · UX-22 · UX-23(PRD v2.6) ·
      OPS-12a/b(P-30 쪼갬). UX-18 은 제목을 CSV 로 정정(P-31 · 분모 +0) ·
      OPS-02 는 손 밖으로(P-32).
      ★ **쪼갠 자리에 자리표를 절로 남기지 않았다** — 남겼더니 분모가 127 이 됐다.
        쪼개면 둘이지 셋이 아니다. 원문은 주석으로 남는다(왜 한 절이 둘이 됐는지는 남긴다).
      ★ **지시서 산술과 갈렸다 — 대장이 옳다.** 지시서는 「손 밖 12 · 손 안 113 · 잔여 36」
        인데, 그 셈은 P-32(OPS-02)만 세고 **P-30 이 낸 OPS-12b(다른 호스트 · 손 밖)를
        빼먹었다.** 실측은 손 밖 **13** · 손 안 **112** · 잔여 **35**(SEC-17 을 닫아 34).
      ★ 그리고 **게이트가 자기 셈이 깨진 것을 스스로 말했다** — 「미착수는 전부 우리 것」이라는
        가정이 OPS-12b 로 깨지자 `⚠ 두 몫의 합이 다르다` 가 떴다. 그 한 줄이 없었으면
        손 밖 한 절이 조용히 우리 잔여에 남았을 것이다. 잔여식을 hand 별로 고쳤다.

    ▣ **SEC-17 을 같은 턴에 닫았다** — 등재하고 미착수로 두지 않았다. 한 번 닫은 것은
      상태가 아니므로 증명은 **고친 화면이 아니라 판정기**다: `ALL_GATES` 에
      `secrets` 바로 뒤(V 의 첫 자리) · pre-commit `gx-ui-secrets` · `verify_gate_counts`
      가 이 게이트도 「무엇을 몇 건 보았는지」로 잰다(게이트 10 → **12종**).

    ▣ **쓰기 면 다섯을 선등록했다**(3파) — 이메일 채널 · 근무 외 차단 · 웹훅 구독 ·
      열람 청구 접수 · 키 회전. 면을 열고 나서 대장을 늘리면 **면이 먼저 서고 잣대가
      뒤따르는** 순서가 되고, 그 사이가 열린 자리다(P-8).
      ★ 화면은 등재하지 않는다 — 없는 것을 등재하면 대장이 스스로를 부풀린다.

    ▣ **사용자 언어 사전 `docs/design/GX-COPY_v1.md`** — 규칙 넷 중 하나가 이번 사고의 정정이다:
      **없는 것은 없다고 적되, 「어디에 없는지」는 적지 않는다.** 파일 경로·커널 이름·표식은
      사용자에게 뜻이 없고, 읽는 사람에게는 우리 서랍의 지도가 된다.

    ▣ [실측] 세 수 — 상용 가중 **63.3%**(126) · 손 안 도달율 **69.6%**(112) · 구현 **78**.
      단위 **756 passed · 1 skipped** · 게이트 12종(빨강 2 · 대기 1) ·
      빨강 둘은 **MinIO 미가용**이 원인이다(`/api/media-data` 500 · 스냅샷 바이트 503) —
      이번 변경이 낸 것이 아니고 UX-10 이 그 자리다.
