- id: D-344
  title: "「같은 수가 아니면 같은 술어가 아니다」 — 측정 재현성 원칙"
  status: decided
  raised_by: "세종(기획) 2026-09-08 · 대표 위임"
  decision: |
    ▣ 사실: 임계값 전수가 [실측]610/127 → [실측]614/131 로 달라졌다.
    ▣ 원칙: **수를 보고하는 도구는 재현 가능해야 한다.** 같은 커밋에서 두 번 돌려 다른 수가
      나오면 그건 수를 **세는** 도구가 아니라 **추정하는** 도구다.
    ▣ ★ 조사 결과 [실측 2026-09-08] — **술어는 결정적이었다. 달라진 것은 트리다.**
      전수기는 25daaf5 에서 태어나 그 뒤 한 줄도 안 바뀌었다. 그 도구를 워크트리에 복사해
      커밋마다 돌렸더니 `8dfa9fa·6dcd965·d601a79·030178c` → **610/127**,
      `25daaf5·d5cb454` → **614/131**. 같은 커밋 2회는 같은 수였다.
      늘어난 4건을 이름으로 댄다:
        common/audit_writer.py `limit=100` · kernels/k5_trust/audit.py `limit=100` ·
        kernels/k5_trust/credentials.py `len(value) <= 8` · kernels/k5_trust/services.py `limit=50`
      ★ 그러므로 이전 보고의 **「자기 변경분 기여 0건」은 틀렸다** — 넷 다 그 턴이 더한 것이다.
        610 은 **자기 코드를 쓰기 전**에 잰 수였다. 수가 아니라 **측정 시점**이 달랐다.
    ▣ 그래서 원칙에 한 줄을 더한다: **수에는 커밋이 붙어야 한다.**
      어느 트리에서 잰 수인지 모르면 두 수를 비교할 수 없고,
      비교할 수 없는 두 수를 비교하면 **없는 원인을 찾는다.**
    ▣ 이건 D-301(건수 출력)의 다음 계단이다. 건수를 내는 것으로 부족하고 **재현되어야 한다.**
  enforced_by: |
    · scripts/verify_measure_repro.py — 등재된 측정 도구를 **두 번** 돌려 대조하고,
      판정할 때 `git rev-parse --short HEAD`(+작업본 여부)를 함께 출력한다.
      시각·경과시간·경로는 차이로 세지 않는다(게이트가 시계를 재면 매번 빨개진다).
    · docs/agent/evidence/D-344/measurement_repro.md — 커밋별 실측표와 4건의 이름.
  affects: [D-210, D-280, D-301, D-310, D-322, D-325, D-341]

- id: D-345
  title: "기반 진척과 계약 진척을 나눠 적는다 — 하나의 %로 합치지 않는다"
  status: decided
  raised_by: "세종(기획) 2026-09-08 · 대표 위임"
  decision: |
    ▣ 「이번 산출물이 전부 기반·게이트·사고 처리라 계약 절을 갚지 않았습니다」 — 정확하다.
      여기서 절을 억지로 갚은 것처럼 적었으면 그게 D-249(부착률을 완성으로)의 재발이었다.
    ▣ 그러나 **기반 작업이 값이 없다는 뜻은 아니다.** 사고는 상용 오픈을 막던 것이었고,
      계약 절 어디에도 「익명이 영상을 못 올린다」는 없다 — **계약에 없는 일이 상용에는 필수다.**
    ▣ 보고 규약: 매 턴 **두 줄로 적는다.**
          계약 진척 : 절 n/39  (이번 턴 +k)
          기반 진척 : 사고 처리 n건 · 게이트 n종 · 대장 n건  (계약 절과 무관)
      **합쳐서 하나의 %로 내지 마라.** 합치는 순간 어느 쪽도 알 수 없게 된다.
  enforced_by: |
    · scripts/verify_ga_readiness.py — 상용 축을 계약 축과 **따로** 계산하고, 영역 ①은
      계약 절 대장에서 파생해 인용한다(같은 수를 두 곳에 적지 않는다).
    · scripts/verify_contract_ac.py — 계약 축의 절 상태(구현 27 / 39).
  affects: [D-249, D-301, D-314, D-346]

- id: D-346
  title: "상용 오픈 기준 8영역 — 계약 축과 상용 축을 따로 잰다"
  status: decided
  raised_by: "대표 지시 2026-09-08 · 가중치는 세종 판정"
  decision: |
    ▣ 계약 39절을 100% 채워도 **상용 출시는 되지 않는다.** 8영역과 가중치는 [판정]이고,
      각 영역의 상태는 **[실측]으로 갈아 끼운다.** 방법은 D-314(절 분해) 그대로 —
      영역을 절로 쪼개고, 절마다 「구현 / 미착수 / 잠김 / 미측정」과 증명 시험 경로를 적는다.
      ★ **증명이 없는 칸은 '구현'으로 적을 수 없다. 그런 칸은 '미측정'이다.**
    ▣ ★ [실측 2026-09-08] 절 85개로 쪼갠 결과 — 구현 46 · 미착수 21 · 잠김 11 · 미측정 7:

        영역                        가중  [추정](지시)  [실측](이번 턴)   절
        ① 기능 완결성                20%   69%          **69%**        27/39
        ② 보안                       20%   45%          **50%**         7/14
        ③ 데이터 격리·다중테넌시      10%   80%          **75%**         3/4
        ④ 운영(설치·백업·복구·감시)   15%   25%          **12%**         1/8
        ⑤ 성능·확장                  10%   10%           **0%**         0/4
        ⑥ 품질(E2E·회귀·부작위)       10%   70%          **86%**         6/7
        ⑦ 사용성(관리 UI·온보딩)      10%   20%          **25%**         1/4
        ⑧ 법·인증                     5%   15%          **20%**         1/5
        가중 합계                          약 45%       **45.3%**

      ★ 합계는 지시의 [추정]과 0.3%p 차이지만 **안이 다르다.** 특히:
        · ④ 운영 25% → **12%** — 매뉴얼은 있으나 **빈 환경 재현·되돌리기·로그 정책이 미측정**이다.
          「문서가 있다」와 「해 봤다」를 가르니 내려갔다
        · ⑤ 성능 10% → **0%** — 부하 시험 도구도 시나리오도 0건이다. 10% 를 줄 근거가 없었다
        · ② 보안 45% → **50%** — 사고 ③의 9자리를 닫고 캐시 규약이 섰다. 다만 §0.4 의
          2자리가 잠김으로 남아 절이 하나 늘었다 — **못 닫은 것을 닫은 것으로 세지 않는다**
    ▣ ★ 이 표는 네 번 쓴다: 상용 로드맵 · 투자·영업 자료 · GS인증 체크리스트 ·
      계약 작업이 상용을 얼마나 밀어주는지의 지도.
  enforced_by: |
    · docs/agent/evidence/D-346/ga_readiness.yaml — 8영역 84절.
    · scripts/verify_ga_readiness.py — 가중치 합 100 · 「부분」 금지 · '구현'의 증명 실재 ·
      '잠김'의 blocker 실재 · '미착수/미측정'의 사유 · 가중 합계 출력. 어긋나면 exit 1.
  affects: [D-301, D-309, D-311, D-314, D-323, D-345, D-347]

- id: D-347
  title: "피드백 콘솔의 화면은 실제 실행 캡처만 — 그림·모형·합성 금지"
  status: decided
  raised_by: "대표 지시 2026-09-08"
  decision: |
    ▣ 이유: 이 페이지는 **고객이 본다.** 실제가 아닌 화면이 한 장이라도 들어가면
      그건 착시가 아니라 **거짓말**이다. D-284(거짓 성공 금지)의 대외 판이다.
    ▣ 수집 규약: ① E2E 실행 중에 찍는다 ② 메타 4칸(route·user_role·scenario·captured_at)
      ③ 에러 화면도 그대로 ④ 개인정보·실제 영상 프레임 금지 ⑤ 폭 1440 PNG.
    ▣ ★ 이번 턴 [실측 2026-09-08]: **0장이다. 그리고 0장이 정직한 상태다.**
      지금 E2E 는 `django.test.TestCase` 다 — HTTP 를 때리고 DB·메일을 단언한다.
      **브라우저를 열지 않는다.** 즉 **시험이 지나가는 자리에 화면이 없다.**
      화면을 따로 띄워 찍으면 그것은 「시험이 지나간 그 화면」이 아니고(규약 ①),
      고객이 보는 자리에 실제가 아닌 화면이 된다. 그래서 **한 장도 넣지 않았다.**
    ▣ 대신 셋을 세웠다: 인덱스 틀 · 게이트 · **잠금 등재**(BROWSER_E2E_HARNESS).
      ★ 게이트의 술어를 적어 둔다: **0장은 실패가 아니다. 사유 없는 0장이 실패다**(D-301).
        그리고 사유는 문서에만 두지 않고 **잠금 대장에도 둔다** — 문서에만 있는 사유는 늙는다.
    ▣ 해금 조건: 브라우저 구동 E2E 한 벌. 그 실행이 `run_log.json` 에 단계별 시각을 남기면
      게이트가 캡처 시각과 ±5분으로 대조한다 — 그때 「E2E 중에 찍었다」가 진술에서 증거가 된다.
  enforced_by: |
    · docs/agent/evidence/D-347/screens/INDEX.yaml — 0장 · empty_reason 기재.
    · scripts/verify_screens.py — 메타 4칸 · 파일 실재 · 자리 규약 · E2E 로그 ±5분 ·
      **인덱스에 없는 캡처**(어디서 왔는지 모르는 화면)까지 잡는다. 0장이면 사유와
      잠금 등재를 함께 확인한다.
    · docs/agent/evidence/DA-05/blockers.yaml :: BROWSER_E2E_HARNESS (blocked_now: true)
  affects: [D-269, D-284, D-301, D-306, D-323, D-346]

- id: D-348
  title: "판정 청구에 답한다 — 보안 사고와 절차 규칙이 부딪히면 **절차에 예외 경로를 만든다**"
  status: decided
  raised_by: "세종(기획) 2026-09-09 · 대표 위임"
  decision: |
    ▣ ★ 판정의 뿌리: **D-207 이 금지한 것은 그 파일을 수정하는 것이다.**
      그 경로로 가는 요청을 **우리 층에서 막는 것**은 금지된 적이 없다.
      forbidden-zone 게이트가 STOP 을 낸 것은 **옳다** — 파일을 고치려 했기 때문이다.
      게이트는 제 일을 했다. **바꿀 것은 게이트가 아니라 막는 자리다.**
    ▣ 순서: ① 우리 층 미들웨어 → ② 배포 앞단(이중 방어) → ③ 그래도 안 되면 §0.4 보안 예외.
      ★ ①이 되더라도 ②를 함께 걸어라 — 미들웨어가 언젠가 우회돼도 앞단이 남는다.
    ▣ 원칙 신설: **보안 사고와 절차 규칙이 부딪히면, 절차 규칙에 예외 경로를 만든다.**
      규칙을 어기지도 않고, 구멍을 남기지도 않는다.
      **둘 중 하나를 고르는 상황을 만든 것이 설계 실패다.**
    ▣ ★ 이행 [실측 2026-09-09] — ①에서 끝났다. ②③은 필요 없었다.
      `common/access_gate.AccessGateMiddleware` 한 겹.
      `backend/delivery/` 도 dj-core 도 **한 줄도 바뀌지 않았고**, forbidden-zone 게이트는 초록이다.
      닫힌 것을 익명·캐시우회로 재호출해 확인했다:
          GET /api/delivery/drone-monitoring/drone-status   200(17,416B) → **401**(63B)
          GET /api/delivery/etri-mock/test-scenarios        200( 1,976B) → **401**(63B)
      REACHED_WITH_DATA **2 → 0**. 우리 층의 관문 없는 자리 55 → 55(라우트는 그대로,
      길목만 막았다 — 그래서 인벤토리의 수는 안 움직이고 **호출 결과가 움직인다**).
    ▣ ★ 자리 판정 하나를 기록한다: 이 관문은 **캐시보다 바깥**에 둔다(D-341).
      안쪽에 두면 열려 있던 동안 익명으로 채워진 항목이 관문을 지나지 않고 그대로 나간다 —
      2026-09-07 에 실제로 있었던 일이다. 시험이 그 순서를 단언한다.
    ▣ ②(배포 앞단)는 걸지 않았다. 이 저장소의 nginx 설정은 배포 환경마다 갈리고,
      **여기서 정하면 그 환경에서만 도는 방어선**이 된다. 상용 표 ②에 절로 남긴다.
  enforced_by: |
    · backend/common/access_gate.py — 규칙 둘(들어오는 키 기본값 거절 · 익명 거절).
      거절은 **HTTP 401 로** 나간다 — 200 봉투에 담지 않는다(D-349).
    · backend/tests/test_access_gate.py — 술어 단위 6건 + 호출 3건 + 목록 대조 + **캐시보다
      바깥인지**까지 단언. 출생 표본은 그날 17KB 가 나가던 두 경로다.
    · backend/config/settings.py — MIDDLEWARE 의 UniversalCacheMiddleware **위**.
  affects: [D-207, D-300, D-327, D-334, D-341, D-343, D-349, DELIVERY_ZONE_ANON_LEAK]

- id: D-349
  title: "초록의 착시 ⑧ — 봉투. 겉의 200 이 안의 403 을 덮는다"
  status: decided
  raised_by: "세종(기획) 2026-09-09 · 대표 위임"
  decision: |
    ▣ 지금까지 일곱: ①부착률 ②시나리오 수 ③모수와 술어 ④탐지기 자체 ⑤환경 ⑥스키마 ⑦캐시
      **⑧ 봉투 — 겉의 200 이 안의 403 을 덮는다. 판정기가 봉투만 읽었다.**
    ▣ ★ 그러나 더 중요한 것 — **이건 우리 제품의 결함이기도 하다.**
      오류를 HTTP 200 안에 담아 보내는 API 는 바깥의 모두를 속인다:
        · 게이트웨이·프록시가 실패를 성공으로 집계한다
        · 모니터링이 오류율 0% 를 보고한다
        · 클라이언트 라이브러리가 예외를 던지지 않고, 재시도 로직이 돌지 않는다
        · **그리고 우리 판정기도 속았다 — 우리가 첫 피해자였다**
      ★ F-05 진입면이 이런 응답을 내면 **에스비 App 이 실패를 성공으로 읽는다. 계약 사고다.**
    ▣ 지시 셋: ① 663건에 「봉투 불일치」 칸을 더해 전수 · ② 새 면은 HTTP 상태로 말한다
      (기존분은 래칫) · ③ **F-05 진입면은 래칫에서 제외** — 여긴 지금 바로잡는다.
    ▣ ★ 실측 [2026-09-09] — 그리고 **술어를 한 번 좁혔다**(D-350):
      처음 `status_code=4xx` 를 grep 해 **564건**을 셌다. 놀라운 수였고 **틀렸다** —
      대부분이 `BaseResponse(status_code=404)` 인데 그 클래스는 `JsonResponse` 를 상속해
      `super().__init__(..., status=status_code)` 를 부른다. **HTTP 상태가 따라간다.**
      좁히고 나서 전수:
          clean 356 · **authz_envelope 296** · promoted 11 (= F-05 진입면)
      갈리는 것은 사실상 **하나의 뿌리**다: dj-core `path_permission` 이
      `{"success": False, "status_code": 403}` 을 그대로 돌려준다(§0.4 · 우리가 못 고친다).
      우리 손으로 만든 불일치(`body_status`)는 **0건**이다.
    ▣ ③의 이행: 전역 승격 플래그는 그대로 꺼 두고(무증상 실패 후보 21곳 · W0-18 §2-2),
      **경로로 좁혀** 먼저 걸었다 — `API_CONTRACT_PROMOTE_PATHS = ("/api/dsm/",)`.
      되돌리기는 그 목록을 비우는 것이다.
  enforced_by: |
    · scripts/verify_envelope.py — 계약 면(F-05)에 불일치가 남으면 exit 1(**래칫 없음**) ·
      우리가 만든 `body_status` 는 0건 · 나머지는 래칫(D-311).
    · scripts/probe_route_inventory.py — 라우트마다 `envelope` 칸. 술어는 자기시험에 박혀 있다.
    · backend/common/api_contract.py — `promotion_enabled_for(path)` 한 함수가 두 갈래를 답한다.
    · backend/tests/test_api_contract.py — 계약 면은 승격되고 **나머지는 그대로**임을 함께 본다.
  affects: [D-248, D-284, D-301, D-311, D-341, D-343, D-350, F-05]

- id: D-350
  title: "「측정 결과가 놀라우면 측정기를 먼저 의심한다」 — 원칙 신설"
  status: decided
  raised_by: "세종(기획) 2026-09-09 · 대표 위임"
  decision: |
    ▣ **두 번 연속이다** [실측]:
      · 이번 턴: 반출 **18건 → 봉투를 고치니 11건**
      · 직전 턴: 임계값 610→614 에서 「자기 변경분 기여 0건」이라 한 보고가 **틀렸다고
        스스로 정정**했다. 늘린 것은 우리였고 4건을 이름으로 댔다
    ▣ ★ 두 번째 것이 값있다: D-344(측정 재현성)를 만든 **다음 턴에 그 원칙이 자기 이전 보고를
      잡았다.** 잘 만든 도구는 즉시 물고, **잘 만든 원칙은 만든 사람을 먼저 문다.**
    ▣ 원칙: **수가 예상과 크게 다르면 먼저 술어를 의심하고, 다음에 세상을 의심한다.**
      순서를 바꾸면 **틀린 수 위에 판정이 선다.**
    ▣ 강제: 놀라운 수를 보고할 때 **「술어 재확인 여부」를 한 줄로 함께** 적는다.
      비면 그 수는 보고로 인정하지 않는다.
    ▣ ★ 이번 턴 적용 [실측 2026-09-09]: 봉투 불일치를 처음 세니 **564건**이었다.
      놀라웠고, 그래서 코드를 봤다 — `BaseResponse` 가 HTTP 상태를 따라가게 만들고 있었다.
      좁힌 뒤 **296건**. 564 를 그대로 보고했으면 없는 결함 268건 위에 계획을 세웠을 것이다.
      같은 갈래로, 동음이의 `auth` 술어도 넓게 151건 → 좁혀 **진짜 1건**이었다.
  enforced_by: |
    · docs/agent/review/REPLY_*.md — 놀라운 수마다 「술어 재확인」 줄. 이번 판 §2·§4.
    · scripts/verify_envelope.py · scripts/probe_route_inventory.py —
      **좁히기 전의 틀린 술어를 자기시험의 출생 표본으로 박았다** —
      `BaseResponse(status_code=404)` 를 `clean` 으로 읽지 못하면 자기시험이 exit 1 (D-310).
    · scripts/verify_measure_repro.py — 수를 내는 도구를 두 번 돌려 대조한다(D-344).
  affects: [D-210, D-280, D-301, D-310, D-322, D-344, D-349]

- id: D-351
  title: "지시 정정 — 스크린샷은 **화면이 생기는 순서대로** 채운다. 결과이지 선행이 아니다"
  status: decided
  raised_by: "세종(기획) 2026-09-09 · **판정자 오류 인정**"
  decision: |
    ▣ ★ 내 지시가 틀렸다. 「E2E 실행 중에 찍어라」라고 했는데 E2E 는 API 수준이고
      재난안전 전용 화면은 아직 없다(⑦ 사용성 25%). **찍을 것이 없는데 찍으라고 한 것이다.**
    ▣ **지시가 자기모순일 때 따르지 않고 사유를 적은 것 — 그것이 정확한 처리다.**
      0장으로 두고 잠금(BROWSER_E2E_HARNESS)에 올린 것이 맞다.
    ▣ 정정: 스크린샷은 **화면이 생기는 순서대로** 채운다. **결과이지 선행이 아니다.**
      이번 턴 스크린샷 지시는 **없다.** UI 국면에 다시 낸다.
    ▣ 틀 자체는 그대로 둔다 — `verify_screens.py` 의 술어(**0장은 실패가 아니다.
      사유 없는 0장이 실패다**)는 화면이 생긴 뒤에 그대로 값을 한다.
  enforced_by: |
    · scripts/verify_screens.py — 0장 + 사유 + 잠금 등재를 확인한다. 지금 그대로 통과한다.
    · docs/agent/evidence/DA-05/blockers.yaml :: BROWSER_E2E_HARNESS — 해금 조건이 적혀 있다.
  affects: [D-284, D-301, D-323, D-347, D-352]

- id: D-352
  title: "검수 콘솔의 용도 전환 — **만들고 나서 고치는 것보다 만들기 전에 듣는 것이 싸다**"
  status: decided
  raised_by: "대표 지시 2026-09-09"
  decision: |
    ▣ 화면이 없으니 콘솔이 화면을 못 받는다. 그러나 그 도구는 **더 값있는 일**을 할 수 있다:
      화면이 생기기 전에 **「무엇을 만들 것인가」를 고객에게 묻는 자리**다.
      화면 목록을 보여 주고 「이건 필요 없다 / 이건 빠졌다 / 이 순서가 아니다」를 받는다.
    ▣ 콘솔이 **「0/16」을 정직하게 표시하는 것은 그대로 둔다** — 채워지는 것이 진척이다.
    ▣ ★ Code 가 할 일은 **화면 목록의 근거를 대는 것**이지 콘솔을 만드는 것이 아니다.
      목록은 계약 절(F-09·F-10·F-11·F-12)과 User Flow 5종에서 나온다 —
      **없는 화면을 목록에 올리면 그것이 또 하나의 부착률 착시다.**
  enforced_by: |
    · docs/agent/evidence/D-347/screens/INDEX.yaml — `expected_when_unlocked` 가
      화면 목록의 자리다. 지금은 최소 대상만 적혀 있고, 확정은 UI 국면의 일이다.
    · scripts/verify_screens.py — 인덱스에 없는 캡처가 콘솔에 실리는 것을 막는다.
  affects: [D-301, D-347, D-351]

- id: D-353
  title: "국면 전환 — 기반 8:제품 2 에서 **기반 2:제품 8** 로"
  status: decided
  raised_by: "세종(기획) 2026-09-09 · 대표 위임"
  decision: |
    ▣ **시킨 것은 다 했는데 제품은 절반이다.** 지시 이행율 90%(이번) · 95%(누적),
      제품 완성율 48%. 이유는 명확하다 — **지시의 대부분이 기반·게이트·사고 처리였다.**
      그리고 그것이 옳았다: **사고가 세 건 나왔다.** 안 팠으면 그대로 상용에 나갔을 것이다.
    ▣ ★ 그러나 이제 비율을 바꾼다. 기반은 충분히 섰다 —
      게이트 33종 · 검증 31종 · 결정 158건 · 격리 봉인 · 권한 전수 · 절 대장 39+85.
    ▣ 규정 셋
      · **비율** — 새 게이트·새 원칙은 **그것 없이는 지금 만드는 것이 위험할 때만** 만든다.
        사고는 예외 — 사고가 나오면 사고가 먼저다
      · **목표** — 매 턴 계약 절 또는 상용 절을 **최소 5절** 갚는다. 갚지 못한 턴은 사유 한 줄.
        ★ **「기반을 했다」는 사유로 인정하지 않는다.** 기반이 절을 막고 있었으면
        **어느 절을 막고 있었는지를 대라**
      · **보고** — 매 턴 **석 줄**: 계약 진척 n/39 · 상용 진척 n/85 · 지시 이행 n/m(불가 k)
    ▣ ★ 이번 턴 적용 [실측 2026-09-09]: 상용 절 **+8**(목표 5). 새로 만든 게이트는 **1종**
      (`verify_envelope` — D-349 가 없으면 계약 면의 결함이 잠긴다). 운영·성능은
      **기존 게이트(`verify_ga_readiness`)가 증명 파일의 실재로 판정**하므로 새 게이트를 안 만들었다.
  enforced_by: |
    · scripts/verify_ga_readiness.py — 상용 절 진척을 매 실행마다 출력한다(지금 90절 중 54).
    · scripts/verify_contract_ac.py — 계약 절 진척(39절 중 27).
    · docs/agent/review/REPLY_*.md — 머리말의 **석 줄**. 비면 보고가 아니다.
  affects: [D-249, D-301, D-314, D-345, D-346, D-354, D-355]

- id: D-354
  title: "이번 국면의 표적 — **운영과 성능.** 실측해 보니 여기가 비었다"
  status: decided
  raised_by: "세종(기획) 2026-09-09 · 대표 위임"
  decision: |
    ▣ ① **운영** [추정]25% → [실측]12%. 가중 15% · 잠재 +11%p 로 가장 큰 덩어리이고,
      **계약과 무관해 지금 시작할 수 있다.**
      · 백업(DB + 영상 객체저장 **둘 다**) · **복구를 실제로 해 보고 그 명령을 적기** ·
        모니터링 3종(살아 있는가·밀리는가·채워지는가) · 장애 대응 1쪽
      · ★ **복구를 해 보지 않은 백업은 백업이 아니다.**
        「백업 있음」은 절이 아니고 **「복구 성공」이 절이다.**
    ▣ ② **성능** [추정]10% → [실측]0%. 부하시험 0건이면 0% 가 맞다.
      「조금은 했다」로 반올림하면 그게 착시 ①이다.
      · 재는 것 셋만: 동시 스트림 상한 · 이벤트 처리 지연 · 알림 발송 지연
      · **목표를 먼저 정하지 마라** — 먼저 재고, 나온 수를 목표의 출발점으로(D-280)
      · **환경을 반드시 적어라**(CPU·GPU·메모리·네트워크) — 환경 없는 성능 수치는 착시 ⑤
      · ★ 성능이 급한 이유는 계약이 아니라 **영업**이다. 「몇 대까지 됩니까」에 답하지 못하면
        지자체 제안서를 쓸 수 없다. 계약 검수에는 한 절도 안 걸리지만 **다음 계약의 첫 질문**이다.
    ▣ ★ 이행 [실측 2026-09-09]
      · 백업: `db_..._20260829T134442Z.dump` 4,447,529 bytes · 증인 표 5개 행 수 대조표
      · 복구: **해 봤다.** 임시 DB 로 살려 카메라 39→39 · 사용자 103→103 · 이벤트 0→0.
        쓴 명령을 그대로 남겼다(`restore_run.md`)
      · ★ 운영 사실 하나를 배웠다: **클라이언트 판이 서버 판과 맞아야 한다.**
        앱 컨테이너의 pg_dump 17.7 로 서버 18.1 을 못 뜬다 — 「어디서 뜨는가」가 절차의 일부다
      · 객체저장: `minio.invalid` — **닿지 못했다.** 「닿지 못했다」와 「0개다」는 다른 사실이라
        대장에 그대로 적고 **미측정**으로 뒀다(OPS-09). DB 만 살아나면
        **이벤트 행은 돌아오고 그 이벤트의 영상은 사라진다**
      · 감시: 신호 7개 · OK 6 · UNKNOWN 1. 임계값마다 **왜 이 수인가**를 적었다
      · 성능: 이벤트 처리 p50 12.28ms · p95 13.25ms / 알림 발송 p50 2.89ms · p95 3.42ms
        (n=30 · CPU 8 · mem 7.7GiB · GPU 없음). **한 건씩 잰 수다** — 처리량은 PERF-05
      · 동시 스트림 상한: **미측정.** RTSP 원본과 AI 서버가 없다. 「선언된 상한」을
        「실제 상한」으로 적지 않았다
  enforced_by: |
    · scripts/ops_backup.py · scripts/ops_restore.py — 백업은 대조표를 남기고,
      복구는 **행 수를 맞춰 본다.** 원본 이름을 주면 복구가 시작하지 않는다(세 겹 방어).
    · docs/agent/evidence/D-354/restore_run.md — 복구 성공의 증거. 스크립트가 만든다.
    · scripts/ops_monitor.py — 감시 3종. `--check` 가 0/1/2 로 답한다.
    · scripts/perf_measure.py — 지연 p50/p95 와 **환경**. 트랜잭션 안에서 재고 되돌린다.
    · docs/agent/runbook/장애대응_1쪽.md — 새벽 세 시에 읽는 순서.
    · scripts/verify_ga_readiness.py — 위 산출물이 **실재하는지**로 절을 판정한다.
  affects: [D-280, D-301, D-314, D-330, D-345, D-346, D-353]

- id: D-355
  title: "지시 이행율과 제품 완성율을 **따로** 적는다 — 하나로 합치면 둘 다 안 보인다"
  status: decided
  raised_by: "세종(기획) 2026-09-09 · 대표 위임"
  decision: |
    ▣ 이번 턴 이행 **90%**(10건 중 9건 · 1건은 **대상 부재로 불가** — 미이행이 아니다).
      누적 8턴 **95%**(66항목 중 불가 3건: 스크린샷 · juso 실측 · FX-5 어댑터 — 전부 자원·대상 부재).
      제품 완성율 **48%**.
    ▣ 원칙: **「시킨 것을 다 했다」와 「제품이 됐다」는 다른 축이다.**
      합치면 어느 쪽도 안 보인다 — D-345(계약/기반 분리)의 세 번째 축이다.
    ▣ **「불가」는 「미이행」이 아니다.** 다만 불가라고 적으려면 **왜 대상이 없는지**를
      대장에 남겨야 한다 — 남기지 않은 불가는 미이행이다.
    ▣ ★ 그래서 보고는 석 줄이다(D-353): 계약 진척 · 상용 진척 · 지시 이행(불가 k).
  enforced_by: |
    · docs/agent/review/REPLY_*.md — 머리말 석 줄 + §0 의 지시별 이행표(불가 사유 포함).
    · docs/agent/evidence/DA-05/blockers.yaml — 「불가」의 사유가 사는 자리.
      대장에 없는 불가는 미이행으로 센다.
  affects: [D-301, D-345, D-346, D-351, D-353]

