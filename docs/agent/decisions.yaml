      ★ 이행 순서가 아니라 **번호만** 옮긴 것이다. 지시서의 실행 순서는 그대로다.
    ▣ ★ 그리고 **정정 보고 셋** (D-379 — 「구현하라」 항목은 착수 전 확인이 의무다):
      ① 지시서 실행 순서 1 「E2E 23종 · lock 고정 · 잠자는 314건 분류가 이번 턴에도 먼저」
         → **셋 다 이미 있음.** 직전 커밋 `cc876ae`(D-385~392)에서 끝났고 보고했다
      ② 지시서 D-399 「화면 3/16 → 8/16」 → **이미 16/16 이다** (커밋 `d4598ea` · D-396)
      ③ 지시서 D-394 「현재 이벤트는 사실상 2값」 → **틀렸다. 이미 4값이다** (D-399 참조)
  enforced_by: |
    · docs/agent/decisions.yaml — 이 항목이 대응표의 정본이다
    · docs/agent/evidence/D-399/response_axis.md
  affects: [D-379, D-380, D-385, D-396]

- id: D-399
  author_tree_id: "지시서 D-394 (세종 2026-09-14)"
  title: "이벤트 상태 4값 — **이미 4값이었고, 축이 달랐다.** 세 번째 칸을 세운다"
  status: decided
  raised_by: "세종(기획) 2026-09-14 · Code 이행 + 축 판정"
  decision: |
    ▣ 착수 전 실측 [D-379 의무 · 실측 2026-09-14]:
        상태 「2값」        → **틀림. 이미 4값** (`stream_monitors/models.py:186`)
        대응 진행 축        → **없음**
        이벤트 감사 테이블   → **이미 있음** (`common/audit_writer.py` + `logger.AuditLogs`)
        오탐 모델(D-402)   → **이미 있음** (`verdict`·`reviewed_*`·`reject_reason` · D-293)
    ▣ ★★ 두 4값은 **다른 것을 묻는다:**
        `status`         「이 탐지가 진짜인가」   신규 → 확인/기각 → 종료
        `response_state` 「사람이 어디까지 했나」 발생 → 접수 확인 → 조치중 → 종결
      지시서 값을 `status` 에 밀어 넣으면 **판정과 대응이 한 칸에 섞인다.**
      그것은 D-293 이 `status` 와 `verdict` 를 가른 것과 **같은 실수**이고,
      섞여 있던 동안 종료가 쌓일수록 오탐률이 **저절로 좋아졌다.**
      **한 칸에 두 뜻을 넣으면 마지막에 쓴 사람이 앞사람의 뜻을 덮는다.**
    ▣ 판정: **세 번째 칸 `response_state` 신설**(ⓐ안). 계약 문서를 건드리지 않고
      마이그레이션이 **가산적**이다. ⚠ 이 선택은 세종의 자리였고 **답을 못 받은 채
      진행했다** — 되돌리려면 `0025` 를 되감고 칸 하나를 지운다. `status` 는 무손상이다.
    ▣ 전이: **앞으로만.** `occurred → closed` 직행 없음 — 접수한 사람이 없는 종결이
      생기면 「아무도 안 봤는데 닫힌 이벤트」와 「보고 닫은 이벤트」가 같아진다(D-290).
      되돌림은 **「종결 → 조치중」 하나뿐** · 관제팀장(K3 MANAGER 이상) · **사유 필수**.
      넓게 열면 감사 이력이 이야기를 잃는다 — 오간 흔적만 남는다.
    ▣ 감사: **새 표를 만들지 않았다**(D-333). who·when·from·to·reason 은 전부
      `logger.AuditLogs` 에 있고, 칸에는 **현재 값만** 있다.
    ▣ 거절은 **실제 4xx** 다: 409(그 전이는 없다) · 400(사유를 채워라) · 403(팀장이 해야 한다)
      · 404(남의 것 — 존재 여부가 새는 것도 누출이다). **셋을 한 코드로 묶지 않는다** —
      묶으면 화면이 「무엇을 고쳐 다시 보낼지」를 모른다(D-290). `200+{"success":false}` 없음.
    ▣ ★★ **시험 일곱이 설계를 고쳤고 일곱 다 시험이 옳았다.** 1차판은 규칙을 App 에
      두었다: `AppStaysThinTest`(App 이 `_base_manager` 를 만졌다) ·
      `TenantIsolationWriteTest`(새 쓰기 면이 격리 탐침에 없다) ·
      `EntrySurfaceIsOne/Locked`(라우트가 늘었고 K1 소비자가 등재 없이 늘었다) ·
      `KernelPublicSurfaceTest`(칸이 DB 에 안 들어갔다).
      전부 **설계 지적**이지 잔소리가 아니었다 — `DetectionEvent` 의 수명주기는 K1 의
      것이고, 새 쓰기 면은 **남의 이벤트를 접수 확인으로 밀 수 있는지**를 재야 한다.
      (심어진 행보다 나쁘다: 그 이벤트는 원래 그 테넌트 것이라 **어떤 읽기 시험도
       이상하다고 하지 않는다**)
    ▣ 이관 [실측]: 개발 DB 는 이벤트 **0행**이라 마이그레이션을 돌려도 「0행」이다 —
      **0건은 검증이 아니다**(D-301). 네 상태를 심어 이관 함수를 직접 돌려 봤다.
      매핑은 **[판정]이다**: new→occurred · confirmed→**acknowledged** · rejected→closed ·
      closed→closed. `confirmed` 를 `in_progress` 로 올리지 않은 이유 — 판정은 「봤다」이지
      「조치했다」가 아니고, **안 한 일을 했다고 적지 않는다.**
    ▣ 파괴적 연산 **0건** — dry-run 결과가 `AddField` 하나뿐이었다 (D-209).
  enforced_by: |
