- id: D-338
  title: "install_address 는 쓰기 지점이 없으면 clip_path 와 같은 운명이다"
  status: decided
  raised_by: "세종(기획) 2026-09-07 · 대표 위임"
  decision: |
    ▣ 사실 [실측 · 2026-09-06 보고]: 카메라 39대 중 **39대 미입력.** 계측기는 섰다. 그러나 —
      ★ 지금 install_address 는 **정의 있음 · 읽기 있음 · 쓰기 0곳**이다.
        D-304 착시 6번(스키마의 착시)의 정확한 형태다. clip_path 가 그랬다.
        계측기가 「39/39 미입력」을 출력하니 **숨지는 않는다.**
        그러나 **숨지 않는 것과 살아 있는 것은 다르다.**
    ▣ 셋을 함께 한다
      ① **채우는 수단을 먼저 만든다.** 관리자 UI 는 나중이어도 좋으나 **관리 커맨드나 API 로
         지금 채울 수 있어야 한다.** 쓰기 지점 0곳을 넘긴 채로 턴을 마치지 않는다
      ② **E2E 픽스처에 주소가 채워진 카메라를 넣고**, 알림 위치줄에 그 주소가 실제로 나가는 것을 시험이 본다
         → 「필드를 만들었다」가 아니라 **「이 경로로 사람에게 도달한다」**가 증명된다
      ③ 미입력 39건은 **운영 항목으로 대장에 올린다.** 개발 잠금이 아니다 —
         blocked_now: false · 유형 OPS · 소유자: 고객사(설치 위치를 아는 쪽)
    ▣ verify_dead_fields.py 화이트리스트에 **넣지 않는다.** ①이 끝나면 쓰기 지점이 생기므로 넣을 이유가 없다.
      ★ 이번 턴이 끝났는데도 쓰기 0곳이면 **그 게이트가 빨개져야 정상이다.**
  enforced_by: |
    · backend/stream_monitors/management/commands/set_camera_address.py — **쓰기 지점.**
      한 대(--name/--id) · 여럿(--csv) · 모의(--dry-run) · 되돌림(--clear).
      이름이 겹치면 아무것도 쓰지 않고, 못 찾은 이름은 세어 실패로 끝낸다(D-301).
      ★ 요청 스코프가 아니라 _base_manager 로 전수를 본다 — dj-core 의
        CustomManagerGroup._request 가 **클래스 속성**이라 떠도는 전역에 스코프가 흔들린다.
    · backend/tests/test_camera_address_write.py — 쓰기 경로 8건. 읽기는 backend/tests/test_f10_camera_address.py 가 본다.
    · backend/tests/e2e/test_e2e_1_fire.py — E2E-1 픽스처의 카메라에 주소를 채우고,
      **메일 본문에 그 주소가 있는지** 단언한다. 「필드를 만들었다」가 아니라 「사람에게 도달한다」.
    · docs/agent/evidence/DA-05/blockers.yaml — CAMERA_INSTALL_ADDRESS · 유형 OPS(신설) ·
      blocked_now: false · 주인은 고객사.
    · scripts/verify_dead_fields.py — DECLARED_UNWIRED 에서 세 줄을 지웠다.
      ★ 이 게이트가 먼저 「등재를 지워라」로 빨개졌다 — 쓰기가 생기면 등재할 이유가 없다.
  affects: [D-212, D-270, D-290, D-299, D-301, D-304, D-308, D-325, D-330, D-331, F-10, DA-05]

- id: D-339
  title: "커밋 단위 승인 — D-327 술어대로 한 되돌림 단위는 한 커밋"
  status: decided
  raised_by: "세종(기획) 2026-09-07 · 대표 위임"
  decision: |
    ▣ 「결정문·표·게이트 셋·기준선·대장이 한 되돌림 단위라 1커밋」 — 옳다.
      D-327 의 술어 그대로다: **커밋 단위 = 함께 되돌려야 게이트가 초록인 최소 집합.**
    ▣ 본문에 D-322~333 을 적고, **v3.1(144) 도달**과 그날의 수(399 passed · 절 27/39)를 함께 적는다.
    ▣ 태그는 붙이지 않는다. rc-sdn-excl-0.1 이후 아직 릴리스 후보 조건이 다시 차지 않았다.
    ▣ ★ 이번 턴 적용 [실측 2026-09-07]: D-334 의 산출물도 같은 술어로 묶인다 —
      15자리 수정 · 게이트 · 기준선 · 회귀 시험 · 사고 기록은 **따로 되돌리면 게이트가 빨개진다**
      (수정만 되돌리면 게이트가 열린 문을 잡고, 게이트만 되돌리면 기준선이 고아가 된다).
      따라서 D-334 도 1커밋이다.
  enforced_by: |
    · scripts/verify_commit_trace.py — 커밋 본문의 결정 번호 추적.
    · .pre-commit-config.yaml — 게이트 전건이 커밋마다 돈다. **게이트가 커밋 단위를 판정한다**(D-327).
  affects: [D-286, D-305, D-311, D-327, D-334]

- id: D-340
  title: "사고 2건 확정 — 그리고 「너무 많이 있다」를 먼저 의심한다"
  status: decided
  raised_by: "세종(기획) 2026-09-08 · 대표 위임"
  decision: |
    ▣ 사고 ①「익명 도달 15자리」 등급 상급. 익명이 핸들러에 닿았고 4자리는 **영상 업로드 면**이었다.
      반출이 아니라 유입이지만 **남의 영상을 우리 저장소에 심을 수 있었다** — 계약 11조 인접.
      POST 7자리를 도달 표시용 대체물로 바꿔 때린 기법을 **정본으로 올린다.**
    ▣ 사고 ②「inbound key 과범위」 등급 상급. 발급된 키 하나가 F-05 진입면 7자리 전부에 닿았고
      거기에 `/clip/stream` 원본 영상이 있었다 — **계약 11조 정면.**
      **인증은 성했고 범위가 성하지 않았다.**
    ▣ ★ 판정자 오류 인정: D-335 는 「남은 일은 만들기가 아니라 잇기」라고 썼다.
      실제는 **이미 이어져 있었고, 너무 넓게 이어져 있었다.** 일은 「좁히기」였다.
      → 원칙: **「없다」고 가정하고 만들기를 지시하기 전에 「너무 많이 있다」를 먼저 의심한다.**
        D-333 의 세 번째 얼굴이다:
          ① 밖에 사러 가기 전에 안을 뒤진다 · ② 만들기 전에 이미 있는지 뒤진다
          ③ **이미 있으면, 그것이 얼마나 열려 있는지부터 잰다**
        만들지 않은 것은 고장 나지 않지만, **이미 있는 것은 이미 고장 나 있을 수 있다.**
    ▣ ★ 이행 중 세 번째 사고를 찾았다 [실측 2026-09-08]. ③의 술어를 그대로 돌린 결과다 —
      라우트 663건 전수에서 **우리 층의 인증 관문 없는 자리 79건**이 나왔고,
      호출로 재니 **11자리가 익명에게 데이터를 돌려주고 있었다**(드론 텔레메트리 17KB ·
      그룹·일련번호 16KB). 그중 **9자리를 24개 라우트로 닫고** 재호출로 확인했다.
      **원칙이 만들어진 그 턴에 원칙이 사고를 찾아냈다.**
      ★ 남은 2자리는 `backend/delivery/`(§0.4)라 **못 닫았다.** 붙였다가 forbidden-zone
        게이트가 STOP 으로 잡아 되돌렸다 — **게이트가 지시보다 위다**(D-327 · D-207).
        잠금 대장에 해소 절차와 함께 등재했다(DELIVERY_ZONE_ANON_LEAK).
        「모른다」가 아니라 **「못 한다」**이다.
  enforced_by: |
    · docs/agent/evidence/D-334/INCIDENT.md — 사고 ① 기록.
    · docs/agent/evidence/D-343/INCIDENT.md — 사고 ③ 기록 (①의 술어를 넓혀 찾은 것).
    · scripts/probe_route_inventory.py — 「얼마나 열려 있는지」를 먼저 재는 도구.
    · backend/tests/test_authn_gap_closed.py — 사고 ③ 회귀 5건.
  affects: [D-210, D-300, D-301, D-306, D-333, D-334, D-335, D-342, D-343]

- id: D-341
  title: "초록의 착시 ⑦ — 캐시. 고침이 반영되기 전에 고쳤다고 읽는다"
  status: decided
  raised_by: "세종(기획) 2026-09-08 · 대표 위임"
  decision: |
    ▣ 사실 [실측 2026-09-07]: 15자리를 고친 **뒤**에도 2자리가 200 이었고 `cache.clear()` 뒤 0 이 됐다.
      캐시가 없었다면 그 2자리는 **「고쳤다」로 보고됐을 것**이다. 곁가지가 아니다.
    ▣ 지금까지 여섯: ①부착률 ②시나리오 수 ③모수와 술어 ④탐지기 자체 ⑤환경 ⑥스키마
      **⑦ 캐시 — 측정 대상과 측정 시점 사이에 낀 상태가 결과를 대신 답한다.**
      응답 캐시만이 아니다: 모듈 임포트 캐시 · ORM 쿼리 캐시 · 브라우저 · CDN ·
      컨테이너 이미지 레이어 · `__pycache__` — **전부 같은 병이다.**
    ▣ 규약: **모든 회귀·보안 시험은 캐시를 우회하거나 비우고 때린다.**
      · 우회가 가능하면 우회 · 불가능하면 **명시적으로 비우고 시작**
      · 시험에 **「캐시 처리: 우회 / 비움 / 해당 없음 — 사유」 한 줄**을 남긴다. 비면 게이트가 죽는다
    ▣ 기존분은 래칫(D-311), 새 시험은 **100% 의무.**
      ★ 이번 턴 실측: 대상 7건 **전부 우회**로 채웠다 — 기준선 0건으로 시작한다.
    ▣ ★ 그 2자리를 술어로 되찾았다 [실측 2026-09-08]. 사고 기록에는 「2자리」라고만 적혀 있었다.
      `UniversalOptimizer.should_cache_request()` 에 넣어 보니
      `days-of-week` · `terminal-types` 는 True, `online-drones` 는 False —
      **익명에게 200 을 내던 셋 중 캐시되는 것이 정확히 둘**이다. 기록의 수와 맞는다.
      → 원칙: **수만 남은 기록도 술어가 있으면 이름을 되찾을 수 있다.**
    ▣ 이건 D-301(검사 못함 ≠ 0건 검사)의 사촌이다. 거긴 **못 보고 초록**, 여긴 **옛것을 보고 초록**.
  enforced_by: |
    · scripts/verify_cache_bypass.py — 스택을 때리는 시험에 캐시 처리 표기가 없으면 exit 1.
      자기시험의 출생 표본이 **그 2자리를 캐시 우회 없이 때리는 시험**이다.
    · backend/tests/no_cache.py — 우회 헤더를 한 자리에 둔다(미들웨어가 보는 이름과 어긋나면
      우회는 일어나지 않고 시험은 조용히 캐시를 잰다).
    · docs/agent/evidence/D-341/cache_bypass_baseline.txt — 래칫 기준선(지금 0건).
  affects: [D-284, D-289, D-301, D-304, D-311, D-334, D-343]

- id: D-342
  title: "authn ≠ authz — 「같은 이름, 다른 것」 대장 4번째"
  status: decided
  raised_by: "세종(기획) 2026-09-08 · 대표 위임"
  decision: |
    ▣ 「권한(`path_permission`)」과 「인증(`auth=`)」은 같은 이름이 아니다 — 이 구분이 15자리를 드러냈다.
      대장에 등재: 이름 「권한·인증」 · A=인가(무엇을 할 수 있나) · B=인증(누구인가) ·
      구분 기준 **질문이 다르다** · 발견 D-342.
    ▣ 명명 규정: 코드·시험·문서에서 `auth` 를 **단독으로 쓰지 않는다.** `authn_` / `authz_` 로 쓴다.
      ★ 다만 금지는 **우리가 새로 짓는 이름**에만 건다(D-324). `django.contrib.auth` ·
        `core.api.v1.auth` 는 남의 이름이라 못 고치고(§0.4), ninja 의 `auth=` 는 프레임워크의
        인자 이름이라 못 고친다. **낱말을 금지하면 그 낱말을 정확히 쓰는 줄까지 죽는다** —
        처음 넓게 걸었을 때 151건이 잡혔고 그 대부분이 임포트 경로와 설명문이었다.
        좁히니 3건, 그중 진짜는 **1건**이었고 그것을 고쳤다(`inbound_api_key.py::authn_header`).
    ▣ ★ 기록해 둔다: D-337 에서 대장을 만들었고, 그 다음 턴에 대장이 사고를 찾아냈다.
      그리고 **이번 턴에 한 번 더 했다** — 「authz 활성 + authn 없음 24」와
      「아무 관문도 없음 55」를 가른 것이 사고 ③의 11자리를 드러냈다.
      한 칸에 두었으면 24자리의 「권한이 막아 준다」에 가려 못 봤을 것이다.
  enforced_by: |
    · docs/agent/evidence/D-337/homonym_ledger.yaml — 4번째 항목을 「권한 · 인증」으로 확정.
    · scripts/verify_homonyms.py — RULES["auth"]. 우리가 새로 짓는 이름이 `auth` 이면 exit 1.
      자기시험이 **남의 이름은 안 잡는지**까지 함께 본다(D-324).
  affects: [D-301, D-310, D-324, D-334, D-337, D-343]

- id: D-343
  title: "X-API-Key 기본값 거절을 전역으로 — 단, 대장을 통과시켜서"
  status: decided
  raised_by: "세종(기획) 2026-09-08 · 대표 위임"
  decision: |
    ▣ 판정: **전면 적용한다.** 「발급된 키 하나가 지금도 시스템 대부분에 닿는다」를 남겨 둘 수 없다.
    ▣ 그러나 수백 라우트를 한 번에 뒤집으면 **무엇이 깨졌는지 모르는 채로 초록이 된다.** 순서:
      ① 라우트 인벤토리 전수 · ② 3갈래 분류(기본값 `session_only`) ·
      ③ 전역 미들웨어 · ④ 래칫 · ⑤ 부작위 시험
      **이번 턴은 ①②까지.** ③은 인벤토리를 보고 범위를 판정한 뒤에 한다.
    ▣ ★ ①의 [실측 2026-09-08] — 라우트 **663건**:
        들어오는 키   지금 닿는다 515 · 관문 없음 128 · 우리 문지기가 거절 10 · 모름 9 · 선언 1
        3갈래         session_only 662 · inbound_key_allowed 1 · internal_only 0
        테넌트 범위    선언 없음 651 · required 11 · 면제 1
      → 「지금 닿는 515」가 판정의 분모다. 그중 dj-core 소유가 148, 우리 층이 367.
    ▣ ★ ①을 돌리다 **사고 ③**이 나왔다(D-340 참조). 데이터가 나가던 자리를 포함해
      **24자리를 닫았다.** 닫은 뒤 [실측]: 관문 없음 128 → 104 · 거절 10 → 34 · 반출 11 → **2**.
      ★ 닫은 범위의 술어를 적어 둔다: **「익명에게 데이터를 돌려준 것이 확인된 컨트롤러」 중
        우리가 고칠 수 있는 것의 관문 없는 라우트 전부.** 전역 적용이 아니다 —
        그것은 ③이고 판정 대기다. 열린 문에는 유예가 없고(D-334), 넓히는 일에는 판정이 필요하다.
      ★ 남은 2 는 §0.4 금지구역이다. 게이트가 STOP 으로 잡아 되돌렸다 — 등재로 남긴다.
    ▣ ★ ①의 인벤토리는 버리지 않는다. **한 번 만들어 세 번 쓴다** —
      F-05 연동 규격서 부록 · 상용 API 문서 초안 · 파트너 기술 검토 자료.
  enforced_by: |
    · scripts/probe_route_inventory.py — 런타임 레지스트리 전수(경로·메서드·인증 수단·
      키 수용·테넌트 범위·3갈래). 컨테이너에서 돈다.
