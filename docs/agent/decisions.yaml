- id: D-358
  title: "봉투 296건 — **뿌리가 남의 것이면 우리 면에서만 바로잡고 뿌리는 대장에**"
  status: decided
  raised_by: "세종(기획) 2026-09-10 · 대표 위임"
  decision: |
    ▣ 인정: 564 → 296. 술어를 재확인해 첫 술어가 틀렸음을 스스로 적었다 —
      **D-350(측정기를 먼저 의심한다)의 첫 적용이고, 만든 다음 턴에 값을 했다.**
    ▣ 판정: **296건을 전면 승격하지 마라.**
      (ㄱ) 기존 화면·클라이언트가 200 을 기대하고 있을 수 있다. 한꺼번에 바꾸면
           **보안을 고치려다 제품을 깬다.** 그건 사고의 다른 이름이다.
      (ㄴ) 뿌리가 §0.4 다. 바깥에서 승격시킬 수는 있으나 **필요가 증명되기 전에는 안 한다.**
    ▣ 세 갈래로 고정:
      · **F-05 진입면** — 승격 완료. 계약 상대가 읽는 면이라 유일하게 급했다
      · **새로 만드는 면** — HTTP 상태로 말한다. **100% 의무.** 게이트가 새 면을 잡는다
      · **기존 296건** — 래칫으로 이름 고정. 소급 수정 금지. 뿌리는 대장에 등재
    ▣ ★ 원칙 신설: **뿌리가 우리 것이 아니면, 우리 면에서만 바로잡고 뿌리는 대장에 남긴다.**
      남의 뿌리를 고치려 들면 금지구역에 손이 가고, 안 남기면 다음 사람이 같은 것을 또 판다.
    ▣ 모니터링·경보는 **본문을 읽는다.** 봉투가 200 이어도 본문이 403 이면 오류로 집계한다 —
      안 그러면 우리 대시보드가 오류율 0% 를 보고한다(D-349 그대로).
    ▣ [2026-09-10 이행 확인] 뿌리는 이미 대장에 있다(DJCORE_200_ENVELOPE_403 · DEV ·
      주인 dj-core 소유팀). 이번 턴 새 면 5건은 전부 `/api/dsm/` 아래라
      `verify_envelope.py` 의 승격 검사가 자동으로 덮는다 — **새 면 100% 가 지켜졌다.**
  enforced_by: |
    · scripts/verify_envelope.py — 승격 경로 검사 + 래칫 + body_status 0건
    · docs/agent/evidence/DA-05/blockers.yaml — DJCORE_200_ENVELOPE_403
  affects: [D-284, D-311, D-349, D-350]

- id: D-359
  title: "성능 — **잰 것과 못 잰 것을 가른 것**이 이번 측정의 값이다"
  status: decided
  raised_by: "세종(기획) 2026-09-10 · 대표 위임"
  decision: |
    ▣ [실측·환경 CPU 8 · GPU 없음 · n=30] 이벤트 p95 **13.25ms** · 알림 p95 **3.42ms**.
      **환경을 함께 적은 것**이 착시 ⑤를 피한 정확한 표기다.
      알림 3.42ms 는 F-10 「30초」에 네 자릿수 여유 — 다만 **부하 없는 상태의 수**다.
    ▣ ★ 동시 스트림 상한 **미측정** — RTSP·AI 서버 부재.
      **선언값을 실제값으로 적지 않은 것이 옳다.** 「500대 지원」 같은 문구를 실측 없이
      적는 순간 그 수가 제안서로 가고 계약이 된다.
    ▣ 지시: 지금 환경에서 잴 수 있는 것은 잰다 — **어디서 먼저 무너지는가**가 목적이고
      절대값은 그 다음이다.
    ▣ [실측 2026-09-10 · 부하 하 재측정] 동시 1→16 계단, 호출 310건:
          동시  1 · p95   45.30ms · 처리량  29.68/s
          동시  2 · p95   54.13ms · 처리량  78.01/s
          동시  4 · p95   42.81ms · 처리량 108.71/s   ← **처리량이 여기서 평평해진다**
          동시  8 · p95  103.41ms · 처리량  92.52/s
          동시 16 · p95  191.45ms · 처리량  96.34/s   ← p95 가 기준의 3배를 넘는다
      ★ **먼저 무너지는 자리: 처리량은 동시 4에서 평평해지고, 지연은 8부터 오른다.**
        16에서 3배 기준을 넘는다. 즉 **더 넣어도 더 처리되지 않고 느려지기만 한다.**
    ▣ ★ 그리고 **예상 못 한 것 하나** — 부하를 올리자 `detectionevent` 에
      **분당 200건 속도제한**이 걸렸다(로그: "Rate limit exceeded ... skipping").
      이 환경에서 **먼저 무너진 것은 DB 도 CPU 도 아니라 우리 쪽 속도제한**이다.
      그 값이 어디서 왔고 운영에서 적절한지는 **아직 모른다** — 다음 턴 항목으로 올린다.
    ▣ ★ 이 수를 「카메라 몇 대」로 읽지 마라. 여기서 잰 것은 **이벤트 쓰기·알림의
      동시성**이고 스트림 수집·디코딩·추론은 들어 있지 않다. 둘을 한 수로 적으면
      제안서에 잘못된 수가 간다. GPU·RTSP 환경은 대표 결정 사항으로 남는다.
  enforced_by: |
    · scripts/perf_measure.py --load — 계단 상승 · knee 판정 · not_measured 명시
    · docs/agent/evidence/D-359/perf_load.json
  affects: [D-280, D-301, D-344, D-354]

- id: D-360
  title: "국면 2 — **이번 턴은 계약이다.** 개발로 풀리는 절을 친다"
  status: decided
  raised_by: "세종(기획) 2026-09-10 · 대표 위임"
  decision: |
    ▣ 상용은 직전 턴에 +8절(목표 5)을 갚았고 **계약은 8턴째 27/39 그대로**였다.
      잔여 12절 중 SDN 5절은 상대방 이행 대기이고, 나머지 7절 중 다수가 개발로 풀린다.
      ★ 목표: **계약 +5절.**
    ▣ [이행 실측 2026-09-10] **계약 27 → 32절** (69% → 82%) · 잔여 12 → 7. **목표 달성.**
      갚은 다섯: F-03 폴리곤(D-365) · F-12 구역(D-366) ·
                 F-05 API Key 발급·폐기(D-367) · F-12 API키(D-367) · F-12 등급규칙(D-368)
    ▣ ★ **지시 ①(EventClip 구현)은 이미 서 있었다** — 정정한다.
      지시서는 「설계는 D-306 에서 끝났다. 구현만 남았다」로 적혔으나,
      [실측] 구현·라우트·재생 4규약 시험이 **2026-09-02 커밋(8dfa9fa)에 전부 들어 있다.**
      `reference_for_event`(쓰기 1곳) · `issue_ticket`/`verify_ticket`(구간 서명) ·
      `GET /events/{id}/clip`·`/clip/stream` · `test_clip_playback.py` 규약 ①~④.
      **다시 만들지 않았다.** 이미 있는 것을 다시 만드는 것은 절을 갚는 것이 아니라
      두 벌을 만드는 것이고, 두 벌은 반드시 어긋난다(D-212).
      ★ 다만 그 구현이 D-356 의 전제라는 지시서의 판단은 **맞았다** —
        「이벤트에 묶인 것만 뜬다」가 EventClip 없이는 성립하지 않는다.
    ▣ 잔여 7절의 성격 [실측]: SDN 5(F-06×2·F-07·F-08×2) + F-13 정찰 1 = **상대방 대기 6**,
      F-09 영상 재생 1 = CLIP_EXTRACTION(우리 · 설계 대기).
      **개발로 풀리는 절은 이제 하나뿐이다.**
  enforced_by: |
    · scripts/verify_contract_ac.py --table — 절 39 · 구현 32 · 잠김 7 · 미착수 0
    · docs/agent/evidence/D-309/contract_ac_ledger.yaml
  affects: [D-306, D-309, D-314, D-353]

- id: D-361
  title: "배포 앞단 이중방어 — **건다. 다만 배포 구성 작업 때 함께**"
  status: decided
  raised_by: "세종(기획) 2026-09-10 · 대표 위임"
  decision: |
    ▣ 판정: **건다.** 이유는 원칙 하나 — **단일 방어선은 방어선이 아니다.**
      미들웨어는 코드이고, 코드는 리팩터링 중에 순서가 바뀐다. 앞단은 그때 남는다.
    ▣ 다만 **지금이 아니다.** 앞단 구성(리버스 프록시)은 배포 문서 작업의 일부이고,
      실측하지 않은 채 규칙만 적으면 **문서가 거짓말을 시작한다**(D-286).
      → 상용 ④운영 영역의 절로 **등재만** 하고, 배포 구성 작업에서 함께 세운다.
        그때 순서 시험도 앞단까지 넓힌다.
    ▣ [2026-09-10] 이번 턴 미실행 — 지시대로 등재만 했다.
      ★ **등재된 것 자체가 이행이다.** 판정을 받고 안 한 것과, 판정을 받고 자리에
        적어 둔 것은 다르다 — 앞엣것은 잊히고 뒤엣것은 대장이 매번 「미착수」로 출력한다.
  enforced_by: |
    · docs/agent/evidence/D-346/ga_readiness.yaml — OPS-13(배포 앞단 이중방어 · 미착수).
      `scripts/verify_ga_readiness.py` 가 매 실행마다 이 절을 미착수로 세어 낸다 —
      **안 한 것이 수로 보이는 자리**가 이 판정을 강제한다.
    · 해소 시 넓힐 시험: backend/tests/test_access_gate.py::GateIsOutsideTheCacheTest
  affects: [D-286, D-348, D-357]

- id: D-362
  title: "남은 55자리 — **진술이 아니라 호출로** 종결한다"
  status: decided
  raised_by: "세종(기획) 2026-09-10 · 대표 위임"
  decision: |
    ▣ 「전역 기본값 거절이 덮는다」가 사실이라면 그 자리들은 이미 막혀 있다.
      **그러나 그건 진술이다.** 55자리를 익명·캐시우회로 **전수 호출**하고
      3갈래로 적어라: blocked_by_middleware / still_reached / not_applicable.
      still_reached 가 1건이라도 있으면 그것이 이번 턴 최우선(D-356 보다 앞).
    ▣ ★ [실측 2026-09-10] **1건도 아니고 3건이었다.** 그리고 그 3건은
      **직전 측정이 못 보던 자리**다 — 자세한 것은 D-364.
    ▣ 종결: 3건을 닫은 뒤 재호출 — **still_reached 0건.**
          blocked_by_middleware 31 · still_reached **0** · not_applicable 1
      ★ 넷째 수를 **접지 않고 따로 낸다**: `reached_no_data` **23건**.
        404·422·500 은 「관문을 지났으나 본문을 못 낸 것」이고, 3갈래 어디에도
        접어 넣으면 그 수가 사라진다(D-301). 이 23건 중 **20건이 관문이 아예 없는
        쓰기 면**이다 — 본문을 갖춘 요청이면 핸들러가 돈다. 다음 턴 항목으로 올린다.
    ▣ ★ D-323 그대로 — **「덮는다」는 진술이고, 확인 행위가 잠금을 내린다.**
  enforced_by: |
    · scripts/probe_gap_route_settlement.py — 쓰기는 transaction.atomic() + 롤백
    · docs/agent/evidence/D-362/gap_route_settlement.json
