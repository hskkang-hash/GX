- id: D-467
  author_tree_id: "대표 직접 지시(2026-09-16 · 영실 Code 세션) · 세종 턴 R P-144"
  title: "P-90 운영 읽기 4건 — 대표 승인은 도착했고, 주소는 오지 않았다"
  status: decided
  raised_by: "대표 2026-09-16 · 영실 세션 · 턴 R 조율자 항목 ④"
  decision: |
    ▣ 대표가 집행자(영실) 세션에 직접 적었다 — 문구 그대로:
      「P-90 운영 공개 진입면 읽기 4건 보내라 — 익명 GET 4 · 본문 저장 0 · 대표 2026-09-16」
      P-144 의 집행 조건 ①(집행자 세션에 대표가 직접)은 **성립했다.** 문서 인용이 아니다.
    ▣ 그럼에도 **집행하지 않았다 — 운영 주소가 없다.** 실측:
      · .env.gates 의 GX_API 는 http://localhost (우리 컨테이너)
      · decisions.yaml 에 P-90 주소 항목 0
      · 저장소 전체의 실재 외부 .kr 주소는 backend/third_api/common/utils.py:54-66 의
        delivery.whee-param.kr · dev.whee-param.kr 뿐 — 이것은 **배송(ETRI) 제3자 연계**
        주소이지 GuardianX 안양 운영계가 아니다. 이름이 비슷하다고 두드리면 그것은
        남의 서버를 두드리는 것이다.
    ▣ 근거는 우리가 이미 세운 원칙이다(evidence/P-90/commands.md §4):
      **승인에는 주소가 붙어야 한다. 「보내라」는 대상을 포함해야 명령이다.**
      **대상 없는 승인을 받은 쪽이 대상을 추정하면, 그 순간 그것은 승인받지 않은 행위다.**
      P-144 가 「문서는 승인이 아니다」를 세웠듯, 이 줄은 「승인은 대상을 포함한다」를 세운다.
    ▣ 다음: 대표가 주소 한 줄(https://…)을 적으면 그 턴에 probe_spec.md §2 그대로 —
      익명 GET 4 · 본문 저장 0(-o /dev/null) · 4건 밖 0 · 같은 날 재발송 0 — 실행하고
      상태코드·바이트·Content-Type·X-GX-Public-Projection 유무 4줄만 남긴다.
      같이 주시면 좋은 것: 허용 IP 제한 유무 · 보내도 되는 시간대.
    ▣ 정본 충돌 하나를 적어 둔다: evidence/P-90 에 사양이 둘 있다 —
      probe_spec.md(익명 GET 4 · 공개 진입면)와 commands.md(HEAD/OPTIONS 4 · 관문 0 자리).
      대표 문구가 「익명 GET 4」이고 턴 R §2 P-144 가 probe_spec.md 를 지목하므로
      **probe_spec.md 가 정본**이다. commands.md 는 §4 원칙 문서로만 남긴다.
  enforced_by: |
    · scripts/verify_external_sources.py — **이것이 실제 집행자다.** 운영 주소가 코드에
      들어오는 순간 이 게이트가 본다(제3자 외부 주소 등재부). 주소가 저장소에 없다는
      사실도 이 게이트가 지키는 사실이고, 누가 조용히 한 줄 적으면 여기서 멈춘다.
    · scripts/verify_no_secret_echo.py — 탐침이 실행되면 결과에 자격이 섞이지 않는지.
    · docs/agent/evidence/P-90/probe_spec.md (정본 · §2 명령 — 실행할 때 그대로 따른다)
    · docs/agent/evidence/P-90/commands.md §4 (원칙 — 승인에는 주소가 붙는다)
