- id: D-427
  author_tree_id: "세종 지시서 2026-09-26 §3 턴 A · 차선 S 첫 셋"
  title: "관문 없는 라우트 28건을 닫았다 — 그리고 **낡은 인벤토리가 게이트를 두 턴 동안 초록으로 만들고 있었다**"
  status: decided
  raised_by: "조율자(Code) 2026-09-26 · 차선 S (SEC-04 · SEC-07 · SEC-11)"
  decision: |
    ▣ **SEC-04 닫힘 — 우리 층 28 → 0** [실측].
      12파일의 라우트 28자리에 `auth=CustomJWTAuth()` 를 걸었다. 관문 없음 100 → **72**,
      남은 72는 전부 저장소 밖 49 · §0.4 금지구역 23 — 우리가 못 고치는 자리다.
      ★ **「데이터가 안 나왔다」는 「안전하다」가 아니다**(지시서 §4-2). 그래서 본문이 아니라
        관문으로 판정했고, 익명 호출 6자리를 다시 두드려 **전부 HTTP 401**을 받았다
        (200 봉투가 아니라 진짜 401).
      ★ 그 28 중에 **쓰기 면이 있었다** — 스트림 등록 · 외부 스트림 등록/수정 ·
        녹화 시작/중지 · AI 이중 스트림 시작/중지. 그리고 partner 콜백 모형 4자리는
        **익명 POST 로 소켓 알림을 밀어 넣을 수 있는 자리**였다.
      ★ 부작위 시험을 함께 세웠다: 앞 시험은 **이름을 적은 컨트롤러**만 보므로 이름을 안 적은
        새 컨트롤러가 관문 없이 태어나면 초록이다. 새 시험은 **레지스트리 전수**를 훑는다.
      ★ 그리고 `test_auth_surface` 둘이 빨개졌다 — **그 빨강이 옳았다.** 그 시험은
        「이 자리에는 관문이 없다」를 대조군으로 삼고 있었고, 시험 스스로 「관문이 생기면
        KNOWN_GAPS 를 낮추고 나를 고쳐라」라고 적어 두었다. 24 → **13**, 남은 13은 전부 §0.4.
        대조군을 §0.4 자리로 옮기고, **「없던 관문이 생겼다」를 말하는 시험**을 새로 넣었다.

    ▣ ★★ **SEC-11 — A2 전역 승격은 296건 중 0건을 갚았다** [실측]. 「대부분」이라 적었으면
      거짓말이 될 자리다(§4-3). 승격된 61건 중 `authz_path_permission` 을 가진 것은 0건 —
      승격된 자리는 전부 원래 `clean` 이던 라우트였다.
      ★ 그 사실이 **두 턴 동안 안 보였던 이유**: `route_inventory.json` 이 낡아 있었다.
        접두를 늘려도 커밋된 파일은 그대로였고, 게이트는 그 파일을 읽어 초록이었다.
        다시 뜨자 **대장에 없는 라우트 22건**도 함께 나왔다 — 지난 턴에 태어난 라우트들이다.
        **게이트가 읽는 파일이 늙으면 게이트도 함께 늙는다.**
      ★ 이번 턴 A2 접두 한 개: `/api/surveillance/`(48건 · 화면이 실제로 7건 부른다).
        **296 → 248.** 남은 248 중 delivery 48 · terminals 38 은 §0.4 다.

    ▣ **SEC-07 닫힘 — 키의 일생을 세웠다** (`common/key_rotation.py` · 18 passed).
      ★ **회전은 「끊고 새로 주기」가 아니다.** 그 자리에서 끊으면 상대 연동이 그 순간 죽고,
        **끊긴 쪽에서는 우리 잘못으로 보이지 않는다.** 옛 키를 겹치는 창(기본 7일)만큼 더
        살려 두고, 창이 닫힌 뒤 죽는 것까지 잰다. 그리고 회전이 **수명을 늘리는 일**이
        되지 않게 한다 — 겹치는 창이 지금 만료보다 뒤면 당기지 않는다.
      ★ 만료 없는 키를 기본값으로 내지 않는다(90일). 기본값이 「영원」이면 정책은 문서뿐이다.
      ★ 「끊었다」의 증거는 `is_active` 열이 아니라 **제품이 인증에 쓰는 그 함수**가 거절하는 것이다.
      ★ 자동으로 돌리지 않는다. beat(`common.key_rotation_watch_beat` · 03:50)는
        **때가 됐다는 사실만** 말한다 — 상대의 연동을 언제 흔들지는 사람이 정한다.

    ▣ ★ **잠자는 기능 게이트가 이번에도 한 자리를 잡았고, 옳았다.** 관할 술어를
      `backend/common/route_ownership.py` 에 두었더니 「제품 코드 어디에서도 안 부른다」로
      빨개졌다. 옳은 빨강이다 — 이것은 제품이 하는 일이 아니라 **재는 일**이고,
      재는 것은 재는 층에 산다. `scripts/route_ownership.py` 로 옮겼다.
      계측기와 부작위 시험이 **같은 한 벌**을 본다(D-369).

    ▣ [실측] 단위 **779 passed · 1 skipped** · 호스트 게이트 10종(빨강 0 · 대기 2) ·
      route-alive 빨강 2는 그대로다(MinIO 미가용 · UX-10 자리 · 이번 변경이 낸 것이 아니다).
      세 수: 상용 가중 **65.7%**(126) · 손 안 도달율 **71.4%**(112) · 구현 **80**.
  enforced_by: |
    · backend/tests/test_authn_gap_closed.py :: OurLayerHasNoGatelessRouteTest
    · backend/tests/test_auth_surface.py :: KNOWN_GAPS 13 · RemainingGapIsForbiddenZoneOnlyTest
    · backend/tests/test_s_key_rotation.py :: 18건 (겹치는 창 · 격리 · beat 배선)
    · backend/common/key_rotation.py · backend/common/ops_tasks.py :: key_rotation_watch_beat
    · backend/config/celery.py :: sec-key-rotation-watch-daily (03:50)
    · scripts/route_ownership.py — 관할 술어 한 벌 (계측기 + 시험이 함께 본다)
    · docs/agent/evidence/D-343/route_inventory.json — 685건 재측정
    · docs/agent/evidence/W0-18/auth_surface.md §2026-09-26
  affects: [D-207, D-277, D-284, D-290, D-300, D-301, D-311, D-335, D-342, D-343,
