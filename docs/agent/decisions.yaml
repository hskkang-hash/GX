- id: D-304
  title: "「추정이 틀린 것은 잘못이 아니다. 추정으로 처분한 것이 잘못이다」 + 착시 ⑥ 스키마"
  status: decided
  raised_by: "세종(기획) 2026-09-02 · 대표 위임"
  decision: |
    VIDEO 잠김을 **실 스트림 부재**로 추정했다. 실측 결과 **배선 부재**였다. 추정이 틀렸다.
    그러나 추정으로 처분하지 않고 사유를 물었고(D-302), 그래서 틀린 추정이 계약이 되지 않았다.

    ▣ 원칙 정본화: **추정에는 반드시 확인 요청을 붙인다.** 실측이 추정을 뒤집으면 그 자리에서
      추정문을 폐기하고, 폐기 사실을 결정문에 남긴다.
      → D-302 후단("실 스트림 부재로 추정")은 **폐기.** 사유는 배선 부재다.

    ▣ ★ 초록의 착시 **여섯째 형** — 지금까지 없던 종류다.
        ⑥ 스키마의 착시 — **필드가 있으면 기능이 있다고 읽는다.**
           `clip_path` : 정의 1건 · 읽기 2곳 · **쓰기 0곳.**
           읽는 코드가 있으니 살아 있는 것처럼 보이고, 시험은 읽기만 지나가며 초록이 된다.
           **쓰기가 없는 필드는 "구현된 것처럼 보이는 미구현"이다.**

      착시 여섯 형: ①부착률 ②시나리오 수 ③모수와 술어 ④탐지기 자체 ⑤환경 ⑥스키마(신설)

    ▣ 실측 (2026-09-02) — 전수 872 필드 중 **쓰기 0곳 156건.**
        §0.4 금지구역(delivery·orders·terminals) 61 · 우리 관할 95.
      전부에 사유를 달게 하면 그 작업은 **사후 정당화**가 된다(D-249). 그래서 D-270 ③ ·
      D-295 와 같은 **래칫**으로 간다: 오늘의 빚을 이름으로 잠그고 **새 빚만 막는다.**
      우리가 만든 것(Zone 4칸 · NotificationRule 3칸 · clip_path)은 빚 목록이 아니라
      `DECLARED_UNWIRED` 로 간다 — 거기에는 사유와 결정 번호가 붙는다.
  enforced_by: |
    · scripts/verify_dead_fields.py — 모델 필드 전수(872)를 훑어 쓰기 0곳 필드를 낸다.
      기준선 밖의 새 이름이 하나라도 생기면 exit 1. 검사 건수를 출력한다(D-301).
      --self-test 7건이 먼저 돈다. ★ 그중 하나는 이 판정기가 **처음에 놓쳤던 갈래**다:
      값 객체 생성자(`EventView(clip_path=row.clip_path)`)를 쓰기로 세면 죽은 필드가
      살아 있게 보인다 — 첫 판이 그래서 `clip_path` 를 "살아 있다"고 답했다.
    · docs/agent/evidence/D-304/dead_fields_baseline.txt — 오늘의 빚 148건을 이름으로 잠근다
      (개수가 아니라 이름 · D-285 ②). 줄어드는 것은 환영이고 실패가 아니다.
    · backend/tests/e2e/e2e_contract.py 의 LOCKED_CAPABILITIES["VIDEO"] — 폐기된 추정이
      아니라 실측 사유가 적혀 있다. 비면 시험이 멈춘다.
  affects: [착시, D-249, D-270, D-274, D-295, D-296, D-301, D-302, D-306]

- id: D-305
  title: "커밋은 '무엇을 했나'가 아니라 '무엇을 되돌릴 수 있나'의 단위 — 2커밋 + 릴리스 후보 태그"
  status: decided
  raised_by: "세종(기획) 2026-09-02 · 대표 위임 (커밋 전략 판정 요청에 대한 답)"
  question: "미커밋 두 턴을 ㉮ 1커밋 · ㉯ 2커밋 · ㉰ 브랜치 중 어느 것으로 처리하는가?"
  decision: |
    ▣ 판정: **㉯ 두 커밋.** 브랜치는 만들지 않는다.
      · 직전 턴분(SDN 표준 · DSM App · D-293/294)과 이번 턴분(Zone · FX-5 · 게이트 건수 ·
        계약 산출물)은 **되돌릴 사유가 서로 다르다.** SDN 명세가 오면 앞 커밋 위에 어댑터가
        얹히고, Zone 폴리곤이 열리면 뒤 커밋이 확장된다. 한 덩어리면 둘 중 하나를 건드릴 때
        다른 하나가 딸려 온다.
      · **브랜치 반려.** 검토자가 없는 브랜치는 격리가 아니라 지연이다. 필요한 것은
        리뷰 지점이 아니라 **되돌아갈 점**이고, 그건 태그가 더 정확히 준다.

    ▣ 태그 `rc-sdn-excl-0.1` — 릴리스 후보(SDN 제외판)의 되돌아갈 점.
      태그 메시지에 **그날의 수와 잠김 3종을 그대로** 적는다. 반년 뒤 이 태그를 여는
      사람에게 필요한 건 커밋 해시가 아니라 **그날의 분모**다.

    ▣ 커밋 메시지 규약 — 결정 번호를 **본문에** 적는다(제목 아님).

    ▣ 이행 시 고지된 한계(2026-09-02): 두 턴이 함께 손댄 파일 13종은 **한 커밋에 묶였다.**
      직전 턴이 커밋되지 않은 채였고 그 중간 상태를 복원할 수 없기 때문이다 —
      hunk 를 갈라 지어내면 그것은 내력이 아니라 **창작**이다(D-280). 해당 파일 목록을
      커밋 본문에 그대로 적었다.
  enforced_by: |
    · scripts/verify_commit_trace.py — 커밋 본문의 D-번호가 레지스트리에 없으면 exit 1
      (유령 번호 차단). 결정문을 고친 커밋에 번호가 하나도 없으면 exit 1.
      대상 커밋 0건이면 통과가 아니라 판정 불가로 exit 1 한다(D-301).
      --self-test 4건(양성 2 · 음성 2)이 먼저 돈다.
    · git tag rc-sdn-excl-0.1 — 그날의 수(329 passed · E2E 23 · 게이트 7종)와 잠김 3종이
      태그 메시지에 실측 그대로 있다.

    ▣ ★ 2026-09-05 술어 갱신 (D-327) — **게이트가 이 결정을 교정했다.**
      2커밋으로 나누려 하자 pre-commit 이 미스테이지분을 stash 하는 순간
      `gx-tool-selftest` 가 "표본 없이 태어난 도구 2종"으로 빨개졌다. 1커밋으로 묶었다.
      부정이 아니라 **정밀화**다. 갱신된 술어:
          커밋 단위 = **함께 되돌려야 게이트가 초록인 최소 집합**
          (기준선과 그것을 재는 파일은 한 되돌림 단위다)
      순서 지시와 게이트가 부딪히면 **게이트를 따르고 사유를 커밋 본문에 적는다.**
  affects: [내력, D-242, D-286, D-303, D-308, D-310, D-311, D-327]

- id: D-306
  title: "이벤트↔영상 배선 — 「구간 참조」를 지금 만들고 「구간 추출」은 선언된 미완성으로 잠근다"
  status: decided
  raised_by: "세종(기획) 2026-09-02 · 대표 위임 (D-302 VIDEO 실측에 대한 판정)"
  decision: |
    실측 진단이 맞다 — **개발로 풀 수 있으므로 계약 블로커가 아니고, 그래서 지금 착수한다.**
    다만 Zone 과 **똑같은 대칭**으로 연다: 지금 확실한 것만 채우고, 무거운 것은 상수로 잠근다.

    ▣ 지금 만드는 것 — **새 인코딩 0건.** "어디를 보라"만 적는다.
        EventClip(BaseModel)   event FK · object_key · start_offset · duration · clip_status
        clip_status : 'unavailable' | 'referenced' | 'extracted'
      · 쓰기 지점은 **이벤트 생성 경로 안 한 곳**이다. 밖에서 나중에 채우는 배치는 만들지
        않는다 — 그것이 `clip_path` 가 죽은 필드가 된 경로다(D-304 착시 ⑥).
      · 그 시각에 녹화가 없었으면 'unavailable' + 사유. **"아직 안 함"과 "없음"을 같은 값에
        두지 않는다**(D-290).

    ▣ 재생 라우트 — **계약 11조(원본 영상 무반출)가 여기서 걸린다.** 규약 넷을 시험으로 건다.
        ① 테넌트 범위 — 남의 event_id 는 404(403 아님. 존재도 알리지 않는다 · D-269)
        ② 만료 서명 URL — 무기한 링크 금지. 만료 시각을 시험이 확인한다
        ③ 구간 한정 — 요청 구간 밖 바이트가 나가지 않는다
        ④ **다운로드 아님** — 원본 전체를 주는 경로가 생기지 않았음을 부작위 시험으로(D-300)
      ★ 이번 턴에서 가장 위험한 지점이다. 영상은 우리 산출물 중 반출 위험이 가장 크다.
        **넷 중 하나라도 시험이 없으면 라우트를 내지 않는다.**

    ▣ 잠그는 것 — 실제 구간 추출·트랜스코딩: `CLIP_EXTRACTION_READY = False`
      · clip_status='extracted' 인 행이 하나라도 있는데 상수가 False → 게이트 exit 1
      · True 로 올리면 추출 결과의 무결성 시험이 즉시 의무가 된다
      → SDN·ZONE 과 같은 패턴이다. **세 번째 재사용이므로 이제 이것은 우리 표준이다.**

    ▣ E2E-1 VIDEO 칸: clip_status='referenced' + 재생 라우트 4규약 통과로 **연다.**
      잠김 3칸 중 하나가 줄어 **SDN 1칸만 남는다.**
  enforced_by: |
    · backend/stream_monitors/models.py 의 EventClip (마이그 0021) — clip_status 3값.
    · backend/stream_monitors/services/clips.py — CLIP_EXTRACTION_READY 잠금 + 사유.
      추출을 부르면 조용히 실패하지 않고 NotImplementedError 로 멈춘다(D-284).
    · backend/apps/dsm/api.py 의 clip_playback — 만료 서명 URL 만 낸다. 바이트를 흘리지 않는다.
    · backend/tests/test_clip_playback.py — 4규약을 **이름으로** 잠근다:
      test_rule1_another_tenant_gets_404 · test_rule2_url_expires ·
      test_rule3_only_the_requested_window · test_rule4_no_full_download_route_exists.
      하나라도 사라지면 test_the_four_rules_are_all_present 가 멈춘다.
    · scripts/verify_clip_extraction.py — 상수가 False 면 사유를 요구하고, True 로 올리면
      무결성 시험과 구현을 요구한다. --self-test 가 양성·음성을 먼저 돈다.
    · .pre-commit-config.yaml 훅 gx-clip-extraction.
  affects: [VIDEO, F-09, E2E-1, 계약 11조, K1, K4, D-290, D-299, D-300, D-302, D-304]

- id: D-307
  title: "FX-5 처리 승인 + 잠금 유형 3분류 신설 (DEV · CONTRACT · ADMIN)"
  status: decided
  raised_by: "세종(기획) 2026-09-02 · 대표 위임 (FX-5 판정 요청에 대한 답)"
  question: "juso 응답 스키마 미실측 상태에서 HTTP 구현체를 만들지 않은 것이 맞는가?"
  decision: |
    ▣ **맞다.** D-298 · D-280 을 정확히 준수했다. SDN 과 같은 형태(KERNEL_READY=False +
      사유 + DA-05 등재)로 세운 것도 옳다.
      "해소는 개발이 아니라 **키 발급 + 실측 1회**" — 이 진단이 회신에서 가장 값있다.
      막힌 것을 개발로 밀어붙이지 않고 **막은 것의 종류를 정확히 말했기** 때문이다.

    ▣ ★ 그래서 잠금 대장에 두 칸을 더한다. 이 표는 대표께 그대로 올라간다.
        unlock_type  : 'DEV' | 'CONTRACT' | 'ADMIN'
        unlock_owner : 누가 푸는가

        DEV      개발로 풀린다        VIDEO 구간 추출 · ZONE 폴리곤       → Code
        CONTRACT 상대방 이행이 필요   SDN API 명세 (계약 3조2항 기한 경과) → 에스비정보기술
        ADMIN    우리 쪽 사무 1회     juso 승인키 · CCTV 서비스명 · 포털키 → 대표

      지금까지 잠김은 전부 "막혔다" 한 단어였다. 셋은 성격이 전혀 다르다 —
      DEV 는 일정 문제, CONTRACT 는 책임 문제, ADMIN 은 **하루면 풀리는데 안 한 것**이다.
      섞어 두면 하루짜리가 계약 리스크 뒤에 숨는다.
  enforced_by: |
    · docs/agent/evidence/DA-05/blockers.yaml — 잠금 대장. 항목마다 unlock_type ·
      unlock_owner 가 필수다.
    · scripts/verify_blockers.py — 두 칸이 비거나 열거 밖 값이면 exit 1.
      유형별 건수를 출력하고, 대장이 0건이면 통과가 아니라 판정 불가로 exit 1 한다(D-301).
    · docs/agent/RELEASE_CANDIDATE.md — 유형별 건수를 표지에 싣는다.
  affects: [FX-5, SDN, ZONE, VIDEO, DA-05, D-280, D-297, D-298, D-303]

- id: D-308
  title: "알림 본문 좌표 노출 — 완화 승인 + 경계 명문화 / 릴리스 후보 선언의 의미 한정"
  status: decided
  raised_by: "세종(기획) 2026-09-02 · 대표 위임 (정정 고지에 대한 답)"
  decision: |
    ▣ **정정 고지 수용.** 지시(D-298)가 기존 방침(_subject_and_body 좌표 원문 금지)을
      덮었는데, 조용히 덮으면 나중에 사고가 된다. 스스로 고지한 것이 옳다.

      확정 경계 — 세 줄로 못박는다. **시험이 이 경계를 잡는다.**
        resolved → **주소만.** 좌표는 나가지 않는다
        failed   → 좌표 1줄 허용 ("주소 확인 불가(좌표: …)")
        pending  → **알림을 지연시키지 않는다.** 좌표로 즉시 발송하고 주소는 나중에 화면에서 채운다
                   ★ 알림 지연이 좌표 노출보다 나쁘다. 새벽 화재에 30초는 사람 목숨의
                     단위다 (F-10 AC).
      범위: 이 완화는 **알림 본문 한정**이다. 로그·보고서·외부 연계에는 적용하지 않는다.
      계약 11조 반출 금지는 **영상**에 대한 것이고 알림 본문은 그 대상이 아니다 —
      둘을 섞어 확대 해석하지 않는다.

    ▣ 릴리스 후보(SDN 제외판) 도달 — **인정한다.** D-303 다섯 조건 충족.
      다만 "선언"의 의미를 좁힌다: 이것은 **내부 판정이며 에스비 제출물이 아니다.**
      제출은 계약 7조 3단계(통합시험, 2027.1)다. 이 선언의 값은 하나 — **되돌아갈 점이 생긴 것.**
      「빈 DB 에서 세워 보며 설치 매뉴얼을 작성」한 것도 인정한다 — 이미 돌던 환경에서
      적었으면 빠진 단계가 초록 속에 숨었을 것이다.
  enforced_by: |
    · backend/kernels/k2_notify/services.py 의 _location_line — 세 줄 경계의 구현체.
      완화 범위가 이 함수 하나로 좁혀져 있다.
    · backend/tests/test_fx5_address.py 의 AlertBodyTest — 경계를 시험이 잡는다:
      resolved 본문에 좌표가 실리면 실패 · failed 본문에 좌표가 없으면 실패 ·
      pending 이 발송을 막으면 실패(test_pending_does_not_delay_the_alert).
    · git tag rc-sdn-excl-0.1 의 메시지 — "내부 판정이며 제출물이 아니다"가 적혀 있다.
    · docs/agent/RELEASE_CANDIDATE.md §0 — 같은 문장.
  affects: [FX-5, F-10, K2, 계약 11조, D-298, D-303, D-305]

- id: D-309
  title: "계약 AC 전수 대장 F-01~F-14 — 실측으로 만든다. 문서 읽기로 만들지 않는다"
  status: decided
  raised_by: "세종(기획) 2026-09-02 · 대표 위임"
  decision: |
    지금까지 F-09~F-12 만 이야기했다. **계약 기능은 14건이다.** 나머지의 상태를 우리는
    표로 갖고 있지 않다.

    ▣ 한 줄에 적는 것: 기능번호 · 계약 AC · 현재 상태(구현/부분/미측정/잠김) ·
      **그 상태를 증명하는 시험 파일** · 잠김이면 unlock_type(D-307) · 커널 귀속(K1~K7)

    ▣ ★ 규칙: **증명 시험이 없는 칸은 '구현'으로 적을 수 없다.** 그런 칸은 '부분'이 아니라
      **'미측정'**이다. "미측정"이 몇 건인지가 이 표의 진짜 값이다 —
      우리가 **무엇을 모르는지** 세는 표이기 때문이다.

    ▣ 초효율: 이 표가 곧 통합시험 결과서의 목차이고, 동시에 검수 대비표이며,
      동시에 U1~U4 상용판이 어느 커널에 얹히는지 보여 주는 이중 AC 지도다.
      **한 번 만들어 세 번 쓴다.**

    ▣ D-292 반성: 문서를 읽어 표를 만들면 그 표는 문서의 사본이다. 상태 칸은
      **시험 파일이 실재하는가**로만 채운다.
  enforced_by: |
    · docs/agent/evidence/D-309/contract_ac_ledger.yaml — 14행 대장. 상태·증명 시험·
      unlock_type·커널 귀속.
    · scripts/verify_contract_ac.py — 행 수 ≠ 14 이면 exit 1 · '구현' 칸에 시험 경로가
      비면 exit 1 · 적힌 시험 파일이 실재하지 않으면 exit 1(없는 시험은 문서다).
      검사 건수와 **미측정 건수**를 출력한다(D-301). --self-test 가 먼저 돈다.
    · .pre-commit-config.yaml 훅 gx-contract-ac.
  affects: [F-01, F-02, F-03, F-04, F-06, F-07, F-08, F-09, F-10, F-11, F-12, F-13, F-14,
            U1, U2, U3, U4, D-292, D-301, D-307]

- id: D-310
  title: "도구는 자기가 태어난 표본을 시험에 넣는다 — 자기표본 원칙 신설"
  status: decided
  raised_by: "세종(기획) 2026-09-03 · 대표 위임"
  decision: |
    죽은 필드 판정기가 **자기가 태어난 이유(clip_path)를 "살아 있다"고 답했다.**
    착시 ⑥ 을 잡으려는 도구가 착시 ⑥ 의 표본을 못 본 것이다.

    ▣ 왜 무서운가: 도구는 만들어진 순간 "이제 이 착시는 잡힌다"는 **안심**을 주고,
      그 안심은 도구가 실제로 그 표본을 잡는지와 **무관하게** 생긴다.
      안심만 남고 검사는 없는 상태 — D-301(검사 못함 ≠ 0건 검사)의 형제다.
    ▣ 원칙: 게이트·검증기를 만들 때 **그 도구를 만들게 한 바로 그 사례**를 fixture 로 박는다.
      그 표본에서 초록이 나오면 도구가 아니다.
    ▣ 술어를 좁힐 때마다 **그 술어의 반례 둘을 자기시험에 넣는다.**
        키워드 인자 전부를 쓰기로 셈 → 값을 실어 나르는 자리가 쓰기로 잡힌다(거짓 음성)
        FK 를 x_id= 로 쓰는 갈래 누락 → 살아 있는 필드가 죽었다고 잡힌다(거짓 양성)

    ▣ 2026-09-04 실측 (분모와 함께): 대상 **27종**(지시서의 24 는 추정치였다 — 게이트 7 +
      verify_*·check_* 20). 자기시험 보유 **16/27** · 출생 표본 보유 **3/27** → 채워서 **10/27**.
      나머지 17종은 D-311 과 같은 이유로 **래칫**으로 잠근다(소급 사유 요구 금지).

    ▣ ★ 이 턴에 이 원칙이 **세 번 값을 했다.** 셋 다 술어를 좁히다 반대편으로 넘어간 자리였다:
      ① verify_external_sources — 소스에 이름이 나오면 참조로 셈 → 독스트링 설명이 잡혔다
      ② 같은 도구 — 문자열을 통째로 버림 → `os.environ["X"]` 를 놓쳤다(환경변수는 늘 문자열)
      ③ 같은 도구 — 토큰을 공백으로 이어 붙임 → `os . environ [ "X" ]` 가 되어 정규식이 안 맞았다
  enforced_by: |
    · scripts/verify_tool_selftest.py — 게이트·검증기 전수에 birth-sample fixture 가 있는지
      검사한다. 검사 건수를 분모와 함께 출력하고(D-301), 기준선 밖에서 표본 없이 태어난
      새 도구가 있으면 exit 1. 자기 출생 표본은 「자기시험은 있는데 출생 표본이 없다」다.
    · docs/agent/evidence/D-310/selftest_baseline.txt — 오늘 표본이 없는 17종을 이름으로 잠근다.
    · scripts/verify_dead_fields.py 의 자기시험 — 값 객체 생성자 갈래(clip_path)가 들어 있다.
    · scripts/verify_external_sources.py 의 자기시험 — 술어 반례 3종이 들어 있다.
  affects: [게이트 전종, D-249, D-277, D-289, D-301, D-304, D-311]

- id: D-311
  title: "「화이트리스트 밖 1건이라도 exit 1」 지시 철회 — 래칫으로 교체 (지시 정정)"
  status: decided
  raised_by: "세종(기획) 2026-09-03 · 대표 위임 (지시 정정)"
  decision: |
    원 지시대로 했으면 **156건 중 148건에 사유를 다는 작업**이 되고, 그것은 사후
    정당화다(D-249). D-270 ③ · D-295 와 같은 래칫으로 바꾼 판단을 **채택한다.**

    ▣ 원칙 확장: **소급 사유 요구를 금지한다.** 인수 이전의 빚에 사유를 달게 하면
      사유란이 거짓으로 채워지고, 그 거짓이 다음 판정의 근거가 된다.
      빚은 **세고, 잠그고, 늘리지 않는다.**

        오늘의 빚 148    이름으로 잠근다. 목록 고정 — 사유를 요구하지 않는다
        우리가 만든 것 8   사유 + 결정 번호로 등재 (Zone 4 · NotificationRule 3 · clip_path 1)
        목록 밖 새 것 0    exit 1 — 래칫. **여기서만 조인다**
        §0.4 금지구역 61  우리 관할 아님(D-207). 목록에 두되 **잔여 계산의 분모에서 뺀다**

    ▣ 조건 하나: 잠근 148건은 **줄어들 수만 있어야 한다.** 목록에서 한 줄이 사라지면
      (배선됐거나 삭제됐거나) 그 사실이 **로그에 남는다.** 빚 목록이 조용히 늘지 않는
      것만으로는 부족하다 — **줄어드는 것이 보여야 갚는 맛이 난다.**
  enforced_by: |
    · scripts/verify_dead_fields.py — 기준선 밖 새 이름이 생기면 exit 1. §0.4 61건을
      잔여 분모에서 빼고 **우리 관할 잔여**를 따로 출력한다. 기준선에서 빠진 줄은
      이름을 하나씩 로그로 낸다("갚음: …").
    · docs/agent/evidence/D-304/dead_fields_baseline.txt — 148건을 이름으로 잠근 목록.
  affects: [D-249, D-270, D-295, D-304, D-307]

- id: D-312
  title: "AUTHOR ERROR — 보안 지시는 관용어가 아니라 「금지 대상」으로 쓴다"
  status: decided
  raised_by: "세종(기획) 2026-09-03 · **저자 오류 자인**"
  decision: |
    D-306 §2 규약 ②에 **"만료 서명 URL"** 이라고 적었다. 그 말은 S3·MinIO 관용으로
    **프리사인드 URL** 을 뜻하고, 그것은 **객체 전체를 준다.**
    30초를 주려다 두 시간짜리 원본을 내보내는 구현이 되었을 것이다.

    ★ **계약 11조를 지키라고 쓴 문장이, 계약 11조를 깨는 구현을 지시하고 있었다.**

    ▣ 채택 — 권한을 **객체가 아니라 구간에** 붙인다:
        ✗ presigned_url(object_key, expires=30)     # 30초 동안 원본 전체
        ○ ticket = sign({event_id, object_key, start, duration, exp})
                                                    # 권한이 구간에 붙는다
      규약 넷을 이름으로 잠그고 `test_the_four_rules_are_all_present` 가 넷의 실재를
      판정하게 한 것 — D-286("절차는 도구로")의 정확한 적용이다. 인정한다.

    ▣ 원칙: **보안 지시는 수단이 아니라 금지 대상으로 쓴다.**
        ✗ 수단      "만료 서명 URL 을 써라"
                    → 그 수단의 기본 동작이 금지선을 넘어도 **지시를 지킨 것이 된다**
        ○ 금지 대상 "요청 구간 밖 바이트가 한 톨도 나가지 않는다"
                    → 구현이 무엇이든 **금지선이 그대로 시험이 된다**
      앞으로 지시에 수단이 적히면, 그 수단의 기본 동작이 금지선을 넘는지 되묻는다.
  enforced_by: |
    · backend/tests/test_clip_playback.py 의 test_rule4_no_full_download_route_exists —
      presigned · FileResponse · StreamingHttpResponse · X-Accel-Redirect · attachment 가
      영상 경로에 **없음**을 잰다. 수단이 아니라 금지 대상을 잰다.
    · backend/stream_monitors/services/clips.py — 티켓이 (event_id·object_key·start·
      duration·exp)에 묶여 서명된다. 구간을 바꾸면 서명이 깨진다.
    · scripts/verify_clip_extraction.py 의 출생 표본 — 사유 없는 잠금을 잡는 갈래에
      이 사건이 적혀 있다.
  affects: [D-306, 계약 11조, F-09, 보안 지시 일반]

- id: D-313
  title: "E2E-1 9단계 제목 교체 인정 — 잴 수 없는 것은 시험 제목에서도 뺀다"
  status: decided
  raised_by: "세종(기획) 2026-09-03 · 대표 위임"
  decision: |
    "영상 3초 이내 재생" → "영상 구간 참조 + 재생 규약 4종" 으로 바꾼 것이 옳다.
    3초는 바이트가 나가야 재는 것이고 그것은 지금 잠겨 있다. 원래 문장을 두고 초록을
    내면 **재지 않은 것을 잰 것으로 읽힌다.**

    ▣ 원칙 확장: **잴 수 없는 것은 시험 제목에서도 뺀다.** 제목은 사람이 읽는 유일한
      술어다. 제목이 분모를 속이면 표 전체가 착시 ③ 이 된다.
    ▣ 3초 AC 는 `CLIP_EXTRACTION_READY=True` 와 **동시에 되살아난다** —
      그 커밋에서 제목도 함께 되돌린다.
  enforced_by: |
    · backend/tests/e2e/e2e_contract.py 의 Step(9) 제목과 ac 문자열 — 재는 것을 그대로 적는다.
    · docs/agent/evidence/D-309/contract_ac_ledger.yaml 의 F-09 "영상 3초 이내 재생" 절 —
      state=잠김 · unlock_id=CLIP_EXTRACTION 이고, note 에 "이 절이 열리는 커밋에서
      E2E-1 9단계 제목도 함께 되돌린다" 가 적혀 있다.
  affects: [E2E-1, F-09, D-302, D-306, D-314]

- id: D-314
  title: "「부분」이라는 칸을 없앤다 — 계약 AC 를 절로 쪼갠다"
  status: decided
  raised_by: "세종(기획) 2026-09-03 · 대표 위임"
  decision: |
    계약 AC 14건이 구현 5 · 부분 5 · 잠김 3 · 미측정 1 이었다. **그중 부분 5가 우리가
    가장 모르는 칸이다.** '부분' 은 상태가 아니라 **아직 안 쪼갠 것의 이름**이다 —
    부분 5건이 있는 한 잔여를 모른다. 5건이 95% 인지 20% 인지 표가 말하지 못한다.
    착시 ③(모수와 술어)의 대장 판이다.

    ▣ 방법: 계약 AC 는 문장이고, 문장은 **절로 쪼갤 수 있다.**
    ▣ 규칙 셋
      ① 각 절은 구현 / 미착수 / 잠김 / 미측정 중 하나다. **'부분' 은 절 단위에 존재할 수 없다**
      ② '구현' 절에는 증명 시험의 파일::메서드가 반드시 있다. 없으면 그 절은 '미측정'
      ③ 절마다 **AC 원문의 어느 구절에서 나왔는지**를 적는다 —
         원문 인용 없는 절은 우리가 만든 절이지 계약의 절이 아니다

    ▣ 2026-09-04 실측: **절 39개 · 구현 25 · 미착수 6 · 잠김 8 · 미측정 0.**
      → **잔여 14절 / 전체 39절 (구현 64%).** 이제 잔여가 숫자다.
    ▣ 부수 소득 — 절로 쪼개니 **같은 뿌리가 드러났다**: F-02 "지점별 기준선 설정" 과
      F-12 "임계값" 은 표 하나가 두 절을 함께 올린다. F-05 "API Key 발급·폐기" 와
      F-12 "API키" 도 같다. 통합 전에는 안 보이던 것이다.
  enforced_by: |
    · docs/agent/evidence/D-309/contract_ac_ledger.yaml — 14건이 39절로 쪼개져 있다.
    · scripts/verify_contract_ac.py — 상태 '부분' 이 한 칸이라도 남으면 exit 1 ·
      '구현' 절에 시험이 없으면 exit 1 · 인용이 AC 문장의 부분 문자열이 아니면 exit 1 ·
      절 총수/구현/미착수/잠김/미측정을 건수로 출력. 출생 표본 2종(D-309·D-314)을 갖는다.
    · .pre-commit-config.yaml 훅 gx-contract-ac.
  affects: [계약 AC 전건, D-292, D-301, D-307, D-309, D-313]

- id: D-315
  title: "F-05 미측정 해소 — 진입면은 계측이지 개발이 아니다. 구현 확장 금지, 경계 고정만"
  status: decided
  raised_by: "세종(기획) 2026-09-03 · 대표 위임"
  decision: |
    **잠김보다 먼저 푼다.** 잠김은 이름과 사유가 있고, 미측정은 **모른다는 사실만** 있다.
    잠김 3건은 대장에서 스스로를 말하지만, 미측정 1건은 **검수 자리에서 처음 드러난다.**

    ▣ F-05 는 아무 칸이 아니다 — **파는 것의 경계면**이다.
        계약: 에스비 App 이 여기로 들어온다 · 상용: U1~U4 가 같은 면으로 붙는다 ·
        사업: 이 면의 문서가 곧 **연동 규격서**다.
    ▣ 계측 방법 — **구현을 늘리지 말고 경계를 고정한다.**
        인증·테넌트  남의 자원 요청 → 404 (D-269 — 존재도 알리지 않는다)
        입력 계약    필수/선택·타입·거부 시 오류 코드 — 성공 경로만 재지 마라
        출력 계약    나가면 안 되는 것이 응답에 없음 (부작위 시험 · D-300)
        판 고정      응답 스키마 스냅샷을 시험에 박아 말없이 바뀌면 빨개지게 한다
    ▣ 산출: **이 시험 파일이 그대로 연동 규격서의 정본**이다. 문서를 따로 쓰지 않는다 —
      문서와 시험이 갈라지는 순간 문서가 거짓말을 시작한다(D-286).

    ▣ 2026-09-04 실측: "하나로만" 은 **부작위로만** 정확히 잴 수 있다 —
      라우트를 가진 모듈 **51개 중 K1 을 직접 import 하는 것 0개**, L4 App 소비자 1개,
      K1 소비자 8개 전부 사유와 함께 등재. 진입면 10개·응답 키 12개를 이름으로 고정.
      ⚠ 술어 정정 1건: 처음에는 2단계 import 폐포로 셌고 662 중 98건이 잡혔다 —
        delivery·stream_monitors 가 전이 import 만으로 걸렸다. **전이 근접성은 도달이 아니다.**
  enforced_by: |
    · backend/tests/test_f05_event_api.py — 진입면·잠금·모양 셋을 잰다. 이 파일이
      연동 규격서의 정본이다. K1_CONSUMERS 등재부가 소비자를 이름으로 잠근다(D-285 ②).
    · docs/agent/evidence/D-309/contract_ac_ledger.yaml 의 F-05 절 셋 — 증명 시험 8건.
    · scripts/verify_contract_ac.py — 그 시험들의 실재를 매번 다시 본다.
  affects: [F-05, K1, DA-04, U1, U2, U3, U4, D-269, D-285, D-300, D-309, D-314]

- id: D-316
  title: "외부 자원은 「문서에 있다」가 아니라 **「이 환경에서 보았다」**로만 등재한다 (D-323 으로 한 겹 내림)"
  status: decided
  raised_by: "세종(기획) 2026-09-04 · 대표 위임"
  decision: |
    `.env.example` 에 우리가 비워 둔 자리 중 **셋이 계정에 존재하지 않는다** —
    DISASTER_CCTV · NLPRK_SAFETY · CHILDCARE_SAFETY. 활용신청 현황 **18건 전수**를
    확인했고 셋은 그 안에 없다.

    ▣ 경위: 우리는 대표께서 주신 API 목록 **문서**를 근거로 자리를 잡았다. 그 문서는
      "받을 수 있는 것" 의 목록이었지 **"받은 것" 의 목록이 아니었다.**
      D-292(내 판단의 근거가 실측이 아니라 문서였던 사건)와 **같은 얼굴**이고,
      이번엔 외부 자원에서 났다.
    ▣ 원칙 [2026-09-05 D-323 으로 교체 — 원문은 「계정 화면에서 확인한 것만」이었다]:
      **「발급된 것과 이 환경에 있는 것은 다른 사실이고, 그것이 이 결정의 원칙이다.」**
      외부 API·키·계정은 **이 환경에서 확인한 것만 등재한다.**
      계정 화면에서 본 것은 「발급됐다」까지이고, 그것은 「이 개발 환경에 있다」가 아니다.
      juso 승인키가 정확히 그 자리에서 갈렸다 — 발급 완료 · 환경 부재(D-321 · D-323).
      문서·메일·구두·**계정 화면**으로 안 것은 `doc_only` 로 두고
      **어댑터를 만들지 않는다**(D-298 그대로. 다만 금지선은 행위에 긋는다 — D-324).
    ▣ 이 원칙은 D-310(도구는 자기가 태어난 표본을 못 본다)의 **바깥짝**이다 —
      거긴 도구가 자기를 못 보는 문제였고, 여긴 **대장이 바깥을 못 보는 문제**다.

    ▣ 2026-09-04 실측: 외부 자원 16건 — account_verified **8** · doc_only **8**.
      ⚠ 승인과 엔드포인트 실측은 **다른 사실**이다. 기상청 3종은 승인은 확인됐고
        URL 문자열은 아직 미실측이며, 그 구별을 항목 주석에 적었다.
  enforced_by: |
    · backend/.env.example — 항목마다 `# source: account_verified | doc_only` ·
      `# status: not_applied | not_required`.
    · scripts/verify_external_sources.py — 근거가 없거나 열거 밖이면 exit 1,
      **doc_only 항목을 어댑터가 설정으로 읽으면 exit 1**. 건수를 출력한다(D-301).
      출생 표본과 술어 반례 3종(산문 상수 · 독스트링 · 진짜 읽기)을 갖는다(D-310).
  affects: [DA-05, FX-1, FX-2, FX-5, FX-6, D-280, D-292, D-298, D-310, D-317, D-321, D-323, D-324]

- id: D-317
  title: "확보 자산 확정 — 제품 직결 3종 + 주소 1종. 없는 것 3종은 대장에서 처리"
  status: decided
  raised_by: "세종(기획) 2026-09-04 · 대표 위임"
  decision: |
    활용신청 현황 18건 실측 분류.

    ▣ 제품 직결(지금 쓴다): 기상청 기상특보(FX-1·FX-2 발동 조건) · 한국천문연구원 특일정보
      (FX-6) · 전국초중등학교위치표준데이터(대피소 컨텍스트) · (별도 계정) juso 승인키 2건
    ▣ 제품 예약(계약 범위 밖): 건축HUB · 토지이용규제 → 시설물 App 슬롯. 지금 만들지 않는다
    ▣ 보조(P1): 기상청 단기·중기예보 · 소상공인 상가정보 — 절 표가 나온 뒤 판단
    ▣ 저장소 등재 금지: 조달청 3종 · 관세청 · 금융위 4종 · 국세청 · 대구교육청 —
      사업개발용이거나 무관하다
    ▣ **없는 것 3종**: DISASTER_CCTV(11) · NLPRK_SAFETY(5) · CHILDCARE_SAFETY(6) →
      `.env.example` 에 `source: doc_only` 로 표기하고 **자리는 남긴다.** 어댑터 금지 유지.
  enforced_by: |
    · backend/.env.example — 16개 항목의 근거 표기. account_verified 8 · doc_only 8.
    · scripts/verify_external_sources.py — 위 표기를 판정하고 건수를 출력한다.
    · docs/agent/evidence/DA-05/sources.yaml — 실측 전 원천은 verified:false 로 남는다.
  affects: [DA-05, FX-1, FX-2, FX-5, FX-6, D-298, D-316, D-321]

- id: D-318
  title: "FX-5 최우선 실측 — juso 가 「좌표 → 주소」 역방향을 주는지 실호출 1회로 판정"
  status: decided
  raised_by: "세종(기획) 2026-09-04 · 대표 위임 (추정 + 확인 요청 · D-304 형식)"
  decision: |
    ▣ 우려(추정이므로 확인 요청을 붙인다): juso.go.kr 주소정보 연계서비스의 주력은
      「검색어 → 도로명주소」와 「주소 → 좌표」다. FX-5 가 필요한 것은 **그 반대 방향**
      (좌표 → 도로명주소, 역지오코딩)이다.
      ★ 역방향을 주지 않으면 **키가 와도 FX-5 는 열리지 않는다.** 그때는 어댑터 설계가
        아니라 **자원 선택**의 문제이고, 그 선택은 개발이 판정하지 않는다.
    ▣ 판정 셋 중 하나만 낸다: ㉠ yes(스키마 스냅샷을 시험에 박고 착수) ·
      ㉡ no(FX-5 를 KERNEL_READY=False 로 유지하고 DA 에 「자원 부재」로 사유 교체.
      대체 후보는 조사만 하고 고르지 않는다) · ㉢ unknown(그 사실 자체를 사유로 적는다)
    ▣ 어느 경우에도 **응답을 보기 전에 어댑터를 만들지 않는다**(D-298 · D-280).

    ▣ 2026-09-04 이행 결과: **㉢ unknown.**
      승인키가 이 개발 환경에 없다 — vault(2026-02-10판)에 juso 항목 없음 ·
      환경변수 GX_JUSO_API_KEY 없음 · backend/.env 파일 부재. 실호출을 못 했고,
      **추정으로 채우지 않았다.** 대신 1명령으로 판정되는 실측기를 세워 두었다.
  enforced_by: |
    · backend/adapters/juso/__init__.py 의 JUSO_REVERSE_SUPPORTED — 'unknown'|'yes'|'no'
      3값. 사유(JUSO_REVERSE_UNKNOWN_REASON)가 비면 게이트 exit 1.
    · scripts/verify_juso_direction.py — 'unknown' 인데 **HTTP 구현이 있으면 exit 1** ·
      'yes' 인데 스키마 스냅샷 시험이 없으면 exit 1 · 'no' 인데 사유가 없으면 exit 1.
      출생 표본은 「unknown 인데 어댑터를 만들 뻔한」 그 모양이다(D-310).
    · scripts/probe_juso_direction.py — 실호출 1회 + 증거 기록(키 마스킹 · D-319).
      키가 없으면 exit 2(판정 불가)를 낸다 — 실패(1)와 구별한다(D-301).
  affects: [FX-5, DA-05, D-280, D-290, D-298, D-304, D-316, D-319]

- id: D-319
  title: "승인키 2건 수령 — 저장소·문서·시험 어디에도 값을 넣지 않는다"
  status: decided
  raised_by: "세종(기획) 2026-09-04 · 대표 위임"
  decision: |
    ▣ 어떤 산출물에도 키 값을 재현하지 않는다.
    ▣ 보관: C:\GuardianX-vault\ → 로컬 `.env`(gitignore) → 환경변수.
      `.env.example` 은 **이름만**(D-204).
    ▣ 실호출 증거를 남길 때 **요청 URL 의 키 파라미터를 마스킹**한다 — evidence/ 는 커밋된다.
      응답 본문에 키가 되비쳐 나오는 경우까지 마스킹한다.
    ▣ 대표께: 키가 화면 캡처로 대화에 남았다. 공개 저장소 유출은 아니고 등록 URL 이
      한정되어 위험은 낮으나, **재발급이 마음 편하시면 지금이 가장 싼 시점**이다
      (D-004 — 유출 대응은 이력 세탁이 아니라 무효화다). 아직 아무 코드도 그 키에 묶여 있지 않다.
  enforced_by: |
    · scripts/probe_juso_direction.py 의 mask() — 요청 URL·예외 메시지·응답 본문에서
      키를 지운다. 키는 환경변수에서만 읽고 인자로도 받지 않는다.
    · docs/agent/verify_gates.sh GATE secrets — .env.example 실값 0개를 매번 판정하고,
      판정 전에 심은 실값 2건을 잡는지 **자기시험**을 먼저 돈다(출생 표본 · D-310).
    · .gitleaks.toml + .pre-commit-config.yaml 훅 gitleaks — 커밋 시점 차단.
  affects: [D-002, D-004, D-204, D-298, D-318, FX-5]

- id: D-320
  title: "SDN 잠금 상태 전환 — 「미발송」에서 「발송·회신 대기」로. 기산점을 도구가 센다"
  status: decided
  raised_by: "세종(기획) 2026-09-04 · 대표 위임"
  decision: |
    발송 완료를 인정한다. 이로써 **계약 6조3항(협조 지연 시 이행기한 자동 연장)의
    기산점이 섰다.** 이건 개발 진척이 아니라 **계약상 지위의 변화**다 —
    이제 지연의 책임 소재가 문서로 남는다.

    ▣ blockers.yaml 의 CONTRACT 항목에 칸 셋: `sent_at` · `due_by`(발송 + 15일 ·
      계약 3조2항 준용) · 경과 일수(게이트가 **매 실행마다 계산**한다).
      ★ 경과를 문서에 적지 않는 이유: 적으면 그 숫자는 적은 날에 멈춘다.
    ▣ 기한 경과 시 exit 0 이되 표지에 **「SDN 회신 지연 N일」을 반드시 출력**한다.
      → 잠김이 조용히 늙지 않게 한다. **시간이 지나는 것이 화면에 보여야 협상 카드가 된다.**
    ▣ E2E-3 · F-13/14 는 그대로 잠김. 표준(포트·수령요건 34건)은 서 있으므로
      **수령 즉시 어댑터만 채운다.**
  enforced_by: |
    · docs/agent/evidence/DA-05/blockers.yaml 의 SDN_API_SPEC — sent_at · due_by.
    · scripts/verify_blockers.py — CONTRACT 인데 sent_at·due_by 가 비면 exit 1.
      elapsed_lines() 가 매 실행마다 대기·지연 일수를 계산해 출력한다.
  affects: [SDN, F-06, F-07, F-08, F-13, E2E-3, 계약 3조2항, 계약 6조3항, D-297, D-307]

- id: D-321
  title: "DISASTER_CCTV 를 잠금 대장에서 하차 — 이름의 유사성을 기능의 필요성으로 읽었다"
  status: decided
  raised_by: "세종(기획) 2026-09-04 · 대표 위임"
  decision: |
    ▣ 근거: 공공데이터포털의 재난안전 CCTV 정보는 **"어디에 CCTV 가 있는지" 의
      메타데이터**이지 영상이 아니다. 우리는 CCTV 영상을 **직접 받는 회사**다
      (L1 현장 연계). 설치 위치 목록은 우리 기능 어디에도 입력으로 들어가지 않는다.
    ▣ ★ 그동안 이것이 잠금으로 남아 있던 이유는 하나다 — **이름이 우리 도메인과 닮아서.**
      "CCTV·재난안전정보" 는 우리가 하는 일처럼 들린다. 그러나 하는 일이 아니다.
      **이름의 유사성을 기능의 필요성으로 읽은 것 — 이것도 착시의 한 종류다.**
    ▣ 처리: `.env.example` 에 항목은 남기되 `status: not_required` + 사유.
      국립공원(5)·아동센터(6)도 같다 — 컨텍스트 보강용이지 계약 AC 어디에도 걸리지 않는다.

    ▣ 2026-09-04 이행 결과 — 잠금 대장 **6건 → 5건** (CCTV_SERVICE_NAME 하차):
        DEV 3 (VIDEO 추출 · ZONE 폴리곤 · 빈 DB 한 줄 설치)
        CONTRACT 1 (SDN — 발송·대기)
        ADMIN **1** (juso 키 전달)
      ⚠ 지시서 §5 는 ADMIN 0건을 예상했으나 **1건으로 남겼다.** 승인키 발급은 완료됐고
        이 개발 환경에 없다 — 남은 한 걸음이 개발이 아니라 **사무(키 전달)** 이기 때문이다.
        유형을 사실과 다르게 적으면 그 순간 이 대장이 하는 일이 없어진다(D-307).
  enforced_by: |
    · docs/agent/evidence/DA-05/blockers.yaml — CCTV 항목이 지워진 자리에 **왜 내렸는지**가
      주석으로 남아 있다. 지운 것을 지운 채로 두면 다음 사람이 다시 올린다.
    · backend/.env.example — DISASTER_CCTV·NLPRK_SAFETY·CHILDCARE_SAFETY 에
      `status: not_required` + 사유.
    · scripts/verify_blockers.py — 유형별 건수를 매 실행마다 출력한다.
  affects: [DA-05, D-298, D-307, D-316, D-317, 착시]

# --- 2026-09-05 판정자 게이트 · 공통 뿌리 표 2개 (D-322 ~ D-327) -------------

- id: D-322
  title: "판정자에게도 게이트를 건다 — 지시서의 모든 수치·상태에 출처 태그를 강제한다"
  status: decided
  raised_by: "세종(기획) 2026-09-05 · 대표 위임"
  decision: |
    ▣ 규약: 지시서가 쓰는 모든 수·상태에 태그를 단다.
        [실측]  = 보고나 화면에서 확인한 것 (출처를 함께 적는다)
        [추정]  = 어림한 것. **받는 쪽이 실측해서 갈아 끼워야 하는 자리**
        [인용]  = 계약서·문서에서 그대로 옮긴 것
    ▣ ★ 강제: **태그 없는 수치는 인용을 거부한다.** 지시서에 태그 없는 숫자가 있으면
      그 숫자를 코드·대장·시험 어디에도 넣지 않고, 회신에 「출처 미표기 N건」으로 돌려보낸다.
      D-301 이 "건수 없는 게이트는 게이트로 인정하지 않는다"고 했다. **같은 규칙을 판정자에게 적용한다.**
    ▣ 왜 도구가 아니라 규약인가: 지시서는 이 저장소 밖에서 만들어진다. 게이트를 걸 수 없다.
      그래서 **집행자를 수신자로 둔다.** D-286("절차는 도구로")을 사람 쪽으로 한 칸 민 것이다.

    ▣ 이 결정을 낳은 세 오류 (2026-09-05 · 한 뿌리):
      ① 「어댑터 파일 존재 시 exit 1」 — 문언이 너무 넓어 정당하게 선 포트가 즉시 빨간불이 된다 → D-324
      ② 「ADMIN 0건」 — 발급은 됐고 전달은 안 됐다. 0 이 되는 쪽으로 적혔다 → D-323
      ③ 「게이트·검증기 24종」 — "그 수를 모른다"고 쓰고서 24를 적었다. 실측 27 → D-326
      ★ 뿌리는 하나다: **문서에는 매끄러워지려는 힘이 있고, 그 힘이 정확함을 이긴다.**
        "ADMIN 0건"은 "ADMIN 1건(키 전달 대기)"보다 문장으로 낫다. 그리고 그 이긴 문장이
        다음 판정의 근거가 된다 — D-292 이래 같은 병이다.
  enforced_by: |
    · 집행자는 수신자(Code)다 — 태그 없는 수치를 만나면 인용을 거부하고
      회신에 「출처 미표기 N건」으로 돌려보낸다. 저장소 밖 문서라 게이트를 걸 수 없다.
    · docs/agent/RESUME_NEXT.md — 2026-09-06 문서부터 모든 수에 태그가 붙어 있다.
      태그 없는 수가 보이면 그것이 위반의 증거다.
    · scripts/verify_decision_tools.py — 이 결정문 자신이 도구를 갖는지 판정한다.
  affects: [D-280, D-286, D-292, D-301, D-323, D-324, D-326, 착시]

- id: D-323
  title: "ADMIN 1건 유지 채택 + 잠금 판정 술어를 blocked_now 로 확정"
  status: decided
  raised_by: "세종(기획) 2026-09-05 · 대표 위임"
  decision: |
    ▣ 정본 문장으로 올린다:
      「발급된 것과 이 환경에 있는 것은 다른 사실이고, 그것이 D-316 의 원칙이다.」
      ★ D-316 은 「계정에서 보았다」였고, 이 문장은 그것을 **「이 환경에서 보았다」**로
        한 겹 더 내린다. 원칙이 스스로 한 단계 내려간 것이다 — **채택하고 D-316 본문을 교체한다.**
    ▣ 잠금 판정 술어:  blocked_now = 「그것 때문에 **지금 이 환경에서** 막혀 있는가」
      · 발급 완료 ≠ 전달 완료 ≠ 환경 존재. **세 사실을 한 칸에 두지 않는다**(D-290 계열)
      · 「유형을 사실과 다르게 적으면 그 대장이 하는 일이 없어진다」 — 대장 머리에 박는다.
    ▣ 강제 도구: blockers.yaml 각 항목에
        verified_at : 이 환경에서 확인한 시각      verified_by : 무엇으로 확인했는가(파일·호출·화면)
      두 칸이 비면 exit 1. **"완료했다"는 진술이 아니라 확인 행위가 잠금을 내린다.**
    ▣ 2026-09-05 시점 잠김 [실측] 5건: DEV 3 · CONTRACT 1(SDN 발송·대기) · ADMIN 1(juso 키 전달)
      → 다음 날 D-332 가 재판정한다.
  enforced_by: |
    · docs/agent/evidence/DA-05/blockers.yaml — 항목마다 `blocked_now` ·
      `verified_at` · `verified_by`.
    · scripts/verify_blockers.py — 세 칸 중 하나라도 비면 exit 1.
      `blocked_now` 는 true/false 만 받는다(공란·오타는 새 값이 아니다).
      **지금 막고 있는 것**의 수를 매 실행마다 따로 출력한다 — 잠김 총수와 다른 수다.
  affects: [D-290, D-307, D-316, D-320, D-321, D-332, DA-05]

- id: D-324
  title: "「어댑터 파일 존재 시 exit 1」 → 「HTTP 구현이 있으면 exit 1」 — 금지선은 파일이 아니라 행위에 긋는다"
  status: decided
  raised_by: "세종(기획) 2026-09-05 · 대표 위임 (Code 의 반론 채택)"
  question: "doc_only 자원의 어댑터 금지를 파일 단위로 판정할 것인가?"
  decision: |
    ▣ 반론이 옳다. 포트·저하 운전·오류 계약은 **명세 없이 확정 가능한 것**이고(DA-02 §3),
      SDN 에서 이미 그 경계를 그었다(D-300 부작위 시험). 문자 그대로면 **정당하게 선 포트가
      즉시 빨간불**이 된다.
    ▣ 원칙: **금지선은 파일 단위가 아니라 행위 단위로 긋는다.**
      파일 단위 금지는 편하지만 **같은 파일에 있는 정당한 것까지 죽인다.**
      D-312(보안 지시를 수단이 아니라 금지 대상으로 쓴다)의 형제다 — 같은 병의 다른 얼굴.
    ▣ 판정 술어 확정:
        「외부 호스트로 나가는 호출이 있는가」 · 「응답 필드명을 참조하는 코드가 있는가」
      ← 이 둘이 **스키마를 안다고 주장하는 행위**다. 포트 정의·타임아웃·폴백은 해당하지 않는다.
    ▣ F-05 술어 정정도 같은 갈래로 인정한다. **전이 근접성은 도달이 아니다** —
      2단계 import 폐포로 662 중 98건이 잡힌 것을 좁힌 것이 옳다. 착시 ③(모수와 술어)의 표본으로 등재한다.
  enforced_by: |
    · scripts/verify_external_sources.py — doc_only 자원에 대해 **파일 존재가 아니라
      행위**를 본다: 외부 호스트 호출 · 응답 필드명 참조. 포트·타임아웃·폴백은 안 잡는다.
      술어 반례 3종(산문 상수 · 독스트링 · 진짜 읽기)을 자기시험이 함께 잰다.
    · backend/tests/test_sdn_port_standard.py — 명세 없이 선 포트가 초록인 상태 자체가
      이 판정의 증거다(D-300 부작위 시험).
  affects: [D-280, D-298, D-300, D-312, D-316, DA-02, FX-5, F-05, 착시]

- id: D-325
  title: "공통 뿌리 표 2개를 최우선으로 만든다 — 한 번 만들어 네 절을 갚는다"
  status: decided
  raised_by: "세종(기획) 2026-09-05 · 대표 위임"
  decision: |
    ▣ 발견 [실측·절 분해]: **미착수 6절 중 4절이 표 두 개(임계값 · API Key 저장처)에 걸려 있다.**
      14건짜리 대장에서는 **보이지 않았을 것**이다. 부분 5건은 서로 남남처럼 보였고,
      절로 쪼갠 뒤에야 같은 뿌리가 나왔다. 절 분해의 값은 "얼마 남았나"가 아니라
      **"어디를 누르면 여럿이 열리나"** 였다.
    ▣ 순서 판정: **표 두 개가 다른 무엇보다 먼저다.**

    ▣ 표 ① 임계값(Threshold) — L3 커널. 재난안전 전용이 아니다
       · 착수 전 필수: **지금 코드에 하드코딩된 임계값을 전수로 세라. 분모를 먼저 낸다**(D-301).
       · 구조: 항목 · 기본값 · 단위 · 적용 범위(전역/테넌트/카메라) · 변경 이력
         ★ 테넌트 override 자리는 두되 **지금은 전역 기본만 채운다**(Zone 폴리곤과 같은 대칭 — D-299)
       · 강제 도구: 표 도입 후 **코드에 남은 매직 넘버 임계값이 있으면 exit 1.**
         기존분은 이름으로 잠그고 새 것만 조인다 — **래칫**(D-311). 소급 사유 요구 금지.

    ▣ 표 ② 자격증명 저장처(Credential Store) — **K5 신뢰 커널**
       · 지금 키는 `.env` 에 흩어져 있고, 외부 API 가 늘면 관리가 무너진다.
         juso 사건이 보여 준 것 — **"발급됐다"와 "환경에 있다"를 구분할 자리가 없다.**
       · 구조: 서비스명 · 소유 테넌트 · 상태 · 마지막 확인 시각 · **조회는 언제나 마스킹** · 접근 감사 로그
         ★ 값은 저장소에 넣지 않는다(D-204·D-319). 표가 갖는 것은 **값이 아니라 "있는가"의 사실**이다.
       · 이 표가 서면 D-323 의 `verified_at`/`verified_by` 가 **손으로 적는 칸이 아니라 조회 결과**가 된다.

    ▣ ★ 초효율 — 둘 다 L3 커널이므로 **U1~U4 상용판이 같은 표를 쓴다.** 이중 AC 로 태깅한다.
      계약 절 4개를 갚으면서 상용판 공통 기반이 함께 선다.

    ▣ 2026-09-06 이행 실측 — 착수 전 전수(D-301 분모):
      **하드코딩 임계값 610건 / backend 비시험 파이썬 549개** ·
      그중 계약 기능 면(kernels·apps·adapters·stream_monitors·common) **127건**.
      자리별: 비교 289 · 시간인자 142 · 이름대입 100 · 기본값 79.
      ★ 610 은 「표로 옮길 수」가 아니라 **분모**다. 표 ①의 첫 등재는 계약 AC 가 이름을
        대는 것만 올린다 — 분모를 다 옮기는 것은 표의 목적이 아니다.
    ▣ 2026-09-06 이행 판정 — **표 ① 도 K5 에 둔다.**
      지시서는 표 ①을 "L3 커널"이라고만 했고 번호를 주지 않았다. 계약 AC 대장이
      F-12(수신자·위젯·구역·**임계값**·등급규칙·**API키**)의 커널을 **K5** 로 적고 있으므로
      그대로 따른다. 새 커널 번호를 지어내지 않는다(D-280).

    ▣ ★ 2026-09-06 이행 결과 — **예상 넷 중 둘만 갚았다.** 이 결정문의 전제 하나가 틀렸다.
      · 갚음 [실측]: F-02 「지점별 기준선 설정」 · F-12 「임계값」 — **표 ①이 둘을 함께 올렸다.**
        절 상태 구현 25 → **27** · 미착수 6 → **4** · 잔여 14 → **12**.
      · 못 갚음 [실측]: F-05 「API Key 발급·폐기」 · F-12 「API키」 — **방향이 반대였다.**
            표 ②    = **나가는** 자격증명 (우리가 남의 API 를 부를 때 쓰는 키)
            FR-05-3 = **들어오는** 자격증명 (남의 App 이 우리 OpenAPI 를 부를 때 쓰는 키)
        둘 다 "API Key" 라 불려서 같은 것으로 읽혔다 — **이름의 유사성을 같음으로 읽은 것**이고,
        D-321(이름이 우리 도메인과 닮아서)·D-328(어떤 키인지 묻지 않았다)의 형제다. 세 번째다.
      · 그리고 **바퀴가 이미 있었다** [실측]: `core.apikey_account`(dj-core · §0.4)와
        `backend/third_api/views/api_key_controller.py`. 다만 F-05 진입면에 연결돼 있지 않고
        그 컨트롤러의 `@path_permission` 이 주석 처리돼 있다. 남은 일은 「만들기」가 아니라
        **「잇기 + 권한 되살리기」**이고, 선행은 **이벤트 OpenAPI 인증 방식 판정**이다(D-280).
      ★ 표 ②가 헛일은 아니다 — D-323 의 `verified_at`/`verified_by` 가 진술에서 조회 결과가
        됐고, capability 없는 키를 기능 코드가 만지면 게이트가 멈춘다. **다만 절 표에서는 0이다.**
        표가 섰다고 절을 올리면 그 순간 대장이 거짓말을 시작한다(D-314).
  enforced_by: |
    · scripts/probe_threshold_census.py — 착수 전 분모를 낸다. 술어(숫자가 판단을
      가르는 자리)와 모수(비시험 backend 전수)를 매 실행 출력한다(D-301).
      자기시험 12건(양성 7 · 음성 5 · 출생 표본 DEDUP_WINDOW 포함).
    · backend/kernels/k5_trust/thresholds.py — 표 ①. 항목·기본값·단위·범위·변경 이력.
    · backend/kernels/k5_trust/credentials.py — 표 ②. 값 없이 사실만.
    · scripts/verify_threshold_table.py — 표 밖 새 매직 넘버 임계값이면 exit 1 (래칫).
    · scripts/verify_credential_store.py — capability 빈 키를 기능 코드가 읽으면 exit 1.
    · backend/tests/test_k5_threshold_table.py · backend/tests/test_k5_credential_store.py
  affects: [F-02, F-05, F-12, K5, U1, U2, U3, U4, D-299, D-301, D-311, D-319, D-328]

- id: D-326
  title: "자기표본 10/27 채택 + 「24종」은 판정자의 [추정]이었음을 기록한다"
  status: decided
  raised_by: "세종(기획) 2026-09-05 · 대표 위임"
  decision: |
    ▣ 실측 27종. 7종을 채워 **10/27.** 나머지 17종은 D-311 과 같은 이유로 **래칫** — 채택한다.
    ▣ ★ 정본으로 올리는 사례: `verify_external_sources` 의 술어를 **세 번 좁혔고
      세 번 다 반대편으로 넘어갔다가 자기시험이 그 자리에서 잡았다**
      (산문 언급 → 문자열 통삭제 → 토큰 공백 결합).
      → 원칙: **술어를 좁힐 때마다 자기시험을 다시 돈다.** 좁히기는 한 방향으로만 가지 않는다.
        한 번 좁히면 반대편이 열린다 — D-310 이 한 도구에서만 세 번 값을 한 이유다.
    ▣ 새로 만드는 도구는 자기표본 **100% 의무.** 래칫은 기존분에만 적용된다.
    ▣ 「24종」에 대하여: 판정자가 "그 수를 모른다"고 쓰고서 24 를 적었다.
      **[추정]이 태그 없이 [실측] 자리에 앉은 것**이고, 그 교정이 D-322 다.
  enforced_by: |
    · scripts/verify_tool_selftest.py — 자기시험·출생 표본 보유를 도구 전수로 판정하고,
      기준선(docs/agent/evidence/D-310/selftest_baseline.txt) 밖에서 표본 없는 새 도구가
      태어나면 exit 1. 채워지면 기준선이 줄어든다.
    · scripts/probe_threshold_census.py · scripts/verify_threshold_table.py ·
      scripts/verify_credential_store.py · scripts/verify_camera_address.py —
      이번 턴 새 도구 4종 전부 자기시험 + 출생 표본을 갖고 태어났다(100%).
  affects: [D-277, D-289, D-301, D-310, D-311, D-322]

- id: D-327
  title: "커밋 단위 술어 정밀화 — 게이트가 D-305 를 교정한 것을 채택한다"
  status: decided
  raised_by: "세종(기획) 2026-09-05 · 대표 위임"
  decision: |
    ▣ 사실: D-305(2커밋)대로 나누려 했으나, pre-commit 이 미스테이지분을 stash 하는 순간
      `gx-tool-selftest` 가 **"표본 없이 태어난 도구 2종"으로 빨개졌다.** 1커밋으로 묶고
      사유를 본문에 적었다.
    ▣ ★ 이것은 D-305 를 부정한 것이 아니라 **술어를 정밀하게 만든 것**이다. 갱신한다:
        커밋 단위 = **함께 되돌려야 게이트가 초록인 최소 집합**
        (기준선과 그것을 재는 파일은 한 되돌림 단위다)
    ▣ 그리고 기록해 둔다: **도구가 사람의 커밋 판단을 이겼다.** D-286("절차는 도구로")의 도달점이다.
      앞으로 순서 지시와 게이트가 부딪히면 **게이트를 따르고 사유를 적는다. 지시는 게이트보다 낮다.**
  enforced_by: |
    · .pre-commit-config.yaml 훅 gx-tool-selftest — 스테이지 상태 그대로 판정한다.
      사람의 커밋 계획과 부딪히면 이 훅이 이긴다.
    · scripts/verify_commit_trace.py — 커밋 본문의 D-번호를 레지스트리와 대조한다.
      게이트 때문에 합친 커밋은 그 사유가 본문에 남아야 추적된다.
  affects: [D-286, D-305, D-310, D-311, 내력]

# --- 2026-09-06 FX-5 판정 확정 · 밖을 사기 전에 안을 뒤진다 (D-328 ~ D-333) ----

- id: D-328
  title: "자격증명은 「있는가」가 아니라 「무엇인가」다 — 표 ② 설계 즉시 보강"
  status: decided
  raised_by: "세종(기획) 2026-09-06 · 대표 위임"
  decision: |
    ▣ D-325 표 ②(자격증명 저장처)에 칸 둘을 더한다. 없으면 juso 사건이 그대로 반복된다.
        api_type    : 발급처가 부르는 그 이름 그대로 (예: "도로명주소 팝업 API")
        capability  : 이 키로 할 수 있는 일 (예: "브라우저 주소검색 UI". 서버 조회 불가)
    ▣ 상태를 4값 → **5값**으로 바꾼다:
        absent → present → **typed** → verified → rotated
        · present : 파일에 있다                    ← 여기까지만 알면 같은 일이 난다
        · typed   : **무슨 API 인지 안다**          ← 놓쳤던 칸
        · verified: 호출해서 확인했다
      ★ present 와 typed 사이의 간격이 하루였다. 그 간격에 이름을 붙여 두면 다음엔 안 잃는다.
    ▣ 강제 도구: `capability` 가 비었거나 `typed` 미만인 키를 **기능 코드가 참조하면 exit 1.**
      (probe·조사 스크립트는 예외 — 그것들이 typed 로 올리는 일을 한다)
    ▣ D-290(3값 구분)·D-323(발급≠전달≠환경존재)과 같은 갈래다.
      **한 칸에 두 사실을 담아서** 다치는 것이 이번으로 세 번째다.
  enforced_by: |
    · backend/kernels/k5_trust/credentials.py — 상태 5값 열거 · api_type · capability.
      값을 담는 칸이 **없다**(D-204·D-319). 조회는 언제나 마스킹된 사실만 돌려준다.
    · scripts/verify_credential_store.py — capability 공란 · typed 미만인 이름을
      기능 코드가 읽으면 exit 1. probe_*/scan_* 는 예외로 등재되어 있다.
      출생 표본은 juso 팝업키(present 인데 typed 아님)다.
    · backend/tests/test_k5_credential_store.py — 5값 전이 · 마스킹 · 값 무기재.
  affects: [D-204, D-290, D-316, D-319, D-323, D-325, K5, F-05, F-12]

- id: D-329
  title: "juso 승인키 2건은 FX-5 에 쓸 수 없다 — 실호출 불요, 신청서 유형으로 확정"
  status: decided
  raised_by: "세종(기획) 2026-09-06 · 대표 위임"
  decision: |
    ▣ 근거: API 유형 = **도로명주소 팝업 API** [실측·대표 승인 화면 2건]. 두 건 모두 동일 유형.
      팝업 API 는 웹 화면에 주소검색 창을 띄우는 **UI 위젯**이다. 역지오코딩이 아닌 것은 물론이고
      **서버끼리 주고받는 조회 API 조차 아니다.** D-318 의 판정은 **㉡ no** — 실호출 없이 확정된다.
    ▣ 처리:
      · `JUSO_REVERSE_SUPPORTED = 'no'`. 근거란에 **"신청서 유형(팝업 API)"** 이라 적는다.
        실호출로 확정한 것이 아니므로 **근거를 정직하게 적는다**(D-322 정신).
      · `probe_juso_direction.py` 는 **지우지 않는다.** 유형이 다른 키가 생기면 그대로 쓴다.
        파일 머리에 「이 스크립트가 답해야 했던 질문은 2026-09-06 신청서 유형으로 먼저 답해졌다」를 적는다.
      · DA-05(FX-5) 사유를 **「키 미전달」 → 「자원 유형 불일치」**로 교체.
    ▣ ★ 우리가 물은 것은 「키가 있는가/없는가」였고, **「어떤 키인가」는 묻지 않았다.** → D-328
  enforced_by: |
    · backend/adapters/juso/__init__.py — JUSO_REVERSE_SUPPORTED='no' ·
      REVERSE_DECIDED_BY 에 근거("신청서 유형(팝업 API)")가 문자열로 박혀 있다.
    · scripts/verify_juso_direction.py — 값이 열거 밖이거나 근거가 비면 exit 1.
    · scripts/probe_juso_direction.py — 지우지 않고 남긴다. 머리에 선행 판정 사유가 적혀 있다.
  affects: [FX-5, D-298, D-316, D-318, D-322, D-328, D-330, DA-05]

- id: D-330
  title: "FX-5 재설계 — 좌표를 주소로 바꾸지 않는다. 카메라에 주소를 적어 둔다"
  status: decided
  raised_by: "세종(기획) 2026-09-06 · 대표 위임"
  decision: |
    ▣ 지금까지의 설계: 이벤트 좌표 → 외부 역지오코딩 API → 주소 → 알림
      · 외부 의존 · 타임아웃 · 저하 운전 · 실패 상태 4값 · 비용 · 그리고 **자원이 없어서 잠김**
    ▣ 새 설계: **카메라는 고정 설치물이다.** 설치할 때 주소를 안다 — 적어 두지 않았을 뿐이다.
      카메라(StreamMonitor)에 설치 주소 필드를 둔다. 이벤트 위치 = 그 카메라의 주소.
          install_address       : Char, null=True      # 도로명주소
          install_address_detail: Char, null=True      # "정문", "3층 복도" 등 현장 표현
          address_source        : 'manual' | 'unset'   # 지금은 manual 만
      · 외부 호출 0건 · 타임아웃 없음 · 저하 운전 필요 없음 · 비용 0 · **잠김 해소**
    ▣ ★ 결과가 더 좋다. 역지오코딩은 「서울시 …로 12」만 준다.
      우리는 **「○○초 정문 (서울시 …로 12)」**를 준다. 새벽 당직자에게 이 차이가 결정적이다(F-10 취지).
    ▣ 계층: **L3 Platform.** 카메라 속성이므로 카메라와 같은 층이다(Zone 과 같은 판단 — D-299).
    ▣ 미입력 처리 — D-290 준수. 「아직 안 적음」과 「없음」을 같은 값에 두지 않는다.
      `address_source='unset'` 이면 알림은 **종전대로 좌표 1줄**로 나간다(D-308 경계 그대로).
      ★ 알림을 지연시키지 않는다. 주소는 보조 정보이지 발송 조건이 아니다.
    ▣ 잔여: 이동체(드론) 이벤트는 좌표가 남는다. **계약 AC 절 표에서 걸리는 절이 없으면
      DA 에도 올리지 않는다.** 없는 요구에 자원을 붙이지 않는다.
      2026-09-06 실측: 절 39개 전수에 이동체 위치 표기를 요구하는 절 **0개** → 등재하지 않는다.
  enforced_by: |
    · backend/stream_monitors/models.py — StreamMonitor.install_address ·
      install_address_detail · address_source(TextChoices: unset|manual).
      backend/stream_monitors/migrations/0022_streammonitor_address_source_and_more.py.
    · backend/kernels/k2_notify/services.py — 위치 1줄을 만드는 자리 하나(`location_line`).
      주소가 있으면 「상세 (도로명)」, 없으면 좌표 1줄. **발송을 지연시키지 않는다.**
    · scripts/verify_camera_address.py — 등록 카메라 중 install_address 가 빈 건수를
      매 실행 출력한다(D-301). exit 0 — 운영자가 채우는 값이지 개발이 막는 값이 아니다.
      **다만 수가 보여야 채워진다.** 출생 표본은 「좌표만 있는 알림 1줄」이다.
    · backend/tests/test_f10_camera_address.py — 주소 있음/없음 두 갈래 · 지연 없음.
  affects: [FX-5, F-10, F-01, D-290, D-299, D-308, D-329, D-331, D-333, DA-05]

- id: D-331
  title: "도로명주소 팝업 API 의 정당한 용처 — 카메라 주소 입력 UI"
  status: decided
  raised_by: "세종(기획) 2026-09-06 · 대표 위임"
  decision: |
    ▣ D-330 이 만든 자리가 곧 팝업 API 가 하는 일이다:
      관리자가 카메라 등록·수정 화면에서 `install_address` 를 입력할 때 **주소검색 팝업**을 띄운다.
      · 손으로 타이핑하면 오타가 나고, 오타 난 주소는 **알림에 그대로 나가 사람을 엉뚱한 곳으로 보낸다**
      · 팝업을 쓰면 **정규화된 도로명주소**가 들어간다. 이것이 값이다.
    ▣ 보안 성격이 다르다 — **이건 비밀이 아니다.**
      팝업 API 키는 브라우저에서 쓰이므로 **애초에 페이지 소스에 노출되는 클라이언트 키**다.
      D-003(GCS_APIKEY ≠ VITE_CGS_APIKEY)과 같은 갈래.
      · 유일한 방어선은 **등록 URL 제한**(www.guardianx.com)이다.
      · 저장소에는 여전히 값을 넣지 않는다(D-204). 취급 등급은 **프론트엔드 설정값**이다.
      · 표 ②의 `capability` 에 「브라우저 전용·공개 키·URL 제한이 방어선」을 적는다.
    ▣ 우선순위: **낮다. 지금 막고 있는 것이 아니다.** 표 ①②(D-325)가 먼저다.
  enforced_by: |
    · backend/kernels/k5_trust/credentials.py — JUSO_POPUP_KEY_1/2 항목의
      api_type("도로명주소 팝업 API") · capability(브라우저 주소검색 UI · 서버 조회 불가 ·
      공개 클라이언트 키 · URL 제한이 방어선)가 표에 문자열로 박혀 있다.
    · scripts/verify_credential_store.py — 이 두 이름을 **기능 코드가 읽으면 exit 1**
      (상태 typed · verified 아님). 붙이려면 표의 상태부터 올려야 한다.
  affects: [D-003, D-204, D-319, D-325, D-328, D-329, D-330, F-12]

- id: D-332
  title: "ADMIN 잠금 재판정 — 사유가 바뀌었고, blocked_now 는 false 다"
  status: decided
  raised_by: "세종(기획) 2026-09-06 · 대표 위임"
  decision: |
    ▣ 어제의 ADMIN 1건은 「juso 키 전달 대기」였다. 두 가지가 동시에 바뀌었다:
      ① 키가 왔다(파일로) — 다만 **아직 개발 환경에 넣지 않았다**(D-323 그대로)
      ② 그 키로 FX-5 를 할 수 없음이 확정됐다(D-329) — **막고 있던 이유 자체가 사라졌다**
    ▣ 판정: 항목은 남기되 `blocked_now: false` · 사유 「카메라 주소 입력 UI 용. 표 ①② 이후」.
      ★ 잠금을 지우지 않는 이유: **없앤 것과 미룬 것은 다르다.** 지우면 나중에 왜 안 했는지 아무도 모른다.
    ▣ 2026-09-06 이행 실측 — 잠김 **5건 유지 · blocked_now=true 는 3건**:
        DEV 3 (VIDEO 구간 추출 · ZONE 폴리곤 · 빈 DB 한 줄 설치)  ※ FX-5 는 D-330 으로 해소
        CONTRACT 1 (SDN 발송·대기 — 지연 일수 출력 중)
        ADMIN 1 (팝업 키 환경 투입 — blocked_now: false)
      → **지금 막고 있는 것은 DEV 2 + CONTRACT 1 = 3건.** 나머지는 순서의 문제다.
  enforced_by: |
    · docs/agent/evidence/DA-05/blockers.yaml — JUSO_API_KEY 항목 blocked_now: false ·
      verified_at · verified_by · 사유 교체(자원 유형 불일치 → 팝업 UI 용도).
    · scripts/verify_blockers.py — `blocked_now` 열거 판정 + **지금 막고 있는 건수**를
      총수와 **따로** 출력한다. 둘이 같은 칸에 있으면 D-323 이 무의미해진다.
  affects: [DA-05, D-307, D-316, D-320, D-321, D-323, D-329, D-330]

- id: D-333
  title: "밖을 사기 전에 안을 뒤진다 — 외부 의존 등재의 필수 두 칸"
  status: decided
  raised_by: "세종(기획) 2026-09-06 · 대표 위임"
  decision: |
    ▣ 우리는 좌표를 주소로 바꾸려고 **외부 자원을 찾고, 키를 신청하고, 실측기를 만들고, 잠금을 세웠다.**
      그런데 답은 **카메라가 고정물이라는 사실** 하나였다. 우리가 이미 아는 것이었다.
    ▣ 원칙: 외부 자원을 대장에 올리기 전에 **「우리가 이미 아는 것으로 되는가」를 먼저 적는다.**
      DA 에 외부 의존 항목을 등재할 때 필수 칸:
          internal_alternative_considered : 무엇을 검토했는가 (없으면 "없음"이라고 적는다)
          why_not                          : 왜 안 되는가
      두 칸이 비면 **등재를 거부한다**(게이트 exit 1).
    ▣ ★ 초효율의 가장 값싼 형태다. 외부 의존 하나를 **안 만드는 것**이,
      외부 의존 하나를 잘 만드는 것보다 언제나 싸다. **만들지 않은 것은 고장 나지 않는다.**
    ▣ 같은 눈으로 기상특보·특일·학교위치 3종도 되물었다 — 2026-09-06 판정:
      · 특일(공휴일): **외부가 낫다.** 대체공휴일·임시공휴일은 매년 정부가 정하고 사후 변경된다.
        우리 표로 들고 있으면 그 표가 틀린 날 알림 정책이 조용히 틀린다. 다만 **연 1회 동기화로
        족하다** — 실시간 의존이 아니므로 다운되어도 저하 운전이 필요 없다.
      · 학교 위치: **외부가 필요 없다.** 고객은 특정 지자체이고, 카메라는 D-330 으로 자기 주소를
        갖는다. 전국 학교 좌표는 우리 어느 AC 에도 입력이 아니다 → `not_required` 로 내린다.
      · 기상특보: **외부가 낫다.** 특보는 기상청이 발표하는 사실이고 내부에 원천이 없다.
      답이 "외부가 낫다"면 그대로 간다. **묻지 않고 가는 것만 금지한다.**
  enforced_by: |
    · docs/agent/evidence/DA-05/sources.yaml — 외부 원천 항목마다
      internal_alternative_considered · why_not.
    · docs/agent/evidence/DA-05/blockers.yaml — CONTRACT·ADMIN 잠금에도 같은 두 칸.
    · scripts/verify_external_sources.py — 두 칸 중 하나라도 비면 exit 1.
      출생 표본은 FX-5 다: 「좌표→주소를 외부에서 사려 했고, 답은 카메라 주소였다」.
    · scripts/verify_blockers.py — 잠금 대장의 **CONTRACT·ADMIN** 항목에도
      같은 두 칸을 요구한다(DEV 는 우리가 하는 일이므로 대상이 아니다).
  affects: [DA-05, FX-1, FX-2, FX-5, FX-6, D-280, D-298, D-316, D-329, D-330, 초효율]

- id: D-334
  title: "주석 처리된 권한 데코레이터 — 전수 조사 · 열린 문 15자리는 즉시 잠근다"
  status: decided
  raised_by: "세종(기획) 2026-09-07 · 대표 위임"
  decision: |
    ▣ 왜 최우선인가: 권한 검사는 **없는 것보다 주석 처리된 것이 더 위험하다.**
      없으면 「아직 안 붙였다」로 읽히지만, 주석은 **「한때 붙어 있었다」**는 뜻이다.
      ★ 그리고 코드를 읽는 사람에게는 **붙어 있는 것처럼 보인다.** 착시의 가장 나쁜 형태다.
    ▣ 2026-09-07 실측 — 분모부터 냈다(D-301). 권한 계열 술어는 **행위**로 그었다(D-324):
      「없어지면 접근이 넓어지는 데코레이터」만 센다.
        · 포함: path_permission · oauth2_required · scope_required · tenant_scoped · ensure_csrf_cookie
        · 제외: csrf_exempt(주석 처리되면 **좁아진다**) · require_http_methods(메서드 제한이지 권한이 아니다)
        권한 계열 사용 **320자리** = 활성 281 + 주석 39 (주석은 전부 path_permission · 10개 파일)
    ▣ ★ 주석 39자리를 **인증 관문 유무로** 갈랐다. path_permission 은 **권한**이고
      auth= 는 **인증**이다 — 같은 이름이 아니다(D-337 동음이의).
        authn_only         24자리  auth= 살아 있음 · 익명 요청은 401
        no_authn_no_authz  15자리  ★ 인증 관문 없음 — 익명 요청이 핸들러에 닿는다
    ▣ 열려 있었는가 — **호출로** 답했다(D-210). 15/15 가 401 이 아니었다.
      · GET 8자리는 그냥 때렸다: 200×3(데이터 반출) · 422 · 400×2 · 404×2 · 500
      · POST 7자리는 등록된 view_func 를 **도달 표시만 남기는 대체물**로 잠시 바꾸고 때렸다 —
        본체는 한 줄도 돌지 않았다. 안 때리면 「auth 콜백이 비었으니 열려 있을 것」이라는
        **추정**이 되기 때문이다(D-280 금지). 5자리가 도달했고 그중 4자리가 **운행 로그·영상 업로드**다.
    ▣ 경위 — 아는 것과 모르는 것을 가른다(D-280):
      [실측] 39자리 전부 blame 이 베이스라인 커밋(4afca2b · 2026-08-13)이다
      [실측] 한 자리에 사유가 남아 있다: api_key_controller.py:54 의 베트남어 주석
             「Tam thoi comment out de test」(= 시험용으로 임시 주석 처리)
      [모름] 언제·왜 꺼졌는지. 주석 처리는 **베이스라인 이전 공급자 이력**에서 일어났고 그 이력은 이 환경에 없다
      ★ **「임시」가 사유란에 적힌 채 베이스라인을 넘어왔다.** 그것이 우리가 아는 전부다.
    ▣ 조치 — **고친 것과 미룬 것을 한 칸에 두지 않는다**(D-290):
      · 즉시: 15자리에 auth=CustomJWTAuth(). **래칫 대상이 아니다 — 열린 문에는 유예가 없다**
        재호출 확인 [실측]: 익명2xx=0 · 익명도달=0 · 판정={'authn_only': 39}
      · 래칫(D-311): 권한(path_permission) 복구 39자리. 역할·경로 대장이 필요한 별개의 일이다.
        **열린 문에는 유예가 없고, 느슨한 권한에는 있다.**
    ▣ ★ 곁가지로 잡힌 것 — **캐시가 코드 수정보다 오래 산다.**
      수정 직후 재호출에서 2자리가 여전히 200 이었다. UniversalCacheMiddleware 는 캐시 적중 시
      뷰를 부르지 않고 JsonResponse(200) 을 돌려주고(universal_optimization.py:872), 캐시 키의
      권한 서명이 익명은 "anon" 이다(:711). **열려 있던 동안 익명 키로 채워진 항목이
      코드 수정 뒤에도 익명에게 그대로 나갔다.** cache.clear() 뒤 0 이 됐다.
      → 원칙: **관문을 고치는 것과 이미 새어 나간 것을 거두는 것은 다른 일이다.**
        그리고 **관문을 재는 시험이 캐시를 재면 안 된다**(회귀 시험은 X-No-Cache 로 우회한다).
  enforced_by: |
    · scripts/verify_commented_guards.py — 두 규칙이고 **성격이 다르므로 규칙도 다르다**:
      ① 주석 권한 + auth= 없음 → exit 1. **래칫 대상이 아니다**
      ② 기준선에 없던 자리에 새 주석 → exit 1 (래칫 · D-311)
      출생 표본(D-310)은 backend/drone_communication/views/drone_views.py 의 실제 두 줄이다.
      음성 대조 [실측]: 그 자리의 auth= 를 지우면 「열린 문 1건 · exit 1」, 되돌리면 exit 0.
    · backend/drone_communication/views/drone_views.py — 그 두 줄이 있던 자리. 지금은 auth= 가 붙어 있다.
    · .pre-commit-config.yaml 의 gx-commented-guards — files 를 backend 의 모든 .py 로 잡는다.
      좁게 잡으면 게이트가 자기가 막아야 할 자리를 안 본다.
    · docs/agent/evidence/D-334/commented_guards_baseline.txt — 39자리.
      **줄 번호가 아니라 파일::클래스::핸들러::데코레이터**로 잠근다(위아래가 밀려도 새것이 되지 않게).
    · backend/tests/test_commented_guards.py — 15자리 목록을 fixture 로 박았다(4건 통과).
    · scripts/probe_commented_guards.py — 「지금 열려 있는가」를 **호출로** 답한다(게이트는 정적).
    · docs/agent/evidence/D-334/INCIDENT.md — 사고 기록. 되돌림이 아니라 기록이다.
  affects: [D-105, D-210, D-269, D-280, D-286, D-290, D-300, D-301, D-310, D-311, D-324, D-335, D-337, W0-18]

- id: D-335
  title: "F-05 진입면 인증 — 들어오는 API Key + 테넌트 귀속. 만들지 않고 잇는다"
  status: decided
  raised_by: "세종(기획) 2026-09-07 · 대표 위임"
  decision: |
    ▣ 방식: **헤더 API Key.** OAuth2·JWT 는 과하다 — 상대는 서버-투-서버 기계이고,
      계약 상대는 [인용·계약] 에스비 한 곳이다. 사람 로그인이 없다.
      ★ 과한 인증은 안전을 주지 않고 **연동 실패를 준다.** 상대가 못 붙이면 F-05 는 초록이어도 죽은 면이다.
    ▣ 규약 다섯 — 전부 시험으로 건다
      ① **키는 테넌트에 묶인다.** 키로 들어온 요청은 그 테넌트 범위 밖을 절대 못 본다(D-269).
         남의 자원 요청은 **404**. 403 아님 — 존재도 알리지 않는다
      ② **HTTPS 강제.** 평문 요청은 거부한다. 키가 평문으로 흐르면 키가 아니다
      ③ **읽기 전용부터.** 지금 여는 것은 이벤트 조회뿐. 쓰기 면은 절을 따로 세운다
      ④ **키 값은 저장하지 않는다.** 해시만 둔다. 조회는 언제나 마스킹(D-204 · 표 ②와 같은 규약)
      ⑤ **부작위**(D-300): 키 인증을 통과한 요청이 원본 영상·타 테넌트 식별자에 닿는 경로가 **0건**임을 시험한다
    ▣ ★ 발급·폐기는 **만들지 않는다.** 이미 있는 것을 쓴다:
      · core.apikey_account (dj-core) — 0.4절 금지구역. **수정하지 마라.**
        ★ 다만 D-207 은 **수정 금지이지 사용 금지가 아니다.** 읽고 호출하는 것은 허용된다.
        확장이 필요하면 **우리 층에서 감싼다**(L3 어댑터). 금지구역 안으로 손을 넣지 마라.
      · third_api/views/api_key_controller.py — 우리 것. 여기에 잇는다.
    ▣ ★ D-333(밖을 사기 전에 안을 뒤진다)의 안쪽 판이다:
      **밖을 사기 전에 안을 뒤지고, 만들기 전에 이미 있는지 뒤진다.**
      「남은 일은 만들기가 아니라 잇기」.
    ▣ ★ 선행 확인 [실측 2026-09-07 · D-334]: 잇는 자리인 api_key_controller.py 는
      권한이 **11자리 주석 처리**되어 있다(전 파일 중 최다). 인증은 살아 있어(authn_only) 익명은 401 이지만,
      **인증된 아무 역할이나 API 키 발급·폐기·통계에 닿는다.** F-05 를 여기에 이을 때
      그 11자리를 함께 갚지 않으면 **들어오는 키를 나가는 키 관리면 위에 얹는 꼴**이 된다.
  enforced_by: |
    ★ 2026-09-07 이행 — 그리고 **착수하며 판정이 한 겹 바뀌었다.**
      「만들지 않고 잇는다」고 적었는데, 실측해 보니 **이미 이어져 있었다.**
      dj-core 의 CustomJWTAuth 가 X-API-Key 와 Authorization 의 inbound 스킴을
      **이미 받는다** (dj-core 의 auth 모듈 — §0.4 저장소 밖이라 경로로 적지 않는다). 즉 들어오는 키는 만들 것이 아니라
      **이미 살아 있었고, 아무도 그 범위를 정하지 않았다.**
      호출로 잰 것 [실측]: 키 하나로 F-05 진입면 **7자리 전부에 도달** —
      events · deliveries · dashboard/frame(200) · clip · **clip/stream** ·
      reports/templates(200) · settings/{domain}.
      만료·비활성·가짜 키는 401 이었다. **인증은 성했고, 성하지 않은 것은 범위였다.**
      ★ clip/stream 이 계약 11조(영상 반출 · D-306)의 자리다. 발급된 아무 키나 거기 닿고 있었다.
      → 그래서 이 절의 일은 「만들기」도 「잇기」도 아니라 **「좁히기」**였다. D-334 와 같은 얼굴이다.
    · backend/common/inbound_api_key.py — JwtOrInboundKey. 라우트마다 들어오는 키를 받을지
      **선언하게** 하고, **기본값은 거절**이다(D-300 — 새 라우트가 조용히 표면을 넓히지 못한다).
      CustomJWTAuth 를 상속해 감싸기만 한다 — 고치지 않는다(§0.4 · D-207).
    · backend/apps/dsm/api.py — 진입면 11자리 전건이 이 문지기를 지난다.
      들어오는 키가 닿는 곳은 **GET /api/dsm/events 하나뿐**이다(규약 ③).
    · backend/tests/test_f05_inbound_api_key.py — 규약 다섯을 하나씩 맡는 5개 클래스, 17건.
      ⑤ 부작위가 본체다: 원본 영상·설정·보고서에 키가 닿지 않음을 **호출로** 재고,
      음성 대조(이벤트 조회에는 들어간다)를 함께 둔다 — 전부 401 이면 그것은 「막았다」가
      아니라 「아무것도 안 열렸다」이다.
    · scripts/verify_commented_guards.py — 발급·폐기 면
      (backend/third_api/views/api_key_controller.py)의 권한 주석
      11자리를 기준선으로 잠근다. **거기서 auth= 가 빠지면 exit 1.**
    ★ 아직 아닌 것: **FR-05-3 「API Key 발급·폐기」 절은 미착수 그대로다.**
      이번에 한 것은 **소비 면의 범위**이고, 발급·폐기는 그 컨트롤러의 권한 11자리와 함께
      갚을 별개의 일이다. 규약 다섯을 지켰다고 그 절을 올리지 않는다 — 올리면 대장이 거짓말한다.
    ★ 남은 실측 하나 [실측 2026-09-07]: 이 좁히기는 **DSM 진입면에만** 걸었다.
      X-API-Key 는 여전히 `CustomJWTAuth` 를 쓰는 **다른 모든 라우트**에서 인증된다.
      그 범위를 어떻게 할지는 판정이 필요하다 — 이번 턴에 넓히지 않았다.
  affects: [D-204, D-207, D-269, D-300, D-319, D-325, D-328, D-333, D-334, D-337, F-05, FR-05-3]

- id: D-336
  title: "「계약이 정한 값은 설정이 아니라 상수다」 — contract_fixed 채택 + 원칙 승격"
  status: decided
  raised_by: "세종(기획) 2026-09-07 · 대표 위임 · **제안은 Code**"
  decision: |
    ▣ 채택. 표 ①(임계값 커널)의 contract_fixed 칸은 Code 가 지시 없이 더한 것이다.
      사유: 없으면 **「임계값을 설정 가능하게 만들었다」가 곧 「계약 AC 를 설정 가능하게 만들었다」**가 된다.
    ▣ 확장한다 — 409 로 멈추는 것만으로는 부족하다.
      ★ **게이트가 contract_fixed 항목의 값이 계약 AC 원문과 일치하는지 검사한다.**
        표의 값이 [인용·계약] F-04 「5분」· F-10 「30초」에서 벗어나 있으면 **exit 1.**
        런타임 덮어쓰기는 409 가 막고, **저장된 값 자체가 틀린 것은 게이트가 막는다.** 둘 다 필요하다.
      ★ 각 contract_fixed 항목에 **절 번호를 링크한다.** 계약 절과 표의 행이 서로를 가리키면,
        계약이 바뀔 때 무엇을 고쳐야 하는지 사람이 찾지 않아도 된다.
    ▣ 원칙: **설정 가능성은 기능이 아니라 위험이다.** 무엇을 설정 가능하게 만들 때마다
      「이 값이 계약·안전·법에 걸려 있는가」를 먼저 묻는다. 걸려 있으면 상수다.
      · D-324(금지선은 행위에 긋는다)의 이웃이다 — **유연성도 금지선이 필요하다.**
    ▣ 절차 판정: 이런 것은 **묻기 전에 넣는다.** 넣고 사유를 적으면 뒤에서 판정한다 —
      그 반대(묻고 기다리기)는 아는 쪽이 아는 것을 모르는 쪽이 모르는 채로 시간만 쓴다.
  enforced_by: |
    · backend/kernels/k5_trust/thresholds.py — contract_fixed 항목의 런타임 덮어쓰기는 409.
    · scripts/verify_threshold_table.py — contract_fixed 항목의 **값이 계약 AC 원문과 다르면 exit 1** ·
      절 번호 링크가 비면 exit 1.
  affects: [D-286, D-299, D-301, D-311, D-324, D-325, F-04, F-10]

- id: D-337
  title: "판정자 오류 3건 인정 + 「같은 이름, 다른 것」 대장 신설"
  status: decided
  raised_by: "세종(기획) 2026-09-07 · 대표 위임"
  decision: |
    ▣ ① 잔여 [추정]10절 → [실측]12절. 표 ②가 F-05·F-12 의 「API키」 두 절을 갚을 것으로 봤는데
      **방향이 반대였다.**
          표 2   = **나가는 키**(우리가 남의 API 를 부를 때)
          FR-05-3 = **들어오는 키**(남이 우리 OpenAPI 를 부를 때)
      둘 다 "API Key" 라 불려서 같은 것으로 읽었다.
    ▣ ② 지금 막는 것 [추정]3건 → [실측]4건. FX-5 를 DEV 잠금으로 놓고 계산했으나
      대장의 DEV 3 은 VIDEO·ZONE·**빈DB** 였고 FX-5 는 ADMIN 한 줄이었다.
      ★ **대장을 읽지 않고 기억으로 계산했다.**
      → 원칙: **대장의 수를 기억으로 쓰지 않는다.** 인용하거나 [추정] 을 단다. 예외 없다.
    ▣ ③ 「결정 v3.0(138)」 — 태그가 없었고 틀렸다. 저장소는 v2.9(132)였다.
      ★ D-322 를 만든 바로 그 문서에서 태그를 빠뜨렸다. **규약이 첫 턴에 자기 저자를 잡았다** —
        D-310(도구는 자기가 태어난 표본을 시험에 넣는다)의 사람 판이다.
    ▣ ★ 신설 — 「같은 이름, 다른 것」 대장(homonym ledger).
      이름의 유사성으로 오판한 것이 **세 번째다** [실측 · 결정 이력]:
        · D-321  CCTV·재난안전정보 = 설치 위치 **메타데이터**  ≠ 우리가 받는 **영상**
        · D-328  juso 승인키       = **팝업 UI 위젯**          ≠ **서버 조회 API**
        · D-337  API Key           = **나가는 키**             ≠ **들어오는 키**
      · 한 줄에: 이름 · 갈래 A · 갈래 B · **무엇으로 구분하는가**(방향·주체·범위) · 발견 결정번호
      · 규칙: 이름이 겹치는 것을 발견하면 **즉시 등재**하고, 코드·대장·문서에서 그 이름을
        **단독으로 쓰지 않는다** — 반드시 방향이나 주체를 붙인다(inbound_api_key / outbound_api_key).
    ▣ ★ 이번 턴에 네 번째가 나왔다 [실측 · D-334]:
        · D-334  「권한」 = path_permission(권한) 은 auth=(인증) 이 아니다
      주석 처리된 권한을 「인증이 꺼졌다」로 읽으면 24자리를 사고로 세게 되고,
      「권한이 꺼졌을 뿐」으로 읽으면 15자리 열린 문을 놓친다. **둘 다 틀린다.**
      구분 기준은 **관문의 종류**다. 대장에 넷째 줄로 등재한다.
  enforced_by: |
