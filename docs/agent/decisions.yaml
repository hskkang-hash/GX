- id: D-422
  author_tree_id: "세종 지시서 2026-09-24 §2 Q행 · OPS-14 · OPS-15 · QA-12"
  title: "차선 Q 병합 — 선등록이 **실제로 반출을 막았고**, 맥박을 채우는 자리는 비어 있었다"
  status: decided
  raised_by: "차선 Q 보고 2026-09-24 → 조율자 병합·검증"
  decision: |
    ▣ **OPS-15 군집 두절 — 닫혔다** [실측] 3중 2 → **1건** · **1대만 → 0건** ·
      따로 죽은 2대 → **0건**. 지시서 §3-3 이 「초록의 절반은 부작위」라 못 박은 그 두 갈래가
      실제로 갈렸다. 「2대가 죽어 있다」와 「2대가 **함께** 죽었다」는 다르다 — 창(5분)이 가른다.

    ▣ ★★ **조율자가 병합에서 잡은 것 — 맥박을 채우는 호출이 0곳이었다**
      칸(`last_frame_at`)과 규칙과 판정기는 섰는데 `record_frame` 을 부르는 곳이
      **시험 말고 없었다.** 시험은 스스로 맥박을 심으므로 전부 초록이었고, 운영에서는
      그 칸이 영원히 `None` 이며 규칙은 그것을 **두절로 세지 않으므로**(「아직 안 왔다」≠
      「죽었다」) OPS-15 는 **0건만 내는 잠자는 기능**이 될 뻔했다(D-377 · 착시 ⑨).
      → `grpc_dual_stream_service._publish_detection_events` 첫머리에 **검출 유무와
        무관하게** 적도록 이었다(검출 0건인 프레임도 맥박이다). 부작위 시험을 박았다:
        `PulseIsFedByThePipelineTest` — 이 시험이 빨개지면 배선이 지워진 것이다.

    ▣ ★★ **선등록이 값을 했다** — `send_heartbeat_digest` 의 `group=` 이 무조건 믿는
      인자였다. A 테넌트 사용자가 `group=B` 로 **B 의 어제 이벤트 수와 카메라 맥박**을 뽑아
      자기 수신자에게 보낼 수 있었다. `WRITE_NO_PROBE` 에 09-24 착수 전 적어 둔 사유가
      **정확히 그 반출을 이름으로 경고**하고 있었고, 차선이 그것을 읽고 문지기를 세웠다.

    ▣ 조율자 정정 하나 — **거절의 이름을 좁혔다.** 그 문지기는 `InvalidNotifyInput` 을
      던졌는데, 그 이름은 「모르는 채널」 같은 **평범한 입력 오류도** 쓴다. 격리 러너의
      거절 목록에 넣으면 문지기에 **닿지도 못하고** 죽은 호출이 「막혔다」로 세어진다
      (D-366 의 거짓 초록). `NotifyPermissionDenied(InvalidNotifyInput, PermissionDenied)`
      를 팠다 — `EventNotFound` 와 같은 형이다(넓은 그물은 두고 좁은 그물을 더한다).

    ▣ **QA-12 알림 예산 — 닫혔다.** [시험]이 **건수**를 낸다: 「시간당 6.4건 — EEMUA 191
      권고 상한 6건」 · 빨강이 아니라 **주황**(빨강은 즉시 개입 전용 · ISA-101) · 쓰기 0행.
      상한 6은 **우리가 지은 수가 아니다** [인용] — 지었다면 규칙마다 함께 흔들렸을 것이다.

    ▣ **OPS-14 — 함수는 차선이, 주기는 조율자가.** beat 둘을 걸고 **등록만 확인하지 않고
      한 번 돌렸다**: 생존 알림 `{sent: 1, no_recipients: 9}` · 맥박 검사
      `{zones: 0, cameras: 0, created: 0}`. 수신자 0명인 테넌트 9개를 **수로 남긴다.**
      맥박 검사는 **1분**이다 — 창이 5분이라 5분 주기면 창 하나를 통째로 놓친다.

    ▣ 정직 고지(차선 Q 가 스스로 달았다): 군집 판정기의 초록은 **합성 구역** 위에서 났다.
      개발 DB 에 카메라 3대 이상인 활성 구역이 **0개**다. 판정기 `[입력]` 줄에 「구역 출처」
      칸을 만들어 시드가 심으면 값이 바뀌게 했다 — **합성의 초록을 시드의 초록처럼 적지 않으려고.**
  enforced_by: |
    · backend/stream_monitors/services/camera_pulse.py (+ 마이그레이션 0027)
    · backend/kernels/k2_notify/{heartbeat,alarm_budget}.py · services._owner_for
    · backend/kernels/k2_notify/exceptions.py :: NotifyPermissionDenied
    · backend/tests/test_q_{camera_pulse,alarm_budget,heartbeat_digest}.py (18·17·16)
    · backend/tests/test_q_camera_pulse.py::PulseIsFedByThePipelineTest (배선 부작위)
    · scripts/verify_camera_pulse.py · scripts/verify_alarm_budget.py
    · backend/config/celery.py :: ops14-heartbeat-digest(08:00) · ops15-camera-pulse-scan(60s)
    · backend/tests/test_tenant_isolation.py :: PULSE.record_frame probe
