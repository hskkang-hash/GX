  - id: P-K6-3
    ticket: "W4-1 · K6 · DA-03"
    raised_at: "2026-08-30"
    context: "`kpi_series` 의 t0/t1 계측을 **어디에 적재하는가**"
    question: >-
      DA-04 K6 은 *"DA-03 §2-4 의 t0/t1 계측을 여기 적재한다. 검수는 '재봤더니 빨랐다'가
      아니라 p50/p95 로 한다"* 고 적었다. 그런데 적재처를 별 표로 두면 DA-04 가 같은 표에서
      요구한 *"집계 경로를 하나로"* 와 충돌하고, 이벤트 행에 붙이면 **이벤트마다 계측 칼럼이
      늘어난다**(3초·30초·10초·60초…). 어디에 적재하는가?
    options:
      - "A: 이벤트 행에 소수의 칼럼 — 계약이 지정한 지점만 (3초·30초)"
      - "B: 계측 전용 표 — 지점이 늘어도 스키마가 안 바뀐다"
      - "C: 이미 있는 행에서 유도 — 예: 30초는 DeliveryRecord.occurred_at→sent_at 로 이미 재어진다"
    chosen_default: ""
    rationale: >-
      **기본값을 적용하지 않는다.** `kpi_series` 는 지금 `NotImplementedYet` 을 던지고,
      그것이 정직한 상태다 — 표본이 없는 p95 는 **만들어진 수**이고, 검수에 올라가는 수를
      추측으로 만들지 않는다 (D-280).
      ★ **C 가 이미 부분적으로 참이다**: F-10 의 30초는 `DeliveryRecord` 의 두 점에서
        **조인 없이** 읽힌다(K2 착수분). 즉 계측 지점 중 하나는 이미 실물 위에 있다.
        나머지 지점(클릭→영상 3초 등)이 어디서 나오는지는 K3 착수 시 드러난다 —
        **그때 이 항목을 다시 본다.** 지금 정하면 K3 이 만들 사실을 추측하는 것이 된다.
    reversible: false
    blocks_dod: false
    status: open

  # ── 환경 (2026-08-30 · E2E 규약 ① 이행 중 발견) ─────────────────────────
  - id: P-ENV-1
    ticket: "E2E · 인도 · CI"
    raised_at: "2026-08-30"
    context: "빈 DB 에서 `manage.py migrate` 가 죽는다 — 스키마가 마이그레이션만으로 재현되지 않는다"
    question: >-
      dj-core 의 `core/logger/migrations/0009_…` 가 `apps.get_model("multilanguage", …)` 를
      부르면서 그 앱에 대한 **dependency 를 선언하지 않는다.** 실행 계획에서 뒤에 오면
      `RunPython` 이 받는 상태에 그 모델이 없어 `LookupError` 로 죽는다.
      즉 **빈 DB 에서 이 저장소를 세울 수 없었다** (실측:
      `docs/agent/evidence/e2e/migration_from_scratch.md`).
      계약 6차(2027.1)는 **소스 인도**이고 받는 쪽은 빈 DB 에서 시작한다. 어떻게 푸는가?
    options:
      - "A: dj-core `logger/0009` 에 dependency 를 넣는다 — 근본 해결. **§0.4 금지구역 수정**이라 사내 패키지 배포가 필요하다"
      - "B: 설치 절차에 두 줄을 넣는다 — `migrate user` → `migrate multilanguage` → `migrate` (지금 E2E 가 쓰는 방식)"
      - "C: 저장소에 순서 마이그레이션을 넣는다 (`run_before`) — **되돌렸다.** 이미 적용된 DB 의 migrate 를 영구히 막는다"
    chosen_default: "B (E2E 시험 DB 생성에만 적용 · 되돌릴 수 있다)"
    rationale: >-
      **B 를 적용했다** — 다만 **`backend/tests/e2e/conftest.py` 안에서만**이다.
      E2E 가 도는 것이 실행 순서 ⑤의 요구이고, 그것을 세우는 최소 변경이 이것이다.
      스키마를 바꾸지 않는다 (순서일 뿐이다).
      ⛔ **C 는 실제로 만들어 보고 되돌렸다.** 빈 DB 에서는 통과하지만, `logger/0009` 가
        이미 적용된 DB(지금의 개발 DB · 운영 DB)에서는 `migrate` 자체가
        `InconsistentMigrationHistory` 로 죽고 `--fake` 로도 못 넘는다.
        **새 환경 하나를 살리려고 도는 환경 전부를 세우는 변경**이라 채택하지 않았다.
      ★ **A 가 근본이다.** 그러나 사내 패키지 수정이므로 사람의 결정이 필요하다.
      ★ 그리고 **B 만으로는 부족하다** — 인도 문서의 설치 절차와 CI 에 그 두 줄이 들어가야
        한다. 지금은 시험 경로에만 있고, 그 사실을 숨기지 않는다.
    reversible: true
    blocks_dod: false
    status: open
