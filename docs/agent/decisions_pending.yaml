    context: "W0-18 ① 영향조사 — 권한거부 응답의 세 가지 모양을 실측하다 발견"
    question: >-
      권한거부가 **아무 흔적 없이 사라지는** 라우트 8건을 어떻게 할 것인가.
      `response=<단일 스키마>` 를 선언한 라우트에서는 거부 dict 가 그 스키마로 검증되면서
      **빈 객체 `{}` 로 소멸한다.** 클라이언트도 감사 로그도 "거부됐다"는 사실을 알 수 없고,
      응답이 만들어지기 전에 정보가 사라져 **후처리 계층에서 복원할 수 없다.**
      (실측: evidence/W0-18/backward_compat_impact.md §1 · A 281 · B 7 · C 8)
      ★ 8건은 report_template 4 · checklist_setting 4 — **전부 §0.4 밖 저장소 앱이라 고칠 수 있다.**
      ★ 그리고 그 8건의 `response=` 선언은 **이미 실제 응답과 다르다.** 성공 시 핸들러는
        `BaseResponse`(JsonResponse 서브클래스)를 돌려주고 ninja 는 HttpResponse 를 검증 없이
        통과시킨다. 즉 OpenAPI 문서가 지금도 그 라우트에 대해 거짓을 말하고 있다.
    options:
      - "A: 8건의 `response=` 선언을 뗀다. 성공 응답은 한 글자도 안 바뀌고(어차피 통과였다), 거부는 A 부류가 되어 미들웨어가 승격한다. OpenAPI 는 거짓 스키마를 잃고 참을 말하게 된다"
      - "B: 선언을 유지하고 8개 핸들러 앞에 저장소 쪽 권한 가드를 따로 건다 — 권한 판정이 두 곳이 된다"
      - "C: 그대로 둔다 — 8개 라우트에서 권한거부가 계속 조용히 사라진다"
