      "무엇이 테넌트 데이터인가"는 제품 정의라 에이전트가 정할 것이 아니다.
      **A 를 권고한다.** B 는 국가·시간대·메뉴를 특정 고객 소유로 만들어 다른 고객 화면을 깨뜨린다 —
