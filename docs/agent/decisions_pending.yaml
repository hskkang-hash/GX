  - id: P-W0-17-1
    ticket: "W0-17"
    raised_at: "2026-08-22"
    context: "타임아웃·폴백 부여 후 남은 외부 의존 계층 판단"
    question: >-
      requests 계열 17건에는 타임아웃을 붙였으나, 실측에서 드러난 나머지 외부 의존은 성격이 다르다.
      ① Redis 클라이언트 14건 — 타임아웃이 인자가 아니라 연결 옵션(socket_timeout)이다.
      ② OpenSearch 클라이언트 2건 — 이름 해석 실패 시 **재시도 5회**를 돌고 그동안 요청이 잡힌다
        (기동 로그에서 실측). 자체 timeout 인자가 있다.
      ③ MinIO — 기동 시 재시도 5회 후 FileSystemStorage 로 폴백한다. 이미 저하 운전은 있으나
        그만큼 기동이 늦다.
      이 셋을 W0-17 에서 함께 볼 것인가, 별도 티켓으로 뺄 것인가. 그리고 반복 실패를 끊는
      서킷 브레이커를 지금 도입할 것인가.
    options:
      - "A: W0-17 은 requests 계열로 닫고, Redis/OpenSearch/MinIO 는 별도 티켓(캐시·검색 계층)으로 뺀다"
      - "B: W0-17 범위를 넓혀 셋을 함께 처리한다"
      - "C: 서킷 브레이커까지 이번에 도입한다"
    chosen_default: "A"
    rationale: >-
      4원칙 ④(범위가 작은 쪽). 셋은 기전이 서로 다르고(인자·연결옵션·SDK 폴백), 검증 방법도 다르다.
      한 티켓에 묶으면 무엇이 끝났는지 말할 수 없게 된다 — 이 WP 에서 반복해 겪은 실패 모양이다.
      C 는 이르다. 서킷 브레이커는 "몇 번 실패하면 끊을지"를 정해야 하고, 그 수는 계측이 있어야 나온다.
      타임아웃·폴백 없이 브레이커부터 놓으면 임계값을 추측으로 정하게 된다.
      ★ 다만 ②는 우선순위가 높다 — 재시도 5회는 타임아웃을 5배로 만드는 것과 같다.
