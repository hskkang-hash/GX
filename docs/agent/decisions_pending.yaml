      권한거부가 클라이언트·감사 로그 어디에도 남지 않던 라우트 8건이 이제 403 을 낸다.
      ②는 있으면 좋았을 부수 효과였을 뿐이고, 없어도 A 가 B(권한 판정 이원화)·C(방치)보다 낫다.
      B 로 되돌리면 얻는 것이 없다 — 성공 응답은 어차피 무변경이었고 OpenAPI 도 무변경이므로,
      되돌림으로 회복되는 것은 "거부가 조용히 사라지는 상태" 하나뿐이다.
      ★ 남기는 이유: 근거가 검증 없이 문장으로 굳는 것을 막기 위해서다. 이번에는 실측했고 틀렸다.
    reversible: true
    blocks_dod: false
    answered_by: >-
      D-281 — **잠정안 C 를 채택하되 더 높인다.** 커널(L3)에서는 request 기반 데코레이터를
      **금지**하고, 스코프를 **키워드 전용 필수 인자**(`*, scope: TenantScope`)로 받는다.
