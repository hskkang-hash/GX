  - id: P-W0-14-2
    ticket: "W0-14 · W0-3"
    raised_at: "2026-08-22"
    context: "격리 시험 5시나리오 배선 결함 — D-250 으로 살아난 뒤의 잔여 33건"
    question: >-
      tests/test_tenant_isolation.py 는 D-250(픽스처 email 한 줄)으로 실행은 되지만
      **판정에 도달하지 못한다.** 실측 원인 3종이고 전부 배선이다(판정 로직 아님).
      ① Target.api_base 4건이 실재하지 않는 경로다 — /api/terminals/ · /api/stream-monitors/ ·
        /api/dashboard/ · /api/devices/ 는 404 다. 실경로는
        /api/terminals/terminals · /api/stream-monitors/stream-monitors ·
        /api/dashboard/dashboard/ · /api/devices/devices-management 이며
        **상세 경로에는 끝 슬래시가 없다**(/api/terminals/terminals/{id}).
        전량 대장: evidence/W0-14/openapi_routes.json (531 오퍼레이션 · 경로+메서드).
      ② 시나리오가 쓰는 메서드가 이 API 에 없다. PATCH 는 전 저장소에 1건뿐이고
        수정은 PUT(또는 devices 는 POST), 삭제는 대개 대량 경로(delete/{ids})다.
        지금 test_update_api 는 존재하지 않는 PATCH 를 부르므로 405 를 받고 실패한다.
        StreamMonitor·Dashboard 에는 **단건(detail) 경로 자체가 없다.**
      ③ 인증 배선 — force_login(세션)으로는 ninja JWT 라우터가 401 이다.
        실경로는 POST /api/v1/auth/login → user.access_token → Authorization: Bearer.
      ④ factory_kwargs 가 스키마 필수 FK 를 못 채운다(errors 24건) — Order.recipient_address,
        ChecklistSetting.category, SurveillanceProfile.mission/start_time,
        HandoverDocument.shift/handover/start_date/end_date/date_create_shift,
        DetectionEvent.stream_monitor/occurred_at/snapshot_path(+ 테이블 자체가 없다 — W2-1 미적용).
      이 넷을 고치지 않으면 D-249 의 EXIT 기준 "격리 시나리오 5/5" 는 영원히 판정 불가다.
      그런데 이 파일은 절대금지 #5(격리 테스트 수정 금지)의 대상이고, D-250 이 승인한 범위는
      픽스처 email 한 줄뿐이다. 확대 해석하지 않는다.
    options:
      - "A: 배선만 수정 승인 — api_base/detail 경로 템플릿·메서드·인증·factory_kwargs 4종. 단언(assert)과 FORBIDDEN 판정은 한 글자도 바꾸지 않는다. 경로가 실재하지 않는 시나리오(StreamMonitor·Dashboard 의 detail/update/delete)는 '없음'을 명시 등록하고 KNOWN_UNISOLATED 와 같은 증가금지 시험을 건다"
      - "B: 이 파일은 그대로 두고, 배선을 고친 **별도 파일**로 5시나리오를 다시 세운다 (원본은 계속 빨간불)"
      - "C: 아무것도 하지 않는다 — 5/5 판정을 포기하고 HTTP 프로브(누출 0건)만 EXIT 기준으로 쓴다"
    chosen_default: ""
    rationale: >-
      기본값을 적용하지 않는다 — 금지 #5 이고, P-LOCAL-2 때도 대표 판정(D-250)을 받고서야 손댔다.
      **A 를 권고한다.** 근거는 셋이다.
      (1) 이 시험 파일 자신이 "Target.api_base 를 실제 라우트로 고치십시오" 라고 실패 메시지에 적어 두었다.
          배선 수정은 이 파일의 설계가 예정한 작업이다.
      (2) 고치는 방향이 '드러내는' 쪽이다. 지금은 404·401 로 **판정 전에 죽어서** 누출 여부를
          말하지 못한다. 배선을 고치면 처음으로 5시나리오가 답을 낸다 — D-250 과 같은 성격이다.
      (3) B 는 정본이 둘이 되고, 원본이 계속 빨간불이라 CI 게이트로 못 쓴다. C 는 D-249 가 못박은
          EXIT 기준 절반을 포기하는 것이라 대표 결정 없이는 불가하다.
      ★ A 에도 대가가 있다: 경로 없는 시나리오를 '없음'으로 등록하면 그 칸은 영원히 비어 보인다.
        그래서 증가금지 시험을 함께 건다 — 없음 집합이 늘면 실패하게. 이것 없이 A 를 하면
        "5/5 초록"이 실제 커버리지보다 커 보이는 착시가 생긴다.
    reversible: true
    blocks_dod: true
    answered_by: "D-253 (RESUME_NEXT 2026-08-22 3차 §1) — A안 승인. 배선·픽스처만 수정, 단언 무변경"
    status: answered

  - id: P-W0-14-3
    ticket: "W0-14 · W0-13"
    raised_at: "2026-08-22"
    context: "파일럿 라우트에 명시적 group 필터를 건 뒤 소유 없는 레코드의 처리"
    question: >-
