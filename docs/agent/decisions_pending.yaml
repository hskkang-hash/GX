      즉 500 의 원인은 만료가 아니라 **해독 실패**다.
      원인: dj-core `core/middleware/refresh_token.py:204` `TokenRefreshMiddleware` 의
      `except` 블록이 복구를 시도하며 `jwt.decode` 를 **다시** 부르는데 감싸지 않았다.
      첫 실패가 해독 불가면 복구도 같은 자리에서 터져 예외가 미들웨어 밖으로 나간다
      (`jwt.exceptions.DecodeError: Not enough segments`). **§0.4 금지구역이라 그 파일은 못 고친다.**
      ★ 왜 지금인가: 서명키를 교체하면 **구 토큰이 전부 "다른 키로 서명" 상태**가 된다.
        그 줄이 500 이다. 프론트의 재인증 경로는 401 을 본다 — 키 교체 직후 세션 전체가
        재인증으로 흐르지 못하고 500 으로 멈출 수 있다.
