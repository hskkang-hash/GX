      B 를 기본값으로 둔다. 코드 착수는 여전히 WP-2 EXIT 후이므로 A 와 실질 차이가 없고,
      **등재해 두면 잊히지 않는다.** 계약 필수 기능이 정본에서 빠져 있는 상태를 몇 주 유지하는
      것이 실제 위험이다. 다만 티켓 등재는 정본 변경이라 대표 승인부에 올린다.
      ⚠ 외부 발송 업체(SMS·푸시) 선정은 별건이다 — 계약·비용 사안 (DA-04 D4-1).
    reversible: true
    blocks_dod: false
    status: open

  - id: P-DA-3
    ticket: DA-01 · W0-14
    raised_at: "2026-08-25"
    context: "F-11 의 기반 모델 ReportTemplate 에 테넌트 격리가 없다 — 범위 판정 필요"
    question: >-
      **`ReportTemplate` 은 `BaseModel` 상속이다 — `BaseModelWithGroup` 이 아니다**
      (`backend/report_template/models.py:5`). 즉 모델 레벨 group 격리가 없다.
      W0-14c 가 핸들러 문지기(`assert_scoped()`)를 report_template 에 붙여 HTTP 표면은 막았으나,
      **모델·매니저 레벨은 그대로**다. 에스비 채널은 고객사별 분리가 전제이고(계약 §2.2-4 · 검수
      §7 보안 점검), F-11 은 그 위에 얹히는 필수 기능이다.
      이것을 WP-2(신뢰봉인) 범위로 볼 것인가, WP-DA2 로 미룰 것인가.
    options:
      - "A: WP-2 범위로 편입 — EXIT 전에 BaseModelWithGroup 전환 + 데이터 백필"
      - "B: WP-DA2 로 이월 — 지금은 핸들러 문지기로 충분하다고 보고 K4 착수 시 함께 고친다"
      - "C: 문지기 유지 + 격리 시험 레지스트리에 ReportTemplate 등록만 지금 (증가 방지)"
    chosen_default: "C"
    rationale: >-
      C 를 기본값으로 둔다. A 는 **스키마 변경 + 데이터 백필**이라 파괴적이고(D-209 dry-run 선행),
      WP-2 EXIT 를 늦춘다 — EXIT 는 WP-DA2 착수 조건이므로 전체 일정이 밀린다.
      B 는 몇 달간 "모델은 뚫려 있고 문지기만 있다"를 방치한다 — 새 핸들러가 문지기 없이
      추가되는 순간 조용히 뚫린다.
      C 는 그 사이를 막는다: 시험 레지스트리에 등록하면 **문지기 없는 새 경로가 시험에서 붉게 뜬다.**
      전환 자체는 K4 착수 시(WP-DA2) 백필과 함께 한다.
      ⚠ `dashboard.DashboardPanel` 미등록도 같은 성격이다(W0-14 2026-08-24 실측) — 함께 처리 권고.
    reversible: true
    blocks_dod: false
    status: open

  - id: P-DA-4
    ticket: DA-01 · DA-03
    raised_at: "2026-08-25"
    context: "계약 AC 의 '5상태'를 상위 지시서가 축약하면서 뜻이 갈렸다 — 확인 요청"
    question: >-
      ★ **"5상태 100%"는 재난 상태가 아니라 화면 상태다. 확인을 구한다.**
      계약 [별첨 1] F-09 AC 원문: "**5상태(기본/로딩/빈/오류/권한없음) 정의**, 이벤트 클릭→영상 3초 이내".
      상위 지시서 §3·§6 은 "5상태 100%"로만 적었고, 그것만 읽으면 **재난 등급 5단계**로 읽힌다.
      **이 문서 초안이 실제로 그렇게 적었다가 계약 원문 대조에서 잡혔다.**
      재난 등급은 F-04 의 **3종(주의·경계·심각)** 이다.
      DA-01·DA-03 은 계약 원문(화면 상태 5종)을 따라 작성했다.
      → 이 판정이 뒤집히면 F-09 설계 전체가 바뀌므로 명시적 확인이 필요하다.
    options:
      - "A: 계약 원문대로 화면 상태 5종 — DA-01·DA-03 그대로 (권고)"
      - "B: 재난 등급 5단계로 확장 — 계약 변경요청서 필요(계약 말미 조항)"
    chosen_default: "A"
    rationale: >-
      A 가 사실상 유일한 선택지다. 계약 [별첨 1] 은 계약의 일부이고 검수 기준이며,
      변경은 **양 당사자 서면 합의**(별첨 말미)를 요한다. B 로 가려면 등급 체계 자체를
      3종에서 5종으로 바꿔야 하는데 그러면 F-04·F-06(심각 등급 발동)의 AC 가 전부 흔들린다.
      기록해 두는 이유는 판정을 구하기 위해서가 아니라 **오독이 실제로 발생했음을 남기기 위해서**다
      (D-214 작성자 오류 기록 절차와 같은 취지 — 이번 건은 에이전트 자신의 오독이다).
    reversible: true
    blocks_dod: false
    status: open
