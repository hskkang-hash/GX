  - id: P-W0-14-5
    ticket: "W0-14 · W0-3"
    raised_at: "2026-08-27"
    context: "P0 의 '라우트가 닿는다'가 두 뜻으로 쓰였다 — 나머지 13종의 등재 방식이 여기서 갈린다"
    question: >-
      `leak_targets_coverage.md` §7-2 는 P0 를 "**pk 를 지목하는 경로가 닿고** 행 50+"로
      정의했다. D-266 선결 2종을 실제로 등재하며 나머지 13종의 실경로를 652 대장과 대조하니
      **그런 경로가 없는 종이 여럿**이다:
        · `surveillance.MissionWaypoint`(8,877행) — waypoint 를 포함하는 라우트 0개
        · `orders.OrderHistory`(5,882) · `orders.OrderItem` — 직접 경로 없음
        · `terminals.RouteTerminal`(2,062) — 초안이 지목한 `export-single-plan/{route_id}` 는
          **Routes 의 id** 이지 RouteTerminal 의 pk 가 아니다
      모순이 아니라 정의가 두 뜻으로 쓰인 것이다. `map_routes_to_models.py` 의 "닿는다"는
      *핸들러가 그 모델을 만진다*(부모 경로를 통해)는 뜻이고, 격리 시험의 5시나리오는
      *pk 로 그 레코드를 지목한다*를 전제한다.
      **부모를 통해 자식이 새는 것은 실재하는 위험이고 재야 한다.** 다만
      detail/update/delete 칸으로는 잴 수 없다.
    options:
      - "A: 부모 경로 시나리오를 신설 — 부모를 부르고 응답 본문에 남의 자식 pk 가 없는지 본다 (지금 export 가 그 모양이다). 13종을 그 시나리오로 등재"
      - "B: pk 직접 경로가 없는 종은 ORM 수준 격리만 재고 HTTP 는 NO_ROUTE 로 등재 (사유 첨부)"
      - "C: P0 정의를 pk 직접 경로가 있는 종으로 좁히고, 나머지는 P1 로 내린다 (EXIT 범위 축소)"
    chosen_default: ""
    rationale: >-
      **기본값을 적용하지 않는다.** 셋이 EXIT 의 모수를 서로 다르게 만든다 —
      즉 "무엇을 다 봤다고 말할 것인가"를 정하는 판정이고, 그것은 D-262 가 세운 조건의 해석이다.
      ★ **A 를 권고한다.** 부모를 통한 자식 노출이 이 저장소에서 실재하는 모양이다
        (MissionWaypoint 8,877행은 백필 前 group NULL 100% 였고 SurveyMission 아래에 있다).
        B 는 HTTP 표면이 있는데도 "없다"고 적게 되어 NO_ROUTE 의 뜻을 흐린다.
        C 는 수를 줄여 초록을 만드는 것이라 D-262 가 고치려던 실패의 재발이다.
      ※ A 를 택하면 Target 에 시나리오 한 칸(`via_parent`)이 늘고, 그 배선은 이번에 만든
        대상별 판정표 위에서 그대로 돈다 — 구조 변경은 크지 않다.
    answered_at: "2026-08-28"
    answered_by: "세종(기획) · 대표 위임 — RESUME_NEXT 2026-08-28"
    answer: >-
      **D-272 — A안 승인.** 도달 가능성을 3값으로 센다:
      direct_pk(그 경로에 스코프 부착·시험) · via_parent(부모 경로 스코프 + 자식 필터
      **둘 다** 시험. "직접 경로 없음"은 안전이 아니다) ·
      no_route(면제가 아니라 등재 + **전수 라우트 대조 근거 첨부** · 라우트 추가 시
      재검사되도록 게이트 연결). 근거는 D-263(자동 면제 금지)의 연장이다.
    reversible: true
    blocks_dod: true
    status: answered

  - id: P-W0-14-6
