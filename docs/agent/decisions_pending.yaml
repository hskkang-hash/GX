        · Order 500 은 정보 누출이 아니다(오히려 막혀서 나는 500 이다). 화면 오류로만 보인다.
        · Terminal 수정 400 은 남의 행을 바꾸지 못한다 — 막고 있고 응답만 거짓말한다.
        · **셋 다 누출은 아니다.** WP-2 EXIT 기준 1(재현 누출 0건)에는 영향이 없다.
      즉 급한 것은 "격리"가 아니라 "정직한 응답"이고, 그것은 인증 심사(GS)의 문제다.
