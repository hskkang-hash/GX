  - id: P-W0-14-4
    ticket: "W0-14 · W0-18"
    raised_at: "2026-08-24"
    context: "쓰기 경로 문지기를 4개 앱에 걸고 남은 실패 3건이 전부 §0.4 금지구역이다"
    question: >-
      W0-14c 1차로 report_template·checklist_setting·devices·surveillance 8개 핸들러에
      소유 문지기(assert_scoped)를 걸었다. 정정된 실측에서 격리는 HTTP 레벨에서 버티고 있고,
      남은 실패 3건은 **누출이 아니라 응답 계약 위반**이며 **전부 §0.4 금지구역 앱**이다:
        · Order 상세 → 테넌트 필터가 걸러 DoesNotExist 가 나는데 핸들러가 안 잡아 **HTTP 500**
        · Terminal 수정 → **400** 인데 본문은 `success:true`, 변경된 열은 0개
        · Terminal 삭제 → **200 "Deleted successfully"** 인데 **행은 그대로**고 deleted 는 NULL.
          하지 않은 일을 했다고 응답한다 — 감사 관점에서 조용한 누출보다 나쁠 수 있다.
      §0.4 는 delivery/orders/terminals 3개 앱(269파일)을 R1 동안 "건드리지 말 것"으로 둔다.
      그 사유는 "배송 라인은 라이선스 플래그로 숨기고 코드는 그대로"다 — 리팩터링을 막는 조항이며,
      보안·계약 결함 수정까지 막을 의도였는지는 문서에 없다.
    options:
      - "A: 금지구역 3개 앱은 W0-18(응답 후처리 계층)에서 **소스 무수정으로** 처리한다 — 상태코드 승격을 미들웨어/렌더러에서. D-248 이 이미 그 방식을 정했다"
      - "B: 보안·계약 결함에 한해 금지구역 예외를 인정하고 핸들러에 직접 문지기를 건다"
      - "C: 금지구역을 그대로 지키고 3건을 R1 잔여 결함으로 문서화한다"
    chosen_default: "A"
    rationale: >-
      4원칙 ①(더 안전한 쪽)·④(범위가 작은 쪽). A 는 **269파일을 건드리지 않고** 세 증상을
      한 곳에서 고친다 — D-248 이 200-body-403 을 후처리 계층으로 올리라고 정한 것과 같은 기전이다.
      Order 500·Terminal 400·Terminal 200 은 모두 "결과를 정직한 상태코드로 바꾸는" 문제라
      후처리 계층의 사정권 안에 있다.
      B 는 금지구역의 취지(배송 라인 동결)와 정면으로 충돌하고, 269파일 중 어디까지가 '보안'인지
      경계를 에이전트가 정하게 된다 — 그 경계는 대표가 정할 일이다.
      C 는 Terminal 삭제가 **거짓 성공**을 계속 응답하게 둔다. 인증·감사에서 설명하기 어렵다.
      ★ 다만 A 에는 한계가 있다: 후처리 계층은 상태코드를 고칠 수 있어도
        "삭제가 실제로 일어났는가"를 알 수 없다. Terminal 삭제의 거짓 성공은 상태코드가
        아니라 **핸들러의 반환값**이 거짓이라, A 로는 200 → 404 로 바꿀 근거를 만들지 못한다.
        그 한 건만은 B(또는 별도 승인)가 필요할 수 있다 — W0-18 착수 시 재확인해 보고한다.
    reversible: true
    blocks_dod: false
    answered_by: >-
      D-281 — **잠정안 C 를 채택하되 더 높인다.** 커널(L3)에서는 request 기반 데코레이터를
      **금지**하고, 스코프를 **키워드 전용 필수 인자**(`*, scope: TenantScope`)로 받는다.
      데코레이터는 "붙였는가"만 보지만 필수 인자는 **부르는 쪽이 테넌트를 알아야만** 호출된다 —
      표식이 아니라 구조다. 잠정 적용했던 문지기 호출 판정은 **2차 통과 형태로 함께 남긴다**
      (시그니처가 1차, 문지기가 2차). C-3.1 문언은 이 판정으로 개정된 것으로 본다.
      게이트에 "커널 공개 함수 중 scope 인자 없는 것 = fail" 을 추가했다.
    status: answered

