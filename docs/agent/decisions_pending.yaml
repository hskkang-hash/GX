  # --- WP-0 §11 오프라인 작업 중 적재 (2026-08-15) ---
  - id: P-W0-3-1
    ticket: W0-3
    raised_at: "2026-08-15"
    context: "WP-0 §11-2 (@expectedFailure 3건 등록) 수행 중"
    question: >-
      ENTRY §11-2 는 예상 실패 3건을 test_tenant_isolation.py 에 @expectedFailure 로
      등록하라고 했다. 그런데 (a) 그 파일 머리말이 "skip·xfail·비활성화 금지"를 명시하고,
      (b) 절대금지 #5 가 격리 테스트 수정을 금지하며, (c) D-209 는 "이 테스트는 실패하는
      것이 정상이고 실패가 산출물"이라고 결정했다. @expectedFailure 는 그 산출물을
      스위트 집계에서 지운다. 코드에 표기하는 것이 맞는가, 문서 등록부가 맞는가.
    options:
      - "A: 코드를 고치지 않고 evidence/W0-3/coverage.md §3 등록부로 표기한다"
      - "B: ENTRY 대로 @expectedFailure 를 코드에 건다 (파일 머리말·금지 #5 예외 승인 필요)"
      - "C: 표기하지 않고 실패를 그대로 둔다 (등록부도 만들지 않는다)"
    chosen_default: "A"
    rationale: >-
      4원칙 ①(더 안전한 쪽)·④(범위가 작은 쪽). A 는 격리 테스트 파일을 한 줄도 건드리지
      않으면서 "실패가 분류되어 기록된다"(ENTRY §9)를 충족한다. B 는 실패 건수를 0으로
      보이게 만들어 금지 #5 가 막으려던 상태와 결과가 같아진다.
      덧붙여 실측 결과 예상 실패는 3건이 아니라 **1건만 확정**이다 —
      test_registry_covers_all_isolatable_models(미등록 11종 정적 확인),
      test_null_created_by_is_not_globally_visible(대상이 dj-core 매니저라 판정 불가),
      test_unisolated_set_has_not_grown(통과 예상). 3건 전부에 표기를 걸었다면
      뒤 둘이 unexpected success 로 스위트를 깨뜨렸을 수 있다.
    reversible: true
    blocks_dod: false
    status: open

