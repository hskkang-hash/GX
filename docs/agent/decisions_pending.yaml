    question: >-
      ★ **P-W0-14-4 의 전제를 정정한다. 남은 격리 실패 3건은 W0-18 후처리 계층으로 닫히지 않는다.**
      P-W0-14-4 는 A안(§0.4 3개 앱을 W0-18 후처리 계층에서 소스 무수정으로 처리)을 권고했다.
      실측: 같은 시험을 플래그 OFF/ON 으로 두 번 돌렸고 **한 건도 움직이지 않았다.**
        플래그 OFF → 4 failures / 1 error
        플래그 ON  → 4 failures / 1 error   (API_CONTRACT_PROMOTE_ERROR_STATUS=true)
      이유는 셋 다 **권한거부가 아니기** 때문이다:
        · Order 상세 500      → DoesNotExist 가 핸들러를 빠져나간다. 본문에 거부 dict 가 없다
        · Terminal 수정 400   → 상태는 4xx 인데 본문이 `success:true` 다 (승격의 **반대** 방향)
        · Terminal 삭제 200   → 상태·본문이 아니라 **본문이 거짓**이다. 어떤 응답 계층도
                                하지 않은 삭제를 했다고/안 했다고 판정할 근거를 만들 수 없다
      D-248 이 지시한 것은 "권한거부의 상태코드"였고 이 계층은 그것을 한다(계약 시험 19건 green).
      P-W0-14-4 는 그것을 "§0.4 안의 응답 계약 위반 일반"으로 넓혀 읽었다. 넓힌 부분이 남는다.
    options:
      - "A: 3건을 R1 잔여 결함으로 문서화하고 R2 로 넘긴다 (P-W0-14-4 의 C안으로 회귀)"
      - "B: 보안·감사 결함에 한해 §0.4 예외를 인정하고 3개 핸들러만 직접 고친다 (P-W0-14-4 의 B안)"
      - "C: Terminal 삭제(거짓 성공) 한 건만 B, 나머지 둘은 A — 성격이 다르므로 갈라 처리한다"
    chosen_default: ""
    rationale: >-
      **기본값을 두지 않는다.** §0.4 예외를 인정할 것인가는 지시서 §0.4 의 취지(배송 라인 동결)를
      바꾸는 판단이고, 그 경계는 대표가 정할 일이다 (P-W0-14-4 의 rationale 도 같은 이유로 그렇게 적었다).
      ★ 판단에 필요한 사실만 정리한다:
        · 세 건 중 **감사 관점에서 가장 나쁜 것은 Terminal 삭제**다. "Deleted successfully" 라고
