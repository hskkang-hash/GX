      게이트로 요구했다(`verify_classification.py`). 여기에 **한 가지를 더 넣을 것을 제안한다** —
      **저널 왕복 자가검사**다. 이번에 잡은 결함(저널이 개행 없이 한 줄로 쓰여 롤백이 0행을
      읽는 상태)은 등록부 참조 여부와 무관하고, `verify_classification.py` 로는 잡히지 않는다.
      즉 D-270 ③ 만으로는 오늘 두 사고 중 **한 건만** 막힌다.
      제안: 쓰기 스크립트는 저널을 쓴 직후 **자기가 쓴 저널을 다시 읽어 행수를 대조**하고,
      불일치면 트랜잭션을 커밋하지 않는다. "되돌릴 수 있음"을 말이 아니라 **실행으로** 증명한다.
    options:
      - "A: verify_classification.py 에 저널 왕복 검사를 함께 넣는다 (게이트 1개)"
      - "B: 별도 게이트 verify_journal_roundtrip.py 로 분리한다 (게이트 2개 · 책임 분리)"
      - "C: 게이트가 아니라 backfill 계열 스크립트 안의 커밋 전 단언으로만 둔다"
    chosen_default: "A"
    rationale: >-
      4원칙 중 **되돌릴 수 있는 것은 진행한다**를 적용했다. 게이트를 늘리는 것은
      되돌릴 수 있고(지우면 된다), 늦추면 그 사이의 쓰기가 또 무방비다.
      A 를 고른 이유: 둘 다 "데이터를 쓰는 스크립트가 지켜야 할 것"이라 같은 게이트가 자연스럽고,
      게이트가 흩어지면 어느 것이 무엇을 막는지 다시 모르게 된다(D-227 의 실패 모양).
      C 는 반대한다 — 스크립트 안의 단언은 **그 스크립트를 안 고치면 다음 스크립트에 없다.**
      오늘 두 사고가 정확히 그렇게 생겼다.
    reversible: true
    blocks_dod: false
    answered_by: >-
      D-281 — **잠정안 C 를 채택하되 더 높인다.** 커널(L3)에서는 request 기반 데코레이터를
      **금지**하고, 스코프를 **키워드 전용 필수 인자**(`*, scope: TenantScope`)로 받는다.
      데코레이터는 "붙였는가"만 보지만 필수 인자는 **부르는 쪽이 테넌트를 알아야만** 호출된다 —
      표식이 아니라 구조다. 잠정 적용했던 문지기 호출 판정은 **2차 통과 형태로 함께 남긴다**
      (시그니처가 1차, 문지기가 2차). C-3.1 문언은 이 판정으로 개정된 것으로 본다.
      게이트에 "커널 공개 함수 중 scope 인자 없는 것 = fail" 을 추가했다.
    status: answered

