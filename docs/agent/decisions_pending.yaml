  - id: P-K1-1
    ticket: "W2-1 · W2-2 (K1) · C-3.1"
    raised_at: "2026-08-28"
    context: "커널 첫 커밋에서 C-3.1 게이트가 6건 전부를 반려했다"
    question: >-
      C-3.1 은 "커널의 모든 공개 함수는 `@tenant_scoped()` 를 거치거나 PUBLIC 등록부에
      근거와 함께 등재" 라고 적었다. K1 을 세우자 공개 함수 6건이 전건 반려됐다.
      문제는 **데코레이터가 커널에서 작동하지 않는다**는 것이다:
      `tenant_scoped` 는 인자에서 `request` 를 찾고 **못 찾으면 그냥 통과시킨다**
      (`common/tenant_scope._find_request` → None → `_check` 생략).
      커널 서비스 함수에는 `request` 가 없다 — 파이프라인이 부르거나 `actor` 를 받는다.
      붙이면 **표식만 남고 아무것도 안 막는다.** 데코레이터 466/466 부착을 완결로
      착각했던 착시 ①(D-249)과 똑같은 모양이 커널에서 재현된다.
      한편 DA-04 §2 K1 은 "테넌트 스코프 강제 — **인자로 group 을 명시로 받는다**"라고
      다른 방식을 적고 있다. 두 문서가 어긋나 있다.
    options:
      - "A: @tenant_scoped 를 그대로 붙인다 (게이트 초록 · 실효 0 — 착시 ①의 재현)"
      - "B: KERNEL_PUBLIC 에 6건 전부 등재한다 (사실 아님 — 테넌트 데이터를 반환한다)"
      - "C: 통과 형태를 하나 더한다 — **문지기 호출**이 호출 그래프에 있으면 인정"
      - "D: tenant_scoped 를 커널용으로 개조한다 (라우트 466건에 영향 — 범위가 다르다)"
    chosen_default: "C (잠정 적용 · 되돌릴 수 있다)"
    rationale: >-
      **C 를 잠정 적용했다.** 되돌릴 수 있고(게이트 함수 하나), 미적용 시 K1 이 아예 커밋되지
      못해 ⑥이 서지 않기 때문이다 (reversible=true).
      ★ **이것은 C-3.1 을 무르게 하는 것이 아니라 높이는 것이다 (D-105 저촉 아님).**
        표식(데코레이터)만으로는 부족하고, `common.tenant_filters` 의 **진짜 문지기**가
        호출 그래프에 있어야 인정한다. 문지기 목록은 `common.tenant_tripwire.GATEKEEPER_CALLS`
        **한 벌을 공유**한다 — 두 벌을 두면 "라우트에서는 문지기인데 커널에서는 아닌 것"이
        생기고 그 어긋남은 아무도 못 본다.
      ⛔ **A 는 반대한다.** 게이트를 초록으로 만들되 실효가 0 이다. D-249 가 이름 붙인 그 착시다.
      ⛔ **B 도 반대한다.** query_events·get_event 는 테넌트 데이터를 반환한다. PUBLIC 등재는
        "이 함수는 테넌트 데이터를 반환하지 않는다"는 선언이므로 거짓말이 된다.
      ○ **D 는 범위가 다르다.** `tenant_scoped` 는 라우트 466건이 쓰는 것이라 커널 6건을 위해
        고칠 물건이 아니다. 필요하면 별 티켓으로 연다.
      실측: C 적용 후 query_events→filter_by_group_field · get_event→get_scoped_or_404+assert_scoped ·
      review/close→assert_scoped 로 4건이 **문지기 호출**로 통과했고, 나머지 2건
      (record_detection · subscribe)만 사유와 시험 근거를 붙여 KERNEL_PUBLIC 에 올렸다.
