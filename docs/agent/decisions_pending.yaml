      - "B: ①②를 모두 대표 지정 테넌트로 귀속 (기계적 전량 백필)"
      - "C: 백필하지 않고 '소유 없음 = 전역만 조회 가능' 으로 둔다 (W0-14 필터 그대로)"
    chosen_default: ""
    rationale: >-
