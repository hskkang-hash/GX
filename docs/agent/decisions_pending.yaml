  - id: P-W0-13-1
    ticket: "W0-13"
    raised_at: "2026-08-24"
    context: "백필 dry-run 실측 — 근거 없는 6,584행의 성격이 갈린다"
    question: >-
      D-254 대로 dry-run 을 냈다(evidence/W0-13/backfill_dryrun.md). 실측: 테넌트성 45,277행 중
      group NULL 30,200(66.7%). 그중 **23,273은 부모 레코드에서 물려받을 수 있고(R3), 343은
      created_by 로 정할 수 있다(R2).** 남는 6,584가 문제다 — 근거가 아무것도 없다.
      그리고 그 6,584는 성격이 둘이다.
      ① `terminals.Terminal` 3,399 (총 5,686의 60%) — **실제 테넌트 데이터**다. 배송·순찰의
        기준 장소이고 RouteTerminal·TerminalOperatingTime·DeliveryEvent 의 **부모**다.
        즉 이것을 정하지 못하면 그 아래 4,900여 행도 연쇄로 못 정한다. 최우선.
        ★ 역추론을 **실측했다** (읽기 전용 · 참조 8경로 전수: RouteTerminal·Routes.terminal_from·
        Order.pickup_location·Order.delivery_terminal·Device.terminal·MissionWaypoint.terminal·
        FlightLog.start/end_point). 결과가 깨끗하다:
          · **1,809 — 단일 테넌트에서만 쓰였다** → 자동 귀속 가능. 모호함 없음
          · **1,590 — 어디에도 쓰인 적이 없다** → 참조 0. 숨겨도 업무에 영향이 없다
          · **다중 테넌트 = 0건.** 즉 Terminal 은 공용 마스터가 아니다 — 실제로 테넌트별로 쓰인다
      ② 약 2,000행은 **애초에 테넌트 데이터가 아니다** — user.Timezone 598 · Country 238 ·
        CurrencyFormat 31 · advanced_table.GridSetting 763 · GridSettingUser 896 · menu.Tab ·
        devices.FrameType/Protocol/FrameClass · orders.OrderItemType · delivery.DeliveryStatus …
        created_by/group 열을 베이스 모델에서 물려받았을 뿐이고 내용은 전 테넌트 공용이다.
        여기에 소유자를 채우면 다른 테넌트 화면에서 국가·시간대·상태값이 사라진다.
    options:
      - "A: ②는 '공용 마스터'로 표기(D-209 ② is_system)하고 백필 제외 · ①은 역추론으로 1,809행 자동 귀속, 참조 0인 1,590행은 귀속하지 않고 그대로 둔다 (실측 근거 있음)"
      - "B: ①②를 모두 대표 지정 테넌트로 귀속 (기계적 전량 백필)"
      - "C: 백필하지 않고 '소유 없음 = 전역만 조회 가능' 으로 둔다 (W0-14 필터 그대로)"
    chosen_default: ""
    rationale: >-
      기본값을 적용하지 않는다 — 되돌리기 어려운 데이터 변경이고(reversible=false 성격),
      "무엇이 테넌트 데이터인가"는 제품 정의라 에이전트가 정할 것이 아니다.
      **A 를 권고한다.** B 는 국가·시간대·메뉴를 특정 고객 소유로 만들어 다른 고객 화면을 깨뜨린다 —
      격리를 켰더니 데이터가 없어졌다로 읽히고, 그 압력이 D-103(우회 목록 부활)을 부른다.
      C 는 Terminal 3,399(그리고 그 하위 4,900행)를 담당자 화면에서 영구히 지우는 선택이다.
      ★ ①의 역추론은 **이미 실측해 붙였다** — 다중 소유 0건, 단일 소유 1,809, 미사용 1,590.
        그래서 A 는 추측이 아니라 데이터에 근거한다: 1,809는 소유가 하나로 정해지고,
        1,590은 아무도 참조하지 않으므로 숨겨도 잃는 것이 없다.
      ★ 적용 순서·되돌리기는 dry-run §6 에 적었다. 4단계(R3 23,273행)는 ① 판정 후에만 실행한다.
    reversible: false
    blocks_dod: true
    status: open

