      - "A: 그대로 간다 — 소유를 말할 수 없는 레코드는 숨긴다. W0-13 백필로 귀속시켜 되살린다 (닫는 쪽 기본값)"
      - "B: W0-13 백필을 W0-14 확대보다 **먼저** 끝낸다 — 화면 손실 0 으로 만든 뒤 확대"
