  - id: P-W0-18-2
    ticket: W0-14 · W0-16
    raised_at: "2026-08-24"
    context: "W0-18 영향조사 중 라우트 레지스트리를 훑다가 나온 부수 발견 (W0-18 범위 밖)"
    question: >-
      `@path_permission` 은 붙었는데 **`auth=` 가 없는 라우트 24건**을 어떻게 볼 것인가.
      실측: 652 라우트 중 auth 콜백 없음 143건, 그중 @path_permission 부착 24건
      (terminals 9 · devices 6 · flight_log 4 · delivery 3 · operational_data 1 · orders 1).
      이 24건은 `CustomJWTAuth` 를 거치지 않고 **미들웨어가 복원한 사용자**로 권한만 본다.
      ★ 실측 증거: `/api/token/pair` 가 발급한 토큰(= CustomJWTAuth 가 401 로 거부하는 토큰)으로
        `/api/devices/devices-management` 를 부르면 **401 이 아니라 권한 판정까지 도달한다.**
        즉 인증 관문 하나가 라우트마다 있거나 없다.
      W0-18(응답 계약)의 범위가 아니다. 계약 작업과 인증 작업을 한 커밋에 섞지 않으려고 적재만 한다.
    options:
      - "A: W0-14 의 dod ① (미적용 엔드포인트 0개) 에 'auth 콜백 없음'을 함께 세고 24건을 그 롤아웃에 포함한다"
      - "B: 별도 티켓(W0-20)으로 분리한다 — 인증 표면은 스코프와 다른 문제다"
      - "C: 24건 각각이 의도된 공개 라우트인지 먼저 조사하고 그 결과로 정한다"
    chosen_default: "C"
    rationale: >-
      4원칙 ③(되돌릴 수 있는 쪽). 24건 중 일부는 진짜 공개 엔드포인트(health·콜백)일 수 있고,
      조사 없이 auth 를 붙이면 외부 연동이 조용히 끊긴다 — 그것은 되돌리기 비싼 실수다.
      C 는 읽기 전용이라 지금 바로 해도 안전하고, 그 결과가 A/B 의 근거가 된다.
