      까닭: 그 출력 스키마들이 `core.common.schema_utils.DynamicSchema` 를 상속해
      `model_fields` 가 **비어 있다.** 실을 속성이 없으니 ninja 가 애초에 응답 본문을
      문서에 싣지 않았다. OpenAPI 는 거짓을 말한 것이 아니라 **아무 말도 하지 않고 있었다.**
      같은 빈 필드가 런타임에는 거부 dict 를 `{}` 로 만들었다 — 두 증상의 뿌리가 하나다.
