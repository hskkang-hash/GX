<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Status Monitoring</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
    }

    .status-button {
      background-color: #0099ff;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
    }

    .chart-container {
      background-color: #111;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      height: 200px;
      position: relative;
    }

    .chart-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
      gap: 10px;
    }

    .chart-toggle {
      background-color: #333;
      color: #ccc;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .chart-toggle.active {
      background-color: #555;
      color: white;
    }

    .monitoring-menu-button {
      background-color: #444;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      margin-right: auto;
    }

    .monitoring-menu {
      position: absolute;
      top: 50px;
      left: 20px;
      background-color: rgba(200, 200, 200, 0.95);
      color: #000;
      border-radius: 8px;
      padding: 15px;
      z-index: 1000;
      min-width: 300px;
      max-height: 500px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .monitoring-menu.show {
      display: block;
    }

    .monitoring-menu-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 14px;
      color: #000;
    }

    .monitoring-menu-content {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .monitoring-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }

    .monitoring-item input[type="checkbox"] {
      cursor: pointer;
    }

    .monitoring-item label {
      cursor: pointer;
      user-select: none;
    }

    .axis-meters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .axis-meter {
      flex: 1;
      background-color: #222;
      border-radius: 4px;
      padding: 10px;
      cursor: pointer;
    }

    .meter-label {
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    .meter-label .raw-value {
      font-size: 10px;
      color: #999;
    }

    .meter-bar {
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      margin-bottom: 5px;
      position: relative;
    }

    .meter-bar-fill {
      height: 100%;
      border-radius: 5px;
      position: absolute;
      left: 0;
      top: 0;
    }

    .x-axis .meter-bar-fill {
      background-color: #ff4d4d;
    }

    .y-axis .meter-bar-fill {
      background-color: #ffaa00;
    }

    .z-axis .meter-bar-fill {
      background-color: #00cc66;
    }

    .vibe-axis .meter-bar-fill {
      background-color: #ff6b9d;
    }

    .rc-axis .meter-bar-fill {
      background-color: #4dabf7;
    }

    .servo-axis .meter-bar-fill {
      background-color: #51cf66;
    }

    .gps-axis .meter-bar-fill {
      background-color: #ffd43b;
    }

    .meter-value {
      text-align: center;
    }

    .info-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .info-card {
      background-color: #222;
      border-radius: 8px;
      padding: 15px;
    }

    .info-card-title {
      color: #999;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .info-card-value {
      font-size: 24px;
      font-weight: bold;
    }

    .info-card-status {
      margin-top: 5px;
      font-size: 12px;
    }

    .normal {
      color: #00cc66;
    }

    .caution {
      color: #ffaa00;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="title">Drone status monitoring</div>
      <button id="statusButton" class="status-button">Arrived at base</button>
    </div>

    <div class="chart-controls">
      <button id="monitoringMenuButton" class="monitoring-menu-button">
        모니터링 항목 선택
      </button>
      <button id="toggleNormalized" class="chart-toggle active">
        Normalized
      </button>
      <button id="toggleRaw" class="chart-toggle">Raw Data</button>
    </div>

    <div class="monitoring-menu" id="monitoringMenu">
      <div class="monitoring-menu-title">모니터링 항목 선택</div>
      <div class="monitoring-menu-content" id="monitoringMenuContent">
        <!-- Will be populated by JavaScript -->
      </div>
    </div>

    <div class="chart-container">
      <canvas id="accelerationChart"></canvas>
    </div>

    <div class="axis-meters" id="axisMeters">
      <!-- Will be populated dynamically based on selected items -->
    </div>

    <div class="info-cards">
      <div class="info-card">
        <div class="info-card-title">Current battery</div>
        <div id="batteryValue" class="info-card-value">100%</div>
        <div id="batteryStatus" class="info-card-status normal">normal</div>
      </div>
      <div class="info-card">
        <div class="info-card-title">Distance traveled</div>
        <div id="distanceValue" class="info-card-value">0.0km</div>
        <div id="destinationInfo" class="info-card-status">
          0.0km to destination
        </div>
      </div>
      <div class="info-card">
        <div class="info-card-title">Current wind speed</div>
        <div id="windValue" class="info-card-value">0km/h</div>
        <div id="windStatus" class="info-card-status normal">normal</div>
      </div>
      <div class="info-card">
        <div class="info-card-title">Drone Temperature</div>
        <div id="tempValue" class="info-card-value">35°C</div>
        <div id="tempStatus" class="info-card-status normal">normal</div>
      </div>
    </div>
  </div>

  <script>
    // API endpoint for fetching drone data
    const API_BASE_URL = "http://localhost:8000/api/delivery/drone-monitoring";
    const DRONE_UNIQUE_ID = "drone_3_1_conn_4ef01b03";

    // Set up chart context
    const ctx = document.getElementById("accelerationChart").getContext("2d");
    let chart;

    // Track current display mode
    let displayMode = "normalized"; // 'normalized' or 'raw'
    let activeAxis = "x"; // 'x', 'y', or 'z'
    let activeDataType = "vibration"; // We're using vibration data as requested

    // Monitoring items configuration
    const monitoringItems = [
      { id: 'x-axis', label: 'X-Axis', type: 'axis', checked: true, color: '#ff4d4d' },
      { id: 'y-axis', label: 'Y-Axis', type: 'axis', checked: true, color: '#ffaa00' },
      { id: 'z-axis', label: 'Z-Axis', type: 'axis', checked: true, color: '#00cc66' },
      { id: 'vibe-x', label: 'Vibe X', type: 'vibration', axis: 'x', checked: false, color: '#ff6b9d' },
      { id: 'vibe-y', label: 'Vibe Y', type: 'vibration', axis: 'y', checked: false, color: '#ff8fb3' },
      { id: 'vibe-z', label: 'Vibe Z', type: 'vibration', axis: 'z', checked: false, color: '#ffb3c9' },
      { id: 'gps', label: 'GPS', type: 'gps', checked: false, color: '#4dabf7' },
    ];

    // Add RC input channels (ch1in - ch18in)
    for (let i = 1; i <= 18; i++) {
      monitoringItems.push({
        id: `ch${i}in`,
        label: `ch${i}in`,
        type: 'rc_channel',
        channel: i,
        checked: false,
        color: `hsl(${(i * 20) % 360}, 70%, 60%)`
      });
    }

    // Add Servo output channels (ch1out - ch16out)
    for (let i = 1; i <= 16; i++) {
      monitoringItems.push({
        id: `ch${i}out`,
        label: `ch${i}out`,
        type: 'servo_output',
        servo: i,
        checked: false,
        color: `hsl(${(i * 25) % 360}, 70%, 60%)`
      });
    }

    // Store selected items - initialize with checked items
    let selectedItems = monitoringItems.filter(item => item.checked);
    let previousSelection = [];
    let selectionJustChanged = false;
    let autoRefreshInterval = null;

    // Initialize monitoring menu
    function initializeMonitoringMenu() {
      const menuContent = document.getElementById('monitoringMenuContent');
      menuContent.innerHTML = '';

      monitoringItems.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'monitoring-item';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `check_${item.id}`;
        checkbox.checked = item.checked;
        checkbox.addEventListener('change', () => {
          item.checked = checkbox.checked;
          const selectionChanged = updateSelectedItems();
          
          // Only fetch if we have selected items
          if (selectedItems.length > 0) {
            fetchDroneData();
          } else {
            // Clear chart if no items selected
            if (chart) {
              chart.data.datasets = [];
              chart.update('none');
            }
            // Clear meters
            document.getElementById('axisMeters').innerHTML = '';
          }
        });

        const label = document.createElement('label');
        label.htmlFor = `check_${item.id}`;
        label.textContent = item.label;

        itemDiv.appendChild(checkbox);
        itemDiv.appendChild(label);
        menuContent.appendChild(itemDiv);
      });
    }

    function updateSelectedItems() {
      // Store current selection before updating
      const currentSelection = selectedItems.map(item => item.id).sort().join(',');
      // Update selected items
      selectedItems = monitoringItems.filter(item => item.checked);
      // Check if changed
      const newSelection = selectedItems.map(item => item.id).sort().join(',');
      selectionJustChanged = currentSelection !== newSelection;
      // Update previous selection
      previousSelection = selectedItems.map(item => item.id);
      
      // Debug log
      console.log('Selected items:', selectedItems.map(i => i.id));
    }

    // Toggle monitoring menu
    document.getElementById('monitoringMenuButton').addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = document.getElementById('monitoringMenu');
      menu.classList.toggle('show');
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('monitoringMenu');
      const button = document.getElementById('monitoringMenuButton');
      if (!menu.contains(e.target) && !button.contains(e.target)) {
        menu.classList.remove('show');
      }
    });

    // Format numbers nicely
    function formatRawValue(value, dataType) {
      if (dataType === "vibration") {
        return value.toFixed(6);
      } else if (dataType === "rc_channel" || dataType === "servo_output") {
        return value.toFixed(0);
      } else {
        return value.toFixed(4);
      }
    }

    // Get color for dataset
    function getDatasetColor(itemId) {
      const item = monitoringItems.find(i => i.id === itemId);
      return item ? item.color : '#999';
    }

    // Update dynamic meters based on selected items
    function updateDynamicMeters(droneData) {
      const metersContainer = document.getElementById('axisMeters');
      metersContainer.innerHTML = '';
      
      // Display ALL selected items in meters (will be arranged in rows of 3)
      selectedItems.forEach((item, index) => {
        let value = 0;
        let rawValue = 0;
        let displayValue = 0;
        let label = item.label;
        let colorClass = '';
        
        // Get value based on item type
        if (item.type === 'axis') {
          const axisMap = { 'x-axis': 'x', 'y-axis': 'y', 'z-axis': 'z' };
          const axis = axisMap[item.id];
          const axesData = droneData.telemetry.axes || {};
          const axesRawData = droneData.telemetry.axes_raw || {};
          value = axesData[axis] || 0;
          rawValue = axesRawData[axis] || 0;
          displayValue = value;
          colorClass = item.id.replace('-axis', '-axis');
        } else if (item.type === 'vibration' && item.axis) {
          const vibData = droneData.telemetry.vibration || {};
          const vibRawData = droneData.telemetry.vibration_raw || {};
          // Get specific axis value
          const axis = item.axis; // 'x', 'y', or 'z'
          value = vibData[axis] || 0;
          rawValue = vibRawData[axis] || 0;
          displayValue = value;
          colorClass = 'vibe-axis';
        } else if (item.type === 'rc_channel' && droneData.telemetry.rc_channels) {
          const channelKey = `chan${item.channel}`;
          value = droneData.telemetry.rc_channels.channels?.[channelKey] || 0;
          rawValue = value;
          // Normalize RC channel value (typically 1000-2000) to 0-100 for display
          displayValue = Math.round(((value - 1000) / 1000) * 100);
          displayValue = Math.max(0, Math.min(100, displayValue)); // Clamp to 0-100
          label = `${item.label}`;
          colorClass = 'rc-axis';
        } else if (item.type === 'servo_output' && droneData.telemetry.servo_output) {
          const servoKey = `servo${item.servo}`;
          value = droneData.telemetry.servo_output.servos?.[servoKey] || 0;
          rawValue = value;
          // Normalize servo value (0-2000) to 0-100 for display
          displayValue = Math.round((value / 2000) * 100);
          label = `${item.label}`;
          colorClass = 'servo-axis';
        } else if (item.type === 'gps') {
          // GPS satellites count
          value = droneData.telemetry.gps_satellites || 0;
          rawValue = value;
          // Normalize GPS satellites count (typically 0-20) to 0-100 for display
          displayValue = Math.min(Math.round((value / 20) * 100), 100);
          label = `GPS`;
          colorClass = 'gps-axis';
        }
        
        // Create meter element
        const meterDiv = document.createElement('div');
        meterDiv.className = `axis-meter ${colorClass}`;
        let rawValueFormatted;
        if (item.type === 'gps') {
          rawValueFormatted = Math.round(rawValue).toString();
        } else if (item.type === 'rc_channel' || item.type === 'servo_output') {
          rawValueFormatted = formatRawValue(rawValue, item.type);
        } else {
          rawValueFormatted = formatRawValue(rawValue, item.type === 'vibration' ? 'vibration' : 'acceleration');
        }
        meterDiv.innerHTML = `
          <div class="meter-label">
            <span>${label.toUpperCase()}</span>
            <span class="raw-value">${rawValueFormatted}</span>
          </div>
          <div class="meter-bar">
            <div class="meter-bar-fill" style="width: ${displayValue}%; background-color: ${item.color}"></div>
          </div>
          <div class="meter-value">${item.type === 'rc_channel' || item.type === 'servo_output' || item.type === 'gps' ? value : displayValue}</div>
        `;
        
        metersContainer.appendChild(meterDiv);
      });
    }

    // Update UI with current data
    function updateUI(data) {
      // Extract drone data from API response
      const droneData = data.data.active_drone;

      // Update dynamic meters based on selected items
      updateDynamicMeters(droneData);

      // Update info cards with the data from API
      document.getElementById(
        "batteryValue"
      ).textContent = `${droneData.telemetry.battery_percent}%`;
      document.getElementById(
        "distanceValue"
      ).textContent = `${droneData.telemetry.distance_traveled}km`;
      document.getElementById(
        "windValue"
      ).textContent = `${droneData.telemetry.wind_speed}km/h`;
      document.getElementById(
        "tempValue"
      ).textContent = `${droneData.telemetry.temperature}°C`;

      // Update status indicators based on values
      // Battery status
      const batteryStatus = document.getElementById("batteryStatus");
      if (droneData.telemetry.battery_percent === 0) {
        batteryStatus.textContent = "no data";
        batteryStatus.className = "info-card-status normal";
      } else if (droneData.telemetry.battery_percent > 50) {
        batteryStatus.textContent = "normal";
        batteryStatus.className = "info-card-status normal";
      } else if (droneData.telemetry.battery_percent > 20) {
        batteryStatus.textContent = "caution";
        batteryStatus.className = "info-card-status caution";
      } else {
        batteryStatus.textContent = "critical";
        batteryStatus.className = "info-card-status caution";
      }

      // Temperature status
      const tempStatus = document.getElementById("tempStatus");
      if (droneData.telemetry.temperature === 0) {
        tempStatus.textContent = "no data";
        tempStatus.className = "info-card-status normal";
      } else if (droneData.telemetry.temperature < 40) {
        tempStatus.textContent = "normal";
        tempStatus.className = "info-card-status normal";
      } else {
        tempStatus.textContent = "caution";
        tempStatus.className = "info-card-status caution";
      }

      // Wind status
      const windStatus = document.getElementById("windStatus");
      if (droneData.telemetry.wind_speed === 0) {
        windStatus.textContent = "no data";
        windStatus.className = "info-card-status normal";
      } else if (droneData.telemetry.wind_speed < 10) {
        windStatus.textContent = "normal";
        windStatus.className = "info-card-status normal";
      } else {
        windStatus.textContent = "caution";
        windStatus.className = "info-card-status caution";
      }

      // Update status button
      const statusButton = document.getElementById("statusButton");
      if (droneData.status && droneData.status.arrived_at_base) {
        statusButton.textContent = "Arrived at base";
        statusButton.style.backgroundColor = "#0099ff";
      } else if (droneData.status && droneData.status.is_moving) {
        statusButton.textContent = "In transit";
        statusButton.style.backgroundColor = "#ffaa00";
      } else {
        statusButton.textContent = "Status unknown";
        statusButton.style.backgroundColor = "#999";
      }

      // Update chart
      updateChart(droneData);
      
      // Reset selectionJustChanged flag after chart is updated
      // This allows auto-refresh to work properly
      if (selectionJustChanged) {
        // Reset after chart update completes
        setTimeout(() => {
          selectionJustChanged = false;
          console.log('Selection change flag reset');
        }, 200);
      }
    }

    // Prepare chart data based on selected items and API response
    function prepareChartData(droneData) {
      const datasets = [];
      // Use vibration timestamps if available, otherwise use acceleration timestamps
      const timestamps = droneData.history.timestamps_vibration || 
                        droneData.history.timestamps || 
                        [];

      selectedItems.forEach(item => {
        let data = [];
        let label = item.label;

        if (item.type === 'axis') {
          const axisMap = { 'x-axis': 'x', 'y-axis': 'y', 'z-axis': 'z' };
          const axis = axisMap[item.id];
          if (droneData.history.acceleration && droneData.history.acceleration[axis]) {
            data = displayMode === 'normalized' 
              ? droneData.history.acceleration[axis] 
              : droneData.history.acceleration_raw[axis];
          }
        } else if (item.type === 'vibration' && item.axis) {
          // Use vibration data for specific axis
          if (droneData.history.vibration) {
            const axis = item.axis; // 'x', 'y', or 'z'
            data = droneData.history.vibration[axis] || [];
            label = `${item.label}`;
          }
        } else if (item.type === 'rc_channel' && droneData.telemetry.rc_channels) {
          const channelKey = `chan${item.channel}`;
          const channelValue = droneData.telemetry.rc_channels.channels?.[channelKey] || 0;
          // For RC channels, use the current value repeated for all timestamps
          data = timestamps.map(() => channelValue);
          label = `${item.label} (${channelValue})`;
        } else if (item.type === 'servo_output' && droneData.telemetry.servo_output) {
          const servoKey = `servo${item.servo}`;
          const servoValue = droneData.telemetry.servo_output.servos?.[servoKey] || 0;
          // For servo outputs, use the current value repeated for all timestamps
          data = timestamps.map(() => servoValue);
          label = `${item.label} (${servoValue})`;
        } else if (item.type === 'gps') {
          // GPS satellites count - use current value repeated for all timestamps
          const gpsSatellites = droneData.telemetry.gps_satellites || 0;
          data = timestamps.map(() => gpsSatellites);
          label = `GPS (${gpsSatellites} satellites)`;
        }

        if (data.length > 0 || (item.type === 'rc_channel' || item.type === 'servo_output' || item.type === 'gps')) {
          datasets.push({
            label: label,
            data: data.length > 0 ? data : timestamps.map(() => 0),
            borderColor: item.color,
            backgroundColor: item.color.replace(')', ', 0.1)').replace('rgb', 'rgba'),
            pointRadius: item.type === 'axis' ? 1 : 0,
            borderWidth: 2,
            tension: 0.2,
            // Show all selected items by default
            // User can click legend to show/hide any item
            hidden: false,  // Show all items by default
          });
        }
      });

      return { datasets, timestamps };
    }

    // Setup and update the chart
    function setupChart(data) {
      const chartData = prepareChartData(data);
      const timestamps = chartData.timestamps.map((timestamp, index) => {
        return index % 6 === 0 ? index : "";
      });

      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: timestamps,
          datasets: chartData.datasets,
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: "#333",
              },
              ticks: {
                color: "#999",
              },
            },
            x: {
              grid: {
                color: "#333",
              },
              ticks: {
                color: "#999",
                maxRotation: 0,
              },
            },
          },
          plugins: {
            legend: {
              display: true,
              position: "top",
              labels: {
                color: "#999",
                boxWidth: 12,
                padding: 10,
                usePointStyle: true,
              },
              onClick: function (e, legendItem, legend) {
                const index = legendItem.datasetIndex;
                const ci = legend.chart;
                const meta = ci.getDatasetMeta(index);
                meta.hidden = !meta.hidden;
                ci.update();
              },
            },
            tooltip: {
              mode: "index",
              intersect: false,
              callbacks: {
                label: function (context) {
                  let label = context.dataset.label || "";
                  if (label) {
                    label += ": ";
                  }
                  label += context.parsed.y;
                  return label;
                },
              },
            },
          },
          interaction: {
            mode: "nearest",
            axis: "x",
            intersect: false,
          },
          animations: {
            radius: {
              duration: 400,
              easing: "linear",
            },
          },
        },
      });
    }

    function updateChart(data) {
      const shouldRebuild = !chart || selectionJustChanged;
      
      if (shouldRebuild) {
        // Rebuild chart if it doesn't exist or selection changed
        if (chart) {
          chart.destroy();
          chart = null;
        }
        setupChart(data);
        // Reset flag after rebuild
        selectionJustChanged = false;
        return;
      }

      // Only update data values, don't rebuild chart
      const chartData = prepareChartData(data);
      
      // Update existing datasets and add new ones
      chartData.datasets.forEach((newDataset) => {
        // Find matching dataset by extracting item id from label (for RC channels/servo outputs)
        // or by exact label match
        let existingIndex = -1;
        
        // Try to find by exact label match first
        existingIndex = chart.data.datasets.findIndex(ds => ds.label === newDataset.label);
        
        // If not found, try to match by item id (for items with dynamic labels like RC channels)
        if (existingIndex === -1) {
          // Extract base label (remove value in parentheses for RC channels/servo outputs)
          const baseLabel = newDataset.label.split(' (')[0];
          existingIndex = chart.data.datasets.findIndex(ds => {
            const dsBaseLabel = ds.label.split(' (')[0];
            return dsBaseLabel === baseLabel;
          });
        }
        
        if (existingIndex !== -1) {
          // Update existing dataset data only
          chart.data.datasets[existingIndex].data = newDataset.data;
          // Update label if value changed (for RC channels/servo outputs showing current value)
          if (newDataset.label !== chart.data.datasets[existingIndex].label) {
            chart.data.datasets[existingIndex].label = newDataset.label;
          }
          // Update color if needed
          chart.data.datasets[existingIndex].borderColor = newDataset.borderColor;
          chart.data.datasets[existingIndex].backgroundColor = newDataset.backgroundColor;
        } else {
          // Add new dataset if it doesn't exist
          chart.data.datasets.push(newDataset);
        }
      });
      
      // Remove datasets that are no longer selected
      const selectedLabels = chartData.datasets.map(ds => {
        const baseLabel = ds.label.split(' (')[0];
        return baseLabel;
      });
      chart.data.datasets = chart.data.datasets.filter(ds => {
        const dsBaseLabel = ds.label.split(' (')[0];
        return selectedLabels.includes(dsBaseLabel);
      });
      
      // Update y axis settings based on display mode and data types
      const hasRCChannels = selectedItems.some(item => item.type === 'rc_channel');
      const hasServoOutputs = selectedItems.some(item => item.type === 'servo_output');
      
      if (displayMode === "raw") {
        chart.options.scales.y.max = 0.01; // For vibration raw values
      } else if (hasRCChannels || hasServoOutputs) {
        // RC channels and servo outputs use different scale (typically 0-2000)
        chart.options.scales.y.max = 2000;
      } else {
        chart.options.scales.y.max = 100;
      }
      
      // Use appropriate timestamps
      const timestamps = chartData.timestamps.length > 0 
        ? chartData.timestamps 
        : Array.from({ length: 48 }, (_, i) => i); // Fallback timestamps
      
      chart.data.labels = timestamps.map((timestamp, index) => {
        return index % 6 === 0 ? index : "";
      });

      // Update without animation to avoid refresh effect
      chart.update('none');
    }

    // Function to toggle between normalized and raw data display
    function toggleDisplayMode(mode) {
      displayMode = mode;

      // Update UI to reflect current mode
      document
        .getElementById("toggleNormalized")
        .classList.toggle("active", mode === "normalized");
      document
        .getElementById("toggleRaw")
        .classList.toggle("active", mode === "raw");

      // Fetch latest data to update chart
      fetchDroneData();
    }

    // Function to fetch data from API with POST request
    function fetchDroneData() {
      // Update selectedItems from monitoringItems to ensure it's current
      selectedItems = monitoringItems.filter(item => item.checked);
      
      // Get selected items list
      const selectedItemsList = selectedItems.map(item => item.id);
      
      // Don't call API if no items selected
      if (selectedItemsList.length === 0) {
        console.warn('fetchDroneData: No items selected, skipping API call');
        return;
      }
      
      // Prepare request payload
      const payload = {
        unique_id: DRONE_UNIQUE_ID,
        monitoring_items: selectedItemsList,
        time_window_minutes: 15
      };
      
      console.log('fetchDroneData: Fetching data with payload:', payload);
      console.log('fetchDroneData: API URL:', `${API_BASE_URL}/drone-status`);
      
      // Send POST request
      fetch(`${API_BASE_URL}/drone-status`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(payload)
      })
        .then((response) => {
          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
          return response.json();
        })
        .then((data) => {
          if (data.success) {
            console.log('fetchDroneData: Data received successfully');
            updateUI(data);
          } else {
            console.error("fetchDroneData: API returned error:", data.message);
          }
        })
        .catch((error) => {
          console.error("fetchDroneData: Error fetching drone data:", error);
        });
    }

    // Initialize UI and set up event listeners
    function initialize() {
      // Initialize monitoring menu
      initializeMonitoringMenu();

      // Set up toggle buttons
      document
        .getElementById("toggleNormalized")
        .addEventListener("click", () => toggleDisplayMode("normalized"));
      document
        .getElementById("toggleRaw")
        .addEventListener("click", () => toggleDisplayMode("raw"));

      // Note: Axis toggle removed - meters are now dynamic based on selected items
      // Users can click on legend to show/hide chart lines instead

      // Ensure selectedItems is properly initialized
      selectedItems = monitoringItems.filter(item => item.checked);
      console.log('Initial selected items:', selectedItems.map(i => i.id));
      
      // Initialize previous selection
      previousSelection = [...selectedItems.map(item => item.id)];
      
      // Initial data fetch - only if we have selected items
      if (selectedItems.length > 0) {
        console.log('Initial fetch with items:', selectedItems.map(i => i.id));
        fetchDroneData();
      } else {
        console.warn('No items selected on page load');
      }

      // Set up interval for refreshing data (auto-refresh every 5 seconds)
      // Clear any existing interval first
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
      }
      
      console.log('Setting up auto-refresh interval (5 seconds)');
      
      // Test interval immediately to verify it works
      let intervalCounter = 0;
      
      // First, test if setInterval works at all
      console.log('Testing setInterval...');
      const testInterval = setInterval(() => {
        console.log('TEST: setInterval is working!');
        clearInterval(testInterval);
      }, 1000);
      
      // Set up the actual auto-refresh interval
      autoRefreshInterval = setInterval(() => {
        intervalCounter++;
        const timestamp = new Date().toLocaleTimeString();
        console.log(`[AUTO-REFRESH #${intervalCounter}] Interval triggered at ${timestamp}`);
        
        // Always check current selected items
        const currentSelected = monitoringItems.filter(item => item.checked);
        console.log(`[AUTO-REFRESH #${intervalCounter}] Selected items:`, currentSelected.map(i => i.id));
        
        // Only auto-refresh if we have selected items
        if (currentSelected.length > 0) {
          console.log(`[AUTO-REFRESH #${intervalCounter}] Calling fetchDroneData()...`);
          try {
            fetchDroneData();
          } catch (error) {
            console.error(`[AUTO-REFRESH #${intervalCounter}] Error in fetchDroneData:`, error);
          }
        } else {
          console.log(`[AUTO-REFRESH #${intervalCounter}] No items selected, skipping API call`);
        }
      }, 5000); // Refresh every 5 seconds
      
      console.log('Auto-refresh interval set up successfully. Interval ID:', autoRefreshInterval);
      console.log('Interval type:', typeof autoRefreshInterval);
      console.log('Next auto-refresh will occur in 5 seconds...');
      
      // Verify interval is actually set
      if (autoRefreshInterval) {
        console.log('✅ Auto-refresh interval is set and will run every 5 seconds');
      } else {
        console.error('❌ Failed to set auto-refresh interval!');
      }
    }

    // Initialize everything when page loads
    window.addEventListener("load", initialize);
  </script>
