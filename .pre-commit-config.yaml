# GuardianX pre-commit — 시크릿 차단선 (W0-1a / D-001)
#
# D-001: 원격 CI 가 아직 없으므로 **로컬 훅이 실효 차단선**이다.
#        CI 파일(.github/workflows/secret-scan.yml, .gitlab-ci.yml)은 선제 배치해 두고,
#        원격 저장소가 생기면(W0-6) 이중 안전망으로 작동한다.
#
# 설치:
#   pip install pre-commit
#   pre-commit install
#
# 전체 검사(최초 1회 권장):
#   pre-commit run --all-files

# docs/demo/ 는 W0-4 로 배포 경로에서 걷어낸 보관용 데모 파일이다.
# 원본 그대로 두는 것이 자료로서의 값이므로 포매팅 훅을 적용하지 않는다.
exclude: '^(frontend/node_modules/|backend/venv/|docs/demo/|.*\.(ttf|woff2?|png|jpe?g|gif|ico|pdf|mp4)$)'

repos:
  # ── 시크릿 스캔 ─────────────────────────────────────────────────────────
  # ⚠ docs/agent/* 를 제외하지 않는다 (RESUME_NEXT §7-1).
  #   정본 tickets.yaml 의 verify 정규식과 blocker 인용문에 실값이 들어갈 뻔했다.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (시크릿 스캔 — docs/agent 포함)
        args: ["protect", "--staged", "--redact", "--config", ".gitleaks.toml"]

  # ── D-003: 서버 키 ≠ 클라이언트 키 ──────────────────────────────────────
  - repo: local
    hooks:
      - id: gx-key-divergence
        name: GCS 서버/클라이언트 키 분리 검사 (D-003)
        entry: python scripts/check_key_divergence.py
        language: system
        pass_filenames: false
        files: '(^|/)\.env'

  # ── W0-4: 데모·목업 화면이 프로덕션 빌드로 새지 않는지 ────────────────────
  - repo: local
    hooks:
      - id: gx-demo-isolation
        name: 데모·목업 격리 검사 (W0-4)
        entry: python scripts/check_demo_isolation.py
        language: system
        pass_filenames: false
        files: '^(frontend/(src/|vite\.config\.ts|public/)|.*drone-monitoring\.html$)'

  # ── W0-17: 외부 호출에 타임아웃이 빠지지 않는지 ──────────────────────────
  # 타임아웃 없는 호출 하나가 늦으면 워커가 잡히고, 잡힌 워커가 쌓이면 서비스가 선다.
  # 실측 17건을 0 으로 만든 뒤 이 훅이 그 상태를 지킨다 (evidence/W0-17/timeout_inventory.md).
  # 2026-08-27 확대(C-3.3): requests 만 보던 것을 외부 의존 전 계열로 넓혔다.
  # MinIO 는 호출이 아니라 생성자에서 타임아웃을 정한다 — 그 자리를 본다.
  - repo: local
    hooks:
      - id: gx-request-timeout
        name: 외부 호출 타임아웃 검사 (W0-17 · C-3.3)
        entry: python scripts/verify_timeout.py
        language: system
        pass_filenames: false
        files: '^backend/.*\.py$'

  # ── D-270 ③: 데이터를 쓰는 스크립트가 분류 등록부를 참조하는지 ───────────
  # 2026-08-27 사고: 백필 적용본이 등록부를 참조하지 않아 공용 마스터
  # advanced_table.GridSetting(479행) · menu.Tab 을 채우려 했다. D-261(c) 가 금지한
  # 바로 그 일이다. 판정문은 있었고 **게이트가 없었다** — 막은 것은 시뮬레이션이었다.
  # 기존 빚 113건은 KNOWN_DEBT 래칫으로 잠갔다. 새 빚은 오늘부터 막힌다.
  - repo: local
    hooks:
      - id: gx-classification
        name: 분류 등록부 참조 검사 (D-270 ③)
        entry: python scripts/verify_classification.py
        language: system
        pass_filenames: false
        files: '^(scripts/.*\.py|backend/[^/]+/management/commands/.*\.py|backend/tests/tenant_classification\.py)$'

  # ── C-3.1: 커널 공개 함수가 테넌트 스코프를 통과하는지 ────────────────────
  # 오늘은 아무것도 막지 않는다 — backend/kernels/ 가 아직 없다(커널은 EXIT 후 K1 부터).
  # 그래도 지금 세운다: 나중에 오는 게이트는 이미 쌓인 빚을 만나고 래칫으로 잠글 수밖에 없다
  # (verify_classification 이 빚 113건을 안고 출발한 것이 그 모양이다).
  # 커널은 아직 한 줄도 없으므로 **여기서만은 빚 0 으로 시작할 수 있다.**
  - repo: local
    hooks:
      - id: gx-tenant-scope
        name: 커널 테넌트 스코프 + 신규 경로 트립와이어 (C-3.1 · D-275 §5-1)
        entry: python scripts/verify_tenant_scope.py
        language: system
        pass_filenames: false
        # ★ 트립와이어가 붙으면서 대상이 **backend 전 파이썬**으로 넓어졌다 (D-275 §5-1).
        #   새 라우트는 어느 views.py 에서든 생긴다 — 좁은 필터는 곧 감긴 눈이다.
        #   4초 걸린다. 커밋마다 4초로 "문지기 없는 새 경로"를 사는 것이 값싸다.
        files: '^(backend/.*\.py|scripts/verify_tenant_scope\.py)$'

  # ── D-278: App(L4) 이 커널(L3) 내부를 직접 import 하지 않는지 ─────────────
  # 재사용 편의가 아니라 **IP 방어**다 — 커널 로직이 App 으로 새면
  # "본체=가이온 / 신규 연계=공동"(계약 8조3항)의 경계가 코드에서 소멸한다 (DA-04 §1-1).
  # apps·kernels 가 아직 없다. 그래서 **지금** 세운다 — 여기서만은 빚 0 으로 시작한다.
  - repo: local
    hooks:
      - id: gx-layers
        name: 계층 위반 검사 — App→커널 직접 import 금지 (D-278)
        entry: python scripts/verify_layers.py
        language: system
        pass_filenames: false
        files: '^(backend/(apps|kernels)/.*\.py|scripts/verify_layers\.py)$'

  # ── D-295: DEPRECATED 기저 클래스를 새 코드가 상속하지 않는지 ─────────────
  # BaseModelWithGroup 은 실행 중인 dj-core 에서 DEPRECATED 이고, 이 저장소 8개 앱이
  # 그것을 상속 중이다. dj-core 는 §0.4 금지구역이라 8개 동시 수정은 이득 대비 위험이 크다.
  # 그래서 **제거하지 않기로** 판정했다(D-295). 그러면 남는 일은 하나다 —
  # 새 상속이 늘지 않게 막는 것. 기존 16건은 **이름으로** 허용목록에 등재돼 있고
  # (개수가 아니라 이름 — D-285 ②), 목록 밖 새 상속은 exit 1 이다.
  - repo: local
    hooks:
      - id: gx-model-inheritance
        name: DEPRECATED 기저 클래스 상속 검사 (D-295)
        entry: python scripts/verify_model_inheritance.py
        language: system
        pass_filenames: false
        files: '^(backend/.*\.py|scripts/verify_model_inheritance\.py)$'

  # ── D-301: 게이트가 자기가 무엇을 몇 건 보았는지 말하는가 ─────────────────
  # 「검사 못함 ≠ 0건 검사」. 게이트가 입력이 비었거나 파이프가 끊긴 채로 exit 0 을 내면
  # **아무것도 못 보면서 초록**이고, 그것은 게이트가 없는 것보다 나쁘다 — 있다는 착시를 준다.
  # 그래서 모든 게이트는 건수를 출력하고, 0건일 때는 사유를 함께 낸다.
  # 건수 출력이 없는 게이트는 게이트로 인정하지 않는다.
  - repo: local
    hooks:
      - id: gx-gate-counts
        name: 게이트 입력 건수 출력 검사 (D-301)
        entry: python scripts/verify_gate_counts.py
        language: system
        pass_filenames: false
        files: '^(docs/agent/verify_gates\.sh|scripts/verify_gate_counts\.py)$'

  # ── D-299: 폴리곤 잠금이 값싼 선언이 아닌지 ───────────────────────────────
  # 내리면 사유를 요구하고, 올리면 F-03 계약 AC 시험과 구현을 요구한다.
  # 어느 방향으로도 조용할 수 없게 하는 것이 이 훅의 전부다.
  - repo: local
    hooks:
      - id: gx-zone-polygon
        name: F-03 폴리곤 잠금 검사 (D-299)
        entry: python scripts/verify_zone_polygon.py
        language: system
        pass_filenames: false
        files: '^(backend/stream_monitors/(models\.py|services/zones\.py)|backend/tests/test_zone_judgment\.py|scripts/verify_zone_polygon\.py)$'

  # ── D-306: 구간 추출 잠금이 값싼 선언이 아닌지 ───────────────────────────
  # 계약 11조(원본 영상 무반출)가 걸리는 자리다. 상수를 내리면 사유를 요구하고,
  # 올리면 F-09 추출 무결성 시험과 구현을 요구한다.
  - repo: local
    hooks:
      - id: gx-clip-extraction
        name: F-09 구간 추출 잠금 검사 (D-306)
        entry: python scripts/verify_clip_extraction.py
        language: system
        pass_filenames: false
        files: '^(backend/stream_monitors/(models\.py|services/clips\.py)|backend/apps/dsm/api\.py|backend/tests/test_clip_playback\.py|scripts/verify_clip_extraction\.py)$'

  # ── D-304: 쓰기 0곳 필드(착시 ⑥)가 새로 태어나지 않는지 ──────────────────
  # 필드가 있으면 기능이 있다고 읽는다. 오늘의 빚은 이름으로 잠갔고, 새 빚만 막는다.
  - repo: local
    hooks:
      - id: gx-dead-fields
        name: 죽은 필드 검사 — 착시 ⑥ (D-304)
        entry: python scripts/verify_dead_fields.py
        language: system
        pass_filenames: false
        files: '^(backend/.*\.py|docs/agent/evidence/D-304/dead_fields_baseline\.txt|scripts/verify_dead_fields\.py)$'

  # ── D-307 / D-309: 잠금 대장 · 계약 AC 대장 ──────────────────────────────
  # 잠김을 "막혔다" 한 단어로 두면 하루짜리(ADMIN)가 계약 리스크(CONTRACT) 뒤에 숨는다.
  # 그리고 증명 시험이 없는 칸을 '구현' 으로 적으면 검수에서 처음 알게 된다.
  - repo: local
    hooks:
      - id: gx-blockers
        name: 잠금 대장 유형·주인 검사 (D-307)
        entry: python scripts/verify_blockers.py
        language: system
        pass_filenames: false
        files: '^(docs/agent/evidence/DA-05/blockers\.yaml|scripts/verify_blockers\.py)$'
      - id: gx-contract-ac
        name: 계약 AC 전수 대장 검사 (D-309)
        entry: python scripts/verify_contract_ac.py
        language: system
        pass_filenames: false
        files: '^(docs/agent/evidence/D-309/contract_ac_ledger\.yaml|backend/tests/.*\.py|scripts/verify_contract_ac\.py)$'

  # ── D-310 / D-316 / D-318: 도구 자기표본 · 외부 자원 근거 · juso 방향 ────────
  # 도구는 자기가 태어난 표본을 시험에 넣는다. 외부 자원은 계정에서 본 것만 등재한다.
  # 방향도 모르는 자원 위에 어댑터를 얹지 않는다.
  - repo: local
    hooks:
      - id: gx-tool-selftest
        name: 도구 자기표본 검사 (D-310)
        entry: python scripts/verify_tool_selftest.py
        language: system
        pass_filenames: false
        files: '^(scripts/(verify|check)_.*\.py|docs/agent/verify_gates\.sh|docs/agent/evidence/D-310/selftest_baseline\.txt)$'
      - id: gx-external-sources
        name: 외부 자원 근거 표기 검사 (D-316)
        entry: python scripts/verify_external_sources.py
        language: system
        pass_filenames: false
        files: '^(backend/\.env\.example|backend/adapters/.*\.py|scripts/verify_external_sources\.py)$'
      - id: gx-juso-direction
        name: juso 방향 3값 잠금 검사 (D-318)
        entry: python scripts/verify_juso_direction.py
        language: system
        pass_filenames: false
        files: '^(backend/adapters/juso/.*\.py|backend/tests/test_fx5_address\.py|scripts/verify_juso_direction\.py)$'

  # ── D-334: 주석 처리된 권한 데코레이터 ──────────────────────────────────
  # 권한 검사는 **없는 것보다 주석 처리된 것이 더 위험하다.** 읽는 사람에게는
  # 붙어 있는 것처럼 보이기 때문이다. 두 규칙이고 성격이 다르다:
  #   ① 주석 권한 + `auth=` 없음 = **열린 문.** 래칫 대상이 아니다 — 오늘 빨개진다
  #   ② 주석 권한이 기준선에 없던 자리에 새로 생김 = 래칫(D-311)
  # ★ `files:` 를 뷰 전체로 넓게 잡는다. 열린 문은 새 파일에서도 태어난다 —
  #   좁게 잡으면 게이트가 자기가 막아야 할 자리를 안 본다.
  - repo: local
    hooks:
      - id: gx-commented-guards
        name: 주석 처리된 권한 데코레이터 검사 (D-334)
        entry: python scripts/verify_commented_guards.py
        language: system
        pass_filenames: false
        files: '^(backend/.*\.py|scripts/(verify|probe)_commented_guards\.py|docs/agent/evidence/D-334/commented_guards_baseline\.txt)$'

  # ── D-337: 「같은 이름, 다른 것」 ────────────────────────────────────────
  # 이름의 유사성으로 오판한 것이 네 번이다. 등재된 이름을 수식어 없이 쓰면 막는다.
  # 식별자에만 건다 — 산문에 걸면 그 낱말을 정확히 쓰는 문장까지 죽는다(D-324 의 한국어판).
  - repo: local
    hooks:
      - id: gx-homonyms
        name: 동음이의 단독 사용 검사 (D-337)
        entry: python scripts/verify_homonyms.py
        language: system
        pass_filenames: false
        files: '^(backend/.*\.py|scripts/.*\.py|docs/agent/evidence/D-337/.*)$'

  # ── D-341: 착시 ⑦ 캐시 ─────────────────────────────────────────────────
  # 고친 뒤에도 2자리가 200 이었고 cache.clear() 뒤 0 이 됐다. 캐시가 없었다면
  # 그 2자리는 「고쳤다」로 보고됐을 것이다. 스택을 때리는 시험은 캐시 처리를 적는다.
  - repo: local
    hooks:
      - id: gx-cache-bypass
        name: 캐시 우회 표기 검사 (D-341)
        entry: python scripts/verify_cache_bypass.py
        language: system
        pass_filenames: false
        files: '^(backend/tests/.*\.py|docs/agent/evidence/D-341/.*)$'

  # ── D-413 (P-19): 상태·가용성 응답은 캐시를 지나지 않는다 ──────────────
  # 09-19 에 사람의 눈이 한 번 지킨 규칙이다(D-412 · media-data). 사람의 눈은 다음
  # 라우트에서 다시 필요하고, 그때 거기 없다. 그래서 도구로 옮긴다.
  # ★ 이어 붙은 리터럴도 함께 본다 — 쉼표 하나가 패턴 하나를 삼킨 자리가 실제로 있었다.
  - repo: local
    hooks:
      - id: gx-cache-frame
        name: 상태·가용성 캐시 우회 검사 (D-413 · P-19)
        entry: python scripts/verify_cache_frame.py
        language: system
        pass_filenames: false
        files: '^(backend/common/(universal_optimization|cache_hint_registry)\.py|scripts/verify_cache_frame\.py)$'

  # ── D-343: 라우트 인벤토리·3갈래 대장 ──────────────────────────────────
  # 새 라우트가 대장에 없이 태어나면 분류되지 않은 표면이 된다.
  # 전역 적용(③)은 판정 대기지만, 표면이 넓어지는 것은 지금부터 막는다(④ 래칫).
  - repo: local
    hooks:
      - id: gx-route-inventory
        name: 라우트 3갈래 대장 검사 (D-343)
        entry: python scripts/verify_route_inventory.py
        language: system
        pass_filenames: false
        files: '^(backend/.*\.py|docs/agent/evidence/D-343/.*)$'

  # ── D-344: 측정 재현성 ─────────────────────────────────────────────────
  # 같은 커밋에서 두 번 돌려 다른 수가 나오면, 그건 세는 도구가 아니라 추정하는 도구다.
  - repo: local
    hooks:
      - id: gx-measure-repro
        name: 측정 재현성 검사 (D-344)
        entry: python scripts/verify_measure_repro.py
        language: system
        pass_filenames: false
        files: '^scripts/(probe|verify)_.*\.py$'

  # ── D-346: 상용 오픈 기준 ──────────────────────────────────────────────
  # 계약 39절을 다 채워도 상용은 절반이다. 증명 없는 칸은 '구현' 으로 적을 수 없다.
  - repo: local
    hooks:
      - id: gx-ga-readiness
        name: 상용 오픈 기준 8영역 검사 (D-346)
        entry: python scripts/verify_ga_readiness.py
        language: system
        pass_filenames: false
        files: '^docs/agent/evidence/(D-346|D-309|DA-05)/.*$'

  # ── D-347: 피드백 콘솔 화면 ────────────────────────────────────────────
  # 고객이 보는 자리다. 실제가 아닌 화면이 한 장이라도 들어가면 거짓말이다.
  # 0장은 실패가 아니다 — **사유 없는 0장이 실패다.**
  - repo: local
    hooks:
      - id: gx-screens
        name: 화면 캡처 증거 검사 (D-347)
        entry: python scripts/verify_screens.py
        language: system
        pass_filenames: false
        files: '^docs/agent/evidence/D-347/.*$'

  # ── D-349: 착시 ⑧ 봉투 ────────────────────────────────────────────────
  # 겉의 200 이 안의 403 을 덮는다. 계약 상대가 읽는 면(F-05)은 래칫이 없다 —
  # 거기서 200 봉투에 담긴 실패는 에스비 App 이 성공으로 읽는다.
  - repo: local
    hooks:
      - id: gx-envelope
        name: 봉투 불일치 검사 (D-349)
        entry: python scripts/verify_envelope.py
        language: system
        pass_filenames: false
        files: '^(backend/.*\.py|docs/agent/evidence/(D-343|D-349)/.*)$'

  # ── 기본 위생 ───────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=4096"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: trailing-whitespace
        exclude: '\.md$'
