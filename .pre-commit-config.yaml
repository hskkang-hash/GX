# GuardianX pre-commit — 시크릿 차단선 (W0-1a / D-001)
#
# D-001: 원격 CI 가 아직 없으므로 **로컬 훅이 실효 차단선**이다.
#        CI 파일(.github/workflows/secret-scan.yml, .gitlab-ci.yml)은 선제 배치해 두고,
#        원격 저장소가 생기면(W0-6) 이중 안전망으로 작동한다.
#
# 설치:
#   pip install pre-commit
#   pre-commit install
#
# 전체 검사(최초 1회 권장):
#   pre-commit run --all-files

# docs/demo/ 는 W0-4 로 배포 경로에서 걷어낸 보관용 데모 파일이다.
# 원본 그대로 두는 것이 자료로서의 값이므로 포매팅 훅을 적용하지 않는다.
exclude: '^(frontend/node_modules/|backend/venv/|docs/demo/|.*\.(ttf|woff2?|png|jpe?g|gif|ico|pdf|mp4)$)'

repos:
  # ── 시크릿 스캔 ─────────────────────────────────────────────────────────
  # ⚠ docs/agent/* 를 제외하지 않는다 (RESUME_NEXT §7-1).
  #   정본 tickets.yaml 의 verify 정규식과 blocker 인용문에 실값이 들어갈 뻔했다.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (시크릿 스캔 — docs/agent 포함)
        args: ["protect", "--staged", "--redact", "--config", ".gitleaks.toml"]

  # ── D-003: 서버 키 ≠ 클라이언트 키 ──────────────────────────────────────
  - repo: local
    hooks:
      - id: gx-key-divergence
        name: GCS 서버/클라이언트 키 분리 검사 (D-003)
        entry: python scripts/check_key_divergence.py
        language: system
        pass_filenames: false
        files: '(^|/)\.env'

  # ── W0-4: 데모·목업 화면이 프로덕션 빌드로 새지 않는지 ────────────────────
  - repo: local
    hooks:
      - id: gx-demo-isolation
        name: 데모·목업 격리 검사 (W0-4)
        entry: python scripts/check_demo_isolation.py
        language: system
        pass_filenames: false
        files: '^(frontend/(src/|vite\.config\.ts|public/)|.*drone-monitoring\.html$)'

  # ── W0-17: 외부 호출에 타임아웃이 빠지지 않는지 ──────────────────────────
  # 타임아웃 없는 호출 하나가 늦으면 워커가 잡히고, 잡힌 워커가 쌓이면 서비스가 선다.
  # 실측 17건을 0 으로 만든 뒤 이 훅이 그 상태를 지킨다 (evidence/W0-17/timeout_inventory.md).
  - repo: local
    hooks:
      - id: gx-request-timeout
        name: 외부 호출 타임아웃 검사 (W0-17)
        entry: python scripts/scan_request_timeouts.py backend --check
        language: system
        pass_filenames: false
        files: '^backend/.*\.py$'

  # ── D-270 ③: 데이터를 쓰는 스크립트가 분류 등록부를 참조하는지 ───────────
  # 2026-08-27 사고: 백필 적용본이 등록부를 참조하지 않아 공용 마스터
  # advanced_table.GridSetting(479행) · menu.Tab 을 채우려 했다. D-261(c) 가 금지한
  # 바로 그 일이다. 판정문은 있었고 **게이트가 없었다** — 막은 것은 시뮬레이션이었다.
  # 기존 빚 113건은 KNOWN_DEBT 래칫으로 잠갔다. 새 빚은 오늘부터 막힌다.
  - repo: local
    hooks:
      - id: gx-classification
        name: 분류 등록부 참조 검사 (D-270 ③)
        entry: python scripts/verify_classification.py
        language: system
        pass_filenames: false
        files: '^(scripts/.*\.py|backend/[^/]+/management/commands/.*\.py|backend/tests/tenant_classification\.py)$'

  # ── 기본 위생 ───────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=4096"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: trailing-whitespace
        exclude: '\.md$'
