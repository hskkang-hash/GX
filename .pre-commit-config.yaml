# GuardianX pre-commit — 시크릿 차단선 (W0-1a / D-001)
#
# D-001: 원격 CI 가 아직 없으므로 **로컬 훅이 실효 차단선**이다.
#        CI 파일(.github/workflows/secret-scan.yml, .gitlab-ci.yml)은 선제 배치해 두고,
#        원격 저장소가 생기면(W0-6) 이중 안전망으로 작동한다.
#
# 설치:
#   pip install pre-commit
#   pre-commit install
#
# 전체 검사(최초 1회 권장):
#   pre-commit run --all-files

exclude: '^(frontend/node_modules/|backend/venv/|.*\.(ttf|woff2?|png|jpe?g|gif|ico|pdf|mp4)$)'

repos:
  # ── 시크릿 스캔 ─────────────────────────────────────────────────────────
  # ⚠ docs/agent/* 를 제외하지 않는다 (RESUME_NEXT §7-1).
  #   정본 tickets.yaml 의 verify 정규식과 blocker 인용문에 실값이 들어갈 뻔했다.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (시크릿 스캔 — docs/agent 포함)
        args: ["protect", "--staged", "--redact", "--config", ".gitleaks.toml"]

  # ── D-003: 서버 키 ≠ 클라이언트 키 ──────────────────────────────────────
  - repo: local
    hooks:
      - id: gx-key-divergence
        name: GCS 서버/클라이언트 키 분리 검사 (D-003)
        entry: python scripts/check_key_divergence.py
        language: system
        pass_filenames: false
        files: '(^|/)\.env'

  # ── 기본 위생 ───────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=4096"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: trailing-whitespace
        exclude: '\.md$'
