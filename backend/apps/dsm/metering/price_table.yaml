# ═══════════════════════════════════════════════════════════════════════════
# GX-PRICE 가격표 — **값은 비어 있다** (WO-GX-20260921-04 §4-5 · P-223)
# ═══════════════════════════════════════════════════════════════════════════
#
# 왜 빈 파일이 서 있나
# --------------------
# 세종 권고안(§4-5)은 **09-28 대표 확인 전까지 정본이 아니다.** 그런데 「대표 결정
# 뒤」로 코드를 미루면 청구서 초안을 만들 자리 자체가 안 생긴다(P-223).
# 그래서 **자리는 세우고 값은 비운다** — 값이 비면 청구서 초안의 그 줄이
# **「단가 미확정」 회색**으로 나온다. *지어내지 않되 개발을 막지 않는다.*
#
#   ⚠ **여기에 권고안 숫자를 미리 적지 마라.** 적히는 순간 그것은 회색이 아니라
#     초록이 되고, 누군가 그 수로 청구서를 낸다. 확인 안 된 수로 낸 청구서는
#     되돌릴 수 없다 — 칸을 더하는 것은 되돌릴 수 있어도 **청구서를 다시 내는
#     것은 못 되돌린다.**
#
#   ※ 권고안(확인 전 · 이 파일에 안 적는다)은 문서에 있다:
#     `docs/workorders/WO-GX-20260921-04_*.md` §4-5.
#
# 읽는 자리
# ---------
# `apps/dsm/metering.py::load_price_table`. **평평한 한 겹만** 읽는다(키: 값).
# 중첩·목록·앵커를 쓰지 마라 — 이 환경에는 PyYAML 이 없고(실측 2026-09-21),
# 청구서 한 장 때문에 의존성을 늘리지 않았다.
#
#   빈 값(`null` · 빈 칸)  = **아직 안 정했다** → 회색 「단가 미확정」
#   0                      = **0원이라고 정했다** → 초록. 둘은 다른 사실이다.
#
# ═══════════════════════════════════════════════════════════════════════════

# 통화. 값이 아니라 단위다.
currency: KRW

# 대표 확인 날짜. 이 칸이 비어 있는 동안 **아래 수는 전부 회색**이다.
confirmed_on:

# ── 확인 대기 넷 (§4-5 · CR1 = 0 · 09-28) ──────────────────────────────────
# 센터 기본료 (연 · 원)
center_base_year:
# 카메라 (대/월 · 원)
camera_month:
# 좌석 (월 · 원)
seat_month:
# 골든타임 보증 옵션 (기본료에 곱하는 비율 · 예 0.2 = +20%)
golden_time_option_rate:

# 카메라 100대 계단 할인율 (예 0.1 = -10%)
camera_tier_100_discount:

# ── 확정된 한 줄 (P-224 ⑤ · 대표 확인을 기다리지 않는다) ───────────────────
# **훈련은 0원이다.** 이 줄만은 비어 있지 않다 — 훈련 건수를 못 세어도 금액은
# 확정이다(0 × 무엇이든 0). 그래서 청구서 초안의 훈련 줄은 회색이 아니다.
drill_month: 0
