; QA-11 — pytest 의 **rootdir 을 못 박는다** (차선 Q · 2026-09-26)
;
; 왜 이 파일이 생겼나 [실측 2026-09-26]
; ------------------------------------
; 시험 DB 이름을 실행에서 정하는 `conftest.py` 를 `backend/` 에 두었는데 **안 불렸다.**
; ini 파일이 하나도 없으면 pytest 의 rootdir 은 **인자들의 공통 조상**이 된다:
;
;     pytest tests/e2e   →  rootdir = /app/tests/e2e   →  /app/conftest.py 는 그 **위**라 안 읽힌다
;
; 그래서 E2E 실행이 여전히 단위와 같은 이름의 DB 를 만들려 했고, 동시에 돌리자
; `DuplicateDatabase` 12건으로 죽었다. **고친 줄은 코드가 아니라 이 파일의 존재였다.**
;
; ★ 게이트가 아니라 **바닥**이다. 여기 규칙을 늘리지 않는다 — 늘리면 시험이 어디서
;   무엇을 물려받는지 사람이 못 따라간다.
[pytest]
; 인자를 안 줘도 여기를 본다. 그리고 이 줄이 rootdir 을 `backend/` 로 못 박는다.
testpaths = tests

; ★ [실측] 컨테이너 환경에 `DJANGO_SETTINGS_MODULE` 이 실려 있지 않다(`backend/.env` 가 없다).
;   없으면 전 시험이 `ImproperlyConfigured` 로 **ERROR** 나는데, 그것은 실패가 아니라
;   **환경 미비**다 — 그런데 205 errors 처럼 보인다. 여기 적어 두면 그 착각이 사라진다.
;   실행 인자로 `-e DJANGO_SETTINGS_MODULE=…` 을 줘도 그 값이 이긴다(환경변수 우선).
DJANGO_SETTINGS_MODULE = config.settings
