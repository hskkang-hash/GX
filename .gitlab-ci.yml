# 시크릿 스캔 (W0-1a / D-001)
#
# GitHub Actions 와 함께 선제 배치한다. 둘 다 두어도 무해하며 비용은 0이다.
# 어느 플랫폼으로 원격을 만들든(W0-6) 즉시 동작한다.

stages:
  - security
  - architecture

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: security
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "true"    # 히스토리 전체 스캔

# GitLab 내장 secret_detection 은 두 파일의 '값이 같은지'를 보지 못한다.
# D-003(서버 키 ≠ 클라이언트 키)은 별도 잡으로 검사한다.
key-divergence:
  stage: security
  image: python:3.11-alpine
  script:
    - python scripts/check_key_divergence.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# 계층 위반 정적 검사 (D-278 · WP-DA2 착수 조건 3)
# App(L4) 이 커널(L3) 의 비공개면을 직접 import 하면 실패한다 — IP 방어(계약 8조3항).
# K1 첫 커밋 전에 green 이어야 한다. 대상 0건이면 판정기 자체를 시험한다 (D-277).
layer-check:
  stage: architecture
  image: python:3.11-alpine
  script:
    - python scripts/verify_layers.py --self-test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# 마이그레이션 정합 검사 (D-282 — 착시 ⑤ 환경)
# 모델 선언 = 마이그레이션 그래프 = DB. 셋이 갈리면 --nomigrations 초록은 실물을 말하지 않는다.
#
# ★ dj-core(사내 private) 가 있어야 Django 가 뜬다. 없는 러너에서 스크립트는
#   **exit 2(판정 불가)** 를 내지 exit 0 을 내지 않는다 — 못 센 것을 통과로 세지 않는다.
#   그래서 이 잡은 GX_PRIVATE_REGISTRY_AVAILABLE 러너에서만 돈다.
migration-check:
  stage: architecture
  image: $GX_BACKEND_IMAGE
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: database_guardianx
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: admin
    DB_HOST: postgres
    DB_PORT: "5432"
  script:
    - python backend/manage.py migrate --noinput
    - python scripts/verify_migrations.py --list
  rules:
    - if: $GX_PRIVATE_REGISTRY_AVAILABLE == "true"
