# WO-GRDX-20261003-04 레인 B — QA 판 앞문(`guardianx-qa` · 127.0.0.1:8510 에만 게시 · docker-compose.qa.yml).
# 한 주소에서 화면(QA 번들 · VITE_QA_BUILD=true)과 뒷단(/api · /qa · /admin · /ws)을 함께 준다 — 8500 과 같은 모양.
# `/qa/enter` 만 화면 자리다(QaEntry). 나머지 `/qa/*` 는 뒷단(진입 · 인계표 · 키 표 · outbox).

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    root /usr/share/nginx/qa-spa;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-GX-Env "qa" always;

    set $qa_backend http://qa-backend:8000;

    location = /qa/enter { add_header Cache-Control "no-cache"; try_files /index.html =404; }

    location ~ ^/(api|qa|admin|static|media)(/|$) {
        proxy_pass $qa_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /ws/ {
        proxy_pass $qa_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
