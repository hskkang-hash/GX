<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <!-- Prevent Google Translate from modifying the DOM -->
    <meta name="google" content="notranslate" />
    <link
      rel="shortcut icon"
      href="./public/logoguax.svg"
      type="image/x-icon"
    />
    <title>GuardianX</title>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const faviconUrl = sessionStorage.getItem('logo') || './src/assets/images/Favicon.png';
        const companyName = sessionStorage.getItem('company_name') || 'GuardianX';

        (function () {
          const theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.className = theme;
        })();
      });
    </script>
    <!-- Kakao Maps SDK -->
    <script
      type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_API_KEY%&libraries=services,clusterer,drawing,geometry"
    ></script>
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
