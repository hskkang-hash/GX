<?xml version="1.0" encoding="UTF-8"?>
<!--
  로그인 배경 — **단색 (임시)**   [턴 AA · 2026-09-21 · 대표 결정 · 조율자 U0]

  왜 바꿨나
  ---------
  종전 배경(`backgroundLogin.png`)은 **드론과 지도 핀**이었다. 인수 자산의 잔상이고,
  세종이 고객 자리에서 본 첫 줄이 이것이다:

      재난안전과 담당자에게 **드론 그림은 남의 제품**이다.

  왜 안양천 CCTV 정지화면이 아닌가 — **실물이 없다**
  --------------------------------------------------
  대표가 「안양천 CCTV 정지화면」을 고르셨다. 그런데 **실카메라가 0/4 갈래**다
  [실측 · `docs/agent/evidence/U3-V/real_camera_snapshot.md` · 네 갈래 전부 TCP TimeoutError].
  지금 손에 있는 프레임은 **합성 표식이 박힌 시드 프레임**뿐인데,
  **이번 턴이 하는 일이 바로 고객 화면에서 그런 시험 장치를 걷어내는 것**이다.
  시드 프레임을 로그인 배경에 깔면 우리가 지우는 것을 정문에 다시 붙이는 셈이다.

  그래서 **지어내지 않고 단색으로 둔다**(세종이 제시한 둘째 대안).
  실카메라 1대가 오는 날(파 4 · 10-05 · 대표 ④) 그 정지화면으로 바꾼다.
  ⚠ 이 파일은 **임시**다. 바꿀 때 이 머리말째 지운다.

  색은 브랜드 `--ga-primary #1d9be2` 를 어둡게 깐 것이다 — 흰 로고와 입력창이
  그 위에서 읽힌다. 아무것도 주장하지 않는 배경이다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gx" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d3a56"/>
      <stop offset="0.55" stop-color="#11506f"/>
      <stop offset="1" stop-color="#0a2b40"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#gx)"/>
</svg>
