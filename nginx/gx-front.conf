# ═══════════════════════════════════════════════════════════════════════════
# OPS-13 — 배포 앞단 (gunicorn + nginx). **두 번째 방어선이 여기 선다** (D-361)
# ═══════════════════════════════════════════════════════════════════════════
#
# 이 파일은 `nginx.conf` 를 **대체하지 않는다.** 종전의 `nginx/nginx.conf` 는
# 스테이징 형상(`docker-compose.stg.yml` · frontend-stg/backend-stg)의 것이고,
# 이 파일은 **운영 앞단 형상**이다. 두 형상은 부르는 뒷단이 다르므로 한 파일로
# 접지 않는다 — 접으면 한쪽을 고칠 때마다 다른 쪽이 조용히 바뀐다.
#
#     docker run ... -v <repo>/nginx:/etc/nginx/gx:ro nginx:alpine \
#         nginx -c /etc/nginx/gx/gx-front.conf -g 'daemon off;'
#
# ★ 왜 앞단이 필요한가 (D-361)
#   **단일 방어선은 방어선이 아니다.** `common/access_gate.py` 는 미들웨어이고
#   미들웨어의 효력은 `settings.MIDDLEWARE` 의 **순서**다. 순서는 리팩터링 중에
#   바뀌고(2026-09-07 에 실제로 캐시 안쪽으로 들어갔다), 그때 남는 것이 앞단이다.
#
# ★ 관문 위치 블록은 **생성물이다** — `gx-gate.conf` 를 손으로 고치지 마라.
#   정본은 `common/access_gate.py` 의 목록이고, 생성기는 `common/front_line.py` 다.
#   경로 목록을 두 벌 적으면 어긋나고, 어긋나면 **앞단 쪽이 낡는다**(D-369).
#
# ★ `Server:` 헤더 — 이 앞단이 서면 `scripts/verify_perf_budget.py` 의 모드가
#   **저절로 합격선으로 갈린다**(`mode_for`). 사람이 기억해야 켜지는 규칙은 바쁜
#   날 깨진다(D-286). 그러므로 아래에서 `server_tokens` 를 꺼도 이름은 남긴다 —
#   이름을 지우면 판정기가 「못 읽음」으로 읽고, 그것도 합격선이다(안전한 쪽).

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx-front.pid;

events {
    worker_connections 2048;
}

http {
    # ★ 2026-09-17 (턴 T · P-161 · 차선 E=조율자) — **앞단 기동 순서.** 재부팅 실측(09-17 09:5x)에서
    #   앞단이 뒷단보다 2초 먼저 떠 `gx-gunicorn-e` 를 못 풀고 exit 255 로 죽었다(`unless-stopped`
    #   는 되살리지 않는다 · `docker run` 이라 compose `depends_on` 이 없다). 처방은 restart 가
    #   아니라 **늦은 해석**: Docker 내장 DNS(127.0.0.11)를 resolver 로 두고 upstream 의 이름을
    #   `resolve` 로 두면 ⓐ 이름이 없어도 앞단이 뜨고(502 로 기다린다) ⓑ 뒷단이 나타나면 reload
    #   없이 200 ⓒ 뒷단을 새 IP 로 다시 만들어도(재생성 창 ③) reload 없이 따라간다 —
    #   [실측 2026-09-17 17:18 · 격리 컨테이너 셋 · scratchpad/p161/iso.conf]. `resolve` 는 nginx
    #   1.27.3+ 오픈소스에서 산다(이 이미지는 1.31.5). `zone` 이 있어야 `resolve` 가 선다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    include       /etc/nginx/mime.types;
    default_type  application/json;   # 관문의 거절 본문이 JSON 이다

    # ★ **쿼리 문자열을 로그에 남기지 않는다** (P-166 · D-486 · 2026-09-18 · 턴 U)
    #   턴 T 에 웹푸시 구독 비밀 셋(`endpoint`·`p256dh`·`auth_secret`)이 주소 뒤 쿼리로 와서
    #   이 줄의 `$request` 를 타고 **접근 로그에 그대로 남았다**. 서버는 이제 본문으로만 받고
    #   쿼리에 비밀 이름이 오면 400 이다(`api_u3.py::_reject_secret_query`) — 그래도 **로그 쪽도**
    #   닫는다: 문 하나가 실수로 쿼리를 받게 되는 날, 그날의 로그가 비밀을 삼키면 안 되기 때문이다.
    #   `$request`(메서드+**쿼리 포함** 전체 URI+프로토콜) → `$request_method $uri $server_protocol`.
    #   `$uri` 는 정규화된 **경로만** 담는다 — `?` 뒤가 통째로 빠진다.
    #   ⚠ 잃는 것: 정상 요청의 질의 인자(`?since=…` 같은 것)도 안 보인다. 디버깅에서 그것이
    #     필요하면 앱 로그를 보라 — 로그가 비밀을 삼키는 위험과 바꾸지 않는다.
    log_format gx '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '$request_time "$upstream_addr" $upstream_response_time';
    # ★ **stdout 으로 낸다 — 파일이 아니다** (OPS-07 · 2026-09-05 · 턴 E)
    #
    #   종전에는 `/var/log/nginx/gx-front.access.log` 라는 **컨테이너 안의 파일**에
    #   적었다. 그 자리에는 상한이 걸리지 않는다:
    #     · 도커의 `--log-opt max-size` 는 **stdout/stderr 만** 자른다 — 파일은 안 본다
    #     · `nginx:alpine` 에는 **logrotate 가 없다**
    #   [실측 2026-09-05] 그 파일은 부하 중 **시간당 2,124,278바이트**(≈ 51 MB/일)로
    #   자라고 있었고 총 6,612,082바이트였다. 즉 상한이 걸린 줄 알았던 컨테이너
    #   (`gx-nginx-e` 는 `--log-opt max-size=10m max-file=5` 로 떴다) 안에서
    #   **상한 밖의 수집기가 돌고 있었다** — 이 저장소에서 가장 시끄러운 수집기다.
    #
    #   stdout 으로 보내면 `json-file` 회전 안으로 들어와 컨테이너당 50MB 상한을 받는다.
    #   51 MB/일이므로 그 상한은 **약 하루 치**다. 짧다 — 그런데 그것이 정직한 상태다:
    #   `docker-compose.yml` 머리말 ㉢이 못박은 대로 **감사에 답하는 정본은 DB 감사
    #   로그이고 stdout 은 단기 버퍼**다. 무한히 자라는 파일은 「오래 보관한다」가
    #   아니라 **「디스크가 찰 때까지 보관한다」**이고, 그 둘은 다른 약속이다.
    #
    #   ⚠ 되돌리는 법: 이 줄을 `access_log /var/log/nginx/gx-front.access.log gx;` 로
    #     되돌리고 `docker exec gx-nginx-e nginx -s reload`. 되돌린다면 사유는
    #     「접근로그를 파일로 파싱하는 도구가 있다」일 것이고, 그때는 그 도구 이름을
    #     여기 적어라 — 적지 않으면 다음 사람이 같은 무한 적재를 다시 만든다.
    #
    #   ⚠ **적용은 reload 때다.** 이 파일은 `gx-nginx-e` 에 읽기전용으로 물려 있고
    #     (`nginx/ -> /etc/nginx/gx:ro`), nginx 는 뜰 때와 reload 때만 다시 읽는다.
    #     고친 것과 도는 것은 다른 사실이다(D-301) — 확인 명령은 RUNBOOK STEP 2D.
    access_log /dev/stdout gx;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # 판이 바뀌면 헤더도 바뀐다 — 버전은 숨기고 이름(`nginx`)은 남긴다.
    server_tokens off;

    # 뒷단은 **gunicorn 이다. runserver 가 아니다.** 이 한 줄이 「합격선에서 쟀다」를
    # 뜻한다 — 개발 서버는 한 프로세스라 꼬리가 스케줄러를 탄다(PERF-04).
    # ⚠ **시간이 어긋나면 502 가 난다** [실측 2026-09-05 · 턴 C].
    #   nginx 는 놀고 있는 뒷단 연결을 `keepalive_timeout` 동안 쥐고 있다가 다시 쓴다.
    #   gunicorn 의 `--keep-alive` 기본값은 **2초**다 — 뒷단이 먼저 끊은 연결에
    #   앞단이 요청을 실어 보내면 그 요청은 **502** 로 돌아온다. 3,600 요청 중
    #   6건이 그렇게 죽었고, 예산 게이트가 그것을 빨강으로 잡았다.
    #   ★ 그러므로 **뒷단의 값이 앞단의 값보다 커야 한다**: gunicorn `--keep-alive 75`
    #     > 여기 `keepalive_timeout 60`. 이 부등호가 이 절의 실제 내용이다.
    # ★ 같은 뒷단을 **한 번만 적는다.** 종전에는 두 줄이었고, 그것이 P-101 의 결함이다.
    #
    # ⛔ **두 줄로 적던 이유는 틀렸다** [실측 2026-09-05 · 턴 D].
    #   적혀 있던 말: 「peer 가 하나뿐이면 재시도가 일어나지 않는다」. 재 보니 **아니다** —
    #   peer 를 하나로 줄이고 같은 부하(3,722 요청)를 걸었더니 재시도가 **28건** 일어났고
    #   그중 3건은 **3회째** 시도였다(`addr, addr, addr`).
    #
    # ★ 그리고 **두 줄로 적으면 시도 횟수가 3이 아니라 2가 된다.** `proxy_next_upstream_tries 3`
    #   의 세 번째 시도는 **쓸 peer 가 남아 있지 않아** 아무 데도 못 간다. 이번 턴에
    #   손님에게 새어 나간 502 **10건 전수**의 `$upstream_addr` 가 같은 모양이었다:
    #
    #       "172.18.0.6:8000, 172.18.0.6:8000, gx_app"   0.185, 0.194, 0.000
    #                                          ^^^^^^                  ^^^^^
    #                              peer 가 아니라 upstream 이름       0초 = 안 갔다
    #
    #   즉 두 peer 를 다 쓰고 세 번째 슬롯은 **낭비된다.**
    #
    # ⚠ **턴 D 는 한 줄로 바꾸지 않았다.** 502 건수로는 못 갈랐기 때문이다:
    #       run0 (peer 2) 8건 · run1 (peer 1) 1건 · run2 (**peer 2 · 같은 설정**) 1건
    #   설정을 안 바꿨는데 8과 1이 나왔다 — **건수는 기계 상태가 좌우한다.** 한 벌 재고
    #   바꾸면 턴 C 가 겪은 「고치려다 나빠졌다」를 되풀이한다. 바꾸려거든 **A/B/A 로
    #   최소 세 벌** 재라. 근거: `docs/agent/evidence/OPS-13a/README.md` §3 ①·③.
    #
    # ★ **[P-101 · 2026-09-07 · 턴 K · 차선 E] 그 A/B/A 를 쟀고, 한 줄로 바꿨다.**
    #   같은 부하(3,600 요청 · `--rounds 30`) **다섯 벌** · 재활용 창을 지나게 두고 잰 수:
    #
    #       A  peer 2 (종전)          502 **3건**   재시도 37 · 되살림 34
    #       B  peer 1 (고침)          502 **0건**   재시도 30 · 되살림 30
    #       A′ peer 2 (되돌림 · 대조)  502 **8건**   재시도 27 · 되살림 19
    #       B′ peer 1 (다시 고침)      502 **2건**   재시도 34 · 되살림 34
    #       B″ peer 1 (설정 그대로)    502 **2건**   재시도 28 · 되살림 28
    #
    #       peer 2  11 / 7,444 = 0.148%   ·   peer 1  4 / 11,166 = 0.036%
    #
    #   ★ **건수보다 모양이다.** peer 2 에서 되살아난 200 은 **언제나 정확히 2회 시도**였고
    #     (53건 전수 · 3회는 하나도 없다) 502 는 전수가 `addr, addr, gx_app 0.000` 이었다.
    #     peer 1 에서는 3회 시도가 7건, 4회가 1건 나왔고 `gx_app 0.000` 은 **0건**이다.
    #     즉 `tries 3` 이 이제 실제로 쓰인다.
    #
    #   ⛔ **그래도 502 는 0 이 아니다.** 남은 4건은 `$upstream_addr` 가 **하나**다 —
    #     앞단이 재시도를 아예 안 했다. 사유는 같은 부하에서 수백 번 나고 대부분
    #     되살아나는 `recv() failed (104: Connection reset by peer)` 다. **왜 어떤 것만
    #     재시도를 안 타는지 못 쟀다 — 이 결함이 아니라 다른 결함이고, 회색이다.**
    #     여기서 `non_idempotent` 를 켜지 마라(OPS-13a §3 ④ · 수를 들고 금지했다).
    #
    #   (수는 `docs/agent/evidence/OPS-13b/README.md` 가 정본이다. 여기 베낀 수가
    #    그것과 어긋나면 **저 파일이 맞다** — 여기는 요약이다.)
    #
    #   ⚠ 남기는 사실 하나: `proxy_next_upstream_tries 3` 은 **빠져 있지 않았다.**
    #     `nginx/gx-proxy.inc` 에 선언돼 있었고 도는 형상에도 있었다
    #     (`nginx -T | grep -c proxy_next_upstream_tries`). P-92 의 메모가 「선언이
    #     없다」로 적은 것은 틀렸다 — 결함은 **peer 두 줄 하나뿐**이었다.
    upstream gx_app {
        # ★ 한 줄이다. 두 줄이면 세 번째 시도가 `gx_app`(upstream **이름**)으로 새고
        #   `0.000` 초에 끝난다 — 즉 **안 간다.** 한 줄이면 세 시도가 다 peer 로 간다.
        zone gx_app 64k;                              # P-161 · `resolve` 의 전제
        server gx-gunicorn-e:8000 max_fails=0 resolve;  # P-161 · 이름을 기동 때가 아니라 매 valid 마다 푼다
        keepalive 32;
        keepalive_timeout 60s;
        # ⛔ **`keepalive_requests 50` 을 걸어 봤고 되돌렸다** [실측 2026-09-05 · 턴 C].
        #   생각: 「앞단이 먼저 끊으면 낡은 연결에 걸릴 일이 없다」. 재 보니 **반대였다**
        #   — 502 가 3건 → **5건**으로 늘고 p95 도 174ms → 295ms 로 나빠졌다.
        #   까닭: 50요청마다 뒷단 연결을 버리고 새로 여는 것 자체가 **연결 휘젓기**이고,
        #   휘저을수록 죽어 가는 워커와 마주칠 기회가 늘어난다. 낡은 연결을 피하려다
        #   **새 연결을 더 많이 만들었다.**
        #   ★ 남긴다: 지우면 다음 사람이 같은 생각을 하고 같은 값을 다시 건다.
    }

    server {
        listen 8500;
        server_name _;

        client_max_body_size 64m;

        # 살아 있는가 — 뒷단을 타지 않는 자리 하나. 감시가 여기를 두드린다(OPS-06).
        location = /_front/health {
            access_log off;
            return 200 '{"front":"nginx","upstream":"gunicorn"}';
        }

        # ── SPA — **같은 출처**에서 화면과 API 를 함께 준다 (P-286 · 턴 AH) ────
        #
        #   왜 여기가 생겼나 [실측 2026-09-23~24 · 대표가 직접 걸었다]
        #   ----------------------------------------------------------------
        #   대표가 `localhost:3002` 로 제품을 보려다 **연결 거부**를 봤다. gx-shell 은
        #   호스트로 포트를 하나도 안 내기 때문이고, 그것은 고장이 아니라 **그 주소가
        #   원래 컨테이너 안의 것**이었기 때문이다. 조율자가 급히 중계 컨테이너
        #   (`gx-portfwd`)를 세워 화면은 떴지만, 그것은 **다리이지 길이 아니다** —
        #   고객은 다리를 놓을 수 없다.
        #
        #   ★★ 뿌리는 번들이었다: 빌드 디렉터리의 `.env` 가
        #         VITE_API_URL=http://localhost:8000
        #      를 박아 두어, 번들이 **어디서 열리든** 8000 을 불렀다. 그래서 화면과
        #      API 가 늘 다른 출처였다. `.env` 를 비워 다시 지으니
        #      `http://localhost:8000` 이 **16건 → 0건**이 됐다(A/B 실측).
        #      (`rj-core::initialServices` 는 그 값을 axios `baseURL` 에 그대로 넣는다 —
        #       비면 axios 가 **현재 출처**로 붙인다. 그것이 이 자리의 전제다.)
        #
        #   ★ `^~` 인 까닭: 아래 생성물의 `location /` 는 **접두 일치 중 가장 약하다.**
        #     `^~` 는 그보다 먼저 잡히므로 생성물을 **한 줄도 안 고치고** 화면을 줄 수
        #     있다. 생성물은 「손으로 고치지 마라」이고, 그 규약을 지키면서 끼어드는
        #     유일한 길이 이것이다.
        #
        #   ⚠ **모든 화면 경로를 덮지 않았다.** 여기 적은 것은 지금 잰 길
        #     (`/login` · `/dsm/*` · 자원)뿐이다. `/` 로 오는 그 밖의 앞단 경로는
        #     여전히 뒷단으로 가서 404 가 난다 — **그 404 는 「아직 안 이은 것」이지
        #     「없는 화면」이 아니다.** 다음 사람이 경로를 더할 때 이 줄을 같이 늘린다.
        #     (덮어쓰기 `try_files ... /index.html` 를 `location /` 에 걸면 API 404 까지
        #      화면으로 바뀌어, **고장이 화면으로 위장된다.** 그래서 안 걸었다.)
        root /usr/share/nginx/gx-spa;

        #: ★★ [실측 2026-09-24] `try_files $uri /index.html` 의 마지막 자리는 **파일이
        #:   아니라 URI** 다 — nginx 가 `/index.html` 로 **내부 재요청**을 돌리고, 그
        #:   재요청은 다시 `location` 고르기를 거친다. 그 자리를 안 만들어 두면
        #:   생성물의 `location /` 가 잡아 **뒷단으로 가고 장고가 404 를 낸다.**
        #:   [첫 판이 정확히 그랬다: `/login` → 404 · `/` 본문이 「Page not found at
        #:    /index.html」. 마운트는 보이는데 답이 뒷단에서 왔다 — **자리가 없었던 것**이다.]
        location = /index.html {
            try_files $uri =404;
        }
        location = / {
            try_files /index.html =404;
        }
        location ^~ /assets/  { try_files $uri =404; access_log off; }
        location ^~ /fonts/   { try_files $uri =404; access_log off; }
        location ^~ /public/  { try_files $uri =404; access_log off; }
        location = /field-push-sw.js { try_files $uri =404; }
        location = /logoguax.svg     { try_files $uri =404; access_log off; }
        #: 앞단 라우터가 쓰는 길 — 새로고침해도 index.html 이 떠야 한다(SPA 규약).
        location ^~ /login    { try_files $uri /index.html; }
        location ^~ /dsm/     { try_files $uri /index.html; }
        #: ★ [턴 AH · P-290] **비밀번호를 잊은 사람은 로그인할 수 없다** — 그래서 이
        #:   두 길만은 로그인 뒤가 아니라 **로그인 앞**에 있어야 한다. 메일에 실려
        #:   나가는 주소가 `…/reset-password?token=…` 이라(dj-core
        #:   `core/api/v1/auth.py::forgot_password`), 이 자리가 없으면 고객이 받은
        #:   링크를 눌렀을 때 **장고 404** 가 뜬다 — 「메일은 갔는데 못 고친다」가
        #:   가장 나쁜 모양이다. 링크는 보냈으니 우리는 초록으로 읽고, 고객만 막힌다.
        #:   [실측 2026-09-24] 번들이 선언한 로그인 앞 경로는 넷 —
        #:   `/login` · `/forgot-password` · `/reset-password` · `/register`.
        #: ⚠ `/register` 는 **일부러 안 이었다.** 가입을 밖에서 여는 것은 다른 판단이고
        #:   (`AdminConfig.system_register.is_allow_register`), 길을 먼저 내 두면 그
        #:   판단이 내려지기 전에 문이 열린 상태가 된다.
        location ^~ /forgot-password { try_files $uri /index.html; }
        location ^~ /reset-password  { try_files $uri /index.html; }

        # ── 관문 (생성물) ────────────────────────────────────────────────
        include /etc/nginx/gx/generated/gx-gate.conf;
    }
}
